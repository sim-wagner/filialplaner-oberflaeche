<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>Termine melden</title>
<style>
:root{
  --bg:#F4F6FA; --surface:#fff; --line:#D9DFEA; --ink:#14213D; --muted:#5B6782;
  --blau:#1D4ED8; --blau-dunkel:#1E3A8A; --blau-hell:#E8EEFC; --bad:#B32320; --bad-soft:#FBEAEA;
  --ok:#1F7A45; --ok-soft:#E5F4EA;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1422; --surface:#161E30; --line:#2A3550; --ink:#E6EBF5; --muted:#9AA6C0;
  --blau:#7EA2F7; --blau-dunkel:#B9CBFA; --blau-hell:#1E2A48; --bad:#F09090; --bad-soft:#3A1E22;
  --ok:#7FC395; --ok-soft:#14301F; } }
:root[data-theme="dark"]{
  --bg:#0E1422; --surface:#161E30; --line:#2A3550; --ink:#E6EBF5; --muted:#9AA6C0;
  --blau:#7EA2F7; --blau-dunkel:#B9CBFA; --blau-hell:#1E2A48; --bad:#F09090; --bad-soft:#3A1E22;
  --ok:#7FC395; --ok-soft:#14301F; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:1.4rem;margin:4px 0 2px}
.lede{color:var(--muted);margin:0 0 16px;font-size:.95rem}
.karte{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:.85rem;font-weight:600;color:var(--muted);margin-bottom:10px}
input,select{display:block;width:100%;margin-top:4px;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);
  border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:46px}
input:focus,select:focus{outline:2px solid var(--blau);outline-offset:1px}
.zwei{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.termin{position:relative}
.termin .weg{position:absolute;top:8px;right:8px;border:0;background:none;color:var(--muted);font-size:1.4rem;line-height:1;padding:6px 10px;cursor:pointer}
.termin h2{font-size:.95rem;margin:0 0 10px}
.schalter{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--ink);margin:2px 0 10px}
.schalter input{width:20px;height:20px;min-height:0;margin:0}
.btn{display:block;width:100%;font:inherit;font-weight:700;border-radius:12px;padding:13px;border:1.5px solid var(--blau);
  background:var(--blau);color:#fff;cursor:pointer;min-height:48px}
.btn.zweit{background:transparent;color:var(--blau)}
.btn + .btn{margin-top:10px}
.fehler{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:.9rem}
.fehler:empty{display:none}
.ok{background:var(--ok-soft);color:var(--ok);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:.9rem}
pre{white-space:pre-wrap;background:var(--blau-hell);border-radius:10px;padding:12px;font-size:.85rem;margin:10px 0}
.hint{color:var(--muted);font-size:.82rem;font-weight:400}
.feld-fehler{border-color:var(--bad)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Termine melden</h1>
  <p class="lede">Trag ein, wann du nicht arbeiten kannst. Am Ende schickst du die Liste
  an deine Filialleitung — per WhatsApp, Mail oder wie ihr es gewohnt seid.
  Diese Seite speichert nichts im Internet.</p>

  <div class="karte">
    <label>Dein Name <span class="hint">(Vor- und Nachname)</span>
      <input id="name" autocomplete="name" placeholder="z. B. Petra Naumann"></label>
    <label style="margin-bottom:0">Filiale <span class="hint">(Nummer, z. B. 540)</span>
      <input id="filiale" inputmode="numeric" pattern="[0-9]*" placeholder="z. B. 540"></label>
  </div>

  <div id="termine"></div>
  <button class="btn zweit" id="dazu">+ Termin hinzufügen</button>

  <p class="fehler" id="fehler"></p>
  <div id="fertigBox"></div>
  <button class="btn" id="senden" style="margin-top:16px">Fertig — an die Filialleitung schicken</button>
  <p class="hint" style="margin-top:14px">Krank? Bitte wie gewohnt anrufen — das gehört nicht hierher.</p>
</div>

<script>
"use strict";
const ARTEN = [
  ["nicht",  "kann nicht arbeiten"],
  ["urlaub", "Urlaub (genehmigt)"],
  ["schule", "Berufsschule"],
  ["nur",    "kann nur von … bis …"],
  ["ohne",   "kann von … bis … nicht"]
];
const WT = ["So","Mo","Di","Mi","Do","Fr","Sa"];
const termine = [];
const $ = s => document.querySelector(s);
const merke = (k, v) => { try { localStorage.setItem("termine:" + k, v); } catch(e){} };
const hole = k => { try { return localStorage.getItem("termine:" + k) || ""; } catch(e){ return ""; } };

$("#name").value = hole("name");
$("#filiale").value = hole("filiale");
$("#name").oninput = e => merke("name", e.target.value.trim());
$("#filiale").oninput = e => merke("filiale", e.target.value.replace(/\D/g, ""));

const morgen = () => { const d = new Date(); d.setDate(d.getDate() + 1); return iso(d); };
const iso = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
const ausIso = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ""); return m ? new Date(+m[1], +m[2]-1, +m[3], 12) : null; };
const de = d => WT[d.getDay()] + " " + String(d.getDate()).padStart(2,"0") + "." + String(d.getMonth()+1).padStart(2,"0") + "." + d.getFullYear();

function neuerTermin(){ termine.push({datum:"", mehrere:false, bis:"", art:"nicht", von:"", bisZeit:""}); zeichnen(); }

function zeichnen(){
  const box = $("#termine");
  box.innerHTML = "";
  termine.forEach((t, n) => {
    const k = document.createElement("div");
    k.className = "karte termin";
    const zeit = t.art === "nur" || t.art === "ohne";
    k.innerHTML = `<h2>Termin ${n + 1}</h2>
      <button class="weg" aria-label="Termin ${n + 1} entfernen">×</button>
      <label>${t.mehrere ? "Erster Tag" : "Tag"}<input type="date" data-f="datum" min="${iso(new Date())}" value="${t.datum}"></label>
      <label class="schalter"><input type="checkbox" data-f="mehrere"${t.mehrere ? " checked" : ""}> mehrere Tage am Stück</label>
      ${t.mehrere ? `<label>Letzter Tag<input type="date" data-f="bis" min="${t.datum || iso(new Date())}" value="${t.bis}"></label>` : ""}
      <label>Was ist?<select data-f="art">${ARTEN.map(([v,l]) => `<option value="${v}"${t.art === v ? " selected" : ""}>${l}</option>`).join("")}</select></label>
      ${zeit ? `<div class="zwei"><label>von<input type="time" data-f="von" value="${t.von}"></label>
                <label>bis<input type="time" data-f="bisZeit" value="${t.bisZeit}"></label></div>` : ""}`;
    k.querySelector(".weg").onclick = () => { termine.splice(n, 1); if (!termine.length) neuerTermin(); else zeichnen(); };
    k.querySelectorAll("[data-f]").forEach(f => {
      f.onchange = () => {
        t[f.dataset.f] = f.type === "checkbox" ? f.checked : f.value;
        // Felder, die erscheinen oder verschwinden, brauchen ein neues Bild
        if (["mehrere","art"].includes(f.dataset.f)) zeichnen();
        $("#fehler").textContent = ""; $("#fertigBox").innerHTML = "";
      };
    });
    box.appendChild(k);
  });
}

// Alles prüfen, bevor etwas verschickt wird — lieber hier ein Hinweis als später ein falscher Plan
function pruefen(){
  const name = $("#name").value.trim(), fil = $("#filiale").value.replace(/\D/g, "");
  if (name.split(/\s+/).length < 2) return {fehler:"Bitte deinen Vor- und Nachnamen eintragen."};
  if (!fil) return {fehler:"Bitte die Filialnummer eintragen."};
  const zeilen = [];
  const heute = new Date(); heute.setHours(0,0,0,0);
  for (let n = 0; n < termine.length; n++){
    const t = termine[n], wo = `Termin ${n + 1}: `;
    const d = ausIso(t.datum);
    if (!d) return {fehler: wo + "Bitte den Tag auswählen."};
    if (d < heute) return {fehler: wo + "Der Tag liegt in der Vergangenheit."};
    let b = null;
    if (t.mehrere){
      b = ausIso(t.bis);
      if (!b) return {fehler: wo + "Bitte den letzten Tag auswählen."};
      if (b < d) return {fehler: wo + "Der letzte Tag liegt vor dem ersten."};
      if ((b - d) / 864e5 > 62) return {fehler: wo + "Mehr als zwei Monate am Stück — bitte aufteilen."};
    } else if (d.getDay() === 0) return {fehler: wo + "Sonntags ist die Filiale geschlossen."};
    let was = (ARTEN.find(a => a[0] === t.art) || [])[0];
    if (t.art === "nur" || t.art === "ohne"){
      if (!t.von || !t.bisZeit) return {fehler: wo + "Bitte beide Uhrzeiten eintragen."};
      if (t.bisZeit <= t.von) return {fehler: wo + "Die zweite Uhrzeit muss nach der ersten liegen."};
      was = (t.art === "nur" ? "nur " : "nicht ") + t.von + "–" + t.bisZeit;
    } else was = {nicht:"kann nicht", urlaub:"Urlaub", schule:"Berufsschule"}[t.art];
    zeilen.push({d, text: de(d) + (b && iso(b) !== iso(d) ? " bis " + de(b) : "") + ": " + was});
  }
  if (!zeilen.length) return {fehler:"Bitte mindestens einen Termin eintragen."};
  zeilen.sort((x, y) => x.d - y.d);
  return {text: ["Filialplaner – Termine", "Name: " + name, "Filiale: " + fil, ...zeilen.map(z => z.text)].join("\n")};
}

$("#dazu").onclick = neuerTermin;
$("#senden").onclick = async () => {
  const r = pruefen();
  $("#fehler").textContent = r.fehler || "";
  const box = $("#fertigBox");
  box.innerHTML = "";
  if (r.fehler) return;
  // Teilen-Menü des Handys; geht das nicht, in die Zwischenablage
  if (navigator.share){
    try { await navigator.share({text: r.text}); box.innerHTML = `<p class="ok">Verschickt — danke!</p>`; return; }
    catch(e){ if (e && e.name === "AbortError") return; }
  }
  const pre = document.createElement("pre"); pre.textContent = r.text;
  let kopiert = false;
  try { await navigator.clipboard.writeText(r.text); kopiert = true; } catch(e){}
  box.innerHTML = `<p class="ok">${kopiert ? "Kopiert. Jetzt in WhatsApp oder in eine Mail an deine Filialleitung einfügen."
    : "Bitte diesen Text markieren, kopieren und an deine Filialleitung schicken:"}</p>`;
  box.appendChild(pre);
};

neuerTermin();
</script>
</body>
</html>
