<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>Meine Zeiten</title>
<style>
:root{
  --bg:#F3F5F9; --surface:#fff; --line:#D8DEE9; --ink:#14213D; --muted:#5B6782;
  --blau:#1D4ED8; --blau-hell:#E8EEFC;
  --gruen:#1F7A45; --gruen-hell:#E3F3E8; --rot:#B32320; --rot-hell:#FBEAEA;
  --gelb:#9A5B00; --gelb-hell:#FFF3DC; --lila:#6D28D9; --lila-hell:#F0E9FD;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1422; --surface:#161E30; --line:#2A3550; --ink:#E6EBF5; --muted:#9AA6C0;
  --blau:#8AAEFA; --blau-hell:#1E2A48; --gruen:#7FC395; --gruen-hell:#13301F;
  --rot:#F09090; --rot-hell:#3A1E22; --gelb:#E9B45E; --gelb-hell:#33270F; --lila:#B79BF5; --lila-hell:#2A1F45; } }
:root[data-theme="dark"]{
  --bg:#0E1422; --surface:#161E30; --line:#2A3550; --ink:#E6EBF5; --muted:#9AA6C0;
  --blau:#8AAEFA; --blau-hell:#1E2A48; --gruen:#7FC395; --gruen-hell:#13301F;
  --rot:#F09090; --rot-hell:#3A1E22; --gelb:#E9B45E; --gelb-hell:#33270F; --lila:#B79BF5; --lila-hell:#2A1F45; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:1.45rem;margin:6px 0 4px}
.lede{color:var(--muted);margin:0 0 16px}
.karte{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
label.f{display:block;font-size:.88rem;font-weight:600;color:var(--muted);margin-bottom:12px}
input[type=text],input[type=time],input:not([type]){display:block;width:100%;margin-top:4px;font:inherit;font-size:17px;color:var(--ink);
  background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:48px}
input:focus,button:focus-visible{outline:2px solid var(--blau);outline-offset:2px}
.btn{display:block;width:100%;font:inherit;font-weight:700;border-radius:12px;padding:14px;border:1.5px solid var(--blau);
  background:var(--blau);color:#fff;cursor:pointer;min-height:52px;font-size:1.02rem}
.btn:disabled{opacity:.55;cursor:default}
.btn.zweit{background:transparent;color:var(--blau)}
.link{background:none;border:0;color:var(--blau);font:inherit;text-decoration:underline;cursor:pointer;padding:6px 0}
.hint{color:var(--muted);font-size:.84rem;font-weight:400}
.meldung{border-radius:12px;padding:12px 14px;margin:0 0 12px;font-size:.95rem}
.meldung b{display:block;margin-bottom:2px}
.m-info{background:var(--blau-hell);color:var(--ink)}
.m-ok{background:var(--gruen-hell);color:var(--gruen)}
.m-warn{background:var(--gelb-hell);color:var(--gelb)}
.m-bad{background:var(--rot-hell);color:var(--rot)}
.m-ok b,.m-warn b,.m-bad b{color:inherit}
.kopf .kw{font-size:.82rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kopf .zeitraum{font-size:1.25rem;font-weight:800;margin-top:2px}
.kopf .wer{color:var(--muted);font-size:.9rem;margin-top:4px}
.frist{display:flex;gap:10px;align-items:flex-start}
.frist .uhr{font-size:1.6rem;line-height:1}
.tag h2{font-size:1rem;margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline}
.tag h2 span{font-weight:500;color:var(--muted);font-size:.88rem}
.wahl{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.wahl button{font:inherit;font-size:.95rem;font-weight:600;min-height:52px;border-radius:12px;border:2px solid var(--line);
  background:var(--surface);color:var(--ink);cursor:pointer;padding:8px 6px;line-height:1.2}
.wahl button[aria-pressed="true"].frei{background:var(--gruen-hell);border-color:var(--gruen);color:var(--gruen)}
.wahl button[aria-pressed="true"].ohne{background:var(--blau-hell);border-color:var(--blau);color:var(--blau)}
.wahl button[aria-pressed="true"].nicht{background:var(--rot-hell);border-color:var(--rot);color:var(--rot)}
.wahl button[aria-pressed="true"]::before{content:"✓ "}
.zeiten{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.zeiten label.f{margin:0}
.geschlossen{color:var(--muted);font-weight:600}
.fehlerfeld{border-color:var(--rot)!important}
.feldfehler{color:var(--rot);font-size:.88rem;margin-top:8px}
.laden{opacity:.6;pointer-events:none}
#senden{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 6px 18px rgba(20,33,61,.18)}
.abschnitt{font-size:1.1rem;margin:18px 0 10px}
.meinplan .mp-kopf{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.mp-reiter{display:flex;gap:6px}
.mp-reiter button{font:inherit;font-size:.85rem;font-weight:700;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:999px;padding:5px 12px;cursor:pointer}
.mp-reiter button[aria-pressed="true"]{background:var(--blau);border-color:var(--blau);color:#fff}
.mp-zeile{display:flex;gap:12px;padding:8px 6px;border-top:1px solid var(--line);align-items:baseline}
.mp-zeile.mp-heute{background:var(--blau-hell);border-radius:8px}
.mp-tag{width:78px;flex:none;font-weight:700;font-size:.92rem}
.mp-zeit{font-weight:700;font-variant-numeric:tabular-nums}
.mp-pause{color:var(--muted);font-size:.84rem;margin-left:10px}
.mp-frei{color:var(--muted)}
.fuss{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:18px}
</style>
</head>
<body>
<div class="wrap" id="app" aria-live="polite"></div>

<script>
"use strict";
// Supabase-Projekt der Filialplaner-Abgabe. Der Schlüssel ist der öffentliche „anon“-Schlüssel —
// er erlaubt nur die Funktionen, die selbst prüfen, wer fragt.
const SERVER = "https://nduzeascvtjkdknhyzwe.supabase.co";
const SCHLUESSEL = "sb_publishable_ZSvBat1AEEvtUbpykTCrjw_FSPRl6H1";

const TAGE = [["mo","Montag"],["di","Dienstag"],["mi","Mittwoch"],["do","Donnerstag"],["fr","Freitag"],["sa","Samstag"]];
// Mitarbeiter melden nur, wann sie NICHT können. Krankheit und Urlaub trägt die
// Filialleitung ein (seit 13.11.2026).
const ARTEN = [["frei","Kann arbeiten"],["ohne","Termin"],["nicht","Kann nicht"]];
// Feiertage des Bundeslands der Filiale, für jedes Jahr berechnet (wie in der App)
let landDerFiliale = "BW";
function ostersonntag(j){
  const a = j % 19, b = Math.floor(j / 100), c = j % 100, d = Math.floor(b / 4), e = b % 4;
  const f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
  const h = (19*a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4;
  const l = (32 + 2*e + 2*i - h - k) % 7, m = Math.floor((a + 11*h + 22*l) / 451);
  return new Date(j, Math.floor((h + l - 7*m + 114) / 31) - 1, ((h + l - 7*m + 114) % 31) + 1, 12);
}
function feiertage(j, land){
  const o = ostersonntag(j), n = x => { const d = new Date(o); d.setDate(o.getDate() + x); return mt(d); };
  const mt = d => String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  const in_ = (...l) => l.includes(land);
  const s = new Set(["01-01", n(-2), n(1), "05-01", n(39), n(50), "10-03", "12-25", "12-26"]);
  if (in_("BW","BY","ST")) s.add("01-06");
  if (in_("BE") || (in_("MV") && j >= 2023)) s.add("03-08");
  if (in_("BW","BY","HE","NW","RP","SL")) s.add(n(60));
  if (in_("SL","BY")) s.add("08-15");
  if (in_("TH") && j >= 2019) s.add("09-20");
  if (in_("BB","MV","SN","ST","TH") || (in_("HB","HH","NI","SH") && j >= 2018)) s.add("10-31");
  if (in_("BW","BY","NW","RP","SL")) s.add("11-01");
  if (in_("SN")){ const d = new Date(j, 10, 22, 12); while (d.getDay() !== 3) d.setDate(d.getDate() - 1); s.add(mt(d)); }
  return s;
}
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const lies = k => { try { return JSON.parse(localStorage.getItem("zeiten:" + k) || "null"); } catch(e){ return null; } };
const merke = (k, v) => { try { v === null ? localStorage.removeItem("zeiten:" + k) : localStorage.setItem("zeiten:" + k, JSON.stringify(v)); } catch(e){} };

let zugang = lies("zugang");          // {nr, code, name}
let woche = null;                     // Antwort des Servers: woche, montag, frist, abgabe, abgegeben
let entwurf = null;                   // {mo:{art,von,bis}, …}
let abstand = 0;                      // Serverzeit minus Gerätezeit — falsch gestellte Handys zählen nicht
let meinPlan = null;                  // eigene Schichten der laufenden und nächsten Woche, falls freigegeben
let planReiter = 0;
let uhr = null;

async function rufe(fn, daten){
  let r;
  try {
    r = await fetch(SERVER + "/rest/v1/rpc/" + fn, {method:"POST",
      headers:{"Content-Type":"application/json", apikey:SCHLUESSEL},
      body: JSON.stringify(daten)});
  } catch(e){ throw new Error("Keine Verbindung zum Internet. Deine Angaben bleiben auf diesem Handy gespeichert — bitte gleich noch einmal versuchen."); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.message || "Der Server hat nicht geantwortet. Bitte gleich noch einmal versuchen.");
  if (j && j.fehler) throw new Error(j.fehler);
  return j;
}

const tagDatum = (montag, i) => { const d = new Date(montag + "T12:00:00"); d.setDate(d.getDate() + i); return d; };
const kurz = d => d.toLocaleDateString("de-DE", {day:"2-digit", month:"2-digit"});
const lang = d => d.toLocaleDateString("de-DE", {day:"2-digit", month:"2-digit", year:"numeric"});
const istFeiertag = d => feiertage(d.getFullYear(), landDerFiliale).has(
  String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"));
const jetzt = () => new Date(Date.now() + abstand);
const kwNr = sl => String(sl).slice(-2).replace(/^0/, "");

/* ---------- Anmelden ---------- */
function anmeldung(fehler){
  clearInterval(uhr);
  $("#app").innerHTML = `
    <h1>Meine Zeiten</h1>
    <p class="lede">Hier trägst du für den nächsten Arbeitsplan ein, wann du <b>nicht</b> arbeiten
    kannst — einen Termin oder einen ganzen Tag. Alles andere heißt: du kannst arbeiten.
    Melde dich einmal an — dein Handy merkt sich das.</p>
    ${fehler ? `<div class="meldung m-bad">${esc(fehler)}</div>` : ""}
    <form class="karte" id="form" novalidate>
      <label class="f">Filiale <span class="hint">(Nummer, z. B. 540)</span>
        <input id="nr" inputmode="numeric" autocomplete="off" value="${esc(zugang && zugang.nr || "")}"></label>
      <label class="f">Filial-Code <span class="hint">(bekommst du von deiner Filialleitung)</span>
        <input id="code" inputmode="numeric" autocomplete="off" value="${esc(zugang && zugang.code || "")}"></label>
      <label class="f">Dein Name <span class="hint">(Vor- und Nachname, wie im Dienstplan)</span>
        <input id="name" autocomplete="name" value="${esc(zugang && zugang.name || "")}"></label>
      <button class="btn" type="submit">Anmelden</button>
    </form>`;
  $("#form").onsubmit = async e => {
    e.preventDefault();
    const z = {nr: $("#nr").value.replace(/\D/g, ""), code: $("#code").value.trim(), name: $("#name").value.trim()};
    if (!z.nr || !z.code || !z.name) return anmeldung("Bitte alle drei Felder ausfüllen.");
    await laden(z);
  };
}

async function laden(z){
  $("#app").classList.add("laden");
  try {
    const w = await rufe("termine_anmelden", {p_nr:z.nr, p_code:z.code, p_name:z.name});
    zugang = {nr:z.nr, code:z.code, name:w.name};
    merke("zugang", zugang);
    if (w.land) landDerFiliale = w.land;
    // Den eigenen Plan holen — gibt es ihn (noch) nicht, bleibt der Bereich einfach weg
    try { meinPlan = await rufe("termine_mein_plan", {p_nr:z.nr, p_code:z.code, p_name:w.name}); }
    catch(e){ meinPlan = null; }
    abstand = new Date(w.jetzt) - Date.now();
    // Liegt noch ein Entwurf für eine Woche herum, deren Frist vorbei ist? Dann sagen.
    const alt = lies("entwurf");
    let verpasst = null;
    if (alt && alt.woche !== w.woche && alt.nr === z.nr && alt.name === w.name && alt.ungesendet)
      verpasst = {woche: alt.woche, gesendet: alt.gesendet || null};
    woche = w;
    if (alt && alt.woche === w.woche && alt.nr === z.nr && alt.name === w.name){
      // Entwürfe der älteren Seite (nur/krank/urlaub) nicht stillschweigend umdeuten
      entwurf = alt.tage;
      Object.values(entwurf).forEach(x => { if (!["frei","nicht","ohne"].includes(x.art)) Object.assign(x, {art:"frei", von:"", bis:""}); });
    }
    else entwurf = w.abgabe ? ausServer(w.abgabe) : leererEntwurf();
    if (verpasst || (alt && alt.woche !== w.woche)) merke("entwurf", null);
    zeigen(verpasst);
  } catch(e){
    $("#app").classList.remove("laden");
    anmeldung(e.message);
    return;
  }
  $("#app").classList.remove("laden");
}

const leererEntwurf = () => Object.fromEntries(TAGE.map(([k]) => [k, {art:"frei", von:"", bis:""}]));
function ausServer(a){
  const e = leererEntwurf();
  // Nur, was es heute noch gibt — ältere Abgaben (nur/krank/urlaub) zählen als „kann arbeiten“
  Object.entries(a || {}).forEach(([k, v]) => {
    if (e[k] && (v.art === "nicht" || v.art === "ohne")) e[k] = {art:v.art, von:v.von || "", bis:v.bis || ""};
  });
  return e;
}
// Was zum Server geht: nur die Tage, die nicht „frei verfügbar“ sind
function fuerServer(){
  const raus = {};
  TAGE.forEach(([k], i) => {
    if (istFeiertag(tagDatum(woche.montag, i))) return;
    const t = entwurf[k];
    if (t.art === "frei") return;
    raus[k] = t.art === "ohne" ? {art:"ohne", von:t.von, bis:t.bis} : {art:"nicht"};
  });
  return raus;
}
const gesendetGleich = () => woche.abgegeben && JSON.stringify(fuerServer()) === JSON.stringify(ausServerKurz(woche.abgabe));
function ausServerKurz(a){
  const raus = {};
  TAGE.forEach(([k]) => { const v = (a || {})[k];
    if (v && (v.art === "nicht" || v.art === "ohne")) raus[k] = v.art === "ohne" ? {art:"ohne", von:v.von, bis:v.bis} : {art:"nicht"}; });
  return raus;
}
function sichern(){
  merke("entwurf", {nr:zugang.nr, name:zugang.name, woche:woche.woche, tage:entwurf,
                     ungesendet: !gesendetGleich(), gesendet: woche.abgegeben || null});
}

/* ---------- Die Woche ---------- */
function zeigen(verpasst){
  clearInterval(uhr);
  const mo = tagDatum(woche.montag, 0), sa = tagDatum(woche.montag, 5);
  const frist = new Date(woche.frist), fristTag = new Date(frist.getTime() - 60000);   // Mittwoch 23:59
  $("#app").innerHTML = `
    <div id="meinPlan"></div>
    <h2 class="abschnitt">Zeiten abgeben</h2>
    <div class="karte kopf">
      <div class="kw">Arbeitsplan KW ${esc(woche.woche.slice(-2).replace(/^0/, ""))}</div>
      <div class="zeitraum">${kurz(mo)} – ${lang(sa)}</div>
      <div class="wer">Angemeldet als <b>${esc(zugang.name)}</b> · Filiale ${esc(zugang.nr)}</div>
    </div>
    ${verpasst ? `<div class="meldung m-warn"><b>${verpasst.gesendet
        ? `Deine letzten Änderungen für KW ${esc(kwNr(verpasst.woche))} kamen zu spät.`
        : `Für KW ${esc(kwNr(verpasst.woche))} hast du nichts abgeschickt.`}</b>${verpasst.gesendet
        ? `Es gilt, was du am ${new Date(verpasst.gesendet).toLocaleString("de-DE", {day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit"})} Uhr geschickt hast.`
        : "Die Frist ist vorbei — dort kannst du laut Plan an allen Tagen arbeiten."} Jetzt geht es um die nächste Woche.</div>` : ""}
    <div id="status"></div>
    <div id="tage"></div>
    <p class="feldfehler" id="fehler" role="alert"></p>
    <button class="btn" id="senden"></button>
    <div class="fuss">
      <button class="link" id="kalender">Erinnerung in meinen Kalender</button>
      <button class="link" id="abmelden">Abmelden</button>
    </div>
    <p class="hint" style="margin-top:12px">Krank oder Urlaub? Das trägt die Filialleitung ein —
    bitte wie gewohnt bei ihr melden.</p>`;
  zeichneMeinPlan();
  zeichneTage();
  status();
  uhr = setInterval(status, 30000);
  $("#senden").onclick = senden;
  $("#abmelden").onclick = () => { merke("zugang", null); merke("entwurf", null); zugang = null; anmeldung(); };
  $("#kalender").onclick = kalender;

  function status(){
    const rest = frist - jetzt();
    const box = $("#status");
    if (!box) return;
    const fristText = `Mittwoch, ${lang(fristTag)}, 23:59 Uhr`;
    if (rest <= 0){
      clearInterval(uhr);
      box.innerHTML = `<div class="meldung m-bad"><b>Die Abgabe ist geschlossen.</b>Die Frist (${fristText}) ist abgelaufen.
        <button class="link" id="neu">Nächste Woche öffnen</button></div>`;
      $("#neu").onclick = () => laden(zugang);
      $("#senden").disabled = true;
      return;
    }
    const tage = Math.floor(rest / 864e5), std = Math.floor(rest % 864e5 / 36e5), min = Math.floor(rest % 36e5 / 6e4);
    const noch = tage >= 1 ? `noch ${tage} ${tage === 1 ? "Tag" : "Tage"}${std ? " und " + std + (std === 1 ? " Stunde" : " Stunden") : ""}`
               : std >= 1 ? `noch ${std} ${std === 1 ? "Stunde" : "Stunden"} und ${min} ${min === 1 ? "Minute" : "Minuten"}`
               : `noch ${min} ${min === 1 ? "Minute" : "Minuten"}`;
    const gesendet = woche.abgegeben ? new Date(woche.abgegeben) : null;
    const gleich = gesendetGleich();
    let art, titel, text;
    if (gesendet && gleich){
      art = "m-ok"; titel = "✓ Abgeschickt";
      text = `am ${gesendet.toLocaleString("de-DE", {weekday:"short", day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit"})} Uhr.
        Du kannst bis ${fristText} noch etwas ändern (${noch}).`;
    } else if (gesendet){
      art = "m-warn"; titel = "Deine Änderungen sind noch nicht abgeschickt";
      text = `Unten auf „Änderungen abschicken“ tippen — sonst gilt, was du vorher geschickt hast. Frist: ${fristText} (${noch}).`;
    } else {
      art = rest < 2 * 864e5 ? "m-warn" : "m-info";
      titel = rest < 2 * 864e5 ? "⏰ Erinnerung: Bitte bis Mittwoch abschicken" : "Noch nicht abgeschickt";
      text = `Abgabe bis <b style="display:inline">${fristText}</b> — ${noch}. Wenn du nichts abschickst,
        kannst du laut Plan die ganze Woche arbeiten.`;
    }
    box.innerHTML = `<div class="meldung ${art} frist"><span class="uhr" aria-hidden="true">${art === "m-ok" ? "" : "🕒"}</span>
      <span><b>${titel}</b>${text}</span></div>`;
    const knopf = $("#senden");
    knopf.disabled = !!(gesendet && gleich);
    knopf.textContent = gesendet ? (gleich ? "Abgeschickt ✓" : "Änderungen abschicken") : "Abschicken";
  }
  zeigen.status = status;
}

// Die eigenen Schichten — nur, wenn die Filialleitung den Plan freigegeben hat
function zeichneMeinPlan(){
  const box = $("#meinPlan");
  const wochen = (meinPlan && meinPlan.wochen) || [];
  if (!box || !wochen.length){ if (box) box.innerHTML = ""; return; }
  if (planReiter >= wochen.length) planReiter = 0;
  const w = wochen[planReiter];
  const heute = new Date(); heute.setHours(12, 0, 0, 0);
  const zeilen = TAGE.map(([k, name], i) => {
    const d = tagDatum(w.montag, i);
    const eigene = (w.schichten || []).filter(s => s.tag === k);
    const was = istFeiertag(d) ? `<span class="mp-frei">Feiertag</span>`
      : eigene.length ? eigene.map(s => `<span class="mp-zeit">${esc(s.von)}–${esc(s.bis)}</span>${s.pVon
          ? `<span class="mp-pause">Pause ${esc(s.pVon)}–${esc(s.pBis)}</span>` : ""}`).join("<br>")
      : `<span class="mp-frei">frei</span>`;
    return `<div class="mp-zeile${d.getTime() === heute.getTime() ? " mp-heute" : ""}">
      <span class="mp-tag">${name.slice(0, 2)} ${kurz(d)}</span><span>${was}</span></div>`;
  }).join("");
  const stand = new Date(w.geaendert).toLocaleString("de-DE", {weekday:"short", day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit"});
  box.innerHTML = `<div class="karte meinplan"><div class="mp-kopf"><b>Mein Plan</b>
      <div class="mp-reiter">${wochen.map((x, n) => `<button type="button" data-n="${n}" aria-pressed="${n === planReiter}">KW ${esc(kwNr(x.woche))}</button>`).join("")}</div></div>
    ${zeilen}<p class="hint" style="margin:8px 0 0">Stand: ${stand} Uhr. Ändert die Filialleitung etwas, steht es hier.</p></div>`;
  box.querySelectorAll("[data-n]").forEach(b => b.onclick = () => { planReiter = +b.dataset.n; zeichneMeinPlan(); });
}

function zeichneTage(){
  const box = $("#tage");
  box.innerHTML = "";
  TAGE.forEach(([k, name], i) => {
    const d = tagDatum(woche.montag, i);
    const karte = document.createElement("div");
    karte.className = "karte tag";
    if (istFeiertag(d)){
      karte.innerHTML = `<h2>${name} <span>${kurz(d)}</span></h2><div class="geschlossen">Feiertag — die Filiale ist geschlossen.</div>`;
      box.appendChild(karte); return;
    }
    const t = entwurf[k];
    karte.innerHTML = `<h2>${name} <span>${kurz(d)}</span></h2>
      <div class="wahl" role="group" aria-label="${name}">${ARTEN.map(([a, l]) =>
        `<button type="button" class="${a}" data-a="${a}" aria-pressed="${t.art === a}">${l}</button>`).join("")}</div>
      ${t.art === "ohne" ? `<div class="zeiten">
        <label class="f">Ich kann von<input type="time" data-z="von" value="${esc(t.von)}"></label>
        <label class="f">bis nicht<input type="time" data-z="bis" value="${esc(t.bis)}"></label></div>` : ""}`;
    karte.querySelectorAll("[data-a]").forEach(b => b.onclick = () => {
      t.art = b.dataset.a;
      sichern(); zeichneTage(); zeigen.status();
      if (t.art === "ohne") { const f = box.querySelectorAll(".tag")[i].querySelector("[data-z=von]"); if (f && !t.von) f.focus(); }
    });
    karte.querySelectorAll("[data-z]").forEach(f => f.oninput = () => {
      t[f.dataset.z] = f.value; f.classList.remove("fehlerfeld"); sichern(); zeigen.status();
    });
    box.appendChild(karte);
  });
}

async function senden(){
  const fehler = $("#fehler");
  fehler.textContent = "";
  // Uhrzeiten prüfen, bevor etwas rausgeht
  for (const [k, name] of TAGE){
    const t = entwurf[k];
    if (t.art !== "ohne") continue;
    if (!t.von || !t.bis || t.bis <= t.von){
      const i = TAGE.findIndex(x => x[0] === k);
      const karte = document.querySelectorAll(".tag")[i];
      karte.querySelectorAll("[data-z]").forEach(f => f.classList.add("fehlerfeld"));
      karte.scrollIntoView({behavior:"smooth", block:"center"});
      fehler.textContent = !t.von || !t.bis ? `${name}: Bitte eintragen, von wann bis wann du nicht kannst.`
                                            : `${name}: Die zweite Uhrzeit muss nach der ersten liegen.`;
      return;
    }
  }
  const knopf = $("#senden");
  knopf.disabled = true; knopf.textContent = "Wird abgeschickt …";
  try {
    const r = await rufe("termine_abgeben", {p_nr:zugang.nr, p_code:zugang.code, p_name:zugang.name,
                                             p_woche:woche.woche, p_eintraege:fuerServer()});
    woche.abgegeben = r.abgegeben;
    woche.abgabe = fuerServer();
    sichern();
    zeigen.status();
    window.scrollTo({top:0, behavior:"smooth"});
  } catch(e){
    fehler.textContent = e.message;
    zeigen.status();
    if (/geschlossen/i.test(e.message)) setTimeout(() => laden(zugang), 2500);
  }
}

// Wiederkehrende Erinnerung: jeden Mittwoch um 18 Uhr — die Datei öffnet der Kalender des Handys
function kalender(){
  const d = new Date(woche.frist); d.setDate(d.getDate() - 1);         // Mittwoch dieser Abgabe
  const tag = d.getFullYear() + String(d.getMonth()+1).padStart(2,"0") + String(d.getDate()).padStart(2,"0");
  const ics = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Filialplaner//Zeiten//DE","BEGIN:VEVENT",
    "UID:zeiten-" + tag + "@filialplaner", "DTSTAMP:" + new Date().toISOString().replace(/[-:]/g,"").slice(0,15) + "Z",
    "DTSTART;TZID=Europe/Berlin:" + tag + "T180000", "DURATION:PT15M", "RRULE:FREQ=WEEKLY;BYDAY=WE",
    "SUMMARY:Zeiten für den Arbeitsplan abgeben (bis 23:59 Uhr)", "URL:" + location.href.split("?")[0],
    "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:Zeiten abgeben","TRIGGER:PT0M","END:VALARM",
    "END:VEVENT","END:VCALENDAR"].join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([ics], {type:"text/calendar"}));
  a.download = "Erinnerung-Zeiten.ics";
  document.body.appendChild(a); a.click(); a.remove();
}

if (zugang) laden(zugang); else anmeldung();
</script>
