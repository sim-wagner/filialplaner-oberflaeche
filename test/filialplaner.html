      <input type="number" step="0.01" min="0" id="aLohn" placeholder="${mindestlohn(x.jahr).toFixed(2)}" value="${esc((state.einstellungen || {}).aushilfeLohn || "")}">
      <span class="hint">leer = Mindestlohn ${euro(mindestlohn(x.jahr))}</span></label>
    <div class="tile"><span class="eyebrow">Minijob-Grenze ${x.jahr}</span><div class="v">${minijobGrenze(x.jahr)} €</div>
      <div class="sub">= ${h1(minijobStunden(x.jahr))} h im Monat bei ${euro(aushilfeLohn(x.jahr))}</div></div>
    <div class="tile"><span class="eyebrow">Minijob-Grenze ${x.jahr + 1}</span><div class="v">${minijobGrenze(x.jahr + 1)} €</div>
      <div class="sub">Mindestlohn dann ${euro(mindestlohn(x.jahr + 1))}</div></div></div>`);
  lohnFeld.querySelector("#aLohn").onchange = e => {
    state.einstellungen = state.einstellungen || {};
    state.einstellungen.aushilfeLohn = e.target.value;
    sichern(); const y = window.scrollY; render(); window.scrollTo(0, y);
  };
  aus.appendChild(lohnFeld);
  const aushilfen = state.mitarbeiter.filter(istAushilfe);
  if (!aushilfen.length) aus.appendChild(el(`<p class="empty">Keine Aushilfen im Personal.</p>`));
  aushilfen.forEach(m => {
    const k = aushilfenKonto(m.name).slice(-4);
    if (!k.length){ aus.appendChild(el(`<p class="hint"><b>${esc(m.name)}</b>: noch in keinem Plan.</p>`)); return; }
    const monat = mo => new Date(mo + "-15T12:00:00").toLocaleDateString("de-DE", {month: "long", year: "numeric"});
    const folge = mo => { const d = new Date(mo + "-15T12:00:00"); d.setMonth(d.getMonth() + 1); return d.toLocaleDateString("de-DE", {month: "long"}); };
    aus.appendChild(el(`<div class="aushilfe"><h3>${esc(m.name)}</h3><div class="tablewrap"><table><thead><tr><th>Gearbeitet im</th>
      <th class="n">Stunden</th><th>Ausgezahlt im</th><th class="n">Stunden</th><th class="n">mitgenommen</th></tr></thead><tbody>${k.map(z =>
      `<tr><td>${monat(z.monat)}${z.vollstaendig ? "" : ` <span class="tag">nicht ganz geplant</span>`}</td><td class="n">${h1(z.gearbeitet)}</td>
        <td>${folge(z.monat)}</td><td class="n">${h1(z.ausgezahlt)}</td>
        <td class="n ${z.uebertrag > 0.01 ? "ue-plus" : ""}">${h1(z.uebertrag)}</td></tr>`).join("")}</tbody></table></div></div>`));
  });
  aus.appendChild(el(`<p class="hint">Ausgezahlt wird im Folgemonat, was im Monat davor gearbeitet wurde — höchstens bis zur Minijob-Grenze.
    Was darüber liegt, wird in die nächsten Monate mitgenommen und nie ausgezahlt. Gerechnet aus den Plänen; was nach dem Erstellen
    von Hand geändert wurde, zählt mit.</p>`));

  // ---- Aufbau des Mindestbedarfs (wie bisher) ----
  p.querySelector("#aufbau").appendChild(el(`<div class="tablewrap"><table><thead><tr><th>Posten</th><th>Rechnung</th><th class="n">Stunden</th></tr></thead>
    <tbody>
      <tr><td>Grundbesetzung</td><td class="hint">${a.offenH === null ? "Öffnungszeit nicht angegeben"
        : "2 Personen × " + h1(a.offenH) + " h Öffnung × 6 Tage"}</td><td class="n">${a.grund === null ? "?" : h1(a.grund)}</td></tr>
      <tr><td>Vorlauf vor Öffnung</td><td class="hint">Termine, die zwingend vorher liegen</td><td class="n">${a.grund === null ? "?" : h1(a.vorlauf)}</td></tr>
      <tr><td>Nachlauf nach Ladenschluss</td><td class="hint">Abendprogramm, Abrechnung</td><td class="n">${a.grund === null ? "?" : h1(a.nachlauf)}</td></tr>
      <tr><td>Zusätzliche Kräfte für Warentermine</td><td class="hint">${a.offeneAufgaben.length
        ? "ohne " + a.offeneAufgaben.length + " Aufgabe(n) ohne vollständige Angabe" : "jede Person über die erste hinaus"}</td><td class="n">${h1(a.zusatz)}</td></tr>
      <tr><td><b>Zusammen</b></td><td class="hint">ohne Krankheit und Urlaub</td><td class="n"><b>${a.bedarf === null ? "?" : h1(a.bedarf)}</b></td></tr>
    </tbody></table></div>`));

  // ---- Was auffällt (wie bisher, eingeklappt) ----
  const notes = p.querySelector("#notes");
  const add = (art, ic, text) => notes.appendChild(el(`<div class="note ${art}"><span class="ic">${ic}</span><span>${text}</span></div>`));
  if (a.flexible > 0)
    add("ok","~",`${a.flexible} Aufgabe(n) ohne feste Uhrzeit — der Plan legt sie dorthin, wo Platz ist.`);
  if (a.wirksam < a.anwesend)
    add("ok","+",`Azubistunden bringen ${h1(a.anwesend - a.wirksam)} h zusätzliche Besetzung, ohne die Stundenleistung zu belasten. Beim Wechsel des Lehrjahrs fällt dieser Vorteil weg.`);
  state.mitarbeiter.forEach(m => pruefeStandard(m).forEach(v => add(v.art, "§", `Standardwoche ${esc(m.name)} — ${esc(v.text)}`)));
  if (state.mitarbeiter.some(m => m.typ === "Filialleitung" && !wochenStunden(m)))
    add("warn","!","Für die Filialleitung ist noch keine Standardwoche hinterlegt — sie ist der Fixpunkt, um den herum der Plan gebaut wird.");
  a.minderjaehrig.filter(m => (m.qual || []).includes("spaet")).forEach(m => add("bad","§",
    `${esc(m.name)} ist als Spätschichtvertretung eingetragen, darf aber nur bis 20:00 Uhr arbeiten.`));
  // JArbSchG: §§ 8, 11, 13, 14, 15 — so, wie der Planer es einhält (REGELN)
  a.minderjaehrig.forEach(m => add("warn","§",
    `${esc(m.name)} ist unter 18: Einsatz nur von 6 bis 20 Uhr, höchstens 8 h am Tag und 5 Tage pro Woche, 12 h Ruhe zwischen zwei Schichten, `
    + `Pause 30 Minuten bei mehr als 4,5 h und 60 Minuten bei mehr als 6 h Arbeitszeit.`));
  if (!notes.children.length) add("ok","✓","Keine Auffälligkeiten in der Einrichtung.");
  const offen = p.querySelector("#offen");
  a.luecken.forEach(l => offen.appendChild(el(`<div class="note warn"><span class="ic">?</span><span>${esc(l)}</span></div>`)));

  p.appendChild(navLeiste(PRUEFEN_SCHRITT));
  return p;
}

// ==== app/40-startseite.js ====
/* Startseite: der aktuelle Plan zum Ansehen, darunter die Bereiche in drei Gruppen.

   Der Plan hier ist immer der gültige. Geändert wird er nur unter „Plan ändern“ —
   dort entsteht ein Entwurf, der erst mit „Übernehmen“ hierher kommt. */

/* ---- Der Plan kompakt: passt als Ganzes in die Breite, ohne Querscrollen ---- */
function planKompakt(plan, optionen){
  const o = optionen || {};
  const r = planRaster(plan);
  const ms = state.mitarbeiter;
  const ueKlasse = n => n > 0.01 ? "ue-plus" : n < -0.01 ? "ue-minus" : "ue-null";

  // In schmaler Ansicht kurze Wörter statt Umbruch mitten im Wort
  const zweifach = (voll, kurz) => `<span class="k-voll">${voll}</span><span class="k-kurz">${kurz}</span>`;
  const abk = n => n.length <= 5 ? n : n.slice(0, 3) + ".";
  const kopf = `<tr><th class="k-name">${zweifach("Mitarbeiter", "Name")}</th>${plan.tage.map((t, ti) =>
    `<th class="k-tag${t.feiertag ? " k-feiertag" : ""}">${esc(t.label)}<span>${t.datum.getDate()}.${t.datum.getMonth()+1}.</span></th>`).join("")}
    <th class="k-std">Std.</th><th class="k-konto">${zweifach("Konto", "Kto.")}</th></tr>`;

  // Lieferungen, Bestellungen und Notizen je in einer Zeile — klein, darf umbrechen
  const zusatz = (titel, klasse, werte) => werte.some(x => x)
    ? `<tr class="k-zusatz ${klasse}"><th>${titel}</th>${werte.map(x => `<td>${x}</td>`).join("")}<td></td><td></td></tr>` : "";
  const liefer = zusatz(zweifach("Lieferung", "Lief."), "k-liefer", plan.tage.map((t, ti) => {
    const l = r.lieferungen.map(x => x.tage[ti]).filter(Boolean);
    return l.length ? zweifach(l.map(esc).join(", "), l.map(x => esc(abk(x))).join(" ")) : "";
  }));
  const bestell = r.mitBestellung ? zusatz(zweifach("Bestellung", "Best."), "k-bestell", r.bestellung.map(x => x.map(esc).join("<br>"))) : "";
  const notizen = plan.tage.map(t => t.feiertag ? "" : esc((plan.notizen || {})[t.key] || ""));
  const notiz = o.notizImmer
    ? `<tr class="k-zusatz k-notiz"><th>Notiz</th>${notizen.map((x, ti) => `<td data-notiz="${ti}">${x || (plan.tage[ti].feiertag ? "" : "+")}</td>`).join("")}<td></td><td></td></tr>`
    : zusatz("Notiz", "k-notiz", notizen);

  const zeilen = r.leute.map((pz, i) => {
    const m = ms[i];
    const tage = plan.tage.map((t, ti) => {
      if (t.feiertag) return `<td class="k-frei">Feiertag</td>`;
      const sch = pz.j < 0 ? [] : t.schichten.filter(s => s.mi === pz.j).sort((a, b) => a.von - b.von);
      if (!sch.length) return `<td class="k-frei" data-ti="${ti}" data-i="${i}">frei</td>`;
      const zelle = sch.map(s => `<span class="k-zeit"><b>${hhmm(s.von)}</b><b>${hhmm(s.bis)}</b></span>${
        s.pause && s.pauseVon !== null && sch.length === 1 ? `<span class="k-pause">P ${hhmm(s.pauseVon)}</span>` : ""}`).join("");
      return `<td data-ti="${ti}" data-i="${i}">${zelle}</td>`;
    }).join("");
    const vorname = m.name.split(/\s+/)[0];
    const name = o.klickbar
      ? `<button class="namelink" type="button" data-person="${i}" title="${esc(m.name)} bearbeiten — Urlaub, Krankheit, Angaben">
          <span class="k-voll">${esc(m.name)}</span><span class="k-kurz">${esc(vorname)}</span></button>`
      : `<span class="k-voll">${esc(m.name)}</span><span class="k-kurz">${esc(vorname)}</span>`;
    const typ = istAzubi(m) ? `Azubi ${m.lehrjahr}. Jahr` : m.typ;
    return `<tr class="k-person"><th class="k-name">${name}<span class="k-typ">${esc(typ)}</span></th>${tage}
      <td class="k-std"><b>${h1(pz.wo)}</b>${pz.sollZahl !== null ? `<span>von ${h1(pz.sollZahl)}</span>` : ""}</td>
      <td class="k-konto">${pz.ueEnde === null ? "" : `<b class="${ueKlasse(pz.ueEnde)}">${ueText(pz.ueEnde) || "0,0"}</b>
        <span class="${ueKlasse(pz.ueAend)}">${Math.abs(pz.ueAend) < 0.01 ? "±0" : ueText(pz.ueAend)}</span>`}</td></tr>`;
  }).join("");

  const summe = `<tr class="k-summe"><th>Summe</th>${r.summen.map(x => `<td>${h1(x)}</td>`).join("")}
    <td class="k-std"><b>${h1(r.summeWoche)}</b></td><td></td></tr>`;

  const box = el(`<div class="planbox"><table class="kompakt">
    <colgroup><col class="c-name">${plan.tage.map(() => `<col class="c-tag">`).join("")}<col class="c-std"><col class="c-konto"></colgroup>
    <thead>${kopf}</thead><tbody>${liefer}${bestell}${notiz}${zeilen}${summe}</tbody></table></div>`);
  if (o.klickbar) box.querySelectorAll("[data-person]").forEach(b => b.onclick = () => personOeffnen(+b.dataset.person));
  return box;
}

// Für Archiv und Druck bleibt der Name — es ist dieselbe Darstellung, nur ohne Klick
const planTabelle = plan => planKompakt(plan, {});

/* ---- Kachel eines Bereichs ---- */
function kachel({sym, titel, text, marke, klick, ziel}){
  const k = el(`<button class="kachel" type="button"${ziel ? ` data-ziel="${ziel}"` : ""}>
    <span class="kachel-sym">${symbol(sym)}</span>
    <span class="kachel-text"><b>${esc(titel)}</b><span>${esc(text || "")}</span></span>${markeHtml(marke)}</button>`);
  k.onclick = klick;
  return k;
}

/* ---- Startseite ---- */
function startseite(){
  // Normalerweise steht die laufende Woche oben; nach dem Erstellen die geplante
  const mo = zeigeWoche ? montagDer(zeigeWoche) : aktuellerMontag();
  const sl = wochenSchluessel(mo);
  const gespeichert = state.plaene[sl];
  const plan = planLaden(gespeichert);
  const kw = kwVon(mo);
  const bis = new Date(mo.getTime() + 5*864e5);
  const marken = markierungen();
  const zahl = ziel => (marken[ziel] || []).length;

  const p = el(`<div class="start">
    <div class="hero">
      <span class="heromark" aria-hidden="true">
        <span class="hb hb1"></span><span class="hb hb2"></span><span class="hb hb3"></span>
      </span>
      <div class="herotext">
        <h1>N ${esc(state.nr)}${state.ort ? " · " + esc(state.ort) : ""}</h1>
        <p>KW ${kw} · ${deVon(mo)} – ${deVon(bis)}</p>
      </div>
      <div class="hero-knoepfe">
        <button class="btn hell" id="neuerPlan" type="button">${symbol("plus")}<span>Plan erstellen</span>${markeHtml(zahl("planen"))}</button>
        <button class="btn hell-rand" id="aendern" type="button"${gespeichert ? "" : " disabled"}>${symbol("stift")}<span>Plan ändern</span>${markeHtml(zahl("aendern"))}</button>
      </div>
    </div>

    <section class="karte plankarte">
      <div class="karte-kopf">
        <div>
          <span class="eyebrow">${gespeichert ? "Aktueller Plan" : "Noch kein Plan"}</span>
          <h2>KW ${kw} · ${deVon(mo)} – ${deVon(bis)}${
            isoVon(mo) === isoVon(aktuellerMontag()) ? "" : ` <span class="tag">andere Woche</span>`}${
            plan && plan.phase.art !== "normal" ? ` <span class="tag phase">${esc(phasenText(plan.phase))}</span>` : ""}</h2>
        </div>
        <div class="wochenwechsel" role="group" aria-label="Woche wechseln">
          <button class="btn ghost small" id="wZurueck" title="eine Woche zurück" type="button">‹</button>
          <button class="btn ghost small" id="wHeute" title="zur laufenden Woche" type="button">heute</button>
          <button class="btn ghost small" id="wVor" title="eine Woche vor" type="button">›</button>
        </div>
        <div class="karte-aktionen" id="planKnoepfe"></div>
      </div>
      <div id="planInhalt"></div>
    </section>

    <section class="gruppe g-planung"><h2 class="gruppe-titel">Planung</h2><div class="kacheln" id="kPlanung"></div></section>
    <section class="gruppe g-daten"><h2 class="gruppe-titel">Filialdaten</h2><div class="kacheln" id="kDaten"></div></section>
    <section class="gruppe g-verwaltung"><h2 class="gruppe-titel">Auswertung & Verwaltung</h2><div class="kacheln" id="kVerwaltung"></div></section>
  </div>`);

  const warnung = archivHinweis();
  if (warnung) p.insertBefore(warnung, p.firstChild);

  // Plan oder Hinweis
  const inhalt = p.querySelector("#planInhalt");
  const knoepfe = p.querySelector("#planKnoepfe");
  if (plan){
    inhalt.appendChild(planKompakt(plan, {klickbar: true}));
    const s = planSummen(plan);
    inhalt.appendChild(el(`<p class="hint plan-fuss">Auf einen Namen tippen, um Urlaub, Krankheit oder Angaben der Person
      einzutragen. ${h1(s.bezahlt)} Stunden gesamt, davon ${h1(s.wirk)} leistungswirksam${gespeichert.erstellt
        ? " · erstellt am " + new Date(gespeichert.erstellt).toLocaleDateString("de-DE") : ""}${gespeichert.geaendertVonHand ? " · geändert" : ""}.</p>`));
    // Besondere Ereignisse der Woche — rot und immer sichtbar
    const ereignisse = ereignisseDerWoche(sl);
    if (ereignisse.length) inhalt.appendChild(el(`<div class="note bad ereignisliste"><span class="ic">!</span>
      <span><b>Besondere Ereignisse</b>${ereignisse.map(e => `<br>${esc(e.text)}: ${esc(e.name)} — ${tageText(e.tage)}`).join("")}</span></div>`));
    // Die Messlatte: wie viele Stunden die Woche mindestens bräuchte
    const b = plan.berechnung;
    if (b && b.mindest !== null && b.mindest !== undefined){
      const mehr = s.bezahlt - b.mindest;
      inhalt.appendChild(el(`<div class="messlatte"><span class="eyebrow">Messlatte</span>
        <span>Mindestens nötig wären <b>${h1(b.mindest)} h</b> — für Gesetz, Besetzung, Aufgaben und
        Standardwochen. ${mehr > 0.25 ? `Die ${h1(mehr)} h darüber füllen Vertragsstunden auf und gleichen
        Konten aus.` : "Der Plan liegt genau darauf."}</span></div>`));
    }
    const hinweise = hinweiseOhneStunden(plan.meldungen);
    if (hinweise.length){
      const d = el(`<details class="aufklapp"><summary>${hinweise.length} Hinweise zum Plan</summary><div></div></details>`);
      const box = d.querySelector("div");
      hinweise.forEach(m => box.appendChild(
        el(`<div class="note ${m.art}"><span class="ic">${m.art === "bad" ? "×" : m.art === "ok" ? "✓" : "!"}</span><span>${esc(m.text)}</span></div>`)));
      inhalt.appendChild(d);
    }
    const pdf = el(`<button class="btn small" type="button">PDF zum Aushängen</button>`);
    pdf.onclick = () => planPDF(planLaden(gespeichert));
    const xls = el(`<button class="btn ghost small" type="button">Excel</button>`);
    xls.onclick = () => planExcel(planLaden(gespeichert));
    knoepfe.appendChild(pdf); knoepfe.appendChild(xls);
  } else {
    const leer = el(`<div class="leerplan"><p>Für diese Woche gibt es noch keinen Plan.</p>
      <button class="btn" type="button">${symbol("plus")}<span>Plan für KW ${kw} erstellen</span></button></div>`);
    leer.querySelector("button").onclick = () => { planWoche = isoVon(mo); ansicht = "planen"; render(); };
    inhalt.appendChild(leer);
  }

  // Bereiche in drei Gruppen: was diese Woche zu tun ist, was die Filiale ausmacht, was dahinter liegt
  const heuteIso = isoVon(new Date());
  const aktuell = (state.ereignisse || []).filter(e => e.bis >= heuteIso).length;
  const listen = Object.keys(state.listen || {}).length;
  const altP = archivSchluessel().length, altL = listenArchivSchluessel().length;
  const planung = p.querySelector("#kPlanung"), daten = p.querySelector("#kDaten"), verw = p.querySelector("#kVerwaltung");
  planung.appendChild(kachel({sym: "plus", titel: "Plan erstellen", text: `für KW ${kw} oder eine andere Woche`, marke: zahl("planen"),
    klick: () => { planWoche = isoVon(mo); ansicht = "planen"; render(); }}));
  planung.appendChild(kachel({sym: "stift", titel: "Plan ändern", text: gespeichert ? "Ausfall, Urlaub, Tausch — mit Vorschlägen" : "erst einen Plan erstellen",
    marke: zahl("aendern"), klick: () => gespeichert ? planAendernOeffnen(sl) : alert("Für diese Woche gibt es noch keinen Plan.")}));
  planung.appendChild(kachel({sym: "sonne", titel: "Urlaub & Krankheit", text: aktuell ? `${aktuell} ${aktuell === 1 ? "Eintrag" : "Einträge"} aktuell` : "Übersicht — nichts eingetragen",
    marke: zahl("ereignisse"), klick: () => { gesehenMerken("ereignisse"); ansicht = "ereignisse"; render(); }}));
  planung.appendChild(kachel({sym: "briefe", titel: "Zeiten der Mitarbeiter", text: ONLINE_BEREIT && state.online ? "Abgaben online" : "einlesen oder online abgeben lassen",
    marke: zahl("termine"), klick: () => { gesehenMerken("termine"); ansicht = "termine"; render(); }}));

  const bereich = (id, sym, titel, text) => daten.appendChild(kachel({sym, titel, text, marke: zahl(id), ziel: id,
    klick: () => { gesehenMerken(id); oeffneBereich(id); }}));
  bereich("filiale", "laden", "Filiale", state.ort ? `${state.ort} · ${state.von || "?"}–${state.bis || "?"} Uhr` : "Öffnungszeit, Bundesland");
  bereich("aufgaben", "liste", "Wochenaufgaben", WAREN.filter(w => !w.gruppe && state.aufgaben[w.id].aktiv && state.aufgaben[w.id].tage.length).length
    + " aktiv · " + WAREN.filter(w => w.gruppe === "bestellung" && state.aufgaben[w.id].aktiv && state.aufgaben[w.id].tage.length).length + " Bestellungen");
  bereich("personal", "leute", "Personal", state.mitarbeiter.length + (state.mitarbeiter.length === 1 ? " Person" : " Personen"));
  bereich("standardwoche", "uhr", "Standardwoche", state.mitarbeiter.filter(m => wochenStunden(m) > 0).length + " feste Wochen");
  bereich("stundenliste", "tabelle", "Stundenliste", listen ? listen + (listen === 1 ? " Woche erfasst" : " Wochen erfasst") : "nicht hinterlegt");

  verw.appendChild(kachel({sym: "zahlen", titel: "Analyse", text: "Besetzung, Konten, Empfehlungen", marke: zahl("analyse"),
    klick: () => { gesehenMerken("analyse"); ansicht = "bereich"; zurueckNach = null; schritt = PRUEFEN_SCHRITT; fehler = ""; render(); }}));
  verw.appendChild(kachel({sym: "archiv", titel: "Archiv", text: (altP + altL) === 0 ? "noch leer"
    : `${altP} ${altP === 1 ? "Plan" : "Pläne"}, ${altL} ${altL === 1 ? "Liste" : "Listen"}`, marke: zahl("archiv"),
    klick: () => { ansicht = "archiv"; render(); }}));
  verw.appendChild(kachel({sym: "schild", titel: "Sicherung", text: inApp ? "läuft automatisch" : "Datei anlegen", marke: zahl("sicherung"),
    klick: () => { gesehenMerken("sicherung"); ansicht = "sicherung"; render(); }}));

  const springe = n => {
    const d = new Date(mo); d.setDate(mo.getDate() + n*7);
    zeigeWoche = isoVon(d); render();
  };
  p.querySelector("#wZurueck").onclick = () => springe(-1);
  p.querySelector("#wVor").onclick = () => springe(1);
  p.querySelector("#wHeute").onclick = () => { zeigeWoche = null; render(); };
  p.querySelector("#neuerPlan").onclick = () => { planWoche = isoVon(mo); ansicht = "planen"; render(); };
  p.querySelector("#aendern").onclick = () => planAendernOeffnen(sl);
  return p;
}

// ==== app/41-planen.js ====
/* Plan erstellen: Woche, Art der Woche, Abwesenheiten */

/* ---- Planen: Abwesenheiten eintragen und Plan erzeugen ---- */
let planEntwurf = null;

function planenAnsicht(){
  // Für welche Woche? Vorgewählt ist die, die oben auf der Startseite steht.
  planWoche = planWoche || isoVon(aktuellerMontag());
  const mo = montagDer(planWoche);
  const sl = wochenSchluessel(mo);
  state.abwesend[sl] = state.abwesend[sl] || {};
  const abw = state.abwesend[sl];
  const liste = state.listen[sl];

  const wahl = wochenAuswahl(planWoche);

  const p = el(`<div class="panel">
    <div class="head">
      <span class="eyebrow">Arbeitsplan</span>
      <h1 style="margin-top:4px" id="kopf">KW ${kwVon(mo)} · ${deVon(mo)} – ${deVon(new Date(mo.getTime()+5*864e5))}</h1>
      <p class="lede">Erst die Woche wählen, dann eintragen, wer ausfällt oder nur zu
      bestimmten Zeiten kann. Daraus und aus den hinterlegten Angaben entsteht der Plan.</p>
    </div>
    <div class="grid g3" style="margin-bottom:16px">
      <label class="f">Kalenderwoche<select id="kw">${wahl.map(w =>
        `<option value="${w.iso}"${w.iso === planWoche ? " selected" : ""}>${w.text}</option>`).join("")}</select></label>
      <div class="tile" id="listenKachel"></div>
      <div class="tile" id="terminKachel"></div>
    </div>
    <div class="phasenbox">
      <span class="eyebrow">Art der Woche <span class="tag">testweise</span></span>
      <div class="phasenwahl" role="radiogroup" aria-label="Art der Woche" id="phasenwahl"></div>
      <div id="phasenDetail"></div>
    </div>
    <h3 style="margin:18px 0 8px">Wer fällt aus, wer kann nur zu bestimmten Zeiten?</h3>
    <div class="tablewrap"><table><thead><tr><th>Mitarbeiter</th>${
      TAGE.map(([,l]) => `<th>${l}</th>`).join("")}</tr></thead><tbody id="abwBody"></tbody></table></div>
    <p class="hint" style="margin-top:8px">„nur …“ und „nicht …“ brauchen beide Uhrzeiten —
    fehlt eine, wird das Feld rot und der Plan wartet, bis sie eingetragen ist.</p>
    <div class="bereit" id="bereit"></div>
    <div class="actions">
      <button class="btn ghost" id="zurueck">Zurück</button>
      <div class="spacer"></div>
      <button class="btn" id="erzeugen">Plan erzeugen</button>
    </div>
  </div>`);

  // Hinweis auf die Stundenliste dieser Woche
  const lk = p.querySelector("#listenKachel");
  const summe = liste ? TAGE.reduce((x,[k]) => x + nz(liste.stunden[k]), 0) : 0;
  lk.appendChild(el(`<div><span class="eyebrow">Stundenliste dieser Woche</span>
    <div style="font-weight:700;margin-top:4px">${liste && summe ? h1(summe) + " h vorgegeben" : "nicht hinterlegt"}</div>
    <p class="sub" style="margin-top:4px">${liste && summe
      ? "Der Plan wird dagegen gehalten."
      : "Ohne Vorgabe entsteht der Plan genauso — nur ohne Vergleich."}</p></div>`));

  // Zeiten der Mitarbeiter: online abgegeben oder als Liste eingelesen statt abgetippt
  const tk = p.querySelector("#terminKachel");
  const eingetragen = Object.values(abw).reduce((x, t) => x + Object.keys(t || {}).length, 0);
  const online = ONLINE_BEREIT && state.online;
  tk.appendChild(el(`<div><span class="eyebrow">Zeiten der Mitarbeiter</span>
    <div style="font-weight:700;margin-top:4px" id="abgKurz">${online ? "Abgaben werden geladen …"
      : eingetragen ? eingetragen + (eingetragen === 1 ? " Eintrag" : " Einträge") + " in dieser Woche" : "noch nichts eingetragen"}</div>
    <p class="sub" style="margin-top:4px" id="abgSub">${online ? "" : ONLINE_BEREIT
      ? "Mitarbeiter können ihre Zeiten selbst abgeben — einmal einrichten." : "Urlaub und freie Tage einlesen statt abtippen."}</p>
    <div class="kachelknoepfe"><button class="btn small" id="termineEin">${online ? "Abgaben ansehen" : ONLINE_BEREIT ? "Einrichten" : "Einlesen"}</button>
      ${online ? `<button class="btn ghost small" id="termineLink">Link für Mitarbeiter</button>`
               : `<button class="btn ghost small" id="termineVorlage">Vorlage</button>`}</div></div>`));
  tk.querySelector("#termineEin").onclick = () => { ansicht = "termine"; render(); };
  const tv = tk.querySelector("#termineVorlage");
  if (tv) tv.onclick = () => terminVorlage();
  const tl = tk.querySelector("#termineLink");
  if (tl) tl.onclick = () => linkKasten(tk);
  if (online) abgabenHolen(sl).then(antwort => {
    const echte = antwort.abgaben.filter(a => !a.auto).length, offen = abgabenOffen(antwort).length;
    tk.querySelector("#abgKurz").textContent = antwort.vorbei
      ? `Frist vorbei · ${echte} abgegeben` : `${echte} von ${echte + antwort.fehlen.length} abgegeben`;
    tk.querySelector("#abgSub").textContent = offen
      ? `${offen} ${offen === 1 ? "Abgabe ist" : "Abgaben sind"} noch nicht übernommen.`
      : antwort.vorbei ? "Alles übernommen; wer nichts abgegeben hat, ist frei verfügbar."
      : `Abgabe bis ${fristText(antwort.frist)}.`;
    if (offen) tk.querySelector("#abgSub").classList.add("warnzeile");
  }).catch(e => { tk.querySelector("#abgKurz").textContent = "Abgaben nicht erreichbar"; tk.querySelector("#abgSub").textContent = e.message; });

  const tb = p.querySelector("#abwBody");
  if (!state.mitarbeiter.length){
    tb.appendChild(el(`<tr><td colspan="7"><p class="empty">Noch kein Personal hinterlegt.</p></td></tr>`));
  }
  state.mitarbeiter.forEach((m,i) => {
    abw[i] = abw[i] || {};
    const tr = el(`<tr><td><b>${esc(m.name)}</b></td></tr>`);
    TAGE.forEach(([k]) => {
      const td = el(`<td class="abwzelle" data-mi="${i}" data-tag="${k}"></td>`);
      td.appendChild(abwFeld(abw, i, k, () => bereitZeigen()));
      tr.appendChild(td);
    });
    tb.appendChild(tr);
  });

  // Art der Woche — wird je Woche gemerkt, auch wenn noch kein Plan entsteht
  const ph = state.phasen[sl] = phaseNormal(state.phasen[sl] || (state.plaene[sl] && state.plaene[sl].phase));
  const wahlBox = p.querySelector("#phasenwahl"), detail = p.querySelector("#phasenDetail");
  [["normal","Standardwoche","alles wie hinterlegt: Aufgaben, Personal, Überstunden, Stundenliste, Standardwoche"],
   ["sparen","Stunden sparen","auf das Nötigste — Mindestbesetzung und Regeln bleiben"],
   ["mehr","Mehr Stunden","für kurzfristige Zusatzaufgaben"]].forEach(([v, titel, text]) => {
    const k = el(`<label class="phasenkarte"><input type="radio" name="phase" value="${v}"${ph.art === v ? " checked" : ""}>
      <b>${titel}</b><span>${text}</span></label>`);
    k.querySelector("input").onchange = () => { ph.art = v; sichern(); phasenFelder(); };
    wahlBox.appendChild(k);
  });
  const phasenFelder = () => {
    detail.innerHTML = "";
    if (ph.art === "sparen"){
      const box = el(`<div class="phasendetail">
        <label class="switch"><input type="radio" name="sparArt" value="prozent"${ph.sparArt !== "stunden" ? " checked" : ""}>
          alle Aufgaben <input type="number" class="kurzzahl" data-prozent min="1" max="50" step="1" value="${esc(ph.prozent)}"> % schneller rechnen</label>
        <label class="switch"><input type="radio" name="sparArt" value="stunden"${ph.sparArt === "stunden" ? " checked" : ""}>
          in der Woche <input type="number" class="kurzzahl" data-stunden min="0" step="0.5" placeholder="?" value="${esc(ph.stunden)}"> Stunden einsparen</label>
        <p class="hint">Gespart wird zuerst bei denen, die Überstunden haben. Zum Vergleich rechnet
        der Planer die Standardwoche mit und sagt, wie viel es gebracht hat.</p></div>`);
      box.querySelectorAll("[name=sparArt]").forEach(r => r.onchange = () => { ph.sparArt = r.value; sichern(); });
      box.querySelector("[data-prozent]").oninput = e => { ph.prozent = e.target.value; ph.sparArt = "prozent";
        box.querySelector("[name=sparArt][value=prozent]").checked = true; sichern(); };
      box.querySelector("[data-stunden]").oninput = e => { ph.stunden = e.target.value; ph.sparArt = "stunden";
        box.querySelector("[name=sparArt][value=stunden]").checked = true; sichern(); };
      detail.appendChild(box);
    } else if (ph.art === "mehr"){
      const box = el(`<div class="phasendetail">
        <div class="grid g2">
          <label class="f">Zusätzliche Stunden in der Woche<input type="number" data-mehr min="0" step="0.5" placeholder="z. B. 12" value="${esc(ph.mehr)}"></label>
          <label class="f">Wofür <span class="hint">optional, steht im Plan bei der Schicht</span><input type="text" data-was placeholder="z. B. Umbau Aktionsfläche" value="${esc(ph.was)}"></label>
        </div>
        <div style="margin-top:10px"><span class="eyebrow">an diesen Tagen</span>
          <div class="days" data-tage></div></div>
        <p class="hint">Keine Tage gewählt heißt: über die ganze Woche verteilt. Die Stunden gehen
        zuerst an die, die Minusstunden haben, dann an alle, die Überstunden machen können.</p></div>`);
      box.querySelector("[data-mehr]").oninput = e => { ph.mehr = e.target.value; sichern(); };
      box.querySelector("[data-was]").oninput = e => { ph.was = e.target.value.trim(); sichern(); };
      const tb = box.querySelector("[data-tage]");
      TAGE.forEach(([k,l]) => {
        const b = el(`<button class="day" aria-pressed="${ph.tage.includes(k)}">${l}</button>`);
        b.onclick = () => {
          const i = ph.tage.indexOf(k);
          if (i < 0) ph.tage.push(k); else ph.tage.splice(i,1);
          b.setAttribute("aria-pressed", ph.tage.includes(k)); sichern();
        };
        tb.appendChild(b);
      });
      detail.appendChild(box);
    }
  };
  phasenFelder();

  // Bereitschaft: Was fehlt, damit der Plan nicht auf falschen Annahmen steht?
  const bereitBox = p.querySelector("#bereit"), knopf = p.querySelector("#erzeugen");
  function bereitZeigen(){
    const b = bereitschaft(sl);
    bereitBox.innerHTML = "";
    knopf.disabled = !b.bereit;
    knopf.title = b.bereit ? "" : "Erst die rot markierten Punkte klären";
    tb.querySelectorAll(".abwzelle").forEach(td => td.classList.toggle("fehlt",
      b.blocker.some(x => x.zeiten && x.zeiten.some(z => z.mi === +td.dataset.mi && z.tag === td.dataset.tag))));
    const ziel = x => x.bereich === "planen"
      ? `<button class="btn ghost small" data-zeigen>Zeigen</button>`
      : `<button class="btn ghost small" data-bereich="${x.bereich}">Beheben</button>`;
    if (b.blocker.length){
      const box = el(`<div class="note bad"><span class="ic">!</span><span><b>Bevor der Plan entstehen kann</b></span></div>`);
      const inhalt = box.querySelector("span:last-child");
      b.blocker.forEach(x => {
        const z = el(`<div class="bereit-zeile"><span>${esc(x.text)}</span>${ziel(x)}</div>`);
        inhalt.appendChild(z);
        // Das Alter lässt sich gleich hier nachtragen — ein Tipp je Person
        (x.alter || []).forEach(mi => {
          const m = state.mitarbeiter[mi];
          const r = el(`<div class="bereit-alter"><b>${esc(m.name)}</b>
            <button class="btn ghost small" data-voll>18 oder älter</button>
            <button class="btn ghost small" data-minder>unter 18</button></div>`);
          r.querySelector("[data-voll]").onclick = () => { m.volljaehrig = true; sichern(); bereitZeigen(); };
          r.querySelector("[data-minder]").onclick = () => { m.volljaehrig = false; sichern(); bereitZeigen(); };
          inhalt.appendChild(r);
        });
      });
      bereitBox.appendChild(box);
    }
    if (b.hinweise.length){
      const box = el(`<details class="bereit-hinweise"${b.blocker.length ? "" : " open"}><summary><b>${b.hinweise.length}
        ${b.hinweise.length === 1 ? "Hinweis" : "Hinweise"}</b> — der Plan entsteht trotzdem</summary></details>`);
      b.hinweise.forEach(x => box.appendChild(el(`<div class="bereit-zeile"><span>${esc(x.text)}</span>${ziel(x)}</div>`)));
      bereitBox.appendChild(box);
    }
    bereitBox.querySelectorAll("[data-bereich]").forEach(k => k.onclick = () => oeffneBereich(k.dataset.bereich, "planen"));
    bereitBox.querySelectorAll("[data-zeigen]").forEach(k => k.onclick = () => {
      const erste = tb.querySelector(".abwzelle.fehlt");
      if (erste){ erste.scrollIntoView({block:"center", behavior:"smooth"}); const f = erste.querySelector("input"); if (f) f.focus(); }
    });
  }
  bereitZeigen();

  p.querySelector("#kw").onchange = e => { planWoche = e.target.value; render(); };
  p.querySelector("#zurueck").onclick = () => { ansicht = "start"; render(); };
  p.querySelector("#erzeugen").onclick = async () => {
    if (!bereitschaft(sl).bereit){ bereitZeigen(); bereitBox.scrollIntoView({block:"center", behavior:"smooth"}); return; }
    // Bevor geplant wird: Sind die Abgaben der Mitarbeiter da und übernommen?
    if (ONLINE_BEREIT && state.online && state.mitarbeiter.length){
      let antwort = null;
      try { antwort = await Promise.race([abgabenHolen(sl), new Promise((_, nein) => setTimeout(() => nein(new Error("Zeitüberschreitung")), 8000))]); }
      catch(e){
        if (!confirm(`Die Abgaben der Mitarbeiter ließen sich nicht prüfen (${e.message}). Plan trotzdem erstellen?`)) return;
      }
      if (antwort){
        const offen = abgabenOffen(antwort);
        if (offen.length){
          if (confirm(`${offen.length} ${offen.length === 1 ? "Abgabe ist" : "Abgaben sind"} noch nicht übernommen (${offen.map(a => a.name).join(", ")}). `
              + `Jetzt ansehen und übernehmen? (Abbrechen = Plan ohne sie erstellen)`)){ ansicht = "termine"; render(); return; }
        } else if (!antwort.vorbei && antwort.fehlen.length){
          if (!confirm(`Die Abgabe läuft noch bis ${fristText(antwort.frist)} — ${antwort.fehlen.length} haben noch nicht abgegeben `
              + `(${antwort.fehlen.join(", ")}). Plan trotzdem jetzt erstellen?`)) return;
        }
      }
    }
    if (!state.mitarbeiter.length){ alert("Ohne Personal lässt sich kein Plan erzeugen."); return; }
    const da = state.plaene[sl];
    if (ph.art === "sparen" && ph.sparArt === "stunden" && !(nz(ph.stunden) > 0)){
      alert("Bitte eintragen, wie viele Stunden in der Woche eingespart werden sollen."); return;
    }
    if (ph.art === "mehr" && !(nz(ph.mehr) > 0)){
      alert("Bitte eintragen, wie viele Stunden zusätzlich gebraucht werden."); return;
    }
    if (da && !confirm(da.geaendertVonHand || da.notizen
        ? `Für KW ${kwVon(mo)} gibt es schon einen Plan mit Änderungen von Hand. Neu erzeugen und die Änderungen verwerfen?`
        : `Für KW ${kwVon(mo)} gibt es schon einen Plan. Neu erzeugen?`)) return;
    // Rechnen dauert ein paar Sekunden — so lange zeigen, was passiert
    const schleier = el(`<div class="rechnet"><div class="rechnet-k"><div class="kreisel"></div>
      <b>Plan wird berechnet</b><span id="rechnetText">Planer rechnet …</span>
      <span class="hint">Der Optimierer prüft alle erlaubten Schichten — das dauert einige Sekunden.</span></div></div>`);
    document.body.appendChild(schleier);
    const atmen = () => new Promise(ok => setTimeout(ok, 40));
    await atmen();
    try {
      planEntwurf = await erzeugePlanBest(isoVon(mo), ph, async t => { schleier.querySelector("#rechnetText").textContent = t; });
    } finally { schleier.remove(); }
    planSpeichern(planEntwurf);
    await speichere();
    zeigeWoche = planWoche;
    ansicht = "start"; render();
  };
  return p;
}

// Ein Feld je Mitarbeiter und Tag: Auswahl, bei Zeitangaben zwei Uhrzeiten dazu
function abwFeld(abw, i, tag, nachher){
  const box = el(`<div class="abwfeld"></div>`);
  const wert = abw[i][tag];
  const art = wert ? (typeof wert === "string" ? wert : wert.a) : "";
  const s = el(`<select>${ABW.map(([v,l]) =>
    `<option value="${v}"${art === v ? " selected" : ""}>${l}</option>`).join("")}</select>`);
  box.appendChild(s);
  const zeiten = el(`<div class="abwzeiten" hidden>
    <input type="time" class="von"><input type="time" class="bis"></div>`);
  box.appendChild(zeiten);
  const vonF = zeiten.querySelector(".von"), bisF = zeiten.querySelector(".bis");
  if (wert && typeof wert === "object"){ vonF.value = wert.von || ""; bisF.value = wert.bis || ""; }

  const zeigen = () => { zeiten.hidden = !(s.value === "nur" || s.value === "ohne"); };
  const merken = () => {
    if (!s.value){ delete abw[i][tag]; }
    else if (s.value === "nur" || s.value === "ohne"){
      abw[i][tag] = {a:s.value, von:vonF.value, bis:bisF.value};
    } else abw[i][tag] = s.value;
    sichern();
    if (nachher) nachher();
  };
  s.onchange = () => { zeigen(); merken(); };
  vonF.oninput = bisF.oninput = merken;
  zeigen();
  return box;
}

// Welche Wochen stehen zur Wahl: zwei zurück, sechs nach vorn
function wochenAuswahl(gewaehlt){
  const basis = aktuellerMontag();
  const raus = [];
  for (let n = -2; n <= 6; n++){
    const d = new Date(basis); d.setDate(basis.getDate() + n*7);
    const iso = isoVon(d);
    const schon = state.plaene[wochenSchluessel(d)];
    raus.push({iso, text: `KW ${kwVon(d)} · ${deVon(d)}${n === 0 ? " · aktuell" : ""}${schon ? " · Plan vorhanden" : ""}`});
  }
  if (gewaehlt && !raus.some(w => w.iso === gewaehlt)){
    const d = montagDer(gewaehlt);
    raus.unshift({iso: gewaehlt, text: `KW ${kwVon(d)} · ${deVon(d)}`});
  }
  return raus;
}

/* ---- Terminliste --------------------------------------------------------
   Termine der Mitarbeiter — wer wann nicht kann, Urlaub, Berufsschule, nur zu
   bestimmten Zeiten — kommen über einen einzigen Eingang in die Abwesenheiten:
     · als Text, wie ihn die Seite „Termine melden“ erzeugt und die Mitarbeiter
       per WhatsApp oder Mail schicken (einfach einfügen, auch mehrere auf einmal)
     · als Excel- oder CSV-Datei nach der Vorlage
     · als .txt-Datei mit demselben Text
   Alles läuft durch dieselbe Prüfung und landet erst in einer Vorschau. Übernommen
   wird nur, was dort bestätigt wird, und der letzte Import lässt sich zurücknehmen.
   Kommen die Meldungen später einmal direkt über einen Server, ändert sich nur
   die Quelle — Prüfung und Vorschau bleiben dieselben. */

// ==== app/42-termine.js ====
/* Zeiten der Mitarbeiter: Ansicht, Vorlage, Link */

// Die Seite „Meine Zeiten“, auf der die Mitarbeiter ihre Zeiten abgeben
const TERMIN_SEITE = "https://sim-wagner.github.io/filialplaner-oberflaeche/termine.html";

// Excel-Vorlage: eine Zeile je Termin, Art als Auswahlliste, Erklärung auf Blatt 2
async function terminVorlage(){
  if (!window.ExcelJS){ alert("Excel-Bibliothek nicht geladen."); return; }
  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet("Termine");
  ws.columns = [{header:"Name", width:24}, {header:"Datum", width:13}, {header:"bis Datum", width:13},
                {header:"Art", width:16}, {header:"von", width:8}, {header:"bis", width:8}];
  ws.getRow(1).font = {bold:true};
  ws.addRow(["Beispiel: Petra Naumann", "17.11.2026", "", "nur", "08:00", "14:00"]).font = {italic:true, color:{argb:"FF888888"}};
  state.mitarbeiter.forEach(m => ws.addRow([m.name, "", "", "", "", ""]));
  for (let r = 2; r <= 200; r++){
    ws.getCell(r, 4).dataValidation = {type:"list", allowBlank:true,
      formulae:['"kann nicht,Urlaub,krank,Berufsschule,nur,nicht"'],
      showErrorMessage:true, errorTitle:"Art", error:"Bitte aus der Liste wählen."};
    ws.getCell(r, 2).numFmt = "dd.mm.yyyy"; ws.getCell(r, 3).numFmt = "dd.mm.yyyy";
  }
  ws.views = [{state:"frozen", ySplit:1}];
  const h = wb.addWorksheet("So geht's");
  [["So wird die Liste ausgefüllt"], [""],
   ["Name", "wie im Personal (Vor- und Nachname). Ein Vorname allein reicht, wenn er eindeutig ist."],
   ["Datum", "der Tag, z. B. 17.11.2026"],
   ["bis Datum", "nur bei mehreren Tagen am Stück, z. B. Urlaub — sonst leer lassen"],
   ["Art", "kann nicht · Urlaub · krank · Berufsschule · nur · nicht"],
   ["von / bis", "nur bei „nur“ (arbeitet nur in dieser Zeit) und „nicht“ (in dieser Zeit nicht)"],
   [""], ["Eine Zeile je Termin. Sonntage und Feiertage werden übersprungen."],
   ["Die Datei danach in der App unter „Plan erstellen“ → Terminliste → „Einlesen“ hineinziehen."]]
    .forEach(z => h.addRow(z));
  h.getColumn(1).width = 14; h.getColumn(2).width = 90; h.getRow(1).font = {bold:true, size:13};
  const buf = await wb.xlsx.writeBuffer();
  await anbieten(new Blob([buf], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}),
                 `Terminliste_Vorlage_N${state.nr}.xlsx`);
}

/* ---- Online-Abgabe der Mitarbeiter ----------------------------------------
   Die Mitarbeiter geben ihre Zeiten auf der Seite „Meine Zeiten“ ab (Filiale,
   Filial-Code, Name). Die Abgaben liegen auf dem Server, bis die App sie holt.
   Der Server setzt die Frist durch — Mittwoch 23:59 Uhr vor der Planwoche — und
   legt danach für jeden, der nichts abgegeben hat, eine leere Abgabe an: frei
   verfügbar. Die App gleicht dafür die Namen des Personals mit dem Server ab.
   Abgeholte Abgaben laufen durch dieselbe Vorschau wie jede Terminliste. */

// Den Text für die WhatsApp-Gruppe zeigen statt nur zu kopieren: In der App klappt die
// Zwischenablage nicht überall, und so sieht man, was man weitergibt.
function linkKasten(wohin){
  const alt = wohin.querySelector(".linkbox");
  if (alt){ alt.remove(); return; }
  const text = `Bitte tragt bis Mittwoch 23:59 Uhr eure Zeiten für den nächsten Arbeitsplan ein: ${TERMIN_SEITE}`
    + `\nFiliale: ${state.nr} · Filial-Code: ${state.online.code}`;
  const box = el(`<div class="linkbox"><textarea readonly rows="4">${esc(text)}</textarea>
    <button class="btn small">Kopieren</button><span class="hint"></span></div>`);
  const feld = box.querySelector("textarea");
  feld.onfocus = () => feld.select();

let terminVorschau = null;     // Zeilen der laufenden Prüfung

function termineAnsicht(){

      ${state.online.serverFehler ? `<p class="err">${esc(state.online.serverFehler)}</p>` : ""}

  ablage.addEventListener("drop", e => lesen([...e.dataTransfer.files]));
  feld.onchange = () => { lesen([...feld.files]); feld.value = ""; };
  async function lesen(dateien){
    sagen("");
    if (!dateien.length) return;
    const alle = [];
    for (const d of dateien){
      const n = d.name.toLowerCase();
      try {
        let ein = null;
        if (n.endsWith(".xlsx")){
          if (!window.ExcelJS) return sagen("Die Excel-Bibliothek ist nicht geladen.");
          const wb = new ExcelJS.Workbook();
          await wb.xlsx.load(await d.arrayBuffer());
          const zeilen = [];
          wb.worksheets[0].eachRow(r => { const z = []; r.eachCell({includeEmpty:true}, c => z.push(c.value && c.value.result !== undefined ? c.value.result : c.value)); zeilen.push(z); });
          ein = termineAusZeilen(zeilen, d.name);
          if (!ein) return sagen(`${d.name}: keine Spalten „Name“ und „Datum“ gefunden. Am sichersten geht es mit der Vorlage.`);
        } else if (n.endsWith(".csv")){
          ein = termineAusZeilen(csvZeilen(await d.text()), d.name);
          if (!ein) return sagen(`${d.name}: keine Spalten „Name“ und „Datum“ gefunden. Am sichersten geht es mit der Vorlage.`);
        } else if (n.endsWith(".txt") || d.type === "text/plain"){
          ein = termineAusText(await d.text()).map(e => Object.assign(e, {quelle: d.name + ", " + e.quelle}));
        } else return sagen(`${d.name}: Dieses Format kann die Terminliste nicht lesen — Excel, CSV oder Text.`);
        alle.push(...ein);
      } catch(e){ return sagen(`${d.name} ließ sich nicht lesen: ${e.message}`); }
    }
    if (!alle.length) return sagen("In der Datei stand kein Termin.");
    zeigen(termineVorbereiten(alle), dateien.map(d => d.name).join(", "));
  }

  // --- Text ---
  p.querySelector("#pruefen").onclick = () => {
    sagen("");
    const ein = termineAusText(p.querySelector("#text").value);
    if (!ein.length) return sagen("Im Text stand keine Zeile mit Datum. Eine Zeile sieht so aus: „Di 17.11.2026: kann nicht“.");
    zeigen(termineVorbereiten(ein), "dem eingefügten Text");
  };

  // --- Vorschau ---
  function vorschau(){
    const box = p.querySelector("#vorschau");
    box.innerHTML = "";
    if (!terminVorschau) return;
    const z = terminVorschau.zeilen;
    const nutzbar = z.filter(x => x.status === "ok" || x.status === "ersetzt");
    const fehler = z.filter(x => x.status === "fehler");
    const offen = [...new Set(fehler.filter(x => x.offenerName).map(x => x.nameRoh))];
    const wochen = [...new Set(nutzbar.map(x => x.sl))].sort();
    const mitPlan = wochen.filter(sl => state.plaene[sl]);
    nutzbar.forEach(x => { if (x.an === undefined) x.an = true; });

    const erledigt = z.filter(x => x.status === "gleich" && x.art !== "frei").length;

    const kopf = el(`<div class="note ${fehler.length ? "warn" : "ok"}" style="margin-top:16px"><span class="ic">${fehler.length ? "!" : "✓"}</span>
      <span><b>${nutzbar.length} ${nutzbar.length === 1 ? "Tag" : "Tage"} zum Übernehmen</b>${wochen.length
        ? ` in ${wochen.map(sl => "KW " + sl.slice(-2)).join(", ")}` : ""}${fehler.length
        ? ` · <b>${fehler.length} ${fehler.length === 1 ? "Zeile" : "Zeilen"} mit Problem</b> — ${fehler.length === 1 ? "sie wird" : "sie werden"} nicht übernommen` : ""}${
        erledigt ? ` · ${erledigt} schon erledigt oder übersprungen` : ""}.</span></div>`);

    // Unbekannte Namen gleich hier zuordnen — wird gemerkt
    if (offen.length){
      const zu = el(`<div class="tile" style="margin-top:10px"><span class="eyebrow">Wer ist gemeint?</span>
        <div class="namenzuordnung"></div>
        <p class="hint" style="margin-top:6px">Die Zuordnung wird gemerkt — beim nächsten Mal klappt es von selbst.</p></div>`);
      offen.forEach(n => {
        const r = el(`<label class="f">„${esc(n || "ohne Namen")}“<select><option value="">— auswählen —</option>${
          state.mitarbeiter.map(m => `<option>${esc(m.name)}</option>`).join("")}</select></label>`);
        r.querySelector("select").onchange = e => {
          if (!e.target.value) return;
          if (n){ state.namensZuordnung = state.namensZuordnung || {}; state.namensZuordnung[namensForm(n)] = e.target.value; }
          const i = state.mitarbeiter.findIndex(m => m.name === e.target.value);
          terminVorschau.zeilen.forEach(x => {
            if (!x.offenerName || x.nameRoh !== n) return;
            delete x.offenerName; x.i = i;
            terminVergleichen(x);
          });
          sichern(); vorschau();
        };
        zu.querySelector(".namenzuordnung").appendChild(r);
      });
      box.appendChild(zu);
    }

    // Tage ohne Einschränkung aus der Online-Abgabe nicht einzeln zeigen, sondern zusammengefasst
    const nurFrei = x => x.art === "frei" && x.status === "gleich";
    const ganzFrei = [...new Set(z.filter(x => x.online && x.i >= 0).map(x => x.i))]
      .filter(i => z.filter(x => x.i === i).every(nurFrei));
    if (ganzFrei.length) box.appendChild(el(`<p class="sub" style="margin-top:10px">Die ganze Woche frei verfügbar:
      ${ganzFrei.map(i => esc(state.mitarbeiter[i].name)).join(", ")}</p>`));
    const sortiert = z.filter(x => !nurFrei(x)).sort((a,b) => (a.i - b.i) || ((a.datum || 0) - (b.datum || 0)));
    const tab = el(`<div class="tablewrap" style="margin-top:10px"><table class="termintabelle"><thead><tr>
      <th></th><th>Mitarbeiter</th><th>Tag</th><th>Termin</th><th>Hinweis</th></tr></thead><tbody></tbody></table></div>`);
    sortiert.forEach(x => {
      const nutzt = x.status === "ok" || x.status === "ersetzt";
      const wer = x.i >= 0 ? state.mitarbeiter[x.i].name : (x.nameRoh || "—");
      const tag = x.datum ? x.datum.toLocaleDateString("de-DE", {weekday:"short", day:"2-digit", month:"2-digit", year:"numeric"}) : "—";
      const was = x.art ? terminArtText(x.art, x.zVon, x.zBis) : "—";
      const tr = el(`<tr class="t-${x.status}">
        <td>${nutzt ? `<input type="checkbox"${x.an ? " checked" : ""} aria-label="übernehmen">` : x.status === "fehler" ? "✗" : "="}</td>
        <td>${esc(wer)}</td><td>${esc(tag)}</td><td>${esc(was)}</td>
        <td>${esc(x.grund || (x.plan ? "Plan dieser Woche gibt es schon" : ""))}<span class="hint">${
          x.grund || x.plan ? " · " : ""}${esc(x.quelle)}</span></td></tr>`);
      const cb = tr.querySelector("input");
      if (cb) cb.onchange = () => { x.an = cb.checked; knopf(); };
      tab.querySelector("tbody").appendChild(tr);
    });
    box.appendChild(tab);

    const fuss = el(`<div class="actions" style="border-top:0;padding-top:6px">
      <button class="btn ghost" id="verwerfen">Verwerfen</button><div class="spacer"></div>
      <button class="btn" id="uebernehmen"></button></div>`);

    const knopf = () => {

      b.disabled = !n;

    knopf();
    fuss.querySelector("#verwerfen").onclick = () => { terminVorschau = null; vorschau(); };
    fuss.querySelector("#uebernehmen").onclick = async () => {
      const wahl = nutzbar.filter(x => x.an);
      if (!wahl.length) return;
      const ersetzt = wahl.filter(x => x.status === "ersetzt").length;
      if (ersetzt && !confirm(`${ersetzt} schon eingetragene ${ersetzt === 1 ? "Angabe wird" : "Angaben werden"} überschrieben. Weiter?`)) return;
      const wo = termineUebernehmen(wahl, terminVorschau.quelle);
      // Online-Abgaben als übernommen merken — auch die, bei denen sich nichts geändert hat
      const antwort = terminVorschau.antwort;
      if (antwort){
        state.onlineImport = state.onlineImport || {};
        const g = state.onlineImport[antwort.woche] = state.onlineImport[antwort.woche] || {};
        antwort.abgaben.forEach(a => g[a.name] = a.abgegeben);
      }
      terminVorschau = null;
      await speichere();
      const plaeneDa = wo.filter(sl => state.plaene[sl]);
      p.querySelector("#text").value = "";
      vorschau(); letzter(); online();
      p.querySelector("#letzter").prepend(el(`<div class="note ok" style="margin-top:14px"><span class="ic">✓</span><span>
        <b>${wahl.length} ${wahl.length === 1 ? "Tag" : "Tage"} übernommen.</b>${plaeneDa.length
          ? ` Für ${plaeneDa.map(sl => "KW " + sl.slice(-2)).join(", ")} gibt es schon einen Plan — damit die Termine
             darin stehen, die Woche neu erstellen.` : " Sie stehen beim nächsten Plan drin."}</span></div>`));
    };
  }

  // --- Letzter Import, zum Zurücknehmen ---
  function letzter(){
    const box = p.querySelector("#letzter");
    box.innerHTML = "";
    const imp = state.terminImport;
    if (!imp) return;
    const z = el(`<p class="hint" style="margin-top:14px">Zuletzt eingelesen am ${new Date(imp.am).toLocaleString("de-DE",
      {day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit"})}: ${imp.anzahl} ${imp.anzahl === 1 ? "Tag" : "Tage"}
      aus ${esc(imp.quelle)}. <button class="btn ghost small" id="rueck">rückgängig machen</button></p>`);
    z.querySelector("#rueck").onclick = async () => {
      if (!confirm("Den letzten Import zurücknehmen? Was vorher eingetragen war, kommt zurück.")) return;
      const n = terminImportZuruecknehmen();
      await speichere(); letzter();
      box.prepend(el(`<div class="note ok" style="margin-top:14px"><span class="ic">✓</span><span>${n} ${n === 1 ? "Tag" : "Tage"} zurückgenommen.</span></div>`));
    };
    box.appendChild(z);
  }

  p.querySelector("#zurueck").onclick = () => { terminVorschau = null; ansicht = "planen"; render(); };
  vorschau(); letzter();
  return p;
}

// Der Hinweis, der auf der Startseite steht, solange etwas abzulaufen droht
function archivHinweis(){
  const {bald, weg} = archivFaellig();
  if (!bald.length && !weg.length) return null;
  const box = el(`<div class="note warn" style="margin-bottom:14px"><span class="ic">!</span>
    <span><b>Das Archiv wird aufgeräumt.</b>
    ${weg.length ? `Älter als ${ARCHIV_WOCHEN} Wochen: ${[...new Set(weg.map(x => "KW " + x.sl.slice(-2)))].join(", ")}
       — wird gelöscht, sobald du „verstanden" tippst. ` : ""}
    ${bald.length ? `Demnächst fällig: ${[...new Set(bald.map(x => "KW " + x.sl.slice(-2)))].join(", ")}
       — in ${Math.min(...bald.map(x => x.wochen))} Woche(n). ` : ""}
    Was du behalten willst, sicherst du vorher.
    <span class="knopfreihe"></span></span></div>`);
  const reihe = box.querySelector(".knopfreihe");
  const sichern = el(`<button class="btn ghost small">Archiv sichern</button>`);
  sichern.onclick = () => archivSichern();
  const ok = el(`<button class="btn ghost small">verstanden</button>`);
  ok.onclick = async () => {
    state.archivGewarnt = state.archivGewarnt || {};
    bald.concat(weg).forEach(x => state.archivGewarnt[x.art + ":" + x.sl] = true);
    archivAufraeumen();
    await speichere();
    render();
  };
  reihe.appendChild(sichern); reihe.appendChild(ok);
  return box;
}

// Das ganze Archiv als eine Datei
function archivSichern(){
  const paket = {art:"filialplaner-archiv", filiale: state.nr, erstellt: new Date().toISOString(),
                 plaene:{}, listen:{}};
  archivSchluessel().forEach(sl => paket.plaene[sl] = state.plaene[sl]);
  listenArchivSchluessel().forEach(sl => paket.listen[sl] = state.listen[sl]);
  anbieten(new Blob([JSON.stringify(paket, null, 2)], {type:"application/json"}),
           `Filialplaner-Archiv-N${state.nr}-${new Date().toISOString().slice(0,10)}.json`);
}

  return p;
}

/* Neue Funktionen ausprobieren: Testfassung ein- und ausschalten, Testkopie zurücksetzen.
   Die echten Daten berührt die Testfassung nie — sie arbeitet mit einer Kopie, die nur
   auf diesem Gerät liegt. */
function testfassungKasten(){
  const k = el(`<div class="tile testkasten"><span class="eyebrow">Neue Funktionen ausprobieren</span>
    <div id="tfInhalt"></div><p class="err" id="tfFehler"></p></div>`);
  const inhalt = k.querySelector("#tfInhalt"), fehler = k.querySelector("#tfFehler");
  if (!TESTMODUS){
    inhalt.appendChild(el(`<div><p class="sub" style="margin:6px 0 10px">Die <b>Testfassung</b> enthält Neuerungen,
      bevor sie für alle gelten. Sie arbeitet mit einer <b>Kopie</b> deiner Filialdaten, die nur auf diesem Gerät
      liegt — dein echter Stand, deine Pläne und die Abgaben der Mitarbeiter bleiben unberührt. Zurück geht jederzeit.</p>
      <button class="btn small" id="tfAn">Testfassung ausprobieren</button></div>`));
    k.querySelector("#tfAn").onclick = async e => {
      e.target.disabled = true; e.target.textContent = "Testfassung wird geladen …"; fehler.textContent = "";
      await speichere();
      const r = await appRuf("kanal", {setzen: "test"}, 90000);
      if (!r || !r.ok){
        fehler.textContent = (r && r.fehler) || "Die Testfassung ließ sich nicht laden — ist das Gerät online?";
        e.target.disabled = false; e.target.textContent = "Testfassung ausprobieren";
      }
      // bei Erfolg lädt die App die Seite neu
    };
  } else {
    inhalt.appendChild(el(`<div><p class="sub" style="margin:6px 0 10px">Du bist in der <b>Testfassung</b>. Alles, was du
      hier änderst, landet nur in der Testkopie auf diesem Gerät.</p>
      <div class="kachelknoepfe"><button class="btn small" id="tfAus">Zurück zur stabilen Fassung</button>
      <button class="btn ghost small" id="tfNeu">Testkopie zurücksetzen</button></div>
      <p class="hint" style="margin-top:6px">Zurücksetzen holt den echten Stand frisch in die Testkopie — was du in der
      Testfassung geändert hast, ist dann weg.</p></div>`));
    k.querySelector("#tfAus").onclick = () => testfassungVerlassen();
    k.querySelector("#tfNeu").onclick = async () => {
      if (!confirm("Testkopie zurücksetzen? Alles, was du in der Testfassung geändert hast, wird verworfen. Deine echten Daten bleiben, wie sie sind.")) return;
      await appRuf("testkopieVerwerfen", {});
    };
  }
  return k;
}
async function testfassungVerlassen(){
  await speichere();
  await appRuf("kanal", {setzen: "stabil"});
}

// ==== app/45-ereignisse.js ====
/* Urlaub & Krankheit.

   Eingetragen wird hauptsächlich direkt beim Mitarbeiter (Personal → bearbeiten, oder
   im Plan auf den Namen tippen). Die Kachel „Urlaub & Krankheit“ ist die Übersicht:
   wer wann fehlt, die nächsten Wochen auf einen Blick — bearbeiten lässt es sich dort
   trotzdem. Steht für die Tage schon ein Plan, geht es von hier zu „Plan ändern“. */

const artText = art => (EREIGNIS_ARTEN.find(x => x[0] === art) || [, art])[1];
const datumText = iso => deVon(new Date(iso + "T12:00:00"));
const zeitraumText = e => datumText(e.von) + (e.bis !== e.von ? " – " + datumText(e.bis) : "");

// Eintragen: für eine feste Person (name) oder mit Auswahl
function ereignisFormular(name, nachher){
  const heute = isoVon(new Date());
  const box = el(`<div class="ereignisform">
    <div class="ereignisform-felder">
      ${name ? "" : `<label class="f">Wer?<select data-person><option value="">— auswählen —</option>${
        state.mitarbeiter.map(m => `<option>${esc(m.name)}</option>`).join("")}</select></label>`}
      <label class="f">Was?<select data-art>${EREIGNIS_ARTEN.map(([v, l]) => `<option value="${v}">${l}</option>`).join("")}</select></label>
      <label class="f">von<input type="date" data-von value="${heute}"></label>
      <label class="f">bis<input type="date" data-bis value="${heute}"></label>
      <button class="btn" data-eintragen type="button">Eintragen</button>
    </div>
    <p class="hint" data-tage></p><p class="err" data-fehler></p><div data-folgen></div></div>`);
  const von = box.querySelector("[data-von]"), bis = box.querySelector("[data-bis]");
  const zaehlen = () => {
    if (bis.value < von.value) bis.value = von.value;
    const n = von.value && bis.value ? ereignisTage({von: von.value, bis: bis.value}).length : 0;
    box.querySelector("[data-tage]").textContent = n ? `${n} ${n === 1 ? "Arbeitstag" : "Arbeitstage"} (ohne Sonn- und Feiertage)` : "";
  };
  von.oninput = bis.oninput = zaehlen; zaehlen();
  box.querySelector("[data-eintragen]").onclick = async () => {
    const fehler = box.querySelector("[data-fehler]"); fehler.textContent = "";
    const e = {name: name || box.querySelector("[data-person]").value, art: box.querySelector("[data-art]").value,
               von: von.value, bis: bis.value};
    if (!e.name){ fehler.textContent = "Bitte die Person wählen."; return; }
    let neu;
    try { neu = ereignisEintragen(e); } catch(err){ fehler.textContent = err.message; return; }
    await speichere();
    if (nachher) nachher(neu);
    const folgen = box.querySelector("[data-folgen]");
    folgen.innerHTML = ""; folgen.appendChild(ereignisFolgen(neu));
  };
  return box;
}

// Was ein Eintrag für schon erstellte Pläne bedeutet — mit dem Weg zu „Plan ändern“
function ereignisFolgen(e){
  const betroffen = ereignisBetroffen(e);
  if (!betroffen.length) return el(`<div class="note ok"><span class="ic">✓</span><span>${esc(artText(e.art))} für
    ${esc(e.name)} eingetragen. Kein bestehender Plan ist betroffen — der nächste Plan berücksichtigt es.</span></div>`);
  const n = el(`<div class="note warn"><span class="ic">!</span><span>${esc(artText(e.art))} für ${esc(e.name)} eingetragen.
    In schon erstellten Plänen stehen an diesen Tagen Schichten — sie sind unter „Plan ändern“ rot markiert.
    <span class="knopfreihe"></span></span></div>`);
  betroffen.forEach(b => {
    const k = el(`<button class="btn small" type="button">KW ${+b.sl.slice(-2)}: ${tageText(b.tage)} — Plan ändern</button>`);
    k.onclick = () => planAendernOeffnen(b.sl);
    n.querySelector(".knopfreihe").appendChild(k);
  });
  return n;
}

// Liste der Einträge, auf Wunsch nur einer Person
function ereignisListe(name, nachher){
  const heute = isoVon(new Date());
  const alle = (state.ereignisse || []).filter(e => !name || e.name === name)
    .sort((a, b) => a.von < b.von ? -1 : 1);
  const kommend = alle.filter(e => e.bis >= heute), vorbei = alle.filter(e => e.bis < heute).reverse();
  const box = el(`<div></div>`);
  const tabelle = (liste, leerText) => {
    if (!liste.length) return el(`<p class="empty">${leerText}</p>`);
    const tab = el(`<div class="tablewrap"><table class="ereignisse-tab"><thead><tr>${name ? "" : "<th>Wer</th>"}<th>Was</th>
      <th>Zeitraum</th><th class="n">Arbeitstage</th><th></th></tr></thead><tbody></tbody></table></div>`);
    liste.forEach(e => {
      const tage = ereignisTage(e).length;
      const tr = el(`<tr class="${e.bis < heute ? "ereignis-vorbei" : ""}">${name ? "" : `<td><b>${esc(e.name)}</b></td>`}
        <td><span class="tag ${e.art}">${esc(artText(e.art))}</span></td><td>${zeitraumText(e)}</td>
        <td class="n">${tage}</td><td class="n"><button class="btn ghost small" type="button">löschen</button></td></tr>`);
      tr.querySelector("button").onclick = async () => {
        if (!confirm(`Eintrag für ${e.name} löschen? Die Tage gelten wieder als verfügbar — schon erstellte Pläne ändern sich dadurch nicht.`)) return;
        ereignisLoeschen(e.id); await speichere();
        if (nachher) nachher(); else box.replaceWith(ereignisListe(name));
      };
      tab.querySelector("tbody").appendChild(tr);
    });
    return tab;
  };
  box.appendChild(tabelle(kommend, "Nichts eingetragen."));
  if (vorbei.length){
    const d = el(`<details class="vorbei"><summary class="hint">${vorbei.length} vergangene ${vorbei.length === 1 ? "Eintrag" : "Einträge"}
      — werden nach ${ARCHIV_WOCHEN} Wochen gelöscht</summary></details>`);
    d.appendChild(tabelle(vorbei, ""));
    box.appendChild(d);
  }
  return box;
}

  const wochen = [];

  const tagArt = (i, sl, k) => { const v = (((state.abwesend || {})[sl] || {})[i] || {})[k]; return v === "urlaub" || v === "krank" ? v : ""; };
  const leute = state.mitarbeiter.map((m, i) => ({m, i})).filter(({i}) =>
    wochen.some(d => TAGE.some(([k]) => tagArt(i, wochenSchluessel(d), k))));
  if (!leute.length) return el(`<p class="empty">In den nächsten acht Wochen ist niemand im Urlaub oder krank gemeldet.</p>`);
  const tab = el(`<div class="tablewrap"><table class="ueberblick"><thead><tr><th>Wer</th>${
    wochen.map(d => `<th>KW ${kwVon(d)}<span class="klein">${d.getDate()}.${d.getMonth()+1}.</span></th>`).join("")}</tr></thead><tbody>${
    leute.map(({m, i}) => `<tr><td><button class="namelink" type="button" data-i="${i}">${esc(m.name)}</button></td>${
      wochen.map(d => { const sl = wochenSchluessel(d);

          return `<i class="${a}" title="${l}${a ? ": " + artText(a) : ""}"></i>`; }).join("")}</span></td>`; }).join("")}</tr>`).join("")
    }</tbody></table></div>`);
  tab.querySelectorAll("[data-i]").forEach(b => b.onclick = () => personOeffnen(+b.dataset.i));

}
