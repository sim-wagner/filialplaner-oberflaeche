// Ostersonntag nach der gregorianischen Osterformel (Meeus/Jones/Butcher)
function ostersonntag(j){
  const a = j % 19, b = Math.floor(j / 100), c = j % 100, d = Math.floor(b / 4), e = b % 4;
  const f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
  const h = (19*a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4;
  const l = (32 + 2*e + 2*i - h - k) % 7, m = Math.floor((a + 11*h + 22*l) / 451);
  const monat = Math.floor((h + l - 7*m + 114) / 31), tag = ((h + l - 7*m + 114) % 31) + 1;
  return new Date(j, monat - 1, tag, 12);
}

const _feiertagsCache = {};

function feiertageIm(j, land){
  const sl = j + land;
  if (_feiertagsCache[sl]) return _feiertagsCache[sl];
  const o = ostersonntag(j);
  const nachOstern = n => { const d = new Date(o); d.setDate(o.getDate() + n); return d; };
  const mt = d => String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  const in_ = (...l) => l.includes(land);
  const liste = {
    "01-01":"Neujahr", [mt(nachOstern(-2))]:"Karfreitag", [mt(nachOstern(1))]:"Ostermontag",
    "05-01":"Tag der Arbeit", [mt(nachOstern(39))]:"Christi Himmelfahrt", [mt(nachOstern(50))]:"Pfingstmontag",
    "10-03":"Tag der Deutschen Einheit", "12-25":"1. Weihnachtstag", "12-26":"2. Weihnachtstag"
  };
  if (in_("BW","BY","ST")) liste["01-06"] = "Heilige Drei Könige";
  if (in_("BE") || (in_("MV") && j >= 2023)) liste["03-08"] = "Internationaler Frauentag";
  if (in_("BW","BY","HE","NW","RP","SL")) liste[mt(nachOstern(60))] = "Fronleichnam";
  // Mariä Himmelfahrt: im Saarland landesweit, in Bayern in den meisten Gemeinden
  if (in_("SL","BY")) liste["08-15"] = "Mariä Himmelfahrt";
  if (in_("TH") && j >= 2019) liste["09-20"] = "Weltkindertag";
  if (in_("BB","MV","SN","ST","TH") || (in_("HB","HH","NI","SH") && j >= 2018)) liste["10-31"] = "Reformationstag";
  if (in_("BW","BY","NW","RP","SL")) liste["11-01"] = "Allerheiligen";
  if (in_("SN")){
    // Buß- und Bettag: der Mittwoch vor dem 23. November
    const d = new Date(j, 10, 22, 12);
    while (d.getDay() !== 3) d.setDate(d.getDate() - 1);
    liste[mt(d)] = "Buß- und Bettag";
  }
  return (_feiertagsCache[sl] = liste);
}

// Ladenöffnung werktags, wo das Landesrecht sie begrenzt (Stand 11/2026; in den übrigen
// Ländern ist Mo–Sa rund um die Uhr erlaubt). Vor einer Einführung im Land prüfen.
const LADENOEFFNUNG = {BY:["06:00","20:00"], SL:["06:00","20:00"], RP:["06:00","22:00"], SN:["06:00","22:00"]};

const landVon = () => (state && state.land) || "BW";

function minuten(t){ const p = String(t || "0:00").split(":"); return (+p[0])*60 + (+p[1] || 0); }

/* --------- Planer-Maschine --------- */
const hhmm = m => String(Math.floor(m/60)).padStart(2,"0") + ":" + String(Math.round(m)%60).padStart(2,"0");

// „6:30", „0630", „6.30", „6" → Minuten seit Mitternacht; sonst null
function zeitAusText(t){
  const s = String(t).trim().replace(/\s|uhr/gi, "");
  let m = /^(\d{1,2})[:.,]?(\d{2})$/.exec(s) || /^(\d{1,2})$/.exec(s);
  if (!m) return null;
  const st = +m[1], mi = m[2] === undefined ? 0 : +m[2];
  if (st > 23 || mi > 59) return null;
  return st*60 + mi;
}

function feiertagName(d){
  const mt = String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  return feiertageIm(d.getFullYear(), landVon())[mt] || null;
}

const istFeiertag = d => !!feiertagName(d);

function montagDer(iso){
  const d = iso ? new Date(iso + "T12:00:00") : new Date();
  d.setHours(12, 0, 0, 0);       // mittags — sonst rutscht das Datum nachts über die Zeitzone
  const wt = (d.getDay() + 6) % 7;            // Mo = 0
  d.setDate(d.getDate() - wt);
  return d;
}

function naechsterMontag(){
  const d = montagDer(null); d.setDate(d.getDate() + 7); return d;
}

// In Ortszeit. toISOString() rechnet in UTC: Montag 00:30 wäre dort noch Sonntag,
// und nachts erstellt wäre der Plan für die falsche Woche entstanden.
const isoVon = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0")
                  + "-" + String(d.getDate()).padStart(2,"0");

const deVon  = d => d.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric"});

function kwVon(d){
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const tag = (t.getUTCDay() + 6) % 7;
  t.setUTCDate(t.getUTCDate() - tag + 3);
  const start = new Date(Date.UTC(t.getUTCFullYear(),0,4));
  return 1 + Math.round(((t - start)/86400000 - 3 + ((start.getUTCDay()+6)%7)) / 7);
}

// Jahr der Kalenderwoche ist das Jahr ihres Donnerstags — sonst hieße der
// 30.12.2030 (KW 1 von 2031) „2030-KW01" und kollidierte mit dem Januar 2030
function wochenSchluessel(d){
  const do_ = new Date(d); do_.setDate(d.getDate() - ((d.getDay() + 6) % 7) + 3);
  return do_.getFullYear() + "-KW" + String(kwVon(d)).padStart(2,"0");
}

// Welche Woche gehört heute nach oben? Ab Sonntag die kommende.
function aktuellerMontag(){
  const heute = new Date();
  const mo = montagDer(null);
  if ((heute.getDay() + 6) % 7 === 6) mo.setDate(mo.getDate() + 7);
  return mo;
}

function folgeSchluessel(sl){
  const d = montagAusSchluessel(sl); d.setDate(d.getDate() + 7);
  return wochenSchluessel(d);
}

// Wie viele Wochen liegt diese Woche zurück?
function wochenZurueck(schluessel, quelle){
  const alle = Object.keys(quelle);
  if (!alle.includes(schluessel)) return 0;
  const mo = (quelle[schluessel] && quelle[schluessel].mo)
    ? montagDer(quelle[schluessel].mo) : montagAusSchluessel(schluessel);
  return Math.round((aktuellerMontag() - mo) / (7*864e5));
}

// Aus „2026-KW45" den Montag der Woche zurückrechnen
function montagAusSchluessel(sl){
  const m = /^(\d{4})-KW(\d{2})$/.exec(sl);
  if (!m) return new Date();
  const d = new Date(+m[1], 0, 4);                     // der 4.1. liegt immer in KW 1
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7) + (+m[2] - 1) * 7);
  d.setHours(12,0,0,0);
  return d;
}

// ==== kern/02-hilfen.js ====
/* Zahlen, Personen, Verträge */

/* ---------------- Rechnen ---------------- */
const nz = v => { const n = parseFloat(String(v).replace(",",".")); return isFinite(n) ? n : 0; };

const hat = v => v !== "" && v !== null && v !== undefined && isFinite(parseFloat(String(v).replace(",",".")));

const hatZeit = v => typeof v === "string" && /^\d{1,2}:\d{2}$/.test(v);

const oder = (v, alt) => hat(v) ? h1(nz(v)) : (alt || "?");

const h1 = n => (Math.round(n*10)/10).toLocaleString("de-DE",{minimumFractionDigits:1,maximumFractionDigits:1});

const eur = n => Math.round(n).toLocaleString("de-DE");

function alter(gb){
  if (!gb) return null;
  const g = new Date(gb); if (isNaN(g)) return null;
  const h = new Date(); let a = h.getFullYear() - g.getFullYear();
  const m = h.getMonth() - g.getMonth();
  if (m < 0 || (m === 0 && h.getDate() < g.getDate())) a--;
  return a;
}

// Für den Jugendschutz zählt die Angabe „18 oder älter“ / „unter 18“ (volljaehrig
// true/false). Ein Geburtsdatum wird seit 13.11.2026 nicht mehr gespeichert; alte Daten
// werden beim Laden umgerechnet (normalisiere). Fehlt die Angabe, entsteht kein Plan.
function altersAngabe(m){
  const a = alter(m.geb);
  if (a !== null) return a < 18 ? "minder" : "voll";
  return m.volljaehrig === true ? "voll" : m.volljaehrig === false ? "minder" : null;
}
const minderjaehrig = m => altersAngabe(m) === "minder";

const istAzubi = m => m.typ === "Azubi";

const faktor = m => !istAzubi(m) ? 1 : (m.lehrjahr === 1 ? 0 : m.lehrjahr === 2 ? 0.5 : 1);

const stunden = m => nz(istAzubi(m) ? m.betrieb : m.vertrag);

const saldoVon = m => hat(m.saldo) ? nz(m.saldo) : 0;

const hatVertrag = m => hat(istAzubi(m) ? m.betrieb : m.vertrag);

const darfUeberstunden = m => m.ueberstunden !== false;

const AUSGLEICH_MAX = REGELN.ausgleichMax;

const viertel = n => Math.round(n * 4) / 4;

// ==== kern/03-recht.js ====
/* Arbeitsrecht: Pausen, Jugendschutz, Schichtgrenzen, Prüfung der Standardwoche */

/* --------- 5 Standardwoche --------- */
// Pausen stehen fest und werden nicht mehr je Person eingestellt.
// Über 18: ab 6 h Anwesenheit eine halbe Stunde, ab 8 h eine ganze —
//   damit immer über dem, was § 4 ArbZG verlangt (30 min über 6 h Arbeitszeit,
//   45 min über 9 h).
// Unter 18: § 11 JArbSchG — 30 min über 4,5 h Arbeitszeit, 60 min über 6 h, und
//   nie länger als 4,5 h am Stück. Gerechnet auf die Anwesenheit: Pause schon ab mehr
//   als 4,5 h (bis 12.11.2026 stand hier 5 h — eine Schicht von genau 5 h wäre dann
//   5 h am Stück gewesen), eine ganze Stunde ab mehr als 6,5 h.
// § 14 JArbSchG: Jugendliche nur zwischen 6 und 20 Uhr (bis 12.11.2026 fehlte die 6).
const JUGEND_VON = REGELN.jugendVon*60, JUGEND_BIS = REGELN.jugendBis*60;

const jugendZeit = (von, bis) => von >= JUGEND_VON && bis <= JUGEND_BIS;

function pauseGesetz(anwesend, minder){
  // Jugendliche: über der Grenze; Erwachsene: ab der Grenze (Werte in REGELN)
  if (minder){ const s = REGELN.pauseAbJugend.find(([ab]) => anwesend > ab); return s ? s[1] : 0; }
  const s = REGELN.pauseAb.find(([ab]) => anwesend >= ab);
  return s ? s[1] : 0;
}

function pauseFuer(m, anwesend){
  return pauseGesetz(anwesend, minderjaehrig(m));
}

function schicht(m, tag){
  const s = (m.standard || {})[tag];
  if (!s || !hatZeit(s.von) || !hatZeit(s.bis)) return null;
  const von = minuten(s.von), bis = minuten(s.bis);
  if (bis <= von) return null;
  const anwesend = (bis - von) / 60;
  const minder = minderjaehrig(m);
  const p = pauseFuer(m, anwesend);
  return {von, bis, anwesend, pause:p, arbeit: anwesend - p, minder};
}

function wochenStunden(m){
  return TAGE.reduce((s,[k]) => { const x = schicht(m,k); return s + (x ? x.arbeit : 0); }, 0);
}

function pruefeStandard(m){
  const out = [];
  const minder = minderjaehrig(m);
  const tage = TAGE.map(([k,l]) => ({k, l, s: schicht(m,k)}));
  const belegt = tage.filter(x => x.s);
  if (!belegt.length) return out;

  belegt.forEach(x => {
    const max = minder ? REGELN.gesetzMaxTagJugend : REGELN.gesetzMaxTag;
    if (x.s.arbeit > 8 + 0.001)
      out.push({art: x.s.arbeit > max ? "bad" : "warn",
        text:`${x.l}: ${h1(x.s.arbeit)} h Arbeitszeit` + (minder
          ? " — über 18 sind 8 h die Grenze, darunter ebenfalls 8 h ohne Ausnahme."
          : " — über 8 h nur mit Ausgleich im Schnitt über 24 Wochen.")});
    if (minder && x.s.bis > JUGEND_BIS)
      out.push({art:"bad", text:`${x.l}: Ende um ${String(Math.floor(x.s.bis/60)).padStart(2,"0")}:${String(x.s.bis%60).padStart(2,"0")} Uhr — unter 18 ist um 20:00 Uhr Schluss.`});
    if (minder && x.s.von < JUGEND_VON)
      out.push({art:"bad", text:`${x.l}: Beginn um ${String(Math.floor(x.s.von/60)).padStart(2,"0")}:${String(x.s.von%60).padStart(2,"0")} Uhr — unter 18 frühestens ab 6:00 Uhr (§ 14 JArbSchG).`});
  });

  // Ruhezeit zwischen aufeinanderfolgenden Tagen
  const noetig = ruhezeitFuer(minder);
  for (let i = 0; i < TAGE.length - 1; i++){
    const a = schicht(m, TAGE[i][0]), b = schicht(m, TAGE[i+1][0]);
    if (!a || !b) continue;
    const ruhe = (24*60 - a.bis + b.von) / 60;
    if (ruhe < noetig - 0.001)
      out.push({art:"bad", text:`${TAGE[i][1]} auf ${TAGE[i+1][1]}: nur ${h1(ruhe)} h Ruhezeit — vorgeschrieben sind ${noetig} h.`});
  }
  if (minder && belegt.length > 5)
    out.push({art:"bad", text:`${belegt.length} Arbeitstage — unter 18 sind höchstens 5 erlaubt.`});
  return out;
}

const MAXARBEIT = REGELN.maxArbeitTag;

const MINSCHICHT = REGELN.mindestSchicht;

const WUNSCHSCHICHT = REGELN.wunschSchicht;

// ==== kern/04-aufgaben.js ====
/* Wochenaufgaben je Tag und Mindestbedarf der Woche */

// Was eine Aufgabe an einem Tag verlangt: die Werte dieses Tages, wenn sie je Tag
// verschieden eingestellt ist, sonst die allgemeinen
function aufgabeAm(a, tag){
  if (!a.jeTag || !a.proTag || !a.proTag[tag]) return a;
  return Object.assign({}, a, a.proTag[tag]);
}

// Was eine Aufgabe an einem Tag verlangt: Zeitfenster und Personenzahl.
// vorgabe (aus wochenVorgabe) bringt die Art der Woche mit: in einer Sparwoche
// werden die Aufgaben kürzer gerechnet, bei Mehrbedarf kommen Zusatzaufgaben dazu.
function aufgabenAmTag(tag, tagVon, tagBis, vorgabe){
  const fest = [], flex = [];
  const kuerzer = vorgabe && vorgabe.faktor ? vorgabe.faktor : 1;
  WAREN.forEach(w => {
    const a0 = state.aufgaben[w.id];
    if (!a0.aktiv || !a0.tage.includes(tag)) return;
    const a = aufgabeAm(a0, tag);
    if (!hat(a.dauer) || !hat(a.personen)) return;
    let dauer = nz(a.dauer) * 60;
    if (kuerzer !== 1) dauer = Math.max(15, Math.round(dauer * kuerzer / 15) * 15);
    const pers = Math.max(1, Math.round(nz(a.personen)));
    const roh = {id:w.id, name:w.name, braucht:w.braucht, dauer, pers};
    if (a.zeitArt === "fest" && hatZeit(a.zeit)){
      const von = minuten(a.zeit);
      fest.push(Object.assign(roh, {von, bis: von + dauer, flex:false}));
    } else {
      const fVon = (a.zeitArt === "spanne" && hatZeit(a.fVon)) ? minuten(a.fVon) : tagVon;
      const fBis = (a.zeitArt === "spanne" && hatZeit(a.fBis)) ? minuten(a.fBis) : null;
      flex.push(Object.assign(roh, {fVon, fBis, flex:true}));
    }
  });


  // Flexible Aufgaben dorthin legen, wo am wenigsten los ist. Früher kamen sie an den
  // Tagesbeginn — genau auf die Lieferungen —, und morgens standen sieben Leute im
  // Laden, nachmittags zwei. Jetzt wird für jede Aufgabe die Zeit gesucht, in der sie
  // die wenigsten zusätzlichen Leute verlangt.
  const SL = 30, last = {};
  const offen = m => m >= tagVon && m < tagBis;
  const bedarfBei = (m, extra) => {
    const auf = (last[m] || 0) + extra;
    return offen(m) ? Math.max(MIN_BESETZUNG, auf + 1) : auf;
  };
  const eintragen = a => { for (let m = a.von; m < a.bis; m += SL) last[m] = (last[m] || 0) + a.pers; };
  fest.forEach(eintragen);

  // Lange und personalintensive Aufgaben zuerst, sie haben am wenigsten Spielraum
  flex.sort((x,y) => (y.dauer * y.pers) - (x.dauer * x.pers));
  flex.forEach(a => {
    // „Uhrzeit egal" heißt: irgendwann während der Öffnung
    const frueh = a.fBis === null ? Math.max(a.fVon, tagVon) : a.fVon;
    const spaet = (a.fBis === null ? tagBis : a.fBis) - a.dauer;
    let beste = frueh, besteKosten = Infinity;
    for (let st = Math.ceil(frueh/SL)*SL; st <= spaet; st += SL){
      let k = 0;
      for (let m = st; m < st + a.dauer; m += SL) k += bedarfBei(m, a.pers) - bedarfBei(m, 0);
      if (k < besteKosten - 0.001){ besteKosten = k; beste = st; }
    }
    a.von = beste; a.bis = beste + a.dauer;
    eintragen(a);
  });

  // Zusatzaufgaben einer Woche mit Mehrbedarf brauchen eine Person zusätzlich.
  // Morgens, wo wegen der Lieferungen ohnehin viele da sind, würde sie einfach
  // mitlaufen — dann gäbe es keine einzige Stunde mehr. Deshalb dorthin, wo die
  // wenigsten Aufgaben liegen, bei Gleichstand eher später am Tag.
  const zusatz = ((vorgabe && vorgabe.zusatz && vorgabe.zusatz[tag]) || []).map(z => {
    let beste = tagVon, besteK = Infinity;
    for (let st = Math.ceil(tagVon/SL)*SL; st + z.dauer <= tagBis; st += SL){
      let k = 0;
      for (let m = st; m < st + z.dauer; m += SL) k += last[m] || 0;
      if (k <= besteK){ besteK = k; beste = st; }
    }
    const a = {id:"zusatz", name:z.name, braucht:null, dauer:z.dauer, pers:z.pers,
               von:beste, bis:beste + z.dauer, flex:true};
    // Wie viele die Standardwoche zu diesen Zeiten im Haus hätte
    const vgl = vorgabe.basisPlan && vorgabe.basisPlan.tage.find(t => t.key === tag);
    if (vgl){
      a.basis = {};
      for (let m = a.von; m < a.bis; m += SL) a.basis[m] = vgl.schichten.filter(s => s.von <= m && s.bis > m).length;
    }
    return a;
  });

  return fest.concat(flex, zusatz).sort((x,y) => x.von - y.von);
}

function auswertung(){
  const ms = state.mitarbeiter;
  const luecken = [];                       // was fehlt und die Rechnung beeinflusst
  const anwesend = ms.reduce((s,m) => s + stunden(m), 0);
  const wirksam  = ms.reduce((s,m) => s + stunden(m) * faktor(m), 0);
  const ohneStunden = ms.filter(m => !hat(istAzubi(m) ? m.betrieb : m.vertrag));
  const ohneGeb = ms.filter(m => altersAngabe(m) === null);
  // Maßgeblich ist die Stundenliste der Woche, die gerade oben steht
  const lst = (state.listen || {})[wochenSchluessel(aktuellerMontag())] || state.budget || {stunden:{}, umsatz:{}};
  const budgetTage = TAGE.filter(([k]) => hat(lst.stunden[k])).length;
  const budget   = TAGE.reduce((s,[k]) => s + nz(lst.stunden[k]), 0);
  const umsatz   = TAGE.reduce((s,[k]) => s + nz(lst.umsatz[k]), 0);

  let aufgaben = 0, aufgabenTage = 0;
  const offeneAufgaben = [];
  WAREN.forEach(w => {
    const a = state.aufgaben[w.id];
    if (!a.aktiv) return;
    // Eine Bestellung ohne Tage gibt es hier einfach nicht — kein Grund zu mahnen
    if (!a.tage.length && w.gruppe === "bestellung") return;
    const tage = a.tage.map(k => aufgabeAm(a, k));
    if (!tage.length || tage.some(x => !hat(x.dauer) || !hat(x.personen))){ offeneAufgaben.push(w.anzeige || w.name); return; }
    aufgaben += tage.reduce((s,x) => s + nz(x.dauer) * nz(x.personen), 0);
    aufgabenTage += a.tage.length;
  });
  const qual = {};
  QUAL.forEach(([k]) => qual[k] = ms.filter(m => m.qual && m.qual.includes(k)).length);

  // Wer kann eine Schicht führen: Filialleitung selbst oder die jeweilige Vertretung
  const fuehrt = q => ms.filter(m => m.typ === "Filialleitung" || (m.qual || []).includes(q)).length;
  const fruehOk = fuehrt("frueh"), spaetOk = fuehrt("spaet");

  // Mindestbedarf der Woche — nur, soweit die Angaben reichen
  const offenBekannt = hatZeit(state.von) && hatZeit(state.bis);
  const von = minuten(state.von), bis = minuten(state.bis);
  const offenH = offenBekannt ? Math.max(0, (bis - von) / 60) : null;
  const grund  = offenH === null ? null : offenH * MIN_BESETZUNG * OEFFNUNGSTAGE;

  const frueheste = {};
  let flexible = 0;
  if (offenBekannt) WAREN.forEach(w => {
    const a0 = state.aufgaben[w.id];
    if (!a0.aktiv) return;
    let flex = false;
    a0.tage.forEach(tg => {
      const a = aufgabeAm(a0, tg);
      // zwingend vor Öffnung? feste Zeit davor, oder ein Fenster, das vorher endet
      let start = null;
      if (a.zeitArt === "fest" && hatZeit(a.zeit) && minuten(a.zeit) < von) start = minuten(a.zeit);
      else if (a.zeitArt === "spanne" && hatZeit(a.fVon) && hatZeit(a.fBis) && minuten(a.fBis) <= von) start = minuten(a.fVon);
      else if (a.zeitArt !== "fest") flex = true;
      if (start === null) return;
      frueheste[tg] = Math.min(frueheste[tg] === undefined ? von : frueheste[tg], start);
    });
    if (flex) flexible++;
  });
  const aussen = state.allein ? 1 : MIN_BESETZUNG;
  const vorlauf = Object.values(frueheste).reduce((s,m) => s + (von-m)/60 * aussen, 0);

  // Nachlauf: Aufgaben, die zwingend nach Ladenschluss enden
  const spaeteste = {};
  if (offenBekannt) WAREN.forEach(w => {
    const a0 = state.aufgaben[w.id];
    if (!a0.aktiv) return;
    a0.tage.forEach(tg => {
      const a = aufgabeAm(a0, tg);
      if (!hat(a.dauer)) return;
      let ende = null;
      if (a.zeitArt === "fest" && hatZeit(a.zeit)) ende = minuten(a.zeit) + nz(a.dauer)*60;
      else if (a.zeitArt === "spanne" && hatZeit(a.fBis)) ende = minuten(a.fBis);
      if (ende === null || ende <= bis) return;
      spaeteste[tg] = Math.max(spaeteste[tg] === undefined ? bis : spaeteste[tg], ende);
    });
  });
  const nachlauf = Object.values(spaeteste).reduce((s,e) => s + (e-bis)/60 * aussen, 0);

  let zusatz = 0;
  WAREN.forEach(w => {
    const a0 = state.aufgaben[w.id];
    if (!a0.aktiv) return;
    a0.tage.forEach(tg => {
      const a = aufgabeAm(a0, tg);
      if (!hat(a.dauer) || !hat(a.personen)) return;
      zusatz += Math.max(0, nz(a.personen) - 1) * nz(a.dauer);
    });
  });
  const bedarf = grund === null ? null : grund + vorlauf + nachlauf + zusatz;

  if (!offenBekannt)       luecken.push("Öffnungszeit — ohne sie lässt sich die Grundbesetzung nicht rechnen");
  if (offeneAufgaben.length) luecken.push("Wochenaufgaben ohne Tag, Dauer oder Personenzahl: " + offeneAufgaben.join(", "));
  if (ohneStunden.length)  luecken.push("Ohne Stundenangabe: " + ohneStunden.map(m => m.name).join(", "));
  if (ohneGeb.length)      luecken.push("Ohne Altersangabe, Jugendschutz ungeprüft: " + ohneGeb.map(m => m.name).join(", "));
  const leitung = ms.filter(m => m.typ === "Filialleitung");
  if (leitung.length && !leitung.some(m => TAGE.some(([k]) => (m.standard || {})[k] && (m.standard || {})[k].von)))
    luecken.push("Standardwoche der Filialleitung — sie ist der Fixpunkt des Wochenplans");
  if (budgetTage && budgetTage < TAGE.length) luecken.push(`Stundenliste nur für ${budgetTage} von 6 Tagen ausgefüllt`);

  const vollstaendig = offenBekannt && !offeneAufgaben.length && !ohneStunden.length;

  return {anwesend, wirksam, budget, budgetTage, umsatz, aufgaben, aufgabenTage, qual, fruehOk, spaetOk,
          offenH, grund, vorlauf, nachlauf, zusatz, bedarf, flexible, aussen, luecken, offeneAufgaben, ohneStunden, ohneGeb, vollstaendig,
          minderjaehrig: ms.filter(minderjaehrig)};
}

// ==== kern/05-planer.js ====
/* Bau eines Wochenplans und Prüfung der Besetzung */

function baueWoche(montagISO, rnd, vorgabe){
  const SLOT = 30;
  const mo = montagDer(montagISO);
  vorgabe = vorgabe || wochenVorgabe(mo);
  // Wer in dieser Woche ausfällt — krank, Urlaub, Berufsschule oder schlicht verhindert
  const abw = (state.abwesend || {})[wochenSchluessel(mo)] || {};
  // Ein Eintrag ist entweder ein ganzer Tag (Text) oder eine Zeitangabe
  // ({a:"nur"|"ohne", von, bis}) — „nur von–bis“ bzw. „nicht von–bis“.
  const eintrag = (i, tag) => (abw[i] || {})[tag] || null;
  const darfArbeiten = (i, tag, von, bis) => {
    const e = eintrag(i, tag);
    if (!e) return true;
    if (typeof e === "string") return false;
    const a = hatZeit(e.von) ? minuten(e.von) : null;
    const b = hatZeit(e.bis) ? minuten(e.bis) : null;
    if (a === null || b === null || b <= a) return true;   // unvollständig: wie verfügbar
    return e.a === "nur" ? (von >= a && bis <= b) : (bis <= a || von >= b);
  };
  const grundText = e => typeof e === "string"
    ? (ABW.find(([v]) => v === e) || ["","abwesend"])[1]
    : (e.a === "nur" ? `nur ${e.von}–${e.bis} Uhr` : `nicht ${e.von}–${e.bis} Uhr`);
  const offenVon = hatZeit(state.von) ? minuten(state.von) : 8*60;
  const offenBis = hatZeit(state.bis) ? minuten(state.bis) : 21*60;
  const wechsel  = hatZeit(state.wechsel) ? minuten(state.wechsel) : Math.round((offenVon + offenBis)/2);
  const aussen   = state.allein ? 1 : MIN_BESETZUNG;
  const ms = state.mitarbeiter;
  const soll = ms.map(m => hat(istAzubi(m) ? m.betrieb : m.vertrag) ? stunden(m) : null);
  const ziel = vorgabe.ziel;
  // Standardwochen sind gesetzt — ihre Stunden gelten von vornherein als verplant.
  // Nur die, die auch stattfinden: Urlaub und Feiertag stecken schon im Ziel.
  const standardStunden = i => TAGE.reduce((s,[k],ti) => {
    const x = schicht(ms[i], k);
    if (!x) return s;
    const d = new Date(mo); d.setDate(mo.getDate() + ti);
    return istFeiertag(d) || !darfArbeiten(i, k, x.von, x.bis) ? s : s + x.arbeit;
  }, 0);
  const rest = ms.map((m,i) => (soll[i] === null ? 0 : ziel[i]) - standardStunden(i));
  const tageGearbeitet = ms.map(() => 0);
  const letztesEnde = ms.map(() => null);
  const meldungen = [];
  const tage = [];

  TAGE.forEach(([key,label], ti) => {
    const d = new Date(mo); d.setDate(mo.getDate() + ti);
    const feiertag = istFeiertag(d);
    const tag = {key, label, datum:d, feiertag, schichten:[], aufgaben:[]};
    tage.push(tag);
    if (feiertag){ meldungen.push({art:"warn", text:`${label}, ${deVon(d)}: ${feiertagName(d)} — die Filiale bleibt geschlossen.`}); return; }

    const auf = aufgabenAmTag(key, offenVon, offenBis, vorgabe);
    tag.aufgaben = auf;
    const vortagEnde = letztesEnde.slice();     // für die Ruhezeit, wenn Schichten wachsen
    const tagVon = Math.min(offenVon, ...auf.map(a => a.von));
    const tagBis = Math.max(offenBis, ...auf.map(a => a.bis));

    const belegt = [];
    const schichtenVon = i => belegt.filter(b => b.mi === i);
    // Normalfall: höchstens eine Schicht am Tag. Wer ausdrücklich geteilt arbeiten
    // darf, bekommt eine zweite — mit Abstand, sonst wäre es eine Schicht mit Loch.
    const passtDazu = (i, von, bis) => {
      const da = schichtenVon(i);
      if (!da.length) return true;
      if (!ms[i].geteilt || da.length >= 2) return false;
      return da.every(b => von >= b.bis + 60 || bis + 60 <= b.von);
    };
    // Anwesend ist, wer im Haus ist — auch in der Pause (im Notfall rufbar).
    // Auf der Fläche steht nur, wer gerade keine Pause hat.
    const da = m => belegt.filter(b => b.von <= m && b.bis > m);
    const aufFlaeche = m => da(m).filter(b => !(b.pVon !== null && b.pVon <= m && b.pBis > m));
    const kann = (i,q) => !q || (ms[i].qual || []).includes(q);
    const fuehrt = (i,q) => ms[i].typ === "Filialleitung" || (ms[i].qual || []).includes(q);

    const bedarf = m => {
      const drin = m >= offenVon && m < offenBis;

      // Während der Öffnung: Kasse plus Aufgabenkräfte, mindestens zwei.
      // Davor und danach: nur so viele, wie die Aufgaben wirklich brauchen —
      // die Zeit allein im Laden ist die billigste, die es gibt.
      return personenBedarf(auf, m, drin, aussen);
    };
    // Mangel an einem Zeitpunkt, getrennt nach Art — die Reihenfolge der Prüfung
    // entscheidet, wer zuerst gebunden wird, deshalb steht die Führung vorn
    const mangel = (m, art) => {
      const leute = da(m);
      if (art === "fuehrung"){
        // Auch vor der Öffnung: Aufschließen kann nur, wer den Schlüssel hat —
        // Filialleitung oder Vertretung.
        const fq = m < wechsel ? "frueh" : "spaet";
        if (!leute.some(b => fuehrt(b.mi, fq))) return {art:"fuehrung", qual:fq};
        return null;
      }
      if (art === "kasse"){
        if (m >= offenVon && m < offenBis && !aufFlaeche(m).some(b => kann(b.mi,"kasse"))) return {art:"kasse", qual:"kasse"};
        return null;
      }
      if (art === "aufgabe"){
        const frei = aufFlaeche(m);
        for (const a of auf){
          if (a.von > m || a.bis <= m || !a.braucht) continue;
          if (frei.filter(b => kann(b.mi, a.braucht)).length < a.pers) return {art:"aufgabe:"+a.name, qual:a.braucht};
        }
        return null;
      }
      if (leute.length < bedarf(m)) return {art:"anzahl", qual:null};
      return null;
    };

    const regelOk = (i, von, bis) => {
      const m = ms[i];
      if (!passtDazu(i, von, bis)) return false;
      if (!darfArbeiten(i, key, von, bis)) return false;
      const minder = minderjaehrig(m);
      if (minder && !jugendZeit(von, bis)) return false;
      const schonHeute = schichtenVon(i);
      if (!schonHeute.length && tageGearbeitet[i] >= maxTageFuer(minder)) return false;
      const anw = (bis - von)/60;
      // Bei geteilten Schichten zählt der ganze Tag gegen die Tageshöchstzeit
      const heuteSchon = schonHeute.reduce((x,b) => x + (b.bis-b.von)/60 - (b.pBis === null ? 0 : (b.pBis-b.pVon)/60), 0);
      if (heuteSchon + anw - pauseFuer(m, anw) > MAXARBEIT + 0.01) return false;
      if (letztesEnde[i] !== null && (ti*24*60 + von - letztesEnde[i])/60 < ruhezeitFuer(minder) - 0.01) return false;
      return true;
    };
    const setzen = (i, von, bis, rolle, zaehlen) => {
      const m = ms[i];
      const anw = (bis-von)/60;
      const pz = pauseFuer(m, anw);
      // etwa in der Mitte der Schicht, nie am Rand
      let pVon = null, pBis = null;
      if (pz > 0){
        const laenge = pz*60;
        pVon = Math.round((von + (bis - von)/2 - laenge/2)/15)*15;
        pVon = Math.max(von + 60, Math.min(pVon, bis - 60 - laenge));
        if (pVon < von) pVon = von + Math.round((bis-von-laenge)/2/15)*15;
        pBis = pVon + laenge;
      }
      const erste = !schichtenVon(i).length;
      belegt.push({mi:i, von, bis, pVon, pBis, rollen: rolle ? [rolle] : [],
                   zaehlt: zaehlen !== false, fest: rolle === "Standard"});
      if (zaehlen !== false) rest[i] -= anw - pz;
      if (erste) tageGearbeitet[i]++;      // ein geteilter Tag bleibt ein Arbeitstag
      letztesEnde[i] = Math.max(letztesEnde[i] ?? -Infinity, ti*24*60 + bis);
    };
    // --- Bestehende Schichten verlängern oder kürzen ---------------------
    const arbeitVon = b => (b.bis - b.von)/60 - (b.pVon === null ? 0 : (b.pBis - b.pVon)/60);
    const pauseLegen = b => {
      const pz = pauseFuer(ms[b.mi], (b.bis - b.von)/60);
      if (pz > 0){
        const laenge = pz*60;
        let pv = Math.round((b.von + (b.bis - b.von)/2 - laenge/2)/15)*15;
        pv = Math.max(b.von + 60, Math.min(pv, b.bis - 60 - laenge));
        if (pv < b.von) pv = b.von + Math.round((b.bis - b.von - laenge)/2/15)*15;
        b.pVon = pv; b.pBis = pv + laenge;
      } else { b.pVon = null; b.pBis = null; }
    };
    // Zeitraum ändern: Stunden umbuchen, Pause neu legen
    const umbauen = (b, von, bis) => {
      if (b.zaehlt) rest[b.mi] += arbeitVon(b);
      b.von = von; b.bis = bis; pauseLegen(b);
      if (b.zaehlt) rest[b.mi] -= arbeitVon(b);
      letztesEnde[b.mi] = Math.max(vortagEnde[b.mi] ?? -Infinity,
        ...schichtenVon(b.mi).map(x => ti*24*60 + x.bis));
    };
    // Wie viele Halbstunden-Mängel hat der Tag gerade? Maß dafür, ob ein Umbau hilft
    const mangelZahl = () => {
      let n = 0;
      for (let m = tagVon; m < tagBis; m += SLOT)
        for (const art of ["fuehrung","kasse","aufgabe","anzahl"]) if (mangel(m, art)) n++;
      return n;
    };
    // Darf Schicht b auf von–bis wachsen?
    const dehnbar = (b, von, bis) => {
      const i = b.mi, m = ms[i];
      if (b.fest) return false;                         // Standardwochen bleiben, wie sie sind
      if (!darfArbeiten(i, key, von, bis)) return false;
      const minder = minderjaehrig(m);
      if (minder && !jugendZeit(von, bis)) return false;
      const andere = schichtenVon(i).filter(x => x !== b);
      if (andere.some(x => !(von >= x.bis + 60 || bis + 60 <= x.von))) return false;
      const anw = (bis - von)/60;
      const sonst = andere.reduce((x,y) => x + arbeitVon(y), 0);
      if (sonst + anw - pauseFuer(m, anw) > MAXARBEIT + 0.01) return false;
      if (vortagEnde[i] !== null && (ti*24*60 + von - vortagEnde[i])/60 < ruhezeitFuer(minder) - 0.01) return false;
      return true;
    };
    // Eine Lücke schließen, indem eine angrenzende Schicht wächst — statt für eine
    // Stunde Bedarf eine neue Vier-Stunden-Schicht aufzumachen
    const verlaengern = (lVon, lBis, f) => {
      const passt = b => f.art === "fuehrung" ? fuehrt(b.mi, f.qual)
                       : f.art === "anzahl" ? true : kann(b.mi, f.qual);
      const vorher = mangelZahl();
      const kand = belegt.filter(b => passt(b) && (
          (b.bis >= lVon - 60 && b.bis < lBis && b.von < lVon) ||    // endet kurz davor
          (b.von <= lBis + 60 && b.von > lVon && b.bis > lBis)));    // beginnt kurz danach
      // wem anteilig am meisten Stunden fehlen, zuerst
      kand.sort((x,y) => (rest[y.mi] / (soll[y.mi] || 1)) - (rest[x.mi] / (soll[x.mi] || 1)));
      for (const b of kand){
        const von = Math.min(b.von, lVon), bis = Math.max(b.bis, lBis);
        if (!dehnbar(b, von, bis)) continue;
        const alt = {von:b.von, bis:b.bis};
        umbauen(b, von, bis);
        if (mangelZahl() < vorher) return true;
        umbauen(b, alt.von, alt.bis);
      }
      return false;
    };

    // Pausen so legen, dass nicht alle gleichzeitig weg sind. Bei gleichen
    // Schichten landeten sie sonst alle genau in der Mitte — und die Kasse war leer.
    // Erlaubt ist jede Lage, bei der vorher und nachher höchstens sechs Stunden
    // am Stück gearbeitet wird (§ 4 ArbZG), unter 18 höchstens viereinhalb (§ 11 JArbSchG).
    const pausenVersetzen = () => {
      for (let runde = 0; runde < 2; runde++){
        if (!mangelZahl()) return;
        for (const b of belegt){
          if (b.pVon === null) continue;
          const laenge = b.pBis - b.pVon;
          // Nur Pausen anfassen, die überhaupt etwas ausmachen: ändert sich nichts,
          // wenn die Person gar keine Pause hätte, bleibt sie, wo sie ist.
          {
            const mit = mangelZahl(), alt = b.pVon;
            b.pVon = null; const ohne = mangelZahl(); b.pVon = alt;
            if (ohne === mit) continue;
          }
          const minder = minderjaehrig(ms[b.mi]);
          const amStueck = amStueckFuer(minder);
          const mitte = b.von + (b.bis - b.von)/2 - laenge/2;
          let besteLage = b.pVon, besteZahl = mangelZahl(), besteAbstand = Math.abs(b.pVon - mitte);
          for (let pv = b.von + 60; pv + laenge <= b.bis - 60; pv += 15){
            if (pv - b.von > amStueck || b.bis - (pv + laenge) > amStueck) continue;
            b.pVon = pv; b.pBis = pv + laenge;
            const z = mangelZahl(), ab = Math.abs(pv - mitte);
            if (z < besteZahl || (z === besteZahl && ab < besteAbstand - 0.1)){
              besteLage = pv; besteZahl = z; besteAbstand = ab;
            }
          }
          b.pVon = besteLage; b.pBis = besteLage + laenge;
        }
      }
    };

    let mehrarbeit = false;
    const waehle = (von, bis, q, fuehrung) => {
      let k = ms.map((m,i) => i).filter(i => regelOk(i, von, bis));
      if (fuehrung) k = k.filter(i => fuehrt(i, fuehrung));
      else if (q) k = k.filter(i => kann(i, q));
      const mitRest = k.filter(i => rest[i] > 0.5);
      mehrarbeit = !mitRest.length && k.length > 0;
      const istFuehrer = i => fuehrt(i,"frueh") || fuehrt(i,"spaet");
      const anteil = i => (soll[i] && soll[i] > 0) ? rest[i] / soll[i] : 0;

      const hatStandard = i => TAGE.some(([k2]) => (ms[i].standard || {})[k2] && (ms[i].standard || {})[k2].von);
      const freiLautStandard = i => hatStandard(i) && !schicht(ms[i], key);
      if (mitRest.length){
        mitRest.sort((x,y) => {
          // Wer laut Standardwoche heute frei hat, bleibt frei
          const sx = freiLautStandard(x) ? 1 : 0, sy = freiLautStandard(y) ? 1 : 0;
          if (sx !== sy) return sx - sy;
          // Für einfache Rollen die knappen Frühkräfte schonen (Schlüsselträger)
          if (!fuehrung || fuehrung === "spaet"){
            const fx = fuehrt(x,"frueh") ? 1 : 0, fy = fuehrt(y,"frueh") ? 1 : 0;
            if (fx !== fy) return fx - fy;
          }
          const a = anteil(y) - anteil(x);    // wem anteilig am meisten fehlt, kommt zuerst
          return Math.abs(a) > 0.02 ? a : rest[y] - rest[x];
        });
        // Mehrere Durchläufe mit unterschiedlicher Wahl unter den fast Gleichwertigen
        // liefern unterschiedliche Pläne; der ausgewogenste gewinnt später.
        if (rnd && mitRest.length > 1){
          const kopf = mitRest.filter(i => anteil(i) >= anteil(mitRest[0]) - 0.08);
          if (kopf.length > 1) return kopf[Math.floor(rnd() * kopf.length)];
        }
        return mitRest[0];
      }
      // Niemand hat mehr Reststunden: Mehrarbeit. Jetzt zählt, wer anteilig am
      // wenigsten über seinem Vertrag liegt — und wie schwer ein Überhang bei
      // dieser Art Vertrag wiegt. Minijobs und Azubis stehen deshalb hinten:
      // die einen reißen sonst die Verdienstgrenze, die anderen haben feste
      // Betriebsstunden.
      const ueber = i => soll[i] ? Math.max(0, -rest[i]) / soll[i] : 0;
      // Wer keine Überstunden machen kann, kommt nur dran, wenn sonst niemand da ist
      const rang = i => (darfUeberstunden(ms[i]) ? 0 : 200)
                      + (freiLautStandard(i) ? 100 : 0)
                      + ueber(i) * ueberGewicht(ms[i])
                      + (ms[i].typ === "Filialleitung" ? 0.15 : 0);
      k.sort((x,y) => (rang(x) - rang(y)) || (soll[y] - soll[x]) || (rest[y] - rest[x]));
      return k.length ? k[0] : -1;
    };

    // 1) Standardwochen setzen (ihre Stunden sind schon reserviert)
    ms.forEach((m,i) => {
      const s = schicht(m, key);
      if (!s) return;
      if (!darfArbeiten(i, key, s.von, s.bis)){
        // Den Grund (krank, Urlaub …) nicht in die Meldung: sie landet in der Excel-Datei,
        // und Krankheit ist ein Gesundheitsdatum (Art. 9 DSGVO)
        const e = eintrag(i, key);
        meldungen.push({art:"warn", text:`${label}: ${m.name} ${typeof e === "string" ? "fällt aus" : "ist nur eingeschränkt da (" + grundText(e) + ")"} — die Standardschicht entfällt und wird anders besetzt.`});
        return;
      }
      const minder = minderjaehrig(m);
      if (letztesEnde[i] !== null && (ti*24*60 + s.von - letztesEnde[i])/60 < ruhezeitFuer(minder) - 0.01)
        meldungen.push({art:"bad", text:`${label}: ${m.name} hat nur ${h1((ti*24*60 + s.von - letztesEnde[i])/60)} h Ruhezeit seit dem Vortag — die Standardwoche verstößt gegen die Ruhezeit.`});
      setzen(i, s.von, s.bis, "Standard", false);
    });

    // 2) Lücken im Zeitraster schließen
    const gemeldet = new Set();
    const offeneLuecken = [];
    const ARTEN = ["fuehrung","kasse","aufgabe","anzahl"];
    for (let runde = 0; runde < 80; runde++){
      let lVon = null, f = null;
      for (const art of ARTEN){
        for (let m = tagVon; m < tagBis; m += SLOT){
          const x = mangel(m, art);
          if (x && !gemeldet.has(x.art + "@" + m)){ lVon = m; f = x; break; }
        }
        if (lVon !== null) break;
      }
      if (lVon === null) break;
      let lBis = lVon + SLOT;
      while (lBis < tagBis){
        const x = mangel(lBis, f.art.startsWith("aufgabe") ? "aufgabe" : f.art);
        if (!x || x.art !== f.art) break;
        lBis += SLOT;
      }
      // Kurze Lücke: erst versuchen, eine Nachbarschicht wachsen zu lassen
      if (lBis - lVon < MINSCHICHT*60 && verlaengern(lVon, lBis, f)) continue;

      let von = lVon, bis = Math.max(lBis, von + MINSCHICHT*60);
      bis = Math.min(bis, tagBis);
      if (bis - von > REGELN.maxAnwesenheit*60) bis = von + REGELN.maxAnwesenheit*60;
      let i = waehle(von, bis, f.art === "anzahl" ? null : f.qual, f.art === "fuehrung" ? f.qual : null);
      // Niemand mehr frei: auch längere Lücken durch Verlängern versuchen
      if (i < 0 && verlaengern(lVon, lBis, f)) continue;

      // Schicht ausdehnen, aber nur so weit, wie die Person noch Stunden braucht —
      // sonst wächst der Stundenverbrauch, statt die Zerstückelung zu beenden
      if (i >= 0 && rest[i] >= MINSCHICHT && vorgabe.phase.art !== "sparen"){
        let ziel = Math.min(WUNSCHSCHICHT*60, Math.ceil(rest[i]*60/15)*15 + 30);
        ziel = Math.min(ziel, REGELN.maxAnwesenheit*60, tagBis - von);
        if (ziel > bis - von && regelOk(i, von, von + ziel)) bis = von + ziel;
      }
      // Reste am Tagesende nicht als Splitterschicht stehen lassen: nach vorne verlängern
      if (i >= 0 && bis - von < MINSCHICHT*60){
        const frueher = Math.max(tagVon, bis - MINSCHICHT*60);
        if (frueher < von && regelOk(i, frueher, bis)) von = frueher;
      }
      if (i < 0){
        for (let m = lVon; m < lBis; m += SLOT) gemeldet.add(f.art + "@" + m);
        offeneLuecken.push({art:f.art, von:lVon, bis:lBis});
        continue;
      }
      const rolle = f.art === "anzahl" ? "Fläche"
        : f.art === "kasse" ? "Kasse"
        : f.art === "fuehrung" ? (f.qual === "frueh" ? "Führung früh" : "Führung spät")
        : f.art.replace("aufgabe:","");
      setzen(i, von, bis, rolle);
      if (mehrarbeit){
        belegt[belegt.length-1].mehrarbeit = true;
        meldungen.push({art:"warn", text:`${label} ${hhmm(von)}–${hhmm(bis)}: ${ms[i].name} ist über die Vertragsstunden hinaus eingeplant — ohne Mehrarbeit wäre ${rolle === "Fläche" ? "die Mindestbesetzung" : rolle} hier unbesetzt.`});
      }
    }

    pausenVersetzen();

    // 2a) Was niemand mehr übernehmen konnte, weil alle schon eingeteilt sind:
    //     eine Schicht aus einer überbesetzten Zeit dorthin verschieben. Typisch
    //     sind sieben Leute am Morgen und abends einer — jeder kommt nur einmal am Tag.
    {
      const segmente = () => {
        const raus = [];
        for (const art of ARTEN){
          let start = null, fall = null;
          // Das Tagesende liegt nicht immer im Halbstundenraster (z. B. 21:15) —
          // deshalb einen Schritt darüber hinaus laufen, sonst bleibt die letzte
          // Lücke offen und wird weder repariert noch gemeldet.
          for (let m = tagVon; ; m += SLOT){
            const x = m < tagBis ? mangel(m, art) : null;
            if (x && start === null){ start = m; fall = x; }
            if ((!x || (fall && x.art !== fall.art)) && start !== null){
              raus.push({von:start, bis:Math.min(m, tagBis), f:fall}); start = null; fall = null;
              if (x){ start = m; fall = x; }
            }
            if (m >= tagBis) break;
          }
        }
        return raus;
      };
      let schutz = 0, geholfen = true;
      while (geholfen && schutz++ < 25){
        geholfen = false;
        const vorher = mangelZahl();
        if (!vorher) break;
        for (const lu of segmente()){
          const f = lu.f;
          // Erst die einfache Lösung: eine Nachbarschicht ein Stück länger
          if (verlaengern(lu.von, lu.bis, f)){ geholfen = true; break; }
          const passt = b => f.art === "fuehrung" ? fuehrt(b.mi, f.qual)
                           : f.art === "anzahl" ? true : kann(b.mi, f.qual);
          const kand = belegt.filter(b => !b.fest && passt(b) && (b.bis <= lu.von || b.von >= lu.bis));
          for (const b of kand){
            const laenge = Math.max(b.bis - b.von, lu.bis - lu.von, MINSCHICHT*60);
            let von = lu.von, bis = lu.von + laenge;
            if (bis > tagBis){ bis = tagBis; von = Math.max(tagVon, bis - laenge); }
            if (!dehnbar(b, von, bis)) continue;
            const alt = {von:b.von, bis:b.bis, rollen:b.rollen.slice()};
            umbauen(b, von, bis);
            if (mangelZahl() < vorher){
              b.rollen = [f.art === "anzahl" ? "Fläche" : f.art === "kasse" ? "Kasse"
                : f.art === "fuehrung" ? (f.qual === "frueh" ? "Führung früh" : "Führung spät")
                : f.art.replace("aufgabe:","")];
              geholfen = true; break;
            }
            umbauen(b, alt.von, alt.bis); b.rollen = alt.rollen;
          }
          if (geholfen) break;
        }
      }
    }

    // 2b) Überhang abbauen. Jede kurze Aufgabe hat eine eigene Schicht von
    //     mindestens vier Stunden aufgemacht; danach stehen morgens sechs Leute
    //     im Laden, die keiner braucht. Gekürzt wird nur bei denen, die schon über
    //     ihrem Vertrag liegen, und nur so weit, dass kein neuer Mangel entsteht.
    {
      const grenze = mangelZahl();
      let weiter = true, schutz = 0;
      while (weiter && schutz++ < 40){
        weiter = false;
        const reihe = belegt.filter(b => !b.fest && b.zaehlt && rest[b.mi] < -0.01)
          .sort((x,y) => (rest[x.mi] / (soll[x.mi] || 1)) - (rest[y.mi] / (soll[y.mi] || 1)));
        for (const b of reihe){
          for (const seite of ["ende", "anfang"]){
            if (rest[b.mi] >= -0.01) break;
            if (b.bis - b.von - SLOT < MINSCHICHT*60) break;
            const alt = {von:b.von, bis:b.bis};
            if (seite === "ende") umbauen(b, b.von, b.bis - SLOT);
            else umbauen(b, b.von + SLOT, b.bis);
            if (mangelZahl() > grenze) umbauen(b, alt.von, alt.bis);
            else weiter = true;
          }
        }
      }
    }

    pausenVersetzen();

    // 2c) Was jetzt noch fehlt, ist wirklich nicht zu besetzen — erst jetzt melden
    {
      const was = a => a === "anzahl" ? "die Mindestbesetzung" : a === "kasse" ? "die Kasse"
                     : a === "fuehrung" ? "die Schichtführung" : a.replace("aufgabe:","");
      for (const art of ARTEN){
        let start = null, fall = null;
        for (let m = tagVon; ; m += SLOT){
          const x = m < tagBis ? mangel(m, art) : null;
          if (x && start === null){ start = m; fall = x; }
          if (!x && start !== null){
            meldungen.push({art:"bad", text:`${label} ${hhmm(start)}–${hhmm(Math.min(m, tagBis))}: Für ${was(fall.art)} ist niemand verfügbar, der einsetzbar wäre.`});
            start = null;
          }
          if (m >= tagBis) break;
        }
      }
    }

    // 3) Rollen aus den Aufgaben nachtragen
    auf.forEach(a => {
      belegt.filter(b => b.von <= a.von && b.bis >= a.bis && (!a.braucht || kann(b.mi, a.braucht)))
        .slice(0, a.pers)
        .forEach(b => { if (!b.rollen.includes(a.name)) b.rollen.push(a.name); });
    });

    // 4) Schichten ausgeben
    tag.schichten = belegt.map(b => {
      const anw = (b.bis - b.von)/60;
      const pz = b.pVon === null ? 0 : (b.pBis - b.pVon)/60;
      return {mi:b.mi, von:b.von, bis:b.bis, pauseVon:b.pVon, pauseBis:b.pBis,
              pause:pz, arbeit: anw - pz, rollen:b.rollen, mehrarbeit: !!b.mehrarbeit};
    }).sort((x,y) => x.von - y.von || x.mi - y.mi);

    // 5) Während der Öffnung muss immer jemand auf der Fläche stehen
    for (let m = Math.max(tagVon, offenVon); m < Math.min(tagBis, offenBis); m += SLOT){
      if (!aufFlaeche(m).length){
        meldungen.push({art:"bad", text:`${label} ${hhmm(m)}: Alle Anwesenden haben gleichzeitig Pause — die Kasse wäre unbesetzt.`});
        break;
      }
    }
  });

  // Mehrarbeits-Meldungen zu einer zusammenfassen
  const mehr = meldungen.filter(x => x.text.includes("über die Vertragsstunden hinaus"));
  if (mehr.length > 3){
    const rest2 = meldungen.filter(x => !x.text.includes("über die Vertragsstunden hinaus"));
    rest2.unshift({art:"bad", text:`An ${mehr.length} Stellen musste über die Vertragsstunden hinaus geplant werden. Die Besetzungsregeln verlangen mehr Stunden, als die Verträge hergeben — siehe Schritt 7.`});
    meldungen.length = 0; meldungen.push(...rest2);
  }

  return {mo, tage, meldungen, konto:[], ziel, start: vorgabe.start, vorgabe};
}

/* ---- Aus vielen Entwürfen den ausgewogensten machen ----------------------

Der Bauschritt oben füllt Lücke für Lücke und entscheidet dabei immer nur für
den Augenblick. Das ergibt zulässige, aber schiefe Pläne: Wer früh dran ist,
sammelt Stunden, andere bleiben unter ihrem Vertrag. Deshalb entstehen hier
mehrere Entwürfe mit unterschiedlicher Wahl unter gleichwertigen Leuten, der
ausgewogenste wird genommen und danach noch einmal nachgebessert, indem ganze
Schichten von den Überbuchten zu den Unterbuchten wandern.
-------------------------------------------------------------------------- */

/* Zählt die Halbstunden, in denen ein Tag nicht richtig besetzt ist — nach
   denselben Regeln wie der Bauschritt, aber auf dem fertigen Plan. Damit prüfen
   der Ausgleich und die Gütezahl, statt sich auf Meldungen zu verlassen. */

function tagesMaengel(plan, ti){
  const t = plan.tage[ti];
  if (!t || t.feiertag) return 0;
  const ms = state.mitarbeiter;
  const offenVon = hatZeit(state.von) ? minuten(state.von) : 8*60;
  const offenBis = hatZeit(state.bis) ? minuten(state.bis) : 21*60;
  const wechsel  = hatZeit(state.wechsel) ? minuten(state.wechsel) : Math.round((offenVon + offenBis)/2);
  const aussen   = state.allein ? 1 : MIN_BESETZUNG;
  const auf = t.aufgaben || [];
  const tagVon = Math.min(offenVon, ...auf.map(a => a.von));
  const tagBis = Math.max(offenBis, ...auf.map(a => a.bis));
  // Gespeicherte Pläne kennen die Leute beim Namen — wer inzwischen fehlt, zählt ohne Funktionen
  const wer    = s => (plan.namen ? ms.find(x => x.name === plan.namen[s.mi]) : ms[s.mi]) || {qual:[]};
  const kann   = (s,q) => !q || (wer(s).qual || []).includes(q);
  const fuehrt = (s,q) => wer(s).typ === "Filialleitung" || (wer(s).qual || []).includes(q);
  let n = 0;
  for (let m = tagVon; m < tagBis; m += 30){
    const da = t.schichten.filter(s => s.von <= m && s.bis > m);
    const fl = da.filter(s => !(s.pauseVon !== null && s.pauseVon !== undefined && s.pauseVon <= m && s.pauseBis > m));
    const drin = m >= offenVon && m < offenBis;
    if (!da.some(s => fuehrt(s, m < wechsel ? "frueh" : "spaet"))) n++;
    if (drin && !fl.some(s => kann(s, "kasse"))) n++;
    for (const a of auf){
      if (a.von > m || a.bis <= m) continue;
      const br = (WAREN.find(w => w.id === a.id) || {}).braucht;
      if (br && fl.filter(s => kann(s, br)).length < a.pers){ n++; break; }
    }
    if (da.length < personenBedarf(auf, m, drin, aussen)) n++;
  }
  return n;
}

// Wie viele Leute müssen um m im Haus sein? Während der Öffnung die Kasse plus
// die Aufgabenkräfte, mindestens zwei; davor und danach nur, was die Aufgaben
// brauchen. Eine Zusatzaufgabe (Woche mit Mehrbedarf) verlangt jemanden zusätzlich
// zu denen, die die Standardwoche dort ohnehin hätte (basis) — sonst liefe sie bei
// Leuten mit, die schon da sind, und es gäbe keine einzige Stunde mehr.
function personenBedarf(auf, m, drin, aussen){
  let aufPers = 0;
  auf.forEach(a => { if (a.id !== "zusatz" && a.von <= m && a.bis > m) aufPers += a.pers; });
  let n = drin ? Math.max(MIN_BESETZUNG, aufPers + 1) : Math.max(aussen, aufPers);
  auf.forEach(a => {
    if (a.id !== "zusatz" || a.von > m || a.bis <= m) return;
    n = a.basis ? Math.max(n, (a.basis[m] || 0) + a.pers) : n + a.pers;
  });
  return n;
}

function planMaengel(plan){ return plan.tage.reduce((x,t,ti) => x + tagesMaengel(plan, ti), 0); }

/* Viele Entwürfe, Güte, Ausgleich, Auffüllen, Sparen */

const ENTWUERFE = REGELN.entwuerfe;

function wuerfel(saat){
  let x = (saat >>> 0) || 1;
  return () => { x ^= x << 13; x ^= x >>> 17; x ^= x << 5; x >>>= 0; return x / 4294967296; };
}

function istStunden(plan, i){
  return plan.tage.reduce((s,t) =>
    s + t.schichten.filter(x => x.mi === i).reduce((a,x) => a + x.arbeit, 0), 0);
}

// Je kleiner, desto besser.
//
// Gemessen wird die Abweichung **im Verhältnis** zum Vertrag, nicht in Stunden:
// 10 Stunden zu viel sind bei einem 38,5-Stunden-Vertrag etwas anderes als bei
// einer Aushilfe mit 6,5. Verlangt die Besetzung insgesamt mehr Stunden, als die
// Verträge hergeben, soll der Überhang dorthin, wo er hingehört — zu Leitung,
// Vertretung und Teilzeit. Minijobs reißen sonst die Verdienstgrenze, und die
// Betriebsstunden der Azubis stehen ohnehin fest.
function ueberGewicht(m){
  if (!darfUeberstunden(m)) return 20;
  if (m.typ === "Aushilfe (Minijob)") return 6;
  if (istAzubi(m)) return 6;
  return 1;
}

function guete(plan){
  const ms = state.mitarbeiter;
  let f = 0;
  ms.forEach((m,i) => {
    if (!hat(istAzubi(m) ? m.betrieb : m.vertrag)) return;
    const ziel = plan.ziel[i], ist = istStunden(plan, i);
    const rel = (ist - ziel) / Math.max(ziel, 4);
    // Wer schon Überstunden hat, dem tut jede weitere mehr weh — und umgekehrt
    const st = (plan.start && plan.start[i]) || 0;
    const last = ist > ziel ? ueberGewicht(m) * (1 + Math.max(0, st) / 8)
                            : 2 * (1 + Math.max(0, -st) / 8);
    f += rel * rel * last * 100;
  });
  f += planMaengel(plan) * 150;       // jede unbesetzte halbe Stunde wiegt schwer
  f += plan.tage.reduce((s,t) => s + t.schichten.length, 0) * 0.4;
  return f;
}

// Welche Funktionen eine Schicht verlangt — abgeleitet aus ihren Rollen
function rollenQual(rollen){
  const raus = [];
  (rollen || []).forEach(r => {
    if (r === "Kasse") raus.push("kasse");
    else if (r === "Führung früh") raus.push("§frueh");
    else if (r === "Führung spät") raus.push("§spaet");
    else {
      const w = WAREN.find(x => x.name === r);
      if (w && w.braucht) raus.push(w.braucht);
    }
  });
  return [...new Set(raus)];
}

function kannRollen(i, rollen){
  const m = state.mitarbeiter[i];
  return rollenQual(rollen).every(q => q.startsWith("§")
    ? (m.typ === "Filialleitung" || (m.qual || []).includes(q.slice(1)))
    : (m.qual || []).includes(q));
}

// Schichten umhängen, solange es den Plan ausgewogener macht
function ausgleichen(plan){
  const ms = state.mitarbeiter;
  const abw = (state.abwesend || {})[wochenSchluessel(plan.mo)] || {};
  const darf = (i, tag, von, bis) => {
    const e = (abw[i] || {})[tag];
    if (!e) return true;
    if (typeof e === "string") return false;
    const a = hatZeit(e.von) ? minuten(e.von) : null, b = hatZeit(e.bis) ? minuten(e.bis) : null;
    if (a === null || b === null || b <= a) return true;
    return e.a === "nur" ? (von >= a && bis <= b) : (bis <= a || von >= b);
  };
  const minderj = i => minderjaehrig(ms[i]);

  const fest = sch => (sch.rollen || []).includes("Standard");
  // Ruhezeit zu Vor- und Folgetag, wenn i am Tag ti von–bis arbeitet
  const ruheOk = (i, ti, von, bis) => {
    const noetig = ruhezeitFuer(minderj(i)) * 60;
    const vortag = ti > 0 ? plan.tage[ti-1].schichten.filter(x => x.mi === i) : [];
    const folgetag = ti < plan.tage.length-1 ? plan.tage[ti+1].schichten.filter(x => x.mi === i) : [];
    if (vortag.some(x => (24*60 - x.bis + von) < noetig - 0.5)) return false;
    if (folgetag.some(x => (24*60 - bis + x.von) < noetig - 0.5)) return false;
    return true;
  };
  // Darf i die Schicht sch am Tag ti übernehmen?
  const uebernehmbar = (i, ti, sch) => {
    const tag = TAGE[ti][0];
    if (fest(sch)) return false;
    if (!kannRollen(i, sch.rollen)) return false;
    if (!darf(i, tag, sch.von, sch.bis)) return false;
    if (minderj(i) && !jugendZeit(sch.von, sch.bis)) return false;
    if (plan.tage[ti].schichten.some(x => x.mi === i)) return false;   // nicht doppelt am Tag
    const tage = plan.tage.filter((t,k) => t.schichten.some(x => x.mi === i)).length;
    if (tage >= maxTageFuer(minderj(i))) return false;
    const anw = (sch.bis - sch.von)/60;
    if (anw - pauseFuer(ms[i], anw) > MAXARBEIT + 0.01) return false;
    return ruheOk(i, ti, sch.von, sch.bis);
  };

  // Pause und Arbeitszeit einer Schicht neu rechnen, nachdem sie die Person gewechselt hat
  const neuRechnen = sch => {
    const anw = (sch.bis - sch.von)/60;
    const pz = pauseFuer(ms[sch.mi], anw);
    if (pz > 0){
      const laenge = pz * 60;
      let pv = Math.round((sch.von + (sch.bis - sch.von)/2 - laenge/2)/15)*15;
      pv = Math.max(sch.von + 60, Math.min(pv, sch.bis - 60 - laenge));
      if (pv < sch.von) pv = sch.von + Math.round((sch.bis - sch.von - laenge)/2/15)*15;
      sch.pauseVon = pv; sch.pauseBis = pv + laenge;
    } else { sch.pauseVon = null; sch.pauseBis = null; }
    sch.pause = pz; sch.arbeit = anw - pz;
  };
  // Beim Probieren zählt nur, wer wie viel bekommt — die Pause wird erst am Ende gelegt
  const probe = (sch, i) => { sch.mi = i; neuRechnen(sch); };

  for (let runde = 0; runde < 60; runde++){
    let bestG = guete(plan), bestZug = null;

    plan.tage.forEach((t, ti) => t.schichten.forEach((sch, si) => {
      const a = sch.mi;
      const sicherung = {mi:sch.mi, pause:sch.pause, arbeit:sch.arbeit,
                         pauseVon:sch.pauseVon, pauseBis:sch.pauseBis};
      const zurueck = () => Object.assign(sch, sicherung);

      if (fest(sch)) return;
      const lueckenVorher = tagesMaengel(plan, ti);

      // a) Schicht ganz abgeben
      ms.forEach((m, i) => {
        if (i === a || !hat(istAzubi(m) ? m.betrieb : m.vertrag)) return;
        if (!uebernehmbar(i, ti, sch)) return;
        probe(sch, i);
        const g = tagesMaengel(plan, ti) > lueckenVorher ? Infinity : guete(plan);
        zurueck();
        if (g < bestG - 0.001){ bestG = g; bestZug = {art:"geben", ti, si, i}; }
      });

      // b) Zwei Schichten desselben Tages tauschen — hilft, wenn beide
      //    ohnehin arbeiten, aber unterschiedlich lang
      t.schichten.forEach((zwei, sj) => {
        if (sj <= si) return;
        const b = zwei.mi;
        if (b === a || fest(zwei)) return;
        if (!kannRollen(b, sch.rollen) || !kannRollen(a, zwei.rollen)) return;
        if (!ruheOk(b, ti, sch.von, sch.bis) || !ruheOk(a, ti, zwei.von, zwei.bis)) return;
        // wer geteilt arbeitet, hat am selben Tag noch eine Schicht — dann nicht tauschen
        if (t.schichten.filter(x => x.mi === a).length > 1 || t.schichten.filter(x => x.mi === b).length > 1) return;
        {
          const anwB = (sch.bis - sch.von)/60, anwA = (zwei.bis - zwei.von)/60;
          if (anwB - pauseFuer(ms[b], anwB) > MAXARBEIT + 0.01) return;
          if (anwA - pauseFuer(ms[a], anwA) > MAXARBEIT + 0.01) return;
        }
        if (!darf(b, TAGE[ti][0], sch.von, sch.bis) || !darf(a, TAGE[ti][0], zwei.von, zwei.bis)) return;
        if (minderj(b) && !jugendZeit(sch.von, sch.bis)) return;
        if (minderj(a) && !jugendZeit(zwei.von, zwei.bis)) return;
        const sich2 = {mi:zwei.mi, pause:zwei.pause, arbeit:zwei.arbeit,
                       pauseVon:zwei.pauseVon, pauseBis:zwei.pauseBis};
        probe(sch, b); probe(zwei, a);
        const g = tagesMaengel(plan, ti) > lueckenVorher ? Infinity : guete(plan);
        zurueck(); Object.assign(zwei, sich2);
        if (g < bestG - 0.001){ bestG = g; bestZug = {art:"tausch", ti, si, sj}; }
      });
    }));

    if (!bestZug) break;
    const t = plan.tage[bestZug.ti];
    if (bestZug.art === "geben"){
      const sch = t.schichten[bestZug.si];
      probe(sch, bestZug.i); sch.umgehaengt = true;
    } else {
      const eins = t.schichten[bestZug.si], zwei = t.schichten[bestZug.sj];
      const a = eins.mi, b = zwei.mi;
      probe(eins, b); probe(zwei, a);
      eins.umgehaengt = true; zwei.umgehaengt = true;
    }
  }
}

// Meldungen und Stundenkonto aus dem fertigen Plan
function nachrechnen(plan){
  const ms = state.mitarbeiter;
  plan.konto = [];
  // alte Stundenmeldungen des Bauschritts wegwerfen, sie passen nicht mehr
  plan.meldungen = plan.meldungen.filter(x => !x.text.includes("über die Vertragsstunden hinaus"));
  let mehr = 0;
  const start = ueberstundenZuBeginn(plan.mo);
  ms.forEach((m,i) => {
    if (!hat(istAzubi(m) ? m.betrieb : m.vertrag)) return;
    const soll = sollWoche(m, i, plan.mo), ziel = plan.ziel[i], ist = istStunden(plan, i);
    plan.konto.push({i, ist, soll, ziel, saldoAlt:start[i], saldoNeu:viertel(start[i] + ist - soll)});
    if (ist < ziel - 2) plan.meldungen.push({art:"warn", text:`${m.name}: ${h1(ist)} h verplant, Ziel ${h1(ziel)} h — es fehlen ${h1(ziel-ist)} h.`});
    if (!darfUeberstunden(m) && ist > Math.max(ziel, soll) + 0.25)
      plan.meldungen.push({art:"bad", text:`${m.name} kann keine Überstunden machen, ist aber mit ${h1(ist)} h eingeplant (Soll ${h1(soll)} h) — anders war die Besetzung nicht zu schaffen.`});
    else if (ist > ziel + 2){ mehr++; plan.meldungen.push({art:"warn", text:`${m.name}: ${h1(ist)} h verplant, Ziel ${h1(ziel)} h — ${h1(ist-ziel)} h darüber.`}); }
    if (m.typ === "Aushilfe (Minijob)" && ist > soll * 1.3 && soll > 0)
      plan.meldungen.push({art:"bad", text:`${m.name} ist Minijob mit ${h1(soll)} h und hier mit ${h1(ist)} h eingeplant — das sprengt auf den Monat gerechnet die 603-€-Grenze.`});
  });
  if (mehr >= 3){
    // Ehrlich unterscheiden: Verlangen schon die Regeln mehr Stunden, als die
    // Verträge hergeben (dann fehlt Personal), oder plant der Plan mehr als nötig?
    const vertraglich = ms.reduce((x,m,i) => x + (hat(istAzubi(m) ? m.betrieb : m.vertrag) ? plan.ziel[i] : 0), 0);
    const geplant = plan.konto.reduce((x,k) => x + k.ist, 0);
    const mindest = auswertung().bedarf;
    const text = mindest !== null && mindest > vertraglich
      ? `${mehr} Personen liegen über ihren Vertragsstunden. Schon der Mindestbedarf der Woche liegt bei `
        + `${h1(mindest)} h, die Verträge geben ${h1(vertraglich)} h her — es fehlen rund `
        + `${h1(mindest - vertraglich)} h Personal. Geplant sind ${h1(geplant)} h; der Unterschied zum `
        + `Mindestbedarf entsteht, weil Schichten nicht beliebig kurz und nicht beliebig zerstückelt sein können.`
      : `${mehr} Personen liegen über ihren Vertragsstunden: geplant ${h1(geplant)} h bei `
        + `${h1(vertraglich)} h laut Vertrag${mindest !== null ? " und einem Mindestbedarf von " + h1(mindest) + " h" : ""}.`;
    plan.meldungen.unshift({art:"bad", text});
  }

  // Gegen die Stundenliste der Woche halten, wenn es eine gibt
  const liste = (state.listen || {})[wochenSchluessel(plan.mo)];
  if (liste){
    const vorgabe = TAGE.reduce((x,[k]) => x + nz(liste.stunden[k]), 0);
    if (vorgabe > 0){
      const wirk = planSummen(plan).wirk;
      const d = wirk - vorgabe;
      plan.meldungen.unshift({art: Math.abs(d) <= vorgabe*0.05 ? "ok" : "warn",
        text:`Stundenliste KW ${kwVon(plan.mo)}: ${h1(vorgabe)} h vorgegeben, ${h1(wirk)} h leistungswirksam geplant — ${
          Math.abs(d) < 0.05 ? "genau getroffen" : (d > 0 ? h1(d) + " h darüber" : h1(-d) + " h darunter")}.`});
    }
  }
}

// summe: wohin die Woche in Stunden soll — {bis} kürzen, {auf} auffüllen. Ohne
// Angabe wird nur bei denen aufgefüllt, die unter ihrem Ziel liegen.
function erzeugePlanRoh(montagISO, phase, summe, basisPlan){
  const vorgabe = wochenVorgabe(montagDer(montagISO), phase);
  vorgabe.basisPlan = basisPlan || null;
  let beste = null, besteGuete = Infinity;
  for (let n = 0; n < ENTWUERFE; n++){
    const entwurf = baueWoche(montagISO, n === 0 ? null : wuerfel(n * 2654435761), vorgabe);
    const g = guete(entwurf);
    if (g < besteGuete){ besteGuete = g; beste = entwurf; }
  }
  ausgleichen(beste);
  const ph = vorgabe.phase;
  if (ph.art === "sparen") sparenKuerzen(beste, summe ? summe.bis : 0);
  else {
    // Die Stundenliste der Bereichsleitung ist die Obergrenze fürs Auffüllen
    const liste = (state.listen || {})[wochenSchluessel(beste.mo)];
    const vorgabeListe = liste ? TAGE.reduce((x,[k]) => x + nz(liste.stunden[k]), 0) : 0;
    const jetzt = planSummen(beste);
    let grenze = summe && summe.auf !== undefined ? summe.auf : Infinity;
    // Die Liste zählt leistungswirksame Stunden, aufgefüllt werden bezahlte
    if (vorgabeListe > 0) grenze = Math.min(grenze, jetzt.bezahlt + Math.max(0, vorgabeListe - jetzt.wirk));
    auffuellen(beste, grenze, ph.art === "mehr" ? ph.tage : null);
    if (summe && summe.auf !== undefined && planSummen(beste).bezahlt > summe.auf + 0.5) sparenKuerzen(beste, summe.auf);
  }
  nachrechnen(beste);
  beste.phase = vorgabe.phase;
  return beste;
}

function erzeugePlan(montagISO, phase){
  const ph = phaseNormal(phase);
  if (ph.art === "normal") return erzeugePlanRoh(montagISO, ph);
  // In einer besonderen Woche zum Vergleich auch die normale rechnen — sonst weiß
  // niemand, was die Einstellung gebracht hat. Die Sparwoche braucht sie ohnehin:
  // „15 Stunden weniger“ heißt weniger als die Standardwoche.
  const normalPlan = erzeugePlanRoh(montagISO, {art:"normal"});
  const normal = planSummen(normalPlan).bezahlt;
  const summe = ph.art === "mehr" ? {auf: normal + Math.max(0, nz(ph.mehr))}
              : ph.sparArt === "stunden" ? {bis: normal - Math.max(0, nz(ph.stunden))}
              : {bis: 0};                                  // Prozent: so weit es geht
  const plan = erzeugePlanRoh(montagISO, ph, summe, ph.art === "mehr" ? normalPlan : null);
  phasenMeldung(plan, ph, normal);
  return plan;
}

// Oben in den Hinweisen: was die Art der Woche gegenüber der Standardwoche gebracht hat
function phasenMeldung(plan, ph, normal){
  const jetzt = planSummen(plan).bezahlt, d = jetzt - normal;
  const vergleich = `${h1(jetzt)} h geplant, als Standardwoche wären es ${h1(normal)} h — `
    + (Math.abs(d) < 0.05 ? "kein Unterschied" : d < 0 ? h1(-d) + " h weniger" : h1(d) + " h mehr");
  const gewollt = ph.art === "mehr" ? nz(ph.mehr) : ph.sparArt === "stunden" ? nz(ph.stunden) : null;
  const verfehlt = gewollt !== null && Math.abs(Math.abs(d) - gewollt) > 2;
  plan.meldungen.unshift({art: verfehlt ? "warn" : "ok", text: (ph.art === "sparen"
    ? `Sparwoche (${phasenText(ph)}): ${vergleich}.`
      + (verfehlt ? ` Mehr ließ sich nicht einsparen, ohne dass Kasse, Führung, Aufgaben oder die Mindestbesetzung von zwei Personen reißen.` : "")
    : `Woche mit Mehrbedarf (${phasenText(ph)}): ${vergleich}.`
      + (verfehlt ? ` Genauer ging es nicht — Schichten sind mindestens vier Stunden lang, und niemand darf über acht Stunden am Tag.` : ""))});
}

/* Schichten eines fertigen Plans nachträglich länger oder kürzer machen — mit
   denselben Regeln wie beim Bauen. Die Pause bleibt, wo sie war, solange sie dort
   noch erlaubt ist; sonst rückt sie in die Mitte. */

function schichtWerkzeug(plan){
  const ms = state.mitarbeiter;
  const abw = (state.abwesend || {})[wochenSchluessel(plan.mo)] || {};
  const minderj = i => minderjaehrig(ms[i]);
  const pauseAnpassen = sch => {
    const m = ms[sch.mi], anw = (sch.bis - sch.von)/60, pz = pauseFuer(m, anw);
    if (!pz){ sch.pauseVon = null; sch.pauseBis = null; }
    else {
      const laenge = pz * 60;
      const amStueck = amStueckFuer(minderj(sch.mi));
      const ok = v => v !== null && v !== undefined && v >= sch.von + 60 && v + laenge <= sch.bis - 60
                   && v - sch.von <= amStueck && sch.bis - (v + laenge) <= amStueck;
      let pv = sch.pauseVon;
      if (!ok(pv)){
        pv = Math.round((sch.von + (sch.bis - sch.von)/2 - laenge/2) / 15) * 15;
        pv = Math.max(sch.von + 60, Math.min(pv, sch.bis - 60 - laenge));
      }
      sch.pauseVon = pv; sch.pauseBis = pv + laenge;
    }
    sch.pause = pz; sch.arbeit = anw - pz;
  };
  // Darf i am Tag ti von–bis arbeiten? Abwesenheit, Jugendschutz, Ruhezeit, 8 Stunden
  const erlaubt = (i, ti, von, bis) => {
    const e = (abw[i] || {})[TAGE[ti][0]];
    if (e){
      if (typeof e === "string") return false;
      const a = hatZeit(e.von) ? minuten(e.von) : null, b = hatZeit(e.bis) ? minuten(e.bis) : null;
      if (a !== null && b !== null && b > a && !(e.a === "nur" ? (von >= a && bis <= b) : (bis <= a || von >= b))) return false;
    }
    if (minderj(i) && !jugendZeit(von, bis)) return false;
    const anw = (bis - von)/60;
    if (anw - pauseFuer(ms[i], anw) > MAXARBEIT + 0.01) return false;
    const noetig = ruhezeitFuer(minderj(i)) * 60;
    const vor = ti > 0 ? plan.tage[ti-1].schichten.filter(x => x.mi === i) : [];
    const nach = ti < plan.tage.length-1 ? plan.tage[ti+1].schichten.filter(x => x.mi === i) : [];
    if (vor.some(x => 24*60 - x.bis + von < noetig - 0.5)) return false;
    if (nach.some(x => 24*60 - bis + x.von < noetig - 0.5)) return false;
    return true;
  };
  // Zeitraum, in dem an einem Tag überhaupt jemand gebraucht wird
  const rahmen = ti => {
    const auf = plan.tage[ti].aufgaben || [];
    const offenVon = hatZeit(state.von) ? minuten(state.von) : 8*60;
    const offenBis = hatZeit(state.bis) ? minuten(state.bis) : 21*60;
    return [Math.min(offenVon, ...auf.map(a => a.von)), Math.max(offenBis, ...auf.map(a => a.bis))];
  };
  // Schichten, die man anfassen darf: keine Standardschicht, kein geteilter Tag
  const beweglich = (t, sch) => !(sch.rollen || []).includes("Standard")
                                && t.schichten.filter(x => x.mi === sch.mi).length === 1;
  return {pauseAnpassen, erlaubt, rahmen, beweglich};
}

/* Auffüllen: Wer unter seinem Ziel liegt — meist, weil er Minusstunden hat —,
   bekommt seine Schicht in halben Stunden verlängert, solange Regeln und Besetzung
   es zulassen und die Woche unter grenze Stunden bleibt. Bei einer Stundenliste
   ist deren Vorgabe die Grenze. nurTage: in einer Woche mit Mehrbedarf nur dort. */

function auffuellen(plan, grenze, nurTage){
  const w = schichtWerkzeug(plan);
  const summe = () => planSummen(plan).bezahlt;
  for (let schutz = 0; schutz < 500 && summe() < grenze - 0.01; schutz++){
    let bester = null;
    plan.tage.forEach((t, ti) => {
      if (t.feiertag || (nurTage && nurTage.length && !nurTage.includes(t.key))) return;
      const [tagVon, tagBis] = w.rahmen(ti);
      const vorher = tagesMaengel(plan, ti);
      t.schichten.forEach(sch => {
        if (!w.beweglich(t, sch)) return;
        const fehlt = plan.ziel[sch.mi] - istStunden(plan, sch.mi);
        if (fehlt < 0.5 || (bester && fehlt <= bester.fehlt)) return;
        for (const [dv, db] of [[0,30],[-30,0],[0,60],[-60,0]]){
          const von = sch.von + dv, bis = sch.bis + db;
          if (von < tagVon || bis > tagBis || !w.erlaubt(sch.mi, ti, von, bis)) continue;
          const alt = {von:sch.von, bis:sch.bis, pauseVon:sch.pauseVon, pauseBis:sch.pauseBis, pause:sch.pause, arbeit:sch.arbeit};
          sch.von = von; sch.bis = bis; w.pauseAnpassen(sch);
          const gewinn = sch.arbeit - alt.arbeit;
          const geht = gewinn > 0.01 && gewinn <= fehlt + 0.01 && tagesMaengel(plan, ti) <= vorher;
          Object.assign(sch, alt);
          if (geht){ bester = {sch, von, bis, fehlt}; break; }
        }
      });
    });
    if (!bester) break;
    bester.sch.von = bester.von; bester.sch.bis = bester.bis;
    w.pauseAnpassen(bester.sch);
    bester.sch.verlaengert = true;
  }
}

/* Sparwoche: Schichten in halben Stunden kürzen, bis die Woche bei zielSumme
   Stunden liegt oder nichts mehr geht. Gekürzt wird nur, was keine Lücke reißt
   (gleiche Prüfung wie überall: Führung, Kasse, Aufgaben, Mindestbesetzung), keine
   Standardschicht, nichts unter vier Stunden. Zuerst bei dem, der am weitesten
   über seinem Ziel liegt. */

function sparenKuerzen(plan, zielSumme){
  const w = schichtWerkzeug(plan), pauseAnpassen = w.pauseAnpassen;
  const summe = () => planSummen(plan).bezahlt;
  for (let schutz = 0; schutz < 500 && summe() > zielSumme + 0.01; schutz++){
    let bester = null;
    plan.tage.forEach((t, ti) => {
      if (t.feiertag) return;
      const vorher = tagesMaengel(plan, ti);
      t.schichten.forEach(sch => {
        if (!w.beweglich(t, sch)) return;
        if (sch.bis - sch.von - 30 < MINSCHICHT * 60) return;
        const ueber = istStunden(plan, sch.mi) - plan.ziel[sch.mi];
        for (const seite of ["ende", "anfang"]){
          const alt = {von:sch.von, bis:sch.bis, pauseVon:sch.pauseVon, pauseBis:sch.pauseBis, pause:sch.pause, arbeit:sch.arbeit};
          if (seite === "ende") sch.bis -= 30; else sch.von += 30;
          pauseAnpassen(sch);
          const geht = tagesMaengel(plan, ti) <= vorher;
          Object.assign(sch, alt);
          if (geht && (!bester || ueber > bester.ueber + 0.01)) bester = {sch, seite, ueber};
        }
      });
    });
    if (!bester) break;
    if (bester.seite === "ende") bester.sch.bis -= 30; else bester.sch.von += 30;
    pauseAnpassen(bester.sch);
    bester.sch.gekuerzt = true;
  }
}

/* ---- Art der Woche (testweise) ------------------------------------------
   normal  — alles wie hinterlegt
   sparen  — Stunden auf das Nötige: entweder alle Aufgaben um einen Prozentsatz
             kürzer gerechnet (Standard 10 %) oder eine Zahl Stunden, die in der
             Woche wegfallen soll
   mehr    — zusätzliche Stunden für kurzfristige Aufgaben, an gewählten Tagen
   Daraus entsteht für den Planer die Vorgabe: Zielstunden je Mitarbeiter, ein
   Faktor für die Aufgabendauer und gegebenenfalls Zusatzaufgaben. */

function planSummen(plan){
  const proTag = plan.tage.map(t => {
    const bezahlt = t.schichten.reduce((s,x) => s + x.arbeit, 0);
    const wer = x => (plan.namen ? state.mitarbeiter.find(m => m.name === plan.namen[x.mi]) : state.mitarbeiter[x.mi]) || {};
    const wirk = t.schichten.reduce((s,x) => s + x.arbeit * faktor(wer(x)), 0);
    return {bezahlt, wirk};
  });
  return {proTag,
    bezahlt: proTag.reduce((s,x) => s + x.bezahlt, 0),
    wirk: proTag.reduce((s,x) => s + x.wirk, 0)};
}

// ==== kern/07-phasen.js ====
/* Art der Woche: Standard, Sparen, Mehr */

function phaseNormal(ph){
  ph = Object.assign({art:"normal", sparArt:"prozent", prozent:10, stunden:"", mehr:"", tage:[], was:""}, ph || {});
  if (!["normal","sparen","mehr"].includes(ph.art)) ph.art = "normal";
  return ph;
}

function phasenText(ph){
  ph = phaseNormal(ph);
  if (ph.art === "sparen") return ph.sparArt === "stunden" ? `${h1(nz(ph.stunden))} h weniger`
                                                           : `Aufgaben ${nz(ph.prozent)} % kürzer`;
  if (ph.art === "mehr") return `+${h1(nz(ph.mehr))} h${ph.was ? " für " + ph.was : ""}`;
  return "Standardwoche";
}

function wochenVorgabe(mo, phase){
  const ph = phaseNormal(phase);
  const ms = state.mitarbeiter;
  const start = ueberstundenZuBeginn(mo);
  // Grundziel: Soll der Woche, um höchstens AUSGLEICH_MAX Stunden in Richtung null
  // verschoben — wer Überstunden hat, bekommt weniger, wer Minusstunden hat, mehr
  const ziel = ms.map((m, i) => {
    const soll = sollWoche(m, i, mo);
    if (soll === null) return 0;
    const s = Math.max(-AUSGLEICH_MAX, Math.min(AUSGLEICH_MAX, start[i] || 0));
    return Math.max(0, soll - s);
  });
  const vorgabe = {phase: ph, ziel, start, faktor: 1, zusatz: {}};
  const offeneTage = TAGE.map(([k], ti) => { const d = new Date(mo); d.setDate(mo.getDate() + ti); return istFeiertag(d) ? null : k; })
                         .filter(Boolean);

  // Stunden aus den Zielen nehmen: zuerst bei denen mit Überstunden, dann anteilig
  const wegnehmen = h => {
    let rest = h;
    ms.map((m,i) => i).filter(i => (start[i] || 0) > 0).sort((a,b) => start[b] - start[a]).forEach(i => {
      const d = Math.min(rest, start[i], ziel[i]); ziel[i] -= d; rest -= d;
    });
    const summe = ziel.reduce((s,z) => s + z, 0);
    if (rest > 0 && summe > 0) ziel.forEach((z,i) => ziel[i] = Math.max(0, z - rest * z / summe));
  };
  // Stunden dazugeben: zuerst an die mit Minusstunden, dann anteilig an alle,
  // die Überstunden machen können
  const dazugeben = h => {
    let rest = h;
    ms.map((m,i) => i).filter(i => (start[i] || 0) < 0 && hatVertrag(ms[i])).sort((a,b) => start[a] - start[b]).forEach(i => {
      const d = Math.min(rest, -start[i]); ziel[i] += d; rest -= d;
    });
    const wer = ms.map((m,i) => i).filter(i => hatVertrag(ms[i]) && darfUeberstunden(ms[i]));
    const summe = wer.reduce((s,i) => s + stunden(ms[i]), 0);
    if (rest > 0 && summe > 0) wer.forEach(i => ziel[i] += rest * stunden(ms[i]) / summe);
  };

  if (ph.art === "sparen"){
    if (ph.sparArt === "stunden") wegnehmen(Math.max(0, nz(ph.stunden)));
    else {
      const p = Math.max(0, Math.min(50, nz(ph.prozent)));
      vorgabe.faktor = 1 - p / 100;
      // Was die Aufgaben weniger brauchen, fällt auch bei den Zielen weg
      const aufgabenStunden = offeneTage.reduce((s, k) =>
        s + aufgabenAmTag(k, 8*60, 21*60).reduce((x, a) => x + a.dauer * a.pers / 60, 0), 0);
      wegnehmen(aufgabenStunden * p / 100);
    }
  } else if (ph.art === "mehr" && nz(ph.mehr) > 0){
    const tage = (ph.tage && ph.tage.length ? ph.tage : TAGE.map(([k]) => k)).filter(k => offeneTage.includes(k));
    if (tage.length){
      const proTag = nz(ph.mehr) / tage.length;
      // mehr als sechs Stunden am Tag auf mehrere Personen verteilen
      const pers = Math.max(1, Math.ceil(proTag / 6));
      const dauer = Math.max(30, Math.round(proTag / pers * 60 / 15) * 15);
      tage.forEach(k => vorgabe.zusatz[k] = [{name: ph.was ? ph.was : "Zusatzaufgabe", dauer, pers}]);
      dazugeben(nz(ph.mehr));
    }
  }
  return vorgabe;
}

// ==== kern/08-konto.js ====
/* Überstundenkonto */

// An welcher Stelle steht m im gespeicherten Plan? Pläne merken sich die Namen —
// sonst verrutscht alles, sobald jemand aus dem Personal entfernt wird.
function planIndex(plan, m, i){
  return plan && plan.namen ? plan.namen.indexOf(m.name) : i;
}

function sollWoche(m, i, mo){
  if (!hatVertrag(m)) return null;
  const soll = stunden(m);
  const abw = ((state.abwesend || {})[wochenSchluessel(mo)] || {})[i] || {};
  const std = TAGE.filter(([k]) => schicht(m, k)).map(([k]) => k);
  const tageProWoche = std.length || 5;
  let bezahlt = 0;
  TAGE.forEach(([k], ti) => {
    if (std.length && !std.includes(k)) return;        // an dem Tag hätte er ohnehin frei
    const d = new Date(mo); d.setDate(mo.getDate() + ti);
    if (istFeiertag(d) || abw[k] === "urlaub" || abw[k] === "krank") bezahlt++;
  });
  return Math.max(0, soll - soll / tageProWoche * Math.min(bezahlt, tageProWoche));
}

// Ist minus Soll in einer gespeicherten Woche
function wochenAenderung(kurz, m, i){
  const j = planIndex(kurz, m, i);
  if (j < 0 || !hatVertrag(m)) return 0;
  return viertel(istStunden(kurz, j) - sollWoche(m, i, montagDer(kurz.mo instanceof Date ? isoVon(kurz.mo) : kurz.mo)));
}

// Stand zu Beginn der Woche mo, je Mitarbeiter (null ohne Vertragsstunden)
function ueberstundenZuBeginn(mo){
  const ziel = wochenSchluessel(mo);
  const wochen = Object.keys(state.plaene || {}).sort();
  return state.mitarbeiter.map((m, i) => {
    if (!hatVertrag(m)) return null;
    let s = saldoVon(m);
    wochen.forEach(sl => {
      if (sl >= (m.saldoAb || ziel) && sl < ziel) s += wochenAenderung(state.plaene[sl], m, i);
    });
    return viertel(s);
  });
}

// Bevor eine alte Woche oder ihre Abwesenheiten gelöscht werden: ihre Stunden —
// und die aller Wochen davor — fest in den Stand übernehmen. Sonst fielen sie mit
// dem Plan aus der Rechnung, und ohne die Abwesenheiten stimmte das Soll nicht mehr.
function bisInStandUebernehmen(sl){
  Object.keys(state.plaene || {}).filter(x => x <= sl).sort().forEach(x => {
    state.mitarbeiter.forEach((m, i) => {
      if (!m.saldoAb || m.saldoAb > x) return;
      m.saldo = viertel(saldoVon(m) + wochenAenderung(state.plaene[x], m, i));
      m.saldoAb = folgeSchluessel(x);
    });
  });
  // Auch ohne Plan in dieser Woche: der Stichtag rückt nach, damit nichts doppelt zählt
  state.mitarbeiter.forEach(m => { if (m.saldoAb && m.saldoAb <= sl) m.saldoAb = folgeSchluessel(sl); });
}

const ueText = n => n === null || n === undefined ? ""
  : (n > 0.01 ? "+" : n < -0.01 ? "−" : "") + h1(Math.abs(n));

// ==== kern/09-plaene.js ====
/* Pläne speichern, laden, nach Änderung von Hand prüfen */

// Plan für die Ablage in ein schlichtes Format bringen und zurück
function planSpeichern(plan){
  const kurz = {
    mo: isoVon(plan.mo),
    erstellt: new Date().toISOString(),
    meldungen: plan.meldungen,
    konto: plan.konto || [],
    namen: state.mitarbeiter.map(m => m.name),
    phase: JSON.parse(JSON.stringify(plan.phase || phaseNormal())),
    berechnung: plan.berechnung || null,
    tage: plan.tage.map(tg => ({
      key: tg.key, label: tg.label, datum: isoVon(tg.datum), feiertag: tg.feiertag,
      aufgaben: tg.aufgaben.map(a => Object.assign({id:a.id, name:a.name, von:a.von, bis:a.bis, pers:a.pers},
                                                   a.basis ? {basis:a.basis} : {})),
      schichten: tg.schichten.map(s => ({mi:s.mi, von:s.von, bis:s.bis, pauseVon:s.pauseVon,
        pauseBis:s.pauseBis, pause:s.pause, arbeit:s.arbeit, rollen:s.rollen, mehrarbeit:s.mehrarbeit}))
    }))
  };
  state.plaene[wochenSchluessel(plan.mo)] = kurz;
  return kurz;
}

function planLaden(kurz){
  if (!kurz) return null;
  return {
    mo: new Date(kurz.mo + "T12:00:00"),
    meldungen: kurz.meldungen || [],
    konto: kurz.konto || [],
    // ohne diese drei gingen Notizen, Handänderungen und Buchung beim Laden verloren
    notizen: kurz.notizen || {},
    geaendertVonHand: !!kurz.geaendertVonHand,
    namen: kurz.namen || null,
    phase: phaseNormal(kurz.phase),
    berechnung: kurz.berechnung || null,
    tage: (kurz.tage || []).map(tg => Object.assign({}, tg, {datum: new Date(tg.datum + "T12:00:00")}))
  };
}

/* ---- Überstunden ----------------------------------------------------------
   Jeder Mitarbeiter hat einen Stand (saldo), der zu Beginn der Woche saldoAb galt
   — festgehalten, wenn er im Personal eingetragen wird. Jede Woche ab dann, für
   die es einen Plan gibt, bringt Ist minus Soll dazu, Änderungen von Hand
   eingeschlossen. Der Stand zu Beginn einer Woche ist so immer der Stand nach der
   Vorwoche, ohne dass jemand etwas buchen muss.

   Soll der Woche ist der Vertrag, abzüglich bezahlter Ausfälle: Urlaub, Krankheit
   und Feiertage zählen mit dem Tagesanteil, als wäre gearbeitet worden. „Kann
   nicht“ und Berufsschule zählen nicht — Azubis haben ihre Betriebsstunden
