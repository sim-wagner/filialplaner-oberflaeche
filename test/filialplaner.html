// Testfassung: Die App lädt sie aus dem Testkanal und leitet Lesen und Schreiben an eine
// Kopie der Filialdaten um. Hier gilt zusätzlich: nichts Online-Seitiges, keine Sicherungen.
const TESTMODUS = inApp && window.appKanal === "test";
function appRuf(aktion, daten, wartezeit){
  if (!inApp) return Promise.resolve(null);

// Merkzettel, welche Filialen es gibt — nötig, wenn die Daten zentral liegen

const BEKANNT = "filialplaner:bekannt";

function bekannteLesen(){
  try { const a = JSON.parse(localStorage.getItem(BEKANNT) || "[]"); return Array.isArray(a) ? a : []; }
  catch(e){ return []; }
}

function bekannteSchreiben(liste){
  try { localStorage.setItem(BEKANNT, JSON.stringify(liste)); } catch(e){}
}

function merkeZugang(nr, ort, pwHash){
  if (inApp) appRuf("zuletzt", {setzen: String(nr)});
  try { localStorage.setItem(LETZTE, JSON.stringify({nr, ort, pw:pwHash})); } catch(e){}
  const liste = bekannteLesen().filter(x => key(x.nr) !== key(nr));
  liste.push({nr: String(nr), ort: ort || ""});
  bekannteSchreiben(liste);
}

function letzterZugang(){
  try { return JSON.parse(localStorage.getItem(LETZTE) || "null"); } catch(e){ return null; }
}

// In der App: alle bekannten Filialen aus iCloud holen
async function bekannteFilialen(){

  const liste = await appRuf("liste", {});
  return Array.isArray(liste) ? liste : [];
}

async function ladeFiliale(nr){
  const id = key(nr);
  if (inApp){
    const roh = await appRuf("laden", {id});
    if (roh === null || roh === undefined) return null;
    try { return normalisiere(typeof roh === "string" ? JSON.parse(roh) : roh); } catch(e){ return null; }
  }
  if (db){
    try {
      const s = await db.doc("filialen/" + id).get();
      return s.exists ? normalisiere(s.data()) : null;
    } catch(e){ /* auf lokal zurückfallen */ }
  }
  const raw = localStorage.getItem(LS + id);
  return raw ? normalisiere(JSON.parse(raw)) : null;
}

async function speichere(){
  if (!state.nr) return;
  // Ändert sich das Personal, erfährt es der Server — sonst könnte sich jemand Neues
  // nicht anmelden, und wer gegangen ist, weiterhin abgeben
  if (ONLINE_BEREIT && state.online){
    onlinePersonal().catch(() => {});
    meinPlanAbgleichen();          // Bundesland und — wenn eingeschaltet — die Pläne
  }
  const id = key(state.nr);
  const body = JSON.parse(JSON.stringify(state));
  body.geaendert = new Date().toISOString();
  if (inApp){
    await appRuf("sichern", {id, json: JSON.stringify(body)});
    await appRuf("zuletzt", {setzen: state.nr});
    return;
  }
  if (db){
    try { await db.doc("filialen/" + id).set(body); return; } catch(e){ /* lokal weiter */ }
  }
  try { localStorage.setItem(LS + id, JSON.stringify(body)); } catch(e){}
}

async function loescheFiliale(nr){
  const id = key(nr);
  if (inApp){ await appRuf("loeschen", {id}); }
  if (db){ try { await db.doc("filialen/" + id).delete(); } catch(e){} }
  try { localStorage.removeItem(LS + id); } catch(e){}
  bekannteSchreiben(bekannteLesen().filter(x => key(x.nr) !== id));
  const l = letzterZugang();
  if (l && key(l.nr) === id){ try { localStorage.removeItem(LETZTE); } catch(e){} }
}

let sperre = null;

const sichern = () => { clearTimeout(sperre); sperre = setTimeout(speichere, 400); };

async function hash(text){
  try {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,"0")).join("");
  } catch(e){
    // Ohne Web-Crypto (sehr alte Umgebungen): einfacher Streuwert, damit wenigstens
    // nicht jedes gleich lange Kennwort passt
    let h = 0x811c9dc5;
    for (const z of text){ h ^= z.codePointAt(0); h = Math.imul(h, 0x01000193) >>> 0; }
    return "x" + h.toString(16);
  }
}

function zufall(laenge, zeichen){
  const z = new Uint32Array(laenge);
  crypto.getRandomValues(z);
  return [...z].map(x => zeichen[x % zeichen.length]).join("");
}

/* „Mein Plan“: Die Schichten der laufenden und der nächsten Woche auf den Server, damit
   jeder Mitarbeiter auf der Seite „Meine Zeiten“ seine eigenen sieht. Nur, wenn die
   Filialleitung es eingeschaltet hat. Geschickt wird nur, was sich geändert hat. */
function meinPlanDaten(sl){
  const kurz = state.plaene[sl];
  if (!kurz) return null;
  const daten = {};
  state.mitarbeiter.forEach((m, i) => {
    const j = planIndex(kurz, m, i);
    daten[m.name] = j < 0 ? [] : kurz.tage.flatMap(t => t.feiertag ? [] : t.schichten.filter(s => s.mi === j)
      .sort((a, b) => a.von - b.von)
      .map(s => Object.assign({tag: t.key, von: hhmm(s.von), bis: hhmm(s.bis)},
        s.pauseVon !== null && s.pauseVon !== undefined ? {pVon: hhmm(s.pauseVon), pBis: hhmm(s.pauseBis)} : {})));
  });
  return daten;
}
let _abgleichLaeuft = false;
async function meinPlanAbgleichen(){
  if (!ONLINE_BEREIT || !state.online || _abgleichLaeuft) return;
  _abgleichLaeuft = true;
  try {
    const o = state.online;
    if (o.land !== state.land){
      await abgabeRuf("termine_land", {p_nr: state.nr, p_schluessel: o.schluessel, p_land: state.land});
      o.land = state.land;
    }
    if (!o.meinPlan) return;
    o.planStand = o.planStand || {};
    const mo = aktuellerMontag();
    for (const d of [0, 7]){
      const m = new Date(mo); m.setDate(mo.getDate() + d);
      const sl = wochenSchluessel(m);
      const daten = meinPlanDaten(sl);
      if (!daten) continue;
      const stand = JSON.stringify(daten);
      if (o.planStand[sl] === stand) continue;
      await abgabeRuf("termine_plan_setzen", {p_nr: state.nr, p_schluessel: o.schluessel, p_woche: sl, p_plan: daten});
      o.planStand[sl] = stand;
    }
    delete o.serverFehler;
  } catch(e){
    // Fehlt die Erweiterung auf dem Server, deutlich sagen — sonst still weiter
    state.online.serverFehler = /schema cache|Could not find the function/i.test(e.message)
      ? "Auf dem Server fehlt noch die Erweiterung „plan.sql“ — einmal im SQL-Editor von Supabase ausführen."
      : e.message;
  } finally { _abgleichLaeuft = false; }
}
async function meinPlanSchalten(an){
  state.online.meinPlan = an;
  state.online.planStand = {};
  if (an) await meinPlanAbgleichen();
  else await abgabeRuf("termine_plan_loeschen", {p_nr: state.nr, p_schluessel: state.online.schluessel});
  await speichere();
}

    ${rechts ? `<div class="seitenkopf-rechts">${rechts}</div>` : ""}
  </div>`);
  k.querySelector(".zurueck-link").onclick = () => { ansicht = zurueck || "start"; render(); };
  return k;
}

// Rote Zahl oben rechts an einem Knopf: so viel ist dort zu tun oder neu
const markeHtml = n => n ? `<span class="marke" aria-label="${n} ${n === 1 ? "Punkt" : "Punkte"} offen">${n > 9 ? "9+" : n}</span>` : "";

// Dieselbe Zahl in einer Zeile (Leiste, Reiter, Liste). Rot, sobald etwas zu tun ist —
// steht dort nur Neues zum Ansehen, ist sie blau.
function zahlHtml(liste){
  const n = (liste || []).length;
  if (!n) return "";
  const nurNeu = liste.every(x => x.art === "neu");
  return `<span class="zahl${nurNeu ? " neu" : ""}" aria-label="${n} ${nurNeu ? "neu" : "offen"}">${n > 9 ? "9+" : n}</span>`;
}

/* ---- Zahlfelder ----------------------------------------------------------------
   Textfeld mit Dezimaltastatur statt <input type="number"> (siehe zahlLesen in kern/02-hilfen.js).
   attrs: was bisher am Feld stand (id, data-…, placeholder). einheit: für die Rückmeldung unter
   dem Feld („= 1,5 h“). o: {min, max, ganz, echo:false, klasse}.
   Ausgelesen wird mit zahlWert(feld) — der Text mit Punkt („1.5“), "" wenn leer oder unlesbar. */
function zahlFeld(attrs, wert, einheit, o){
  o = o || {};
  return `<input type="text" inputmode="${o.ganz ? "numeric" : "decimal"}" autocomplete="off" autocapitalize="off" spellcheck="false"
    class="zahl-ein${o.klasse ? " " + o.klasse : ""}" data-zahl="${esc(einheit || "")}"${o.min !== undefined ? ` data-min="${o.min}"` : ""}${
    o.max !== undefined ? ` data-max="${o.max}"` : ""}${o.ganz ? " data-ganz" : ""}${o.echo === false ? " data-ohne-echo" : ""} ${attrs} value="${esc(zahlZeigen(wert))}">`;
}
// Was an einem Zahlfeld nicht stimmt — "" wenn alles passt
function zahlFehler(feld){
  const z = zahlLesen(feld.value), d = feld.dataset;
  if (z === null) return "Bitte eine Zahl eingeben, z. B. 1,5";
  if (z === "") return "";
  if (d.ganz !== undefined && Math.abs(z % 1) > 0.001) return "Bitte eine ganze Zahl";
  if (d.min !== undefined && z < +d.min) return `Mindestens ${zahlZeigen(d.min)}`;
  if (d.max !== undefined && z > +d.max) return `Höchstens ${zahlZeigen(d.max)}`;
  return "";
}
const zahlWert = feld => { const z = zahlLesen(feld.value); return z === null || z === "" || zahlFehler(feld) ? "" : String(z); };
// Rückmeldung am Feld: rot bei Unlesbarem, sonst klein darunter, was verstanden wurde
function zahlRueckmeldung(feld){
  const fehler = zahlFehler(feld), z = zahlLesen(feld.value);
  feld.setAttribute("aria-invalid", fehler ? "true" : "false");
  feld.title = fehler;
  if (feld.dataset.ohneEcho !== undefined) return;
  const halter = feld.closest("label.f");
  if (!halter) return;
  let echo = halter.querySelector(".zahl-echo");
  if (!echo){ echo = document.createElement("span"); echo.className = "zahl-echo"; echo.setAttribute("aria-live", "polite"); feld.after(echo); }
  // nur zeigen, wenn es etwas sagt: ein Fehler, ein Komma, eine Einheit mit Minuten
  const text = fehler || (/[.,]/.test(feld.value) && z !== "" ? zahlEcho(z, feld.dataset.zahl) : "");
  echo.textContent = text; echo.classList.toggle("fehler", !!fehler); echo.hidden = !text;
}
if (typeof document.addEventListener === "function"){
  document.addEventListener("input", e => { if (e.target && e.target.matches && e.target.matches("input[data-zahl]")) zahlRueckmeldung(e.target); }, true);
  // Beim Verlassen steht im Feld, was verstanden wurde — einheitlich mit Komma
  document.addEventListener("focusout", e => {
    const f = e.target;
    if (!f || !f.matches || !f.matches("input[data-zahl]")) return;
    const z = zahlLesen(f.value);
    if (z !== null && z !== "" && !zahlFehler(f)) f.value = zahlZeigen(z);
    zahlRueckmeldung(f);
  }, true);
}
// Vor dem Speichern eines Formulars: alle Zahlfelder prüfen — false, wenn eines nicht lesbar ist
function zahlenOk(wurzel){
  let ok = true;
  wurzel.querySelectorAll("input[data-zahl]").forEach(f => { zahlRueckmeldung(f); if (zahlFehler(f)) ok = false; });
  return ok;
}

/* ---- Erklärungen hinter einem „i“ (seit 17.11.2026) ----------------------------------
   Erklärungen stehen nicht frei auf der Seite: Ein kleines „i“ im Kreis — rechts oben am Feld,
   neben einer Überschrift oder einem Knopf — zeigt sie beim Antippen. So bleibt die Seite
   ruhig, und nichts geht verloren. Was Inhalt ist (Zahlen, Warnungen, Fehler, Legenden),
   bleibt sichtbar.
   text darf einfache Auszeichnung (<b>) enthalten; wozu sagt Bildschirmlesern, worum es geht. */
const ohneTags = s => String(s == null ? "" : s).replace(/<[^>]*>/g, "").replace(/\s+/g, " ").trim();
const infoHtml = (text, wozu) => `<span class="info"><button type="button" class="info-i" aria-expanded="false"
  aria-label="Erklärung${wozu ? " zu „" + esc(ohneTags(wozu)) + "“" : ""}">i</button><span class="info-inhalt" hidden>${text}</span></span>`;
// Ein Feld: Beschriftung und Eingabe — und, wenn es eine Erklärung gibt, das „i“ rechts oben
const feldHtml = (titel, eingabe, hinweis, attrs) => `<div class="feld"${attrs ? " " + attrs : ""}><label class="f"><span class="f-titel">${titel}</span>${
  eingabe}</label>${hinweis ? infoHtml(hinweis, titel) : ""}</div>`;
// Ein Teil innerhalb einer Rubrik (kleine Überschrift in Großbuchstaben)
const unterrubrikHtml = (titel, inhalt, hinweis) => `<section class="unterrubrik"><h3 class="unterrubrik-titel">${titel}${
  hinweis ? infoHtml(hinweis, titel) : ""}</h3>${inhalt || ""}</section>`;
// Eine Rubrik: ein klar abgesetzter Teil einer Seite (Titel mit rotem Balken)
const rubrikHtml = (titel, inhalt, attrs, hinweis) => `<section${attrs && /class=/.test(attrs) ? "" : ' class="rubrik"'}${attrs ? " " + attrs : ""}><h2 class="rubrik-titel">${titel}${
  hinweis ? infoHtml(hinweis, titel) : ""}</h2>${inhalt || ""}</section>`;

let infoOffen = null;
function infoZu(){
  if (!infoOffen) return;
  infoOffen.setAttribute("aria-expanded", "false");
  const b = document.getElementById("infoBlase");
  if (b) b.hidden = true;
  infoOffen = null;
}
function infoAuf(knopf){
  infoZu();
  let blase = document.getElementById("infoBlase");
  if (!blase){
    blase = document.createElement("div");
    blase.id = "infoBlase"; blase.className = "info-blase"; blase.setAttribute("role", "note"); blase.setAttribute("aria-live", "polite");
    document.body.appendChild(blase);
  }
  const quelle = knopf.parentElement.querySelector(".info-inhalt");
  blase.innerHTML = quelle ? quelle.innerHTML : "";
  blase.hidden = false;
  // unter dem „i“, rechtsbündig daran — und nie über den Rand des Bildschirms
  const r = knopf.getBoundingClientRect(), b = blase.getBoundingClientRect();
  const links = Math.max(12, Math.min(r.right + 8 - b.width, window.innerWidth - b.width - 12));
  let oben = r.bottom + 8;
  if (oben + b.height > window.innerHeight - 12) oben = Math.max(12, r.top - b.height - 8);
  blase.style.left = links + "px"; blase.style.top = oben + "px";
  knopf.setAttribute("aria-expanded", "true");
  infoOffen = knopf;
}
if (typeof document.addEventListener === "function"){
  document.addEventListener("click", e => {
    const knopf = e.target && e.target.closest ? e.target.closest(".info-i") : null;
    if (knopf){
      // nichts anderes auslösen (Aufklappen, Zeile antippen …)
      e.preventDefault(); e.stopPropagation();
      if (knopf === infoOffen) infoZu(); else infoAuf(knopf);
      return;
    }
    if (infoOffen && !(e.target && e.target.closest && e.target.closest("#infoBlase"))) infoZu();
  }, true);
  document.addEventListener("keydown", e => { if (e.key === "Escape" && infoOffen){ const k = infoOffen; infoZu(); k.focus(); } });
}
if (typeof window.addEventListener === "function"){
  window.addEventListener("scroll", infoZu, true);
  window.addEventListener("resize", infoZu);
}

// ==== app/27-markierungen.js ====
/* Rote Zahlen an den Knöpfen: Wo ist etwas einzustellen, wo hat sich etwas geändert?

   Zwei Arten:
     anpassen — etwas fehlt oder passt nicht. Die Zahl verschwindet, sobald es erledigt ist.
     neu      — etwas hat sich geändert. Die Zahl verschwindet, sobald der Bereich
                geöffnet wurde (state.gesehen merkt sich das je Filiale).
   Ziele: planen, aendern, ereignisse, termine, filiale, aufgaben, personal,
          standardwoche, stundenliste, analyse, archiv, sicherung */

// Einmalige Hinweise auf Neuerungen — die Kennung bleibt fest, damit sie nur einmal erscheinen
const NEUIGKEITEN = [
  {ziel: "personal", id: "neu:funktionsnamen", text: "Funktionen heißen jetzt „Kassieren“, „Ware verräumen“ und „Bestellen“."},
  {ziel: "personal", id: "neu:ereignisse-beim-mitarbeiter", text: "Urlaub und Krankheit trägst du jetzt direkt beim Mitarbeiter ein."},
  {ziel: "personal", id: "neu:funktionen-pae-konto", text: "Neue Funktionen „PÄ“ und „Kontoauszug“ — bei Leitung und Vertretung angehakt."}
];

function markierungen(){
  const raus = {}, gesehen = state.gesehen || {};
  const add = (ziel, id, art, text) => {
    if (art === "neu" && gesehen[id]) return;
    (raus[ziel] = raus[ziel] || []).push({id, art, text});
  };

  if (!hatZeit(state.von) || !hatZeit(state.bis)) add("filiale", "oeffnung", "anpassen", "Öffnungszeit fehlt");
  state.mitarbeiter.forEach(m => {
    if (altersAngabe(m) === null) add("personal", "alter:" + m.name, "anpassen", `${m.name}: Alter angeben`);
  });
  WAREN.forEach(w => {
    const a = state.aufgaben[w.id];
    if (a && a.neu) add("aufgaben", "aufgabe:" + w.id, "neu", `Neu: ${w.anzeige || w.name}`);
  });
  // Neuerungen nur in Filialen, die schon vorher eingerichtet waren
  if (state.mitarbeiter.length) NEUIGKEITEN.forEach(n => add(n.ziel, n.id, "neu", n.text));

  // Ohne Wiederherstellungscode gibt es keinen Weg zurück, wenn das Kennwort vergessen ist
  if (state.eingerichtet && state.pw && !state.wh) add("sicherung", "wh", "anpassen", "Wiederherstellungscode fürs Kennwort anlegen");

  // Pläne: Wer steht im Plan, obwohl er inzwischen fehlt? (laufende und kommende Wochen)
  const jetzt = wochenSchluessel(aktuellerMontag());
  Object.keys(state.plaene || {}).filter(sl => sl >= jetzt).forEach(sl =>
    planKonflikte(sl).forEach(k => add("aendern", `konflikt:${sl}:${k.name}:${k.ti}`, "anpassen", `KW ${kwVon(montagAusSchluessel(sl))}, ${k.text}`)));
  // … und wo sich Pausen überschneiden, sodass kurz niemand kassiert
  Object.keys(state.plaene || {}).filter(sl => sl >= jetzt).forEach(sl => pausenLuecken(state.plaene[sl]).forEach(x =>
    add("aendern", `pausen:${sl}:${x.ti}`, "anpassen", `KW ${kwVon(montagAusSchluessel(sl))}, ${pausenLueckeText(state.plaene[sl], x)}`)));
  // … und wo eine Aufgabe außerhalb ihrer Frist liegt (Ware verdirbt)
  Object.keys(state.plaene || {}).filter(sl => sl >= jetzt).forEach(sl => aufgabenAusserhalb(state.plaene[sl]).forEach(x =>
    add("aendern", `aufgaben:${sl}:${x.ti}`, "anpassen", `KW ${kwVon(montagAusSchluessel(sl))}, ${aufgabenAusserhalbText(x)}`)));

  // Ab Donnerstag gehört der Plan der nächsten Woche gemacht
  const heute = new Date(), wt = (heute.getDay() + 6) % 7;
  const naechste = new Date(montagDer(null)); naechste.setDate(naechste.getDate() + 7);
  // Ein Entwurf, der auf die Freigabe wartet, ist der nächste Schritt — nicht „kein Plan“
  const entwuerfe = Object.keys(state.planEntwurf || {}).filter(sl => sl >= jetzt).sort();
  entwuerfe.forEach(sl => add("planen", "entwurf:" + sl, "anpassen", `Der Entwurf für KW ${kwVon(montagAusSchluessel(sl))} wartet auf die Freigabe`));
  if (!(state.plaene || {})[jetzt]){ if (!entwuerfe.includes(jetzt)) add("planen", "plan:" + jetzt, "anpassen", `Für KW ${kwVon(aktuellerMontag())} gibt es noch keinen Plan`); }
  else if (wt >= 3 && wt < 6 && !(state.plaene || {})[wochenSchluessel(naechste)] && !entwuerfe.includes(wochenSchluessel(naechste)))
    add("planen", "plan:" + wochenSchluessel(naechste), "anpassen", `Für KW ${kwVon(naechste)} gibt es noch keinen Plan`);
  // Stundenliste: nur, wenn die Filiale überhaupt mit Listen arbeitet
  if (Object.keys(state.listen || {}).length && wt >= 3 && wt < 6 && !(state.listen || {})[wochenSchluessel(naechste)])
    add("stundenliste", "liste:" + wochenSchluessel(naechste), "anpassen", `Stundenliste für KW ${kwVon(naechste)} fehlt`);

  // Analyse: neue Empfehlungen
  if (typeof analyseEmpfehlungen === "function")
    analyseEmpfehlungen().filter(e => e.art !== "gruen").forEach(e => add("analyse", "empfehlung:" + e.kennung, "neu", e.titel));
  return raus;
}

// Ein Bereich wurde geöffnet: seine Neuigkeiten gelten als gesehen
function gesehenMerken(ziel){
  const neu = (markierungen()[ziel] || []).filter(x => x.art === "neu");
  if (!neu.length) return;
  markierungsKasten.zuletzt[ziel] = neu;      // einmal noch oben auf der Seite zeigen
  state.gesehen = state.gesehen || {};
  neu.forEach(x => state.gesehen[x.id] = new Date().toISOString().slice(0, 10));
  sichern();
}

// Oben auf einer Seite: was hier zu tun oder neu ist
function markierungsKasten(ziel){
  const liste = markierungen()[ziel] || [];
  const zeigen = liste.concat(markierungsKasten.zuletzt[ziel] || []).filter((x, n, a) => a.findIndex(y => y.id === x.id) === n);
  markierungsKasten.zuletzt[ziel] = [];
  if (!zeigen.length) return null;
  const nurNeu = zeigen.every(x => x.art === "neu");
  return el(`<div class="markierungskasten${nurNeu ? " neu" : ""}">${zeigen.map(x =>
    `<div class="mk-zeile ${x.art}"><span class="mk-punkt"></span><span>${esc(x.text)}</span></div>`).join("")}</div>`);
}
markierungsKasten.zuletzt = {};

// ==== app/28-navigation.js ====
/* Navigation: links alle Bereiche (breiter Bildschirm), unten vier Reiter (Telefon).

   Eine Liste für beides — so heißt jeder Bereich überall gleich und steht immer an
   derselben Stelle. Die Zahlen daneben kommen aus markierungen(). */

const NAV = [
  {titel: "Planung", punkte: [
    {ziel: "start",      sym: "raster", titel: "Dashboard"},
    {ziel: "planen",     sym: "plus",   titel: "Plan erstellen"},
    {ziel: "aendern",    sym: "stift",  titel: "Plan ändern"},
    {ziel: "ereignisse", sym: "sonne",  titel: "Urlaub & Krankheit"},
    {ziel: "termine",    sym: "briefe", titel: "Zeiten der Mitarbeiter"}]},
  {titel: "Filialdaten", punkte: [
    {ziel: "personal",      sym: "leute", titel: "Personal"},
    {ziel: "standardwoche", sym: "uhr",   titel: "Standardwoche"},
    {ziel: "aufgaben",      sym: "liste", titel: "Wochenaufgaben"},
    {ziel: "filiale",       sym: "laden", titel: "Filiale"}]},
  {titel: "Auswertung & Verwaltung", punkte: [
    {ziel: "stundenliste", sym: "tabelle", titel: "Stundenliste"},
    {ziel: "analyse",      sym: "zahlen",  titel: "Analyse"},
    {ziel: "archiv",       sym: "archiv",  titel: "Archiv"},
    {ziel: "sicherung",    sym: "schild",  titel: "Sicherung"}]}
];
const NAV_PUNKTE = NAV.reduce((a, g) => a.concat(g.punkte), []);

// Die vier Reiter des Telefons; „Mehr“ steht für alles, was keinen eigenen hat
const REITER = [
  {ziel: "start",      sym: "raster",   titel: "Dashboard", fuer: ["start"]},
  {ziel: "wochenplan", sym: "kalender", titel: "Plan",      fuer: ["wochenplan", "planen", "aendern"]},
  {ziel: "personal",   sym: "leute",    titel: "Personal",  fuer: ["personal"]},
  {ziel: "mehr",       sym: "mehr",     titel: "Mehr",      fuer: null}
];

// Welcher Bereich ist gerade offen?
function aktivesZiel(){
  if (ansicht === "entwurf") return "planen";          // der Entwurf ist der zweite Schritt von „Plan erstellen“
  if (ansicht !== "bereich") return ansicht;
  if (schritt === PRUEFEN_SCHRITT) return "analyse";
  return (BEREICHE.find(b => b.schritt === schritt) || {}).id;
}

/* Der eine Weg in jeden Bereich — aus der Leiste, den Reitern und von „Zu erledigen“.
   marke: der Punkt aus markierungen(), der hierher führt (bestimmt die Woche). */
function geheZu(ziel, marke){
  if (state.nr) sichern();          // was gerade eingetragen wurde, bleibt
  const von = ansicht;
  bearbeite = null; fehler = "";
  zurueckNach = von === "mehr" && ziel !== "mehr" ? "mehr" : null;
  const gezeigt = zeigeWoche ? montagDer(zeigeWoche) : aktuellerMontag();
  const wocheDer = m => { const t = /(\d{4}-KW\d{2})/.exec((m && m.id) || ""); return t ? t[1] : null; };

  if (ziel === "planen"){
    // Fehlt der gezeigten Woche der Plan, ist sie gemeint — sonst die nächste, die noch keinen hat
    const offen = wocheDer(marke);
    planWoche = isoVon(offen ? montagAusSchluessel(offen)
      : (state.plaene || {})[wochenSchluessel(gezeigt)] ? naechsteWocheOhnePlan() : gezeigt);
    // Wartet für die Woche ein Entwurf auf die Freigabe, geht es gleich dorthin
    ansicht = marke && /^entwurf:/.test(marke.id) && planEntwurfVon(wochenSchluessel(montagDer(planWoche))) ? "entwurf" : "planen";
  } else if (ziel === "aendern"){
    // die Woche, um die es geht — sonst die gezeigte, sonst die nächste mit Plan
    const plaene = state.plaene || {}, jetzt = wochenSchluessel(aktuellerMontag());
    const sl = [wocheDer(marke), wocheDer((markierungen().aendern || [])[0]), wochenSchluessel(gezeigt), jetzt]
      .concat(Object.keys(plaene).filter(x => x >= jetzt).sort()).find(x => x && plaene[x]);
    if (!sl){ alert("Es gibt noch keinen Plan, der sich ändern ließe. Erst einen Plan erstellen."); return; }
    planAendernOeffnen(sl); return;
  } else if (ziel === "analyse"){
    gesehenMerken(ziel);
    ansicht = "bereich"; schritt = PRUEFEN_SCHRITT;
  } else if (BEREICHE.some(b => b.id === ziel)){
    oeffneBereich(ziel, zurueckNach); return;
  } else {
    if (["ereignisse", "termine", "sicherung"].includes(ziel)) gesehenMerken(ziel);
    ansicht = ziel;                 // start, wochenplan, mehr, archiv, …
  }
  render();
}

// Das Logo liegt nicht in der Seite, sondern — wenn überhaupt — als Datei neben ihr
// in der App (Resources/logo.png). Fehlt sie, steht das eigene Zeichen da.
let logoDa = null;
function logoPruefen(){
  if (logoDa !== null || !(inApp || location.protocol === "file:")) return;
  logoDa = false;
  const bild = new Image();
  bild.onload = () => {
    logoDa = true;
    // oben in der Kopfzeile (Telefon, Anmeldung) ersetzt es das eigene Zeichen ebenfalls
    document.querySelectorAll(".brand .mark").forEach(m => m.replaceWith(el(`<img class="sl-logo" src="logo.png" alt="">`)));
    navZeichnen();
  };
  bild.src = "logo.png";
}

const speicherText = () => (document.getElementById("storeChip") || {}).textContent || "";

function navZeichnen(){
  const leiste = document.getElementById("seitenleiste"), reiter = document.getElementById("tableiste");
  const zeigen = !["anmeldung", "einrichtung"].includes(ansicht);
  document.body.classList.toggle("mit-schale", zeigen);
  leiste.innerHTML = ""; reiter.innerHTML = "";
  logoPruefen();
  if (!zeigen) return;
  const marken = markierungen(), aktiv = aktivesZiel();
  const alle = Object.keys(marken).reduce((a, k) => a.concat(marken[k]), []);
  const fuer = ziel => ziel === "start" ? alle : (marken[ziel] || []);

  // ---- breite Bildschirme: Leiste links ----
  leiste.appendChild(el(`<div class="sl-marke">${logoDa ? `<img class="sl-logo" src="logo.png" alt="">`
    : `<span class="mark">${symbol("kalender")}</span>`}
    <span class="sl-name"><b>Filialplaner</b><span>N ${esc(state.nr)}${state.ort ? " · " + esc(state.ort) : ""}</span></span></div>`));
  NAV.forEach((g, n) => {
    if (n) leiste.appendChild(el(`<div class="sl-gruppe">${esc(g.titel)}</div>`));
    g.punkte.forEach(x => {
      const b = el(`<button class="sl-punkt" type="button"${x.ziel === aktiv ? ' aria-current="page"' : ""}>${symbol(x.sym)}
        <span>${esc(x.titel)}</span>${zahlHtml(fuer(x.ziel))}</button>`);
      b.onclick = () => geheZu(x.ziel);
      leiste.appendChild(b);
    });
  });
  const fuss = el(`<div class="sl-fuss"><span>${esc(speicherText())}</span>
    <button class="sl-ab" type="button">Abmelden</button></div>`);
  fuss.querySelector("button").onclick = () => document.getElementById("abmelden").click();
  leiste.appendChild(fuss);

  // ---- Telefon: Reiter unten ----
  const eigene = REITER.reduce((a, r) => a.concat(r.fuer || []), []);
  REITER.forEach(r => {
    const an = r.fuer ? r.fuer.includes(aktiv) : !eigene.includes(aktiv);
    const liste = r.ziel === "start" ? alle
      : r.fuer ? r.fuer.reduce((a, z) => a.concat(marken[z] || []), [])
      : Object.keys(marken).filter(z => !eigene.includes(z)).reduce((a, z) => a.concat(marken[z]), []);
    const b = el(`<button class="tab" type="button"${an ? ' aria-current="page"' : ""}>${symbol(r.sym)}

  else if (ansicht === "aendern")     v.appendChild(aendernAnsicht());

  else if (ansicht === "mehr")        v.appendChild(mehrAnsicht());
  else                                v.appendChild(SCHRITT_FN()[schritt]());

  const erstes = v.querySelector(".panel");

    const z = el(zurueckHtml(zurueckNach));

    erstes.insertBefore(z, erstes.firstChild);

let platzGeprueft = 0;

  if (!inApp || Date.now() - platzGeprueft < 20000) return;
  platzGeprueft = Date.now();
  const text = await appRuf("hinweis", {});

// Fußzeile der Schritte — in der Einrichtung mit Überspringen, sonst mit Fertig
function navLeiste(idx){
  const a = el(`<div class="actions"></div>`);
  if (ansicht === "bereich"){
    // Wer aus der Prüfung vor dem Planen hierher kam, landet wieder dort
    const zurueck = () => { ansicht = zurueckNach || "start"; zurueckNach = null; render(); };
    const f = el(`<button class="btn haupt">${zurueckNach === "planen" ? "Fertig, zurück zum Plan" : "Fertig"}</button>`);
    f.onclick = async () => { await speichere(); zurueck(); };
    const ab = el(`<button class="btn ghost">Abbrechen</button>`);
    ab.onclick = zurueck;
    a.appendChild(ab); a.appendChild(el(`<div class="spacer"></div>`)); a.appendChild(f);
    return a;
  }
  if (idx > 0){
    const z = el(`<button class="btn ghost">Zurück</button>`);
    z.onclick = () => { schritt = idx - 1; fehler = ""; render(); };
    a.appendChild(z);
  }
  a.appendChild(el(`<div class="spacer"></div>`));
  const letzter = idx >= SCHRITTE.length - 1;
  if (!letzter){
    const u = el(`<button class="btn ghost">Überspringen</button>`);
    u.onclick = () => weiterZu(idx + 1);
    a.appendChild(u);
  }
  const w = el(`<button class="btn haupt">${letzter ? "Einrichtung abschließen" : "Weiter"}</button>`);
  w.onclick = async () => {
    if (letzter){
      state.eingerichtet = true;
      await speichere();
      ansicht = "start"; fehler = ""; render();
    } else weiterZu(idx + 1);
  };
  a.appendChild(w);
  return a;
}

function nav(zurueck, weiter, label){ return navLeiste(schritt); }

function weiterZu(i){ bearbeite = null; maxSchritt = Math.max(maxSchritt, i); schritt = i; fehler = ""; sichern(); render(); }

let zurueckNach = null;   // Ansicht, in die „Fertig“ zurückführt (sonst die Übersicht)

function oeffneBereich(id, zurueck){
  const b = BEREICHE.find(x => x.id === id);

  zurueckNach = zurueck || null;
  gesehenMerken(id);
  ansicht = "bereich"; schritt = b.schritt; bearbeite = null; fehler = "";
  render();
}

    box.appendChild(el(`<div class="note ok" style="margin-top:14px"><span class="ic">✓</span>

        : "Im Browser liegen die Daten nur in diesem Browser. In der Kachel „Sicherung“ lässt sich eine Sicherungsdatei anlegen."}</span></div>`));
  };

  umschalten("anmelden");
  return p;
}

function zeigeFehler(p, t){ fehler = t; const f = p.querySelector("#err"); if (f) f.textContent = t; }

// Filialen aus dem Browser-Speicher (außerhalb der App)
function lokaleFilialen(){
  const nach = new Map();
  const merke = (nr, ort) => {
    const id = key(nr);
    if (!id || id === "n") return;
    const alt = nach.get(id);
    nach.set(id, {nr: String(nr), ort: ort || (alt ? alt.ort : "")});
  };
  try {
    for (let i = 0; i < localStorage.length; i++){
      const s = localStorage.key(i);
      // nur die Filialbereiche selbst — nicht die Merkzettel
      if (!s || !new RegExp("^" + LS + "n\\d+$").test(s)) continue;
      try {
        const d = JSON.parse(localStorage.getItem(s));
        merke(d.nr || s.slice(LS.length + 1), d.ort);
      } catch(e){}
    }
  } catch(e){}
  bekannteLesen().forEach(x => merke(x.nr, x.ort));
  return [...nach.values()].sort((a,b) => String(a.nr).localeCompare(String(b.nr)));
}

// In der App übernimmt das die Brücke (Teilen- bzw. Sichern-Dialog, Dateiauswahl).
// Im Browser wird dieselbe Datei als Download angeboten und über ein Dateifeld gelesen.
function sicherungsKnoepfe(){
  const k = el(`<div style="margin-top:16px;display:flex;gap:9px;flex-wrap:wrap;align-items:center">
    <button class="btn ghost small" id="sichAus">Sicherungsdatei anlegen</button>
    <button class="btn ghost small" id="sichEin">Sicherungsdatei einlesen</button>
    <span class="hint" id="sichHinweis"></span>
  </div>`);
  const sagen = t => k.querySelector("#sichHinweis").textContent = t;

  k.querySelector("#sichAus").onclick = async () => {
    if (inApp){ await appRuf("sicherungSpeichern", {}); return; }
    const paket = {art:"filialplaner-sicherung", erstellt:new Date().toISOString(), filialen:{}};
    lokaleFilialen().forEach(f => {
      const roh = localStorage.getItem(LS + key(f.nr));
      if (roh){ try { paket.filialen[key(f.nr)] = JSON.parse(roh); } catch(e){} }
    });
    const name = "Filialplaner-Sicherung-" + new Date().toISOString().slice(0,10) + ".json";
    anbieten(new Blob([JSON.stringify(paket, null, 2)], {type:"application/json"}), name);
    sagen((n => n + (n === 1 ? " Filiale" : " Filialen") + " gespeichert.")(Object.keys(paket.filialen).length));
  };

  k.querySelector("#sichEin").onclick = async () => {
    if (inApp){
      const zahl = await appRuf("sicherungEinlesen", {});
      if (zahl > 0){ sagen(zahl + (zahl === 1 ? " Filiale" : " Filialen") + " eingelesen."); k.closest("#liste").innerHTML = ""; render(); }
      else if (zahl === 0) sagen("Nichts übernommen — die Sicherung war nicht neuer.");
      return;
    }
    const feld = el(`<input type="file" accept="application/json,.json" hidden>`);
    document.body.appendChild(feld);
    feld.onchange = async () => {
      const datei = feld.files && feld.files[0];
      feld.remove();
      if (!datei) return;
      try {
        const paket = JSON.parse(await datei.text());
        if (paket.art !== "filialplaner-sicherung") return sagen("Das ist keine Filialplaner-Sicherung.");
        let n = 0;
        for (const [id, inhalt] of Object.entries(paket.filialen || {})){
          const da = localStorage.getItem(LS + id);
          const neuer = !da || (inhalt.geaendert || "") > (JSON.parse(da).geaendert || "");
          if (!neuer) continue;
          localStorage.setItem(LS + id, JSON.stringify(inhalt));
          merkeZugang(inhalt.nr || id.slice(1), inhalt.ort || "", inhalt.pw || "");
          n++;
        }
        sagen(n ? n + (n === 1 ? " Filiale" : " Filialen") + " eingelesen." : "Nichts übernommen — die Sicherung war nicht neuer.");
        if (n) render();
      } catch(e){ sagen("Die Datei ließ sich nicht lesen."); }
    };
    feld.click();
  };
  return k;
}

    <div class="grid g2" style="margin-top:16px">
      <div class="tile"><label class="f" style="margin:0"><span class="eyebrow">Bundesland</span>
        <select id="land">${BUNDESLAENDER.map(([k,n]) => `<option value="${k}"${state.land === k ? " selected" : ""}>${n}</option>`).join("")}</select></label>
        <p class="sub" style="margin-top:6px" id="landInfo"></p></div>
      <div class="tile"><span class="eyebrow">Immer im Laden${infoHtml("Dazu durchgehend die Filialleitung oder die Vertretung der jeweiligen Schicht.", "Immer im Laden")}</span>
        <div style="font-weight:600;margin-top:4px">2 Personen, davon 1 an der Kasse</div></div>
    </div>
    <p class="err" id="err"></p></div>`);
  const speichereFelder = () => {
    state.ort = p.querySelector("#ort").value.trim();
    state.von = p.querySelector("#von").value;
    state.bis = p.querySelector("#bis").value;
    state.wechsel = p.querySelector("#wechsel").value;
    state.allein = p.querySelector("#allein").checked;
    state.land = p.querySelector("#land").value;
  };
  // Feiertage dieses Jahres und die Ladenöffnung des Landes zeigen — und warnen, wenn
  // die eingetragene Öffnungszeit sie überschreitet
  const pflichtZeigen = () => ["#von", "#bis"].forEach(s => {
    const f = p.querySelector(s);
    f.classList.toggle("fehlt", !hatZeit(f.value) || (s === "#bis" && hatZeit(state.von) && f.value <= state.von));
  });
  const landInfo = () => {
    const j = new Date().getFullYear();
    const anzahl = Object.keys(feiertageIm(j, state.land)).length;
    const lo = LADENOEFFNUNG[state.land];
    const zuLang = lo && ((hatZeit(state.von) && state.von < lo[0]) || (hatZeit(state.bis) && state.bis > lo[1]));
    p.querySelector("#landInfo").innerHTML = `${anzahl} Feiertage ${j}, jedes Jahr neu berechnet. `
      + (lo ? `Ladenöffnung werktags ${lo[0]}–${lo[1]} Uhr.` : "Mo–Sa kein gesetzlicher Ladenschluss.")
      + (zuLang ? ` <b style="color:var(--bad)">Die Öffnungszeit oben liegt außerhalb.</b>` : "");
  };
  // Stundenlohn der Aushilfen (bis 17.11.2026 in der Analyse) — und was er für die Grenze heißt
  const jahr = new Date().getFullYear();
  const grenzeZeigen = () => p.querySelector("#mjGrenze").innerHTML =
    `<b class="num">${hGenau(minijobStunden(jahr))} h</b><span class="hint">im Monat · ${minijobGrenze(jahr)} €</span>`;
  p.querySelector("#aLohn").addEventListener("input", e => {
    state.einstellungen = state.einstellungen || {};
    state.einstellungen.aushilfeLohn = zahlWert(e.target);
    grenzeZeigen();
  });
  grenzeZeigen();
  landInfo(); pflichtZeigen();
  p.addEventListener("input", () => { speichereFelder(); landInfo(); pflichtZeigen(); sichern(); });
  p.querySelector("#land").addEventListener("change", () => { speichereFelder(); landInfo(); sichern(); });
  p.appendChild(navLeiste(0));
  return p;
}

// Kurz, was an einem Tag eingestellt ist — steht unter dem Tag im Reiter
function tagesKurzinfo(z){
  if (!z) return "";
  if (z.zeitArt === "fest") return hatZeit(z.zeit) ? z.zeit : "";
  if (z.zeitArt === "spanne") return hatZeit(z.fBis) ? "bis " + z.fBis : hatZeit(z.fVon) ? "ab " + z.fVon : "";
  return "frei";
}

/* Was in der Zeile einer Aufgabe steht: Tage, Zeit, Dauer, Personen — und was noch fehlt.
   → {text, fehlt (bremst den Plan), leise (nur ein Hinweis)} */
function aufgabenZeile(w, a){
  if (!a.aktiv) return {text: "abgeschaltet", fehlt: "", leise: ""};
  const best = w.gruppe === "bestellung";
  const idx = TAGE.map(([k], ti) => a.tage.includes(k) ? ti : -1).filter(ti => ti >= 0);
  if (!idx.length) return best ? {text: "keine Tage gewählt", fehlt: "", leise: ""} : {text: "", fehlt: "Tage fehlen", leise: ""};
  const teile = [idx.length === TAGE.length ? "täglich" : tageText(idx)];
  const tage = a.tage.map(k => aufgabeAm(a, k));
  const bild = z => JSON.stringify([z.zeitArt, z.zeit, z.fertig || "", z.fVon, z.fBis, z.dauer, z.personen]);
  if (a.jeTag && tage.some(z => bild(z) !== bild(tage[0]))) teile.push("je Tag verschieden");
  else {
    const z = tage[0];
    const zeit = z.zeitArt === "fest" ? (hatZeit(z.zeit) ? `ab ${z.zeit}${hatZeit(z.fertig) ? ", fertig bis " + z.fertig : ""}` : "")
               : z.zeitArt === "spanne" ? (hatZeit(z.fVon) && hatZeit(z.fBis) ? `${z.fVon}–${z.fBis}` : hatZeit(z.fBis) ? `bis ${z.fBis}` : hatZeit(z.fVon) ? `ab ${z.fVon}` : "")
               : "frei eingeplant";
    if (zeit) teile.push(zeit);
    if (hat(z.dauer)) teile.push(zahlZeigen(z.dauer) + " h");
    if (hat(z.personen) && !(best && nz(z.personen) === 1)) teile.push(nz(z.personen) === 1 ? "1 Person" : zahlZeigen(z.personen) + " Personen");
  }
  // Ohne Frist: Was dann gilt, steht dabei — und frische Ware ohne jede Zeit fehlt (sie würde sonst irgendwann gelegt)
  const frist = tage.map(z => ohneFristText(z)).find(Boolean);
  if (w.frisch && tage.some(z => z.zeitArt === "egal" || (z.zeitArt === "spanne" && !hatZeit(z.fVon) && !hatZeit(z.fBis))))
    return {text: teile.join(" · "), fehlt: "Frist fehlt (frische Ware)", leise: ""};
  const ohneDauer = tage.some(z => !hat(z.dauer)), ohnePers = tage.some(z => !hat(z.personen));
  if (frist && !ohneDauer && !ohnePers) return {text: teile.join(" · "), fehlt: "", leise: frist};
  // Eine Bestellung ohne Dauer steht mit ihrer Frist im Plan — sie wird nur nicht eingeplant
  if (best && ohneDauer) return {text: teile.join(" · "), fehlt: "", leise: "ohne Dauer — nur die Frist steht im Plan"};
  return {text: teile.join(" · "), fehlt: ohneDauer ? "Dauer fehlt" : ohnePers ? "Personenzahl fehlt" : "", leise: ""};
}

// Ohne „spätestens“: wann die Aufgabe dann spätestens beginnt (vor der Öffnung: fertig bis zur Öffnung)
function ohneFristText(z){
  const ab = z.zeitArt === "fest" && hatZeit(z.zeit) && !hatZeit(z.fertig) ? z.zeit
           : z.zeitArt === "spanne" && hatZeit(z.fVon) && !hatZeit(z.fBis) ? z.fVon : null;
  if (!ab) return "";
  // dieselbe Rechnung wie der Planer (aufgabenFenster): vor der Öffnung fertig bis zur Öffnung — dauert
  // die Aufgabe länger, so lange sie eben dauert
  if (hatZeit(state.von) && ab < state.von){
    const ende = Math.max(minuten(ab) + Math.round(nz(z.dauer) * 4) * 15, minuten(state.von));
    return `ohne Frist: fertig bis ${hhmm(ende)}${hhmm(ende) === state.von ? " (Öffnung)" : ""}`;
  }
  return `ohne Frist: beginnt spätestens ${hhmm(minuten(ab) + AUFGABEN_SPIELRAUM)}`;
}

function aufgabenKarte(w, p){
  const a = state.aufgaben[w.id];
  const best = w.gruppe === "bestellung";
  let offenerTag = null;      // welcher Tag aufgeklappt ist, wenn je Tag verschieden
  // Eine Zeile je Aufgabe; antippen öffnet die Einstellungen. Neues steht gleich offen da.
  const t = el(`<div class="task${a.neu ? "" : " zu"}">
    <h3 class="task-h"><button class="task-kopf" type="button" aria-expanded="${a.neu ? "true" : "false"}">
      <span class="task-name">${esc(w.anzeige || w.name)}${a.neu ? ' <span class="tag neu">neu</span>' : ""}</span>
      <span class="task-info" data-kurz></span>
      <span class="task-pfeil" aria-hidden="true">${symbol("weiter")}</span></button></h3>
    <div class="body">
      <label class="switch schalter"><input type="checkbox" data-aktiv ${a.aktiv ? "checked" : ""}>
        <span data-aktivtext>${a.aktiv ? "aktiv" : "abgeschaltet"}</span></label>
      <div data-inhalt>
        <div class="days" role="group" aria-label="Wochentage ${esc(w.anzeige || w.name)}"></div>
        <label class="switch jetag"><input type="checkbox" data-jetag ${a.jeTag ? "checked" : ""}>
          an den Tagen unterschiedlich</label>
        <div data-felder></div>
        <div class="pstd">= <b>?</b> Pers.-Std/Woche</div>
      </div>
    </div></div>`);
  const kopf = t.querySelector(".task-kopf");
  kopf.onclick = () => { const zu = t.classList.toggle("zu"); kopf.setAttribute("aria-expanded", String(!zu)); };
  const daysBox = t.querySelector(".days");
  const felderBox = t.querySelector("[data-felder]");
  const out = t.querySelector(".pstd b");

  // Ein Tag bekommt beim ersten Mal die allgemeinen Werte als Ausgangspunkt
  const tagAnlegen = k => {
    if (!a.proTag[k]) a.proTag[k] = {zeitArt:a.zeitArt, zeit:a.zeit, fertig:a.fertig || "", fVon:a.fVon, fBis:a.fBis,
                                      dauer:a.dauer, personen:a.personen};
  };

  // Nur Werte übernehmen und Summen nachziehen — nichts neu aufbauen, sonst
  // verliert das Feld, in dem gerade getippt wird, den Fokus
  const frisch = () => {
    if (a.neu && (a.tage.length || a.zeit || a.dauer || !a.aktiv)) delete a.neu;
    const tage = a.tage.map(k => aufgabeAm(a, k));
    const bekannt = a.aktiv && tage.length && tage.every(x => hat(x.dauer) && hat(x.personen));
    out.textContent = bekannt ? h1(tage.reduce((s,x) => s + nz(x.dauer) * nz(x.personen), 0)) : "?";
    t.classList.toggle("off", !a.aktiv);
    t.querySelector("[data-aktivtext]").textContent = a.aktiv ? "aktiv" : "abgeschaltet";
    t.querySelector("[data-inhalt]").style.display = a.aktiv ? "" : "none";
    // die Zeile: was eingestellt ist — und was noch fehlt
    const z = aufgabenZeile(w, a);
    t.querySelector("[data-kurz]").innerHTML = [z.text ? esc(z.text) : "", z.fehlt ? `<b class="task-fehlt">${esc(z.fehlt)}</b>` : "",
      z.leise ? `<span class="task-leise">${esc(z.leise)}</span>` : ""].filter(Boolean).join(" · ");
    t.classList.toggle("fehlt", !!z.fehlt);
    felderBox.querySelectorAll("[data-info]").forEach(s => s.textContent = tagesKurzinfo(a.proTag[s.dataset.info]));
    p.querySelector("#sumP").textContent = h1(auswertung().aufgaben);
    sichern();
  };

  // Die Felder für z — die allgemeinen Werte der Aufgabe oder die eines Tages
  const felder = z => {
    const box = el(`<div class="task-fields">
      <label class="f">Zeit<select data-art>${ZEITARTEN.map(([v,l]) =>
        `<option value="${v}"${z.zeitArt === v ? " selected" : ""}>${l}</option>`).join("")}</select></label>
      <div class="zeitfelder" data-zeit></div>
      <label class="f">Dauer (h)${zahlFeld('data-dauer placeholder="?"', z.dauer, "h", {min: 0})}</label>
      <label class="f">Personen${zahlFeld('data-pers placeholder="?"', z.personen, "", {min: 1, ganz: true})}</label>
    </div>`);
    const zeitBox = box.querySelector("[data-zeit]");
    const zeiten = () => {
      zeitBox.innerHTML = "";
      if (z.zeitArt === "fest"){
        const l = el(feldHtml("Uhrzeit (frühestens)", `<input type="time" value="${esc(z.zeit)}">`));
        l.querySelector("input").oninput = l.querySelector("input").onchange = e => { z.zeit = e.target.value; frisch(); };
        // Ohne Angabe: vor der Öffnung bis zur Öffnung, sonst darf der Beginn bis zu zwei Stunden rutschen
        const f = el(feldHtml("spätestens fertig bis", `<input type="time" value="${esc(z.fertig || "")}">`,
          "Leer: vor der Ladenöffnung bis zur Öffnung, sonst darf die Aufgabe bis zu zwei Stunden später beginnen."));
        f.querySelector("input").oninput = f.querySelector("input").onchange = e => { z.fertig = e.target.value; frisch(); };
        zeitBox.appendChild(l); zeitBox.appendChild(f);
      } else if (z.zeitArt === "spanne"){
        const l1 = el(`<label class="f">frühestens<input type="time" value="${esc(z.fVon)}"></label>`);
        const l2 = el(`<label class="f">${best ? "Frist (spätestens)" : "spätestens fertig bis"}<input type="time" value="${esc(z.fBis)}"></label>`);
        // „input“ und „change“: manche WebKit-Fassungen melden bei Uhrzeitfeldern nur eines davon
        l1.querySelector("input").oninput = l1.querySelector("input").onchange = e => { z.fVon = e.target.value; frisch(); };
        l2.querySelector("input").oninput = l2.querySelector("input").onchange = e => { z.fBis = e.target.value; frisch(); };
        zeitBox.appendChild(l1); zeitBox.appendChild(l2);
      } else {
        zeitBox.appendChild(el(`<p class="hint" style="padding-bottom:9px">wird frei eingeplant</p>`));
      }
    };
    box.querySelector("[data-art]").onchange = e => { z.zeitArt = e.target.value; zeiten(); frisch(); };
    box.querySelector("[data-dauer]").oninput = e => { z.dauer = zahlWert(e.target); frisch(); };
    box.querySelector("[data-pers]").oninput  = e => { z.personen = zahlWert(e.target); frisch(); };
    zeiten();
    return box;
  };

  // Entweder eine Einstellung für alle Tage, oder ein Reiter je Tag. Angezeigt
  // wird immer nur der gewählte Tag.
  const aufbauen = () => {
    felderBox.innerHTML = "";
    if (!a.jeTag){ felderBox.appendChild(felder(a)); return; }
    const tage = TAGE.filter(([k]) => a.tage.includes(k));
    if (!tage.length){ felderBox.appendChild(el(`<p class="hint" style="margin-top:8px">Erst oben die Tage wählen.</p>`)); return; }
    if (!offenerTag || !a.tage.includes(offenerTag)) offenerTag = tage[0][0];
    const reiter = el(`<div class="tagreiter" role="tablist" aria-label="Tag wählen"></div>`);
    tage.forEach(([k,l]) => {
      tagAnlegen(k);
      const b = el(`<button class="tagreiter-b" role="tab" aria-selected="${k === offenerTag}">
        <b>${l}</b><span data-info="${k}">${esc(tagesKurzinfo(a.proTag[k]))}</span></button>`);
      b.onclick = () => { offenerTag = k; aufbauen(); };
      reiter.appendChild(b);
    });
    felderBox.appendChild(reiter);
    const fach = el(`<div class="tagfach"><span class="eyebrow">${TAGNAMEN[offenerTag]}</span></div>`);
    fach.appendChild(felder(a.proTag[offenerTag]));
    felderBox.appendChild(fach);
  };

  TAGE.forEach(([k,l]) => {
    const b = el(`<button class="day" aria-pressed="${a.tage.includes(k)}">${l}</button>`);
    b.onclick = () => {
      const i = a.tage.indexOf(k);
      if (i < 0){ a.tage.push(k); if (a.jeTag){ tagAnlegen(k); offenerTag = k; } }
      else a.tage.splice(i,1);
      b.setAttribute("aria-pressed", a.tage.includes(k));
      if (a.jeTag) aufbauen();
      frisch();
    };
    daysBox.appendChild(b);
  });
  t.querySelector("[data-aktiv]").onchange = e => { a.aktiv = e.target.checked; frisch(); };
  t.querySelector("[data-jetag]").onchange = e => {
    a.jeTag = e.target.checked;
    if (a.jeTag) a.tage.forEach(tagAnlegen);
    aufbauen(); frisch();
  };
  aufbauen();
  frisch();
  return t;
}

/* Einrichtung: Personal und Standardwoche */

/* --------- Mitarbeiter ---------
   Zwei Seiten: die Liste aller Mitarbeiter (mit „+“ oben rechts und „⋯“ je Person —
   auch per Rechtsklick), und eine eigene Seite zum Anlegen oder Bearbeiten. Wer die
   Bearbeitung verlässt, speichert oder geht ausdrücklich zurück. */
let bearbeite = null;   // null = Liste, -1 = neue Person, sonst Index der Person

function mitarbeiter(){
  return bearbeite === null ? personalListe() : personSeite();
}

function personalListe(){
  const p = el(`<div class="panel">
    <div class="head kopf-mit-knopf"><div><span class="eyebrow">${stufe(3)}</span>
      <h1 style="margin-top:6px">Personal${infoHtml("Alle Mitarbeiter der Filiale. Auf eine Person tippen oder über „⋯“ bearbeiten und entfernen.", "Personal")}</h1></div>
      <button class="btn rund" id="neuePerson" type="button" title="Mitarbeiter hinzufügen" aria-label="Mitarbeiter hinzufügen">+</button></div>
    <div id="liste"></div>
  </div>`);
  p.querySelector("#neuePerson").onclick = () => { bearbeite = -1; render(); };
  const box = p.querySelector("#liste");
  if (!state.mitarbeiter.length){
    box.appendChild(el(`<p class="empty">Noch niemand erfasst. Mit „+“ oben rechts die erste Person anlegen.</p>`));
  } else {
    const a = auswertung();
    const stand = ueberstundenZuBeginn(aktuellerMontag());
    const liste = el(`<div class="personenliste" role="list"></div>`);
    state.mitarbeiter.forEach((m, i) => {
      const aa = altersAngabe(m), fk = faktor(m), bek = hat(istAzubi(m) ? m.betrieb : m.vertrag);
      const ue = stand[i] || 0;
      const z = el(`<div class="person" role="listitem" tabindex="0">
        <div class="person-name"><b>${esc(m.name)}</b>${aa === "minder" ? ` <span class="tag minor">unter 18</span>`
          : aa === null ? ` <span class="tag fehlt">Alter fehlt</span>` : ""}
          <span class="hint">${esc(m.typ)}${istAzubi(m) ? ` · ${m.lehrjahr}. Lehrjahr` : ""}</span></div>
        <div class="person-zahlen"><span><b>${bek ? h1(stunden(m)) : "?"}</b> h</span>
          <span class="${!bek || !hatKonto(m) ? "hint" : ue > 0.1 ? "ue-plus" : ue < -0.1 ? "ue-minus" : "ue-null"}">${!bek ? "" : istAushilfe(m) ? "Orientierung" : istAzubi(m) ? "ohne Konto" : (ueText(ue) || "0,0") + " h"}</span></div>
        <div class="person-funktionen">${(m.qual || []).map(q => { const f = QUAL.find(x => x[0] === q); return f ? `<span class="tag">${f[1]}</span>` : ""; }).join("")}</div>
        <button class="punkte" type="button" aria-label="Aktionen für ${esc(m.name)}" title="Aktionen">⋯</button></div>`);
      const oeffnen = () => { bearbeite = i; render(); };
      z.onclick = e => { if (!e.target.closest(".punkte")) oeffnen(); };
      z.onkeydown = e => { if (e.key === "Enter") oeffnen(); };
      const menue = (x, y) => kontextMenue(x, y, [
        ["Bearbeiten", oeffnen],
        ["Entfernen", () => personEntfernen(i), "gefahr"]
      ]);
      z.querySelector(".punkte").onclick = e => { e.stopPropagation(); const r = e.currentTarget.getBoundingClientRect(); menue(r.right, r.bottom + 4); };
      z.oncontextmenu = e => { e.preventDefault(); menue(e.clientX, e.clientY); };
      liste.appendChild(z);
    });
    box.appendChild(liste);
    box.appendChild(el(`<p class="summe-zeile">Zusammen <b>${h1(a.anwesend)} h</b> je Woche, davon <b>${h1(a.wirksam)} h</b> leistungswirksam${
      infoHtml("Azubis im 1. Lehrjahr zählen nicht, im 2. zur Hälfte.", "leistungswirksam")}</p>`));
  }
  p.appendChild(navLeiste(2));
  return p;
}

// Kleines Auswahlmenü wie beim Rechtsklick: [[Text, Aktion, Klasse]]
function kontextMenue(x, y, eintraege){
  document.querySelectorAll(".kontextmenue").forEach(k => k.remove());
  const m = el(`<div class="kontextmenue" role="menu"></div>`);
  eintraege.forEach(([text, aktion, klasse]) => {
    const b = el(`<button type="button" role="menuitem" class="${klasse || ""}">${esc(text)}</button>`);
    b.onclick = e => { e.stopPropagation(); m.remove(); aktion(); };
    m.appendChild(b);
  });
  document.body.appendChild(m);
  const r = m.getBoundingClientRect();
  m.style.left = Math.max(8, Math.min(x - r.width, window.innerWidth - r.width - 8)) + "px";
  m.style.top = Math.max(8, Math.min(y, window.innerHeight - r.height - 8)) + "px";
  const zu = e => { if (!m.contains(e.target)){ m.remove(); document.removeEventListener("pointerdown", zu, true); } };
  setTimeout(() => document.addEventListener("pointerdown", zu, true), 0);
  m.querySelector("button").focus();
}

/* Eine Person entfernen. Abwesenheiten sind nach Platz in der Liste gespeichert — sie
   rücken nach, damit sie nicht auf die nächste Person rutschen. Urlaub und Krankheit der
   Person werden mit gelöscht (Gesundheitsdaten nicht länger aufheben als nötig). */
function personEntfernen(i){
  const m = state.mitarbeiter[i];
  if (!m || !confirm(`${m.name} wirklich entfernen? Alte Pläne behalten die Person, Urlaub und Krankheit werden gelöscht.`)) return;
  state.mitarbeiter.splice(i, 1);
  [state.abwesend, state.onlineStand, state.listenStand].forEach(feld => Object.values(feld || {}).forEach(woche => {
    const neu = {};
    Object.keys(woche).forEach(k => { const n = +k; if (n < i) neu[n] = woche[k]; else if (n > i) neu[n - 1] = woche[k]; });
    Object.keys(woche).forEach(k => delete woche[k]);
    Object.assign(woche, neu);
  }));
  state.ereignisse = (state.ereignisse || []).filter(e => e.name !== m.name);
  bearbeite = null;
  sichern(); render();
}

  const neuM = bearbeite < 0;
  // Kassieren ist vorgewählt: Das lernt jeder zuerst
  const m = neuM ? {name:"", typ:TYPEN[2], vertrag:"", lehrjahr:1, betrieb:"", qual:["kasse"], ueberstunden:true}
                 : state.mitarbeiter[bearbeite];
  if (!m){ bearbeite = null; return personalListe(); }
  // Gezeigt wird der Stand zu Beginn dieser Woche — so, wie er sich aus den Plänen ergibt
  const jetzt = aktuellerMontag();
  const standJetzt = neuM ? null : ueberstundenZuBeginn(jetzt)[bearbeite];
  const p = el(`<div class="panel personseite"></div>`);

        ${feldHtml("Einordnung", `<select id="mTyp">${TYPEN.map(x => `<option${x === m.typ ? " selected" : ""}>${x}</option>`).join("")}</select>`)}
        ${feldHtml("Alter", `<select id="mAlter">
            <option value="">— bitte wählen —</option>
            <option value="voll"${altersAngabe(m) === "voll" ? " selected" : ""}>18 oder älter</option>
            <option value="minder"${altersAngabe(m) === "minder" ? " selected" : ""}>unter 18</option></select>`,

        ${feldHtml(`<span id="vertragText">Stunden laut Vertrag</span>`, zahlFeld('id="mVertrag" placeholder="leer, wenn unklar"', m.vertrag || "", "h", {min: 0}),
          "Bei Aushilfen nur eine Orientierung. Fest ist die Minijob-Grenze im Monat; ein Stundenkonto gibt es für sie nicht.", 'id="wrapVertrag"')}
        ${feldHtml("Lehrjahr", `<select id="mLj">${[1,2,3].map(j => `<option value="${j}"${m.lehrjahr === j ? " selected" : ""}>${j}. Lehrjahr</option>`).join("")}</select>`,
          null, 'id="wrapLj" hidden')}
        ${feldHtml("Stunden im Betrieb", zahlFeld('id="mBetrieb" placeholder="leer, wenn unklar"', m.betrieb || "", "h", {min: 0}),
          "Azubis arbeiten genau diese Stunden: keine Überstunden, keine Minusstunden — deshalb gibt es für sie kein Stundenkonto.", 'id="wrapBetrieb" hidden')}
        ${neuM
          ? feldHtml("Stundenkonto", zahlFeld('id="mSaldo" placeholder="0"', "", "h"),
              `Stand zum Start in KW ${kwVon(jetzt)}: + Überstunden, − Minusstunden. Danach rechnet der Plan jede Woche selbst weiter.`, 'id="wrapSaldo"')
          : `<div class="feld" id="wrapSaldo"><div class="f"><span class="f-titel">Stundenkonto</span>
              <div class="konto-box"><b class="num" id="kontoStand">${ueText(standJetzt || 0) || "0,0"} h</b>
                <button class="btn ghost small" id="kontoKorr" type="button">Korrigieren</button></div></div></div>`}
      </div>
      <div class="schalter-reihe">
        <div class="schalter-zeile" id="wrapUeber"><label class="switch"><input type="checkbox" id="mUeber" ${m.ueberstunden !== false ? "checked" : ""}>
          <span>kann Überstunden machen</span></label>${infoHtml("Aus: Der Planer plant höchstens die Vertragsstunden ein. Minusstunden darf er trotzdem ausgleichen.", "kann Überstunden machen")}</div>
        <div class="schalter-zeile"><label class="switch"><input type="checkbox" id="mGeteilt" ${m.geteilt ? "checked" : ""}>
          <span>darf geteilt arbeiten</span></label>${infoHtml("Morgens und abends am selben Tag. Dann entfällt die Pause, weil jeder Teil für sich unter der Grenze bleibt.", "darf geteilt arbeiten")}</div>
      </div>`)}
    ${rubrikHtml("Funktionen", `<div class="funktionen" id="mQual">
        ${QUAL.map(([k,l]) => `<label class="switch"><input type="checkbox" value="${k}"${(m.qual || []).includes(k) ? " checked" : ""}> ${l}</label>`).join("")}
      </div>`, "", "Was die Person im Laden übernehmen kann. Kassieren lernt jeder zuerst; Früh- und Spätschichtvertretung heißt: hat einen Schlüssel und darf die Schicht führen.")}
    <div id="ereignisRubrik"></div>
    <p class="err" id="err"></p>
    <div class="actions" id="formActions"></div>
  </div>`);
  p.appendChild(f);

    const typ = f.querySelector("#mTyp");
    const umschalten = () => {
      const az = typ.value === "Azubi";
      const aus = typ.value === "Aushilfe (Minijob)";
      f.querySelector("#wrapVertrag").hidden = az;
      f.querySelector("#wrapLj").hidden = !az;
      f.querySelector("#wrapBetrieb").hidden = !az;
      // Aushilfen: Wochenstunden als Orientierung, kein Stundenkonto
      f.querySelector("#vertragText").textContent = aus ? "Stunden pro Woche" : "Stunden laut Vertrag";
      f.querySelector("#wrapVertrag .info").hidden = !aus;
      // Aushilfen und Azubis haben kein Stundenkonto; Azubis machen nie Überstunden
      f.querySelector("#wrapSaldo").hidden = aus || az;
      f.querySelector("#wrapUeber").hidden = az;
    };
    typ.onchange = umschalten; umschalten();

    const korr = f.querySelector("#kontoKorr");
    if (korr) korr.onclick = () => kontoDialog(bearbeite, stand => { f.querySelector("#kontoStand").textContent = (ueText(stand) || "0,0") + " h"; });

    const altF = f.querySelector("#mAlter");
    altF.onchange = () => altF.classList.remove("fehlt");

    const lesen = () => {
      const az = typ.value === "Azubi";
      return {
        name: f.querySelector("#mName").value.trim(),
        typ: typ.value,
        volljaehrig: altF.value === "voll" ? true : altF.value === "minder" ? false : undefined,
        vertrag: az ? "" : zahlWert(f.querySelector("#mVertrag")),
        lehrjahr: az ? parseInt(f.querySelector("#mLj").value,10) : null,
        betrieb: az ? zahlWert(f.querySelector("#mBetrieb")) : "",
        geteilt: f.querySelector("#mGeteilt").checked,
        ueberstunden: f.querySelector("#mUeber").checked,
        qual: [...f.querySelectorAll("#mQual input:checked")].map(i => i.value)
      };
    };


  // Wer die Seite verlässt, ohne zu speichern, wird gefragt
  const anfang = JSON.stringify(lesen());
  const verlassen = () => { if (JSON.stringify(lesen()) === anfang || confirm("Die Änderungen sind nicht gespeichert. Trotzdem zurück?")) zurueck(); };
  kopf.querySelector(".zurueck-link").onclick = verlassen;

  const act = f.querySelector("#formActions");
  const speichern = el(`<button class="btn" type="button">${neuM ? "Mitarbeiter anlegen" : "Speichern"}</button>`);
  speichern.onclick = () => {
    const d = lesen();
    if (!d.name){ f.querySelector("#err").textContent = "Bitte einen Namen eintragen."; return; }
    if (!zahlenOk(f)){ f.querySelector("#err").textContent = "Eine Zahl ist nicht lesbar — bitte das rot markierte Feld berichtigen."; return; }
    if (d.volljaehrig === undefined){
      altF.classList.add("fehlt");
      f.querySelector("#err").textContent = "Bitte angeben, ob die Person 18 oder älter ist — davon hängen Pausen, Arbeitszeiten und Ruhezeiten ab.";
      return;
    }
    if (state.mitarbeiter.some((x, k) => x.name === d.name && k !== bearbeite)){
      f.querySelector("#err").textContent = "Diesen Namen gibt es schon — bitte den Nachnamen dazuschreiben."; return;
    }
    // Der Kontostand wird hier nur beim Anlegen gesetzt. Später ändert ihn allein der Dialog
    // „Konto korrigieren“ — eine stille Änderung beim Speichern setzte früher unbemerkt einen
    // neuen Stichtag. (Aushilfen haben kein Konto.)
    if (neuM && d.typ !== "Aushilfe (Minijob)" && d.typ !== "Azubi"){
      const eingabe = zahlWert(f.querySelector("#mSaldo"));
      d.saldo = eingabe === "" ? 0 : viertel(+eingabe); d.saldoAb = wochenSchluessel(jetzt);
    }
    if (neuM) state.mitarbeiter.push(d);
    else {
      const alt = state.mitarbeiter[bearbeite];
      // Umbenennen: alte Pläne, Entwürfe und Einträge finden die Person über den Namen
      if (alt.name !== d.name){
        Object.values(state.plaene).forEach(pl => { if (pl.namen){ const j = pl.namen.indexOf(alt.name); if (j >= 0) pl.namen[j] = d.name; } });
        (state.ereignisse || []).forEach(e => { if (e.name === alt.name) e.name = d.name; });
        Object.values(state.entwuerfe || {}).forEach(en => en.aenderungen.forEach(a => {
          if (a.name === alt.name) a.name = d.name;
          (a.schritte || []).forEach(x => { if (x.name === alt.name) x.name = d.name; });
        }));
      }
      Object.assign(alt, d);   // Standardwoche bleibt erhalten
    }
    sichern(); zurueck();
  };
  const ab = el(`<button class="btn ghost" type="button">Zurück</button>`);
  ab.onclick = verlassen;
  act.appendChild(ab); act.appendChild(el(`<div class="spacer"></div>`)); act.appendChild(speichern);

  // Urlaub und Krankheit dieser Person — hier ist der Hauptweg, sie einzutragen
  if (!neuM){
    const ue = el(rubrikHtml("Urlaub & Krankheit", `<div data-form></div><div data-liste></div>`, 'class="rubrik person-ereignisse"',
      "Gespeichert werden nur Art und Zeitraum. Steht für die Tage schon ein Plan, ist die Person dort unter „Plan ändern“ rot markiert."));
    const zeichne = () => {
      const l = ue.querySelector("[data-liste]");
      l.innerHTML = ""; l.appendChild(ereignisListe(m.name, zeichne));
    };
    ue.querySelector("[data-form]").appendChild(ereignisFormular(m.name, zeichne));
    zeichne();
    f.querySelector("#ereignisRubrik").replaceWith(ue);
  } else f.querySelector("#ereignisRubrik").remove();
  return p;
}

function standardwoche(){
  const p = el(`<div class="panel">
    <div class="head"><span class="eyebrow">${stufe(4)}</span>
      <h1 style="margin-top:6px">Standardwoche${infoHtml("Wer jede Woche gleich arbeitet, trägt das hier einmal ein. Der übrige Plan wird um diese festen Zeiten herum gebaut. Leer heißt: wird jede Woche neu eingeteilt.", "Standardwoche")}</h1></div>
    <div id="wochen"></div>
  </div>`);

  const box = p.querySelector("#wochen");
  if (!state.mitarbeiter.length){
    box.appendChild(el(`<p class="empty">Noch niemand erfasst — erst unter „Personal“ anlegen.</p>`));
    p.appendChild(navLeiste(3));
    return p;
  }

  const sortiert = [...state.mitarbeiter.keys()].sort((x,y) => {
    const r = q => q.typ === "Filialleitung" ? 0 : q.typ === "Stellvertretung" ? 1 : 2;
    return r(state.mitarbeiter[x]) - r(state.mitarbeiter[y]);
  });

  sortiert.forEach((idx, pos) => {
    const m = state.mitarbeiter[idx];
    m.standard = m.standard || {};
    const leitung = m.typ === "Filialleitung";
    const d = el(`<details class="task" ${pos === 0 || leitung ? "open" : ""} style="padding:0">
      <summary style="padding:14px 16px;cursor:pointer;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <b>${esc(m.name)}</b>
        <span class="tag${leitung ? " azubi" : ""}">${esc(m.typ)}</span>
        <span class="hint" style="margin-left:auto" data-sum></span>
      </summary>
      <div style="padding:0 16px 16px"><div class="tablewrap"><table><thead><tr>
        <th>Tag</th><th class="n">von</th><th class="n">bis</th><th class="n">Pause</th><th class="n">Arbeitszeit</th>
      </tr></thead><tbody></tbody></table></div><div data-checks style="margin-top:12px"></div></div>
    </details>`);
    const tb = d.querySelector("tbody");
    const sum = d.querySelector("[data-sum]");
    const checks = d.querySelector("[data-checks]");

    const frisch = () => {
      TAGE.forEach(([k], i) => {
        const x = schicht(m, k);
        const row = tb.children[i];
        row.children[3].textContent = x ? (x.pause ? h1(x.pause*60).replace(",0","") + " min" : "–") : "–";
        row.children[4].textContent = x ? h1(x.arbeit) : "–";
      });
      const w = wochenStunden(m);
      const soll = istAzubi(m) ? m.betrieb : m.vertrag;
      sum.textContent = w ? h1(w) + " h" + (hat(soll) ? " von " + h1(nz(soll)) + " h" : "") : "keine feste Woche";
      checks.innerHTML = "";
      const meld = pruefeStandard(m);
      meld.forEach(x => checks.appendChild(el(`<div class="note ${x.art}"><span class="ic">§</span><span>${esc(x.text)}</span></div>`)));
      if (w && hat(soll) && Math.abs(w - nz(soll)) > 0.5)
        checks.appendChild(el(`<div class="note warn"><span class="ic">!</span><span>Die Standardwoche ergibt ${h1(w)} h, der Vertrag nennt ${h1(nz(soll))} h.</span></div>`));
      if (w && !meld.length) checks.appendChild(el(`<div class="note ok"><span class="ic">✓</span><span>Diese Woche verstößt gegen keine Regel.</span></div>`));
      sichern();
    };

    TAGE.forEach(([k,l]) => {
      const s = m.standard[k] || {von:"", bis:""};
      m.standard[k] = s;
      const tr = el(`<tr><td>${l}</td>
        <td class="n"><input type="time" value="${s.von}" style="max-width:120px"></td>
        <td class="n"><input type="time" value="${s.bis}" style="max-width:120px"></td>
        <td class="n">–</td><td class="n">–</td></tr>`);
      const [vI, bI] = tr.querySelectorAll("input");
      vI.oninput = () => { s.von = vI.value; frisch(); };
      bI.oninput = () => { s.bis = bI.value; frisch(); };
      tb.appendChild(tr);
    });
    frisch();
    box.appendChild(d);
  });

  p.appendChild(navLeiste(3));
  return p;
}

/* Konto korrigieren: der Stand, wie er zustande kommt, und ein neuer Stand zu Beginn der
   laufenden Woche. Gespeichert wird sofort; fertig(stand) bekommt den neuen Stand. */
function kontoDialog(i, fertig){
  const m = state.mitarbeiter[i], mo = aktuellerMontag(), kw = kwVon(mo);
  const zeichnen = () => {
    const k = kontoHerkunft(i, mo);
    const kwText = sl => "KW " + (+sl.slice(-2));
    const rechnung = [`Stand zu Beginn ${kwText(k.ab)}: ${ueText(k.start) || "0,0"} h`]
      .concat(k.wochen.map(w => `${kwText(w.sl)}: ${ueText(w.aenderung) || "±0,0"} h`));
    return el(`<div class="konto-dialog">
      <h3>Stundenkonto · ${esc(m.name)}</h3>
      <p class="konto-gross"><b class="num">${ueText(k.stand) || "0,0"} h</b><span>zu Beginn KW ${kw}</span></p>
      <p class="konto-rechnung">${esc(rechnung.join(" · "))}${infoHtml("Jede Woche mit Plan bringt Ist minus Soll dazu. Urlaub, Krankheit und Feiertage zählen wie gearbeitet.", "Stundenkonto")}</p>
      <div style="margin-top:14px">${feldHtml(`Neuer Stand zu Beginn KW ${kw}`, zahlFeld('data-neu placeholder="z. B. 0 oder −2,5"', "", "h"),
        `+ Überstunden, − Minusstunden. Ab KW ${kw} rechnet der Plan von diesem Stand weiter.`)}</div>
      <p class="err" data-fehler></p>
      <div class="dialog-knoepfe"><button class="btn" data-setzen type="button">Stand setzen</button>
        <button class="btn ghost" data-zu type="button">Schließen</button></div>
      ${k.korrekturen.length ? `<div class="konto-verlauf"><span class="eyebrow">Bisherige Korrekturen</span>
        ${k.korrekturen.map(x => `<div class="konto-zeile"><span>${esc(deVon(new Date(x.am + "T12:00:00")))}</span>
          <span class="num">${ueText(x.alt) || "0,0"} → ${ueText(x.neu) || "0,0"} h</span><span>ab ${kwText(x.ab)}</span></div>`).join("")}</div>` : ""}
    </div>`);
  };
  let inhalt = zeichnen();
  const d = dialogZeigen(inhalt);
  const verdrahten = () => {
    inhalt.querySelector("[data-zu]").onclick = () => d.remove();
    inhalt.querySelector("[data-setzen]").onclick = () => {
      const feld = inhalt.querySelector("[data-neu]"), wert = zahlWert(feld);
      if (wert === ""){ zahlRueckmeldung(feld); inhalt.querySelector("[data-fehler]").textContent = "Bitte den neuen Stand als Zahl eintragen, z. B. 0 oder −2,5."; return; }
      if (!kontoKorrigieren(i, +wert, mo)){ inhalt.querySelector("[data-fehler]").textContent = "Das ist schon der Stand — es ändert sich nichts."; return; }
      sichern();
      if (fertig) fertig(kontoHerkunft(i, mo).stand);
      // den Dialog mit dem neuen Stand und dem Verlauf neu zeigen
      const neu = zeichnen(); inhalt.replaceWith(neu); inhalt = neu; verdrahten();
    };
  };
  verdrahten();
}

/* --------- 6 Stundenliste --------- */
function stundenliste(){
  listenWoche = listenWoche || isoVon(aktuellerMontag());
  const mo = montagDer(listenWoche);
  const sl = wochenSchluessel(mo);
  state.listen[sl] = state.listen[sl] || {stunden:{}, umsatz:{}};
  const liste = state.listen[sl];
  const wahl = wochenAuswahl(listenWoche);

  const p = el(`<div class="panel">
    <div class="head"><span class="eyebrow">Stundenliste</span>
      <h1 style="margin-top:6px">Stundenliste${infoHtml("Die Plan-Werte des Bereichsleiters je Kalenderwoche — Richtwerte, keine harte Grenze. Ohne Angabe fehlt nur der Vergleich.", "Stundenliste")}</h1></div>

    <div class="grid g3" style="margin-bottom:16px">
      <label class="f">Kalenderwoche<select id="kw">${wahl.map(w =>
        `<option value="${w.iso}"${w.iso === listenWoche ? " selected" : ""}>${w.text}</option>`).join("")}</select></label>
      <div class="tile" id="status"></div>
    </div>

    <div class="tablewrap"><table><thead><tr><th>Plan</th>${
      TAGE.map(([,l]) => `<th class="n">${l}</th>`).join("")}<th class="n">Woche</th></tr></thead>
      <tbody>
        <tr><td>Stunden</td>${TAGE.map(([k]) =>
          `<td>${zahlFeld(`data-f="stunden" data-t="${k}" aria-label="Stunden ${k}"`, liste.stunden[k] ?? "", "h", {min: 0, echo: false})}</td>`).join("")}
          <td class="n" id="sumH">–</td></tr>
        <tr><td>Umsatz €${infoHtml("Optional. Daraus wird die Leistung je Stunde berechnet.", "Umsatz")}</td>${TAGE.map(([k]) =>
          `<td>${zahlFeld(`data-f="umsatz" data-t="${k}" aria-label="Umsatz ${k}"`, liste.umsatz[k] ?? "", "€", {min: 0, echo: false})}</td>`).join("")}
          <td class="n" id="sumU">–</td></tr>
        <tr><td>Leistung €/h${infoHtml("Berechnet: Umsatz geteilt durch Stunden.", "Leistung")}</td>${TAGE.map(([k]) =>
          `<td class="n" data-l="${k}">–</td>`).join("")}<td class="n" id="sumL">–</td></tr>
      </tbody></table></div>

    <h3 class="abschnitt" style="margin:22px 0 8px">Liste des Bereichsleiters einlesen${infoHtml("Excel (.xlsx) und CSV werden direkt ausgewertet. PDF und Fotos werden der Woche beigelegt — die Zahlen dann von Hand eintragen.", "Liste einlesen")}</h3>
    <div class="ablage" id="ablage" tabindex="0" role="button">
      <b>Datei hierher ziehen</b>
      <span>oder antippen zum Auswählen</span>
    </div>
    <input type="file" id="datei" accept=".xlsx,.xls,.csv,.pdf,image/*" hidden>
    <p class="err" id="lesefehler"></p>
    <div id="anhang"></div>
  </div>`);

  const frisch = () => {
    const h = TAGE.reduce((x,[k]) => x + nz(liste.stunden[k]), 0);
    const u = TAGE.reduce((x,[k]) => x + nz(liste.umsatz[k]), 0);
    const tage = TAGE.filter(([k]) => hat(liste.stunden[k])).length;
    p.querySelector("#sumH").textContent = h ? h1(h) + (tage < TAGE.length ? "*" : "") : "–";
    p.querySelector("#sumU").textContent = u ? eur(u) : "–";
    p.querySelector("#sumL").textContent = (u && h) ? eur(u/h) : "–";
    TAGE.forEach(([k]) => {
      const hh = nz(liste.stunden[k]), uu = nz(liste.umsatz[k]);
      p.querySelector(`[data-l="${k}"]`).textContent = (hh && uu) ? eur(uu/hh) : "–";
    });
    const st = p.querySelector("#status");
    st.innerHTML = "";
    const plan = state.plaene[sl];
    st.appendChild(el(`<div><span class="eyebrow">Diese Woche</span>
      <div style="font-weight:700;margin-top:4px">${h ? h1(h) + " h für " + tage + " von 6 Tagen" : "noch nichts eingetragen"}</div>
      <p class="sub" style="margin-top:4px">${plan ? "Für diese Woche gibt es bereits einen Plan." : "Für diese Woche gibt es noch keinen Plan."}</p></div>`));
    anhangZeigen();
  };

  const anhangZeigen = () => {
    const box = p.querySelector("#anhang");
    box.innerHTML = "";
    if (!liste.anhang) return;
    const z = el(`<div class="note info" style="margin-top:12px"><span class="ic">•</span>
      <span>Beigelegt: <b>${esc(liste.anhang.name)}</b> — aus Scans und Fotos lassen sich die
      Zahlen nicht automatisch lesen, sie müssen oben eingetragen werden.
      <button class="btn ghost small" id="wegDamit" style="margin-left:8px">entfernen</button></span></div>`);
    z.querySelector("#wegDamit").onclick = () => { delete liste.anhang; sichern(); frisch(); };
    box.appendChild(z);
  };

  p.querySelectorAll("input[data-f]").forEach(i => i.oninput = () => {
    liste[i.dataset.f][i.dataset.t] = zahlWert(i) === "" ? "" : +zahlWert(i);
    frisch(); sichern();
  });
  p.querySelector("#kw").onchange = e => { listenWoche = e.target.value; render(); };

  // ---- Datei hereinziehen ----
  const ablage = p.querySelector("#ablage");
  const feld = p.querySelector("#datei");
  const sagen = t => p.querySelector("#lesefehler").textContent = t;
  ablage.onclick = () => feld.click();
  ablage.onkeydown = e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); feld.click(); } };
  ["dragenter","dragover"].forEach(n => ablage.addEventListener(n, e => {
    e.preventDefault(); ablage.classList.add("drueber");
  }));
  ["dragleave","drop"].forEach(n => ablage.addEventListener(n, e => {
    e.preventDefault(); ablage.classList.remove("drueber");
  }));
  ablage.addEventListener("drop", e => { if (e.dataTransfer.files[0]) lies(e.dataTransfer.files[0]); });
  feld.onchange = () => { if (feld.files[0]) lies(feld.files[0]); feld.value = ""; };

  async function lies(datei){
    sagen("");
    const name = datei.name.toLowerCase();
    try {
      if (name.endsWith(".csv")){
        uebernimm(ausCSV(await datei.text()), datei.name);
      } else if (name.endsWith(".xlsx") || name.endsWith(".xls")){
        if (!window.ExcelJS) return sagen("Die Excel-Bibliothek ist nicht geladen.");
        const wb = new ExcelJS.Workbook();
        await wb.xlsx.load(await datei.arrayBuffer());
        uebernimm(ausTabelle(wb), datei.name);
      } else {
        liste.anhang = {name: datei.name, art: datei.type || "", groesse: datei.size};
        sichern(); frisch();
        sagen("");
      }
    } catch(e){ sagen("Die Datei ließ sich nicht lesen: " + e.message); }
  }

  function uebernimm(gefunden, dateiname){
    if (!gefunden || !gefunden.stunden.some(x => x !== null))
      return sagen("In der Datei standen keine sechs Tageswerte, die sich zuordnen ließen. Bitte oben von Hand eintragen.");
    TAGE.forEach(([k], i) => {
      if (gefunden.stunden[i] !== null) liste.stunden[k] = gefunden.stunden[i];
      if (gefunden.umsatz && gefunden.umsatz[i] !== null) liste.umsatz[k] = gefunden.umsatz[i];
    });
    liste.quelle = dateiname;
    sichern();
    // Felder neu befüllen
    p.querySelectorAll("input[data-f]").forEach(i => {
      const v = liste[i.dataset.f][i.dataset.t];
      i.value = zahlZeigen(v);
    });
    frisch();
    sagen("Übernommen aus " + dateiname + ".");
  }

  frisch();
  p.appendChild(navLeiste(STUNDENLISTE_SCHRITT));
  return p;
}

/* Aus einer Tabelle die sechs Tageswerte fischen: gesucht wird eine Zeile, die
   mit „Stunden" beginnt (bzw. „Umsatz"), und darin die ersten sechs Zahlen. */

function ausZeilen(zeilen){
  // Excel liefert echte Zahlen (25.5), CSV liefert Text („25,5", „1.234,5", „25.5")
  const zahl = v => {
    if (v === null || v === undefined || v === "") return null;
    if (typeof v === "number") return isFinite(v) ? v : null;
    let t = String(v).trim().replace(/\s|€|h$/gi, "");
    if (t.includes(",")) t = t.replace(/\./g, "").replace(",", ".");   // deutsch
    else if (/^\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, "");  // 12.000
    const n = parseFloat(t);
    return isFinite(n) && /^-?[\d.]+$/.test(t) ? n : null;
  };
  const text = v => v && typeof v === "object" && v.richText
    ? v.richText.map(r => r.text).join("") : String(v ?? "");
  const finde = muster => {
    for (const z of zeilen){
      // Die Beschriftung steht nicht immer in Spalte A — die erste Textzelle nehmen
      const k = z.findIndex(v => v !== null && v !== undefined && v !== "" && zahl(v) === null);
      if (k < 0 || !muster.test(text(z[k]).toLowerCase())) continue;
      const werte = z.slice(k + 1).map(zahl).filter(x => x !== null);
      if (werte.length >= 6) return werte.slice(0, 6);
      if (werte.length) return werte.concat(Array(6 - werte.length).fill(null));
    }
    return null;
  };
  const stunden = finde(/stunde|std/);
  const umsatz  = finde(/umsatz|euro|€/);
  return stunden ? {stunden, umsatz} : null;
}

function ausCSV(text){
  const trenn = (text.split("\n")[0].match(/;/g) || []).length >= (text.split("\n")[0].match(/,/g) || []).length ? ";" : ",";
  return ausZeilen(text.split(/\r?\n/).map(z => z.split(trenn)));
}

function ausTabelle(wb){
  const zeilen = [];
  wb.eachSheet(ws => ws.eachRow(r => {
    const z = [];
    r.eachCell({includeEmpty:true}, c => z.push(c.value && c.value.result !== undefined ? c.value.result : c.value));
    zeilen.push(z);
  }));
  return ausZeilen(zeilen);
}
