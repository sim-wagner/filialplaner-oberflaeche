  const p = el(`<div class="panel">
    <div class="head"><span class="eyebrow">Archiv</span>
      <h1 style="margin-top:4px">Abgelaufene Wochen${infoHtml(`Pläne und Stundenlisten nach Kalenderwoche. Nach ${ARCHIV_WOCHEN} Wochen wird gelöscht — vorher steht ein Hinweis im Dashboard.`, "Archiv")}</h1></div>
    <div class="actions" style="margin-top:0;border-top:0;padding-top:0">
      <button class="btn ghost small" id="sichern">Ganzes Archiv sichern</button></div>
    <h3 class="abschnitt" style="margin:20px 0 8px">Arbeitspläne</h3>
    <div id="plaene"></div>
    <h3 class="abschnitt" style="margin:24px 0 8px">Stundenlisten</h3>
    <div id="listen"></div>
    <div id="detail"></div>
    <div class="actions"><button class="btn ghost" id="zurueck">Zurück</button></div>
  </div>`);

  p.querySelector("#sichern").onclick = () => archivSichern();

  // --- Arbeitspläne ---
  const pb = p.querySelector("#plaene");
  const pl = archivSchluessel();
  if (!pl.length){
    pb.appendChild(el(`<p class="empty">Noch keine abgelaufene Woche.</p>`));
  } else {
    const tab = el(`<div class="tablewrap"><table><thead><tr>
      <th>Woche</th><th>Zeitraum</th><th class="n">Stunden</th><th class="n">Alter</th><th></th></tr></thead><tbody></tbody></table></div>`);
    const tb = tab.querySelector("tbody");
    pl.forEach(sl => {
      const kurz = state.plaene[sl];
      const plan = planLaden(kurz);
      const su = planSummen(plan);
      const bis = new Date(plan.mo.getTime() + 5*864e5);
      const alt = wochenZurueck(sl, state.plaene);
      const tr = el(`<tr><td><b>KW ${sl.slice(-2)}</b><span class="hint"> ${sl.slice(0,4)}</span></td>
        <td>${deVon(plan.mo)} – ${deVon(bis)}</td>
        <td class="n">${h1(su.bezahlt)}</td>
        <td class="n${alt >= ARCHIV_WARNUNG ? " warnalt" : ""}">${alt} W.</td>
        <td class="n" style="white-space:nowrap">
          <button class="btn ghost small" data-zeig>ansehen</button>
          <button class="btn ghost small" data-pdf>PDF</button>
          <button class="btn ghost small" data-xls>Excel</button></td></tr>`);
      tr.querySelector("[data-zeig]").onclick = () => {
        const d = p.querySelector("#detail");
        d.innerHTML = "";
        d.appendChild(el(`<h3 style="margin:22px 0 8px">KW ${sl.slice(-2)} im Einzelnen</h3>`));
        d.appendChild(planTabelle(plan, false));
        d.scrollIntoView({behavior:"smooth", block:"start"});
      };
      tr.querySelector("[data-xls]").onclick = () => planExcel(plan);
      tr.querySelector("[data-pdf]").onclick = () => planPDF(plan);
      tb.appendChild(tr);
    });
    pb.appendChild(tab);
  }

  // --- Stundenlisten ---
  const lb = p.querySelector("#listen");
  const ll = listenArchivSchluessel();
  if (!ll.length){
    lb.appendChild(el(`<p class="empty">Noch keine abgelaufene Stundenliste.</p>`));
  } else {
    const tab = el(`<div class="tablewrap"><table><thead><tr>
      <th>Woche</th>${TAGE.map(([,l]) => `<th class="n">${l}</th>`).join("")}
      <th class="n">Summe</th><th class="n">Alter</th></tr></thead><tbody></tbody></table></div>`);
    const tb = tab.querySelector("tbody");
    ll.forEach(sl => {
      const li = state.listen[sl];
      const summe = TAGE.reduce((x,[k]) => x + nz(li.stunden[k]), 0);
      const alt = wochenZurueck(sl, state.listen);
      tb.appendChild(el(`<tr><td><b>KW ${sl.slice(-2)}</b><span class="hint"> ${sl.slice(0,4)}</span></td>
        ${TAGE.map(([k]) => `<td class="n">${hat(li.stunden[k]) ? h1(nz(li.stunden[k])) : "–"}</td>`).join("")}
        <td class="n"><b>${summe ? h1(summe) : "–"}</b></td>
        <td class="n${alt >= ARCHIV_WARNUNG ? " warnalt" : ""}">${alt} W.</td></tr>`));
    });
    lb.appendChild(tab);
  }

  p.querySelector("#zurueck").onclick = () => { ansicht = "start"; render(); };
  return p;
}

/* Neue Funktionen ausprobieren: Testfassung ein- und ausschalten, Testkopie zurücksetzen.
   Die echten Daten berührt die Testfassung nie — sie arbeitet mit einer Kopie, die nur
   auf diesem Gerät liegt. */
function testfassungKasten(){
  const k = el(`<div class="tile testkasten"><span class="eyebrow">Neue Funktionen ausprobieren${infoHtml(TESTMODUS
      ? "Alles, was du hier änderst, landet nur in der Testkopie auf diesem Gerät. Zurücksetzen holt den echten Stand frisch in die Testkopie — was du in der Testfassung geändert hast, ist dann weg."
      : "Die Testfassung enthält Neuerungen, bevor sie für alle gelten. Sie arbeitet mit einer Kopie deiner Filialdaten, die nur auf diesem Gerät liegt — dein echter Stand bleibt unberührt. Zurück geht jederzeit.", "Testfassung")}</span>
    <div id="tfInhalt"></div><p class="err" id="tfFehler"></p></div>`);
  const inhalt = k.querySelector("#tfInhalt"), fehler = k.querySelector("#tfFehler");
  if (!TESTMODUS){
    inhalt.appendChild(el(`<div style="margin-top:10px"><button class="btn small" id="tfAn">Testfassung ausprobieren</button></div>`));
    k.querySelector("#tfAn").onclick = async e => {
      e.target.disabled = true; e.target.textContent = "Testfassung wird geladen …"; fehler.textContent = "";
      await speichere();
      const r = await appRuf("kanal", {setzen: "test"}, 90000);
      if (!r || !r.ok){
        fehler.textContent = (r && r.fehler) || "Die Testfassung ließ sich nicht laden — ist das Gerät online?";
        e.target.disabled = false; e.target.textContent = "Testfassung ausprobieren";
      }
      // bei Erfolg lädt die App die Seite neu
    };
  } else {
    inhalt.appendChild(el(`<div><p style="margin:6px 0 10px;font-weight:600">Du bist in der Testfassung.</p>
      <div class="kachelknoepfe"><button class="btn small" id="tfAus">Zurück zur stabilen Fassung</button>
      <button class="btn ghost small" id="tfNeu">Testkopie zurücksetzen</button></div></div>`));
    k.querySelector("#tfAus").onclick = () => testfassungVerlassen();
    k.querySelector("#tfNeu").onclick = async () => {
      if (!confirm("Testkopie zurücksetzen? Alles, was du in der Testfassung geändert hast, wird verworfen. Deine echten Daten bleiben, wie sie sind.")) return;
      await appRuf("testkopieVerwerfen", {});
    };
  }
  return k;
}
async function testfassungVerlassen(){
  await speichere();
  await appRuf("kanal", {setzen: "stabil"});
}

// ==== app/44-planentwurf.js ====
/* Planentwurf: der zweite Schritt von „Plan erstellen“.

   Oben, was noch nicht passt. Dann je Person, wie viele Vertragsstunden noch fehlen, mit
   Vorschlägen, wo sie hinpassen. Darunter der Entwurf im Filialformular über die ganze
   Breite — Zelle antippen ändert von Hand. Erst „Plan freigeben“ macht den Entwurf zum gültigen Plan; bis dahin gilt
   für die Woche weiter, was vorher galt. */

// Welche Personen in „Vertragsstunden“ aufgeklappt sind — bleibt so, wenn ein Vorschlag übernommen wird
const peAuf = new Set();

function planEntwurfAnsicht(){
  const mo = montagDer(planWoche || isoVon(aktuellerMontag()));
  const sl = wochenSchluessel(mo);
  const pe = planEntwurfVon(sl);
  if (!pe){ ansicht = "planen"; return planenAnsicht(); }
  const pr = entwurfPruefen(sl, pe.kurz, pe);
  const plan = planLaden(pr.plan);
  const bis = new Date(mo.getTime() + 5 * 864e5);
  const neuZeichnen = () => { const y = window.scrollY; sichern(); render(); window.scrollTo(0, y); };
  const fehlend = auffuellVorschlaege(sl);                         // Festangestellte: Vertragsstunden
  const aushilfen = aushilfenImEntwurf(sl);                         // Aushilfen: Stand im Monat
  const offenStunden = fehlend.reduce((s, x) => s + x.fehlt, 0);
  // Was die Freigabe noch braucht: Lücken und Regeln aus dem Entwurf, Azubis unter ihren
  // Betriebsstunden, Aushilfen über der Minijob-Grenze (auch wenn der gerechnete Plan sie schon hatte)
  const zuTun = pr.offen.slice();
  azubiFehlstunden(pr.plan).forEach(x => zuTun.push({art: "azubi", text: x.text}));
  minijobVerstoesse(pr.plan).forEach(x => { if (!zuTun.some(o => o.text === x.text)) zuTun.push({art: "minijob", text: x.text}); });
  const azubis = state.mitarbeiter.filter(istAzubi).length;
  const gueltig = (state.plaene || {})[sl];

  const p = el(`<div class="panel aendern planentwurf"></div>`);
  const kopf = seitenKopf({eyebrow: "Plan erstellen · Entwurf", titel: `KW ${kwVon(mo)} · ${deVon(mo)} – ${deVon(bis)}`, zurueck: "planen",
    lede: `Geplant ist nur das Nötige. Vertragsstunden unten auffüllen oder offen lassen; Zelle antippen zum Ändern.
      ${gueltig ? "Bis zur Freigabe gilt der bisherige Plan." : "Gültig erst mit „Plan freigeben“."}`});
  p.appendChild(kopf);

  const offenN = zuTun.length;
  const status = el(`<div class="aendern-status">
    <span class="pille">${h1(planSummen(plan).bezahlt)} h geplant</span>
    <span class="pille ${offenN ? "rot" : "gruen"}">${offenN ? `${offenN} noch zu tun` : "Besetzung passt"}</span>
    <span class="pille">${offenStunden > 0.01 ? `${h1(offenStunden)} h Vertragsstunden offen` : "Vertragsstunden verteilt"}</span>
    <div class="spacer"></div>
    <button class="btn ghost small" id="peVerwerfen" type="button">Entwurf verwerfen</button>
    <button class="btn haupt" id="peFreigeben" type="button">Plan freigeben</button></div>`);
  p.appendChild(status);

  // Reihenfolge: zu tun → Vertragsstunden → Entwurf. Der Plan braucht die ganze Breite.
  const oben = el(`<div class="aendern-oben"></div>`), haupt = el(`<div class="aendern-oben"></div>`);
  p.appendChild(oben); p.appendChild(haupt);

  // ---- Noch zu tun ----
  if (zuTun.length){
    const k = el(`<section class="karte rot"><h3>Noch zu tun</h3><div></div></section>`);
    zuTun.forEach(o => {
      const z = el(`<div class="todo"><span>${esc(o.text)}</span></div>`);
      if (o.art === "passtNicht"){
        const b = el(`<button class="btn ghost small" type="button">Herausnehmen</button>`);
        b.onclick = () => { pe.aenderungen = pe.aenderungen.filter(a => a.id !== o.id); neuZeichnen(); };
        z.appendChild(b);
      }
      k.querySelector("div").appendChild(z);
    });
    oben.appendChild(k);
  }

  // ---- Lange Schichten: kein Fehler, aber eine Ausnahme, die man sehen soll ----
  const lange = langeSchichtenKarte(pr.plan);
  if (lange) oben.appendChild(lange);

  // ---- Der Entwurf ----
  const planKarte = el(`<section class="karte entwurf"><div class="karte-kopf"><h3>Entwurf</h3>
    <div class="legende"><span><i class="neu"></i> von dir dazugenommen oder geändert — die gerechnete Zeit klein darunter</span>
    <span><i class="rot"></i> passt so nicht</span></div></div></section>`);
  planKarte.appendChild(planAnzeige(plan, {notizImmer: true, zellen: pr.zellen, luecken: pr.luecken,
    zelleKlick: (i, ti) => zelleBearbeiten(sl, pe, i, ti, pr.plan, neuZeichnen),
    notizKlick: ti => notizBearbeiten(pe, ti, pr.plan, neuZeichnen)}));
  haupt.appendChild(planKarte);
  // Was der Planer zum gerechneten Plan anmerkt (Lücken, die niemand füllen kann, Stundenliste …)
  const wichtig = (pe.kurz.meldungen || []).filter(m => m.art === "bad").map(m => ({art: "bad", text: m.text}))
    .concat(ueberFuenfzig(pr.plan).map(x => ({art: "warn", text: ueberFuenfzigText(x)})));
  if (wichtig.length) haupt.appendChild(el(`<div class="ta-hinweise">${wichtig.map(m =>
    `<div class="note ${m.art}"><span class="ic">${m.art === "bad" ? "×" : "!"}</span><span>${esc(m.text)}</span></div>`).join("")}</div>`));

  // ---- Vertragsstunden ----
  const vk = el(`<section class="karte"><h3>${symbol("uhr")} Vertragsstunden</h3><div class="pe-liste"></div></section>`);
  const liste = vk.querySelector(".pe-liste");
  if (!fehlend.length) liste.appendChild(el(`<p class="zt-leer">${symbol("haken")}<span>Alle Festangestellten haben ihre Vertragsstunden — oder mehr.</span></p>`));
  const vorschlagKnoepfe = (vBox, x) => x.vorschlaege.forEach(v => {
    const b = el(`<button class="pe-vorschlag" type="button"><span class="pe-was"><b>${esc(v.was)}</b><span class="tag">+${h1(v.gewinn)} h</span></span>
      <span class="pe-grund">${esc(v.grund)}</span><span class="pe-tun">Übernehmen</span></button>`);
    b.onclick = () => { auffuellUebernehmen(sl, x.name, v); neuZeichnen(); };
    vBox.appendChild(b);
  });
  // Je Person eine Zeile: wer wie viele Stunden offen hat. Die Vorschläge klappen bei Bedarf auf.
  // Wer mit Überstunden in die Woche geht, baut sie mit den offenen Stunden ab — das steht dabei.
  fehlend.forEach(x => {
    const abbau = x.konto > 0.01;
    const box = el(`<details class="pe-person"${peAuf.has(x.name) ? " open" : ""}>
      <summary><b>${esc(x.name)}</b><span class="pe-offen">${h1(x.fehlt)} h offen</span>
        ${abbau ? `<span class="pe-abbau">baut Überstunden ab: ${ueText(x.konto)} → ${ueText(x.ende) || "0,0"} h</span>`
          : x.ende < -0.01 ? `<span class="pe-minus">Konto danach ${ueText(x.ende)} h</span>` : ""}</summary>
      <p class="hint">${h1(x.ist)} von ${h1(x.soll)} h geplant.</p>
      <div class="pe-vorschlaege"></div></details>`);
    box.ontoggle = () => { if (box.open) peAuf.add(x.name); else peAuf.delete(x.name); };
    const vBox = box.querySelector(".pe-vorschlaege");
    if (!x.vorschlaege.length) vBox.appendChild(el(`<p class="hint">Kein Vorschlag möglich (Ruhezeit, Höchstarbeitszeit oder Abwesenheit).
      Von Hand: Zelle im Plan antippen.</p>`));
    vorschlagKnoepfe(vBox, x);
    liste.appendChild(box);
  });
  // Azubis: ihre Betriebsstunden sind Pflicht und schon eingeplant — fehlt etwas, steht es oben rot
  if (azubis && !zuTun.some(o => o.art === "azubi")) vk.appendChild(el(`<p class="hint pe-azubi">${symbol("haken")}
    ${azubis === 1 ? "Der Azubi ist" : "Die Azubis sind"} bis zu den Betriebsstunden eingeplant.</p>`));

  // Aushilfen: Es zählt nur der Monat gegen die Minijob-Grenze — eine Zeile je Person
  if (aushilfen.length){
    const ak = el(`<div class="pe-aushilfen"><span class="eyebrow">Aushilfen · ${esc(aushilfen[0].monatsname)} · höchstens ${hGenau(aushilfen[0].grenze)} h</span></div>`);
    aushilfen.forEach(a => ak.appendChild(el(`<div class="pe-monat${a.ueber ? " ueber" : ""}"><b>${esc(a.name)}</b>
      <span class="num">${h1(a.ist)} von ${hGenau(a.grenze)} h</span></div>`)));
    vk.appendChild(ak);
  }
  // Was schon dazugenommen wurde — einzeln wieder herausnehmbar
  const dazu = pe.aenderungen.filter(a => a.aktiv && (a.quelle === "auffuellen" || a.quelle === "hand"));
  if (dazu.length){
    const d = el(`<div class="pe-dazu"><span class="eyebrow">Von dir im Entwurf geändert</span></div>`);
    dazu.forEach(a => {
      const z = el(`<div class="pe-zeile"><span>${esc(a.text)}</span><button class="btn ghost small" type="button" title="wieder herausnehmen">×</button></div>`);
      z.querySelector("button").onclick = () => { pe.aenderungen = pe.aenderungen.filter(y => y.id !== a.id); neuZeichnen(); };
      d.appendChild(z);
    });
    vk.appendChild(d);
  }
  oben.appendChild(vk);

  p.querySelector("#peVerwerfen").onclick = () => {
    if (!confirm(`Den Entwurf für KW ${kwVon(mo)} verwerfen?${gueltig ? " Der bisherige Plan der Woche bleibt gültig." : ""}`)) return;
    delete state.planEntwurf[sl]; sichern(); ansicht = "planen"; render();
  };
  p.querySelector("#peFreigeben").onclick = async () => {
    const fragen = [];
    if (zuTun.length) fragen.push(`${zuTun.length === 1 ? "Ein Punkt ist" : zuTun.length + " Punkte sind"} noch offen.`);
    if (gueltig) fragen.push("Der bisherige Plan dieser Woche wird ersetzt.");
    if (fragen.length && !confirm(fragen.join(" ") + " Plan trotzdem freigeben?")) return;
    planFreigeben(sl);
    await speichere();
    zeigeWoche = isoVon(mo); startHinweis = {sl, text: "Der Plan ist freigegeben und gilt jetzt. Nächster Schritt: ausdrucken, in die Gruppe schicken, aushängen."};
    ansicht = "start"; render();
  };
  return p;
}

/* Lange Schichten des Entwurfs (über 8 h Arbeit) — mit dem Grund aus dem Plan und dem Hinweis,
   was dabei gilt. null, wenn es keine gibt. */
function langeSchichtenKarte(plan){
  const lange = langeSchichten(plan);
  if (!lange.length) return null;
  return el(`<section class="karte lang"><h3>${symbol("uhr")} Lange Schicht${lange.length > 1 ? "en" : ""}${infoHtml(esc(LANG_HINWEIS), "Lange Schicht")}</h3>
    <div>${lange.map(x => `<div class="todo"><span>${esc(x.text)}</span></div>`).join("")}</div></section>`);
}

// ==== app/45-ereignisse.js ====
/* Urlaub & Krankheit.

   Eingetragen wird hauptsächlich direkt beim Mitarbeiter (Personal → bearbeiten, oder
   im Plan auf den Namen tippen). Die Kachel „Urlaub & Krankheit“ ist die Übersicht:
   wer wann fehlt, die nächsten Wochen auf einen Blick — bearbeiten lässt es sich dort
   trotzdem. Steht für die Tage schon ein Plan, geht es von hier zu „Plan ändern“. */

const artText = art => (EREIGNIS_ARTEN.find(x => x[0] === art) || [, art])[1];
const datumText = iso => deVon(new Date(iso + "T12:00:00"));
const zeitraumText = e => datumText(e.von) + (e.bis !== e.von ? " – " + datumText(e.bis) : "");

// Was der Knopf sagt — je nach Auswahl, ohne Zahl der Tage
const EINTRAGEN_TEXT = {urlaub: "Urlaub eintragen", krank: "Krankheitsbedingter Ausfall eintragen"};

// Eintragen: für eine feste Person (name) oder mit Auswahl; art: was vorgewählt ist
function ereignisFormular(name, nachher, art){
  const heute = isoVon(new Date());
  // Alle Felder gleich groß (wie im Personal); der Knopf sagt, was eingetragen wird
  const box = el(`<div class="ereignisform">
    <div class="felder${name ? "" : " vier"}">
      ${name ? "" : feldHtml("Wer?", `<select data-person><option value="">— auswählen —</option>${
        state.mitarbeiter.map(m => `<option>${esc(m.name)}</option>`).join("")}</select>`)}
      ${feldHtml("Was?", `<select data-art>${EREIGNIS_ARTEN.map(([v, l]) => `<option value="${v}"${v === art ? " selected" : ""}>${l}</option>`).join("")}</select>`)}
      ${feldHtml("von", `<input type="date" data-von value="${heute}">`)}
      ${feldHtml("bis", `<input type="date" data-bis value="${heute}">`, "Sonn- und Feiertage zählen nicht mit.")}
    </div>
    <div class="ereignisform-knopf"><button class="btn" data-eintragen type="button">Eintragen</button></div>
    <p class="err" data-fehler></p><div data-folgen></div></div>`);
  const von = box.querySelector("[data-von]"), bis = box.querySelector("[data-bis]"), wahl = box.querySelector("[data-art]");
  const knopf = () => { box.querySelector("[data-eintragen]").textContent = EINTRAGEN_TEXT[wahl.value] || "Eintragen"; };
  von.oninput = bis.oninput = () => { if (bis.value < von.value) bis.value = von.value; };
  wahl.onchange = knopf; knopf();
  box.querySelector("[data-eintragen]").onclick = async () => {
    const fehler = box.querySelector("[data-fehler]"); fehler.textContent = "";
    const e = {name: name || box.querySelector("[data-person]").value, art: box.querySelector("[data-art]").value,
               von: von.value, bis: bis.value};
    if (!e.name){ fehler.textContent = "Bitte die Person wählen."; return; }
    let neu;
    try { neu = ereignisEintragen(e); } catch(err){ fehler.textContent = err.message; return; }
    await speichere();
    if (nachher) nachher(neu);
    const folgen = box.querySelector("[data-folgen]");
    folgen.innerHTML = ""; folgen.appendChild(ereignisFolgen(neu));
  };
  return box;
}

// Was ein Eintrag für schon erstellte Pläne bedeutet — mit dem Weg zu „Plan ändern“
function ereignisFolgen(e){
  const betroffen = ereignisBetroffen(e);
  if (!betroffen.length) return el(`<div class="note ok"><span class="ic">✓</span><span>Eingetragen: ${esc(e.name)}, ${esc(artText(e.art))}.
    Kein Plan betroffen.</span></div>`);
  const n = el(`<div class="note warn"><span class="ic">!</span><span>Eingetragen: ${esc(e.name)}, ${esc(artText(e.art))}.
    ${betroffen.length === 1 ? "Ein Plan ist" : "Pläne sind"} betroffen — in „Plan ändern“ lösen.
    <span class="knopfreihe"></span></span></div>`);
  betroffen.forEach(b => {
    const k = el(`<button class="btn small" type="button">KW ${+b.sl.slice(-2)}: ${tageText(b.tage)} — Plan ändern</button>`);
    k.onclick = () => planAendernOeffnen(b.sl);
    n.querySelector(".knopfreihe").appendChild(k);
  });
  return n;
}

// Liste der Einträge, auf Wunsch nur einer Person
function ereignisListe(name, nachher){
  const heute = isoVon(new Date());
  const alle = (state.ereignisse || []).filter(e => !name || e.name === name)
    .sort((a, b) => a.von < b.von ? -1 : 1);
  const kommend = alle.filter(e => e.bis >= heute), vorbei = alle.filter(e => e.bis < heute).reverse();
  const box = el(`<div></div>`);
  const tabelle = (liste, leerText) => {
    if (!liste.length) return el(`<p class="empty">${leerText}</p>`);
    const tab = el(`<div class="tablewrap"><table class="ereignisse-tab"><thead><tr>${name ? "" : "<th>Wer</th>"}<th>Was</th>
      <th>Zeitraum</th><th class="n">Arbeitstage</th><th></th></tr></thead><tbody></tbody></table></div>`);
    liste.forEach(e => {
      const tage = ereignisTage(e).length;

/* Wiederherstellungscode: der Weg zurück, wenn das Kennwort vergessen ist.

   Beim Anlegen einer Filiale — und auf Wunsch unter „Sicherung“ — erzeugt die App einen
   zufälligen Code und zeigt ihn genau einmal, zum Aufschreiben oder Ausdrucken. Gespeichert
   wird nur sein Streuwert (state.wh), nie der Code selbst. In der Anmeldung lässt sich damit
   ein neues Kennwort setzen; danach ist der Code verbraucht und es gibt einen neuen.
   Wie das Kennwort ist das eine Zugangssperre auf diesem Gerät, keine Verschlüsselung. */

const WH_ZEICHEN = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";       // ohne I, O, 0 und 1 — nichts zu verwechseln
// 16 Zeichen aus 32 = 80 Bit Zufall, in Vierergruppen: „K7MF-2QXP-9TRA-HB3D“
function whCodeNeu(){
  const z = new Uint8Array(16);
  crypto.getRandomValues(z);
  return [...z].map(b => WH_ZEICHEN[b % 32]).join("").replace(/(.{4})(?=.)/g, "$1-");
}
// Was getippt wurde, vergleichbar machen: Großbuchstaben, ohne Striche und Leerzeichen
const whForm = code => String(code || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
const whStreuwert = (nr, code) => hash(String(nr) + ":wh:" + whForm(code));

// Für die angemeldete Filiale einen neuen Code anlegen (ein alter wird damit ungültig) → der Code
async function whAnlegen(){
  const code = whCodeNeu();
  state.wh = await whStreuwert(state.nr, code);
  state.whAm = isoVon(new Date());
  await speichere();
  return code;
}

// Mit dem Code ein neues Kennwort setzen. Gelingt es, ist die Filiale geladen (state) und der
// Code durch einen neuen ersetzt → {code} oder {fehler}
let whFehlversuche = 0;
async function whEinloesen(nr, code, neuesKennwort){
  const daten = await ladeFiliale(nr);
  if (!daten) return {fehler: `Für N ${nr} gibt es auf diesem Gerät keinen Bereich.`};
  if (!daten.wh) return {fehler: "Für diese Filiale wurde noch kein Wiederherstellungscode angelegt. Ohne Code lässt sich das Kennwort nicht zurücksetzen."};
  if (whForm(code).length !== 16 || daten.wh !== await whStreuwert(nr, code)){
    // jeder Fehlversuch kostet etwas länger — Raten lohnt nicht
    whFehlversuche++;
    await new Promise(fertig => setTimeout(fertig, Math.min(8000, 600 * whFehlversuche)));
    return {fehler: "Der Code stimmt nicht. Er hat 16 Zeichen in vier Gruppen — bitte genau so eintragen, wie er notiert wurde."};
  }
  whFehlversuche = 0;
  state = Object.assign(leer(), daten);
  state.pw = await hash(String(nr) + ":" + neuesKennwort);
  return {code: await whAnlegen()};
}

/* Den Code zeigen — nur jetzt. Schließen lässt sich das Fenster erst, wenn bestätigt ist,
   dass er notiert wurde. anlass: neu | ersetzt | sicherung */
function whZeigen(code, anlass){
  return new Promise(fertig => {
    const inhalt = el(`<div class="wh">
      <h3>Wiederherstellungscode für N ${esc(state.nr)}</h3>
      <p class="hint">${anlass === "ersetzt" ? "Das neue Kennwort gilt. Der alte Code ist damit verbraucht — hier ist der neue."
        : anlass === "sicherung" ? "Ein früherer Code gilt ab jetzt nicht mehr." : "Die Filiale ist angelegt."}
        Mit diesem Code setzt du ein neues Kennwort, wenn das alte einmal fehlt.</p>
      <div class="wh-code" aria-label="Wiederherstellungscode">${esc(code)}</div>
      <div class="note warn"><span class="ic">!</span><span>Der Code wird <b>nur jetzt</b> gezeigt. Schreib ihn auf oder druck ihn aus
        und bewahre ihn getrennt vom Gerät auf — wer ihn hat, kann das Kennwort ändern.</span></div>
      <div class="dialog-knoepfe"><button class="btn ghost" data-blatt type="button">${inApp ? "Als Blatt teilen oder drucken" : "Als Blatt (PDF) sichern"}</button></div>
      <label class="switch" style="margin-top:14px"><input type="checkbox" data-notiert> Ich habe den Code notiert oder ausgedruckt</label>
      <div class="dialog-knoepfe unten"><div class="spacer"></div><button class="btn" data-fertig type="button" disabled>Fertig</button></div></div>`);
    const d = dialogZeigen(inhalt);
    d.onclick = null;                                  // nicht versehentlich wegtippen
    inhalt.querySelector("[data-notiert]").onchange = e => inhalt.querySelector("[data-fertig]").disabled = !e.target.checked;
    inhalt.querySelector("[data-blatt]").onclick = () => whBlatt(code);
    inhalt.querySelector("[data-fertig]").onclick = () => { d.remove(); fertig(); };
  });
}

// Ein Blatt zum Ausdrucken: Filiale, Code, was damit zu tun ist
function whBlatt(code){
  if (!window.jspdf){ alert("Die PDF-Bibliothek ist nicht geladen — bitte den Code von Hand notieren."); return; }
  const {jsPDF} = window.jspdf;
  const doc = new jsPDF({orientation: "portrait", unit: "mm", format: "a4"});
  doc.setFont("helvetica", "bold"); doc.setFontSize(18);
  doc.text("Filialplaner — Wiederherstellungscode", 20, 30);
  doc.setFont("helvetica", "normal"); doc.setFontSize(12);
  doc.text(`Filiale N ${state.nr}${state.ort ? " · " + state.ort : ""}`, 20, 42);
  doc.text(`Erstellt am ${new Date().toLocaleDateString("de-DE")}`, 20, 49);
  doc.setDrawColor(40); doc.setLineWidth(0.5); doc.roundedRect(20, 60, 170, 28, 3, 3);
  doc.setFont("courier", "bold"); doc.setFontSize(26);
  doc.text(code, 105, 78, {align: "center"});
  doc.setFont("helvetica", "normal"); doc.setFontSize(11);
  ["Mit diesem Code lässt sich in der Anmeldung über „Kennwort vergessen?“ ein neues Kennwort setzen.",
   "Der Code gilt genau einmal. Danach zeigt die App einen neuen — dieses Blatt dann ersetzen.",
   "Getrennt vom Gerät aufbewahren, zum Beispiel bei den Filialunterlagen. Wer den Code hat,",
   "kann das Kennwort ändern."].forEach((zeile, n) => doc.text(zeile, 20, 102 + n * 6.5));
  anbieten(doc.output("blob"), `Wiederherstellungscode-N${state.nr}.pdf`);
}

// Kachel unter „Sicherung“: Gibt es einen Code? Neu anlegen (der alte wird ungültig)
function whKachel(){
  const k = el(`<div class="wh-kachel"><span class="eyebrow">Kennwort vergessen?</span>
    <h3>Wiederherstellungscode${infoHtml("Mit dem Code lässt sich in der Anmeldung ein neues Kennwort setzen. Ohne Code gibt es keinen Weg zurück. Ist das Blatt verloren, hier einen neuen Code anlegen — der alte gilt dann nicht mehr.", "Wiederherstellungscode")}</h3>
    <p class="wh-stand">${state.wh ? `Angelegt${state.whAm ? " am " + deVon(new Date(state.whAm + "T12:00:00")) : ""}.` : "Noch keiner angelegt."}</p>
    <button class="btn ${state.wh ? "ghost " : ""}small" type="button">${state.wh ? "Neuen Code anlegen" : "Code anlegen"}</button></div>`);
  k.querySelector("button").onclick = async () => {

    const code = await whAnlegen();
    await whZeigen(code, "sicherung");
    render();
  };
  return k;
}

// ==== app/47-aendern.js ====
/* Plan ändern: der Baukasten für einen bestehenden Plan.

   Oben, was noch zu tun ist (rot). Daneben der Entwurf: rot, was nicht passt, grün, was
   geändert wurde und passt — die alte Zeit steht klein und durchgestrichen darunter.
   Je Ausfall die Lösungen als Karten: Problem in einem Satz, dann je Lösung, wer was
   anders macht (vorher → nachher), ein Tagesbalken, Ergebnis und Kosten. Antippen zeigt
   eine Lösung im Plan, nochmal antippen nimmt sie heraus. Erst „Übernehmen“ macht den
   Entwurf zum gültigen Plan. Nur hier lässt sich der Plan von Hand bearbeiten. */

let aendernWoche = null;

function planAendernOeffnen(sl){
  if (!(state.plaene || {})[sl]){ alert("Für diese Woche gibt es noch keinen Plan."); return; }
  aendernWoche = sl;
  ansicht = "aendern";
  render();
}

// Welcher Wochentag ist heute (0 = Mo)? Tage davor sind vorbei.
function heuteImPlan(kurz){
  const jetzt = new Date(); jetzt.setHours(12, 0, 0, 0);
  return Math.max(0, Math.min(6, Math.round((jetzt - montagDer(kurz.mo)) / 864e5)));
}

// Ergebnisse des Optimierers je Ausfall, solange die Seite offen ist
const umplanSpeicher = {};

function aendernAnsicht(){
  const sl = aendernWoche;
  const kurz = (state.plaene || {})[sl];
  if (!kurz){ ansicht = "start"; return startseite(); }
  const eintrag = entwurfHolen(sl);
  const pr = entwurfPruefen(sl, kurz, eintrag);
  const mo = montagDer(kurz.mo), bis = new Date(mo.getTime() + 5 * 864e5);
  const aktiv = eintrag.aenderungen.filter(a => a.aktiv);
  const neuZeichnen = () => { const y = window.scrollY; sichern(); render(); window.scrollTo(0, y); };
  const zurStartseite = () => { sichern(); zeigeWoche = isoVon(mo); ansicht = "start"; render(); };

  // Wochen mit Plan zur Auswahl — mit der Zahl dessen, was dort offen ist
  const jetzt = wochenSchluessel(montagDer(null));
  const wochen = Object.keys(state.plaene).filter(x => x >= jetzt || x === sl).sort();
  const wahl = `<label class="f wochenwahl">Woche<select id="aeWoche">${wochen.map(x => {
    const n = planKonflikte(x).length + pausenLuecken(state.plaene[x]).length + aufgabenAusserhalb(state.plaene[x]).length, d = montagAusSchluessel(x);
    return `<option value="${x}"${x === sl ? " selected" : ""}>KW ${kwVon(d)} · ${deVon(d)}${n ? ` · ${n} offen` : ""}</option>`;
  }).join("")}</select></label>`;

  const p = el(`<div class="panel aendern"></div>`);
  const kopf = seitenKopf({eyebrow: "Plan ändern", titel: `KW ${kwVon(mo)} · ${deVon(mo)} – ${deVon(bis)}`,
    lede: `Der ausgehängte Plan gilt, bis du „Übernehmen“ drückst. Zelle antippen zum Ändern.`, rechts: wahl});
  kopf.querySelector(".zurueck-link").onclick = zurStartseite;
  p.appendChild(kopf);

  // Statusleiste: wie viel ist offen, wie viel geändert — und die drei Wege hinaus
  const offenN = pr.offen.length;
  const status = el(`<div class="aendern-status">
    <button class="btn ghost" id="aeZurueck" type="button">${symbol("zurueck")}<span>Zurück</span></button>
    <span class="pille ${offenN ? "rot" : "gruen"}">${offenN ? `${offenN} noch zu tun` : "nichts offen"}</span>
    <span class="pille ${aktiv.length ? "gruen" : ""}">${aktiv.length} ${aktiv.length === 1 ? "Änderung" : "Änderungen"}</span>
    <button class="btn ghost small nur-schmal" id="aeZumPlan" type="button">Plan ansehen ↓</button>
    <div class="spacer"></div>
    <button class="btn ghost small" id="aeVerwerfen" type="button"${eintrag.aenderungen.some(a => a.quelle !== "abwesenheit") ? "" : " disabled"}>Entwurf verwerfen</button>
    <button class="btn haupt" id="aeUebernehmen" type="button"${aktiv.length ? "" : " disabled"}>Übernehmen</button></div>`);
  p.appendChild(status);

  // Oben über die ganze Breite: was zu tun ist und der Entwurf im Filialformular.
  // Darunter zweispaltig: Lösungen | Assistent. Am Handy (in der Filiale) steht der Assistent
  // vorn, die Lösungen direkt darunter und der Plan danach — siehe .aendern-plan im Stil. Zurückgenommen wird eine Änderung dort, wo sie
  // entstanden ist: an der Zelle („wie im gültigen Plan“), an der Lösungs- oder Assistentenkarte.
  const oben = el(`<div class="aendern-oben"></div>`);
  p.appendChild(oben);
  const planBlock = el(`<div class="aendern-plan"></div>`);
  p.appendChild(planBlock);
  const raster = el(`<div class="aendern-raster"><div class="aendern-haupt"></div><div class="aendern-seite"></div></div>`);
  p.appendChild(raster);
  const haupt = raster.querySelector(".aendern-haupt"), seite = raster.querySelector(".aendern-seite");

  // ---- Noch zu tun (rot) ----
  if (pr.offen.length){
    const k = el(`<section class="karte rot"><h3>Noch zu tun</h3><div></div></section>`);
    pr.offen.forEach(o => {
      const z = el(`<div class="todo"><span>${esc(o.text)}${o.info ? infoHtml(esc(o.info), "Frist") : ""}</span></div>`);
      if (o.art === "konflikt"){
        // eine Abwesenheit, deren Ausfall im Entwurf abgeschaltet wurde
        const b = el(`<button class="btn small" type="button">Aus dem Plan nehmen</button>`);
        b.onclick = () => { const a = eintrag.aenderungen.find(x => x.id === `abw:${o.name}:${o.ti}`); if (a) a.aktiv = true; neuZeichnen(); };
        z.appendChild(b);
      }
      if (o.art === "luecke" || o.art === "konflikt"){
        const b = el(`<button class="btn ghost small" type="button">Vorschläge</button>`);
        b.onclick = () => { if (assistentFrage) assistentFrage(o.art === "konflikt" ? `Vorschläge für ${o.name.split(" ")[0]} am ${tagName(o.ti)}` : `Vorschläge für ${tagName(o.ti)}`); };
        z.appendChild(b);
      }
      if (o.art === "aufgaben"){
        const b = el(`<button class="btn small" type="button">Aufgaben neu legen</button>`);
        b.onclick = () => {
          eintrag.aenderungen.push({id: "aufgaben:" + o.ti, typ: "aufgaben", ti: o.ti, aktiv: true, quelle: "hand", text: `${tagName(o.ti)}: Aufgaben neu gelegt`});
          neuZeichnen();
        };
        z.appendChild(b);
      }
      if (o.art === "pausen"){
        const b = el(`<button class="btn small" type="button">Pausen verschieben</button>`);
        b.onclick = () => {
          eintrag.aenderungen.push({id: "pausen:" + o.ti, typ: "pausen", ti: o.ti, aktiv: true, quelle: "hand", text: `${tagName(o.ti)}: Pausen verschoben`});
          neuZeichnen();
        };
        z.appendChild(b);
      }
      if (o.art === "passtNicht"){
        const b = el(`<button class="btn ghost small" type="button">Abschalten</button>`);
        b.onclick = () => { aenderungAus(eintrag, o.id); neuZeichnen(); };
        z.appendChild(b);
      }
      k.querySelector("div").appendChild(z);
    });
    oben.appendChild(k);
  }

  const lange = langeSchichtenKarte(pr.plan);
  if (lange) oben.appendChild(lange);

  // ---- Der Entwurf ----
  const planKarte = el(`<section class="karte entwurf"><div class="karte-kopf"><h3>Entwurf</h3>
    <div class="legende"><span><i class="neu"></i> geändert, passt — alte Zeit klein darunter</span>
    <span><i class="rot"></i> muss noch geändert werden</span><span><i class="weg"></i> fällt weg</span></div></div></section>`);
  planKarte.appendChild(planAnzeige(planLaden(pr.plan), {notizImmer: true, zellen: pr.zellen, luecken: pr.luecken,
    zelleKlick: (i, ti) => zelleBearbeiten(sl, eintrag, i, ti, pr.plan, neuZeichnen),
    notizKlick: ti => notizBearbeiten(eintrag, ti, pr.plan, neuZeichnen)}));
  planBlock.appendChild(planKarte);

  // ---- Lösungen je Ausfall ----
  const vk = el(`<section class="karte loesungen"><h3>${symbol("funke")} Lösungen${infoHtml("Ausführlich, was du beim Assistenten angefragt oder ausgewählt hast — mit Tagesbalken und Konto.", "Lösungen")}</h3><div></div></section>`);
  const vBox = vk.querySelector("div");
  // Nur, was über den Assistenten verlangt (seine letzte Antwort) oder ausgewählt wurde (eingeschaltet)
  const kontext = eintrag.kontext || {};
  const letzte = (eintrag.chat || []).slice().reverse().find(n => n.wer === "assistent");
  const verlangt = new Set((letzte && letzte.karten) || []);
  const relevant = eintrag.aenderungen.filter(a => (a.typ === "loesung" || a.typ === "tage") && (a.aktiv || verlangt.has(a.id)));
  const titel = new Set(relevant.map(a => a.titel));
  const fuer = new Set(relevant.map(a => a.fuer).filter(Boolean).concat(kontext.umplanen ? [kontext.umplanen] : []));
  const gruppen = [...fuer].map(id => {
    const aus = eintrag.aenderungen.find(a => a.id === id && a.typ === "abwesend");
    if (!aus) return null;
    // Auch ein Ausfall, der noch nicht im Plan ist, bekommt seine Vorschläge — gerechnet, als wäre er es
    const probe = aus.aktiv ? eintrag : Object.assign({}, eintrag, {aenderungen: eintrag.aenderungen.map(a => a === aus ? Object.assign({}, a, {aktiv: true}) : a)});
    return entwurfVorschlaege(sl, kurz, probe, heuteImPlan(kurz)).find(g => g.fuer.id === id) || null;
  }).filter(Boolean);
  // Vorschläge zu einer anderen Änderung (früher gehen, frei, Tausch): kurz je Karte
  const andere = relevant.filter(a => a.typ === "loesung" && !eintrag.aenderungen.some(x => x.id === a.fuer && x.typ === "abwesend"));
  if (!gruppen.length && !andere.length) vBox.appendChild(el(`<p class="empty">Noch nichts angefragt.</p>`));
  gruppen.forEach(g => vBox.appendChild(loesungsGruppe(g, sl, kurz, eintrag, neuZeichnen,
    w => titel.has(w.titel), kontext.umplanen === g.fuer.id || relevant.some(a => a.typ === "tage" && a.fuer === g.fuer.id))));
  if (andere.length){
    const box = el(`<div class="lgruppe"><div class="problem"><b>Vorschläge zu einer Änderung</b></div></div>`);
    andere.forEach(a => {
      const zu = eintrag.aenderungen.find(x => x.id === a.fuer);
      const k = el(`<div class="lkarte${a.aktiv ? " an" : ""}"><div class="lk-kopf"><span class="lk-nr">${esc(tagName(a.ti))}</span>
          <b>${esc(a.text)}</b>${a.weg ? `<span class="tag">${esc(a.weg.passt.split(" · ").slice(1).join(" · ") || "")}</span>` : ""}</div>
        ${zu ? `<p class="hint">zu: ${esc(zu.text)}</p>` : ""}
        ${a.weg ? `<ul class="lk-zeilen">${a.weg.zeilen.map(z => `<li><b>${esc(z.name)}</b>: ${z.vorher ? `<s>${esc(z.vorher)}</s> → ` : ""}${esc(z.nachher || "frei")}</li>`).join("")}</ul>
        <p class="lk-ergebnis ${a.weg.voll ? "ok" : "teil"}">${a.weg.voll ? "✓ Lücke geschlossen" : "◐ teilweise — " + esc(spannenText(a.weg.offen)) + " bleibt offen"}</p>` : ""}
        <div class="lk-unten"><button class="btn ${a.aktiv ? "" : "ghost "}small lk-knopf" type="button">${a.aktiv ? "✓ Im Plan · zurücknehmen" : "Im Plan anzeigen"}</button></div></div>`);
      k.querySelector(".lk-knopf").onclick = () => {
        if (a.aktiv) aenderungAus(eintrag, a.id);
        else { a.aktiv = true; (a.mit || (a.fuer ? [a.fuer] : [])).forEach(id => { const f = eintrag.aenderungen.find(x => x.id === id); if (f) f.aktiv = true; }); }
        neuZeichnen();
      };
      box.appendChild(k);
    });
    vBox.appendChild(box);
  }
  haupt.appendChild(vk);

  // ---- Assistent ----
  seite.appendChild(assistentKarte(sl, kurz, eintrag, neuZeichnen));

  // am Handy steht der Plan unter Assistent und Lösungen — ein Tipp führt hin
  p.querySelector("#aeZumPlan").onclick = () => planBlock.scrollIntoView({block: "start", behavior: "smooth"});
  p.querySelector("#aeWoche").onchange = e => planAendernOeffnen(e.target.value);
  p.querySelector("#aeZurueck").onclick = zurStartseite;
  p.querySelector("#aeVerwerfen").onclick = () => {
    if (!confirm("Den ganzen Entwurf verwerfen? Der gültige Plan bleibt, wie er ist.")) return;
    delete state.entwuerfe[sl]; neuZeichnen();
  };
  p.querySelector("#aeUebernehmen").onclick = async () => {
    if (pr.offen.length && !confirm(`Es ${pr.offen.length === 1 ? "ist noch ein Punkt" : `sind noch ${pr.offen.length} Punkte`} offen. Trotzdem übernehmen?`)) return;
    entwurfUebernehmen(sl);
    await speichere();
    zeigeWoche = isoVon(mo); startHinweis = sl; ansicht = "start"; render();
  };
  return p;
}

/* Eine Gruppe: Problem in einem Satz, darunter die Lösungen als Karten */
/* zeigeWeg: welche Wege erscheinen (die vom Assistenten verlangten oder ausgewählten);
   mitUmplanen: die Umplanung über mehrere Tage nur, wenn sie verlangt wurde */
function loesungsGruppe(g, sl, kurz, eintrag, fertig, zeigeWeg, mitUmplanen){
  const c = g.fuer, datum = deVon(tagDatum(kurz, c.ti));
  const box = el(`<div class="lgruppe">
    <div class="problem"><b>${tagName(c.ti)}, ${datum}: ${esc(c.name)} fällt aus</b>
      <span>${esc(GRUND_NAME[c.grund] || "")} · geplant war ${hhmm(g.schicht.von)}–${hhmm(g.schicht.bis)}</span>
      <p>${g.luecke.length ? `Ohne Ersatz ist <b>${spannenText(g.luecke)}</b> nicht richtig besetzt: ${esc(g.fehlt)}.`
        : "Es entsteht keine Lücke — die übrige Besetzung reicht. Niemand muss einspringen."}</p>
      ${g.vergangen ? `<p class="hint">Der Tag ist vorbei — eine Lösung hier hält nur fest, wie es tatsächlich war.</p>` : ""}</div></div>`);
  if (!g.luecke.length) return box;
  const aktivL = eintrag.aenderungen.find(a => a.aktiv && a.fuer === c.id);
  if (!g.wege.length) box.appendChild(el(`<div class="note warn"><span class="ic">!</span><span>Am Tag ohne Regelverstoß nicht lösbar —
    über mehrere Tage umplanen oder eine Ausnahme klären.</span></div>`));
  g.wege.forEach((w, n) => {
    if (zeigeWeg && !zeigeWeg(w)) return;
    const an = aktivL && aktivL.typ === "loesung" && aktivL.titel === w.titel;
    const karte = wegKarte(w, n, an, g);
    karte.querySelector(".lk-knopf").onclick = () => {
      // je Ausfall höchstens eine Lösung — eine andere ersetzt die bisherige
      eintrag.aenderungen = eintrag.aenderungen.filter(a => a.fuer !== c.id);
      if (!an) eintrag.aenderungen.push({id: aenderungsId(), aktiv: true, quelle: "vorschlag", typ: "loesung",
        fuer: c.id, ti: w.ti, schritte: w.schritte, titel: w.titel, text: `${tagName(w.ti)}: ${w.titel}`});
      fertig();
    };
    box.appendChild(karte);
  });
  // Über mehrere Tage: der Optimierer plant die Woche um, so wenig wie möglich anders
  const merk = c.id + "|" + eintrag.aenderungen.filter(a => a.aktiv && a.fuer !== c.id).map(a => a.id).join(",");
  const umplanen = el(`<button class="btn ghost small" type="button">Über mehrere Tage umplanen</button>`);
  const zeigeUmplanung = v => {
    const an = aktivL && aktivL.typ === "tage";
    const k = el(`<div class="lkarte${an ? " an" : ""}"><div class="lk-kopf"><span class="lk-nr">Umplanung</span>
      <b>Mehrere Tage werden neu verteilt</b><span class="tag">${v.mehr > 0.01 ? "+" + h1(v.mehr) + " h" : v.mehr < -0.01 ? h1(v.mehr) + " h" : "±0 h"}</span></div>
      <ul class="lk-zeilen">${v.zeilen.map(z => `<li>${esc(z)}</li>`).join("")}</ul>
      <div class="lk-unten"><button class="btn ${an ? "" : "ghost "}small lk-knopf" type="button">${an ? "✓ Im Plan · zurücknehmen" : "Im Plan anzeigen"}</button></div></div>`);
    k.querySelector(".lk-knopf").onclick = () => {
      eintrag.aenderungen = eintrag.aenderungen.filter(a => a.fuer !== c.id);
      if (!an){
        const t = v.aenderungen[0];
        eintrag.aenderungen.push({id: aenderungsId(), aktiv: true, quelle: "vorschlag", typ: "tage", fuer: c.id,
          titel: "Umplanen über mehrere Tage", text: "Umplanung: " + v.zeilen.join(" · "),
          tage: Object.fromEntries(Object.entries(t.tage).map(([kk, l]) => [kk, l.map(s => ({name: t.namen[s.mi], s}))]))});
      }
      fertig();
    };
    umplanen.replaceWith(k);
  };
  umplanen.onclick = async () => {
    umplanen.disabled = true; umplanen.textContent = "Wird gerechnet …";
    const andere = eintrag.aenderungen.filter(x => x !== c && x.fuer !== c.id);
    const ohne = entwurfAnwenden(kurz, andere).plan;
    const v = await mitEntwurfsAbwesenheitenAsync(sl, andere, () =>
      ausfallUmplanen(ohne, platzImPlan(ohne, c.name), c.ti, c.grund, Math.min(c.ti, heuteImPlan(kurz))));
    umplanSpeicher[merk] = v || false;
    if (!v){ umplanen.textContent = "Auch über mehrere Tage keine Lösung ohne Regelverstoß"; return; }
    zeigeUmplanung(v);
  };
  if (mitUmplanen === false) return box;
  if (umplanSpeicher[merk]) setTimeout(() => zeigeUmplanung(umplanSpeicher[merk]), 0);
  else if (umplanSpeicher[merk] === false){ umplanen.disabled = true; umplanen.textContent = "Auch über mehrere Tage keine Lösung ohne Regelverstoß"; }
  // Verlangt (über den Assistenten) oder ohne vollständige Lösung am Tag: der Optimierer rechnet gleich los
  else if (mitUmplanen || !g.wege.some(w => w.voll)) setTimeout(() => { if (document.body.contains(umplanen)) umplanen.click(); }, 50);
  box.appendChild(umplanen);
  return box;
}

// Wie mitEntwurfsAbwesenheiten, aber für eine Rechnung, die wartet (Optimierer)
async function mitEntwurfsAbwesenheitenAsync(sl, aenderungen, fn){
  state.abwesend = state.abwesend || {};
  const vorher = kopie(state.abwesend[sl] || {});
  const w = state.abwesend[sl] = kopie(vorher);
  aenderungen.filter(a => a.aktiv && a.typ === "abwesend").forEach(a => {
    const i = personIndex(a.name);
    if (i >= 0) w[i] = Object.assign({}, w[i], {[TAGE[a.ti][0]]: a.grund});
  });
  try { return await fn(); } finally { state.abwesend[sl] = vorher; }
}

/* Eine Lösung als Karte: Titel, wer was anders macht, Tagesbalken, Ergebnis, Kosten */
function wegKarte(w, n, an, g){
  const k = el(`<div class="lkarte${an ? " an" : ""}${w.voll ? "" : " teil"}">
    <div class="lk-kopf"><span class="lk-nr">${w.voll ? (n === 0 ? "Empfohlen" : `Lösung ${n + 1}`) : "Teillösung"}</span>
      <b>${esc(w.titel)}</b>
      <span class="tag">${w.mehr > 0.01 ? "+" + h1(w.mehr) + " h" : w.mehr < -0.01 ? h1(w.mehr) + " h" : "±0 h"}</span>${
        (w.lang || []).length ? `<span class="tag lang">lange Schicht</span>` : ""}</div>
    <ul class="lk-zeilen">${w.zeilen.map(z => `<li><b>${esc(z.name)}</b>: ${z.vorher ? `<s>${esc(z.vorher)}</s> → ` : ""}${esc(z.nachher || "frei")}</li>`).join("")}</ul>
    <div class="lk-balken"></div>
    <p class="lk-ergebnis ${w.voll ? "ok" : "teil"}">${w.voll ? `✓ Lücke ${spannenText(w.luecke)} geschlossen`
      : `◐ teilweise — ${spannenText(w.offen)} bleibt offen`}</p>
    ${w.konto.length ? `<p class="lk-konto">Konto nach der Woche: ${w.konto.map(x => `${esc(x.name.split(" ")[0])} ${ueText(x.ende) || "0,0"} h`).join(" · ")}</p>` : ""}
    <div class="lk-unten"><button class="btn ${an ? "" : "ghost "}small lk-knopf" type="button">${an ? "✓ Im Plan · zurücknehmen" : "Im Plan anzeigen"}</button>
      <details><summary>Warum?</summary><p>${esc(w.warum || "")}</p></details></div></div>`);
  k.querySelector(".lk-balken").appendChild(tagesBalken(w, g));
  return k;
}

/* Tagesbalken (Gantt): je beteiligter Person vorher (grau) und nachher (grün), dazu
   die Lücke als rotes Band — so sieht man auf einen Blick, wer wann da ist. */
function tagesBalken(w, g){
  const reihen = [];
  if (g) reihen.push({name: g.fuer.name, vorher: [[g.schicht.von, g.schicht.bis]], nachher: [], weg: true});
  w.zeilen.forEach(z => reihen.push({name: z.name, vorher: zeitenAusText(z.vorher), nachher: zeitenAusText(z.nachher)}));
  const alle = reihen.flatMap(r => r.vorher.concat(r.nachher)).flat().concat(w.luecke.length ? [Math.min(...w.luecke), Math.max(...w.luecke) + 30] : []);
  const a = Math.floor(Math.min(...alle) / 60) * 60, b = Math.ceil(Math.max(...alle) / 60) * 60;
  const x = m => ((m - a) / (b - a) * 100).toFixed(2) + "%";
  const breite = (v, bis) => ((bis - v) / (b - a) * 100).toFixed(2) + "%";
  const band = w.luecke.length ? spannen(w.luecke).map(([v, bis]) => `<i class="tb-luecke" style="left:${x(v)};width:${breite(v, bis)}"></i>`).join("") : "";
  const offen = w.offen.length ? spannen(w.offen).map(([v, bis]) => `<i class="tb-offen" style="left:${x(v)};width:${breite(v, bis)}"></i>`).join("") : "";
  const striche = [];
  for (let m = a; m <= b; m += 60) striche.push(`<span class="tb-uhr" style="left:${x(m)}">${m / 60}</span>`);
  return el(`<div class="tagesbalken" role="img" aria-label="Tagesverlauf vorher und nachher">
    ${reihen.map(r => `<div class="tb-reihe"><span class="tb-name">${esc(r.name.split(" ")[0])}</span><span class="tb-spur">${band}${
      r.vorher.map(([v, bis]) => `<i class="tb-vorher${r.weg ? " tb-weg" : ""}" style="left:${x(v)};width:${breite(v, bis)}" title="vorher ${hhmm(v)}–${hhmm(bis)}"></i>`).join("")}${
      r.nachher.map(([v, bis]) => `<i class="tb-nachher" style="left:${x(v)};width:${breite(v, bis)}" title="nachher ${hhmm(v)}–${hhmm(bis)}"></i>`).join("")}</span></div>`).join("")}
    <div class="tb-reihe tb-achse"><span class="tb-name"></span><span class="tb-spur">${offen}${striche.join("")}</span></div>
    <div class="tb-legende"><span><i class="tb-vorher"></i> vorher</span><span><i class="tb-nachher"></i> nachher</span>
      <span><i class="tb-luecke"></i> Lücke</span>${w.offen.length ? `<span><i class="tb-offen"></i> bleibt offen</span>` : ""}</div></div>`);
}
// [600, 630, 840] → [[600, 660], [840, 870]]
function spannen(punkte){
  const raus = [];
  [...punkte].sort((a, b) => a - b).forEach(m => { const l = raus[raus.length - 1]; if (l && l[1] === m) l[1] = m + 30; else raus.push([m, m + 30]); });
  return raus;
}

// Eine Änderung zurücknehmen — mit allem, was an ihr hängt (die Lösung für einen Ausfall)
function aenderungAus(eintrag, id){
  const a = eintrag.aenderungen.find(x => x.id === id);
  if (!a) return;
  if (a.quelle === "assistent" || a.quelle === "abwesenheit") a.aktiv = false;   // bleibt zum erneuten Einschalten
  else eintrag.aenderungen = eintrag.aenderungen.filter(x => x.id !== id);
  eintrag.aenderungen = eintrag.aenderungen.filter(x => x.fuer !== id || x.quelle === "assistent");
  // Lösungen, die an dieser Änderung hängen (auch als eine von mehreren, z. B. beim Tausch), gehen mit
  eintrag.aenderungen.forEach(x => { if (x.fuer === id || (x.mit || []).includes(id)) x.aktiv = false; });
}

// Dialog über dem Plan
function dialogZeigen(inhalt){
  const d = el(`<div class="dialog-hinter" role="dialog" aria-modal="true"><div class="dialog"></div></div>`);
  d.querySelector(".dialog").appendChild(inhalt);
  d.onclick = e => { if (e.target === d) d.remove(); };
  document.body.appendChild(d);
  const f = d.querySelector("input,select,button"); if (f) f.focus();
  return d;
}

// Eine Zelle von Hand ändern: Zeiten, frei, fällt aus, zurücksetzen
function zelleBearbeiten(sl, eintrag, i, ti, plan, fertig){
  const m = state.mitarbeiter[i];
  const s = schichtenVon(plan, m.name, ti)[0];
  const inhalt = el(`<div>
    <h3>${esc(m.name)} · ${tagName(ti)}, ${deVon(tagDatum(plan, ti))}</h3>
    <p class="hint">${s ? `Im Entwurf: ${hhmm(s.von)}–${hhmm(s.bis)}${s.pause ? `, Pause ${hhmm(s.pauseVon)}–${hhmm(s.pauseBis)}` : ""}` : "Im Entwurf: frei"}</p>
    <div class="grid g2" style="margin-top:12px">
      ${feldHtml("Beginn", `<input type="time" data-von value="${s ? hhmm(s.von) : ""}">`)}
      ${feldHtml("Ende", `<input type="time" data-bis value="${s ? hhmm(s.bis) : ""}">`, "Die Pause legt der Planer nach Gesetz und so, dass die Besetzung hält.")}</div>
    <p class="err" data-fehler></p>
    <div class="dialog-knoepfe">
      <button class="btn" data-speichern type="button">Zeiten übernehmen</button>
      <button class="btn ghost" data-frei type="button">Hat frei</button></div>
    <div class="dialog-ausfall"><span class="hint">Fällt aus:</span>
      ${["krank", "urlaub", "nicht"].map(g => `<button class="btn ghost small" data-grund="${g}" type="button">${GRUND_NAME[g]}</button>`).join("")}</div>
    <div class="dialog-knoepfe unten">
      <button class="btn ghost small" data-zurueck type="button">Änderung zurücknehmen</button>
      <div class="spacer"></div><button class="btn ghost small" data-abbrechen type="button">Abbrechen</button></div></div>`);
  const d = dialogZeigen(inhalt);
  // Was für diese Zelle schon von Hand gilt, wird ersetzt — nicht gestapelt
  const ersetzen = neu => {
    eintrag.aenderungen = eintrag.aenderungen.filter(a => !(a.quelle === "hand" && a.name === m.name && a.ti === ti));
    if (neu) eintrag.aenderungen.push(Object.assign({id: aenderungsId(), aktiv: true, quelle: "hand", name: m.name, ti}, neu));
    d.remove(); fertig();
  };
  inhalt.querySelector("[data-speichern]").onclick = () => {
    const von = zeitAusText(inhalt.querySelector("[data-von]").value), bis = zeitAusText(inhalt.querySelector("[data-bis]").value);
    if (von === null || bis === null || bis <= von){ inhalt.querySelector("[data-fehler]").textContent = "Bitte Beginn und Ende angeben — das Ende nach dem Beginn."; return; }
    ersetzen({typ: "schicht", von, bis, text: `${m.name} ${tagName(ti)} ${hhmm(von)}–${hhmm(bis)}`});
  };
  inhalt.querySelector("[data-frei]").onclick = () => ersetzen({typ: "frei", text: `${m.name} ${tagName(ti)} frei`});
  inhalt.querySelectorAll("[data-grund]").forEach(b => b.onclick = () =>
    ersetzen({typ: "abwesend", grund: b.dataset.grund, text: `${m.name} ${tagName(ti)}: ${GRUND_NAME[b.dataset.grund]}`}));
  inhalt.querySelector("[data-zurueck]").onclick = () => {
    eintrag.aenderungen.filter(a => a.aktiv && a.name === m.name && a.ti === ti).map(a => a.id).forEach(id => aenderungAus(eintrag, id));
    d.remove(); fertig();
  };
  inhalt.querySelector("[data-abbrechen]").onclick = () => d.remove();
}

function notizBearbeiten(eintrag, ti, plan, fertig){
  const alt = (plan.notizen || {})[plan.tage[ti].key] || "";
  const inhalt = el(`<div><h3>Notiz für ${tagName(ti)}</h3>
    <label class="f" style="margin-top:10px">Steht im Plan in der Zeile „Notiz“<input type="text" data-text value="${esc(alt)}" placeholder="z. B. Aktionsware aufbauen"></label>
    <div class="dialog-knoepfe"><button class="btn" data-ok type="button">Übernehmen</button>
    <button class="btn ghost" data-abbrechen type="button">Abbrechen</button></div></div>`);
  const d = dialogZeigen(inhalt);
  inhalt.querySelector("[data-ok]").onclick = () => {
    const text = inhalt.querySelector("[data-text]").value.trim();
    eintrag.aenderungen = eintrag.aenderungen.filter(a => !(a.typ === "notiz" && a.ti === ti));
    if (text !== alt) eintrag.aenderungen.push({id: aenderungsId(), aktiv: true, quelle: "hand", typ: "notiz", ti,
      notiz: text, text: `Notiz ${tagName(ti)}: ${text || "(gelöscht)"}`});
    d.remove(); fertig();
  };
  inhalt.querySelector("[data-abbrechen]").onclick = () => d.remove();
}

/* Der Assistent: Überschrift, Eingabefeld, darunter die Antwort auf die letzte Eingabe mit
   ihren Lösungskarten. Was davor war, klappt als „Verlauf“ zusammen. Kein Begrüßungstext,
   keine Sprechblasen — unter der Antwort stehen die Optionen: zuerst „Im Plan anzeigen“
   (schaltet die geschilderte Änderung ein und wieder aus), dann die Vorschläge für die
   nächste betroffene Schicht, Schritt für Schritt. */
// Die Eingabe des Assistenten — damit andere Teile der Seite ihm eine Frage stellen können
let assistentFrage = null;

function assistentKarte(sl, kurz, eintrag, fertig){
  eintrag.chat = eintrag.chat || [];
  const k = el(`<section class="karte assistent"><h3>Assistent</h3>
    <form class="chat-eingabe"><input type="text" placeholder="Was soll sich am Plan ändern?" aria-label="Was soll sich am Plan ändern?" autocomplete="off">
      <button class="btn" type="submit" title="senden" aria-label="senden">${symbol("senden")}</button></form>
    <div class="as-antwort"></div></section>`);
  const senden = text => {
    text = String(text || "").trim();
    if (!text) return;
    const erg = assistent(text, sl, kurz, eintrag);
    erg.karten.concat(erg.still || []).forEach(a => { if (!eintrag.aenderungen.includes(a)) eintrag.aenderungen.push(a); });
    (erg.aus || []).forEach(id => aenderungAus(eintrag, id));
    eintrag.chat.push({wer: "du", text}, {wer: "assistent", text: erg.antwort, karten: erg.karten.map(a => a.id),
      still: (erg.still || []).map(a => a.id), knoepfe: erg.knoepfe || []});
    // Kürzen, aber nichts, woran noch eine eingeschaltete Karte hängt
    const ids = n => (n.karten || []).concat(n.still || []);
    while (eintrag.chat.length > 40 && !ids(eintrag.chat[0]).some(id => (eintrag.aenderungen.find(x => x.id === id) || {}).aktiv)) eintrag.chat.shift();
    // Vorschläge, die kein Gesprächsteil mehr zeigt und die nicht im Plan sind, wegräumen
    const gezeigt = new Set(eintrag.chat.reduce((l, n) => l.concat(ids(n)), []));
    eintrag.aenderungen = eintrag.aenderungen.filter(a => a.quelle !== "assistent" || a.aktiv || gezeigt.has(a.id));
    fertig();
    setTimeout(() => { const f = document.querySelector(".assistent input"); if (f && matchMedia("(pointer:fine)").matches) f.focus({preventScroll: true}); }, 0);
  };
  // Eine Lösungs- oder Änderungskarte: antippen zeigt sie im Plan, nochmal nimmt sie heraus
  const karte = id => {
    const a = eintrag.aenderungen.find(x => x.id === id);
    if (!a) return null;
    // Kurz: wer was anders macht in einer Zeile (der Kartentext), darunter Ergebnis und Stunden
    const kn = el(`<button class="chatkarte${a.aktiv ? " an" : ""}" type="button" aria-pressed="${a.aktiv}">${esc(a.text)}
      ${a.weg && a.weg.passt ? `<span class="chat-weg">${esc(a.weg.passt)}</span>` : ""}
      <span>${a.aktiv ? "✓ Im Plan · zurücknehmen" : "Im Plan anzeigen"}</span></button>`);
    kn.onclick = () => {
      if (a.aktiv) aenderungAus(eintrag, a.id);
      else {
        a.aktiv = true;
        // gehört die Lösung zu einer Änderung aus demselben Gespräch (Ausfall, Tausch …), kommt sie mit — alle Teile
        (a.mit || (a.fuer ? [a.fuer] : [])).forEach(id => { const f = eintrag.aenderungen.find(x => x.id === id); if (f) f.aktiv = true; });
        // je Zelle bzw. je Ausfall nur eine Karte des Assistenten
        eintrag.aenderungen.forEach(x => { if (x !== a && x.quelle === "assistent" && x.aktiv
          && ((x.name && x.name === a.name && x.ti === a.ti && x.typ !== "abwesend" && a.typ !== "abwesend")
           || (a.typ === "loesung" && x.typ === "loesung" && x.ti === a.ti && x.fuer === a.fuer))) x.aktiv = false; });
      }
      fertig();
    };
    return kn;
  };
  // Das Gespräch als Paare aus Eingabe und Antwort (ein alter Begrüßungstext ohne Eingabe zählt nicht)
  const paare = [];
  eintrag.chat.forEach(n => {
    if (n.wer === "du") paare.push({frage: n.text, antwort: null});
    else if (paare.length && !paare[paare.length - 1].antwort) paare[paare.length - 1].antwort = n;
  });
  const block = (paar, letztes) => {
    const b = el(`<div class="as-paar"><p class="as-frage">${esc(paar.frage)}</p><p class="as-text">${esc(paar.antwort ? paar.antwort.text : "")}</p></div>`);
    ((paar.antwort && paar.antwort.karten) || []).forEach(id => { const kn = karte(id); if (kn) b.appendChild(kn); });
    // Antwortknöpfe nur an der letzten Antwort — ältere Fragen sind erledigt
    if (letztes && paar.antwort && (paar.antwort.knoepfe || []).length){
      const reihe = el(`<div class="chat-knoepfe"></div>`);
      paar.antwort.knoepfe.forEach(t => {
        // „Im Plan anzeigen“: schaltet die geschilderte Änderung ein — nochmal tippen nimmt sie heraus
        if (t && typeof t === "object" && t.zeigen){
          const liste = t.zeigen.map(id => eintrag.aenderungen.find(x => x.id === id)).filter(Boolean);
          if (!liste.length) return;
          const an = liste.every(a => a.aktiv);
          const kn = el(`<button class="btn small${an ? " ghost" : ""}" type="button" aria-pressed="${an}">${an ? "✓ Im Plan · zurücknehmen" : esc(t.text)}</button>`);
          kn.onclick = () => { liste.forEach(a => { if (an) aenderungAus(eintrag, a.id); else a.aktiv = true; }); fertig(); };
          reihe.appendChild(kn);
          return;
        }
        const kn = el(`<button class="btn ghost small" type="button">${esc(t)}</button>`); kn.onclick = () => senden(t); reihe.appendChild(kn);
      });
      b.appendChild(reihe);
    }
    return b;
  };
  const antwort = k.querySelector(".as-antwort");
  if (paare.length){
    antwort.appendChild(block(paare[paare.length - 1], true));
    if (paare.length > 1){
      const d = el(`<details class="as-verlauf"><summary>Verlauf (${paare.length - 1})</summary></details>`);
      paare.slice(0, -1).reverse().forEach(x => d.appendChild(block(x, false)));
      antwort.appendChild(d);
    }
  }
  const feld = k.querySelector("input");
  k.querySelector("form").onsubmit = e => { e.preventDefault(); senden(feld.value); };
  assistentFrage = senden;
  return k;
}
