/* Kompakter Plan zwischen 481 und 860 px: „von 38,5“ bleibt in einer Zeile */
td.k-std span,td.k-konto span{white-space:nowrap}
@container (min-width:481px){
  table.kompakt col.c-name{width:18%} table.kompakt col.c-std{width:8%} table.kompakt col.c-konto{width:8.5%}
}
.nur-schmal{display:none}
@media(max-width:860px){ .nur-schmal{display:inline-flex} .aendern-plan{scroll-margin-top:calc(var(--oben, 0px) + var(--kopf, 56px) + 8px)} }
/* Marke „Urlaub“: im hellen Bild war die Schrift mit 4,4 : 1 knapp unter dem Mindestkontrast */
:root{--info-schrift:#245C9B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--info-schrift:var(--info)}}
:root[data-theme="dark"]{--info-schrift:var(--info)}
.tag.urlaub{color:var(--info-schrift)}
/* ---- Am Telefon groß genug zum Treffen: Zurück-Link, Aufklapper, Auswahl in der Abwesenheitstabelle ---- */
@media (pointer:coarse){
  .zurueck-link{min-height:40px;padding-right:12px}
  .panel > .zurueck-link{margin:-14px 0 0}
  details > summary{padding-top:9px;padding-bottom:9px}
  .abwfeld select{min-height:40px}
}
/* Zahlen in Tabellen stehen rechtsbündig unter ihrer Spalte */
td input.zahl-ein{text-align:right}
/* Am Telefon sind alle Eingabefelder gleich hoch (ein leeres Zeitfeld ist auf dem iPhone sonst niedriger
   und verschiebt die Beschriftung daneben) — und mit 44 px sicher zu treffen */
.zeitfelder{align-items:flex-start}
@media (pointer:coarse){
  input[type=text],input[type=password],input[type=time],input[type=date],select{min-height:44px}
}
/* ---- Entwurf · Vertragsstunden (17.11.2026): eine Zeile je Person, Vorschläge klappen auf ---- */
.pe-liste{grid-template-columns:repeat(auto-fill,minmax(280px,1fr));align-items:start}
details.pe-person{padding:0}
details.pe-person > summary{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:baseline;padding:11px 12px;cursor:pointer;list-style:none}
details.pe-person > summary::-webkit-details-marker{display:none}
details.pe-person > summary > b{font-size:.92rem}
details.pe-person > summary:focus-visible{outline:2px solid var(--info);outline-offset:-2px;border-radius:var(--r)}
.pe-offen{font-size:.84rem;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.pe-offen::after{content:"▸";display:inline-block;margin-left:8px;color:var(--muted);transition:transform .15s}
details.pe-person[open] .pe-offen::after{transform:rotate(90deg)}
.pe-abbau,.pe-minus{grid-column:1/-1;font-size:.78rem;font-weight:700;font-variant-numeric:tabular-nums}
.pe-abbau{color:var(--good)}
.pe-minus{color:var(--bad)}
details.pe-person > .hint{margin:0 12px}
details.pe-person > .pe-vorschlaege{margin:8px 12px 0}
details.pe-person > .pe-vorschlaege{padding-bottom:12px}
.pe-monat{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:6px 0;border-top:1px solid var(--line-2);font-size:.86rem}
.pe-aushilfen .eyebrow + .pe-monat{border-top:0}
.pe-monat.ueber .num{color:var(--bad);font-weight:700}

/* ==== 17.11.2026 (2): Erklärungen hinter „i“, Rubriken, einheitliche Felder ============== */
/* ---- „i“ im Kreis: Erklärung beim Antippen ---- */
.info{display:inline-flex;vertical-align:middle;line-height:1;position:relative}
.info-i{position:relative;flex:none;display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;margin-left:7px;padding:0;
  border:1.5px solid var(--ton-500);border-radius:50%;background:var(--surface);color:var(--ton-700);
  font:800 11px/1 var(--sans);letter-spacing:0;text-transform:none;cursor:pointer;transition:background .12s,color .12s,border-color .12s}
.info-i::after{content:"";position:absolute;inset:-10px -10px -6px}
.info-i:hover,.info-i[aria-expanded="true"]{background:var(--voll);border-color:var(--voll);color:var(--auf-voll)}
.info-i:focus-visible{outline:2px solid var(--info);outline-offset:2px}
.info-blase{position:fixed;z-index:300;width:max-content;max-width:min(300px,calc(100vw - 24px));padding:10px 13px;
  background:var(--surface);color:var(--ink-2);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-l);
  font:500 .82rem/1.45 var(--sans);letter-spacing:0;text-transform:none;text-align:left}
.info-blase b{color:var(--ink)}
h1 .info-i{width:20px;height:20px;font-size:12px;margin-left:10px;transform:translateY(-2px)}
/* Felder: das „i“ rechts oben auf Höhe der Beschriftung */
.feld{position:relative;min-width:0}
.feld > label.f,.feld > .f{height:100%}
.feld > .info{position:absolute;top:-2px;right:0}
.feld > .info .info-i{margin-left:0}
.feld .f-titel{padding-right:26px}
/* Schalter mit Erklärung: das „i“ direkt rechts daneben */
.schalter-zeile{display:flex;align-items:center;gap:2px;min-width:0}
.schalter-zeile .info-i{margin-left:6px}

/* ---- Rubriken: eine Seite in klar getrennte Teile gliedern ----
   Anthrazit trägt die Schrift, ein schmaler Balken in Norma-Rot markiert den Anfang,
   Linie und Abstand trennen die Teile. */
.rubrik + .rubrik,.rubrik.abgesetzt{margin-top:30px;padding-top:26px;border-top:1px solid var(--line)}
.rubrik-titel{display:flex;align-items:center;gap:0;margin:0 0 18px;font-size:1.12rem;font-weight:800;color:var(--ton-900);letter-spacing:-.01em}
.rubrik-titel::before{content:"";flex:none;width:4px;height:1.1em;margin-right:11px;border-radius:2px;background:var(--marke)}
.unterrubrik + .unterrubrik,.unterrubrik.abgesetzt{margin-top:26px}
.unterrubrik-titel{display:flex;align-items:center;margin:0 0 12px;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--ton-700)}
.unterrubrik-titel .info-i{letter-spacing:0}

/* ---- Einheitliche Felder: gleich breit (drei Spalten) und gleich hoch ---- */
.felder{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 14px;align-items:start}
.felder + .felder{margin-top:14px}
.felder input[type=text],.felder input[type=date],.felder input[type=time],.felder select,.felder .konto-box{height:42px}
@media (pointer:coarse){ .felder input[type=text],.felder input[type=date],.felder input[type=time],.felder select,.felder .konto-box{height:44px} }
@media(max-width:640px){ .felder{grid-template-columns:1fr} }
div.f{display:flex;flex-direction:column;gap:4px;font-size:.76rem;color:var(--muted);font-weight:700;letter-spacing:.01em}
.konto-box{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 6px 0 12px;
  border:1.5px solid var(--line);border-radius:var(--r-s);background:var(--surface-2)}
.konto-box b{font-size:.95rem;color:var(--ink)}
.konto-box .btn{min-height:0;padding:5px 10px;font-size:.78rem}
/* Personal bearbeiten: Schalter, Funktionen, Urlaub & Krankheit */
.schalter-reihe{display:flex;flex-wrap:wrap;gap:12px 28px;margin-top:18px}
.funktionen{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px 14px}
/* vier Felder (mit „Wer?“): so viele nebeneinander, wie Platz ist — auch im schmalen Dialog */
.felder.vier{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.ereignisform-knopf{margin-top:14px;display:flex}
/* im Personal ohne eigenen Kasten: die Felder stehen genau unter denen der ersten Rubrik */
.person-ereignisse .ereignisform{border:0;background:none;padding:0;margin:0 0 6px}

/* ---- Analyse (17.11.2026): Tagesbesetzung, Rolle für die Besetzung, Wochentage, Empfehlungen ---- */
:root{--t-puffer:#C3C8CF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--t-puffer:#59616B}}
:root[data-theme="dark"]{--t-puffer:#59616B}
.t-laden{background:var(--t-puffer)}
.t-pause{background:repeating-linear-gradient(135deg,var(--ton-500) 0 1.5px,var(--surface) 1.5px 5px)}
.t-fuehrung{background:var(--surface);box-shadow:inset 0 0 0 2px var(--ton-900)}
/* Tag wählen: nur Tag und Datum */
.ta-tag{grid-template-columns:auto auto;justify-content:center;gap:6px;padding:9px 8px}
/* Tagesbesetzung (bz-…; tb-… gehört zu den Tagesbalken in „Plan ändern“): links die Personen, oben die Uhrzeit, je Schicht ein Balken in Farben */
.bz{container-type:inline-size;display:flex;flex-direction:column;gap:6px;cursor:default}
.bz-reihe{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;align-items:center;min-height:30px}
.bz-name{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.bz-name b{font-size:.84rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bz-name span{font-family:var(--mono);font-size:.64rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bz-achse{min-height:24px}
.bz-achse .bz-name{font-size:.64rem;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.bz-spur{position:relative;height:22px}
.bz-achse .bz-spur{height:24px;border-bottom:1.5px solid var(--ton-900)}
.bz-uhr{position:absolute;top:0;transform:translateX(-50%);font-family:var(--mono);font-size:.7rem;font-weight:700;color:var(--ink-2)}
.bz-offen{position:absolute;bottom:-1.5px;height:4px;background:var(--marke);border-radius:2px}
.bz-linie{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--line-2)}
.bz-balken{position:absolute;top:0;bottom:0;border-radius:5px;overflow:hidden;box-shadow:0 0 0 1px var(--ton-200)}
.bz-seg{position:absolute;top:0;bottom:0;box-shadow:inset -1.5px 0 0 var(--surface);cursor:pointer}
.bz-seg:last-child{box-shadow:none}
.bz-seg:hover{filter:brightness(1.08)}
.bz-seg.gewaehlt{outline:2.5px solid var(--ink);outline-offset:-2.5px;z-index:1}
.bz-legende{display:flex;flex-wrap:wrap;gap:6px 16px;margin:0 0 12px;font-size:.76rem;font-weight:600;color:var(--ink-2)}
.bz-legende span{display:inline-flex;align-items:center;gap:6px}
.bz-legende i{width:14px;height:10px;border-radius:3px;display:inline-block}
.bz-legende i.t-laden{box-shadow:inset 0 0 0 1px var(--ton-200)}
.bz-legende i.t-pause{box-shadow:inset 0 0 0 1px var(--ton-500)}
.bz-offen-muster{height:4px!important;background:var(--marke)}
.bz-detail{margin-top:10px;font-size:.84rem;font-weight:600;color:var(--ink);font-family:var(--mono);font-variant-numeric:tabular-nums}
/* Ware: die Art als Kürzel im Balken (Tr, KW, TK, O&G, FF) — dunkle Schrift auf der hellen Füllung, nur wo es hineinpasst */
.bz-seg b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.62rem;font-weight:800;
  letter-spacing:.01em;color:rgba(0,0,0,.8);white-space:nowrap;overflow:hidden;pointer-events:none}
.bz-seg b[hidden]{display:none}
.bz-kuerzel{margin:-6px 0 12px;font-size:.72rem;color:var(--muted);font-weight:600}
.bz-kuerzel b{color:var(--ink-2)}
/* Tagesansicht des Plans: Uhrzeiten bleiben auch am Telefon neben dem Namen stehen */
.bz.mit-zeiten .bz-reihe{grid-template-columns:96px minmax(0,1fr)}
@media(max-width:640px){ .bz.mit-zeiten .bz-reihe{grid-template-columns:78px minmax(0,1fr)} .bz.mit-zeiten .bz-name span{display:block;font-size:.6rem} }
@container (max-width:560px){ .bz-uhr.u2{visibility:hidden} }
@media(max-width:640px){ .bz-reihe{grid-template-columns:64px minmax(0,1fr);gap:8px} .bz-name span{display:none} }
/* Rolle für die Besetzung: eine Zeile je Person, aufklappbar */
.rolle-liste,.empf-liste{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.rolle,.empf{border-bottom:1px solid var(--line)}
.rolle > summary,.empf > summary{display:flex;align-items:center;gap:10px;padding:11px 4px;cursor:pointer;list-style:none;min-height:46px}
.rolle > summary::-webkit-details-marker,.empf > summary::-webkit-details-marker{display:none}
.rolle > summary:focus-visible,.empf > summary:focus-visible{outline:2px solid var(--info);outline-offset:-2px;border-radius:6px}
.rolle-kopf{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px}
.rolle-kopf b{font-size:.9rem}
.rolle-daten{font-family:var(--mono);font-size:.78rem;color:var(--ink-2);font-variant-numeric:tabular-nums}
.rolle-pfeil{flex:none;display:flex;color:var(--muted);transition:transform .15s}
.rolle-pfeil .sym{width:18px;height:18px}
details[open] > summary .rolle-pfeil{transform:rotate(90deg)}
.rolle-inhalt{padding:2px 4px 14px 4px}
.rolle-merkmale{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:10px}
.rolle-punkte{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rolle-punkte li{display:grid;grid-template-columns:14px minmax(120px,240px) 1fr;gap:10px;align-items:center;font-size:.84rem}
.rolle-punkte li .num{font-size:.8rem;color:var(--ink-2)}
.rolle-farbe{width:14px;height:10px;border-radius:3px;display:inline-block}
.rolle-farbe.t-laden{box-shadow:inset 0 0 0 1px var(--ton-200)}
@media(max-width:560px){ .rolle-punkte li{grid-template-columns:14px 1fr} .rolle-punkte li .num{grid-column:2} }
/* Empfehlungen: sachlich, ohne farbige Fläche — ein kleiner Punkt zeigt die Dringlichkeit */
.empf > summary{font-size:.9rem;font-weight:700;color:var(--ink)}
.empf-titel{flex:1;min-width:0}
.empf-punkt{flex:none;width:8px;height:8px;border-radius:50%;background:var(--ton-500)}
.empf.rot .empf-punkt{background:var(--marke)} .empf.gelb .empf-punkt{background:var(--warn)} .empf.gruen .empf-punkt{background:var(--good)}
.empf > p{margin:0 0 12px 22px;font-size:.84rem;color:var(--ink-2);font-weight:500;max-width:70ch}
.analyse .aufklapp{margin-top:14px}
/* Bedarf und Personal: der vierte Balken für die Aushilfen */
.balken-spur i.b4{background:repeating-linear-gradient(135deg,var(--voll) 0 4px,var(--ton-500) 4px 7px)}
.balken-spur i.b5{background:var(--surface);box-shadow:inset 0 0 0 2px var(--voll)}
.balken-name{display:flex;align-items:center}
/* Stunden je Wochentag: je Tag zwei Säulen — der Schnitt aller Pläne und die gewählte Woche */
:root{--sw-schnitt:#7A818A;--sw-woche:var(--marke)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sw-woche:#E5352D}}
:root[data-theme="dark"]{--sw-woche:#E5352D}
.sw-legende{display:flex;flex-wrap:wrap;gap:6px 18px;margin-bottom:10px;font-size:.76rem;font-weight:600;color:var(--ink-2)}
.sw-legende span{display:inline-flex;align-items:center;gap:6px}
.sw-legende i{width:12px;height:12px;border-radius:3px;display:inline-block}
i.sw-schnitt{background:var(--sw-schnitt)} i.sw-woche{background:var(--sw-woche)}
.saeulen.paare{container-type:inline-size;height:200px;gap:14px}
.saeule-paar{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:2px;width:100%;border-bottom:1.5px solid var(--ton-900)}
.saeulen.paare .saeule-spur{flex:none;width:min(30px,42%);height:100%;position:relative;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;border:0}
.saeulen.paare .saeule-spur i{width:100%;border-radius:4px 4px 0 0;min-height:2px;display:block}
.saeulen.paare .saeule-wert{font-size:.66rem;margin-bottom:3px;white-space:nowrap}
.saeulen.paare .saeule-wert.schnitt{color:var(--muted);font-weight:600}
.saeulen.paare .saeule:hover .saeule-spur i{filter:brightness(1.1)}
.saeulen.paare{grid-template-columns:repeat(6,minmax(0,1fr))}
.saeulen.paare .saeule{min-width:0}
/* schmal: nur die Werte der gewählten Woche über den Säulen — der Schnitt steht beim Antippen (title) */
@container (max-width:480px){ .saeulen.paare .saeule-wert.schnitt{display:none} .saeulen.paare .saeule-wert{font-size:.58rem;letter-spacing:-.03em} }
@media(max-width:560px){ .saeulen.paare{gap:6px} }
/* Kleine Zeilen mit Summen, die vorher als Hinweis dastanden */
.summe-zeile{margin-top:12px;font-size:.84rem;color:var(--ink-2);display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.ablage > span{font-size:.8rem;color:var(--muted);font-weight:500}
.tile .eyebrow .info-i{margin-left:6px}
.zeitfelder .feld{flex:1;min-width:0}
.phasenkarte b{display:inline-flex;align-items:center}
.phasendetail > .info{margin-top:6px}
.sub:empty{display:none}
.wh-stand{font-size:.84rem;color:var(--ink-2);font-weight:600;margin-top:2px}
.konto-rechnung{font-size:.8rem;color:var(--ink-2);display:flex;align-items:center;flex-wrap:wrap;gap:2px}

/* ---- Tagesansicht des Plans (17.11.2026): Woche | Tag ---- */
.ansicht-wahl{display:inline-flex;border:1.5px solid var(--ton-200);border-radius:var(--r-s);overflow:hidden;flex:none}
.ansicht-wahl button{border:0;background:var(--surface);color:var(--ink);font:inherit;font-size:.84rem;font-weight:700;padding:7px 14px;min-height:36px;cursor:pointer}
.ansicht-wahl button + button{border-left:1.5px solid var(--ton-200)}
.ansicht-wahl button[aria-pressed="true"]{background:var(--voll);color:var(--auf-voll)}
.ansicht-wahl button:focus-visible{outline:2px solid var(--info);outline-offset:-2px}

.tagesansicht{display:flex;flex-direction:column;gap:14px}

  // Besetzung (Hausregel)
  mindestBesetzung: 2,        // immer zwei Personen gleichzeitig im Laden, eine an der Kasse
  // Die Filialleitung steht im Normalfall nicht an der Kasse — nur, wenn es nicht anders geht:

  // (leitungKasse), in der Wahl des einfachen Planers und in der Einteilung des Tages.
  oeffnungstage: 6,           // Montag bis Samstag

  // Schichten (Hausregel)
  mindestSchicht: 4,          // kürzere Einsätze lohnen den Weg nicht (§ 12 TzBfG verlangt mind. 3)
  wunschSchicht: 6,           // darauf wird eine neue Schicht möglichst ausgedehnt
  maxAnwesenheit: 8.5,        // übliche längste Schicht mit Pause — so plant der Planer von sich aus

  // eine Besetzungslücke). 10 h Arbeit + 1 h Pause; die Woche der Person bleibt dann bei
  // höchstens 48 h — so ist der Schnitt von 8 h je Werktag (§ 3 ArbZG) in jedem Fall gewahrt.

  archivWochen: 6, archivWarnung: 5

// Ostersonntag nach der gregorianischen Osterformel (Meeus/Jones/Butcher)
function ostersonntag(j){
  const a = j % 19, b = Math.floor(j / 100), c = j % 100, d = Math.floor(b / 4), e = b % 4;
  const f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
  const h = (19*a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4;
  const l = (32 + 2*e + 2*i - h - k) % 7, m = Math.floor((a + 11*h + 22*l) / 451);
  const monat = Math.floor((h + l - 7*m + 114) / 31), tag = ((h + l - 7*m + 114) % 31) + 1;
  return new Date(j, monat - 1, tag, 12);
}

const _feiertagsCache = {};

function feiertageIm(j, land){
  const sl = j + land;
  if (_feiertagsCache[sl]) return _feiertagsCache[sl];
  const o = ostersonntag(j);
  const nachOstern = n => { const d = new Date(o); d.setDate(o.getDate() + n); return d; };
  const mt = d => String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  const in_ = (...l) => l.includes(land);
  const liste = {
    "01-01":"Neujahr", [mt(nachOstern(-2))]:"Karfreitag", [mt(nachOstern(1))]:"Ostermontag",
    "05-01":"Tag der Arbeit", [mt(nachOstern(39))]:"Christi Himmelfahrt", [mt(nachOstern(50))]:"Pfingstmontag",
    "10-03":"Tag der Deutschen Einheit", "12-25":"1. Weihnachtstag", "12-26":"2. Weihnachtstag"
  };
  if (in_("BW","BY","ST")) liste["01-06"] = "Heilige Drei Könige";
  if (in_("BE") || (in_("MV") && j >= 2023)) liste["03-08"] = "Internationaler Frauentag";
  if (in_("BW","BY","HE","NW","RP","SL")) liste[mt(nachOstern(60))] = "Fronleichnam";
  // Mariä Himmelfahrt: im Saarland landesweit, in Bayern in den meisten Gemeinden
  if (in_("SL","BY")) liste["08-15"] = "Mariä Himmelfahrt";
  if (in_("TH") && j >= 2019) liste["09-20"] = "Weltkindertag";
  if (in_("BB","MV","SN","ST","TH") || (in_("HB","HH","NI","SH") && j >= 2018)) liste["10-31"] = "Reformationstag";
  if (in_("BW","BY","NW","RP","SL")) liste["11-01"] = "Allerheiligen";
  if (in_("SN")){
    // Buß- und Bettag: der Mittwoch vor dem 23. November
    const d = new Date(j, 10, 22, 12);
    while (d.getDay() !== 3) d.setDate(d.getDate() - 1);
    liste[mt(d)] = "Buß- und Bettag";
  }
  return (_feiertagsCache[sl] = liste);
}

// Ladenöffnung werktags, wo das Landesrecht sie begrenzt (Stand 11/2026; in den übrigen

/* --------- Planer-Maschine --------- */
const hhmm = m => String(Math.floor(m/60)).padStart(2,"0") + ":" + String(Math.round(m)%60).padStart(2,"0");

// „6:30", „0630", „6.30", „6" → Minuten seit Mitternacht; sonst null
function zeitAusText(t){
  const s = String(t).trim().replace(/\s|uhr/gi, "");
  let m = /^(\d{1,2})[:.,]?(\d{2})$/.exec(s) || /^(\d{1,2})$/.exec(s);
  if (!m) return null;
  const st = +m[1], mi = m[2] === undefined ? 0 : +m[2];
  if (st > 23 || mi > 59) return null;
  return st*60 + mi;
}

function feiertagName(d){
  const mt = String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  return feiertageIm(d.getFullYear(), landVon())[mt] || null;
}

const istFeiertag = d => !!feiertagName(d);

function montagDer(iso){
  const d = iso ? new Date(iso + "T12:00:00") : new Date();
  d.setHours(12, 0, 0, 0);       // mittags — sonst rutscht das Datum nachts über die Zeitzone
  const wt = (d.getDay() + 6) % 7;            // Mo = 0
  d.setDate(d.getDate() - wt);
  return d;
}

function naechsterMontag(){
  const d = montagDer(null); d.setDate(d.getDate() + 7); return d;
}

// In Ortszeit. toISOString() rechnet in UTC: Montag 00:30 wäre dort noch Sonntag,
// und nachts erstellt wäre der Plan für die falsche Woche entstanden.
const isoVon = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0")
                  + "-" + String(d.getDate()).padStart(2,"0");

const deVon  = d => d.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric"});

function kwVon(d){
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const tag = (t.getUTCDay() + 6) % 7;
  t.setUTCDate(t.getUTCDate() - tag + 3);
  const start = new Date(Date.UTC(t.getUTCFullYear(),0,4));
  return 1 + Math.round(((t - start)/86400000 - 3 + ((start.getUTCDay()+6)%7)) / 7);
}

// Jahr der Kalenderwoche ist das Jahr ihres Donnerstags — sonst hieße der
// 30.12.2030 (KW 1 von 2031) „2030-KW01" und kollidierte mit dem Januar 2030
function wochenSchluessel(d){
  const do_ = new Date(d); do_.setDate(d.getDate() - ((d.getDay() + 6) % 7) + 3);
  return do_.getFullYear() + "-KW" + String(kwVon(d)).padStart(2,"0");
}

// Welche Woche gehört heute nach oben? Ab Sonntag die kommende.
function aktuellerMontag(){
  const heute = new Date();
  const mo = montagDer(null);
  if ((heute.getDay() + 6) % 7 === 6) mo.setDate(mo.getDate() + 7);
  return mo;
}

function folgeSchluessel(sl){
  const d = montagAusSchluessel(sl); d.setDate(d.getDate() + 7);
  return wochenSchluessel(d);
}

// Wie viele Wochen liegt diese Woche zurück?
function wochenZurueck(schluessel, quelle){
  const alle = Object.keys(quelle);
  if (!alle.includes(schluessel)) return 0;
  const mo = (quelle[schluessel] && quelle[schluessel].mo)
    ? montagDer(quelle[schluessel].mo) : montagAusSchluessel(schluessel);
  return Math.round((aktuellerMontag() - mo) / (7*864e5));
}

// Aus „2026-KW45" den Montag der Woche zurückrechnen
function montagAusSchluessel(sl){
  const m = /^(\d{4})-KW(\d{2})$/.exec(sl);
  if (!m) return new Date();
  const d = new Date(+m[1], 0, 4);                     // der 4.1. liegt immer in KW 1
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7) + (+m[2] - 1) * 7);
  d.setHours(12,0,0,0);
  return d;
}

const nz = v => { const n = parseFloat(String(v).replace(",",".")); return isFinite(n) ? n : 0; };

function alter(gb){
  if (!gb) return null;
  const g = new Date(gb); if (isNaN(g)) return null;
  const h = new Date(); let a = h.getFullYear() - g.getFullYear();
  const m = h.getMonth() - g.getMonth();
  if (m < 0 || (m === 0 && h.getDate() < g.getDate())) a--;
  return a;
}

// Für den Jugendschutz zählt die Angabe „18 oder älter“ / „unter 18“ (volljaehrig
// true/false). Ein Geburtsdatum wird seit 13.11.2026 nicht mehr gespeichert; alte Daten

  const a = alter(m.geb);
  if (a !== null) return a < 18 ? "minder" : "voll";
  return m.volljaehrig === true ? "voll" : m.volljaehrig === false ? "minder" : null;
}
const minderjaehrig = m => altersAngabe(m) === "minder";

const istAzubi = m => m.typ === "Azubi";

const faktor = m => !istAzubi(m) ? 1 : (m.lehrjahr === 1 ? 0 : m.lehrjahr === 2 ? 0.5 : 1);

const stunden = m => nz(istAzubi(m) ? m.betrieb : m.vertrag);

const saldoVon = m => hat(m.saldo) ? nz(m.saldo) : 0;

const hatVertrag = m => hat(istAzubi(m) ? m.betrieb : m.vertrag);

// Azubis nie: Sie arbeiten genau ihre Betriebsstunden
const darfUeberstunden = m => m.ueberstunden !== false && !istAzubi(m);

const AUSGLEICH_MAX = REGELN.ausgleichMax;

const viertel = n => Math.round(n * 4) / 4;

/* Zahlen aus Eingabefeldern. Ein <input type="number"> nimmt „1,5“ je nach Gerät und Sprache
   nicht an und liefert dann stumm einen leeren Wert — die Eingabe ginge verloren. Darum lesen
   die Zahlfelder Text (zahlFeld in app/26-bausteine.js) und diese Funktion versteht ihn:
   „1,5“, „1.5“, „13.000“, „13.000,50“, „−2“ → Zahl; leer → ""; nicht lesbar → null. */
function zahlLesen(text){
  let t = String(text == null ? "" : text).trim().replace(/\s/g, "").replace(/^\+/, "").replace(/[−–]/g, "-");
  if (t === "") return "";
  if (t.includes(",")) t = t.replace(/\./g, "").replace(",", ".");        // deutsch: Punkt trennt Tausender
  else if (/^-?\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, "");
  return /^-?(\d+\.?\d*|\.\d+)$/.test(t) && isFinite(+t) ? +t : null;
}
// Für die Anzeige im Feld: 1.5 → „1,5“ (gespeichert wird weiter mit Punkt)
const zahlZeigen = v => v === "" || v === null || v === undefined ? "" : hat(v) ? String(nz(v)).replace(".", ",") : String(v);
// Was eine Eingabe bedeutet, in Worten: „= 1,5 h (1 h 30 min)“, „= 13.000 €“
function zahlEcho(z, einheit){
  if (z === "" || z === null) return "";
  const zahl = z.toLocaleString("de-DE", {maximumFractionDigits: 2});
  const minuten = einheit === "h" && Math.abs(z % 1) > 0.001 && z > 0 ? ` (${Math.floor(z) ? Math.floor(z) + " h " : ""}${Math.round((z % 1) * 60)} min)` : "";
  return `= ${zahl}${einheit ? " " + einheit : ""}${minuten}`;
}

// ==== kern/03-recht.js ====
/* Arbeitsrecht: Pausen, Jugendschutz, Schichtgrenzen, Prüfung der Standardwoche */

/* --------- 5 Standardwoche --------- */
// Pausen stehen fest und werden nicht mehr je Person eingestellt.
// Über 18: ab 6 h Anwesenheit eine halbe Stunde, ab 8 h eine ganze —
//   damit immer über dem, was § 4 ArbZG verlangt (30 min über 6 h Arbeitszeit,
//   45 min über 9 h).
// Unter 18: § 11 JArbSchG — 30 min über 4,5 h Arbeitszeit, 60 min über 6 h, und
//   nie länger als 4,5 h am Stück. Gerechnet auf die Anwesenheit: Pause schon ab mehr
//   als 4,5 h (bis 12.11.2026 stand hier 5 h — eine Schicht von genau 5 h wäre dann
//   5 h am Stück gewesen), eine ganze Stunde ab mehr als 6,5 h.
// § 14 JArbSchG: Jugendliche nur zwischen 6 und 20 Uhr (bis 12.11.2026 fehlte die 6).
const JUGEND_VON = REGELN.jugendVon*60, JUGEND_BIS = REGELN.jugendBis*60;

/* Sondertage (seit 18.11.2026)
   · Heiligabend: Fällt der 24. Dezember auf einen Werktag, schließen Verkaufsstellen spätestens
     um 14 Uhr (§ 3 LadSchlG; ebenso die Ladenöffnungsgesetze der Länder, in Baden-Württemberg
     § 3 Abs. 2 LadÖG). Aufgaben, die sonst am Abend liegen, rücken vor den Ladenschluss
     (aufgabenFenster).
   · Jugendliche arbeiten am 24. und 31. Dezember nicht nach 14 Uhr (§ 18 Abs. 1 JArbSchG). */
const SONDER_SCHLUSS = 14*60;
const alsDatum = d => d instanceof Date ? d : (d ? new Date(String(d).slice(0, 10) + "T12:00:00") : null);
// Öffnung an einem Tag: {von, bis, normal (Ladenschluss sonst), sonder (Text oder null)}
function oeffnungAm(datum){
  const von = hatZeit(state.von) ? minuten(state.von) : 8*60;
  const normal = hatZeit(state.bis) ? minuten(state.bis) : 21*60;
  const d = alsDatum(datum);
  if (d && d.getMonth() === 11 && d.getDate() === 24 && von < SONDER_SCHLUSS && normal > SONDER_SCHLUSS)
    return {von, bis: SONDER_SCHLUSS, normal, sonder: "Heiligabend — Ladenschluss 14:00 Uhr"};
  return {von, bis: normal, normal, sonder: null};
}
// Bis wann Jugendliche an einem Tag arbeiten dürfen
const jugendBisAm = datum => {
  const d = alsDatum(datum);
  return d && d.getMonth() === 11 && (d.getDate() === 24 || d.getDate() === 31) ? Math.min(JUGEND_BIS, SONDER_SCHLUSS) : JUGEND_BIS;
};
// datum weglassen: an einem gewöhnlichen Tag
const jugendZeit = (von, bis, datum) => von >= JUGEND_VON && bis <= jugendBisAm(datum);

function pauseGesetz(anwesend, minder){
  // Jugendliche: über der Grenze; Erwachsene: ab der Grenze (Werte in REGELN)
  if (minder){ const s = REGELN.pauseAbJugend.find(([ab]) => anwesend > ab); return s ? s[1] : 0; }
  const s = REGELN.pauseAb.find(([ab]) => anwesend >= ab);
  return s ? s[1] : 0;
}

function pauseFuer(m, anwesend){
  return pauseGesetz(anwesend, minderjaehrig(m));
}

/* Wie lang eine Schicht sein darf — eine Stelle für Planer, Optimierer und Änderungen.
   Üblich: höchstens 8,5 h im Haus und 8 h Arbeit.
   Lang (lang = true): Erwachsene bis 10 h Arbeit, mit der Stunde Pause 11 h im Haus. Über 9 h
   Arbeit verlangt § 4 ArbZG 45 min Pause — die Hausregel (60 min ab 8 h im Haus) liegt darüber.
   Jugendliche nie über 8 h (§ 8 JArbSchG). Ob die Woche dabei unter 48 h bleibt, prüft, wer
   die Woche kennt (ausfallErlaubt, handPruefung). */
function schichtLaengeOk(m, anwesend, lang){
  const arbeit = anwesend - pauseFuer(m, anwesend);
  if (lang && !minderjaehrig(m)) return anwesend <= REGELN.langAnwesenheit + 0.01 && arbeit <= REGELN.gesetzMaxTag + 0.01;
  return anwesend <= REGELN.maxAnwesenheit + 0.01 && arbeit <= REGELN.maxArbeitTag + 0.01;
}
// Lang ist ein Tag mit mehr als 8 h Arbeit
const istLang = arbeit => arbeit > REGELN.maxArbeitTag + 0.01;

function schicht(m, tag){
  const s = (m.standard || {})[tag];
  if (!s || !hatZeit(s.von) || !hatZeit(s.bis)) return null;
  const von = minuten(s.von), bis = minuten(s.bis);
  if (bis <= von) return null;
  const anwesend = (bis - von) / 60;
  const minder = minderjaehrig(m);
  const p = pauseFuer(m, anwesend);
  return {von, bis, anwesend, pause:p, arbeit: anwesend - p, minder};
}

/* Berufsschule (seit 18.11.2026; §§ 8, 9, 15 JArbSchG, § 15 BBiG)
   · Für Jugendliche ist ein ganzer Berufsschultag ein Arbeitstag (höchstens 5 in der Woche) und
     zählt mit 8 Stunden auf die 40 der Woche — gesetzlich mit der durchschnittlichen täglichen
     Arbeitszeit, wenn mehr als 5 Unterrichtsstunden sind; die App rechnet vorsichtig mit 8 h.
   · Blockwoche (Berufsschule an 5 Tagen): Azubis arbeiten in dieser Woche nicht im Betrieb —
     auch nicht am Samstag. Ihr Soll der Woche ist 0.
   abwWoche: state.abwesend[Wochenschlüssel]; i: Platz der Person in state.mitarbeiter. */
const SCHULTAG_STUNDEN = 8;
const schulTage = (abwWoche, i) => TAGE.filter(([k]) => (((abwWoche || {})[i] || {})[k]) === "schule").length;
const blockWoche = (abwWoche, i) => schulTage(abwWoche, i) >= 5 && !!state.mitarbeiter[i]
  && (istAzubi(state.mitarbeiter[i]) || minderjaehrig(state.mitarbeiter[i]));
// Was die Schule an Arbeitstagen und Stunden belegt — zählt nur bei Jugendlichen mit
const schulLast = (abwWoche, i) => {
  const n = state.mitarbeiter[i] && minderjaehrig(state.mitarbeiter[i]) ? schulTage(abwWoche, i) : 0;
  return {tage: n, stunden: n * SCHULTAG_STUNDEN};
};

// Die Standardschicht an einem bestimmten Tag. An Heiligabend gilt sie nur, wenn sie spätestens
// eine Stunde nach Ladenschluss endet, für Jugendliche am 24./31.12. nur bis 14 Uhr — sonst plant
// der Planer den Tag neu, statt eine Schicht in den geschlossenen Laden zu legen.
function standardAm(m, tag, datum){
  const s = schicht(m, tag);
  if (!s) return null;
  const o = oeffnungAm(datum);
  if (o.sonder && s.bis > o.bis + 60) return null;
  if (s.minder && s.bis > jugendBisAm(datum)) return null;
  return s;
}

// Meldung für einen Sondertag (Heiligabend): Ladenschluss, was danach noch läuft, wessen
// Standardschicht neu geplant ist. tag: {key, label, datum, aufgaben}; null an anderen Tagen.
function sonderTagText(tag){
  const o = oeffnungAm(tag.datum);
  if (!o.sonder) return null;
  const nach = (tag.aufgaben || []).filter(a => a.bis > o.bis).map(a => `${a.name} bis ${hhmm(a.bis)}`);
  const neu = state.mitarbeiter.filter(m => schicht(m, tag.key) && !standardAm(m, tag.key, tag.datum)).map(m => m.name);
  return `${tag.label}, ${deVon(alsDatum(tag.datum))}: ${o.sonder}.`
    + (nach.length ? ` Danach noch: ${nach.join(", ")}.` : "")
    + (neu.length ? ` Standardschicht neu geplant: ${neu.join(", ")}.` : "");
}

function wochenStunden(m){
  return TAGE.reduce((s,[k]) => { const x = schicht(m,k); return s + (x ? x.arbeit : 0); }, 0);
}

function pruefeStandard(m){
  const out = [];
  const minder = minderjaehrig(m);
  const tage = TAGE.map(([k,l]) => ({k, l, s: schicht(m,k)}));
  const belegt = tage.filter(x => x.s);
  if (!belegt.length) return out;

  belegt.forEach(x => {
    const max = minder ? REGELN.gesetzMaxTagJugend : REGELN.gesetzMaxTag;
    if (x.s.arbeit > 8 + 0.001)
      out.push({art: x.s.arbeit > max ? "bad" : "warn",
        text:`${x.l}: ${h1(x.s.arbeit)} h Arbeitszeit` + (minder
          ? " — unter 18 höchstens 8 h am Tag (§ 8 JArbSchG)."
          : " — über 8 h nur mit Ausgleich im Schnitt über 24 Wochen.")});
    if (minder && x.s.bis > JUGEND_BIS)
      out.push({art:"bad", text:`${x.l}: Ende um ${String(Math.floor(x.s.bis/60)).padStart(2,"0")}:${String(x.s.bis%60).padStart(2,"0")} Uhr — unter 18 ist um 20:00 Uhr Schluss.`});
    if (minder && x.s.von < JUGEND_VON)
      out.push({art:"bad", text:`${x.l}: Beginn um ${String(Math.floor(x.s.von/60)).padStart(2,"0")}:${String(x.s.von%60).padStart(2,"0")} Uhr — unter 18 frühestens ab 6:00 Uhr (§ 14 JArbSchG).`});
  });

  // Ruhezeit zwischen aufeinanderfolgenden Tagen
  const noetig = ruhezeitFuer(minder);
  for (let i = 0; i < TAGE.length - 1; i++){
    const a = schicht(m, TAGE[i][0]), b = schicht(m, TAGE[i+1][0]);
    if (!a || !b) continue;
    const ruhe = (24*60 - a.bis + b.von) / 60;
    if (ruhe < noetig - 0.001)
      out.push({art:"bad", text:`${TAGE[i][1]} auf ${TAGE[i+1][1]}: nur ${h1(ruhe)} h Ruhezeit — vorgeschrieben sind ${noetig} h.`});
  }
  if (minder && belegt.length > 5)
    out.push({art:"bad", text:`${belegt.length} Arbeitstage — unter 18 sind höchstens 5 erlaubt.`});
  return out;
}

const MAXARBEIT = REGELN.maxArbeitTag;

const MINSCHICHT = REGELN.mindestSchicht;

const WUNSCHSCHICHT = REGELN.wunschSchicht;

const istLeitung = m => !!m && m.typ === "Filialleitung";

// ==== kern/04-aufgaben.js ====
/* Wochenaufgaben je Tag und Mindestbedarf der Woche */

// Was eine Aufgabe an einem Tag verlangt: die Werte dieses Tages, wenn sie je Tag
// verschieden eingestellt ist, sonst die allgemeinen
function aufgabeAm(a, tag){
  if (!a.jeTag || !a.proTag || !a.proTag[tag]) return a;
  return Object.assign({}, a, a.proTag[tag]);
}

/* Die Aufgaben eines Tages mit ihrer Zeit — so, dass möglichst wenige gleichzeitig laufen.

   Jede Aufgabe hat ein Fenster: einen frühesten Beginn und ein „spätestens fertig bis“.
     · feste Uhrzeit — sie ist der früheste Beginn. Fertig sein muss die Aufgabe bis zur
       eingetragenen Zeit „spätestens fertig bis“; ohne Angabe bis zur Ladenöffnung, wenn
       sie davor beginnt, sonst darf sie bis zu zwei Stunden später anfangen.
     · Zeitspanne — frühestens/spätestens wie eingetragen. Fehlt „spätestens“, gilt dasselbe
       wie bei fester Uhrzeit (seit 17.11.2026 — vorher reichte das Fenster bis Ladenschluss,
       und Frischfleisch mit „ab 07:00“ landete am Abend).
     · Uhrzeit egal — irgendwann während der Öffnung.
   Innerhalb des Fensters rückt eine Aufgabe dorthin, wo sie keine zusätzliche Person
   braucht: Eine Person erledigt Aufgaben nacheinander. Mehrere gleichzeitig gibt es nur,
   wenn eine Aufgabe selbst mehrere verlangt oder die Zeit sonst nicht reicht. (Bis
   16.11.2026 lag jede Aufgabe mit fester Uhrzeit genau auf ihrer Uhrzeit — vier Aufgaben
   um 05:00 hießen vier Personen um 05:00.)

   vorgabe (aus wochenVorgabe) bringt die Art der Woche mit: in einer Sparwoche werden die
   Aufgaben kürzer gerechnet, bei Mehrbedarf kommen Zusatzaufgaben dazu. */
const AUFGABEN_SPIELRAUM = 120;      // Minuten, die eine Aufgabe mit fester Uhrzeit später beginnen darf

// Fenster einer Aufgabe an einem Tag: [frühester Beginn, spätestens fertig].
// normalBis: Ladenschluss an gewöhnlichen Tagen — liegt tagBis davor (Heiligabend), rückt, was
// erst nach dem früheren Schluss beginnen würde, um so viel vor, wie der Laden früher schließt
// (das Abendprogramm bleibt vor dem Schluss); alles andere soll bis Ladenschluss fertig sein,
// wenn die Zeit dafür reicht.
function aufgabenFenster(a, dauer, tagVon, tagBis, normalBis){
  let [frueh, spaet] = aufgabenFensterNormal(a, dauer, tagVon, tagBis);
  if (normalBis && tagBis < normalBis){
    if (frueh >= tagBis){ const d = normalBis - tagBis; frueh = Math.max(tagVon, frueh - d); spaet = Math.max(frueh + dauer, spaet - d); }
    else if (spaet > tagBis) spaet = Math.max(frueh + dauer, tagBis);
  }
  return [frueh, spaet];
}
function aufgabenFensterNormal(a, dauer, tagVon, tagBis){
  // Ohne Frist: vor der Öffnung bis zur Öffnung, sonst höchstens zwei Stunden später beginnen
  const ohneFrist = von => von < tagVon ? tagVon : von + dauer + AUFGABEN_SPIELRAUM;
  if (a.zeitArt === "fest" && hatZeit(a.zeit)){
    const von = minuten(a.zeit);
    const fertig = hatZeit(a.fertig) ? minuten(a.fertig) : ohneFrist(von);
    return [von, Math.max(von + dauer, fertig)];
  }
  if (a.zeitArt === "spanne" && hatZeit(a.fVon)){
    const von = minuten(a.fVon);
    return [von, Math.max(von + dauer, hatZeit(a.fBis) ? minuten(a.fBis) : ohneFrist(von))];
  }
  const bis = a.zeitArt === "spanne" && hatZeit(a.fBis) ? minuten(a.fBis) : tagBis;
  return [tagVon, Math.max(tagVon + dauer, bis)];
}

function aufgabenAmTag(tag, tagVon, tagBis, vorgabe){
  const SL = 15, liste = [];
  const kuerzer = vorgabe && vorgabe.faktor ? vorgabe.faktor : 1;
  const normalBis = hatZeit(state.bis) ? minuten(state.bis) : 21*60;
  WAREN.forEach(w => {
    const a0 = state.aufgaben[w.id];
    if (!a0.aktiv || !a0.tage.includes(tag)) return;
    const a = aufgabeAm(a0, tag);
    if (!hat(a.dauer) || !hat(a.personen)) return;
    let dauer = Math.max(SL, Math.round(nz(a.dauer) * 60 / SL) * SL);
    if (kuerzer !== 1) dauer = Math.max(SL, Math.round(dauer * kuerzer / SL) * SL);
    const pers = Math.max(1, Math.round(nz(a.personen)));
    const [frueh, spaet] = aufgabenFenster(a, dauer, tagVon, tagBis, normalBis);
    liste.push({id:w.id, name:w.name, braucht:w.braucht, dauer, pers, frueh, spaet,
                flex: !(a.zeitArt === "fest" && hatZeit(a.zeit))});
  });

  // Wie viele Personen eine Viertelstunde braucht: die Aufgaben, während der Öffnung
  // dazu die Kasse — und nie weniger als die Mindestbesetzung
  const last = {};
  const offen = m => m >= tagVon && m < tagBis;
  const bedarfBei = (m, extra) => {
    const auf = (last[m] || 0) + extra;
    return offen(m) ? Math.max(MIN_BESETZUNG, auf + 1) : auf;
  };
  const eintragen = a => { for (let m = a.von; m < a.bis; m += SL) last[m] = (last[m] || 0) + a.pers; };
  // Kosten einer Lage: jede zusätzliche Person zählt umso mehr, je mehr schon da sind —
  // so verteilt sich die Arbeit, statt sich zu stapeln
  const kosten = (a, st) => {
    let k = 0;
    for (let m = st; m < st + a.dauer; m += SL){ const v = bedarfBei(m, 0), n = bedarfBei(m, a.pers); k += n * n - v * v; }
    return k;
  };

  // Wer am wenigsten Spielraum hat, wird zuerst gelegt; bei Gleichstand die größere Aufgabe
  const spiel = a => a.spaet - a.frueh - a.dauer;
  liste.slice().sort((x, y) => spiel(x) - spiel(y) || (y.dauer * y.pers) - (x.dauer * x.pers)).forEach(a => {
    let beste = a.frueh, besteKosten = Infinity;
    for (let st = Math.ceil(a.frueh / SL) * SL; st + a.dauer <= a.spaet; st += SL){
      const k = kosten(a, st);
      if (k < besteKosten - 0.001){ besteKosten = k; beste = st; }
    }
    a.von = beste; a.bis = beste + a.dauer;
    eintragen(a);
  });

  // Zusatzaufgaben einer Woche mit Mehrbedarf brauchen eine Person zusätzlich.
  // Morgens, wo wegen der Lieferungen ohnehin viele da sind, würde sie einfach
  // mitlaufen — dann gäbe es keine einzige Stunde mehr. Deshalb dorthin, wo die
  // wenigsten Aufgaben liegen, bei Gleichstand eher später am Tag.
  const zusatz = ((vorgabe && vorgabe.zusatz && vorgabe.zusatz[tag]) || []).map(z => {
    let beste = tagVon, besteK = Infinity;
    for (let st = Math.ceil(tagVon/30)*30; st + z.dauer <= tagBis; st += 30){
      let k = 0;
      for (let m = st; m < st + z.dauer; m += SL) k += last[m] || 0;
      if (k <= besteK){ besteK = k; beste = st; }
    }
    const a = {id:"zusatz", name:z.name, braucht:null, dauer:z.dauer, pers:z.pers,
               von:beste, bis:beste + z.dauer, frueh:tagVon, spaet:tagBis, flex:true};
    // Wie viele die Standardwoche zu diesen Zeiten im Haus hätte
    const vgl = vorgabe.basisPlan && vorgabe.basisPlan.tage.find(t => t.key === tag);
    if (vgl){
      a.basis = {};
      for (let m = a.von; m < a.bis; m += 30) a.basis[m] = vgl.schichten.filter(s => s.von <= m && s.bis > m).length;
    }
    return a;
  });

  return liste.concat(zusatz).sort((x,y) => x.von - y.von || x.bis - y.bis);
}

// Läuft die Aufgabe in der halben Stunde ab m? (Aufgaben liegen im Viertelstundenraster,
// geprüft wird die Besetzung je halbe Stunde.)
const aufgabeLaeuft = (a, m) => a.von < m + 30 && a.bis > m;

function auswertung(){
  const ms = state.mitarbeiter;
  const luecken = [];                       // was fehlt und die Rechnung beeinflusst
  const anwesend = ms.reduce((s,m) => s + stunden(m), 0);
  const wirksam  = ms.reduce((s,m) => s + stunden(m) * faktor(m), 0);
  const ohneStunden = ms.filter(m => !hat(istAzubi(m) ? m.betrieb : m.vertrag));
  const ohneGeb = ms.filter(m => altersAngabe(m) === null);
  // Maßgeblich ist die Stundenliste der Woche, die gerade oben steht
  const lst = (state.listen || {})[wochenSchluessel(aktuellerMontag())] || state.budget || {stunden:{}, umsatz:{}};
  const budgetTage = TAGE.filter(([k]) => hat(lst.stunden[k])).length;
  const budget   = TAGE.reduce((s,[k]) => s + nz(lst.stunden[k]), 0);
  const umsatz   = TAGE.reduce((s,[k]) => s + nz(lst.umsatz[k]), 0);

  let aufgaben = 0, aufgabenTage = 0;
  const offeneAufgaben = [];
  WAREN.forEach(w => {
    const a = state.aufgaben[w.id];
    if (!a.aktiv) return;
    // Eine Bestellung ohne Tage gibt es hier einfach nicht — kein Grund zu mahnen
    if (!a.tage.length && w.gruppe === "bestellung") return;
    const tage = a.tage.map(k => aufgabeAm(a, k));
    if (!tage.length || tage.some(x => !hat(x.dauer) || !hat(x.personen))){ offeneAufgaben.push(w.anzeige || w.name); return; }
    aufgaben += tage.reduce((s,x) => s + nz(x.dauer) * nz(x.personen), 0);
    aufgabenTage += a.tage.length;
  });
  const qual = {};
  QUAL.forEach(([k]) => qual[k] = ms.filter(m => m.qual && m.qual.includes(k)).length);

  // Wer kann eine Schicht führen: Filialleitung selbst oder die jeweilige Vertretung
  const fuehrt = q => ms.filter(m => m.typ === "Filialleitung" || (m.qual || []).includes(q)).length;
  const fruehOk = fuehrt("frueh"), spaetOk = fuehrt("spaet");

  // Mindestbedarf der Woche — nur, soweit die Angaben reichen
  const offenBekannt = hatZeit(state.von) && hatZeit(state.bis);
  const von = minuten(state.von), bis = minuten(state.bis);
  const offenH = offenBekannt ? Math.max(0, (bis - von) / 60) : null;
  const grund  = offenH === null ? null : offenH * MIN_BESETZUNG * OEFFNUNGSTAGE;

  const frueheste = {};
  let flexible = 0;
  if (offenBekannt) WAREN.forEach(w => {
    const a0 = state.aufgaben[w.id];
    if (!a0.aktiv) return;
    let flex = false;
    a0.tage.forEach(tg => {
      const a = aufgabeAm(a0, tg);
      // zwingend vor Öffnung? feste Zeit davor, oder ein Fenster, das vorher endet
      let start = null;
      if (a.zeitArt === "fest" && hatZeit(a.zeit) && minuten(a.zeit) < von) start = minuten(a.zeit);
      else if (a.zeitArt === "spanne" && hatZeit(a.fVon) && hatZeit(a.fBis) && minuten(a.fBis) <= von) start = minuten(a.fVon);
      // Zeitspanne ohne „spätestens“, die vor der Öffnung beginnt: wie eine feste Zeit (fertig bis zur Öffnung)
      else if (a.zeitArt === "spanne" && hatZeit(a.fVon) && !hatZeit(a.fBis) && minuten(a.fVon) < von) start = minuten(a.fVon);
      else if (a.zeitArt !== "fest") flex = true;
      if (start === null) return;
      frueheste[tg] = Math.min(frueheste[tg] === undefined ? von : frueheste[tg], start);
    });
    if (flex) flexible++;
  });
  const aussen = state.allein ? 1 : MIN_BESETZUNG;
  const vorlauf = Object.values(frueheste).reduce((s,m) => s + (von-m)/60 * aussen, 0);

  // Nachlauf: Aufgaben, die zwingend nach Ladenschluss enden
  const spaeteste = {};
  if (offenBekannt) WAREN.forEach(w => {
    const a0 = state.aufgaben[w.id];
    if (!a0.aktiv) return;
    a0.tage.forEach(tg => {
      const a = aufgabeAm(a0, tg);
      if (!hat(a.dauer)) return;
      let ende = null;
      if (a.zeitArt === "fest" && hatZeit(a.zeit)) ende = minuten(a.zeit) + nz(a.dauer)*60;
      else if (a.zeitArt === "spanne" && hatZeit(a.fBis)) ende = minuten(a.fBis);
      if (ende === null || ende <= bis) return;
      spaeteste[tg] = Math.max(spaeteste[tg] === undefined ? bis : spaeteste[tg], ende);
    });
  });
  const nachlauf = Object.values(spaeteste).reduce((s,e) => s + (e-bis)/60 * aussen, 0);

  let zusatz = 0;
  WAREN.forEach(w => {
    const a0 = state.aufgaben[w.id];
    if (!a0.aktiv) return;
    a0.tage.forEach(tg => {
      const a = aufgabeAm(a0, tg);
      if (!hat(a.dauer) || !hat(a.personen)) return;
      zusatz += Math.max(0, nz(a.personen) - 1) * nz(a.dauer);
    });
  });
  const bedarf = grund === null ? null : grund + vorlauf + nachlauf + zusatz;

  if (!offenBekannt)       luecken.push("Öffnungszeit — ohne sie lässt sich die Grundbesetzung nicht rechnen");
  if (offeneAufgaben.length) luecken.push("Wochenaufgaben ohne Tag, Dauer oder Personenzahl: " + offeneAufgaben.join(", "));
  if (ohneStunden.length)  luecken.push("Ohne Stundenangabe: " + ohneStunden.map(m => m.name).join(", "));
  if (ohneGeb.length)      luecken.push("Ohne Altersangabe, Jugendschutz ungeprüft: " + ohneGeb.map(m => m.name).join(", "));
  const leitung = ms.filter(m => m.typ === "Filialleitung");
  if (leitung.length && !leitung.some(m => TAGE.some(([k]) => (m.standard || {})[k] && (m.standard || {})[k].von)))
    luecken.push("Standardwoche der Filialleitung — sie ist der Fixpunkt des Wochenplans");
  if (budgetTage && budgetTage < TAGE.length) luecken.push(`Stundenliste nur für ${budgetTage} von 6 Tagen ausgefüllt`);

  const vollstaendig = offenBekannt && !offeneAufgaben.length && !ohneStunden.length;

  return {anwesend, wirksam, budget, budgetTage, umsatz, aufgaben, aufgabenTage, qual, fruehOk, spaetOk,
          offenH, grund, vorlauf, nachlauf, zusatz, bedarf, flexible, aussen, luecken, offeneAufgaben, ohneStunden, ohneGeb, vollstaendig,
          minderjaehrig: ms.filter(minderjaehrig)};
}

// ==== kern/05-planer.js ====
/* Bau eines Wochenplans und Prüfung der Besetzung */

function baueWoche(montagISO, rnd, vorgabe){
  const SLOT = 30;
  const mo = montagDer(montagISO);
  vorgabe = vorgabe || wochenVorgabe(mo);
  // Wer in dieser Woche ausfällt — krank, Urlaub, Berufsschule oder schlicht verhindert
  const abw = (state.abwesend || {})[wochenSchluessel(mo)] || {};
  // Ein Eintrag ist entweder ein ganzer Tag (Text) oder eine Zeitangabe
  // ({a:"nur"|"ohne", von, bis}) — „nur von–bis“ bzw. „nicht von–bis“.
  const eintrag = (i, tag) => (abw[i] || {})[tag] || null;
  const darfArbeiten = (i, tag, von, bis) => {
    if (blockWoche(abw, i)) return false;
    const e = eintrag(i, tag);
    if (!e) return true;
    if (typeof e === "string") return false;
    const a = hatZeit(e.von) ? minuten(e.von) : null;
    const b = hatZeit(e.bis) ? minuten(e.bis) : null;
    if (a === null || b === null || b <= a) return true;   // unvollständig: wie verfügbar
    return e.a === "nur" ? (von >= a && bis <= b) : (bis <= a || von >= b);
  };
  const grundText = e => typeof e === "string"
    ? (ABW.find(([v]) => v === e) || ["","abwesend"])[1]
    : (e.a === "nur" ? `nur ${e.von}–${e.bis} Uhr` : `nicht ${e.von}–${e.bis} Uhr`);
  const offenVon = hatZeit(state.von) ? minuten(state.von) : 8*60;
  const offenBis = hatZeit(state.bis) ? minuten(state.bis) : 21*60;
  const wechsel  = hatZeit(state.wechsel) ? minuten(state.wechsel) : Math.round((offenVon + offenBis)/2);
  const aussen   = state.allein ? 1 : MIN_BESETZUNG;
  const ms = state.mitarbeiter;
  const soll = ms.map(m => hat(istAzubi(m) ? m.betrieb : m.vertrag) ? stunden(m) : null);
  const ziel = vorgabe.ziel;
  // Standardwochen sind gesetzt — ihre Stunden gelten von vornherein als verplant.
  // Nur die, die auch stattfinden: Urlaub und Feiertag stecken schon im Ziel.
  const standardStunden = i => TAGE.reduce((s,[k],ti) => {
    const d = new Date(mo); d.setDate(mo.getDate() + ti);
    const x = standardAm(ms[i], k, d);
    if (!x) return s;
    return istFeiertag(d) || !darfArbeiten(i, k, x.von, x.bis) ? s : s + x.arbeit;
  }, 0);
  const rest = ms.map((m,i) => (soll[i] === null ? 0 : ziel[i]) - standardStunden(i));
  // Jugendliche: Berufsschultage zählen als Arbeitstage und mit 8 h auf die 40 der Woche
  const schule = ms.map((m, i) => schulLast(abw, i));
  const tageGearbeitet = ms.map((m, i) => schule[i].tage);
  const letztesEnde = ms.map(() => null);
  // Was Aushilfen in den anderen Wochen der berührten Monate schon haben (Minijob-Grenze)
  const minijobBasis = ms.map(m => istAushilfe(m) ? monatsStunden(m.name, {mo, tage: [], namen: null}).stunden : null);
  const meldungen = [];
  const tage = [];
  ms.forEach((m, i) => { if (blockWoche(abw, i)) meldungen.push({art:"warn", text:`${m.name}: Blockwoche Berufsschule — diese Woche keine Arbeit im Betrieb.`}); });
  // Jugendliche: Arbeit der Woche bisher (fertige Tage und heute), für die 40 h
  const wochenArbeit = i => tage.reduce((s, t) => s + t.schichten.filter(x => x.mi === i).reduce((a, x) => a + x.arbeit, 0), 0);

  TAGE.forEach(([key,label], ti) => {
    const d = new Date(mo); d.setDate(mo.getDate() + ti);
    const feiertag = istFeiertag(d);
    const tag = {key, label, datum:d, feiertag, schichten:[], aufgaben:[]};
    tage.push(tag);
    if (feiertag){ meldungen.push({art:"warn", text:`${label}, ${deVon(d)}: ${feiertagName(d)} — die Filiale bleibt geschlossen.`}); return; }

    // Heiligabend schließt der Laden früher (oeffnungAm)
    const {von: offenVon, bis: offenBis, sonder} = oeffnungAm(d);
    const auf = aufgabenAmTag(key, offenVon, offenBis, vorgabe);
    tag.aufgaben = auf;
    if (sonder) meldungen.push({art:"warn", text: sonderTagText(tag)});
    const vortagEnde = letztesEnde.slice();     // für die Ruhezeit, wenn Schichten wachsen
    const tagVon = Math.floor(Math.min(offenVon, ...auf.map(a => a.von)) / 30) * 30;
    const tagBis = Math.ceil(Math.max(offenBis, ...auf.map(a => a.bis)) / 30) * 30;

    const belegt = [];
    const schichtenVon = i => belegt.filter(b => b.mi === i);
    // Normalfall: höchstens eine Schicht am Tag. Wer ausdrücklich geteilt arbeiten
    // darf, bekommt eine zweite — mit Abstand, sonst wäre es eine Schicht mit Loch.
    const passtDazu = (i, von, bis) => {
      const da = schichtenVon(i);
      if (!da.length) return true;
      if (!ms[i].geteilt || da.length >= 2) return false;
      return da.every(b => von >= b.bis + 60 || bis + 60 <= b.von);
    };
    // Anwesend ist, wer im Haus ist — auch in der Pause (im Notfall rufbar).
    // Auf der Fläche steht nur, wer gerade keine Pause hat.
    const da = m => belegt.filter(b => b.von <= m && b.bis > m);
    const aufFlaeche = m => da(m).filter(b => !(b.pVon !== null && b.pVon <= m && b.pBis > m));
    const kann = (i,q) => !q || (ms[i].qual || []).includes(q);
    const fuehrt = (i,q) => ms[i].typ === "Filialleitung" || (ms[i].qual || []).includes(q);

    const bedarf = m => {
      const drin = m >= offenVon && m < offenBis;

      // Während der Öffnung: Kasse plus Aufgabenkräfte, mindestens zwei.
      // Davor und danach: nur so viele, wie die Aufgaben wirklich brauchen —
      // die Zeit allein im Laden ist die billigste, die es gibt.
      return personenBedarf(auf, m, drin, aussen);
    };
    // Mangel an einem Zeitpunkt, getrennt nach Art — die Reihenfolge der Prüfung
    // entscheidet, wer zuerst gebunden wird, deshalb steht die Führung vorn
    const mangel = (m, art) => {
      const leute = da(m);
      if (art === "fuehrung"){
        // Auch vor der Öffnung: Aufschließen kann nur, wer den Schlüssel hat —
        // Filialleitung oder Vertretung.
        const fq = m < wechsel ? "frueh" : "spaet";
        if (!leute.some(b => fuehrt(b.mi, fq))) return {art:"fuehrung", qual:fq};
        return null;
      }
      // Pausen beginnen auch zur Viertelstunde — Kasse und Aufgaben werden deshalb je
      // Viertelstunde geprüft, sonst rutscht eine Lücke wie 9:45–10:00 durch
      if (art === "kasse"){
        if ([m, m + 15].some(q => q >= offenVon && q < offenBis && !aufFlaeche(q).some(b => kann(b.mi,"kasse")))) return {art:"kasse", qual:"kasse"};
        return null;
      }
      if (art === "aufgabe"){
        for (const a of auf){
          if (!aufgabeLaeuft(a, m) || !a.braucht) continue;
          if ([m, m + 15].some(q => a.von < q + 15 && a.bis > q && aufFlaeche(q).filter(b => kann(b.mi, a.braucht)).length < a.pers))
            return {art:"aufgabe:"+a.name, qual:a.braucht};
        }
        return null;
      }
      if (leute.length < bedarf(m)) return {art:"anzahl", qual:null};
      return null;
    };

    // Aushilfen: Stunden des Monats aus den anderen Wochen, den schon gebauten Tagen und heute
    const minijobOk = (i, mehr) => {
      if (!istAushilfe(ms[i])) return true;
      const monat = monatVon(d);
      let summe = minijobBasis[i][monat] || 0;
      tage.forEach(t => { if (t !== tag && monatVon(t.datum) === monat) t.schichten.forEach(s => { if (s.mi === i) summe += s.arbeit; }); });
      belegt.forEach(b => { if (b.mi === i) summe += (b.bis - b.von)/60 - (b.pVon === null ? 0 : (b.pBis - b.pVon)/60); });
      return summe + mehr <= minijobStunden(+monat.slice(0, 4)) + 0.01;
    };
    // Ruhezeit auch nach vorn: Steht morgen eine feste Schicht, muss bis dahin genug Ruhe
    // bleiben (11 h, unter 18: 12 h) — sonst verstößt der Plan, obwohl jede Schicht für sich passt
    const folgeSchicht = (() => {
      const k2 = TAGE[ti + 1];
      if (!k2) return () => null;
      const d2 = new Date(mo); d2.setDate(mo.getDate() + ti + 1);
      if (istFeiertag(d2)) return () => null;
      return i => { const s2 = standardAm(ms[i], k2[0], d2); return s2 && darfArbeiten(i, k2[0], s2.von, s2.bis) ? s2 : null; };
    })();
    const ruheBisMorgen = (i, bis) => {
      const s2 = folgeSchicht(i);
      return !s2 || (24*60 + s2.von - bis)/60 >= ruhezeitFuer(minderjaehrig(ms[i])) - 0.01;
    };
    const regelOk = (i, von, bis) => {
      const m = ms[i];
      if (!passtDazu(i, von, bis)) return false;
      if (!minijobOk(i, (bis - von)/60 - pauseFuer(m, (bis - von)/60))) return false;
      if (!darfArbeiten(i, key, von, bis)) return false;
      const minder = minderjaehrig(m);
      if (minder && !jugendZeit(von, bis, d)) return false;
      const schonHeute = schichtenVon(i);
      if (!schonHeute.length && tageGearbeitet[i] >= maxTageFuer(minder)) return false;
      const anw = (bis - von)/60;
      // Bei geteilten Schichten zählt der ganze Tag gegen die Tageshöchstzeit
      const heuteSchon = schonHeute.reduce((x,b) => x + (b.bis-b.von)/60 - (b.pBis === null ? 0 : (b.pBis-b.pVon)/60), 0);
      if (heuteSchon + anw - pauseFuer(m, anw) > MAXARBEIT + 0.01 || !schichtLaengeOk(m, anw)) return false;
      if (letztesEnde[i] !== null && (ti*24*60 + von - letztesEnde[i])/60 < ruhezeitFuer(minder) - 0.01) return false;
      if (!ruheBisMorgen(i, bis)) return false;
      if (minder && wochenArbeit(i) + belegt.filter(b => b.mi === i).reduce((a, b) => a + arbeitVon(b), 0)
          + anw - pauseFuer(m, anw) + schule[i].stunden > REGELN.jugendWoche + 0.01) return false;
      // Azubis: nie über die Betriebsstunden
      if (istAzubi(m) && soll[i] !== null && anw - pauseFuer(m, anw) > rest[i] + 0.01) return false;
      return true;
    };
    const setzen = (i, von, bis, rolle, zaehlen) => {
      const m = ms[i];
      const anw = (bis-von)/60;
      const pz = pauseFuer(m, anw);
      // etwa in der Mitte der Schicht, nie am Rand
      let pVon = null, pBis = null;
      if (pz > 0){
        const laenge = pz*60;
        pVon = Math.round((von + (bis - von)/2 - laenge/2)/15)*15;
        pVon = Math.max(von + 60, Math.min(pVon, bis - 60 - laenge));
        if (pVon < von) pVon = von + Math.round((bis-von-laenge)/2/15)*15;
        pBis = pVon + laenge;
      }
      const erste = !schichtenVon(i).length;
      belegt.push({mi:i, von, bis, pVon, pBis, rollen: rolle ? [rolle] : [],
                   zaehlt: zaehlen !== false, fest: rolle === "Standard"});
      if (zaehlen !== false) rest[i] -= anw - pz;
      if (erste) tageGearbeitet[i]++;      // ein geteilter Tag bleibt ein Arbeitstag
      letztesEnde[i] = Math.max(letztesEnde[i] ?? -Infinity, ti*24*60 + bis);
    };
    // --- Bestehende Schichten verlängern oder kürzen ---------------------
    const arbeitVon = b => (b.bis - b.von)/60 - (b.pVon === null ? 0 : (b.pBis - b.pVon)/60);
    const pauseLegen = b => {
      const pz = pauseFuer(ms[b.mi], (b.bis - b.von)/60);
      if (pz > 0){
        const laenge = pz*60;
        let pv = Math.round((b.von + (b.bis - b.von)/2 - laenge/2)/15)*15;
        pv = Math.max(b.von + 60, Math.min(pv, b.bis - 60 - laenge));
        if (pv < b.von) pv = b.von + Math.round((b.bis - b.von - laenge)/2/15)*15;
        b.pVon = pv; b.pBis = pv + laenge;
      } else { b.pVon = null; b.pBis = null; }
    };
    // Zeitraum ändern: Stunden umbuchen, Pause neu legen
    const umbauen = (b, von, bis) => {
      if (b.zaehlt) rest[b.mi] += arbeitVon(b);
      b.von = von; b.bis = bis; pauseLegen(b);
      if (b.zaehlt) rest[b.mi] -= arbeitVon(b);
      letztesEnde[b.mi] = Math.max(vortagEnde[b.mi] ?? -Infinity,
        ...schichtenVon(b.mi).map(x => ti*24*60 + x.bis));
    };
    // Wie viele Halbstunden-Mängel hat der Tag gerade? Maß dafür, ob ein Umbau hilft
    const mangelZahl = () => {
      let n = 0;
      for (let m = tagVon; m < tagBis; m += SLOT)
        for (const art of ["fuehrung","kasse","aufgabe","anzahl"]) if (mangel(m, art)) n++;
      return n;
    };
    // Darf Schicht b auf von–bis wachsen?
    const dehnbar = (b, von, bis) => {
      const i = b.mi, m = ms[i];
      if (b.fest) return false;                         // Standardwochen bleiben, wie sie sind
      if (!darfArbeiten(i, key, von, bis)) return false;
      const minder = minderjaehrig(m);
      if (minder && !jugendZeit(von, bis, d)) return false;
      const andere = schichtenVon(i).filter(x => x !== b);
      if (andere.some(x => !(von >= x.bis + 60 || bis + 60 <= x.von))) return false;
      const anw = (bis - von)/60;
      const sonst = andere.reduce((x,y) => x + arbeitVon(y), 0);
      if (sonst + anw - pauseFuer(m, anw) > MAXARBEIT + 0.01 || !schichtLaengeOk(m, anw)) return false;
      if (istAzubi(m) && soll[i] !== null && b.zaehlt && anw - pauseFuer(m, anw) - arbeitVon(b) > rest[i] + 0.01) return false;
      if (vortagEnde[i] !== null && (ti*24*60 + von - vortagEnde[i])/60 < ruhezeitFuer(minder) - 0.01) return false;
      if (!ruheBisMorgen(i, bis)) return false;
      if (minder && wochenArbeit(i) + sonst + anw - pauseFuer(m, anw) + schule[i].stunden > REGELN.jugendWoche + 0.01) return false;
      return true;
    };
    // Eine Lücke schließen, indem eine angrenzende Schicht wächst — statt für eine
    // Stunde Bedarf eine neue Vier-Stunden-Schicht aufzumachen
    const verlaengern = (lVon, lBis, f) => {
      const passt = b => f.art === "fuehrung" ? fuehrt(b.mi, f.qual)
                       : f.art === "anzahl" ? true : kann(b.mi, f.qual);
      const vorher = mangelZahl();
      const kand = belegt.filter(b => passt(b) && (
          (b.bis >= lVon - 60 && b.bis < lBis && b.von < lVon) ||    // endet kurz davor
          (b.von <= lBis + 60 && b.von > lVon && b.bis > lBis)));    // beginnt kurz danach
      // wem anteilig am meisten Stunden fehlen, zuerst
      kand.sort((x,y) => (rest[y.mi] / (soll[y.mi] || 1)) - (rest[x.mi] / (soll[x.mi] || 1)));
      for (const b of kand){
        const von = Math.min(b.von, lVon), bis = Math.max(b.bis, lBis);
        if (!dehnbar(b, von, bis)) continue;
        const alt = {von:b.von, bis:b.bis};
        umbauen(b, von, bis);
        if (mangelZahl() < vorher) return true;
        umbauen(b, alt.von, alt.bis);
      }
      return false;
    };

    // Pausen so legen, dass nicht alle gleichzeitig weg sind. Bei gleichen
    // Schichten landeten sie sonst alle genau in der Mitte — und die Kasse war leer.
    // Erlaubt ist jede Lage, bei der vorher und nachher höchstens sechs Stunden
    // am Stück gearbeitet wird (§ 4 ArbZG), unter 18 höchstens viereinhalb (§ 11 JArbSchG).
    const pausenVersetzen = () => {
      for (let runde = 0; runde < 2; runde++){
        if (!mangelZahl()) return;
        for (const b of belegt){
          if (b.pVon === null) continue;
          const laenge = b.pBis - b.pVon;
          // Nur Pausen anfassen, die überhaupt etwas ausmachen: ändert sich nichts,
          // wenn die Person gar keine Pause hätte, bleibt sie, wo sie ist.
          {
            const mit = mangelZahl(), alt = b.pVon;
            b.pVon = null; const ohne = mangelZahl(); b.pVon = alt;
            if (ohne === mit) continue;
          }
          const minder = minderjaehrig(ms[b.mi]);
          const amStueck = amStueckFuer(minder);
          const mitte = b.von + (b.bis - b.von)/2 - laenge/2;
          let besteLage = b.pVon, besteZahl = mangelZahl(), besteAbstand = Math.abs(b.pVon - mitte);
          for (let pv = b.von + 60; pv + laenge <= b.bis - 60; pv += 15){
            if (pv - b.von > amStueck || b.bis - (pv + laenge) > amStueck) continue;
            b.pVon = pv; b.pBis = pv + laenge;
            const z = mangelZahl(), ab = Math.abs(pv - mitte);
            if (z < besteZahl || (z === besteZahl && ab < besteAbstand - 0.1)){
              besteLage = pv; besteZahl = z; besteAbstand = ab;
            }
          }
          b.pVon = besteLage; b.pBis = besteLage + laenge;
        }
      }
    };

    let mehrarbeit = false;
    const waehle = (von, bis, q, fuehrung) => {
      let k = ms.map((m,i) => i).filter(i => regelOk(i, von, bis));
      if (fuehrung) k = k.filter(i => fuehrt(i, fuehrung));
      else if (q) k = k.filter(i => kann(i, q));
      // Kasse: die Filialleitung nur, wenn sonst niemand kann
      if (q === "kasse" && !fuehrung && k.some(i => !istLeitung(ms[i]))) k = k.filter(i => !istLeitung(ms[i]));
      const mitRest = k.filter(i => rest[i] > 0.5);
      mehrarbeit = !mitRest.length && k.length > 0;
      const istFuehrer = i => fuehrt(i,"frueh") || fuehrt(i,"spaet");
      const anteil = i => (soll[i] && soll[i] > 0) ? rest[i] / soll[i] : 0;

      const hatStandard = i => TAGE.some(([k2]) => (ms[i].standard || {})[k2] && (ms[i].standard || {})[k2].von);
      const freiLautStandard = i => hatStandard(i) && !schicht(ms[i], key);
      if (mitRest.length){
        mitRest.sort((x,y) => {
          // Wer laut Standardwoche heute frei hat, bleibt frei
          const sx = freiLautStandard(x) ? 1 : 0, sy = freiLautStandard(y) ? 1 : 0;
          if (sx !== sy) return sx - sy;
          // Für einfache Rollen die knappen Frühkräfte schonen (Schlüsselträger)
          if (!fuehrung || fuehrung === "spaet"){
            const fx = fuehrt(x,"frueh") ? 1 : 0, fy = fuehrt(y,"frueh") ? 1 : 0;
            if (fx !== fy) return fx - fy;
          }
          const a = anteil(y) - anteil(x);    // wem anteilig am meisten fehlt, kommt zuerst
          return Math.abs(a) > 0.02 ? a : rest[y] - rest[x];
        });
        // Mehrere Durchläufe mit unterschiedlicher Wahl unter den fast Gleichwertigen
        // liefern unterschiedliche Pläne; der ausgewogenste gewinnt später.
        if (rnd && mitRest.length > 1){
          const kopf = mitRest.filter(i => anteil(i) >= anteil(mitRest[0]) - 0.08);
          if (kopf.length > 1) return kopf[Math.floor(rnd() * kopf.length)];
        }
        return mitRest[0];
      }
      // Niemand hat mehr Reststunden: Mehrarbeit. Jetzt zählt, wer anteilig am
      // wenigsten über seinem Vertrag liegt — und wie schwer ein Überhang bei
      // dieser Art Vertrag wiegt. Minijobs und Azubis stehen deshalb hinten:
      // die einen reißen sonst die Verdienstgrenze, die anderen haben feste
      // Betriebsstunden.
      const ueber = i => soll[i] ? Math.max(0, -rest[i]) / soll[i] : 0;
      // Wer keine Überstunden machen kann, kommt nur dran, wenn sonst niemand da ist
      const rang = i => (darfUeberstunden(ms[i]) ? 0 : 200)
                      + (freiLautStandard(i) ? 100 : 0)
                      + ueber(i) * ueberGewicht(ms[i])
                      + (ms[i].typ === "Filialleitung" ? 0.15 : 0);
      k.sort((x,y) => (rang(x) - rang(y)) || (soll[y] - soll[x]) || (rest[y] - rest[x]));
      return k.length ? k[0] : -1;
    };

    // 1) Standardwochen setzen (ihre Stunden sind schon reserviert)
    ms.forEach((m,i) => {
      const s = standardAm(m, key, d);
      if (!s){
        const roh = schicht(m, key);
        if (roh && roh.minder && !sonder && roh.bis > jugendBisAm(d))
          meldungen.push({art:"warn", text:`${label}, ${deVon(d)}: ${m.name} ist unter 18 und darf heute nur bis 14:00 Uhr arbeiten (§ 18 JArbSchG) — die Standardschicht ist neu geplant.`});
        return;
      }
      if (blockWoche(abw, i)) return;
      if (!darfArbeiten(i, key, s.von, s.bis)){
        // Den Grund (krank, Urlaub …) nicht in die Meldung: sie landet in der Excel-Datei,
        // und Krankheit ist ein Gesundheitsdatum (Art. 9 DSGVO)
        const e = eintrag(i, key);
        meldungen.push({art:"warn", text:`${label}: ${m.name} ${typeof e === "string" ? "fällt aus" : "ist nur eingeschränkt da (" + grundText(e) + ")"} — die Standardschicht entfällt und wird anders besetzt.`});
        return;
      }
      const minder = minderjaehrig(m);
      if (letztesEnde[i] !== null && (ti*24*60 + s.von - letztesEnde[i])/60 < ruhezeitFuer(minder) - 0.01)
        meldungen.push({art:"bad", text:`${label}: ${m.name} hat nur ${h1((ti*24*60 + s.von - letztesEnde[i])/60)} h Ruhezeit seit dem Vortag — so steht es in der Standardwoche.`});
      setzen(i, s.von, s.bis, "Standard", false);
    });

    // 2) Lücken im Zeitraster schließen
    const gemeldet = new Set();
    const offeneLuecken = [];
    const ARTEN = ["fuehrung","kasse","aufgabe","anzahl"];
    for (let runde = 0; runde < 80; runde++){
      let lVon = null, f = null;
      for (const art of ARTEN){
        for (let m = tagVon; m < tagBis; m += SLOT){
          const x = mangel(m, art);
          if (x && !gemeldet.has(x.art + "@" + m)){ lVon = m; f = x; break; }
        }
        if (lVon !== null) break;
      }
      if (lVon === null) break;
      let lBis = lVon + SLOT;
      while (lBis < tagBis){
        const x = mangel(lBis, f.art.startsWith("aufgabe") ? "aufgabe" : f.art);
        if (!x || x.art !== f.art) break;
        lBis += SLOT;
      }
      // Kurze Lücke: erst versuchen, eine Nachbarschicht wachsen zu lassen
      if (lBis - lVon < MINSCHICHT*60 && verlaengern(lVon, lBis, f)) continue;

      let von = lVon, bis = Math.max(lBis, von + MINSCHICHT*60);
      bis = Math.min(bis, tagBis);
      if (bis - von > REGELN.maxAnwesenheit*60) bis = von + REGELN.maxAnwesenheit*60;
      let i = waehle(von, bis, f.art === "anzahl" ? null : f.qual, f.art === "fuehrung" ? f.qual : null);
      // Niemand mehr frei: auch längere Lücken durch Verlängern versuchen
      if (i < 0 && verlaengern(lVon, lBis, f)) continue;

      // Schicht ausdehnen, aber nur so weit, wie die Person noch Stunden braucht —
      // sonst wächst der Stundenverbrauch, statt die Zerstückelung zu beenden
      if (i >= 0 && rest[i] >= MINSCHICHT && vorgabe.phase.art !== "sparen"){
        let ziel = Math.min(WUNSCHSCHICHT*60, Math.ceil(rest[i]*60/15)*15 + 30);
        ziel = Math.min(ziel, REGELN.maxAnwesenheit*60, tagBis - von);
        if (ziel > bis - von && regelOk(i, von, von + ziel)) bis = von + ziel;
      }
      // Reste am Tagesende nicht als Splitterschicht stehen lassen: nach vorne verlängern
      if (i >= 0 && bis - von < MINSCHICHT*60){
        const frueher = Math.max(tagVon, bis - MINSCHICHT*60);
        if (frueher < von && regelOk(i, frueher, bis)) von = frueher;
      }
      if (i < 0){
        for (let m = lVon; m < lBis; m += SLOT) gemeldet.add(f.art + "@" + m);
        offeneLuecken.push({art:f.art, von:lVon, bis:lBis});
        continue;
      }
      const rolle = f.art === "anzahl" ? "Fläche"
        : f.art === "kasse" ? "Kasse"
        : f.art === "fuehrung" ? (f.qual === "frueh" ? "Führung früh" : "Führung spät")
        : f.art.replace("aufgabe:","");
      setzen(i, von, bis, rolle);
      if (mehrarbeit){
        belegt[belegt.length-1].mehrarbeit = true;
        meldungen.push({art:"warn", text:`${label} ${hhmm(von)}–${hhmm(bis)}: ${ms[i].name} ist über die Vertragsstunden hinaus eingeplant — ohne Mehrarbeit wäre ${rolle === "Fläche" ? "die Mindestbesetzung" : rolle} hier unbesetzt.`});
      }
    }

    pausenVersetzen();

    // 2a) Was niemand mehr übernehmen konnte, weil alle schon eingeteilt sind:
    //     eine Schicht aus einer überbesetzten Zeit dorthin verschieben. Typisch
    //     sind sieben Leute am Morgen und abends einer — jeder kommt nur einmal am Tag.
    {
      const segmente = () => {
        const raus = [];
        for (const art of ARTEN){
          let start = null, fall = null;
          // Das Tagesende liegt nicht immer im Halbstundenraster (z. B. 21:15) —
          // deshalb einen Schritt darüber hinaus laufen, sonst bleibt die letzte
          // Lücke offen und wird weder repariert noch gemeldet.
          for (let m = tagVon; ; m += SLOT){
            const x = m < tagBis ? mangel(m, art) : null;
            if (x && start === null){ start = m; fall = x; }
            if ((!x || (fall && x.art !== fall.art)) && start !== null){
              raus.push({von:start, bis:Math.min(m, tagBis), f:fall}); start = null; fall = null;
              if (x){ start = m; fall = x; }
            }
            if (m >= tagBis) break;
          }
        }
        return raus;
      };
      let schutz = 0, geholfen = true;
      while (geholfen && schutz++ < 25){
        geholfen = false;
        const vorher = mangelZahl();
        if (!vorher) break;
        for (const lu of segmente()){
          const f = lu.f;
          // Erst die einfache Lösung: eine Nachbarschicht ein Stück länger
          if (verlaengern(lu.von, lu.bis, f)){ geholfen = true; break; }
          const passt = b => f.art === "fuehrung" ? fuehrt(b.mi, f.qual)
                           : f.art === "anzahl" ? true : kann(b.mi, f.qual);
          const kand = belegt.filter(b => !b.fest && passt(b) && (b.bis <= lu.von || b.von >= lu.bis));
          for (const b of kand){
            const laenge = Math.max(b.bis - b.von, lu.bis - lu.von, MINSCHICHT*60);
            let von = lu.von, bis = lu.von + laenge;
            if (bis > tagBis){ bis = tagBis; von = Math.max(tagVon, bis - laenge); }
            if (!dehnbar(b, von, bis)) continue;
            const alt = {von:b.von, bis:b.bis, rollen:b.rollen.slice()};
            umbauen(b, von, bis);
            if (mangelZahl() < vorher){
              b.rollen = [f.art === "anzahl" ? "Fläche" : f.art === "kasse" ? "Kasse"
                : f.art === "fuehrung" ? (f.qual === "frueh" ? "Führung früh" : "Führung spät")
                : f.art.replace("aufgabe:","")];
              geholfen = true; break;
            }
            umbauen(b, alt.von, alt.bis); b.rollen = alt.rollen;
          }
          if (geholfen) break;
        }
      }
    }

    // 2b) Überhang abbauen. Jede kurze Aufgabe hat eine eigene Schicht von
    //     mindestens vier Stunden aufgemacht; danach stehen morgens sechs Leute
    //     im Laden, die keiner braucht. Gekürzt wird nur bei denen, die schon über
    //     ihrem Vertrag liegen, und nur so weit, dass kein neuer Mangel entsteht.
    {
      const grenze = mangelZahl();
      let weiter = true, schutz = 0;
      while (weiter && schutz++ < 40){
        weiter = false;
        const reihe = belegt.filter(b => !b.fest && b.zaehlt && rest[b.mi] < -0.01)
          .sort((x,y) => (rest[x.mi] / (soll[x.mi] || 1)) - (rest[y.mi] / (soll[y.mi] || 1)));
        for (const b of reihe){
          for (const seite of ["ende", "anfang"]){
            if (rest[b.mi] >= -0.01) break;
            if (b.bis - b.von - SLOT < MINSCHICHT*60) break;
            const alt = {von:b.von, bis:b.bis};
            if (seite === "ende") umbauen(b, b.von, b.bis - SLOT);
            else umbauen(b, b.von + SLOT, b.bis);
            if (mangelZahl() > grenze) umbauen(b, alt.von, alt.bis);
            else weiter = true;
          }
        }
      }
    }

    pausenVersetzen();

    // 2c) Was jetzt noch fehlt, ist wirklich nicht zu besetzen — erst jetzt melden
    {
      const was = a => a === "anzahl" ? "die Mindestbesetzung" : a === "kasse" ? "die Kasse"
                     : a === "fuehrung" ? "die Schichtführung" : a.replace("aufgabe:","");
      for (const art of ARTEN){
        let start = null, fall = null;
        for (let m = tagVon; ; m += SLOT){
          const x = m < tagBis ? mangel(m, art) : null;
          if (x && start === null){ start = m; fall = x; }
          if (!x && start !== null){
            meldungen.push({art:"bad", text:`${label} ${hhmm(start)}–${hhmm(Math.min(m, tagBis))}: Für ${was(fall.art)} ist niemand verfügbar, der einsetzbar wäre.`});
            start = null;
          }
          if (m >= tagBis) break;
        }
      }
    }

    // 3) Rollen aus den Aufgaben nachtragen
    auf.forEach(a => {
      belegt.filter(b => b.von <= a.von && b.bis >= a.bis && (!a.braucht || kann(b.mi, a.braucht)))
        .slice(0, a.pers)
        .forEach(b => { if (!b.rollen.includes(a.name)) b.rollen.push(a.name); });
    });

    // 4) Schichten ausgeben
    tag.schichten = belegt.map(b => {
      const anw = (b.bis - b.von)/60;
      const pz = b.pVon === null ? 0 : (b.pBis - b.pVon)/60;
      return {mi:b.mi, von:b.von, bis:b.bis, pauseVon:b.pVon, pauseBis:b.pBis,
              pause:pz, arbeit: anw - pz, rollen:b.rollen, mehrarbeit: !!b.mehrarbeit};
    }).sort((x,y) => x.von - y.von || x.mi - y.mi);

    // 5) Während der Öffnung muss immer jemand auf der Fläche stehen
    for (let m = Math.max(tagVon, offenVon); m < Math.min(tagBis, offenBis); m += 15){
      if (!aufFlaeche(m).length){
        meldungen.push({art:"bad", text:`${label} ${hhmm(m)}: Alle Anwesenden haben gleichzeitig Pause — die Kasse wäre unbesetzt.`});
        break;
      }
    }
  });

  // Mehrarbeits-Meldungen zu einer zusammenfassen
  const mehr = meldungen.filter(x => x.text.includes("über die Vertragsstunden hinaus"));
  if (mehr.length > 3){
    const rest2 = meldungen.filter(x => !x.text.includes("über die Vertragsstunden hinaus"));
    rest2.unshift({art:"bad", text:`An ${mehr.length} Stellen musste über die Vertragsstunden hinaus geplant werden. Die Besetzungsregeln verlangen mehr Stunden, als die Verträge hergeben.`});
    meldungen.length = 0; meldungen.push(...rest2);
  }

  return {mo, tage, meldungen, konto:[], ziel, start: vorgabe.start, vorgabe};
}

/* ---- Aus vielen Entwürfen den ausgewogensten machen ----------------------

Der Bauschritt oben füllt Lücke für Lücke und entscheidet dabei immer nur für
den Augenblick. Das ergibt zulässige, aber schiefe Pläne: Wer früh dran ist,
sammelt Stunden, andere bleiben unter ihrem Vertrag. Deshalb entstehen hier
mehrere Entwürfe mit unterschiedlicher Wahl unter gleichwertigen Leuten, der
ausgewogenste wird genommen und danach noch einmal nachgebessert, indem ganze
Schichten von den Überbuchten zu den Unterbuchten wandern.
-------------------------------------------------------------------------- */

/* Zählt die Halbstunden, in denen ein Tag nicht richtig besetzt ist — nach
   denselben Regeln wie der Bauschritt, aber auf dem fertigen Plan. Damit prüfen
   der Ausgleich und die Gütezahl, statt sich auf Meldungen zu verlassen. */

function tagesMaengel(plan, ti){
  const t = plan.tage[ti];
  if (!t || t.feiertag) return 0;
  const ms = state.mitarbeiter;
  const {von: offenVon, bis: offenBis, normal} = oeffnungAm(t.datum);
  const wechsel  = hatZeit(state.wechsel) ? minuten(state.wechsel) : Math.round((offenVon + normal)/2);
  const aussen   = state.allein ? 1 : MIN_BESETZUNG;
  const auf = t.aufgaben || [];
  const tagVon = Math.floor(Math.min(offenVon, ...auf.map(a => a.von)) / 30) * 30;
  const tagBis = Math.ceil(Math.max(offenBis, ...auf.map(a => a.bis)) / 30) * 30;
  // Gespeicherte Pläne kennen die Leute beim Namen — wer inzwischen fehlt, zählt ohne Funktionen
  const wer    = s => (plan.namen ? ms.find(x => x.name === plan.namen[s.mi]) : ms[s.mi]) || {qual:[]};
  const kann   = (s,q) => !q || (wer(s).qual || []).includes(q);
  const fuehrt = (s,q) => wer(s).typ === "Filialleitung" || (wer(s).qual || []).includes(q);
  let n = 0;
  for (let m = tagVon; m < tagBis; m += 30){
    const da = t.schichten.filter(s => s.von <= m && s.bis > m);
    const drin = m >= offenVon && m < offenBis;
    // Kasse und Aufgaben je Viertelstunde: Pausen beginnen auch zur Viertelstunde
    const fl = q => aufFlaecheAm(t.schichten, q), viertel = [m, m + 15];
    if (!da.some(s => fuehrt(s, m < wechsel ? "frueh" : "spaet"))) n++;
    if (viertel.some(q => q >= offenVon && q < offenBis && !fl(q).some(s => kann(s, "kasse")))) n++;
    for (const a of auf){
      if (!aufgabeLaeuft(a, m)) continue;
      const br = (WAREN.find(w => w.id === a.id) || {}).braucht;
      if (br && viertel.some(q => a.von < q + 15 && a.bis > q && fl(q).filter(s => kann(s, br)).length < a.pers)){ n++; break; }
    }
    if (da.length < personenBedarf(auf, m, drin, aussen)) n++;
  }
  return n;
}

// Wer zum Zeitpunkt q auf der Fläche steht: im Haus und nicht in der Pause
function aufFlaecheAm(schichten, q){
  return schichten.filter(s => s.von <= q && s.bis > q && !(s.pauseVon !== null && s.pauseVon !== undefined && s.pauseVon <= q && s.pauseBis > q));
}

// Wie viele Leute müssen um m im Haus sein? Während der Öffnung die Kasse plus
// die Aufgabenkräfte, mindestens zwei; davor und danach nur, was die Aufgaben
// brauchen. Eine Zusatzaufgabe (Woche mit Mehrbedarf) verlangt jemanden zusätzlich
// zu denen, die die Standardwoche dort ohnehin hätte (basis) — sonst liefe sie bei
// Leuten mit, die schon da sind, und es gäbe keine einzige Stunde mehr.
/* Wie viele Personen eine halbe Stunde braucht.
   Aufgaben, die in dieser halben Stunde nacheinander liegen (05:00–05:15, 05:15–05:30),
   macht eine Person — gezählt wird deshalb je Viertelstunde, und die vollere zählt. */
function personenBedarf(auf, m, drin, aussen){
  const last = q => auf.reduce((n, a) => n + (a.id !== "zusatz" && a.von <= q && a.bis > q ? a.pers : 0), 0);
  const aufPers = Math.max(last(m), last(m + 15));
  let n = drin ? Math.max(MIN_BESETZUNG, aufPers + 1) : Math.max(aussen, aufPers);
  auf.forEach(a => {
    if (a.id !== "zusatz" || !aufgabeLaeuft(a, m)) return;
    n = a.basis ? Math.max(n, (a.basis[m] || 0) + a.pers) : n + a.pers;
  });
  return n;
}

function planMaengel(plan){ return plan.tage.reduce((x,t,ti) => x + tagesMaengel(plan, ti), 0); }

// ==== kern/06-ausgleich.js ====
/* Viele Entwürfe, Güte, Ausgleich, Auffüllen, Sparen */

const ENTWUERFE = REGELN.entwuerfe;

function wuerfel(saat){
  let x = (saat >>> 0) || 1;
  return () => { x ^= x << 13; x ^= x >>> 17; x ^= x << 5; x >>>= 0; return x / 4294967296; };
}

function istStunden(plan, i){
  return plan.tage.reduce((s,t) =>
