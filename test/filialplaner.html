<!doctype html>
<html lang="de"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="fassung" content="2026-11-18-2-test">
<title>Filialplaner</title>
<link rel="stylesheet" href="fonts.css">
<style>
/* Farben seit 16.11.2026: Anthrazit und Grau tragen die Oberfläche (--ton-…).
   Rot (--zutun) heißt nur „hier ist etwas zu tun“ — dazu der schmale Markenstreifen.
   Gelb (--gelb) ist der eine Hauptknopf je Seite, --marker der Textmarker für das,
   was nach dem Erstellen geändert wurde. Blau (--info) nur für Neues und den Fokus.
   --t-…: Tätigkeiten in Zeitleisten (geprüfte Farbfolge, je Modus eigene Stufen) —
   nur dort, und immer mit Legende. */
:root{
  --ton-900:#1B1D20; --ton-800:#24272B; --ton-700:#33373D; --ton-600:#4A5058;
  --ton-500:#7A818A; --ton-200:#CDD1D6; --ton-100:#E6E8EB; --ton-50:#F3F4F6;
  --paper:#F3F4F6; --surface:#FFFFFF; --surface-2:#F7F8F9;
  --ink:#1B1D20; --ink-2:#3A3F45; --muted:#636971; --line:#D9DCE0; --line-2:#ECEEF0;
  --voll:#24272B; --auf-voll:#FFFFFF; --link:#24272B;
  --info:#2F6FB5; --info-soft:#E6EFF8;
  --marke:#DC130C; --zutun:#DC130C;
  --gelb:#FFCD34; --gelb-hell:#FFD95E; --gelb-rand:#C99A00; --auf-gelb:#1B1D20;
  --marker:#FFE98A; --auf-marker:#1B1D20;
  --papier:#FBFAF7; --papier-2:#F1EFE9; --formlinie:#2E3136; --formlinie-2:#B4B8BE;
  --leiste:#24272B; --auf-leiste:#E6E8EB; --leiste-leise:#9AA1A9;
  --t-kasse:#2F6FB5; --t-ware:#2A9D8F; --t-bestell:#9A6BD0; --t-sonst:#9A5B2C;
  --t-aufbau:#7D9B1C; --t-backen:#E0A500; --t-abend:#E0607E;
  --good:#1F7A45; --good-soft:#E3F3E9;
  --warn:#9A6206; --warn-soft:#FDF1DD;
  --bad:#B32320;  --bad-soft:#FBE6E5;
  --shadow:0 1px 2px rgba(20,22,25,.05), 0 4px 14px -10px rgba(20,22,25,.25);
  --shadow-l:0 2px 6px rgba(20,22,25,.08), 0 18px 38px -22px rgba(20,22,25,.35);
  --r:10px; --r-s:8px;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,"Helvetica Neue",Arial,sans-serif;
  --display:var(--sans);
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ton-900:#F2F3F4; --ton-800:#DADDE1; --ton-700:#B9BEC5; --ton-600:#9AA1A9;
    --ton-500:#7A818A; --ton-200:#3A4047; --ton-100:#2A2E33; --ton-50:#22262A;
    --paper:#131517; --surface:#1C1F22; --surface-2:#23272B;
    --ink:#ECEEF0; --ink-2:#C9CDD2; --muted:#9AA1A9; --line:#343A40; --line-2:#292D32;
    --voll:#E6E8EB; --auf-voll:#1B1D20; --link:#E6E8EB;
    --info:#7FB2E8; --info-soft:#1B2B3D;
    --zutun:#E5352D;
    --gelb-rand:#A07A00;
    --marker:#5C4A00; --auf-marker:#FFF3C4;
    --papier:#1F2124; --papier-2:#272A2E; --formlinie:#9AA1A9; --formlinie-2:#4A5058;
    --leiste:#16181A; --auf-leiste:#E6E8EB; --leiste-leise:#8D949C;
    --t-kasse:#3F78D0; --t-ware:#35A77C; --t-bestell:#A07BDC; --t-sonst:#B07040;
    --t-aufbau:#8DB02A; --t-backen:#C79300; --t-abend:#E2758F;
    --good:#7FC395; --good-soft:#14301F; --warn:#D9A05B; --warn-soft:#33270F; --bad:#E08585; --bad-soft:#331B1B;
    --shadow:0 1px 2px rgba(0,0,0,.45), 0 6px 20px -10px rgba(0,0,0,.7);
    --shadow-l:0 2px 6px rgba(0,0,0,.5), 0 18px 38px -22px rgba(0,0,0,.85);
  }
}
:root[data-theme="dark"]{
  --ton-900:#F2F3F4; --ton-800:#DADDE1; --ton-700:#B9BEC5; --ton-600:#9AA1A9;
    --ton-500:#7A818A; --ton-200:#3A4047; --ton-100:#2A2E33; --ton-50:#22262A;
    --paper:#131517; --surface:#1C1F22; --surface-2:#23272B;
    --ink:#ECEEF0; --ink-2:#C9CDD2; --muted:#9AA1A9; --line:#343A40; --line-2:#292D32;
    --voll:#E6E8EB; --auf-voll:#1B1D20; --link:#E6E8EB;
    --info:#7FB2E8; --info-soft:#1B2B3D;
    --zutun:#E5352D;
    --gelb-rand:#A07A00;
    --marker:#5C4A00; --auf-marker:#FFF3C4;
    --papier:#1F2124; --papier-2:#272A2E; --formlinie:#9AA1A9; --formlinie-2:#4A5058;
    --leiste:#16181A; --auf-leiste:#E6E8EB; --leiste-leise:#8D949C;
    --t-kasse:#3F78D0; --t-ware:#35A77C; --t-bestell:#A07BDC; --t-sonst:#B07040;
    --t-aufbau:#8DB02A; --t-backen:#C79300; --t-abend:#E2758F;
    --good:#7FC395; --good-soft:#14301F; --warn:#D9A05B; --warn-soft:#33270F; --bad:#E08585; --bad-soft:#331B1B;
    --shadow:0 1px 2px rgba(0,0,0,.45), 0 6px 20px -10px rgba(0,0,0,.7);
    --shadow-l:0 2px 6px rgba(0,0,0,.5), 0 18px 38px -22px rgba(0,0,0,.85);
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.5;
  -webkit-font-smoothing:antialiased;font-size:15px;margin:0}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15;letter-spacing:-.02em}
h1{font-size:1.65rem;font-weight:800;color:var(--ton-900)}
h2{font-size:1.2rem;font-weight:700}
h3{font-size:.95rem;font-weight:700;color:var(--ton-900)}
p{margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--info);outline-offset:2px;border-radius:8px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.63rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:800}

/* ---------- Gerüst ---------- */
.wrap{max-width:1140px;margin:0 auto;padding:0 20px 64px}
.topbar{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:var(--oben);z-index:20}
.topbar-in{max-width:1140px;margin:0 auto;padding:11px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand .mark{width:34px;height:34px;border-radius:8px;background:var(--marke);display:grid;place-items:center;flex:none}
.brand .mark svg{width:19px;height:19px}
.brand strong{font-weight:800;font-size:1.05rem;letter-spacing:-.025em;color:var(--ton-900)}
.chip{font-family:var(--mono);font-size:.7rem;padding:4px 10px;border-radius:999px;border:1px solid var(--line);
  color:var(--muted);background:var(--surface-2);font-weight:500}
.chip.live{color:var(--link);border-color:var(--ton-200);background:var(--ton-100)}

.layout{display:grid;grid-template-columns:200px 1fr;gap:30px;align-items:start;padding-top:24px}
@media(max-width:860px){.layout{grid-template-columns:1fr;gap:16px}}

/* ---------- Schrittleiste ---------- */
.steps{position:sticky;top:calc(var(--oben) + 66px);display:flex;flex-direction:column;gap:1px}
@media(max-width:860px){.steps{position:static;flex-direction:row;overflow-x:auto;gap:5px;padding-bottom:4px}}
.step{display:flex;gap:10px;align-items:center;padding:8px 11px;border-radius:10px;border:0;background:none;
  text-align:left;cursor:pointer;color:var(--muted);width:100%;font-weight:600;transition:background .12s,color .12s}
.step:hover:not(:disabled){background:var(--ton-50);color:var(--ink-2)}
.step:disabled{cursor:not-allowed;opacity:.4}
.step .n{width:21px;height:21px;flex:0 0 21px;border-radius:50%;border:1.5px solid var(--line);
  display:grid;place-items:center;font-family:var(--mono);font-size:.66rem;background:var(--surface);font-weight:700}
.step .t{font-size:.84rem;white-space:nowrap}
.step[aria-current="step"]{color:var(--ton-900);background:var(--ton-100)}
.step[aria-current="step"] .n{background:var(--voll);border-color:var(--voll);color:var(--auf-voll)}
.step.done{color:var(--ink-2)}
.step.done .n{border-color:var(--ton-500);color:var(--ton-600)}

/* ---------- Flächen ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px;box-shadow:var(--shadow)}
.panel + .panel{margin-top:14px}
.lede{color:var(--muted);max-width:68ch;margin-top:5px;font-size:.9rem;font-weight:500}
.head{margin-bottom:18px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:640px){.g2,.g3{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.76rem;color:var(--muted);font-weight:700;letter-spacing:.01em}
label.f[hidden],[hidden]{display:none!important}
input[type=text],input[type=password],input[type=number],input[type=time],input[type=date],select{
  background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-s);padding:9px 11px;
  color:var(--ink);width:100%;font-weight:600;transition:border-color .12s,box-shadow .12s}
input:focus,select:focus{outline:none;border-color:var(--info);box-shadow:0 0 0 3px var(--info-soft)}
input::placeholder{color:var(--muted);font-weight:500}
input.num,input[type=number],input[type=time]{font-family:var(--mono);font-variant-numeric:tabular-nums}
.hint{font-size:.75rem;color:var(--muted);font-weight:500}
/* Auf dem Telefon zoomt Safari in jedes Feld unter 16px hinein */
@media (pointer:coarse){
  input[type=text],input[type=password],input[type=number],input[type=time],input[type=date],select{font-size:16px}
}
.btn{background:var(--voll);color:var(--auf-voll);border:1.5px solid var(--voll);border-radius:var(--r-s);
  padding:10px 18px;font-weight:700;font-size:.88rem;cursor:pointer;letter-spacing:-.01em;
  transition:background .12s,transform .08s}
.btn:hover{background:var(--ton-700);border-color:var(--ton-700)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--ton-200)}
.btn.ghost:hover{background:var(--ton-50);border-color:var(--ton-500)}
.btn.small{padding:6px 12px;font-size:.8rem}
.btn:disabled{opacity:.4;cursor:not-allowed}
.actions{display:flex;gap:9px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line-2);align-items:center;flex-wrap:wrap}
.actions .spacer{margin-left:auto}
.err{color:var(--bad);font-size:.82rem;margin-top:9px;min-height:1.1em;font-weight:600}

/* ---------- Aufgabenkarten ---------- */
.task{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--surface-2)}
.task + .task{margin-top:9px}
.task.off{opacity:.72}
.tag.neu{background:var(--voll);border-color:var(--voll);color:var(--auf-voll);vertical-align:middle}
.task-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.task-top h3{margin-right:auto}
.days{display:flex;gap:5px;flex-wrap:wrap;margin:11px 0 3px}
.day{width:40px;height:33px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);
  font-family:var(--mono);font-size:.74rem;cursor:pointer;color:var(--muted);font-weight:700;transition:all .1s}
.day:hover{border-color:var(--ton-200)}
.day[aria-pressed="true"]{background:var(--voll);border-color:var(--voll);color:var(--auf-voll)}
.task-fields{display:grid;grid-template-columns:minmax(130px,.9fr) minmax(140px,1.1fr) minmax(80px,.6fr) minmax(80px,.6fr);
  gap:9px;margin-top:9px;align-items:end}
@media(max-width:820px){.task-fields{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:480px){.task-fields{grid-template-columns:1fr}}
.zeitfelder{display:flex;gap:7px;align-items:flex-end}
.zeitfelder label.f{flex:1;min-width:0}
.wochenwechsel{display:flex;gap:4px;margin-right:8px}
.knopfreihe{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
td.warnalt{color:var(--warn);font-weight:700}
.ablage{display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;
  padding:26px 18px;border:2px dashed var(--line);border-radius:12px;background:var(--surface-2);
  cursor:pointer;transition:border-color .12s,background .12s}
.ablage:hover,.ablage:focus-visible{border-color:var(--ton-200);background:var(--ton-50)}
.ablage.drueber{border-color:var(--info);background:var(--info-soft)}
.ablage b{color:var(--ton-900)}
.abwzelle{padding:5px 6px;vertical-align:top}
.abwfeld{display:flex;flex-direction:column;gap:4px;min-width:118px}
.abwfeld select{padding:6px 8px}
.abwzeiten{display:flex;gap:4px}
.abwzeiten input{padding:5px 6px;font-size:.78rem}
.switch.jetag{margin:6px 0 2px}
.tagreiter{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tagreiter-b{display:flex;flex-direction:column;align-items:center;min-width:58px;padding:6px 10px;border-radius:10px;
  border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font:inherit;color:var(--ink)}
.tagreiter-b b{font-size:.8rem}
.tagreiter-b span{font-family:var(--mono);font-size:.66rem;color:var(--muted);min-height:1em}
.tagreiter-b[aria-selected="true"]{background:var(--voll);border-color:var(--voll);color:var(--auf-voll)}
.tagreiter-b[aria-selected="true"] span{color:inherit;opacity:.8}
.tagfach{margin-top:8px;padding:10px 12px 2px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.pstd{font-family:var(--mono);font-size:.8rem;color:var(--muted);padding:6px 0 2px;font-weight:500;text-align:right}
.pstd b{color:var(--link);font-weight:700}
.switch{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--ink-2);cursor:pointer;font-weight:600}
.switch input{accent-color:var(--voll);width:16px;height:16px}

/* ---------- Tabellen ---------- */
.tablewrap{overflow-x:auto;margin-top:4px}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th{text-align:left;font-size:.63rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);font-weight:800;padding:0 10px 8px;border-bottom:1.5px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle;font-weight:500}
tr:last-child td{border-bottom:none}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:.67rem;padding:2px 7px;border-radius:6px;font-weight:700;
  background:var(--ton-50);border:1px solid var(--line);color:var(--ink-2);margin:1px 2px 1px 0}
.tag.azubi{background:var(--ton-100);border-color:var(--ton-200);color:var(--link)}
.tag.minor{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.empty{color:var(--muted);font-size:.86rem;padding:20px 0;text-align:center;font-weight:500}

/* ---------- Kacheln & Meldungen ---------- */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}
@media(max-width:720px){.tiles{grid-template-columns:1fr}}
.tile{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--surface-2)}
.tile .v{font-family:var(--mono);font-size:1.6rem;font-weight:700;letter-spacing:-.03em;line-height:1.1;
  margin:5px 0 2px;color:var(--ton-900)}
.tile .sub{font-size:.75rem;color:var(--muted);font-weight:500}
.bar{height:7px;border-radius:99px;background:var(--ton-100);overflow:hidden;margin-top:9px;display:flex}
.bar i{display:block;height:100%;border-radius:99px}
.bar i.a{background:var(--ton-700)}
.bar i.b{background:var(--ton-700);opacity:.35}
.note{display:flex;gap:10px;padding:11px 13px;border-radius:10px;font-size:.85rem;align-items:flex-start;font-weight:500}
.note + .note{margin-top:7px}
.note .ic{font-family:var(--mono);font-weight:700;flex:0 0 auto}
.note.ok{background:var(--good-soft);color:var(--good)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.note.info{background:var(--info-soft);color:var(--ink)}
.qual{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.qual div{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--surface-2);
  display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.82rem;font-weight:600}
.qual b{font-family:var(--mono);font-weight:700}
.qual .c0{color:var(--bad)} .qual .c1{color:var(--warn)} .qual .c2{color:var(--good)}

/* ---------- Startseite ---------- */
.layout.ohne-leiste{grid-template-columns:1fr}


/* ---------- Plan im Filialformat ---------- */
.planwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
/* Gitterspalten dürfen schmaler werden als die Plantabelle — sonst schiebt sie die ganze Seite breit */
#view,.layout > *{min-width:0}
table.plan{border-collapse:collapse;width:100%;min-width:900px;font-size:.72rem}
table.plan th,table.plan td{border:1px solid var(--line);padding:4px 6px;text-align:center;
  vertical-align:middle;white-space:nowrap;font-weight:500;text-transform:none;letter-spacing:0;color:var(--ink)}
table.plan thead th{background:var(--ton-50);font-weight:700;font-size:.68rem;color:var(--ton-900);padding:6px}
table.plan .zeilenkopf{text-align:left;font-weight:700;min-width:168px;white-space:normal;
  background:var(--surface-2);font-size:.72rem}
table.plan .klein{font-size:.62rem;color:var(--muted);font-weight:500}
table.plan tr.liefer td{color:var(--ink-2);font-size:.68rem}
table.plan tr.aufgabenzeile td{background:var(--ton-50);font-weight:700;font-size:.66rem;white-space:normal}
table.plan tr.ma-oben td{font-family:var(--mono);font-weight:600}
table.plan tr.ma-unten td{font-family:var(--mono);color:var(--muted);font-size:.66rem}
table.plan td.frei{color:var(--muted);font-family:var(--sans);font-size:.68rem}
table.plan tr.summe td,table.plan tr.summe th{background:var(--ton-100);font-weight:700}
table.plan th.stdkopf{min-width:46px}
table.plan td.std{font-family:var(--mono);font-weight:700;background:var(--surface-2)}
table.plan td[contenteditable]{cursor:text}
table.plan td[contenteditable]:hover{background:var(--ton-50)}
table.plan td[contenteditable]:focus{outline:2px solid var(--info);outline-offset:-2px;background:var(--surface)}
table.plan td.fehlerhaft{background:var(--bad-soft);color:var(--bad)}
table.plan tr.aufgabenzeile td[contenteditable]{min-width:120px}
table.plan td.stunden{background:var(--surface-2)}
.phasenbox{margin:4px 0 6px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.phasenwahl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
@media(max-width:640px){.phasenwahl{grid-template-columns:1fr}}
.phasenkarte{display:flex;flex-direction:column;gap:2px;padding:10px 12px 10px 34px;position:relative;cursor:pointer;
  border:1.5px solid var(--line);border-radius:10px;background:var(--surface)}
.phasenkarte input{position:absolute;left:11px;top:12px;accent-color:var(--voll)}
.phasenkarte b{font-size:.86rem;color:var(--ton-900)}
.phasenkarte span{font-size:.74rem;color:var(--muted)}
.phasenkarte:has(input:checked){border-color:var(--voll);background:var(--ton-50)}
.phasendetail{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.phasendetail .switch input[type=radio]{width:16px;height:16px}
input.kurzzahl{width:70px;padding:4px 6px;font:inherit;text-align:right}
.tag.phase{background:var(--warn-soft, #FFF4E5);border-color:var(--warn);color:var(--warn);vertical-align:middle}
.kachelknoepfe{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.onlinekarte{margin-bottom:6px}
.onlinekopf{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.codefeld{text-align:right}
.codefeld b{display:block;font-family:var(--mono);font-size:1.5rem;letter-spacing:.12em;color:var(--link)}
details.anderewege{margin-top:18px}
details.anderewege summary{cursor:pointer;font-weight:700;color:var(--ton-900);margin-bottom:12px}
.warnzeile{color:var(--warn);font-weight:700}
.linkbox{margin-top:10px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.linkbox textarea{width:100%;font-size:.78rem;resize:none}
.termin-wege{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:stretch}
@media(max-width:700px){.termin-wege{grid-template-columns:1fr}}
.termin-wege .ablage{justify-content:center;min-height:150px}
.termin-text{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.termin-text label.f{width:100%}
.termin-text textarea{width:100%;font-family:var(--mono);font-size:.8rem;resize:vertical}
.namenzuordnung{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:8px}
table.termintabelle td{vertical-align:middle}
table.termintabelle tr.t-fehler td{color:var(--bad)}
table.termintabelle tr.t-gleich td{color:var(--muted)}
table.termintabelle tr.t-ersetzt td:nth-child(5){color:var(--warn);font-weight:600}
table.plan tr.bestell td{white-space:normal;line-height:1.35;vertical-align:top;padding-top:5px;padding-bottom:5px}
.b-gruppe{display:flex;flex-direction:column}
.b-gruppe + .b-gruppe{margin-top:5px}
.b-gruppe b{font-weight:700}
/* Stunden und Überstunden: grün = Plus, rot = Minus, blau = ausgeglichen (seit 17.11.2026) */
table.plan .ue-plus{color:var(--good)}
table.plan .ue-minus{color:var(--bad)}
table.plan .ue-null{color:var(--info-schrift)}
table.plan .ue-aend{font-size:.62rem;font-weight:700}
.ue-ende{color:var(--ink);font-weight:800}

.foot{margin-top:22px;color:var(--muted);font-size:.74rem;font-weight:500;text-align:center}
.fassungshinweis{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));
  z-index:60;background:var(--voll);color:var(--auf-voll);border-radius:999px;padding:10px 18px;font-size:.8rem;
  font-weight:600;box-shadow:var(--shadow-l);max-width:min(92vw,460px);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Rechnen ---------- */
.rechnet{position:fixed;inset:0;z-index:80;background:rgba(15,17,20,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.rechnet-k{background:var(--surface);border-radius:16px;padding:22px 24px;max-width:360px;display:flex;flex-direction:column;
  align-items:center;gap:6px;text-align:center;box-shadow:var(--shadow-l)}
.rechnet-k b{font-size:1.05rem;color:var(--ton-900)}
.kreisel{width:34px;height:34px;border-radius:50%;border:4px solid var(--ton-100);border-top-color:var(--voll);
  animation:drehen 0.9s linear infinite;margin-bottom:6px}
@keyframes drehen{to{transform:rotate(360deg)}}
.messlatte{margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--ton-50);display:flex;flex-direction:column;gap:2px;font-size:.84rem}

/* ---------- Ausfall ---------- */
.ausfallbox{border:1.5px solid var(--ton-200);background:var(--surface-2);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.ausfallkopf{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.day.breit{width:auto;min-width:64px;height:auto;padding:6px 8px;display:flex;flex-direction:column;align-items:center;gap:1px}
.day.breit span{font-size:.66rem;font-family:var(--mono);opacity:.85}
.day:disabled{opacity:.4;cursor:default}
.vorschlaege{display:flex;flex-direction:column;gap:8px}
.vorschlag{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;
  border:1px solid var(--line);background:var(--surface)}
.vorschlag ul{margin:4px 0 2px 18px;padding:0;font-size:.82rem}
.vorschlag .hint{display:block;margin-top:2px}
.vorschlag-rechts{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}

/* ---------- Urlaub & Krankheit ---------- */
.ereignisse-tab td{vertical-align:middle}
.tag.krank{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.tag.urlaub{background:var(--info-soft);border-color:var(--info);color:var(--info)}
.ereignis-vorbei td{color:var(--muted)}

/* ---------- Testfassung ---------- */
.testband{position:sticky;top:0;z-index:70;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:10px 16px;background:#B45309;color:#fff;font-size:.86rem;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.testband b{font-size:.95rem;letter-spacing:.02em;text-transform:uppercase}
.testband span{flex:1;min-width:200px}
.testband .btn.hell{background:#fff;color:#7C2D12;border-color:#fff}
.chip.test{background:#FEF3C7;border-color:#B45309;color:#7C2D12}
.testkasten{margin:16px 0;border-color:#F59E0B}

/* Bereitschaft und Pflichtangaben (13.11.2026) */
input.fehlt, select.fehlt{border-color:var(--bad) !important;box-shadow:0 0 0 3px var(--bad-soft)}
.bereit{margin:18px 0 4px}
.bereit .note span b{display:block;margin-bottom:2px}
.bereit-zeile{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.bereit-zeile .btn{flex:none}
.bereit-alter{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px;color:var(--ink)}
.bereit-alter b{flex:1 1 100%;display:block!important;margin:4px 0 0!important}
.abwzelle.fehlt{background:var(--bad-soft)}
.abwzelle.fehlt input[type=time]:invalid, .abwzelle.fehlt input[type=time]{border-color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.tag.fehlt{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.bereit-hinweise{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:11px 13px;font-size:.85rem;font-weight:500;margin-top:8px}
.bereit-hinweise summary{cursor:pointer}
.bereit-hinweise .bereit-zeile span{color:var(--ink-2)}

/* ======================================================================
   Gestaltung seit 13.11.2026: klare Ebenen, drei Bereichsgruppen, ein Raster.
   Ebene 1 Seite (paper) · Ebene 2 Karte (surface, Schatten) · Ebene 3 Feld (surface-2)
   Knöpfe: Haupt (gefüllt) · Neben (Rand) · leise (Text). Gruppenfarben nur als Akzent.
   ====================================================================== */
:root{--gruen:#1F7A45;--gruen-soft:#E3F3E9;--rot:#B32320;--rot-soft:#FBE6E5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --gruen:#7FC395;--gruen-soft:#14301F;--rot:#E08585;--rot-soft:#331B1B}}
:root[data-theme="dark"]{--gruen:#7FC395;--gruen-soft:#14301F;--rot:#E08585;--rot-soft:#331B1B}

/* Knöpfe */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;position:relative;line-height:1.2}
.btn .sym{width:17px;height:17px;flex:none}
.sym{width:20px;height:20px;display:inline-block;vertical-align:middle}

/* Rote Zahl */
.marke{position:absolute;top:-8px;right:-8px;min-width:21px;height:21px;padding:0 6px;border-radius:999px;
  background:var(--zutun);color:#fff;font:700 .7rem/21px var(--sans);text-align:center;box-shadow:0 0 0 2px var(--surface);
  letter-spacing:0;pointer-events:none}

/* Kopf der Startseite */
.start{display:flex;flex-direction:column;gap:18px}

/* Karten */
.karte{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow)}
.karte h3{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.karte h3 .sym{color:var(--link);width:18px;height:18px}
.karte-kopf{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.karte-kopf h2{margin-top:3px}
.karte-kopf h3{margin:0}
.karte-aktionen{display:flex;gap:8px;flex-wrap:wrap}
.wochenwechsel{margin-left:auto}
@media(max-width:560px){.karte{padding:14px 12px}.wochenwechsel{margin-left:0}}
.plan-fuss{margin-top:10px}
.leerplan{display:flex;flex-direction:column;align-items:center;gap:12px;padding:26px 0;color:var(--muted);font-weight:500}
details.aufklapp{margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface-2)}
details.aufklapp summary{cursor:pointer;font-weight:700;font-size:.86rem;color:var(--ton-900)}
details.aufklapp[open] summary{margin-bottom:10px}
/* Abschnitte innerhalb einer Seite: derselbe rote Balken wie die Rubriken (seit 18.11.2026) */
.abschnitt{font-size:1.02rem;font-weight:800;color:var(--ton-900);margin:26px 0 10px;padding-left:11px;border-left:4px solid var(--marke);line-height:1.25}

/* Gruppen und Kacheln */

/* Seitenkopf der Unterseiten */
.seitenkopf{display:grid;grid-template-columns:1fr auto;gap:4px 16px;margin-bottom:18px;align-items:end}
.zurueck-link{grid-column:1/-1;justify-self:start;display:inline-flex;align-items:center;gap:4px;border:0;background:none;
  color:var(--link);font-weight:700;font-size:.82rem;padding:2px 6px 2px 0;cursor:pointer}
.zurueck-link .sym{width:16px;height:16px}
.zurueck-link:hover{text-decoration:underline}
.seitenkopf-text h1{margin-top:4px}
.seitenkopf-rechts{display:flex;gap:8px;align-items:flex-end}
@media(max-width:640px){.seitenkopf{grid-template-columns:1fr}}
.wochenwahl{min-width:220px}

/* Hinweise oben auf einer Seite */
.markierungskasten{border:1px solid #F4B4AE;background:var(--rot-soft);border-radius:10px;padding:9px 12px;margin:-4px 0 16px;
  display:flex;flex-direction:column;gap:4px}
.mk-zeile{display:flex;gap:8px;align-items:center;font-size:.84rem;font-weight:600;color:var(--ink)}
.mk-punkt{width:9px;height:9px;border-radius:50%;background:var(--zutun);flex:none}
.mk-zeile.neu .mk-punkt{background:var(--info)}

/* Plan kompakt: passt in die Breite */
.planbox{container-type:inline-size;width:100%}
table.kompakt{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:0;font-size:.8rem}
table.kompakt col.c-name{width:19%} table.kompakt col.c-std{width:7%} table.kompakt col.c-konto{width:8%}
table.kompakt th,table.kompakt td{border-bottom:1px solid var(--line-2);border-right:1px solid var(--line-2);padding:5px 4px;
  text-align:center;vertical-align:middle;text-transform:none;letter-spacing:0;white-space:normal;overflow-wrap:anywhere}
table.kompakt thead th{background:var(--ton-50);color:var(--ton-900);font-size:.74rem;font-weight:800;border-bottom:1.5px solid var(--line);padding:7px 4px}
table.kompakt thead th.k-tag span{display:block;font-weight:500;font-size:.66rem;color:var(--muted)}
table.kompakt th.k-name,table.kompakt tbody th{text-align:left;padding-left:8px;font-size:.78rem;color:var(--ink);font-weight:700}
table.kompakt .k-feiertag{color:var(--muted)}
.k-zeit{display:inline-flex;gap:3px;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.78rem}
.k-zeit b{font-weight:600}
.k-zeit b:first-child::after{content:"–";margin-left:3px;font-weight:400;color:var(--muted)}
.k-pause{display:block;font-family:var(--mono);font-size:.64rem;color:var(--muted)}
td.k-frei{color:var(--muted);font-size:.72rem}
.k-typ{display:block;font-size:.66rem;color:var(--muted);font-weight:500}
.k-kurz{display:none}
td.k-std b,td.k-konto b{display:block;font-family:var(--mono);font-size:.78rem}
td.k-std span,td.k-konto span{display:block;font-family:var(--mono);font-size:.62rem;color:var(--muted)}
.k-konto .ue-plus,.ue-plus{color:var(--good)} .k-konto .ue-minus,.ue-minus{color:var(--bad)} .ue-null{color:var(--info-schrift)}
tr.k-zusatz th{font-size:.66rem!important;color:var(--muted)!important;text-transform:uppercase;letter-spacing:.08em!important}
tr.k-zusatz td{font-size:.66rem;color:var(--ink-2);line-height:1.3}
tr.k-summe th,tr.k-summe td{background:var(--ton-50);font-weight:700;font-family:var(--mono);font-size:.76rem}
tr.k-person:hover td,tr.k-person:hover th{background:var(--surface-2)}
.namelink{border:0;background:none;padding:0;font:inherit;font-weight:700;color:var(--link);cursor:pointer;text-align:left;
  text-decoration:underline;text-decoration-color:var(--ton-200);text-underline-offset:3px}
.namelink:hover{text-decoration-color:var(--ton-700)}
@container (max-width:760px){
  .k-zeit{flex-direction:column;gap:0;font-size:.72rem}
  .k-zeit b:first-child::after{content:none}
  table.kompakt th.k-name,table.kompakt tbody th{padding-left:4px}
  .k-typ{display:none}
}
@container (max-width:480px){
  table.kompakt{font-size:.7rem}
  table.kompakt col.c-name{width:17%} table.kompakt col.c-std{width:9%} table.kompakt col.c-konto{width:10%}
  .k-voll{display:none} .k-kurz{display:inline}
  .k-zeit{font-size:.64rem;letter-spacing:-.03em}
  .k-pause{display:none}
  table.kompakt th,table.kompakt td{padding:4px 1px}
  table.kompakt thead th{font-size:.66rem;padding:5px 1px}
  td.k-std b,td.k-konto b{font-size:.66rem} td.k-std span{display:none}
  tr.k-zusatz td{font-size:.56rem}
}

/* Urlaub & Krankheit */
.legende{display:flex;gap:14px;flex-wrap:wrap;font-size:.74rem;color:var(--muted);font-weight:600;margin:4px 0 10px}
.legende span{display:inline-flex;align-items:center;gap:6px}
.legende i,.tagstreifen i{display:inline-block;width:11px;height:11px;border-radius:3px;background:var(--line-2);border:1px solid var(--line)}
.legende i.urlaub,.tagstreifen i.urlaub{background:var(--info);border-color:var(--info)}
.legende i.krank,.tagstreifen i.krank{background:var(--rot);border-color:var(--rot)}
.legende i.neu{background:var(--gruen-soft);border-color:var(--gruen)} .legende i.rot{background:var(--rot-soft);border-color:var(--rot)}
.legende i.weg{background:repeating-linear-gradient(135deg,var(--rot-soft) 0 3px,var(--surface) 3px 6px);border-color:var(--rot)}
table.ueberblick th span{display:block;font-weight:500;letter-spacing:0;font-size:.62rem}
.tagstreifen{display:inline-flex;gap:2px}
.ereignisform{border:1px solid var(--line);border-radius:12px;background:var(--surface-2);padding:12px 14px;margin:10px 0}
.ereignisform-felder{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end}
.person-ereignisse{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.person-ereignisse-kopf{display:flex;align-items:center;gap:8px;color:var(--link)}
details.vorbei{margin-top:8px}

/* Plan ändern */
.aendern-status{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:12px;background:var(--surface-2);
  border:1px solid var(--line);margin-bottom:16px;position:sticky;top:calc(var(--oben) + var(--kopf) + 8px);z-index:15}
.pille{font-size:.76rem;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--line-2);color:var(--ink-2)}
.pille.rot{background:var(--rot-soft);color:var(--rot)} .pille.gruen{background:var(--gruen-soft);color:var(--gruen)}
.aendern-raster{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.aendern-haupt,.aendern-seite{display:flex;flex-direction:column;gap:14px;min-width:0}
@media(max-width:1000px){.aendern-raster{grid-template-columns:1fr}}
.karte.rot{border-color:#F4B4AE;background:linear-gradient(var(--rot-soft),var(--rot-soft)) top/100% 4px no-repeat,var(--surface)}
.karte.rot h3{color:var(--rot)}
.todo{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line-2);font-size:.86rem;font-weight:500}
.todo:first-child{border-top:0}
.todo .btn{flex:none}
td.bearbeitbar{cursor:pointer}
td.bearbeitbar:hover{outline:2px solid var(--info);outline-offset:-2px}
td.z-neu{background:var(--gruen-soft)!important;box-shadow:inset 0 0 0 1.5px var(--gruen)}
td.z-konflikt,td.z-recht{background:var(--rot-soft)!important;box-shadow:inset 0 0 0 1.5px var(--rot);color:var(--rot)}
td.z-weg{background:repeating-linear-gradient(135deg,var(--rot-soft) 0 4px,var(--surface) 4px 8px)!important}
td.z-weg s{display:block;font-family:var(--mono);font-size:.66rem;color:var(--muted)}
td.z-weg em{display:block;font-style:normal;font-weight:700;font-size:.66rem;color:var(--rot)}
tr.k-luecken th{color:var(--rot)!important;font-size:.66rem!important;text-transform:uppercase}
tr.k-luecken td{color:var(--rot);font-weight:700;font-size:.64rem;font-family:var(--mono);background:var(--rot-soft)}
tr.k-notiz td[data-notiz]{color:var(--muted)}
.vgruppe{display:flex;flex-direction:column;gap:8px;padding:10px 0;border-top:1px solid var(--line-2)}
.vgruppe:first-child{border-top:0;padding-top:0}
.vgruppe > b{font-size:.84rem}
.vkarte{border:1.5px solid var(--line);border-radius:11px;background:var(--surface-2);overflow:hidden}
.vkarte.an{border-color:var(--gruen);background:var(--gruen-soft)}
.vkarte-knopf{display:grid;grid-template-columns:1fr auto;gap:2px 8px;width:100%;text-align:left;border:0;background:none;
  padding:10px 12px;cursor:pointer;font:inherit;color:var(--ink)}
.vkarte-titel{font-weight:700;font-size:.85rem}
.vkarte-zustand{grid-column:1/-1;font-size:.72rem;color:var(--muted);font-weight:600}
.vkarte.an .vkarte-zustand{color:var(--gruen)}
.vkarte details{padding:0 12px 10px;font-size:.78rem;color:var(--ink-2)}
.vkarte summary{cursor:pointer;font-weight:700;color:var(--link);font-size:.76rem}
.vkarte details p{margin-top:6px;line-height:1.45}
.chat{display:flex;flex-direction:column;gap:8px;max-height:360px;overflow-y:auto;padding:2px 2px 8px}
.blase{max-width:92%;padding:8px 11px;border-radius:12px;font-size:.84rem;line-height:1.45}
.blase.assistent{background:var(--ton-50);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.blase.du{background:var(--voll);color:var(--auf-voll);align-self:flex-end;border-bottom-right-radius:4px}
.chatkarte{display:block;width:100%;text-align:left;margin-top:7px;padding:8px 10px;border-radius:9px;cursor:pointer;
  border:1.5px solid var(--ton-200);background:var(--surface);font:inherit;font-weight:700;font-size:.82rem;color:var(--ink)}
.chatkarte span{display:block;font-weight:600;font-size:.7rem;color:var(--muted)}
.chatkarte.an{border-color:var(--gruen);background:var(--gruen-soft)} .chatkarte.an span{color:var(--gruen)}
.chat-eingabe{display:flex;gap:8px;margin-top:8px}
.chat-eingabe input{flex:1}
.chat-eingabe .btn{padding:8px 12px}
.assistent .hint{margin-top:6px}

/* Dialog */
.dialog-hinter{position:fixed;inset:0;z-index:90;background:rgba(15,17,20,.5);display:flex;align-items:center;justify-content:center;padding:16px}
.dialog{background:var(--surface);border-radius:16px;padding:20px 20px 16px;width:min(440px,100%);box-shadow:var(--shadow-l);max-height:90vh;overflow:auto}
.dialog-knoepfe{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.dialog-knoepfe.unten{border-top:1px solid var(--line-2);padding-top:12px;margin-top:14px;align-items:center}
.dialog-knoepfe .spacer{margin-left:auto}
.dialog-ausfall{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:12px}

/* Analyse */
.empfehlung{display:flex;gap:12px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);margin-bottom:8px}
.empfehlung b{display:block;font-size:.92rem;color:var(--ink)}
.empfehlung p{font-size:.82rem;color:var(--ink-2);margin-top:3px;font-weight:500}
.empf-punkt{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;color:#fff;background:var(--muted)}
.empfehlung.rot{border-color:#F4B4AE;background:var(--rot-soft)} .empfehlung.rot .empf-punkt{background:var(--rot)}
.empfehlung.gelb{border-color:var(--warn);background:var(--warn-soft)} .empfehlung.gelb .empf-punkt{background:var(--warn)}
.empfehlung.gruen{border-color:var(--gruen);background:var(--gruen-soft)} .empfehlung.gruen .empf-punkt{background:var(--gruen)}
.balken{display:flex;flex-direction:column;gap:10px}
.balken-zeile{display:grid;grid-template-columns:210px 1fr 70px;gap:4px 12px;align-items:center}
.balken-name{font-size:.82rem;font-weight:700}
.balken-spur{height:14px;background:var(--line-2);border-radius:4px;overflow:hidden}
.balken-spur i{display:block;height:100%;border-radius:0 4px 4px 0;background:var(--ton-200)}
.balken-spur i.b2{background:var(--ton-500)} .balken-spur i.b3{background:var(--voll)} .balken-spur i.knapp{background:var(--rot)}
.balken-wert{font-family:var(--mono);font-size:.82rem;font-weight:700;text-align:right}
.balken-hinweis{grid-column:2/-1;font-size:.7rem;color:var(--muted);margin-top:-6px}
@media(max-width:560px){.balken-zeile{grid-template-columns:1fr 64px}.balken-name{grid-column:1/-1}.balken-hinweis{grid-column:1/-1}}
.saeulen{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;align-items:end;height:180px;padding:6px 0}
.saeule{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%}
.saeule-spur{flex:1;width:min(46px,70%);display:flex;align-items:flex-end;border-bottom:1.5px solid var(--line)}
.saeule-spur i{display:block;width:100%;background:var(--ton-600);border-radius:4px 4px 0 0;min-height:2px}
.saeule:hover .saeule-spur i{background:var(--voll)}
.saeule-wert{font-family:var(--mono);font-size:.74rem;font-weight:700}
.saeule-name{font-size:.76rem;font-weight:700;color:var(--muted)}
.aushilfe{margin-top:14px}
.aushilfe h3{margin-bottom:6px}
.wert-gelb{color:var(--warn);font-weight:700} .wert-rot{color:var(--rot);font-weight:700}
.panel > .zurueck-link{margin:-6px 0 8px}
tr.k-zusatz th{overflow-wrap:normal;word-break:normal}
@container (max-width:480px){
  td.k-konto span{display:none}
  td.k-konto b{font-size:.6rem;letter-spacing:-.04em}
  tr.k-zusatz th{font-size:.52rem!important;letter-spacing:.02em!important}
  table.kompakt th.k-name{font-size:.66rem}
}
@container (max-width:480px){ tr.k-summe td,tr.k-summe .k-std b{font-size:.58rem;letter-spacing:-.04em} }
@media(max-width:560px){
  .panel{padding:16px 12px}
  .aendern .karte{padding:12px 6px}
  .aendern .karte > h3,.aendern .karte-kopf,.aendern .todo,.aendern .vgruppe{padding-left:6px;padding-right:6px}
}
.vkarte-knopf .tag{align-self:start;justify-self:end}
/* iOS gibt Zeit- und Datumsfeldern eine eigene Mindestbreite — sie ragten über den Rand */
input[type=time],input[type=date]{min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;min-height:42px;text-align:left}
input[type=time]::-webkit-date-and-time-value,input[type=date]::-webkit-date-and-time-value{text-align:left}
.markierungskasten.neu{background:var(--info-soft);border-color:var(--ton-200)}

/* ======================================================================
   Überarbeitung 13.11.2026 (2): Filialformular wieder als Raster, Lösungen klarer,
   Personal als Liste
   ====================================================================== */
/* Plan: breit das Filialformular, schmal die kompakte Fassung */
.planbox .ansicht-schmal{display:none}
/* Das Formular braucht gut 830 px — darunter die kompakte Fassung, statt rechts abzuschneiden */
@container (max-width:860px){ .planbox .ansicht-breit{display:none} .planbox .ansicht-schmal{display:table} }
table.plan.gitter{min-width:0;width:100%;table-layout:auto;font-size:.7rem}
table.plan.gitter th,table.plan.gitter td{padding:3px 4px}
table.plan.gitter .zeilenkopf{min-width:0;width:15%}
table.plan.gitter .zeilenkopf .typ{display:block}
table.plan.gitter .namelink{font-size:.72rem}
@container (max-width:1000px){ table.plan.gitter{font-size:.62rem} table.plan.gitter th,table.plan.gitter td{padding:2px 2px} }
table.plan.gitter tr.k-luecken td{font-size:.62rem}

/* Geänderte Zellen: neue Zeit groß, alte klein, grau, durchgestrichen */
s.z-alt{display:block;font-size:.62rem;font-weight:500;color:var(--muted);text-decoration:line-through;font-family:var(--mono)}
em.z-grund{display:block;font-style:normal;font-weight:700;font-size:.62rem}
td.z-weg em.z-grund{color:var(--rot)}
em.z-neu-text{color:var(--gruen)}
td.z-geaendert{background:var(--marker)!important;color:var(--auf-marker);font-weight:700}
td.z-geaendert s.z-alt{color:var(--auf-marker);opacity:.72}
td.z-gestrichen{background:repeating-linear-gradient(135deg,var(--marker) 0 4px,var(--papier) 4px 8px)!important}
td.z-gestrichen em.z-grund{color:var(--ink)}
td.z-geaendert em.z-neu-text{color:var(--auf-marker)}
.legende i.geaendert{background:var(--marker);border-color:var(--gelb-rand)}
.planbox + .legende{margin-top:8px}

/* Lösungen */
.loesungen > h3{margin-bottom:12px}
.lgruppe{display:flex;flex-direction:column;gap:10px;padding:14px 0;border-top:1px solid var(--line)}
.lgruppe:first-child{border-top:0;padding-top:0}
.problem{border-left:4px solid var(--rot);background:var(--rot-soft);border-radius:0 10px 10px 0;padding:10px 12px}
.problem b{display:block;font-size:.92rem;color:var(--ink)}
.problem > span{display:block;font-size:.74rem;color:var(--muted);font-weight:600;margin-top:1px}
.problem p{margin-top:6px;font-size:.86rem;color:var(--ink)}
.problem p b{display:inline;color:var(--rot)}
.lkarte{border:1.5px solid var(--line);border-radius:12px;background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.lkarte.an{border-color:var(--gruen);background:var(--gruen-soft)}
.lkarte.teil{border-style:dashed}
.lk-kopf{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:start}
.lk-nr{grid-column:1/-1;font-size:.64rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--link)}
.lkarte.teil .lk-nr{color:var(--warn)}
.lk-kopf b{font-size:.92rem;line-height:1.3}
.lk-zeilen{margin:0;padding-left:18px;font-size:.84rem;display:flex;flex-direction:column;gap:2px}
.lk-zeilen s{color:var(--muted);font-family:var(--mono);font-size:.78rem}
.lk-ergebnis{font-size:.84rem;font-weight:700}
.lk-ergebnis.ok{color:var(--gruen)} .lk-ergebnis.teil{color:var(--warn)}
.lk-konto{font-size:.76rem;color:var(--muted);font-weight:600}
.lk-unten{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lk-unten details{font-size:.78rem;color:var(--ink-2)}
.lk-unten summary{cursor:pointer;font-weight:700;color:var(--link)}
.lk-unten details p{margin-top:6px;line-height:1.45;max-width:60ch}
.lgruppe > .btn{align-self:flex-start}

/* Tagesbalken */
.tagesbalken{display:flex;flex-direction:column;gap:4px;padding:6px 0 2px}
.tb-reihe{display:grid;grid-template-columns:64px 1fr;gap:8px;align-items:center}
.tb-name{font-size:.72rem;font-weight:700;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-spur{position:relative;height:14px;background:var(--line-2);border-radius:4px}
.tb-spur i{position:absolute;top:0;bottom:0;border-radius:3px}
.tb-luecke{background:rgba(217,45,32,.22);top:-3px!important;bottom:-3px!important;border-radius:0!important}
.tb-vorher{background:var(--muted);opacity:.45;top:4px!important;bottom:4px!important}
.tb-weg{background:repeating-linear-gradient(135deg,var(--rot) 0 3px,transparent 3px 6px);opacity:1}
.tb-nachher{background:var(--gruen)}
.tb-achse .tb-spur{background:none;height:16px}
.tb-offen{background:rgba(154,98,6,.35);top:0;height:5px}
.tb-uhr{position:absolute;top:2px;transform:translateX(-50%);font-size:.62rem;font-family:var(--mono);color:var(--muted)}
.tb-legende{display:flex;gap:12px;flex-wrap:wrap;font-size:.68rem;color:var(--muted);font-weight:600;padding-left:72px}
.tb-legende span{display:inline-flex;align-items:center;gap:5px}
.tb-legende i{display:inline-block;width:14px;height:8px;border-radius:2px;position:static}
.tb-legende i.tb-vorher,.tb-legende i.tb-luecke{top:auto!important;bottom:auto!important}
@media(max-width:560px){.tb-reihe{grid-template-columns:48px 1fr}.tb-legende{padding-left:0}}

/* Änderungen-Liste und Assistent */
.chat-weg{display:block;font-weight:500!important;color:var(--ink-2)!important;font-size:.74rem!important;margin-top:3px}
.chat-weg s{color:var(--muted)}
.aendern-status .btn .sym{width:16px;height:16px}

/* Personal: Liste mit „⋯“ und eigener Bearbeitungsseite */
.kopf-mit-knopf{display:flex;gap:16px;align-items:flex-start;justify-content:space-between}
.btn.rund{width:44px;height:44px;border-radius:50%;padding:0;font-size:1.5rem;font-weight:500;flex:none;box-shadow:var(--shadow)}
.personenliste{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.person{display:grid;grid-template-columns:minmax(160px,1.4fr) 110px minmax(0,2fr) 36px;gap:12px;align-items:center;
  padding:11px 12px 11px 16px;border-top:1px solid var(--line-2);cursor:pointer;background:var(--surface);position:relative}
.person:first-child{border-top:0}
.person:hover,.person:focus-visible{background:var(--ton-50)}
.person-name b{display:block;font-size:.92rem}
.person-name .hint{display:block}
.person-zahlen{display:flex;flex-direction:column;font-family:var(--mono);font-size:.8rem;text-align:right}
.person-funktionen{display:flex;flex-wrap:wrap;gap:2px}
.punkte{width:32px;height:32px;border-radius:8px;border:0;background:none;font-size:1.2rem;line-height:1;color:var(--muted);cursor:pointer;
  opacity:0;transition:opacity .1s}
.person:hover .punkte,.person:focus-within .punkte,.punkte:focus-visible{opacity:1}
.punkte:hover{background:var(--ton-100);color:var(--link)}
@media (hover:none){.punkte{opacity:1}}
@media(max-width:640px){.person{grid-template-columns:1fr auto 32px}.person-funktionen{display:none}}
.kontextmenue{position:fixed;z-index:95;min-width:170px;background:var(--surface);border:1px solid var(--line);border-radius:10px;
  box-shadow:var(--shadow-l);padding:5px;display:flex;flex-direction:column}
.kontextmenue button{border:0;background:none;text-align:left;padding:8px 12px;border-radius:7px;font:inherit;font-size:.86rem;font-weight:600;color:var(--ink);cursor:pointer}
.kontextmenue button:hover,.kontextmenue button:focus-visible{background:var(--ton-100);outline:none}
.kontextmenue button.gefahr{color:var(--rot)}
.kontextmenue button.gefahr:hover{background:var(--rot-soft)}
.personseite .actions{border-top:1px solid var(--line-2)}
/* Tagesbalken: oben dünn „vorher“, darunter kräftig „nachher“ — beide bleiben sichtbar */
.tb-spur{height:20px}
.tb-spur i.tb-vorher{top:2px!important;bottom:auto!important;height:5px;opacity:.55}
.tb-spur i.tb-weg{height:7px;top:2px!important}
.tb-spur i.tb-nachher{top:9px;bottom:2px}
.tb-spur i.tb-luecke{top:0!important;bottom:0!important}
.tb-achse .tb-spur{height:16px}
.aendern-oben{display:flex;flex-direction:column;gap:14px;margin-bottom:14px}
@media(min-width:1001px){.aendern-raster{grid-template-columns:minmax(0,1fr) 420px}}
@media(max-width:640px){
  .aendern-status{position:static;gap:6px}
  .aendern-status .spacer{display:none}
  .aendern-status .btn{padding:7px 10px;font-size:.8rem}
}

/* ======================================================================
   Gestaltung seit 16.11.2026: Leitstand als Rahmen, Aushang für den Plan.
   Links stehen immer alle Bereiche (Telefon: vier Reiter unten). Die Übersicht sagt
   zuerst, was zu erledigen ist und wer heute im Laden steht; darunter hängt der Plan
   so, wie er in der Filiale hängt. Rot heißt nur „zu tun“, Gelb ist der nächste Schritt.
   ====================================================================== */
body{--oben:calc(5px + var(--band,0px));--kopf:0px}
.markenband{position:sticky;top:0;z-index:76;height:5px;background:var(--marke)}
.testband{top:5px}
.seitenleiste,.tableiste{display:none}
.hauptspalte{min-width:0}
.wrap{max-width:1240px;padding:0 24px 64px}
.topbar-in{max-width:1240px;padding:10px 24px}
.brand .mark svg{stroke:#fff}

/* Knöpfe: Anthrazit trägt, Gelb ist je Seite der eine nächste Schritt */
.btn.haupt{background:var(--gelb);color:var(--auf-gelb);border-color:var(--gelb-rand);box-shadow:0 2px 0 var(--gelb-rand)}
.btn.haupt:hover{background:var(--gelb-hell);border-color:var(--gelb-rand)}
.btn.haupt:active{transform:translateY(2px);box-shadow:none}
.btn.haupt:disabled{box-shadow:none}
@media (pointer:coarse){.btn{min-height:44px}.btn.small{min-height:38px}}
.zahl{display:inline-block;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--zutun);color:#fff;
  font:700 .68rem/20px var(--sans);text-align:center;letter-spacing:0;flex:none}
.zahl.neu{background:var(--info);color:var(--surface)}

/* ---- Leiste links ---- */
@media(min-width:861px){
  body.mit-schale .schale{display:grid;grid-template-columns:232px minmax(0,1fr);align-items:start}
  body.mit-schale .topbar{display:none}
  body.mit-schale .zurueck-link.zur-start{display:none}
  body.mit-schale .layout{padding-top:26px}
  body.mit-schale .seitenleiste{display:flex;flex-direction:column;gap:1px;position:sticky;top:var(--oben);
    height:calc(100vh - var(--oben));overflow-y:auto;background:var(--leiste);color:var(--auf-leiste);padding:16px 10px 12px}
}
.sl-marke{display:flex;align-items:center;gap:10px;padding:2px 8px 16px}
.sl-marke .mark{width:34px;height:34px;border-radius:8px;background:var(--marke);color:#fff;display:grid;place-items:center;flex:none}
.sl-marke .mark .sym{width:19px;height:19px}
.sl-logo{height:34px;width:auto;max-width:92px;flex:none;border-radius:4px}
.sl-name{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.sl-name b{font-size:1.02rem;font-weight:800;letter-spacing:-.02em;color:#fff}
.sl-name span{font-size:.72rem;color:var(--leiste-leise);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sl-gruppe{white-space:nowrap;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:var(--leiste-leise);padding:16px 10px 5px}
.sl-punkt{display:flex;align-items:center;gap:10px;width:100%;min-height:38px;border:0;background:none;color:inherit;text-align:left;
  padding:7px 10px;border-radius:8px;font-weight:600;font-size:.88rem;cursor:pointer}
.sl-punkt .sym{width:18px;height:18px;opacity:.75;flex:none}
.sl-punkt > span:first-of-type{flex:1;min-width:0}
.sl-punkt:hover{background:rgba(255,255,255,.08)}
.sl-punkt[aria-current="page"]{background:rgba(255,255,255,.14);color:#fff;box-shadow:inset 3px 0 0 var(--gelb)}
.sl-punkt[aria-current="page"] .sym{opacity:1}
.sl-punkt:focus-visible,.sl-ab:focus-visible{outline-color:var(--gelb)}
.sl-fuss{margin-top:auto;padding:12px 10px 0;border-top:1px solid rgba(255,255,255,.12);display:flex;align-items:center;gap:8px;
  justify-content:space-between;font-size:.72rem;color:var(--leiste-leise);font-weight:600}
.sl-ab{border:0;background:none;color:var(--auf-leiste);font:inherit;font-weight:700;cursor:pointer;padding:6px 4px;border-radius:6px}
.sl-ab:hover{text-decoration:underline}

/* ---- Telefon: Kopfzeile oben, vier Reiter unten ---- */
@media(max-width:860px){
  body{--oben:5px;--kopf:53px}
  .testband{position:static}
  .wrap{padding:0 14px 64px}
  .topbar-in{padding:9px 14px;flex-wrap:nowrap}
  body.mit-schale #storeChip,body.mit-schale #abmelden{display:none}
  body.mit-schale .wrap{padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
  body.mit-schale .layout{padding-top:16px}
  body.mit-schale .tableiste{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:var(--surface);border-top:1px solid var(--line);padding:0 6px env(safe-area-inset-bottom,0px);
    box-shadow:0 -6px 18px -14px rgba(20,22,25,.5)}
  body.mit-schale .fassungshinweis{bottom:calc(72px + env(safe-area-inset-bottom,0px))}
}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;border:0;
  background:none;color:var(--muted);font-size:.68rem;font-weight:700;cursor:pointer;padding:6px 2px}
.tab .sym{width:23px;height:23px}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--gelb)}
.tab .zahl{position:absolute;top:4px;left:calc(50% + 11px);min-width:18px;height:18px;padding:0 5px;font-size:.64rem;line-height:18px;box-shadow:0 0 0 2px var(--surface)}

/* ---- „Mehr“ ---- */
.mehr-gruppe + .mehr-gruppe{margin-top:18px}
.mehr-titel{font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--muted);margin-bottom:6px}
.mehr-liste{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.mehr-zeile{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:10px 12px;border:0;border-top:1px solid var(--line-2);
  background:none;font:inherit;font-weight:700;font-size:.92rem;color:var(--ink);text-align:left;cursor:pointer}
.mehr-zeile:first-child{border-top:0}
.mehr-zeile:hover{background:var(--ton-50)}
.mehr-zeile > .sym:first-child{color:var(--muted)}
.mehr-zeile > span:first-of-type{flex:1}
.mehr-pfeil{width:16px;height:16px;color:var(--muted)}
.mehr-konto{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:20px;padding-top:14px;border-top:1px solid var(--line)}
.mehr-konto > span{display:flex;flex-direction:column}

/* ---- Übersicht ---- */
.start{display:flex;flex-direction:column;gap:16px}
.startkopf{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.startkopf h1{margin-top:3px}
.startkopf .lede{margin-top:3px}
.startkopf-knoepfe{display:flex;gap:10px;flex-wrap:wrap}
.startraster{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:1020px){.startraster{grid-template-columns:1fr}}
@media(max-width:860px){
  .start:not(.wochenplan) > .plankarte{display:none}
  .wochenplan .startkopf .eyebrow,.wochenplan .startkopf .lede{display:none}
  .startkopf-knoepfe{width:100%}
  .startkopf-knoepfe .btn{flex:1;padding-left:10px;padding-right:10px;white-space:nowrap}
}
.karte{border-radius:var(--r);box-shadow:none}
.karte-kopf h2{font-size:1.08rem}
.zutun .karte-kopf,.heute .karte-kopf{margin-bottom:8px;justify-content:space-between}
.zt-liste,.ht-liste{display:flex;flex-direction:column}
.zt-zeile{display:flex;align-items:center;gap:11px;width:100%;min-height:52px;padding:9px 2px;border:0;border-top:1px solid var(--line-2);
  background:none;font:inherit;color:var(--ink);text-align:left;cursor:pointer}
.zt-liste > .zt-zeile:first-child{border-top:0}
.zt-zeile:hover .zt-tun{text-decoration:underline}
.zt-punkt{width:10px;height:10px;border-radius:50%;background:var(--zutun);flex:none}
.zt-zeile.neu .zt-punkt{background:none;box-shadow:inset 0 0 0 2.5px var(--info)}
.zt-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.zt-text b{font-size:.9rem;font-weight:700;line-height:1.3}
.zt-text span{font-size:.74rem;color:var(--muted);font-weight:600}
.zt-tun{display:inline-flex;align-items:center;gap:2px;font-size:.82rem;font-weight:700;color:var(--link);flex:none}
.zt-tun .sym{width:15px;height:15px}
.zt-rest{border-top:1px solid var(--line-2);padding-top:8px}
.zt-rest summary{cursor:pointer;font-size:.82rem;font-weight:700;color:var(--muted);padding:4px 0}
.zt-leer{display:flex;align-items:center;gap:8px;padding:12px 0 6px;color:var(--muted);font-weight:600;font-size:.9rem}
.zt-leer .sym{color:var(--good)}
.ht-zeile{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:8px 2px;border-top:1px solid var(--line-2)}
.ht-liste > .ht-zeile:first-child{border-top:0}
.ht-punkt{width:10px;height:10px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--ton-500);grid-row:1/3}
.ht-zeile.da .ht-punkt{background:var(--good);box-shadow:none}
.ht-zeile.pause .ht-punkt{box-shadow:inset 0 0 0 2.5px var(--good)}
.ht-zeile.weg .ht-punkt{background:var(--ton-200);box-shadow:none}
.ht-zeile.fehlt .ht-punkt{background:var(--zutun);box-shadow:none}
.ht-name{display:flex;align-items:baseline;gap:8px;min-width:0}
.ht-name b{font-size:.9rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ht-name span{font-size:.72rem;color:var(--muted);font-weight:600;white-space:nowrap}
.ht-zeit{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.82rem;font-weight:600;text-align:right}
.ht-lage{grid-column:2/4;font-size:.76rem;color:var(--muted);font-weight:600}
.ht-zeile.da .ht-lage,.ht-zeile.pause .ht-lage{color:var(--good)}
.ht-zeile.weg{opacity:.62}
.ht-zeile.fehlt .ht-lage{color:var(--rot);font-weight:700}
.ht-zeile.klickbar{cursor:pointer}
.ht-naechstes{margin-top:8px;padding-top:9px;border-top:1px solid var(--line);font-size:.84rem;color:var(--ink-2)}
.ausfalldialog h2{margin-bottom:4px}
.ausfalldialog .ereignisform{border:0;background:none;padding:0;margin:12px 0 0}
.note .knopfreihe{display:flex}

/* ---- Der Plan als Aushang: Papier, dunkle Linien, Zeiten in Festbreite ---- */
.planbox{background:var(--papier);border:1.5px solid var(--formlinie);border-radius:3px}
table.plan th,table.plan td{border-color:var(--formlinie-2)}
table.plan thead th{background:var(--papier-2);border-bottom:1.5px solid var(--formlinie)}
table.plan .zeilenkopf,table.plan td.std,table.plan td.stunden{background:var(--papier-2)}
table.plan tr.aufgabenzeile td{background:none}
table.plan tr.ma-oben > *{border-top:1.5px solid var(--formlinie)}
table.plan tr.summe td,table.plan tr.summe th{background:var(--papier-2);border-top:1.5px solid var(--formlinie)}
table.plan tr > :first-child{border-left:0} table.plan tr > :last-child{border-right:0}
table.plan thead tr:first-child > *{border-top:0} table.plan tbody tr:last-child > *{border-bottom:0}
table.kompakt th,table.kompakt td{border-color:var(--formlinie-2)}
table.kompakt thead th{background:var(--papier-2);border-bottom:1.5px solid var(--formlinie)}
table.kompakt tr.k-person > *{border-top:1px solid var(--formlinie)}
table.kompakt tr > :last-child{border-right:0} table.kompakt tbody tr:last-child > *{border-bottom:0}
tr.k-summe th,tr.k-summe td{background:var(--papier-2)}
tr.k-person:hover td,tr.k-person:hover th{background:var(--papier-2)}
.messlatte{background:none;border-radius:0;border-top:1px solid var(--line);padding:10px 0 0;margin-top:12px}
.aendern-status .spacer{margin-left:auto}

/* ---- Dashboard (16.11.2026): zu erledigen und die Vorfälle der Woche in einer Karte ---- */
.dashboard{display:flex;flex-direction:column;gap:14px}
.db-teil + .db-teil{border-top:1px solid var(--line);padding-top:14px}
.db-teil .karte-kopf{margin-bottom:6px;justify-content:space-between}
.vf-liste{display:flex;flex-direction:column}
.vf-zeile{display:grid;grid-template-columns:104px minmax(0,1fr);gap:10px;align-items:baseline;padding:7px 2px;border-top:1px solid var(--line-2);font-size:.88rem;font-weight:600}
.vf-liste > .vf-zeile:first-child{border-top:0}
.vf-art{font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
@media(max-width:480px){.vf-zeile{grid-template-columns:1fr;gap:1px}}
/* Mittlere Breiten: die kompakte Fassung trennt Wörter an Silben statt mitten im Wort */
table.kompakt th,table.kompakt td{overflow-wrap:break-word;hyphens:auto;-webkit-hyphens:auto}
@container (min-width:481px){ tr.k-zusatz td{font-size:.72rem} }
.planbox{overflow-x:auto}

/* ---- Tagesanalyse (16.11.2026): Zeitleisten je Aufgabe und je Person ----
   Farbe je Art (Kasse, Ware, Bestellen, Aufbau/Backen/Abend), der Name steht im Balken. */
.t-kasse{--t:var(--t-kasse)} .t-ware{--t:var(--t-ware)} .t-bestell{--t:var(--t-bestell)} .t-sonst{--t:var(--t-sonst)} .t-laden{--t:var(--ton-500)}
.t-aufbau{--t:var(--t-aufbau)} .t-backen{--t:var(--t-backen)} .t-abend{--t:var(--t-abend)}
.t-kasse,.t-ware,.t-bestell,.t-sonst,.t-aufbau,.t-backen,.t-abend{background:var(--t)}
.t-laden{background:var(--ton-200)}
.t-pause{background:repeating-linear-gradient(135deg,var(--ton-200) 0 3px,transparent 3px 6px)}
.tagesanalyse{display:flex;flex-direction:column;gap:14px}
.ta-kopf{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.ta-wahl{display:inline-flex;border:1.5px solid var(--ton-200);border-radius:var(--r-s);overflow:hidden}
.ta-plan{display:flex;flex-direction:column;align-items:flex-start;gap:0;min-width:150px;padding:7px 14px;border:0;background:var(--surface);
  font:inherit;color:var(--ink);cursor:pointer;text-align:left}
.ta-plan + .ta-plan{border-left:1.5px solid var(--ton-200)}
.ta-plan b{font-size:.88rem} .ta-plan span{font-size:.72rem;color:var(--muted);font-weight:600}
.ta-plan[aria-pressed="true"]{background:var(--voll);color:var(--auf-voll)}
.ta-plan[aria-pressed="true"] span{color:inherit;opacity:.75}
.ta-kennzahl{display:flex;gap:18px;flex-wrap:wrap;font-size:.86rem;color:var(--ink-2);font-weight:600}
.ta-kennzahl b{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.ta-hinweise{display:flex;flex-direction:column;gap:6px}
.ta-tage{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.ta-tag{display:grid;grid-template-columns:auto 1fr;gap:1px 6px;align-items:baseline;padding:9px 11px;border:1.5px solid var(--line);border-radius:var(--r);
  background:var(--surface);font:inherit;color:var(--ink);text-align:left;cursor:pointer;min-height:68px}
.ta-tag b{font-size:.95rem} .ta-datum{font-size:.76rem;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.ta-tag .ta-stapel{grid-column:1/-1;display:flex;gap:1px;height:8px;margin:5px 0 3px}
.ta-stapel i{display:block;height:100%;border-radius:2px;min-width:2px}
.ta-tag .ta-summe{grid-column:1/-1;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.78rem;font-weight:700}
.ta-tag:hover:not(:disabled){border-color:var(--ton-500)}
.ta-tag[aria-selected="true"]{border-color:var(--voll);box-shadow:inset 0 -4px 0 var(--gelb)}
.ta-tag:disabled{cursor:default;color:var(--muted);background:var(--surface-2)}
.ta-tagkopf h3{font-size:1.15rem}
.ta-tagkopf p{display:flex;gap:4px 14px;flex-wrap:wrap;align-items:center;margin-top:4px;font-size:.84rem;color:var(--ink-2);font-weight:600}
.ta-teil{display:inline-flex;align-items:center;gap:6px}
.ta-teil i{width:12px;height:12px;border-radius:3px;flex:none}
.ta-block{display:flex;flex-direction:column;gap:8px}
.ta-titel{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;font-size:1rem;margin-top:6px}
.ta-titel span{font-size:.76rem;font-weight:600;color:var(--muted)}
.ta-leiste{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:var(--r);padding:10px 14px 12px;background:var(--surface)}
.ta-reihe{display:grid;grid-template-columns:190px minmax(0,1fr) 128px;gap:12px;align-items:center}
.ta-name{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.ta-name b{font-size:.86rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ta-name span{font-size:.68rem;color:var(--muted);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ta-spur{position:relative;display:block;height:30px;background:var(--line-2);border-radius:5px}
.ta-spur > i{position:absolute;top:0;bottom:0}
.ta-zu{background:var(--surface);opacity:.62}
.ta-linie{width:1px;background:var(--surface);opacity:.9}
.ta-fenster{border:1.5px dashed var(--ton-500);border-radius:5px;background:none}
/* Balken: getönte Fläche, kräftiger Rand links, der Name in normaler Schrift — lesbar in hell und dunkel */
.ta-seg{display:flex;align-items:center;overflow:hidden;border-radius:4px;font-style:normal;
  background:color-mix(in srgb,var(--t) 26%,var(--surface));box-shadow:inset 3px 0 0 var(--t),inset -1.5px 0 0 var(--surface)}
.ta-seg span{padding:0 5px 0 8px;font-size:.72rem;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ta-seg.t-laden{background:var(--ton-100);box-shadow:inset -1.5px 0 0 var(--surface)}
.ta-seg.t-pause{background:repeating-linear-gradient(135deg,var(--ton-200) 0 3px,transparent 3px 6px);box-shadow:none}
.ta-seg.t-pause span,.ta-seg.t-laden span{color:var(--muted);font-weight:600}
.ta-seg.ta-fehlt{box-shadow:inset 3px 0 0 var(--zutun),inset 0 0 0 1.5px var(--zutun)}
.ta-zeit{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.78rem;font-weight:600;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ta-zeit span{display:block;font-family:var(--sans);font-size:.7rem;color:var(--muted);font-weight:600;overflow:hidden;text-overflow:ellipsis}
.ta-besetzung{align-items:end;margin:2px 0 6px}
.ta-besetzung .ta-spur{height:70px;background:none;border-bottom:1.5px solid var(--line);border-radius:0}
.ta-saeulen{position:absolute;inset:0;display:flex;align-items:flex-end}
.ta-saeule{position:relative;flex:1;height:100%;display:flex;flex-direction:column-reverse;gap:1px;min-width:0}
.ta-saeule i{display:block;width:100%}
.ta-saeule u{position:absolute;left:0;right:0;height:2px;margin-bottom:-1px;background:var(--ink);text-decoration:none}
.ta-saeule u.knapp{background:var(--zutun);height:3px}
.ta-saeule:hover{outline:1.5px solid var(--ink);outline-offset:-1px;z-index:1}
.ta-achse .ta-spur{height:16px;background:none}
.ta-uhr{position:absolute;top:1px;transform:translateX(-50%);font-family:var(--mono);font-size:.68rem;color:var(--muted)}
.ta-gruende{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(max-width:900px){.ta-gruende{grid-template-columns:1fr}}
.ta-grund{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--surface)}
.ta-grundkopf{display:flex;justify-content:space-between;gap:2px 10px;align-items:baseline;margin-bottom:4px;flex-wrap:wrap}
.ta-grundkopf b{font-size:.9rem}
.ta-grundkopf span{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.76rem;color:var(--muted)}
.ta-grund{min-width:0}
.ta-grund p{font-size:.82rem;line-height:1.45;color:var(--ink-2);font-weight:500}
.ta-grund p + p{margin-top:3px}
.ta-grund .note{margin-top:8px;font-size:.8rem}
@media(max-width:1100px){.ta-reihe{grid-template-columns:150px minmax(0,1fr) 108px}}
@media(max-width:640px){
  .ta-tage{grid-template-columns:repeat(3,minmax(0,1fr))}
  .ta-reihe{grid-template-columns:1fr;gap:2px}
  .ta-reihe > .ta-zeit{display:none}
  .ta-name{flex-direction:row;gap:8px;align-items:baseline}
  .ta-achse .ta-name,.ta-besetzung .ta-name span{display:none}
  .ta-leiste{padding:8px 8px 10px;gap:8px}
  .ta-plan{min-width:0;flex:1}
  .ta-wahl{display:flex;width:100%}
}

/* ---- Assistent: Antwortknöpfe unter einer Rückfrage ---- */
.chat-knoepfe{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chat-knoepfe .btn{border-radius:999px;padding:6px 12px}
.chat{max-height:460px}

/* ---- Planentwurf (16.11.2026): Vertragsstunden bewusst auffüllen ---- */
.pe-liste{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.pe-liste > .zt-leer{grid-column:1/-1}
.pe-person{padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.pe-kopf{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.pe-kopf > b{font-size:.92rem}
.pe-kopf span{font-size:.78rem;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.pe-kopf span b{color:var(--ink)}
.pe-vorschlaege{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.pe-vorschlag{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;width:100%;text-align:left;padding:9px 11px;
  border:1.5px solid var(--line);border-radius:var(--r-s);background:var(--surface-2);font:inherit;color:var(--ink);cursor:pointer}
.pe-vorschlag:hover{border-color:var(--ton-500);background:var(--surface)}
.pe-was{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pe-was b{font-size:.86rem}
.pe-grund{grid-column:1;font-size:.76rem;color:var(--muted);font-weight:600;line-height:1.35}
.pe-tun{grid-column:2;grid-row:1/3;font-size:.8rem;font-weight:700;color:var(--link);white-space:nowrap}
.pe-dazu{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.pe-zeile{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;font-size:.84rem;font-weight:600}
.planentwurf .aendern-status{flex-wrap:wrap}

/* ---- Assistent (neu gestaltet 16.11.2026): Feld oben, darunter die letzte Antwort ---- */
.assistent h3{margin-bottom:10px}
.assistent .chat-eingabe{margin-top:0}
.assistent .chat-eingabe input{min-height:44px}
.assistent .chat-eingabe .btn{min-width:46px}
.as-antwort:empty{display:none}
.as-antwort{margin-top:14px}
.as-paar{display:flex;flex-direction:column;gap:2px}
.as-frage{font-size:.76rem;font-weight:700;color:var(--muted)}
.as-frage::before{content:"› "}
.as-text{font-size:.88rem;line-height:1.5;color:var(--ink);margin-bottom:2px}
.as-verlauf{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.as-verlauf summary{cursor:pointer;font-size:.8rem;font-weight:700;color:var(--muted)}
.as-verlauf .as-paar{margin-top:12px;padding-top:12px;border-top:1px solid var(--line-2)}
.as-verlauf .as-paar:first-of-type{border-top:0;padding-top:0}
.as-verlauf .as-text{color:var(--ink-2)}

/* ---- Leistungswirksame Stunden, Aushilfen im Monat, Azubis im Entwurf (16.11.2026) ---- */
table.plan tr.summe.wirksam td,table.plan tr.summe.wirksam th{border-top:1px solid var(--formlinie-2);font-weight:600;color:var(--ink-2)}
tr.k-summe.k-wirksam th,tr.k-summe.k-wirksam td{font-weight:600;color:var(--ink-2)}
tr.k-summe.k-wirksam th{font-family:var(--sans)}
.pe-azubi{display:flex;align-items:center;gap:6px;margin-top:12px}
.pe-azubi .sym{width:16px;height:16px;color:var(--good)}
.pe-aushilfen{margin-top:16px;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.pe-person.knapp{border-color:var(--warn)}
.pe-person .note{margin-top:8px;font-size:.8rem}
.aus-stand{font-size:.86rem;color:var(--ink-2);margin-bottom:6px}
.aushilfe.ohne-kopf{margin-top:6px}
/* Aushilfen haben kein Konto: am Telefon bleibt die Spalte bei ihnen leer (der Monatsstand steht breit und in der Analyse) */
@container (max-width:480px){ td.k-konto b.k-voll{display:none} }

/* ==== Gesamtoptimierung (17.11.2026) ==================================================== */
/* ---- Lange Schichten: eine Ausnahme, kein Fehler — Bernstein statt Rot ---- */
.karte.lang{border-color:var(--warn);background:linear-gradient(var(--warn-soft),var(--warn-soft)) top/100% 4px no-repeat,var(--surface)}
.karte.lang h3{color:var(--warn)}
.karte.lang .hint{margin-top:8px}
.tag.lang{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
/* ---- Plan ändern am Handy: erst der Assistent, dann die Lösungen, dann der Plan ---- */
.aendern-plan{margin-bottom:14px}
.aendern-oben:empty{display:none}
@media(max-width:860px){
  .panel.aendern:not(.planentwurf){display:flex;flex-direction:column}
  .panel.aendern:not(.planentwurf) > .aendern-raster{order:1;margin-bottom:14px}
  .panel.aendern:not(.planentwurf) > .aendern-plan{order:2;margin-bottom:0}
  .panel.aendern:not(.planentwurf) .aendern-seite{order:-1}
}
/* ---- Zahlfelder: Text mit Dezimaltastatur, Rückmeldung darunter ---- */
input.zahl-ein{font-family:var(--mono);font-variant-numeric:tabular-nums}
input[aria-invalid="true"]{border-color:var(--bad);box-shadow:0 0 0 3px var(--bad-soft)}
.zahl-echo{display:block;margin-top:4px;font-size:.74rem;font-weight:600;color:var(--muted);font-family:var(--mono)}
.zahl-echo.fehler{color:var(--bad);font-family:var(--sans)}
.zahl-echo[hidden]{display:none}
/* ---- Anmeldung: zwei Reiter; Wiederherstellungscode ---- */
.an-reiter{display:inline-flex;border:1.5px solid var(--ton-200);border-radius:var(--r-s);overflow:hidden;margin-bottom:16px}
.an-reiter button{appearance:none;border:0;background:var(--surface);color:var(--ink-2);font:inherit;font-weight:700;font-size:.88rem;padding:9px 18px;cursor:pointer;min-height:40px}
.an-reiter button + button{border-left:1.5px solid var(--ton-200)}
.an-reiter button[aria-selected="true"]{background:var(--voll);color:var(--auf-voll)}
.an-reiter button:focus-visible{outline:2px solid var(--info);outline-offset:-2px}
.wh-code{font-family:var(--mono);font-size:1.5rem;font-weight:700;letter-spacing:.06em;text-align:center;padding:16px 10px;margin:14px 0;
  border:1.5px solid var(--ton-300, var(--line));border-radius:var(--r);background:var(--surface-2);user-select:all;-webkit-user-select:all;overflow-wrap:anywhere}
.wh .note{font-size:.82rem}
.wh-kachel{margin-top:18px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.wh-kachel h3{margin:2px 0 4px}
.wh-kachel .btn{margin-top:10px}
@media(max-width:480px){.wh-code{font-size:1.15rem;letter-spacing:.02em}.an-reiter{display:flex}.an-reiter button{flex:1}}
/* ---- Stundenkonto im Personal: Stand zum Lesen, Ändern nur über den Dialog ---- */
.konto-feld{display:flex;flex-direction:column;gap:4px;font-size:.76rem;font-weight:700;color:var(--muted);letter-spacing:.01em}
.konto-stand{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.konto-stand b{font-size:1.05rem;color:var(--ink)}
.konto-feld .hint{font-weight:500}
.konto-gross{display:flex;align-items:baseline;gap:10px;margin:10px 0 6px}
.konto-gross b{font-size:1.7rem;line-height:1}
.konto-gross span{font-size:.82rem;color:var(--muted);font-weight:600}
.konto-verlauf{margin-top:16px;padding-top:12px;border-top:1px solid var(--line-2)}
.konto-zeile{display:grid;grid-template-columns:96px 1fr auto;gap:10px;font-size:.82rem;padding:5px 0;border-top:1px solid var(--line-2)}
.konto-zeile:first-of-type{border-top:0}
/* ---- Die eine Abwesenheitsliste: je Person, was eingetragen ist und woher es stammt ---- */
.abw-liste{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:4px 14px;margin-bottom:10px}
.abw-kopf{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0 4px}
.abw-zahl{font-size:.76rem;color:var(--muted);font-weight:600}
.abw-liste .zt-leer{padding:10px 0}
.abw-zeile{display:grid;grid-template-columns:minmax(120px,220px) minmax(0,1fr) auto;gap:4px 12px;align-items:baseline;padding:9px 0;border-top:1px solid var(--line-2);font-size:.86rem}
.abw-liste > .abw-zeile:first-child,.abw-kopf + .abw-zeile{border-top:0}
.abw-was{color:var(--ink-2);font-variant-numeric:tabular-nums}
.abw-herkunft{font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);background:var(--surface-2);white-space:nowrap}
.abw-herkunft.hand{color:var(--muted);background:transparent}
.abw-zeile.abweichung{background:linear-gradient(var(--warn-soft),var(--warn-soft));margin:0 -14px;padding-left:14px;padding-right:14px}
.abw-widerspruch{grid-column:1/-1;display:flex;gap:8px 12px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:.8rem;color:var(--warn);font-weight:600}
.abw-widerspruch .knopfreihe{margin:0}
@media(max-width:560px){.abw-zeile{grid-template-columns:minmax(0,1fr) auto}.abw-zeile b{grid-column:1/-1}}
/* Herkunft an der Zelle der Eingabetabelle */
td.abwzelle[data-herkunft]::after{content:attr(data-herkunft);display:block;margin-top:3px;font-size:.66rem;font-weight:700;color:var(--muted);letter-spacing:.01em}
/* ---- Wochenaufgaben: eine Zeile je Aufgabe, Antippen öffnet die Einstellungen ---- */
.task{padding:0;overflow:hidden}
.task + .task{margin-top:6px}
.task-h{margin:0;font-size:1rem}
.task-kopf{display:grid;grid-template-columns:minmax(120px,240px) minmax(0,1fr) auto;gap:4px 14px;align-items:center;width:100%;
  padding:11px 12px 11px 16px;background:none;border:0;font:inherit;text-align:left;color:inherit;cursor:pointer;min-height:48px}
.task-kopf:hover{background:var(--ton-100)}
.task-kopf:focus-visible{outline:2px solid var(--info);outline-offset:-2px}
.task-name{font-weight:700;font-size:.95rem}
.task-info{font-size:.82rem;font-weight:500;color:var(--ink-2);font-variant-numeric:tabular-nums}
.task-fehlt{color:var(--warn);font-weight:700}
.task-leise{color:var(--muted)}
.task.off .task-info{color:var(--muted)}
.task-pfeil{display:flex;color:var(--muted);transition:transform .15s}
.task-pfeil .sym{width:18px;height:18px}
.task:not(.zu) .task-pfeil{transform:rotate(90deg)}
.task .body{padding:4px 16px 14px;border-top:1px solid var(--line)}
.task.zu .body{display:none}
.task .body > .schalter{margin-top:10px}
.task.fehlt{border-color:var(--warn)}
.mehr-dazu{margin-top:8px;font-size:.86rem;color:var(--ink-2)}
.mehr-dazu summary{cursor:pointer;font-weight:700;color:var(--link)}
.mehr-dazu p{margin-top:6px;line-height:1.5;max-width:70ch}
@media(max-width:640px){
  .task-kopf{grid-template-columns:minmax(0,1fr) auto;padding-left:14px}
  .task-info{grid-column:1;grid-row:2}
  .task-pfeil{grid-column:2;grid-row:1 / span 2}
}
/* ---- Kompakter Plan: Beginn und Ende stehen immer untereinander. Nebeneinander passten sie
   erst ab rund 910 px in eine Tagesspalte — so breit wird diese Ansicht nie (über 860 px steht das
   Filialformular), die Zeiten liefen deshalb ineinander. ---- */
table.kompakt .k-zeit{flex-direction:column;gap:0;line-height:1.25}
table.kompakt .k-zeit b:first-child::after{content:none}
/* Summen und Konto brechen nicht mitten in der Zahl um („240,“ / „0“) */
td.k-std b,td.k-konto b,tr.k-summe td{white-space:nowrap;overflow-wrap:normal;hyphens:none;-webkit-hyphens:none}
@container (max-width:480px){
  table.kompakt col.c-name{width:16%} table.kompakt col.c-std{width:10.5%} table.kompakt col.c-konto{width:9.5%}
}
/* ---- Fußzeile ---- */
.foot:empty{display:none}
/* ---- Eingabetabelle der Abwesenheiten: alle sechs Tage passen auch in ein schmaleres Fenster ---- */
.abwfeld{min-width:96px}
.abwfeld select{padding:6px 6px;font-size:.84rem}
.abwzeiten{flex-wrap:wrap}
.abwzeiten input{flex:1 1 84px;min-width:0}
table.abwtabelle td:first-child{min-width:104px}
/* Rückmeldung unter einem Zahlfeld verschiebt die Nachbarfelder nicht */
.task-fields{align-items:start}
