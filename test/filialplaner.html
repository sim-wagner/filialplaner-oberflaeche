// ==== app/36-tagesanalyse.js ====
/* Tagesanalyse in der Analyse: ein Tag des Plans auf einen Blick (neu gebaut am 17.11.2026).

   Zur Wahl stehen die zwei Pläne, mit denen gerade gearbeitet wird — der der laufenden und der
   der nächsten Woche; oben wählt man den Tag. Gezeigt wird:
     1. Tagesbesetzung — je Person eine Zeile, der Balken ist ihre Schicht. Die Farben zeigen,
        was sie wann macht; Zeit ohne feste Aufgabe ist „Zusatzaufgaben / Puffer“, die Pause ist
        schraffiert. Schrift steht nur bei Ware im Balken (die Art als Kürzel) — antippen zeigt,
        was es ist. Dieselbe Grafik zeigt die Tagesansicht des Plans (besetzungsGrafik).
     2. Hinweise des Planers zu diesem Tag.
     3. Rolle für die Besetzung — je Person eine Zeile; aufgeklappt steht, was sie übernimmt.
   Gerechnet wird in kern/18-tagesanalyse.js. */

let analyseWoche = null;   // Wochenschlüssel der betrachteten Woche
let analyseTag = null;     // Tag (0 = Mo) der betrachteten Woche

// Die Farben der Tagesbesetzung in fester Reihenfolge — so stehen sie auch in der Legende
const BESETZUNG_ARTEN = TAETIGKEITEN.map(t => [t.id, t.name]).concat([["pause", "Pause"]]);

// Ausgeschrieben, was die Kürzel der Ware heißen
const WARE_LANG = {"Tr": "Trockenware", "KW": "Kühlware", "TK": "Tiefkühlware", "O&G": "Obst und Gemüse", "FF": "Frischfleisch"};

// Die Personen eines Tages, nach Beginn — wer geteilt arbeitet, hat zwei Schichten in einer Zeile
function besetzungsPersonen(e){
  const personen = [];
  e.reihen.forEach(r => { let p = personen.find(y => y.name === r.name); if (!p) personen.push(p = {name: r.name, reihen: []}); p.reihen.push(r); });
  return personen.sort((a, b) => a.reihen[0].schicht.von - b.reihen[0].schicht.von || a.name.localeCompare(b.name));
}

/* Die Tagesbesetzung als Grafik — in der Analyse und in der Tagesansicht des Plans.
   Je Person eine Zeile, der Balken ist ihre Schicht; die Farben zeigen, was sie wann macht.
   Ware trägt die Art als Kürzel (Tr, KW, TK, O&G, FF), sonst steht keine Schrift im Balken —
   antippen zeigt, was es ist. Die Zeitachse reicht für die ganze Woche (ab 5 Uhr oder früher),
   so bleibt sie beim Wechsel des Tages stehen.
   o.mitZeiten: die Uhrzeiten auch am Telefon neben dem Namen zeigen (Tagesansicht). */
function besetzungsGrafik(plan, ti, e, o){
  o = o || {};
  const vor = name => name.split(/\s+/)[0];
  const alle = plan.tage.filter(t => !t.feiertag).reduce((l, t) => l.concat(t.schichten), []);
  const von = Math.floor(Math.min(5 * 60, ...alle.map(s => s.von), e.von) / 60) * 60;
  const bis = Math.max(...alle.map(s => s.bis), e.offenBis);
  const dauer = bis - von;
  const x = m => ((m - von) / dauer * 100).toFixed(3) + "%";
  const breite = (a, b) => ((b - a) / dauer * 100).toFixed(3) + "%";
  const stunden = [];
  for (let m = von; m <= bis; m += 60) stunden.push(m);
  const linien = stunden.map(m => `<i class="bz-linie" style="left:${x(m)}"></i>`).join("");
  const achse = `<div class="bz-reihe bz-achse" aria-hidden="true"><span class="bz-name">Uhr</span><span class="bz-spur">${stunden.map((m, n) =>
    `<span class="bz-uhr${n % 2 ? " u2" : ""}" style="left:${x(m)}">${m / 60}</span>`).join("")}
    <i class="bz-offen" style="left:${x(e.offenVon)};width:${breite(e.offenVon, e.offenBis)}"></i></span></div>`;
  const personen = besetzungsPersonen(e);
  const kurzName = n => personen.filter(p => vor(p.name) === vor(n)).length > 1 ? n : vor(n);
  const artName = id => (BESETZUNG_ARTEN.find(a => a[0] === id) || [, id])[1];
  const zeilen = personen.map(p => `<div class="bz-reihe"><span class="bz-name" title="${esc(p.name)}"><b>${esc(kurzName(p.name))}</b>
      <span>${p.reihen.map(r => hhmm(r.schicht.von) + "–" + hhmm(r.schicht.bis)).join(" + ")}</span></span>
    <span class="bz-spur">${linien}${p.reihen.map(r => {
      const lang = r.schicht.bis - r.schicht.von;
      return `<span class="bz-balken" style="left:${x(r.schicht.von)};width:${breite(r.schicht.von, r.schicht.bis)}">${r.segmente.map(s => {
        const text = `${p.name} · ${s.aufgabe || artName(s.art)} · ${hhmm(s.von)}–${hhmm(s.bis)}`;
        return `<i class="bz-seg t-${s.art}" style="left:${((s.von - r.schicht.von) / lang * 100).toFixed(3)}%;width:${((s.bis - s.von) / lang * 100).toFixed(3)}%"
          data-info="${esc(text)}" title="${esc(text)}">${s.marke ? `<b>${esc(s.marke)}</b>` : ""}</i>`; }).join("")}</span>`; }).join("")}</span></div>`).join("");
  const vorhanden = new Set(e.reihen.reduce((l, r) => l.concat(r.segmente.map(s => s.art)), []));
  const kuerzel = Object.keys(WARE_LANG).filter(k => e.reihen.some(r => r.segmente.some(s => s.marke === k)));
  const legende = BESETZUNG_ARTEN.filter(([id]) => vorhanden.has(id)).map(([id, name]) =>
    `<span><i class="t-${id}"></i>${esc(name)}</span>`).join("") + `<span><i class="bz-offen-muster"></i>geöffnet</span>`;
  const box = el(`<div class="bz-block"><div class="bz-legende">${legende}</div>
    ${kuerzel.length ? `<p class="bz-kuerzel">Ware: ${kuerzel.map(k => `<b>${esc(k)}</b> ${esc(WARE_LANG[k])}`).join(" · ")}</p>` : ""}
    <div class="bz${o.mitZeiten ? " mit-zeiten" : ""}" role="group" aria-label="Tagesbesetzung ${esc(TAGNAMEN[plan.tage[ti].key])}">${achse}${zeilen}</div>
    <p class="bz-detail" aria-live="polite" hidden></p></div>`);
  const detail = box.querySelector(".bz-detail");
  box.querySelector(".bz").onclick = ev => {
    const seg = ev.target.closest && ev.target.closest("[data-info]");
    box.querySelectorAll(".bz-seg.gewaehlt").forEach(s => s.classList.remove("gewaehlt"));
    if (!seg){ detail.hidden = true; return; }
    seg.classList.add("gewaehlt");
    detail.textContent = seg.dataset.info; detail.hidden = false;
  };
  // Kürzel nur zeigen, wo sie ganz hineinpassen — auch nach dem Drehen des Telefons
  const passt = () => box.querySelectorAll(".bz-seg b").forEach(b => { b.hidden = false; b.hidden = b.scrollWidth > b.clientWidth + 0.5; });
  requestAnimationFrame(passt);
  if (window.ResizeObserver) new ResizeObserver(() => requestAnimationFrame(passt)).observe(box);
  return box;
}

// beiWochenwechsel: wird aufgerufen, wenn oben eine andere Woche gewählt wird (Overall Analyse)
function tagesAnalyse(beiWochenwechsel){
  const box = el(`<div class="tagesanalyse"></div>`);
  const plaene = state.plaene || {};
  const diese = wochenSchluessel(aktuellerMontag()), naechste = folgeSchluessel(diese);
  const wahl = [[diese, "Diese Woche"], [naechste, "Nächste Woche"]].filter(([sl]) => plaene[sl]);
  if (!wahl.length){
    box.appendChild(el(`<p class="empty">Für diese und die nächste Woche gibt es noch keinen Plan.</p>`));
    return box;
  }
  if (!wahl.some(([sl]) => sl === analyseWoche)){ analyseWoche = wahl[0][0]; analyseTag = null; }

  const zeichnen = () => {
    box.innerHTML = "";
    const kurz = plaene[analyseWoche], plan = planLaden(kurz);
    if (analyseTag === null || !plan.tage[analyseTag] || plan.tage[analyseTag].feiertag){
      // heute, wenn es die laufende Woche ist — sonst der erste offene Tag
      const heute = (new Date().getDay() + 6) % 7;
      analyseTag = analyseWoche === wochenSchluessel(montagDer(null)) && plan.tage[heute] && !plan.tage[heute].feiertag
        ? heute : Math.max(0, plan.tage.findIndex(t => !t.feiertag));
    }
    const hinweis = m => `<div class="note ${m.art}"><span class="ic">${m.art === "bad" ? "×" : m.art === "ok" ? "✓" : "!"}</span><span>${esc(m.text)}</span></div>`;
    // Hinweise des Planers: zum Tag, wenn sie mit ihm beginnen oder ihn nennen — sonst zur Woche
    const tagVon = m => plan.tage.findIndex(t => m.text.startsWith(t.label + " ") || m.text.startsWith(t.label + ",") || m.text.startsWith(t.label + ":")
      || m.text.includes(TAGNAMEN[t.key]));
    const meldungen = hinweiseOhneStunden(plan.meldungen || []);

    // ---- Welcher Plan ----
    const kopf = el(`<div class="ta-kopf"><div class="ta-wahl" role="group" aria-label="Plan wählen">${wahl.map(([sl, name]) =>
      `<button class="ta-plan" type="button" data-sl="${sl}" aria-pressed="${sl === analyseWoche}"><b>${name}</b><span>KW ${kwVon(montagAusSchluessel(sl))}</span></button>`).join("")}</div>
      <div class="ta-kennzahl"><span>Geplant <b>${h1(planSummen(plan).bezahlt)} h</b></span>${
        kurz.berechnung && kurz.berechnung.mindest !== null && kurz.berechnung.mindest !== undefined
          ? `<span>mindestens nötig <b>${h1(kurz.berechnung.mindest)} h</b></span>` : ""}</div></div>`);
    kopf.querySelectorAll("[data-sl]").forEach(b => b.onclick = () => {
      analyseWoche = b.dataset.sl; analyseTag = null; zeichnen();
      if (beiWochenwechsel) beiWochenwechsel();
    });
    box.appendChild(kopf);
    const zurWoche = meldungen.filter(m => tagVon(m) < 0);
    if (zurWoche.length) box.appendChild(el(`<div class="ta-hinweise">${zurWoche.map(hinweis).join("")}</div>`));

    // ---- Welcher Tag: nur Tag und Datum ----
    const reiter = el(`<div class="ta-tage" role="tablist" aria-label="Tag wählen"></div>`);
    plan.tage.forEach((t, ti) => {
      const b = el(`<button class="ta-tag" type="button" role="tab" aria-selected="${ti === analyseTag}"${t.feiertag ? ` disabled title="Feiertag"` : ""}>
        <b>${esc(t.label)}</b><span class="ta-datum">${t.datum.getDate()}.${t.datum.getMonth() + 1}.</span></button>`);
      b.onclick = () => { analyseTag = ti; zeichnen(); };
      reiter.appendChild(b);
    });
    box.appendChild(reiter);

    const e = tagesEinteilung(plan, analyseTag);
    if (!e){ box.appendChild(el(`<p class="empty">An diesem Tag ist die Filiale geschlossen.</p>`)); return; }
    const vor = name => name.split(/\s+/)[0];

    // ---- 1. Tagesbesetzung ----
    const personen = besetzungsPersonen(e);
    const grafik = el(unterrubrikHtml("Tagesbesetzung", "",
      "Je Person ein Balken über die Schicht. Die Farben zeigen, was sie wann macht; bei Ware steht die Art als Kürzel im Balken. Einen Abschnitt antippen zeigt Aufgabe und Uhrzeit. "
      + "Pausen legt der Planer so, dass Kasse und Aufgaben besetzt bleiben — auch früher, als das Gesetz verlangt (spätestens nach 6 Stunden)."));
    grafik.appendChild(besetzungsGrafik(plan, analyseTag, e));
    box.appendChild(grafik);

    // Was auffällt: Aufgaben, die neben einer anderen herlaufen — und solche, die niemand kann
    const nebenher = e.aufgaben.filter(a => a.nebenher.length);
    const notizen = [];
    if (nebenher.length) notizen.push(`<div class="note info"><span class="ic">•</span><span><b>Läuft nebenher:</b>
      ${nebenher.map(a => `${esc(a.name)} (${a.nebenher.map(n => `${esc(vor(n.name))} ${n.spannen.map(spanneText).join(", ")}`).join("; ")})`).join(" · ")}
      ${infoHtml("Zu diesen Zeiten ist niemand mit dem nötigen Können frei — wer es kann, ist schon eingeteilt.", "Läuft nebenher")}</span></div>`);
    e.aufgaben.filter(a => a.fehlt.length).forEach(a => notizen.push(`<div class="note warn"><span class="ic">!</span><span>
      <b>${esc(a.name)}, ${a.fehlt.map(spanneText).join(", ")}:</b> niemand mit dem nötigen Können im Laden.</span></div>`));

    // ---- 2. Hinweise des Planers zu diesem Tag ----
    const zumTag = meldungen.filter(m => tagVon(m) === analyseTag);
    const allgemein = zumTag.filter(m => !e.reihen.some(r => m.text.includes(r.name)));
    // Grundregel: Die Leitung kassiert nur, wenn sonst niemand frei ist — dann steht es hier
    const leitungKasse = e.kasse.filter(k => istLeitung(state.mitarbeiter.find(m => m.name === k.name)));
    if (leitungKasse.length) allgemein.push({art: "warn", text: `Die Filialleitung steht ${leitungKasse.map(k => hhmm(k.von) + "–" + hhmm(k.bis)).join(", ")} an der Kasse — sonst ist niemand frei.`});
    if (allgemein.length || notizen.length){
      box.appendChild(el(unterrubrikHtml("Hinweise zu diesem Tag", `<div class="ta-hinweise">${notizen.join("")}${allgemein.map(hinweis).join("")}</div>`)));
    }

    // ---- 3. Rolle für die Besetzung ----
    const lange = langeSchichten(plan).filter(y => y.ti === analyseTag);
    const rollen = personen.map(p => besetzungsRolle(plan, analyseTag, p.name, e));
    const liste = rollen.map(r => {
      const eigene = zumTag.filter(m => m.text.includes(r.name));
      const lang = lange.find(y => y.name === r.name);
      const merkmale = r.merkmale.map(t => `<span class="tag">${esc(t)}</span>`).join("")
        + (lang ? `<span class="tag lang">Lange Schicht ${h1(lang.arbeit)} h</span>${infoHtml(esc(lang.text.split(": ").slice(1).join(": ")) + " " + esc(LANG_HINWEIS), "Lange Schicht")}` : "");
      return `<details class="rolle"><summary><span class="rolle-kopf"><b>${esc(r.name)}</b><span class="rolle-daten">– ${
          r.schichten.map(spanneText).join(" + ")} · ${h1(r.arbeit)} h · Woche ${h1(r.woche)} h</span></span>
        <span class="rolle-pfeil" aria-hidden="true">${symbol("weiter")}</span></summary>
        <div class="rolle-inhalt">${merkmale ? `<div class="rolle-merkmale">${merkmale}</div>` : ""}
          <ul class="rolle-punkte">${r.punkte.map(pt => `<li><i class="rolle-farbe t-${pt.art}"></i><b>${esc(pt.was)}</b>
            <span class="num">${pt.spannen.map(spanneText).join(", ")}</span></li>`).join("")}</ul>
          ${eigene.map(hinweis).join("")}</div></details>`;
    }).join("");
    const rolle = el(unterrubrikHtml("Rolle für die Besetzung", `<div class="rolle-liste">${liste}</div>`,
      "Was jede Person an diesem Tag übernimmt. Schichtführung steht dort, wo es ohne diese Schicht niemanden mit Schlüssel gäbe."));
    box.appendChild(rolle);
  };
  zeichnen();
  return box;
}

// ==== app/40-startseite.js ====
/* Dashboard (bis 17.11.2026 „Übersicht“): zu erledigen, Vorfälle der Woche, wer heute im Laden steht,
   darunter der Plan der Woche als Aushang. Die Bereiche stehen links in der Leiste (Telefon: Reiter unten).

   Der Plan hier ist immer der gültige. Geändert wird er nur unter „Plan ändern“ —
   dort entsteht ein Entwurf, der erst mit „Übernehmen“ hierher kommt. */

/* ---- Der Plan im Filialformular: jede Lieferung eine Zeile, jede Uhrzeit eine Zelle ----
   Farben der Stunden (seit 17.11.2026, überall gleich — auch in PDF und Excel):
   rot = Minus, grün = Plus, blau = ausgeglichen. Das gilt für „Überstunden zu Beginn“, für die
   Veränderung in der Woche und für die Wochenstunden (gemessen am Soll der Woche: Vertrag
   abzüglich Urlaub, Krankheit, Feiertag). Der Stand nach der Woche steht schwarz und fett. */
function planGitter(plan, o){
  const r = planRaster(plan);
  const ms = state.mitarbeiter;
  const ueKlasse = n => n > 0.01 ? "ue-plus" : n < -0.01 ? "ue-minus" : "ue-null";
  const kopf = `<tr><th class="ecke">Lieferung</th><th class="stdkopf">Std.<br><span class="klein">Woche</span></th>
    <th class="stdkopf">Über&shy;stunden<br><span class="klein">zu Beginn</span></th>${
    r.datum.map((d, ti) => `<th colspan="2" class="tagkopf${plan.tage[ti].feiertag ? " k-feiertag" : ""}">${esc(d)}</th>`).join("")
  }<th>Stunden</th><th class="stdkopf">Über&shy;stunden<br><span class="klein">nach der Woche</span></th></tr>`;
  const liefer = r.lieferungen.map(l => `<tr class="liefer">
    <th class="zeilenkopf">${esc(l.name)}<span class="klein"> ${esc(l.zeit)}</span></th><td></td><td></td>
    ${l.tage.map(x => `<td colspan="2">${esc(x)}</td>`).join("")}<td></td><td></td></tr>`).join("");
  // Bestellungen ausgeschrieben, je Frist ein Block — die Zeile wächst mit, nichts wird gekürzt
  const bestell = r.mitBestellung ? `<tr class="bestell"><th class="zeilenkopf">Bestellung</th><td></td><td></td>
    ${r.bestellungVoll.map(tag => `<td colspan="2">${tag.map(([frist, namen]) => `<div class="b-gruppe">${
      frist ? `<b>${esc(frist)}</b>` : ""}${namen.map(n => `<span>${esc(n)}</span>`).join("")}</div>`).join("")}</td>`).join("")}<td></td><td></td></tr>` : "";
  const notizen = plan.notizen || {};
  const aufg = (o.notizImmer || plan.tage.some(t => notizen[t.key])) ? `<tr class="aufgabenzeile"><th class="zeilenkopf">Notiz</th><td></td><td></td>${
    plan.tage.map((t, ti) => `<td colspan="2"${t.feiertag ? "" : ` data-notiz="${ti}"`}>${t.feiertag ? "Feiertag"
      : esc(notizen[t.key] || (o.notizImmer ? "+" : ""))}</td>`).join("")}<td></td><td></td></tr>` : "";
  const luecken = o.luecken && Object.keys(o.luecken).length ? `<tr class="k-luecken"><th class="zeilenkopf">Lücken</th><td></td><td></td>${
    plan.tage.map((t, ti) => `<td colspan="2">${o.luecken[ti] ? esc(spannenText(o.luecken[ti])) : ""}</td>`).join("")}<td></td><td></td></tr>` : "";

  const leute = r.leute.map((pz, i) => {
    const m = ms[i];
    const name = o.klickbar
      ? `<button class="namelink" type="button" data-person="${i}" title="${esc(m.name)} bearbeiten">${esc(m.name)}</button>`
      : esc(m.name);
    const typ = istAzubi(m) ? `Azubi ${m.lehrjahr}. Jahr` : m.typ;
    const oben = [], unten = [];
    plan.tage.forEach((t, ti) => {
      const sch = pz.j < 0 ? [] : t.schichten.filter(s => s.mi === pz.j).sort((a, b) => a.von - b.von);
      const d = `data-i="${i}" data-ti="${ti}"`;
      if (t.feiertag){ oben.push(`<td colspan="2" class="frei">FEIERTAG</td>`); unten.push(`<td colspan="2"></td>`); return; }
      if (!sch.length){ oben.push(`<td colspan="2" class="frei" ${d} data-f="frei">FREI</td>`); unten.push(`<td colspan="2" ${d} data-f="leer"></td>`); return; }
      const x = sch[0];
      oben.push(`<td ${d} data-f="von">${hhmm(x.von)}</td><td ${d} data-f="bis">${hhmm(x.bis)}</td>`);
      // Bei geteilten Schichten steht die zweite in der unteren Zeile
      const u = sch.length > 1 ? [hhmm(sch[1].von), hhmm(sch[1].bis)] : x.pause ? [hhmm(x.pauseVon), hhmm(x.pauseBis)] : ["", ""];
      unten.push(`<td ${d} data-f="pause" data-p="0">${u[0]}</td><td ${d} data-f="pause" data-p="1">${u[1]}</td>`);
    });
    return `<tr class="ma-oben"><th class="zeilenkopf" rowspan="2">${name}<span class="klein typ">${esc(typ)}</span></th>
      <td class="n std" rowspan="2">${esc(pz.woche)}</td>
      <td class="n std ${pz.ueStart === null ? "" : ueKlasse(pz.ueStart)}" rowspan="2">${ueText(pz.ueStart)}</td>
      ${oben.join("")}
      <td rowspan="2" class="n stunden"><b class="${pz.diff === null ? "" : ueKlasse(pz.diff)}">${h1(pz.wo)}</b></td>
      <td rowspan="2" class="n std"${pz.monat ? ` title="${monatsTitel(pz.monat)}"` : ""}>${pz.monat ? monatsZelle(pz.monat)
        : pz.ueEnde === null ? "" : `<b class="ue-ende">${ueText(pz.ueEnde)}</b>
        <br><span class="ue-aend ${ueKlasse(pz.ueAend)}">${Math.abs(pz.ueAend) < 0.01 ? "±0" : ueText(pz.ueAend)} Std.</span>`}</td></tr>
      <tr class="ma-unten">${unten.join("")}</tr>`;
  }).join("");
  // Darunter, was davon zählt: ohne die leistungsneutralen Stunden der Azubis
  const summe = `<tr class="summe"><th class="zeilenkopf">Summe Stunden</th><td></td><td></td>${
    r.summen.map(x => `<td colspan="2">${h1(x)}</td>`).join("")}<td class="n">${h1(r.summeWoche)}</td><td></td></tr>
    <tr class="summe wirksam"><th class="zeilenkopf">Leistungswirksame Stunden</th><td></td><td></td>${
    r.wirk.map(x => `<td colspan="2">${h1(x)}</td>`).join("")}<td class="n">${h1(r.wirkWoche)}</td><td></td></tr>`;
  return el(`<table class="plan gitter"><thead>${kopf}</thead><tbody>${liefer}${bestell}${aufg}${luecken}${leute}${summe}</tbody></table>`);
}

// Aushilfen haben kein Stundenkonto: In der Spalte steht bei ihnen der Stand im Monat
const monatsZelle = a => `<b>${h1(a.ist)}</b> <span class="klein">von ${hGenau(a.grenze)}</span><br><span class="klein">im ${esc(a.monatsname)}</span>`;
const monatsTitel = a => `Aushilfe: im ${a.monatsname} ${h1(a.ist)} von höchstens ${hGenau(a.grenze)} h (Minijob-Grenze).`;

/* ---- Derselbe Plan kompakt — für schmale Bildschirme (iPhone) ---- */
function planKompakt(plan, o){
  const r = planRaster(plan);
  const ms = state.mitarbeiter;
  const ueKlasse = n => n > 0.01 ? "ue-plus" : n < -0.01 ? "ue-minus" : "ue-null";
  // In schmaler Ansicht kurze Wörter statt Umbruch mitten im Wort
  const zweifach = (voll, kurz) => `<span class="k-voll">${voll}</span><span class="k-kurz">${kurz}</span>`;
  const abk = n => n.length <= 5 ? n : n.slice(0, 3) + ".";
  const kopf = `<tr><th class="k-name">${zweifach("Mitarbeiter", "Name")}</th>${plan.tage.map(t =>
    `<th class="k-tag${t.feiertag ? " k-feiertag" : ""}">${esc(t.label)}<span>${t.datum.getDate()}.${t.datum.getMonth()+1}.</span></th>`).join("")}
    <th class="k-std">Std.</th><th class="k-konto">${zweifach("Konto", "Kto.")}</th></tr>`;
  const zusatz = (titel, klasse, werte) => werte.some(x => x)
    ? `<tr class="k-zusatz ${klasse}"><th>${titel}</th>${werte.map(x => `<td>${x}</td>`).join("")}<td></td><td></td></tr>` : "";
  const liefer = zusatz(zweifach("Lieferung", "Lief."), "k-liefer", plan.tage.map((t, ti) => {
    const l = r.lieferungen.map(x => x.tage[ti]).filter(Boolean);
    return l.length ? zweifach(l.map(esc).join(", "), l.map(x => esc(abk(x))).join(" ")) : "";
  }));
  const bestell = r.mitBestellung ? zusatz(zweifach("Bestellung", "Best."), "k-bestell", r.bestellung.map(x => x.map(esc).join("<br>"))) : "";
  const notizen = plan.tage.map(t => t.feiertag ? "" : esc((plan.notizen || {})[t.key] || ""));
  const notiz = o.notizImmer
    ? `<tr class="k-zusatz k-notiz"><th>Notiz</th>${notizen.map((x, ti) => `<td data-notiz="${ti}">${x || (plan.tage[ti].feiertag ? "" : "+")}</td>`).join("")}<td></td><td></td></tr>`
    : zusatz("Notiz", "k-notiz", notizen);
  const luecken = o.luecken && Object.keys(o.luecken).length ? `<tr class="k-luecken"><th>Lücken</th>${plan.tage.map((t, ti) =>
    `<td>${o.luecken[ti] ? esc(spannenText(o.luecken[ti])) : ""}</td>`).join("")}<td></td><td></td></tr>` : "";
  const zeilen = r.leute.map((pz, i) => {
    const m = ms[i];
    const tage = plan.tage.map((t, ti) => {
      if (t.feiertag) return `<td class="k-frei">Feiertag</td>`;
      const sch = pz.j < 0 ? [] : t.schichten.filter(s => s.mi === pz.j).sort((a, b) => a.von - b.von);
      if (!sch.length) return `<td class="k-frei" data-ti="${ti}" data-i="${i}">frei</td>`;
      const zelle = sch.map(s => `<span class="k-zeit"><b>${hhmm(s.von)}</b><b>${hhmm(s.bis)}</b></span>${
        s.pause && s.pauseVon !== null && sch.length === 1 ? `<span class="k-pause">P ${hhmm(s.pauseVon)}</span>` : ""}`).join("");
      return `<td data-ti="${ti}" data-i="${i}">${zelle}</td>`;
    }).join("");
    const vorname = m.name.split(/\s+/)[0];
    const name = o.klickbar
      ? `<button class="namelink" type="button" data-person="${i}" title="${esc(m.name)} bearbeiten">
          <span class="k-voll">${esc(m.name)}</span><span class="k-kurz">${esc(vorname)}</span></button>`
      : `<span class="k-voll">${esc(m.name)}</span><span class="k-kurz">${esc(vorname)}</span>`;
    const typ = istAzubi(m) ? `Azubi ${m.lehrjahr}. Jahr` : m.typ;
    return `<tr class="k-person"><th class="k-name">${name}<span class="k-typ">${esc(typ)}</span></th>${tage}
      <td class="k-std"><b class="${pz.diff === null ? "" : ueKlasse(pz.diff)}">${h1(pz.wo)}</b>${pz.sollZahl !== null && !pz.monat ? `<span>von ${h1(pz.sollZahl)}</span>` : ""}</td>
      <td class="k-konto"${pz.monat ? ` title="${monatsTitel(pz.monat)}"` : ""}>${pz.monat ? `<b class="k-voll">${h1(pz.monat.ist)}</b><span>von ${hGenau(pz.monat.grenze)}</span>`
        : pz.ueEnde === null ? "" : `<b class="ue-ende">${ueText(pz.ueEnde) || "0,0"}</b>
        <span class="${ueKlasse(pz.ueAend)}">${Math.abs(pz.ueAend) < 0.01 ? "±0" : ueText(pz.ueAend)}</span>`}</td></tr>`;
  }).join("");
  const summe = `<tr class="k-summe"><th>Summe</th>${r.summen.map(x => `<td>${h1(x)}</td>`).join("")}
    <td class="k-std"><b>${h1(r.summeWoche)}</b></td><td></td></tr>
    <tr class="k-summe k-wirksam"><th>${zweifach("Leistungswirksam", "Wirks.")}</th>${r.wirk.map(x => `<td>${h1(x)}</td>`).join("")}
    <td class="k-std"><b>${h1(r.wirkWoche)}</b></td><td></td></tr>`;
  return el(`<table class="kompakt">
    <colgroup><col class="c-name">${plan.tage.map(() => `<col class="c-tag">`).join("")}<col class="c-std"><col class="c-konto"></colgroup>
    <thead>${kopf}</thead><tbody>${liefer}${bestell}${notiz}${luecken}${zeilen}${summe}</tbody></table>`);
}

// „07:00–11:00 + 15:00–18:00“ → [[420, 660], [900, 1080]]
const zeitenAusText = t => String(t || "").split("+").map(x => x.trim().split("–").map(minuten)).filter(x => x.length === 2);

/* Geänderte Zellen hervorheben: die neue Zeit groß, die alte klein, grau, durchgestrichen.
   zellen: {"i|ti": {art: neu | weg | konflikt | recht | geaendert | gestrichen, alt: [[von, bis]], grund}} */
function zellenSchmuecken(box, zellen){
  box.querySelectorAll("td[data-i]").forEach(td => {
    const z = zellen[td.dataset.i + "|" + td.dataset.ti];
    if (!z) return;
    td.classList.add("z-" + z.art);
    const alt = z.alt || [], f = td.dataset.f;
    if (z.art === "weg" || z.art === "gestrichen"){
      if (f === "pause" || f === "leer") return;
      td.innerHTML = `${alt.map(([a, b]) => `<s class="z-alt">${hhmm(a)}–${hhmm(b)}</s>`).join("")}<em class="z-grund">${esc(z.grund || "frei")}</em>`;
      return;
    }
    // Nur die Pause ist anders: die alte Pause klein darunter
    if (z.pause !== undefined){
      if (f === "pause" && z.pause) td.insertAdjacentHTML("beforeend", `<s class="z-alt">${hhmm(z.pause[+td.dataset.p])}</s>`);
      else if (!f) td.insertAdjacentHTML("beforeend", `<s class="z-alt">${z.pause ? "P " + hhmm(z.pause[0]) : "ohne Pause"}</s>`);
      return;
    }
    if (f === "pause" || f === "leer") return;
    if (!alt.length){ td.insertAdjacentHTML("beforeend", `<em class="z-grund z-neu-text">neu</em>`); return; }
    if (f === "von" || f === "bis"){
      const vorher = hhmm(alt[0][f === "von" ? 0 : 1]);
      if (td.textContent.trim() !== vorher) td.insertAdjacentHTML("beforeend", `<s class="z-alt">${vorher}</s>`);
    } else td.insertAdjacentHTML("beforeend", `<s class="z-alt">${alt.map(([a, b]) => hhmm(a) + "–" + hhmm(b)).join(" + ")}</s>`);
  });
}

/* Der Plan zum Anzeigen: Filialformular, auf schmalen Bildschirmen die kompakte Fassung.
   o: klickbar (Namen öffnen die Person), zellen (Hervorhebungen), luecken, notizImmer,
      zelleKlick(i, ti), notizKlick(ti) */
function planAnzeige(plan, optionen){
  const o = optionen || {};
  const box = el(`<div class="planbox"></div>`);
  const gitter = planGitter(plan, o), kompakt = planKompakt(plan, o);
  gitter.classList.add("ansicht-breit"); kompakt.classList.add("ansicht-schmal");
  box.appendChild(gitter); box.appendChild(kompakt);
  if (o.zellen) zellenSchmuecken(box, o.zellen);
  if (o.klickbar) box.querySelectorAll("[data-person]").forEach(b => b.onclick = () => personOeffnen(+b.dataset.person));
  if (o.zelleKlick) box.querySelectorAll("td[data-i]").forEach(td => {
    td.classList.add("bearbeitbar"); td.title = "Antippen zum Ändern";
    td.onclick = () => o.zelleKlick(+td.dataset.i, +td.dataset.ti);
  });
  if (o.notizKlick) box.querySelectorAll("td[data-notiz]").forEach(td => {
    td.classList.add("bearbeitbar"); td.onclick = () => o.notizKlick(+td.dataset.notiz);
  });
  return box;
}

// Für Archiv: dieselbe Darstellung, ohne Klick
const planTabelle = plan => planAnzeige(plan, {});

// Was seit dem Erstellen geändert wurde (plan.urfassung: "Name|ti" → alte Zeiten)
function urfassungZellen(kurz){
  const raus = {};
  Object.entries((kurz && kurz.urfassung) || {}).forEach(([k, alt]) => {
    const [name, ti] = k.split("|"), i = personIndex(name);
    if (i < 0) return;
    raus[i + "|" + ti] = {art: schichtText(kurz, name, +ti) ? "geaendert" : "gestrichen", alt: zeitenAusText(alt), grund: "frei"};
  });
  return raus;
}

// Nach „Übernehmen“ in „Plan ändern“ oder „Plan freigeben“: einmal oben sagen, dass der Plan
// jetzt gilt — {sl, text}
let startHinweis = null;

/* ---- Was in der gezeigten Woche Besonderes ist — Auskunft, keine Aufgabe ----
   Krank und Urlaub stehen nur hier, in der Ansicht der Filialleitung; nie im Ausdruck. */
function wochenVorfaelle(mo){
  const sl = wochenSchluessel(mo), kurz = (state.plaene || {})[sl], raus = [];
  ereignisseDerWoche(sl).forEach(e => raus.push({art: e.text, text: `${e.name} — ${tageText(e.tage)}`}));
  // nach dem Erstellen geändert: alte Zeit → neue Zeit
  Object.keys((kurz && kurz.urfassung) || {}).map(k => { const [name, ti] = k.split("|"); return {name, ti: +ti, alt: kurz.urfassung[k]}; })
    .sort((x, y) => x.ti - y.ti || (x.name < y.name ? -1 : 1))
    .forEach(x => raus.push({art: "Geändert", text: `${x.name}, ${TAGE[x.ti][1]}: ${x.alt || "frei"} → ${schichtText(kurz, x.name, x.ti) || "frei"}`}));
  TAGE.forEach(([, kurzName], ti) => {
    const d = new Date(mo); d.setDate(mo.getDate() + ti);
    const f = feiertagName(d);
    if (f) raus.push({art: "Feiertag", text: `${kurzName} ${d.getDate()}.${d.getMonth() + 1}. — ${f}`});
  });
  const ph = phaseNormal(kurz ? kurz.phase : (state.phasen || {})[sl]);
  if (ph.art !== "normal") raus.push({art: ph.art === "sparen" ? "Stunden sparen" : "Mehr Stunden", text: phasenText(ph)});
  return raus;
}

/* ---- Dashboard: oben, was zu tun ist (ein Satz und der Weg dorthin) —
        darunter, was diese Woche Besonderes ist ---- */
function dashboardKarte(marken, mo){
  const alle = Object.keys(marken).reduce((a, ziel) => a.concat(marken[ziel].map(x => Object.assign({ziel}, x))), []);
  alle.sort((a, b) => (a.art === "neu") - (b.art === "neu"));     // erst, was zu tun ist — dann, was neu ist
  const k = el(`<section class="karte dashboard">
    <div class="db-teil"><div class="karte-kopf"><h2>Zu erledigen</h2>${zahlHtml(alle)}</div><div class="zt-liste"></div></div>
    <div class="db-teil"><div class="karte-kopf"><h2>Diese Woche</h2><span class="pille">KW ${kwVon(mo)}</span></div><div class="vf-liste"></div></div>
  </section>`);
  const box = k.querySelector(".zt-liste");
  const zeile = x => {
    const wohin = (NAV_PUNKTE.find(n => n.ziel === x.ziel) || {}).titel || "";
    const tun = x.art === "neu" ? "Ansehen" : x.ziel === "aendern" ? "Lösen" : x.ziel === "planen" && !/^entwurf:/.test(x.id) ? "Erstellen" : "Öffnen";
    const b = el(`<button class="zt-zeile ${x.art}" type="button"><span class="zt-punkt" aria-hidden="true"></span>
      <span class="zt-text"><b>${esc(x.text)}</b><span>${x.art === "neu" ? "Neu · " : ""}${esc(wohin)}</span></span>
      <span class="zt-tun">${tun}${symbol("weiter")}</span></button>`);
    b.onclick = () => geheZu(x.ziel, x);
    return b;
  };
  if (!alle.length) box.appendChild(el(`<p class="zt-leer">${symbol("haken")}<span>Nichts offen.</span></p>`));
  alle.slice(0, 5).forEach(x => box.appendChild(zeile(x)));
  if (alle.length > 5){
    const d = el(`<details class="zt-rest"><summary>${alle.length - 5} weitere</summary></details>`);
    alle.slice(5).forEach(x => d.appendChild(zeile(x)));
    box.appendChild(d);
  }

  const vBox = k.querySelector(".vf-liste");
  const vorfaelle = wochenVorfaelle(mo);
  const vZeile = v => el(`<div class="vf-zeile"><span class="vf-art">${esc(v.art)}</span><span>${esc(v.text)}</span></div>`);
  if (!vorfaelle.length) vBox.appendChild(el(`<p class="zt-leer"><span>Keine Vorfälle — alles läuft nach Plan.</span></p>`));
  vorfaelle.slice(0, 6).forEach(v => vBox.appendChild(vZeile(v)));
  if (vorfaelle.length > 6){
    const d = el(`<details class="zt-rest"><summary>${vorfaelle.length - 6} weitere</summary></details>`);
    vorfaelle.slice(6).forEach(v => d.appendChild(vZeile(v)));
    vBox.appendChild(d);
  }
  return k;
}

/* ---- Heute im Laden: wer da ist, wer kommt, wer schon weg ist ---- */
function heuteKarte(){
  const jetzt = new Date(), wt = (jetzt.getDay() + 6) % 7, min = jetzt.getHours() * 60 + jetzt.getMinutes();
  const sl = wochenSchluessel(montagDer(null)), kurz = (state.plaene || {})[sl];
  const k = el(`<section class="karte heute"><div class="karte-kopf"><div>
    <span class="eyebrow">${esc(jetzt.toLocaleDateString("de-DE", {weekday: "long", day: "numeric", month: "long"}))}</span>
    <h2>Heute im Laden</h2></div><span class="pille" id="htDa" hidden></span></div><div class="ht-liste"></div></section>`);
  const box = k.querySelector(".ht-liste");
  const leer = text => { box.appendChild(el(`<p class="zt-leer"><span>${text}</span></p>`)); return k; };
  if (wt === 6) return leer("Sonntag — die Filiale ist geschlossen.");
  if (!kurz) return leer("Für diese Woche gibt es noch keinen Plan.");
  const plan = planLaden(kurz), tag = plan.tage[wt];
  if (!tag || tag.feiertag) return leer("Feiertag — die Filiale ist geschlossen.");
  const ms = state.mitarbeiter;
  const fehlt = new Set(planKonflikte(sl).filter(x => x.ti === wt).map(x => x.name));
  const zeilen = tag.schichten.map(s => {
    const name = plan.namen ? plan.namen[s.mi] : (ms[s.mi] || {}).name;
    return {s, name, m: ms.find(x => x.name === name)};
  }).filter(z => z.name).sort((a, b) => a.s.von - b.s.von || a.s.bis - b.s.bis);
  if (!zeilen.length) return leer("Heute ist niemand eingeplant.");

  const lage = z => fehlt.has(z.name) ? ["fehlt", "fehlt — Plan ändern"]
    : min < z.s.von ? ["kommt", "kommt um " + hhmm(z.s.von)]
    : min >= z.s.bis ? ["weg", "war bis " + hhmm(z.s.bis) + " da"]
    : z.s.pause && z.s.pauseVon != null && min >= z.s.pauseVon && min < z.s.pauseBis ? ["pause", "Pause bis " + hhmm(z.s.pauseBis)]
    : ["da", "da bis " + hhmm(z.s.bis)];
  let da = 0;
  zeilen.forEach(z => {
    const [art, text] = lage(z);
    if (art === "da" || art === "pause") da++;
    const typ = !z.m ? "" : istAzubi(z.m) ? "Azubi" : z.m.typ.replace(/\s*\(.*\)$/, "");
    const r = el(`<div class="ht-zeile ${art}"><span class="ht-punkt" aria-hidden="true"></span>
      <span class="ht-name"><b>${esc(z.name)}</b><span>${esc(typ)}</span></span>
      <span class="ht-zeit">${hhmm(z.s.von)}–${hhmm(z.s.bis)}</span><span class="ht-lage">${text}</span></div>`);
    if (art === "fehlt"){ r.classList.add("klickbar"); r.onclick = () => planAendernOeffnen(sl); }
    box.appendChild(r);
  });
  const pille = k.querySelector("#htDa");
  pille.hidden = false; pille.textContent = da === 0 ? "gerade niemand da" : da === 1 ? "1 Person da" : da + " Personen da";
  // Was als Nächstes passiert: der nächste Wechsel im Laden
  const wechsel = zeilen.filter(z => !fehlt.has(z.name)).reduce((a, z) => a.concat(
    [[z.s.von, `${z.name} kommt um ${hhmm(z.s.von)}`], [z.s.bis, `${z.name} geht um ${hhmm(z.s.bis)}`]]), [])
    .filter(x => x[0] > min).sort((a, b) => a[0] - b[0])[0];
  if (wechsel) k.appendChild(el(`<p class="ht-naechstes"><b>Als Nächstes:</b> ${esc(wechsel[1])}</p>`));
  return k;
}

/* ---- Ausfall eintragen: der kurze Weg vom Telefon ----
   Wer, was, von wann bis wann. Steht die Person an den Tagen im Plan, führt der Knopf
   darunter direkt zu „Plan ändern“ mit den Lösungen. */
function ausfallDialog(){
  const inhalt = el(`<div class="ausfalldialog"><h2>Ausfall eintragen${infoHtml("Kurzfristiger Ausfall. Steht die Person an den Tagen schon im Plan, geht es danach zu „Plan ändern“ — dort hilft der Assistent.", "Ausfall eintragen")}</h2></div>`);
  let d = null;
  inhalt.appendChild(ereignisFormular(null, () => render(), "krank"));      // kurzfristig ist es fast immer das
  inhalt.querySelector("[data-eintragen]").classList.add("haupt");
  const unten = el(`<div class="dialog-knoepfe unten"><div class="spacer"></div>
    <button class="btn ghost" type="button">Schließen</button></div>`);
  unten.querySelector("button").onclick = () => d.remove();
  inhalt.appendChild(unten);
  // Der Weg zu „Plan ändern“ verlässt die Seite — dann muss auch das Fenster weg
  inhalt.addEventListener("click", e => { if (e.target.closest(".knopfreihe .btn")) d.remove(); }, true);
  d = dialogZeigen(inhalt);
}

/* ---- Der Plan der Woche als Karte: Aushang, Wochenwechsel, Ausgabe ---- */
// Tagesansicht des Plans: welcher Tag (0 = Mo) — null zeigt die ganze Woche
let planTag = null;

/* Ein Tag des gültigen Plans: was kommt und raus muss, wer wann da ist und was er macht.
   neu(ti) wechselt den Tag. */
function planTagesansicht(plan, sl, ti, neu){
  const box = el(`<div class="tagesansicht"></div>`);
  const reiter = el(`<div class="ta-tage" role="tablist" aria-label="Tag wählen"></div>`);
  plan.tage.forEach((t, k) => {
    const b = el(`<button class="ta-tag" type="button" role="tab" aria-selected="${k === ti}"${t.feiertag ? ` disabled title="Feiertag"` : ""}>
      <b>${esc(t.label)}</b><span class="ta-datum">${t.datum.getDate()}.${t.datum.getMonth() + 1}.</span></button>`);
    b.onclick = () => neu(k);
    reiter.appendChild(b);
  });
  box.appendChild(reiter);
  const e = tagesEinteilung(plan, ti);
  if (!e){ box.appendChild(el(`<p class="empty">Feiertag — die Filiale ist geschlossen.</p>`)); return box; }
  // Was an dem Tag kommt und raus muss
  const r = planRaster(plan), infos = [];
  const lief = r.lieferungen.map(x => x.tage[ti]).filter(Boolean);
  if (lief.length) infos.push(["Lieferung", lief.join(" · ")]);
  // ausgeschrieben — die Kürzel des Aushangs stünden sonst neben den Kürzeln der Legende
  if (r.mitBestellung && r.bestellungVoll[ti].length) infos.push(["Bestellung", r.bestellungVoll[ti].map(([frist, namen]) => namen.join(", ") + (frist ? " " + frist : "")).join(" · ")]);
  const notiz = (plan.notizen || {})[plan.tage[ti].key];
  if (notiz) infos.push(["Notiz", notiz]);
  if (infos.length) box.appendChild(el(`<div class="tag-infos">${infos.map(([k, v]) => `<div><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join("")}</div>`));
  // Liegt eine Aufgabe außerhalb ihrer Frist, oder steht die Kasse kurz leer: gleich dazu, wo es sich beheben lässt
  aufgabenAusserhalb(plan).filter(x => x.ti === ti).forEach(x => {
    const n = el(`<div class="note bad"><span class="ic">×</span><span>${esc(aufgabenAusserhalbText(x))}${infoHtml(esc(aufgabenAusserhalbGrund(x)), "Frist")}
      <span class="knopfreihe"><button class="btn small" type="button">In „Plan ändern“ neu legen</button></span></span></div>`);
    n.querySelector("button").onclick = () => planAendernOeffnen(sl);
    box.appendChild(n);
  });
  const leer = kasseLeer(plan, ti);
  if (leer.length){
    const n = el(`<div class="note bad"><span class="ic">×</span><span>Kasse ${esc(leer.map(spanneText).join(", "))} leer.
      <span class="knopfreihe"><button class="btn small" type="button">In „Plan ändern“ beheben</button></span></span></div>`);
    n.querySelector("button").onclick = () => planAendernOeffnen(sl);
    box.appendChild(n);
  }
  box.appendChild(besetzungsGrafik(plan, ti, e, {mitZeiten: true}));
  return box;
}

function planKarte(mo, pdfIstHaupt){
  const sl = wochenSchluessel(mo);
  const gespeichert = state.plaene[sl];
  const plan = planLaden(gespeichert);
  const kw = kwVon(mo);
  const bis = new Date(mo.getTime() + 5*864e5);
  const k = el(`<section class="karte plankarte">
      <div class="karte-kopf">
        <div>
          <span class="eyebrow">${gespeichert ? "Gültiger Plan" : "Noch kein Plan"}</span>
          <h2>KW ${kw} · ${deVon(mo)} – ${deVon(bis)}${
            isoVon(mo) === isoVon(aktuellerMontag()) ? "" : ` <span class="tag">andere Woche</span>`}${
            plan && plan.phase.art !== "normal" ? ` <span class="tag phase">${esc(phasenText(plan.phase))}</span>` : ""}</h2>
        </div>
        ${plan ? `<div class="ansicht-wahl" role="group" aria-label="Ansicht">
          <button type="button" data-ansicht="woche" aria-pressed="${planTag === null}">Woche</button>
          <button type="button" data-ansicht="tag" aria-pressed="${planTag !== null}">Tag</button></div>` : ""}
        <div class="wochenwechsel" role="group" aria-label="Woche wechseln">
          <button class="btn ghost small" id="wZurueck" title="eine Woche zurück" type="button">‹</button>
          <button class="btn ghost small" id="wHeute" title="zur laufenden Woche" type="button">heute</button>
          <button class="btn ghost small" id="wVor" title="eine Woche vor" type="button">›</button>
        </div>
        <div class="karte-aktionen" id="planKnoepfe"></div>
      </div>
      <div id="planInhalt"></div>
    </section>`);

  const inhalt = k.querySelector("#planInhalt");
  const knoepfe = k.querySelector("#planKnoepfe");
  if (plan && planTag !== null){
    // Tagesansicht: heute, wenn es die laufende Woche ist — sonst der gewählte oder erste offene Tag
    const offen = ti => plan.tage[ti] && !plan.tage[ti].feiertag;
    if (!offen(planTag)) planTag = Math.max(0, plan.tage.findIndex(t => !t.feiertag));
    inhalt.appendChild(planTagesansicht(plan, sl, planTag, ti => { planTag = ti; render(); }));
  } else if (plan){
    const geaendert = urfassungZellen(gespeichert);
    inhalt.appendChild(planAnzeige(plan, {klickbar: true, zellen: geaendert}));
    if (Object.keys(geaendert).length) inhalt.appendChild(el(`<div class="legende"><span><i class="geaendert"></i> nach dem Erstellen geändert
      — darunter klein die ursprüngliche Zeit</span></div>`));
    // Überstunden über 50 % des Vertrags: erlaubt, aber ein Hinweis — nur hier, nicht im Aushang
    ueberFuenfzig(gespeichert).forEach(x => inhalt.appendChild(el(`<div class="note warn"><span class="ic">!</span><span>${esc(ueberFuenfzigText(x))}</span></div>`)));
  }
  if (plan){
    // Drucken, in die Gruppe schicken, aushängen — in der App über „Teilen“
    const pdf = el(`<button class="btn small${pdfIstHaupt ? " haupt" : ""}" type="button">${inApp ? "PDF teilen oder drucken" : "PDF zum Aushängen"}</button>`);
    pdf.onclick = () => planPDF(planLaden(gespeichert));
    const xls = el(`<button class="btn ghost small" type="button">Excel</button>`);
    xls.onclick = () => planExcel(planLaden(gespeichert));
    knoepfe.appendChild(pdf); knoepfe.appendChild(xls);
  } else {
    const leer = el(`<div class="leerplan"><p>Für diese Woche gibt es noch keinen Plan.</p>
      <button class="btn" type="button">${symbol("plus")}<span>Plan für KW ${kw} erstellen</span></button></div>`);
    leer.querySelector("button").onclick = () => { planWoche = isoVon(mo); ansicht = "planen"; render(); };
    inhalt.appendChild(leer);
  }

  const springe = n => {
    const d = new Date(mo); d.setDate(mo.getDate() + n*7);
    zeigeWoche = isoVon(d); render();
  };
  k.querySelector("#wZurueck").onclick = () => springe(-1);
  k.querySelector("#wVor").onclick = () => springe(1);
  k.querySelector("#wHeute").onclick = () => { zeigeWoche = null; render(); };
  k.querySelectorAll("[data-ansicht]").forEach(b => b.onclick = () => {
    if (b.dataset.ansicht === "woche") planTag = null;
    else if (planTag === null){
      // heute, wenn diese Woche gezeigt wird — sonst Montag
      const heute = (new Date().getDay() + 6) % 7;
      planTag = isoVon(mo) === isoVon(aktuellerMontag()) && heute < 6 ? heute : 0;
    }
    render();
  });
  return k;
}

/* ---- Übersicht — und, auf dem Telefon unter „Plan“, der Wochenplan allein ---- */
function startseite(o){
  const nurPlan = !!(o && o.nurPlan);
  // Normalerweise steht die laufende Woche oben; nach dem Erstellen die geplante
  const mo = zeigeWoche ? montagDer(zeigeWoche) : aktuellerMontag();
  const sl = wochenSchluessel(mo);
  const gespeichert = state.plaene[sl];
  const marken = markierungen();
  // Gelb ist immer der nächste Schritt: erst den Plan erstellen, dann ausgeben
  const planFehlt = !gespeichert || (marken.planen || []).length > 0;
  // Wartet ein Entwurf auf die Freigabe, ist das der nächste Schritt — der Knopf führt direkt dorthin
  const entwurfMarke = (marken.planen || []).find(x => /^entwurf:/.test(x.id));
  const entwurfKw = entwurfMarke ? kwVon(montagAusSchluessel(entwurfMarke.id.slice(8))) : null;
  const heute = new Date();

  const p = el(`<div class="start${nurPlan ? " wochenplan" : ""}">
    <header class="startkopf">
      <div>
        <span class="eyebrow">N ${esc(state.nr)}${state.ort ? " · " + esc(state.ort) : ""}</span>
        <h1>${nurPlan ? "Wochenplan" : "Dashboard"}</h1>
        <p class="lede">${esc(heute.toLocaleDateString("de-DE", {weekday: "long", day: "numeric", month: "long", year: "numeric"}))} · KW ${kwVon(montagDer(null))}</p>
      </div>
      <div class="startkopf-knoepfe">
        ${nurPlan ? `<button class="btn ghost" id="aendern" type="button"${gespeichert ? "" : " disabled"}>${symbol("stift")}<span>Plan ändern</span></button>`
                  : `<button class="btn ghost" id="ausfall" type="button">${symbol("ausfall")}<span>Ausfall eintragen</span></button>`}
        <button class="btn${planFehlt ? " haupt" : ""}" id="neuerPlan" type="button">${symbol(entwurfMarke ? "weiter" : "plus")}<span>${
          entwurfMarke ? `Entwurf KW ${entwurfKw} öffnen` : "Plan erstellen"}</span></button>
      </div>
    </header>
  </div>`);

  if (startHinweis){
    const h = typeof startHinweis === "string" ? {sl: startHinweis} : startHinweis;
    startHinweis = null;
    const n = el(`<div class="note ok"><span class="ic">✓</span><span>${esc(h.text || "Der geänderte Plan ist jetzt der gültige. Damit alle ihn haben: neu ausdrucken und in die Gruppe schicken.")}
      <span class="knopfreihe"><button class="btn small" type="button">${inApp ? "PDF teilen oder drucken" : "PDF zum Aushängen"}</button></span></span></div>`);
    n.querySelector("button").onclick = () => planPDF(planLaden(state.plaene[h.sl]));
    p.appendChild(n);
  }
  const warnung = archivHinweis();
  if (warnung) p.appendChild(warnung);

  if (!nurPlan){
    const oben = el(`<div class="startraster"></div>`);
    oben.appendChild(dashboardKarte(marken, mo));
    oben.appendChild(heuteKarte());
    p.appendChild(oben);
  }
  p.appendChild(planKarte(mo, !planFehlt));

  p.querySelector("#neuerPlan").onclick = () => geheZu("planen", entwurfMarke);
  if (nurPlan) p.querySelector("#aendern").onclick = () => planAendernOeffnen(sl);
  else p.querySelector("#ausfall").onclick = ausfallDialog;
  return p;
}

      <div id="phasenDetail"></div>

  // Die Liste der Woche und die Herkunft an den Zellen — nach jeder Änderung neu

  // Art der Woche — wird je Woche gemerkt, auch wenn noch kein Plan entsteht

  const wahlBox = p.querySelector("#phasenwahl"), detail = p.querySelector("#phasenDetail");
  [["normal","Normale Woche","Alles wie hinterlegt: Aufgaben, Personal, Überstunden, Stundenliste, Standardwoche."],

        <label class="switch"><input type="radio" name="sparArt" value="stunden"${ph.sparArt === "stunden" ? " checked" : ""}>

        ${infoHtml("Gespart wird zuerst bei denen, die Überstunden haben. Zum Vergleich rechnet der Planer die normale Woche mit und sagt, wie viel es gebracht hat.", "Stunden sparen")}</div>`);
      box.querySelectorAll("[name=sparArt]").forEach(r => r.onchange = () => { ph.sparArt = r.value; sichern(); });
      box.querySelector("[data-prozent]").oninput = e => { ph.prozent = zahlWert(e.target); ph.sparArt = "prozent";
        box.querySelector("[name=sparArt][value=prozent]").checked = true; sichern(); };
      box.querySelector("[data-stunden]").oninput = e => { ph.stunden = zahlWert(e.target); ph.sparArt = "stunden";

      detail.appendChild(box);
    } else if (ph.art === "mehr"){
      const box = el(`<div class="phasendetail">
        <div class="grid g2">
          ${feldHtml("Zusätzliche Stunden in der Woche", zahlFeld('data-mehr placeholder="z. B. 12"', ph.mehr, "h", {min: 0}),

          ${feldHtml("Wofür", `<input type="text" data-was placeholder="z. B. Umbau Aktionsfläche" value="${esc(ph.was)}">`, "Optional — steht im Plan bei der Schicht.")}

        <div style="margin-top:10px"><span class="eyebrow">an diesen Tagen${infoHtml("Keine Tage gewählt heißt: über die ganze Woche verteilt.", "Tage")}</span>
          <div class="days" data-tage></div></div></div>`);
      box.querySelector("[data-mehr]").oninput = e => { ph.mehr = zahlWert(e.target); sichern(); };
      box.querySelector("[data-was]").oninput = e => { ph.was = e.target.value.trim(); sichern(); };
      const tb = box.querySelector("[data-tage]");
      TAGE.forEach(([k,l]) => {

        b.onclick = () => {

  phasenFelder();

  // Bereitschaft: Was fehlt, damit der Plan nicht auf falschen Annahmen steht?
  const bereitBox = p.querySelector("#bereit"), knopf = p.querySelector("#erzeugen");
  function bereitZeigen(){
    const b = bereitschaft(sl);
    bereitBox.innerHTML = "";
    knopf.disabled = !b.bereit;
    knopf.title = b.bereit ? "" : "Erst die rot markierten Punkte klären";
    tb.querySelectorAll(".abwzelle").forEach(td => td.classList.toggle("fehlt",
      b.blocker.some(x => x.zeiten && x.zeiten.some(z => z.mi === +td.dataset.mi && z.tag === td.dataset.tag))));
    const ziel = x => x.bereich === "planen"

    if (b.blocker.length){
      const box = el(`<div class="note bad"><span class="ic">!</span><span><b>Bevor der Plan entstehen kann</b></span></div>`);
      const inhalt = box.querySelector("span:last-child");

        (x.alter || []).forEach(mi => {
          const m = state.mitarbeiter[mi];
          const r = el(`<div class="bereit-alter"><b>${esc(m.name)}</b>

          r.querySelector("[data-voll]").onclick = () => { m.volljaehrig = true; sichern(); bereitZeigen(); };
          r.querySelector("[data-minder]").onclick = () => { m.volljaehrig = false; sichern(); bereitZeigen(); };
          inhalt.appendChild(r);
        });
      });
      bereitBox.appendChild(box);
    }
    if (b.hinweise.length){
      const box = el(`<details class="bereit-hinweise"${b.blocker.length ? "" : " open"}><summary><b>${b.hinweise.length}

      b.hinweise.forEach(x => box.appendChild(el(`<div class="bereit-zeile"><span>${esc(x.text)}</span>${ziel(x)}</div>`)));
      bereitBox.appendChild(box);
    }
    bereitBox.querySelectorAll("[data-bereich]").forEach(k => k.onclick = () => oeffneBereich(k.dataset.bereich, "planen"));
    bereitBox.querySelectorAll("[data-zeigen]").forEach(k => k.onclick = () => {
      const erste = tb.querySelector(".abwzelle.fehlt");
      if (erste){ erste.scrollIntoView({block:"center", behavior:"smooth"}); const f = erste.querySelector("input"); if (f) f.focus(); }
    });
  }
  bereitZeigen();

  p.querySelector("#kw").onchange = e => { planWoche = e.target.value; render(); };
  p.querySelector("#zurueck").onclick = () => { ansicht = "start"; render(); };
  p.querySelector("#erzeugen").onclick = async () => {
    if (!bereitschaft(sl).bereit){ bereitZeigen(); bereitBox.scrollIntoView({block:"center", behavior:"smooth"}); return; }
    // Bevor geplant wird: Sind die Abgaben der Mitarbeiter da und übernommen?
    if (ONLINE_BEREIT && state.online && state.mitarbeiter.length){
      let antwort = null;
      try { antwort = await Promise.race([abgabenHolen(sl), new Promise((_, nein) => setTimeout(() => nein(new Error("Zeitüberschreitung")), 8000))]); }
      catch(e){
        if (!confirm(`Die Abgaben der Mitarbeiter ließen sich nicht prüfen (${e.message}). Plan trotzdem erstellen?`)) return;
      }
      if (antwort){
        const offen = abgabenOffen(antwort);
        if (offen.length){
          // OK erstellt den Plan, Abbrechen führt zu den Abgaben — so tut der übliche Knopf das Erwartete
          if (!confirm(`${offen.length} ${offen.length === 1 ? "Abgabe ist" : "Abgaben sind"} noch nicht übernommen (${offen.map(a => a.name).join(", ")}). `
              + `Plan trotzdem ohne sie erstellen? (Abbrechen = erst die Abgaben ansehen)`)){ ansicht = "termine"; render(); return; }
        } else if (!antwort.vorbei && antwort.fehlen.length){
          if (!confirm(`Die Abgabe läuft noch bis ${fristText(antwort.frist)} — ${antwort.fehlen.length} haben noch nicht abgegeben `
              + `(${antwort.fehlen.join(", ")}). Plan trotzdem jetzt erstellen?`)) return;
        }
      }
    }

    if (ph.art === "sparen" && ph.sparArt === "stunden" && !(nz(ph.stunden) > 0)){

    }
    if (ph.art === "mehr" && !(nz(ph.mehr) > 0)){
      alert("Bitte eintragen, wie viele Stunden zusätzlich gebraucht werden."); return;
    }
    // Ein gültiger Plan der Woche bleibt gültig, bis der neue Entwurf freigegeben ist. Nur ein
    // schon begonnener Entwurf ginge verloren — danach wird gefragt.
    const alt = planEntwurfVon(sl);
    if (alt && alt.aenderungen.some(a => a.aktiv) && !confirm(`Für KW ${kwVon(mo)} gibt es schon einen Entwurf mit eigenen Änderungen. Neu rechnen und die Änderungen verwerfen?`)) return;
    // Rechnen dauert ein paar Sekunden — so lange zeigen, was passiert
    const schleier = el(`<div class="rechnet"><div class="rechnet-k"><div class="kreisel"></div>
      <b>Plan wird berechnet</b><span id="rechnetText">Wird gerechnet …</span>

    document.body.appendChild(schleier);
    const atmen = () => new Promise(ok => setTimeout(ok, 40));
    await atmen();
    try {
      planEntwurf = await erzeugePlanBest(isoVon(mo), ph, async t => { schleier.querySelector("#rechnetText").textContent = t; }, true);
    } finally { schleier.remove(); }
    planEntwurfAnlegen(planEntwurf);
    await speichere();
    ansicht = "entwurf"; render();
  };
  // Liegt für die Woche schon ein Entwurf, führt der kürzeste Weg dorthin zurück
  if (planEntwurfVon(sl)){
    const n = el(`<div class="note info" style="margin-bottom:14px"><span class="ic">•</span><span>Für KW ${kwVon(mo)} liegt ein Entwurf, der noch nicht freigegeben ist.
      <span class="knopfreihe"><button class="btn small" type="button">Entwurf öffnen</button></span></span></div>`);
    n.querySelector("button").onclick = () => { ansicht = "entwurf"; render(); };
    p.querySelector("#entwurfDa").appendChild(n);
  }
  return p;
}

// Ein Feld je Mitarbeiter und Tag: Auswahl, bei Zeitangaben zwei Uhrzeiten dazu
function abwFeld(abw, i, tag, nachher){
  const box = el(`<div class="abwfeld"></div>`);
  const wert = abw[i][tag];
  const art = wert ? (typeof wert === "string" ? wert : wert.a) : "";
  const s = el(`<select>${ABW.map(([v,l]) =>
    `<option value="${v}"${art === v ? " selected" : ""}>${l}</option>`).join("")}</select>`);
  box.appendChild(s);
  const zeiten = el(`<div class="abwzeiten" hidden>
    <input type="time" class="von"><input type="time" class="bis"></div>`);
  box.appendChild(zeiten);
  const vonF = zeiten.querySelector(".von"), bisF = zeiten.querySelector(".bis");
  if (wert && typeof wert === "object"){ vonF.value = wert.von || ""; bisF.value = wert.bis || ""; }

  const zeigen = () => { zeiten.hidden = !(s.value === "nur" || s.value === "ohne"); };
  const merken = () => {
    if (!s.value){ delete abw[i][tag]; }
    else if (s.value === "nur" || s.value === "ohne"){
      abw[i][tag] = {a:s.value, von:vonF.value, bis:bisF.value};
    } else abw[i][tag] = s.value;
    sichern();
    if (nachher) nachher();
  };
  s.onchange = () => { zeigen(); merken(); };
  vonF.oninput = bisF.oninput = merken;
  zeigen();
  return box;
}

// Welche Wochen stehen zur Wahl: zwei zurück, sechs nach vorn
function wochenAuswahl(gewaehlt){
  const basis = aktuellerMontag();
  const raus = [];
  for (let n = -2; n <= 6; n++){
    const d = new Date(basis); d.setDate(basis.getDate() + n*7);
    const iso = isoVon(d);
    const schon = state.plaene[wochenSchluessel(d)];
    raus.push({iso, text: `KW ${kwVon(d)} · ${deVon(d)}${n === 0 ? " · aktuell" : ""}${schon ? " · Plan vorhanden" : ""}`});
  }
  if (gewaehlt && !raus.some(w => w.iso === gewaehlt)){
    const d = montagDer(gewaehlt);
    raus.unshift({iso: gewaehlt, text: `KW ${kwVon(d)} · ${deVon(d)}`});
  }
  return raus;
}

/* ---- Terminliste --------------------------------------------------------
   Termine der Mitarbeiter — wer wann nicht kann, Urlaub, Berufsschule, nur zu
   bestimmten Zeiten — kommen über einen einzigen Eingang in die Abwesenheiten:
     · als Text, wie ihn die Seite „Termine melden“ erzeugt und die Mitarbeiter
       per WhatsApp oder Mail schicken (einfach einfügen, auch mehrere auf einmal)
     · als Excel- oder CSV-Datei nach der Vorlage
     · als .txt-Datei mit demselben Text
   Alles läuft durch dieselbe Prüfung und landet erst in einer Vorschau. Übernommen
   wird nur, was dort bestätigt wird, und der letzte Import lässt sich zurücknehmen.
   Kommen die Meldungen später einmal direkt über einen Server, ändert sich nur
   die Quelle — Prüfung und Vorschau bleiben dieselben. */

// ==== app/42-termine.js ====
/* Zeiten der Mitarbeiter: Ansicht, Vorlage, Link */

// Die Seite „Meine Zeiten“, auf der die Mitarbeiter ihre Zeiten abgeben
const TERMIN_SEITE = "https://sim-wagner.github.io/filialplaner-oberflaeche/termine.html";

// Excel-Vorlage: eine Zeile je Termin, Art als Auswahlliste, Erklärung auf Blatt 2
async function terminVorlage(){
  if (!window.ExcelJS){ alert("Excel-Bibliothek nicht geladen."); return; }
  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet("Termine");
  ws.columns = [{header:"Name", width:24}, {header:"Datum", width:13}, {header:"bis Datum", width:13},
                {header:"Art", width:16}, {header:"von", width:8}, {header:"bis", width:8}];
  ws.getRow(1).font = {bold:true};
  ws.addRow(["Beispiel: Petra Naumann", "17.11.2026", "", "nur", "08:00", "14:00"]).font = {italic:true, color:{argb:"FF888888"}};
  state.mitarbeiter.forEach(m => ws.addRow([m.name, "", "", "", "", ""]));
  for (let r = 2; r <= 200; r++){
    ws.getCell(r, 4).dataValidation = {type:"list", allowBlank:true,
      formulae:['"kann nicht,Urlaub,krank,Berufsschule,nur,nicht"'],
      showErrorMessage:true, errorTitle:"Art", error:"Bitte aus der Liste wählen."};
    ws.getCell(r, 2).numFmt = "dd.mm.yyyy"; ws.getCell(r, 3).numFmt = "dd.mm.yyyy";
  }
  ws.views = [{state:"frozen", ySplit:1}];
  const h = wb.addWorksheet("So geht's");
  [["So wird die Liste ausgefüllt"], [""],
   ["Name", "wie im Personal (Vor- und Nachname). Ein Vorname allein reicht, wenn er eindeutig ist."],
   ["Datum", "der Tag, z. B. 17.11.2026"],
   ["bis Datum", "nur bei mehreren Tagen am Stück, z. B. Urlaub — sonst leer lassen"],
   ["Art", "kann nicht · Urlaub · krank · Berufsschule · nur · nicht"],
   ["von / bis", "nur bei „nur“ (arbeitet nur in dieser Zeit) und „nicht“ (in dieser Zeit nicht)"],
   [""], ["Eine Zeile je Termin. Sonntage und Feiertage werden übersprungen."],
   ["Die Datei danach in der App unter „Plan erstellen“ → Terminliste → „Einlesen“ hineinziehen."]]
    .forEach(z => h.addRow(z));
  h.getColumn(1).width = 14; h.getColumn(2).width = 90; h.getRow(1).font = {bold:true, size:13};
  const buf = await wb.xlsx.writeBuffer();
  await anbieten(new Blob([buf], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}),
                 `Terminliste_Vorlage_N${state.nr}.xlsx`);
}

/* ---- Online-Abgabe der Mitarbeiter ----------------------------------------
   Die Mitarbeiter geben ihre Zeiten auf der Seite „Meine Zeiten“ ab (Filiale,
   Filial-Code, Name). Die Abgaben liegen auf dem Server, bis die App sie holt.
   Der Server setzt die Frist durch — Mittwoch 23:59 Uhr vor der Planwoche — und
   legt danach für jeden, der nichts abgegeben hat, eine leere Abgabe an: frei
   verfügbar. Die App gleicht dafür die Namen des Personals mit dem Server ab.
   Abgeholte Abgaben laufen durch dieselbe Vorschau wie jede Terminliste. */

// Den Text für die WhatsApp-Gruppe zeigen statt nur zu kopieren: In der App klappt die
// Zwischenablage nicht überall, und so sieht man, was man weitergibt.
function linkKasten(wohin){
  const alt = wohin.querySelector(".linkbox");
  if (alt){ alt.remove(); return; }
  const text = `Bitte tragt bis Mittwoch 23:59 Uhr eure Zeiten für den nächsten Arbeitsplan ein: ${TERMIN_SEITE}`
    + `\nFiliale: ${state.nr} · Filial-Code: ${state.online.code}`;
  const box = el(`<div class="linkbox"><textarea readonly rows="4">${esc(text)}</textarea>
    <button class="btn small">Kopieren</button><span class="hint"></span></div>`);
  const feld = box.querySelector("textarea");
  feld.onfocus = () => feld.select();

                                                : " Der Text ist markiert — bitte kopieren (⌘C bzw. lange drücken).";

}

          <h3 style="margin:4px 0 0" id="abgStand">wird geladen …</h3>

        <span>Mitarbeiter sehen ihren eigenen Plan</span></label>${infoHtml("Laufende und nächste Woche, nur die eigenen Schichten — auf derselben Seite wie die Abgabe.", "eigener Plan")}</div>
      ${state.online.serverFehler ? `<p class="err">${esc(state.online.serverFehler)}</p>` : ""}
      <div class="kachelknoepfe">

  online();

  // --- Dateien ---
  const ablage = p.querySelector("#ablage"), feld = p.querySelector("#datei");
  ablage.onclick = () => feld.click();

  ablage.addEventListener("drop", e => lesen([...e.dataTransfer.files]));
  feld.onchange = () => { lesen([...feld.files]); feld.value = ""; };
  async function lesen(dateien){
    sagen("");
    if (!dateien.length) return;
    const alle = [];
    for (const d of dateien){
      const n = d.name.toLowerCase();
      try {
        let ein = null;
        if (n.endsWith(".xlsx")){
          if (!window.ExcelJS) return sagen("Die Excel-Bibliothek ist nicht geladen.");
          const wb = new ExcelJS.Workbook();
          await wb.xlsx.load(await d.arrayBuffer());
          const zeilen = [];
          wb.worksheets[0].eachRow(r => { const z = []; r.eachCell({includeEmpty:true}, c => z.push(c.value && c.value.result !== undefined ? c.value.result : c.value)); zeilen.push(z); });
          ein = termineAusZeilen(zeilen, d.name);
          if (!ein) return sagen(`${d.name}: keine Spalten „Name“ und „Datum“ gefunden. Am sichersten geht es mit der Vorlage.`);
        } else if (n.endsWith(".csv")){
          ein = termineAusZeilen(csvZeilen(await d.text()), d.name);
          if (!ein) return sagen(`${d.name}: keine Spalten „Name“ und „Datum“ gefunden. Am sichersten geht es mit der Vorlage.`);
        } else if (n.endsWith(".txt") || d.type === "text/plain"){
          ein = termineAusText(await d.text()).map(e => Object.assign(e, {quelle: d.name + ", " + e.quelle}));
        } else return sagen(`${d.name}: Dieses Format kann die Terminliste nicht lesen — Excel, CSV oder Text.`);
        alle.push(...ein);
      } catch(e){ return sagen(`${d.name} ließ sich nicht lesen: ${e.message}`); }
    }
    if (!alle.length) return sagen("In der Datei stand kein Termin.");
    zeigen(termineVorbereiten(alle), dateien.map(d => d.name).join(", "));
  }

  // --- Text ---
  p.querySelector("#pruefen").onclick = () => {
    sagen("");
    const ein = termineAusText(p.querySelector("#text").value);
    if (!ein.length) return sagen("Im Text stand keine Zeile mit Datum. Eine Zeile sieht so aus: „Di 17.11.2026: kann nicht“.");
    zeigen(termineVorbereiten(ein), "dem eingefügten Text");
  };

  // --- Vorschau ---
  function vorschau(){
    const box = p.querySelector("#vorschau");
    box.innerHTML = "";
    if (!terminVorschau) return;
    const z = terminVorschau.zeilen;
    const nutzbar = z.filter(x => x.status === "ok" || x.status === "ersetzt");
    const fehler = z.filter(x => x.status === "fehler");
    const offen = [...new Set(fehler.filter(x => x.offenerName).map(x => x.nameRoh))];
    const wochen = [...new Set(nutzbar.map(x => x.sl))].sort();
    const mitPlan = wochen.filter(sl => state.plaene[sl]);
    nutzbar.forEach(x => { if (x.an === undefined) x.an = true; });
    // freie Tage ohne Änderung zählen nicht als „erledigt“ — sonst stünde dort jede Woche eine große Zahl
    const erledigt = z.filter(x => x.status === "gleich" && x.art !== "frei").length;

    const kopf = el(`<div class="note ${fehler.length ? "warn" : "ok"}" style="margin-top:16px"><span class="ic">${fehler.length ? "!" : "✓"}</span>
      <span><b>${nutzbar.length} ${nutzbar.length === 1 ? "Tag" : "Tage"} zum Übernehmen</b>${wochen.length
        ? ` in ${wochen.map(sl => "KW " + sl.slice(-2)).join(", ")}` : ""}${fehler.length
        ? ` · <b>${fehler.length} ${fehler.length === 1 ? "Zeile" : "Zeilen"} mit Problem</b> — ${fehler.length === 1 ? "sie wird" : "sie werden"} nicht übernommen` : ""}${
        erledigt ? ` · ${erledigt} schon erledigt oder übersprungen` : ""}.</span></div>`);
    box.appendChild(kopf);

    // Unbekannte Namen gleich hier zuordnen — wird gemerkt
    if (offen.length){
      const zu = el(`<div class="tile" style="margin-top:10px"><span class="eyebrow">Wer ist gemeint?${infoHtml("Die Zuordnung wird gemerkt — beim nächsten Mal klappt es von selbst.", "Zuordnung")}</span>
        <div class="namenzuordnung"></div></div>`);
      offen.forEach(n => {
        const r = el(`<label class="f">„${esc(n || "ohne Namen")}“<select><option value="">— auswählen —</option>${
          state.mitarbeiter.map(m => `<option>${esc(m.name)}</option>`).join("")}</select></label>`);
        r.querySelector("select").onchange = e => {
          if (!e.target.value) return;
          if (n){ state.namensZuordnung = state.namensZuordnung || {}; state.namensZuordnung[namensForm(n)] = e.target.value; }
          const i = state.mitarbeiter.findIndex(m => m.name === e.target.value);
          terminVorschau.zeilen.forEach(x => {
            if (!x.offenerName || x.nameRoh !== n) return;
            delete x.offenerName; x.i = i;
            terminVergleichen(x);
          });
          sichern(); vorschau();
        };
        zu.querySelector(".namenzuordnung").appendChild(r);
      });
      box.appendChild(zu);
    }

    // Tage ohne Einschränkung aus der Online-Abgabe nicht einzeln zeigen, sondern zusammengefasst
    const nurFrei = x => x.art === "frei" && x.status === "gleich";
    const ganzFrei = [...new Set(z.filter(x => x.online && x.i >= 0).map(x => x.i))]
      .filter(i => z.filter(x => x.i === i).every(nurFrei));
    if (ganzFrei.length) box.appendChild(el(`<p class="sub" style="margin-top:10px">Die ganze Woche frei verfügbar:
      ${ganzFrei.map(i => esc(state.mitarbeiter[i].name)).join(", ")}</p>`));
    const sortiert = z.filter(x => !nurFrei(x)).sort((a,b) => (a.i - b.i) || ((a.datum || 0) - (b.datum || 0)));
    const tab = el(`<div class="tablewrap" style="margin-top:10px"><table class="termintabelle"><thead><tr>
      <th></th><th>Mitarbeiter</th><th>Tag</th><th>Termin</th><th>Hinweis</th></tr></thead><tbody></tbody></table></div>`);
    sortiert.forEach(x => {
      const nutzt = x.status === "ok" || x.status === "ersetzt";
      const wer = x.i >= 0 ? state.mitarbeiter[x.i].name : (x.nameRoh || "—");
      const tag = x.datum ? x.datum.toLocaleDateString("de-DE", {weekday:"short", day:"2-digit", month:"2-digit", year:"numeric"}) : "—";
      const was = x.art ? terminArtText(x.art, x.zVon, x.zBis) : "—";
      const tr = el(`<tr class="t-${x.status}">
        <td>${nutzt ? `<input type="checkbox"${x.an ? " checked" : ""} aria-label="übernehmen">` : x.status === "fehler" ? "✗" : "="}</td>
        <td>${esc(wer)}</td><td>${esc(tag)}</td><td>${esc(was)}</td>
        <td>${esc(x.grund || (x.plan ? "Plan dieser Woche gibt es schon" : ""))}<span class="hint">${
          x.grund || x.plan ? " · " : ""}${esc(x.quelle)}</span></td></tr>`);
      const cb = tr.querySelector("input");
      if (cb) cb.onchange = () => { x.an = cb.checked; knopf(); };
      tab.querySelector("tbody").appendChild(tr);
    });
    box.appendChild(tab);

    const fuss = el(`<div class="actions" style="border-top:0;padding-top:6px">
      <button class="btn ghost" id="verwerfen">Verwerfen</button><div class="spacer"></div>
      <button class="btn" id="uebernehmen"></button></div>`);
    box.appendChild(fuss);
    const knopf = () => {
      const n = nutzbar.filter(x => x.an).length;
      const b = fuss.querySelector("#uebernehmen");
      b.textContent = n ? `${n} ${n === 1 ? "Tag" : "Tage"} übernehmen` : "nichts ausgewählt";
      b.disabled = !n;
    };
    knopf();
    fuss.querySelector("#verwerfen").onclick = () => { terminVorschau = null; vorschau(); };
    fuss.querySelector("#uebernehmen").onclick = async () => {
      const wahl = nutzbar.filter(x => x.an);
      if (!wahl.length) return;
      const ersetzt = wahl.filter(x => x.status === "ersetzt").length;
      if (ersetzt && !confirm(`${ersetzt} schon eingetragene ${ersetzt === 1 ? "Angabe wird" : "Angaben werden"} überschrieben. Weiter?`)) return;
      const wo = termineUebernehmen(wahl, terminVorschau.quelle);
      // Online-Abgaben als übernommen merken — auch die, bei denen sich nichts geändert hat
      const antwort = terminVorschau.antwort;
      if (antwort){
        state.onlineImport = state.onlineImport || {};
        const g = state.onlineImport[antwort.woche] = state.onlineImport[antwort.woche] || {};
        antwort.abgaben.forEach(a => g[a.name] = a.abgegeben);
      }
      terminVorschau = null;
      await speichere();
      const plaeneDa = wo.filter(sl => state.plaene[sl]);
      p.querySelector("#text").value = "";
      vorschau(); letzter(); online();
      p.querySelector("#letzter").prepend(el(`<div class="note ok" style="margin-top:14px"><span class="ic">✓</span><span>
        <b>${wahl.length} ${wahl.length === 1 ? "Tag" : "Tage"} übernommen.</b>${plaeneDa.length
          ? ` ${plaeneDa.map(sl => "KW " + sl.slice(-2)).join(", ")} ${plaeneDa.length === 1 ? "hat" : "haben"} schon einen Plan — betroffene Schichten stehen unter „Plan ändern“.`
          : " Sie stehen beim nächsten Plan drin."}</span></div>`));
    };
  }

  // --- Letzter Import, zum Zurücknehmen ---
  function letzter(){
    const box = p.querySelector("#letzter");
    box.innerHTML = "";
    // Dieselbe Liste wie in „Plan erstellen“: so steht es jetzt für die Planwoche
    const stand = p.querySelector("#abwStand");
    stand.innerHTML = "";
    stand.appendChild(abwListeKarte(wochenSchluessel(montagDer(planWoche || isoVon(naechsteWocheOhnePlan()))), () => { sichern(); letzter(); }));
    const imp = state.terminImport;
    if (!imp) return;
    const z = el(`<p class="hint" style="margin-top:14px">Zuletzt eingelesen am ${new Date(imp.am).toLocaleString("de-DE",
      {day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit"})}: ${imp.anzahl} ${imp.anzahl === 1 ? "Tag" : "Tage"}
      aus ${esc(imp.quelle)}. <button class="btn ghost small" id="rueck">rückgängig machen</button></p>`);
    z.querySelector("#rueck").onclick = async () => {
      if (!confirm("Den letzten Import zurücknehmen? Was vorher eingetragen war, kommt zurück.")) return;
      const n = terminImportZuruecknehmen();
      await speichere(); letzter();
      box.prepend(el(`<div class="note ok" style="margin-top:14px"><span class="ic">✓</span><span>${n} ${n === 1 ? "Tag" : "Tage"} zurückgenommen.</span></div>`));
    };
    box.appendChild(z);
  }

  p.querySelector("#zurueck").onclick = () => { terminVorschau = null; ansicht = "planen"; render(); };
  vorschau(); letzter();
  return p;
}

// Der Hinweis, der auf der Startseite steht, solange etwas abzulaufen droht
function archivHinweis(){
  const {bald, weg} = archivFaellig();
  if (!bald.length && !weg.length) return null;
  const box = el(`<div class="note warn" style="margin-bottom:14px"><span class="ic">!</span>
    <span><b>Das Archiv wird aufgeräumt.</b>
    ${weg.length ? `${[...new Set(weg.map(x => "KW " + x.sl.slice(-2)))].join(", ")} ${weg.length === 1 ? "ist" : "sind"} älter als ${ARCHIV_WOCHEN} Wochen und
       ${weg.length === 1 ? "wird" : "werden"} mit „Jetzt löschen“ gelöscht. ` : ""}
    ${bald.length ? (n => `${[...new Set(bald.map(x => "KW " + x.sl.slice(-2)))].join(", ")} in ${n} ${n === 1 ? "Woche" : "Wochen"}. `)(Math.min(...bald.map(x => x.wochen))) : ""}
    Vorher sichern, was du behalten willst.
    <span class="knopfreihe"></span></span></div>`);
  const reihe = box.querySelector(".knopfreihe");
  const sichern = el(`<button class="btn ghost small">Archiv sichern</button>`);
  sichern.onclick = () => archivSichern();
  const ok = el(`<button class="btn ghost small">${weg.length ? "Jetzt löschen" : "Verstanden"}</button>`);
  ok.onclick = async () => {
    state.archivGewarnt = state.archivGewarnt || {};
    bald.concat(weg).forEach(x => state.archivGewarnt[x.art + ":" + x.sl] = true);
    archivAufraeumen();
    await speichere();
    render();
  };
  reihe.appendChild(sichern); reihe.appendChild(ok);
  return box;
}

// Das ganze Archiv als eine Datei
function archivSichern(){
  const paket = {art:"filialplaner-archiv", filiale: state.nr, erstellt: new Date().toISOString(),
                 plaene:{}, listen:{}};
  archivSchluessel().forEach(sl => paket.plaene[sl] = state.plaene[sl]);
  listenArchivSchluessel().forEach(sl => paket.listen[sl] = state.listen[sl]);
  anbieten(new Blob([JSON.stringify(paket, null, 2)], {type:"application/json"}),
           `Filialplaner-Archiv-N${state.nr}-${new Date().toISOString().slice(0,10)}.json`);
}
