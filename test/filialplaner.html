/* JavaScript hält ä, ö, ü und ß nicht für Buchstaben: \\b fände in „früher“ das Wort „fr“
   und vor „übermorgen“ gar keine Grenze. G() ersetzt \\b deshalb durch eine Grenze, die
   deutsche Buchstaben kennt. Jedes Muster dieses Teils läuft durch G(). */
const A_GRENZE = "(?:(?<=[a-zäöüß0-9])(?![a-zäöüß0-9])|(?<![a-zäöüß0-9])(?=[a-zäöüß0-9]))";
const _aMuster = new Map();
function G(re){
  if (re.global) return new RegExp(re.source.replace(/\\b/g, A_GRENZE), re.flags);       // mit Stand (lastIndex) — nie teilen
  const k = re.source + "/" + re.flags;
  if (!_aMuster.has(k)) _aMuster.set(k, new RegExp(re.source.replace(/\\b/g, A_GRENZE), re.flags));
  return _aMuster.get(k);
}
const aNeu = (quelle, schalter) => G(new RegExp(quelle, schalter));

// Abstand zweier Wörter in Tippfehlern (Einfügen, Löschen, Ersetzen, Vertauschen)
function aAbstand(a, b){
  if (Math.abs(a.length - b.length) > 2) return 3;
  const d = [];
  for (let i = 0; i <= a.length; i++){
    d[i] = [i];
    for (let j = 1; j <= b.length; j++){
      if (i === 0){ d[0][j] = j; continue; }
      const k = a[i - 1] === b[j - 1] ? 0 : 1;
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + k);
      if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
    }
  }
  return d[a.length][b.length];
}

// Ein Wort auf seine bekannte Form bringen: Umlaute ausgeschrieben, Endungen, Tippfehler
function aKanon(w){
  if (!G(/^[a-zäöüß]+$/).test(w)) return w;
  if (w === "sonnabend") return "samstag";
  if (A_WORTE.has(w) || A_STOPP.has(w)) return w;
  const uml = w.replace(G(/ae/g), "ä").replace(G(/oe/g), "ö").replace(G(/ue/g), "ü");
  if (A_WORTE.has(uml)) return uml === "sonnabend" ? "samstag" : uml;
  for (const e of ["s", "en", "e", "n"]) if (uml.length - e.length >= 5 && uml.endsWith(e) && A_WORTE.has(uml.slice(0, -e.length))) return uml.slice(0, -e.length);
  if (uml.length < 5) return w;
  const grenze = uml.length >= 9 ? 2 : 1;
  let best = grenze + 1, wort = null;
  A_UNSCHARF.forEach(k => { const a = aAbstand(uml, k); if (a < best){ best = a; wort = k; } });
  return wort ? (wort === "sonnabend" ? "samstag" : wort) : w;
}

/* Wer im Text gemeint ist. Genau (Vor- oder Nachname) geht vor Kurzform („Andi“, „Kev“),
   Kurzform vor Tippfehler. → {personen: [Name], mehrdeutig: [[Name, Name]], stellen: Set} */
function aPersonen(woerter){
  const ms = state.mitarbeiter, teile = ms.map(m => m.name.toLowerCase().split(G(/\s+/)));
  const alle = ms.map((m, i) => i);
  const treffer = [];
  woerter.forEach((w, pos) => {
    if (!G(/^[a-zäöüß]+$/).test(w)) return;
    const bekannt = A_WORTE.has(w) || A_STOPP.has(w) || A_TAGE.some(([, k]) => k === w);
    // Vorname immer; Nachname nur, wenn er kein Wort des Assistenten ist („Aushilfe“, „Jung“ bleibt möglich)
    const anrede = pos > 0 && (woerter[pos - 1] === "frau" || woerter[pos - 1] === "herr");       // „Frau Jung“ meint den Nachnamen
    let k = alle.filter(i => teile[i][0] === w || ((!bekannt || anrede) && teile[i].slice(1).includes(w)));
    if (!k.length && !bekannt){
      const stamm = w.replace(G(/(chen|lein|le|i|y)$/), "");
      const kurz = (vor, s) => s.length >= 3 && vor.startsWith(s) && (s.length >= 4 || vor.length - s.length <= 3);
      // Koseform: „Evi“ für Eva, „Hansi“ für Hans — der Stamm darf bei kurzen Namen zwei Buchstaben haben
      const kose = (vor, s) => kurz(vor, s) || (s.length === 2 && vor.startsWith(s) && vor.length <= 4);
      k = alle.filter(i => kurz(teile[i][0], w) || (stamm !== w && kose(teile[i][0], stamm)));
      if (!k.length && w.length >= 4){
        const grenze = w.length >= 8 ? 2 : 1;
        let best = grenze + 1;
        alle.forEach(i => teile[i].forEach(t => {
          if (t.length < 4) return;
          const a = aAbstand(w, t);
          if (a < best){ best = a; k = [i]; } else if (a === best && a <= grenze && !k.includes(i)) k.push(i);
        }));
        if (best > grenze) k = [];
      }
    }
    if (k.length) treffer.push({pos, k});
  });
  // Vor- und Nachname hintereinander meinen dieselbe Person
  for (let n = treffer.length - 1; n > 0; n--){
    const a = treffer[n - 1], b = treffer[n];
    const beide = a.k.filter(i => b.k.includes(i));
    if (b.pos === a.pos + 1 && beide.length){ a.k = beide; a.bis = b.pos; treffer.splice(n, 1); }
  }
  const personen = [], mehrdeutig = [], stellen = new Set();
  treffer.forEach(t => {
    stellen.add(t.pos); if (t.bis) stellen.add(t.bis);
    if (t.k.length === 1){ if (!personen.includes(ms[t.k[0]].name)) personen.push(ms[t.k[0]].name); }
    else mehrdeutig.push(t.k.map(i => ms[i].name));
  });
  return {personen, mehrdeutig, stellen};
}

/* Tage im Text → {tage: [0–5], sonntag, andereWoche, ausserhalb} */
function aTage(t, mo){
  const tage = new Set();
  const wort = A_TAGE.map(([lang, kurz]) => lang + "|" + kurz).join("|");
  const index = w => A_TAGE.findIndex(([lang, kurz]) => w === lang || w === kurz);
  const heute = new Date(); heute.setHours(12, 0, 0, 0);
  const hi = Math.round((heute - mo) / 864e5);            // heute als Tag der Woche (kann außerhalb liegen)
  let ausserhalb = false, r;
  const nimm = k => { if (k >= 0 && k < 6) tage.add(k); else ausserhalb = true; };
  const sonntag = G(/\bsonntags?\b/).test(t);
  const andereWoche = G(/\b(nächste[nr]?|kommende[nr]?|übernächste[nr]?|letzte[nr]?|vorige[nr]?) woche\b/).test(t);
  t = t.replace(G(/\bheute (morgen|früh)\b/g), "heute").replace(G(/\bmorgen früh\b/g), "morgen");

  const bereich = aNeu(`\\b(${wort})\\b ?(?:-|bis(?: einschließlich| zum)?) ?\\b(${wort})\\b`, "g");
  while ((r = bereich.exec(t))){ const a = index(r[1]), b = index(r[2]); for (let k = Math.min(a, b); k <= Math.max(a, b); k++) tage.add(k); }
  t = t.replace(bereich, " ");
  const ab = aNeu(`\\b(?:ab|seit) (${wort}|heute|morgen|übermorgen)\\b`).exec(t);
  const bis = aNeu(`\\bbis (${wort})\\b`).exec(t);
  const rest = G(/\brest der woche\b|\brestliche[nr]? woche\b|\bende der woche\b|\bbis auf weiteres\b|\bbis samstag\b/).test(t);
  const rel = w => w === "heute" ? hi : w === "morgen" ? hi + 1 : w === "übermorgen" ? hi + 2 : index(w);
  if (ab || bis || rest){
    const von = ab ? rel(ab[1]) : Math.max(0, hi), ende = bis ? index(bis[1]) : 5;
    if (von > 5) ausserhalb = true;
    for (let k = Math.max(0, von); k <= ende; k++) tage.add(k);
    t = t.replace(aNeu(`\\b(?:ab|seit|bis) (${wort}|heute|morgen|übermorgen)\\b`, "g"), " ");
  }
  if (G(/\bganze[nr]? woche\b|\bkomplette[nr]? woche\b|\bdie woche\b|\balle tage\b|\bjeden tag\b|\bganze[nr]? woche\b|\bwoche lang\b/).test(t)) A_TAGE.forEach((_, k) => tage.add(k));
  if (G(/\bwochenende\b/).test(t)) tage.add(5);
  const einzel = aNeu(`\\b(${wort})\\b`, "g");
  while ((r = einzel.exec(t))) tage.add(index(r[1]));
  if (G(/\bheute\b/).test(t)) nimm(hi);
  if (G(/\bübermorgen\b/).test(t)) nimm(hi + 2);
  else if (G(/\bmorgen\b/).test(t)) nimm(hi + 1);
  if (G(/\bgestern\b/).test(t)) nimm(hi - 1);
  const datum = /\b(\d{1,2})\.(\d{1,2})\./g;
  while ((r = datum.exec(t))){ const d = new Date(mo); d.setMonth(+r[2] - 1, +r[1]); nimm(Math.round((d - mo) / 864e5)); }
  const tagImMonat = /\bam (\d{1,2})\.(?!\d)/g;
  while ((r = tagImMonat.exec(t))){
    const k = [0, 1, 2, 3, 4, 5].find(n => new Date(mo.getTime() + n * 864e5).getDate() === +r[1]);
    nimm(k === undefined ? -1 : k);
  }
  return {tage: [...tage].sort((a, b) => a - b), sonntag, andereWoche, ausserhalb};
}

/* Uhrzeiten im Text → {von, bis} | {nurAb, nurBis} | {relativ: {art, min, ende}} | {dauer} */
function aZeit(t){
  t = t.replace(G(/\b\d{1,2}\.\d{1,2}\.(\d{2,4})?/g), " ").replace(G(/\bam \d{1,2}\.(?!\d)/g), " ");     // Datum ist keine Uhrzeit
  t = t.replace(G(/\bhalb (\d{1,2})\b/g), (_, h) => `${h - 1}:30`).replace(G(/\b(ab|bis|um|gegen) mittags?\b/g), "$1 12");
  t = t.replace(G(/(\d) ?h\b/g), "$1 stunden").replace(G(/(\d{1,2}) uhr (\d{2})\b/g), "$1:$2");
  const z = "(\\d{1,2})(?:[:.](\\d{2}))?";
  const min = (h, m) => (+h) * 60 + (m ? +m : 0);
  const nachmittag = m => m >= 60 && m < 5 * 60 ? m + 12 * 60 : m;          // „bis 3“ meint 15 Uhr
  const raus = {};
  // Dauer: „eine Stunde“, „30 Minuten“, „anderthalb Stunden“
  const zahl = {"eine halbe": 0.5, "halbe": 0.5, "anderthalb": 1.5, "eineinhalb": 1.5, "eine": 1, "einer": 1, "ein": 1, "zwei": 2, "drei": 3, "vier": 4};
  const d = G(/\b(\d+(?:[.,]\d+)?|eine halbe|halbe|anderthalb|eineinhalb|eine|einer|ein|zwei|drei|vier) ?(stunden?|std|minuten|min)\b/).exec(t);
  let dauer = null;
  if (d){
    const n = zahl[d[1]] !== undefined ? zahl[d[1]] : parseFloat(d[1].replace(",", "."));
    dauer = Math.round(G(/^min/).test(d[2]) ? n : n * 60);
    t = t.replace(d[0], " ");
  }
  const richtung = G(/\b(später|früher|eher|länger|kürzer)\b/).exec(t);
  const r = aNeu(`(?:von )?\\b${z} ?(?:uhr)? ?(?:-|bis) ?${z}`).exec(t);
  if (r && +r[1] < 24 && +r[3] <= 24){
    let von = min(r[1], r[2]), bis = min(r[3], r[4]);
    if (bis <= von && bis <= 12 * 60) bis += 12 * 60;
    return {von, bis};
  }
  const bis = aNeu(`\\bbis ?(?:um |gegen )?${z}`).exec(t);
  const ab = aNeu(`\\b(?:ab|um|gegen)\\s*${z}`).exec(t);
  // „geht um 15“ ist ein Ende, „kommt um 9“ ein Anfang
  const ende = G(/\b(geht|gehen|feierabend|schluss|aufhören|hört auf|weg|los)\b/).test(t);
  if (bis) raus.nurBis = nachmittag(min(bis[1], bis[2]));
  if (ab){ if (ende && !bis) raus.nurBis = nachmittag(min(ab[1], ab[2])); else raus.nurAb = nachmittag(min(ab[1], ab[2])); }
  if (raus.nurAb === undefined && raus.nurBis === undefined){
    if (G(/\bnur vormittags?\b|\bvormittags\b/).test(t)) raus.nurBis = 13 * 60;
    if (G(/\bnur nachmittags?\b|\bnachmittags\b/).test(t)) raus.nurAb = 13 * 60;
  }
  if (raus.nurAb !== undefined || raus.nurBis !== undefined)
    return {nurAb: raus.nurAb === undefined ? null : raus.nurAb, nurBis: raus.nurBis === undefined ? null : raus.nurBis};
  if (richtung){
    const anfang = G(/\b(kommt|kommen|fängt|anfangen|anfängt|beginnt|beginnen|startet|da sein)\b/).test(t);
    const schluss = ende || G(/\b(bleibt|bleiben|länger|kürzer)\b/).test(t);
    return {relativ: {art: richtung[1] === "eher" ? "früher" : richtung[1], min: dauer, seite: anfang ? "von" : schluss ? "bis" : null}};
  }
  return dauer !== null ? {dauer} : {};
}

const aHatZeit = z => !!z && (z.von !== undefined || (z.nurAb !== null && z.nurAb !== undefined) || (z.nurBis !== null && z.nurBis !== undefined) || !!z.relativ);

function aGrund(t){
  if (G(/\bkrank|krankgeschrieben|krankmeldung|krankenschein|erkältet|grippe|fieber|migräne|\barzt\b|attest|liegt flach|magen|verletzt|\bau\b|übergeben|gesundheitlich/).test(t)) return "krank";
  if (G(/\burlaub|\bferien\b|frei genommen|freigenommen/).test(t)) return "urlaub";
  if (G(/berufsschule|\bschule\b|blockunterricht/).test(t)) return "schule";
  if (G(/kann nicht|kann (?:\S+ ){0,4}nicht|können nicht|fällt (?:\S+ ){0,3}aus|\bausfall\b|\bausfallen\b|nicht da\b|verhindert|\btermin\b|kommt nicht|kommt (?:\S+ ){0,3}nicht|\bfehlt\b|abgesagt|sagt ab|schafft es nicht|ist raus\b|nicht kommen|nicht arbeiten|\babsage\b/).test(t)) return "nicht";
  return null;
}

/* Den Text lesen: Angaben und Absicht. Ändert nichts.
   → {absicht, punkte, personen, mehrdeutig, tage, tagInfo, zeit, grund, teil, pronomen, nurAngaben, notiz, norm} */
function assistentVerstehen(text, mo){
  let roh = String(text || "").toLowerCase().replace(G(/[–—]/g), "-").replace(G(/[,;!?()"„“”'…]/g), " ").replace(G(/\s+/g), " ").trim();
  const notiz = (G(/\b(?:notiz|notiere|notier|vermerk)\b[^:]*:\s*(.+)$/i).exec(String(text || "").trim()) || [])[1] || null;
  const gruss = G(/^(hallo|hi|hey|moin|servus|guten (morgen|tag|abend)|danke|dankeschön|vielen dank|super|top|prima|perfekt|alles klar|passt|okay|ok)\b/).test(roh);
  roh = roh.replace(G(/\bguten (morgen|tag|abend)\b/g), " ").replace(G(/\bmoin moin\b/g), " ");
  // Wörter trennen: „mo-mi“ → „mo - mi“, Punkt am Wortende weg („Mo.“), Doppelpunkt nach Wörtern weg
  const woerter = roh.replace(G(/([a-zäöüß])-([a-zäöüß])/g), "$1 - $2").split(" ").filter(Boolean)
    .map(w => G(/^[a-zäöüß]+[.:]$/).test(w) ? w.slice(0, -1) : w);
  const leute = aPersonen(woerter);
  const norm = " " + woerter.map((w, n) => leute.stellen.has(n) ? w : aKanon(w)).join(" ") + " ";
  const ohneNamen = " " + woerter.map((w, n) => leute.stellen.has(n) ? "" : aKanon(w)).join(" ").replace(G(/\s+/g), " ") + " ";
  const tagInfo = aTage(ohneNamen, mo), tage = tagInfo.tage;
  const zeit = aZeit(ohneNamen);
  const grund = aGrund(ohneNamen);
  const t = ohneNamen;
  const teil = G(/\bganze[rn]? tag\b|\bden ganzen tag\b|\bkomplett\b|\bganztags\b|\bgar nicht\b/).test(t) ? "ganz"
    : G(/\bkommt später\b|\bspäter kommen\b|\berst später\b/).test(t) ? "spaeter" : G(/\bgeht früher\b|\bfrüher gehen\b|\bfrüher weg\b/).test(t) ? "frueher" : null;
  const pronomen = G(/\b(sie|er|ihn|ihm|ihr|ihre|seine|dieselbe|derselbe|die gleiche|der gleiche)\b/).test(t);
  const zurueck = G(/\bdoch nicht\b|\bwieder gesund\b|\bwieder da\b|\bwieder fit\b|\bkommt doch\b|\bkann doch\b|rückgängig|zurücknehmen|\bnimm\b.*\b(raus|zurück|weg)\b|\bstreich|\bvergiss\b|\blösch|war falsch|\birrtum\b|stimmt nicht|war ein fehler|\bzurück damit\b|\bmach das weg\b/).test(t);

  // Punkte je Absicht: Wörter und Angaben
  const p = {};
  const plus = (a, n) => { p[a] = (p[a] || 0) + n; };
  const hatLeute = leute.personen.length || leute.mehrdeutig.length;
  if (G(/\bhilfe\b|was kannst du|wie geht das|wie funktionier|\bbeispiele?\b|was kann ich (fragen|schreiben|sagen)/).test(t)) plus("hilfe", 10);
  if (zurueck) plus("zurueck", 9);
  if (G(/\bwarum\b|\bwieso\b|\bweshalb\b|\bwozu\b|aus welchem grund|\berklär/).test(t)) plus("erklaeren", 9);
  if (notiz !== null || G(/\bnotiz\b/).test(t)) plus("notiz", 9);
  if (G(/was fehlt|was ist (noch )?offen|noch zu tun|\bprobleme?\b|passt (der plan|alles|das so)|stimmt (der plan|alles)|alles (ok|okay|in ordnung|gut)\b|\bwo (ist|sind|gibt)\b.*(lücke|rot|problem)|\bwas ist rot\b|\bnoch lücken?\b|gibt es (noch )?(lücken?|probleme?)/).test(t) && !hatLeute) plus("offen", 8);
  if (G(/tausch|\bwechseln\b.*\bmit\b|\bstatt\b/).test(t)) plus("tausch", leute.personen.length >= 2 ? 9 : 6);
  if (G(/\bwer (arbeitet|macht|kommt|steht im plan)|\bwer hat (?:\S+ ){0,3}(dienst|schicht|frühschicht|spätschicht)\b|\bwer ist (?:\S+ ){0,3}(da|dran|eingeplant|eingeteilt|im laden)\b|wie viele (leute|personen)|\bbesetzung\b|\bwann (arbeitet|kommt|ist|hat|muss|fängt)\b|\bwie (arbeitet|ist .* eingeplant)\b|\barbeitet .* (heute|morgen)\b.*\?/).test(String(text || "").toLowerCase().replace(G(/[^a-zäöüß0-9?]+/g), " ")) || G(/\bwer arbeitet\b|\bwann arbeitet\b|\bwann kommt\b|\bwann muss\b/).test(t)) plus("wer", 8);
  if (G(/\bwer kann\b|\bwer (hat|hätte) (?:\S+ ){0,4}zeit\b|\bwer könnte\b|\bwer springt\b|ersetz|vertret|einspring|übernehm|übernimm|\bersatz\b|aushelfen|\bbrauche? (jemand|wen|einen|eine|ersatz)|jemand(en)? (finden|suchen|für)|lücke (füllen|schließen|stopfen)|\bwer noch\b.*\bkann\b/).test(t)) plus("ersatz", 8);
  if (G(/\bstundenkonto\b|\bkonto\b|\büberstunden\b|\bminusstunden\b|wie viele? stunden|\bstunden hat\b|\bstunden von\b|\bkonten\b/).test(t)) plus("konto", 8);
  // „Hans kann auch nicht“ setzt etwas fort — das ist ein Nein zu einem Vorschlag, kein neuer Ausfall
  if (G(/\b(keiner|keine|niemand|nein|nö|nee)\b|leider nicht|\bgeht nicht\b|klappt nicht|können (?:\S+ ){0,2}nicht|\bauch nicht\b|will nicht|wollen nicht|hat abgesagt|haben abgesagt/).test(t))
    plus("nein", G(/\bauch nicht\b/).test(t) ? 9 : hatLeute && grund && !G(/\bkeiner\b|\bniemand\b/).test(t) ? 3 : 7);
  // „Über mehrere Tage umplanen“ — der Optimierer verteilt die Woche neu
  if (G(/\bumplan|neu verteil/).test(t) && !grund) plus("umplanen", 8);
  // „Vorschläge für Mittwoch“, „Weiter: Dienstag“, „Was ist mit Freitag?“ — Schritt für Schritt durch einen Ausfall
  const vorschlagWort = G(/\bvorschl|\blösung(en)?\b|^ ?weiter\b|\bnächste[nrs]? (tag|schicht)\b/).test(t);
  const wasIstMit = G(/\bwas (ist|machen wir|tun wir) mit\b/).test(t);
  if ((vorschlagWort || wasIstMit) && !G(/\bandere/).test(t)) plus("vorschlag", 6.5);
  if (G(/\bsonst\b|andere[nrs]? (möglichkeit|lösung|weg|idee|vorschl)|\balternativ|jemand anders|jemand anderes|\bwer noch\b|\bwer sonst\b|\bnoch (jemand|wer|was|eine|einen)\b|\bweitere\b|was (geht|ginge) noch|wie (geht|ginge) es|anders lösen|\banders\b/).test(t)) plus("sonst", 7);
  if (grund) plus("ausfall", hatLeute ? 8 : 6);
  if (G(/\bfrei\b|freigeben|soll nicht arbeiten|nicht einplanen|rausnehmen|aus dem plan/).test(t) && zeit.von === undefined && grund !== "urlaub") plus("frei", 7);
  if (aHatZeit(zeit)) plus("zeit", 6 + (G(/\b(arbeitet|arbeiten|kommt|kommen|bleibt|bleiben|geht|gehen|fängt|anfangen|schluss|feierabend|länger|früher|später|kürzer)\b/).test(t) ? 1 : 0));
  if (G(/\bübernehmen\b.*\b(plan|entwurf)\b|\bspeichern\b|\bfertig\b|\bverwerfen\b/).test(t) && !hatLeute) plus("abschluss", 7);
  // Ein Ersatz-Satz mit Grund („Wer kann für Eva einspringen, sie ist krank“) bleibt eine Frage nach Ersatz
  if (p.ersatz && p.ausfall) p.ausfall -= 3;
  // „kann nicht“ als Antwort auf Vorschläge ist ein Nein, kein neuer Ausfall — das entscheidet der Zusammenhang
  if (p.zeit && p.ausfall && grund === "nicht") p.zeit += 3;                // „kann erst ab 12“
  if (p.konto && zeit.relativ) p.konto = 0;
  let absicht = null, punkte = 0;
  Object.keys(p).forEach(a => { if (p[a] > punkte){ punkte = p[a]; absicht = a; } });
  // Nur Angaben, sonst nichts: „und am Freitag?“, „Hans auch“, „Dienstag“
  const restText = (" " + woerter.map((w, n) => leute.stellen.has(n) ? "" : aKanon(w)).join(" ") + " ")
    .replace(G(/\d{1,2}([:.]\d{2})?|\d{1,2}\.\d{1,2}\./g), " ")
    .replace(aNeu(`\\b(${A_TAGE.map(x => x.join("|")).join("|")}|heute|morgen|übermorgen|und|auch|am|an|dann|bitte|für|den|die|der|das|noch|was ist mit|wie sieht es|aus|mit|ist|uhr|bis|ab|von|um|genauso|ebenfalls|gleiche|dasselbe|ganze[rn]? tag|ganze[rn]? woche|kommt später|geht früher|stunden?|minuten|eine|halbe|zwei|drei|\\-|\\?)\\b`, "g"), " ").trim();
  const nurAngaben = !restText && !!(hatLeute || tage.length || aHatZeit(zeit) || zeit.dauer !== undefined || teil);
  if (gruss && !absicht && !nurAngaben) absicht = "gruss";
  return {absicht, punkte, personen: leute.personen, mehrdeutig: leute.mehrdeutig, tage, tagInfo, zeit, grund, teil, pronomen, nurAngaben, notiz, norm,
          nurWasIstMit: wasIstMit && !vorschlagWort};
}

/* ---- Lösungsarten: welche Art von Lösung in dieser Filiale meist gewählt wird ----
   Gezählt wird nur die Art (verlängern, verschieben, jemand kommt zusätzlich …), nie,
   wer für wen eingesprungen ist — es entsteht keine Auswertung je Person. */
const LOESUNGSARTEN = {zusatz: "jemand kommt zusätzlich", verlaengern: "eine Schicht verlängern", verschieben: "eine Schicht verschieben",
  gemischt: "mehrere ändern ihre Zeiten", umplanen: "über mehrere Tage umplanen"};
function wegArt(schritte){
  const arten = new Set((schritte || []).map(x => x.art === "neu" ? "zusatz"
    : (x.bis - x.von) > (x.alt[1] - x.alt[0]) ? "verlaengern" : "verschieben"));
  return arten.size === 1 ? [...arten][0] : "gemischt";
}
function lernenMerken(art){
  if (!LOESUNGSARTEN[art]) return;
  state.lernen = state.lernen || {arten: {}};
  state.lernen.arten[art] = (state.lernen.arten[art] || 0) + 1;
}
// Vollständige Wege: die meistgewählte Art nach oben — erst ab drei Entscheidungen, vorher gilt die Rechnung
function wegeOrdnen(wege){
  const arten = (state.lernen || {}).arten || {};
  const summe = Object.keys(arten).reduce((s, k) => s + arten[k], 0);
  wege.forEach(w => { w.art = wegArt(w.schritte); w.gelernt = false; });
  if (summe < 3) return wege;
  const anteil = w => (arten[w.art] || 0) / summe;
  const voll = wege.filter(w => w.voll), rest = wege.filter(w => !w.voll);
  const liebste = voll.reduce((b, w) => anteil(w) > anteil(b) ? w : b, voll[0]);
  if (liebste && voll[0] !== liebste && anteil(liebste) > anteil(voll[0]) && anteil(liebste) >= 0.5){
    voll.splice(voll.indexOf(liebste), 1); voll.unshift(liebste); liebste.gelernt = true;
  }
  wege.splice(0, wege.length, ...voll, ...rest);
  return wege;
}

// Das Nötigste eines Wegs für die Anzeige in einer Karte (ohne die Plantage)
/* Ein Weg in einer Zeile, je Person ein kurzes Stück: „Yvonne kommt ab 12:00 · Lilly kommt 14:00–20:00“.
   Bei mehr als drei Beteiligten bleibt der Satz des Planers. */
function wegTitel(w){
  const z = w.zeilen || [];
  if (!z.length || z.length > 3) return w.titel;
  const spanne = t => String(t || "").split(" + ").filter(Boolean).map(x => x.split("–").map(minuten));
  return z.map(x => {
    const n = x.name.split(" ")[0], a = spanne(x.vorher), b = spanne(x.nachher);
    if (!a.length) return `${n} kommt ${x.nachher}`;
    if (!b.length) return `${n} hat frei`;
    if (a.length === 1 && b.length === 1){
      const [[a0, a1]] = a, [[b0, b1]] = b;
      if (b0 === a0 && b1 > a1) return `${n} bleibt bis ${hhmm(b1)}`;
      if (b1 === a1 && b0 < a0) return `${n} kommt ab ${hhmm(b0)}`;
      if (b1 === a1 && b0 > a0) return `${n} kommt erst ab ${hhmm(b0)}`;
      if (b0 === a0 && b1 < a1) return `${n} geht schon um ${hhmm(b1)}`;
    }
    return `${n} ${x.nachher} statt ${x.vorher}`;
  }).join(" · ");
}
// Was ein Weg bringt, in einer Zeile: „Lücke zu · +6,0 h“ oder „19:00–20:00 bleibt offen · +2,0 h“
const wegKurz = w => ({zeilen: w.zeilen, voll: w.voll, offen: w.offen, luecke: w.luecke, mehr: w.mehr, konto: w.konto,
  passt: `${w.voll ? "Lücke zu" : spannenText(w.offen) + " bleibt offen"} · ${w.mehr > 0.01 ? `+${h1(w.mehr)} h`
    : w.mehr < -0.01 ? `−${h1(-w.mehr)} h` : "±0 h"}${w.gelernt ? " · wählst du meist" : ""}`});

const ASSISTENT_HILFE = "Schreib, wie du es sagst, z. B. „Eva ist morgen krank“, „Hans hat Mi–Fr Urlaub“, „Bernd Mittwoch 8–14“, "
  + "„Vorschläge für Freitag“, „Was fehlt noch?“ — und „Doch nicht“, wenn etwas zurück soll.";
const ASSISTENT_START = ["Jemand fällt aus", "Wer kann einspringen?", "Was fehlt noch?", "Was kannst du?"];

function assistent(text, sl, kurz, eintrag){
  const mo = montagDer(kurz.mo);
  const pr = entwurfPruefen(sl, kurz, eintrag), plan = pr.plan;
  const k = eintrag.kontext = eintrag.kontext || {};
  const v = assistentVerstehen(text, mo);
  // „Was ist mit Freitag?“ heißt nur mitten im Schritt-für-Schritt „Vorschläge für Freitag“ — sonst Nachfrage zum Letzten
  if (v.absicht === "vorschlag" && v.nurWasIstMit && !(k.schritte || []).length) v.absicht = null;
  const vor = name => name.split(G(/\s+/))[0];
  const heuteTi = (() => { const h = new Date(); h.setHours(12, 0, 0, 0); return Math.round((h - mo) / 864e5); })();

  // ---- Rahmen: neue Absicht, Antwort auf eine Rückfrage oder Fortsetzung des Letzten ----
  let f = {absicht: v.absicht, personen: v.personen, tage: v.tage, zeit: v.zeit, grund: v.grund, teil: v.teil, notiz: v.notiz};
  const angaben = alt => ({absicht: alt.absicht,
    personen: v.personen.length ? v.personen : alt.personen || [],
    tage: v.tage.length ? v.tage : alt.tage || [],
    zeit: aHatZeit(v.zeit) ? v.zeit
      : v.zeit.dauer !== undefined && alt.zeit && alt.zeit.relativ ? {relativ: Object.assign({}, alt.zeit.relativ, {min: v.zeit.dauer})} : alt.zeit || {},
    grund: v.grund || alt.grund || null, teil: v.teil || alt.teil || null, notiz: v.notiz || alt.notiz || null});
  const offen = k.offen; k.offen = null;
  let fortsetzung = false;
  if (offen && (v.nurAngaben || !v.absicht || (v.teil && v.absicht !== "hilfe") || (v.absicht === "zeit" && offen.absicht !== "zeit" && !v.personen.length))){
    f = angaben(offen.angaben); fortsetzung = true;
    if (offen.frage === "seite" && G(/\bkommt\b|\bkommen\b|\banfang/).test(v.norm)) f.zeit = {relativ: Object.assign({}, f.zeit.relativ, {seite: "von"})};
    if (offen.frage === "seite" && G(/\bgeht\b|\bgehen\b|\bende\b|\bschluss\b/).test(v.norm)) f.zeit = {relativ: Object.assign({}, f.zeit.relativ, {seite: "bis"})};
  } else if (v.nurAngaben && k.letzte && !v.absicht){
    f = angaben(k.letzte); fortsetzung = true;
  } else if (v.nurAngaben && k.letzte && v.absicht === "zeit" && !v.personen.length && !v.tage.length){
    f = angaben(k.letzte); f.absicht = "zeit"; fortsetzung = true;
  }
  // „sie“, „er“ — oder gar kein Name — meint die Person, um die es gerade ging
  const mitKontextPerson = () => { if (!f.personen.length && k.person && personIndex(k.person) >= 0) f.personen = [k.person]; };
  if (v.pronomen) mitKontextPerson();

  // ---- Bausteine der Antwort ----
  const karte = (a, text) => Object.assign({id: aenderungsId(), aktiv: false, quelle: "assistent", text}, a);
  // Das Thema merken — Nachfragen („keiner kann“, „wie sonst?“) lassen es stehen
  const merk = () => {
    if (!["nein", "sonst", "vorschlag", "umplanen", "hilfe", "gruss", "offen", "abschluss", "zurueck"].includes(f.absicht))
      k.letzte = {absicht: f.absicht, personen: f.personen, tage: f.tage, zeit: f.zeit, grund: f.grund, teil: f.teil};
    if (f.personen.length && f.absicht !== "nein") k.person = f.personen[0];
    if (f.tage.length) k.ti = f.tage[0];
  };
  // still: Änderungen, die nicht als eigene Karte erscheinen — der Knopf „Im Plan anzeigen“ schaltet sie ein
  const antwort = (text, karten, knoepfe, still) => { merk(); k.karten = (karten || []).concat(still || []).map(a => a.id);
    return {antwort: text, karten: karten || [], still: still || [], knoepfe: (knoepfe || []).filter(Boolean), aus: [], verstanden: f}; };
  const zeigen = liste => liste.length ? {text: "Im Plan anzeigen", zeigen: liste.map(a => a.id)} : null;
  const frage = (text, knoepfe, art) => {
    k.offen = {absicht: f.absicht, frage: art || null, angaben: {absicht: f.absicht, personen: f.personen, tage: f.tage, zeit: f.zeit, grund: f.grund, teil: f.teil, notiz: f.notiz}};
    return {antwort: text, karten: [], knoepfe: knoepfe || [], aus: [], verstanden: f, rueckfrage: true};
  };
  const tagKnoepfe = name => {
    const ab = Math.max(0, Math.min(5, heuteTi));
    let tage = [0, 1, 2, 3, 4, 5].filter(ti => ti >= ab && !plan.tage[ti].feiertag && (!name || schichtenVon(plan, name, ti).length));
    if (!tage.length) tage = [0, 1, 2, 3, 4, 5].filter(ti => !plan.tage[ti].feiertag && (!name || schichtenVon(plan, name, ti).length));
    if (!tage.length) tage = [0, 1, 2, 3, 4, 5].filter(ti => !plan.tage[ti].feiertag);
    return tage.map(tagName).concat(name && tage.length > 1 ? ["Rest der Woche"] : []);
  };
  const leuteKnoepfe = tage => {
    const ti = tage && tage.length ? tage[0] : (heuteTi >= 0 && heuteTi < 6 ? heuteTi : null);
    if (state.mitarbeiter.length <= 12) return state.mitarbeiter.map(m => vor(m.name));
    const da = state.mitarbeiter.filter(m => ti === null || schichtenVon(plan, m.name, ti).length);
    return (da.length ? da : state.mitarbeiter).slice(0, 12).map(m => vor(m.name));
  };
  // „Mittwoch bis Samstag“ für aufeinanderfolgende Tage, sonst „Montag, Mittwoch“
  const tageText = tage => tage.length > 2 && tage.every((ti, n) => !n || ti === tage[n - 1] + 1)
    ? `${tagName(tage[0])} bis ${tagName(tage[tage.length - 1])}` : tage.map(tagName).join(", ");
  // Karten für die Wege einer Lücke (gleiche Rechnung wie bei den Lösungen)
  // fuer: die Änderung, an der die Lösung hängt; mit: alle, die mit eingeschaltet werden (Tausch = zwei)
  const wegKarten = (wege, fuer, mit) => wege.map(w => karte({typ: "loesung", fuer: fuer || null, mit: mit || (fuer ? [fuer] : []), ti: w.ti,
    schritte: w.schritte, titel: w.titel, art: w.art, weg: wegKurz(w)}, wegTitel(w)));
  const lueckenWege = (ti, ausschluss) => {
    const extra = (ausschluss || []).map(name => ({aktiv: true, typ: "abwesend", name, ti, grund: "nicht"}));
    return mitEntwurfsAbwesenheiten(sl, {aenderungen: eintrag.aenderungen.concat(extra)}, () =>
      wegeFuerTag(plan, ti, null, {maengel: tagesMaengel(kurz, ti), punkte: fehlzeiten(kurz, ti)}, null));
  };
  // Lässt sich eine Lücke am Tag nicht schließen: kurz, was bleibt (Umplanen nur bei einem Ausfall)
  const keinWeg = (ti, mitUmplanen) => `${tagName(ti)}${(pr.luecken[ti] || k.luecke || []).length ? " " + spannenText(pr.luecken[ti] || k.luecke) : ""}: `
    + `ohne Regelverstoß nicht lösbar. Möglich: ${mitUmplanen ? "über mehrere Tage umplanen, " : ""}eine Ausnahme (Leitung bleibt länger) oder Hilfe aus der Nachbarfiliale.`;
  // Was die Karten im Plan auslösen würden: neue Lücken, verletzte Regeln
  const folgen = karten => {
    const probe = Object.assign({}, eintrag, {aenderungen: eintrag.aenderungen.concat(karten.map(a => Object.assign({}, a, {aktiv: true})))});
    const danach = entwurfPruefen(sl, kurz, probe);
    const neu = danach.offen.filter(o => (o.art === "luecke" || o.art === "recht") && !pr.offen.some(x => x.text === o.text));
    const luecke = neu.find(o => o.art === "luecke");
    if (luecke){ k.ti = luecke.ti; k.luecke = luecke.punkte; k.kandidaten = []; }
    return {text: neu.length ? " Achtung: " + neu.map(o => o.text).join(" ") : " Besetzung und Gesetz passen damit weiter.", luecke};
  };
  const ausserhalb = () => v.tagInfo.andereWoche ? `Hier geht es um KW ${kwVon(mo)}. Für eine andere Woche oben die Woche wechseln — dann gilt, was du schreibst, für sie.`
    : v.tagInfo.sonntag ? "Sonntags ist die Filiale geschlossen — für den Tag gibt es keinen Plan."
    : v.tagInfo.ausserhalb ? `Der Tag liegt nicht in KW ${kwVon(mo)} (${deVon(mo)} bis ${deVon(new Date(mo.getTime() + 5 * 864e5))}). Meinst du einen Tag dieser Woche?` : null;

  // Mehrdeutiger Name: nachfragen, wer gemeint ist
  if (v.mehrdeutig.length && !f.personen.length)
    return frage(`Wen meinst du — ${v.mehrdeutig[0].join(" oder ")}?`, v.mehrdeutig[0]);
  if (!f.tage.length && !fortsetzung && (v.tagInfo.andereWoche || v.tagInfo.sonntag || v.tagInfo.ausserhalb)){
    const t = ausserhalb();
    if (t) return Object.assign(frage(t, v.tagInfo.ausserhalb ? tagKnoepfe(f.personen[0]) : []), {rueckfrage: !!v.tagInfo.ausserhalb});
  }

  /* Wege für einen Ausfall — auch für einen, der erst vorgeschlagen und noch nicht im Plan ist.
     ohne: Personen, die dafür nicht in Frage kommen („keiner von denen kann“). */
  const ausfallGruppe = (aus, ohne) => {
    // Wer „nicht kann“, wird nur für die Wege gesperrt — seine Schicht bleibt im Plan
    const probe = Object.assign({}, eintrag, {aenderungen: eintrag.aenderungen.filter(a => a.id !== aus.id)
      .concat(Object.assign({}, aus, {aktiv: true}))});
    return entwurfVorschlaege(sl, kurz, probe, 0, {nur: aus.id, gesperrt: ohne || []}).find(x => x.fuer.id === aus.id) || null;
  };

  // ---- Schritt für Schritt: erst die Änderung zeigen, dann Vorschläge je betroffener Schicht ----
  // k.schritte: [{name, ti, aus (Id des Ausfalls) | aend (Ids der Änderungen), zeit}], k.schrittNr: zuletzt gezeigt
  const mehrere = () => new Set((k.schritte || []).map(s => s.name)).size > 1;
  const schrittName = s => `${mehrere() ? vor(s.name) + ", " : ""}${tagName(s.ti)}`;
  const weiterKnopf = nr => { const s = (k.schritte || [])[nr + 1]; return s ? `Weiter: ${schrittName(s)}` : null; };
  // Was fehlt, wenn die Änderungen eingeschaltet wären — und die Wege, die es schließen
  // nurLuecke: nur wissen, ob etwas fehlt — ohne die (teuren) Wege zu rechnen
  const probeWege = (ti, aktiv, ohne, nurLuecke) => {
    const ids = new Set(aktiv.map(a => a.id));
    const probe = Object.assign({}, eintrag, {aenderungen: eintrag.aenderungen.filter(a => !ids.has(a.id))
      .concat(aktiv.map(a => Object.assign({}, a, {aktiv: true})))});
    const p2 = entwurfPruefen(sl, kurz, probe), luecke = p2.luecken[ti] || [];
    if (!luecke.length || nurLuecke) return {luecke, wege: [], fehlt: "", gruende: []};
    // Wer die Änderung selbst ist, wird nicht als Lösung vorgeschlagen (Bernd geht früher — nicht: Bernd bleibt doch);
    // wer „nicht kann“, ist für die Wege gesperrt, behält aber seine Schicht
    const selbst = aktiv.map(a => a.name).filter(Boolean);
    const sperre = (ohne || []).map(name => ({aktiv: true, typ: "abwesend", name, ti, grund: "nicht"}));
    const wege = mitEntwurfsAbwesenheiten(sl, Object.assign({}, probe, {aenderungen: probe.aenderungen.concat(sperre)}),
      () => wegeFuerTag(p2.plan, ti, null, {maengel: tagesMaengel(kurz, ti), punkte: fehlzeiten(kurz, ti)}, null))
      .filter(w => !w.zeilen.some(z => selbst.includes(z.name)));
    return {luecke, wege, fehlt: fehltText(p2.plan, ti, luecke), gruende: fehltGruende(p2.plan, ti, luecke)};
  };
  /* Vorschläge für einen Schritt: was fehlt (ein Satz), bis zu drei Wege als Karten, dann weiter
     zum nächsten Schritt. still: Änderungen, die mit dieser Antwort erst entstehen (Ausfall).
     o.versatz: die nächsten drei Wege („Andere Vorschläge“), o.vorweg: Satz davor. */
  const vorschlagAntwort = (nr, still, o) => {
    o = o || {};
    const s = k.schritte[nr];
    if (k.schrittNr !== nr){ k.ausgeschlossen = []; k.versatz = 0; }
    k.schrittNr = nr; k.ti = s.ti;
    const versatz = o.versatz || 0, vorweg = o.vorweg ? o.vorweg + " " : "";
    // Bei einem Ausfall die ausfallende Schicht, sonst wessen Zeit sich ändert
    const kopf = s.aus || !s.name ? `${tagName(s.ti)} ${s.zeit}`
      : (s.namen || []).length > 1 ? `${tagName(s.ti)} (${s.namen.map(vor).join(" und ")})` : `${tagName(s.ti)} (${vor(s.name)} ${s.zeit})`;
    const fuer = s.aus || (s.aend || [])[0] || null;
    let g;
    if (s.aus){
      const aus = eintrag.aenderungen.find(a => a.id === s.aus) || (still || []).find(a => a.id === s.aus);
      g = aus ? ausfallGruppe(aus, k.ausgeschlossen) : null;
      k.problem = aus ? {aus: aus.id, name: s.name, ti: s.ti, grund: aus.grund} : null;
    } else {
      g = probeWege(s.ti, eintrag.aenderungen.filter(a => (s.aend || []).includes(a.id)).concat((still || []).filter(a => (s.aend || []).includes(a.id))), k.ausgeschlossen);
      k.problem = null;
    }
    const weiter = weiterKnopf(nr);
    if (!g || !g.luecke.length) return antwort(`${vorweg}${kopf}: ${s.aus ? `Ohne ${vor(s.name)} fehlt nichts` : "Es fehlt nichts"} — niemand muss einspringen.`, [], [weiter], still);
    k.luecke = g.luecke;
    const lage = `${kopf}${s.aus ? ` ohne ${vor(s.name)}` : ""} — ${spannenText(g.luecke)} ${g.gruende.length > 1 ? "fehlen" : "fehlt"}: ${g.gruende.join(", ")}.`;
    const wege = g.wege.slice(versatz, versatz + 3);
    k.kandidaten = [...new Set(wege.flatMap(w => w.zeilen.map(z => z.name)))];
    // Ohne vollständige Lösung am Tag: über mehrere Tage umplanen anbieten (nur bei einem Ausfall)
    const umplanen = s.aus && !g.wege.some(w => w.voll) ? "Über mehrere Tage umplanen" : null;
    if (!wege.length) return antwort(`${vorweg}${versatz ? `Keine weiteren Vorschläge für ${tagName(s.ti)}. ` : lage + " "}${keinWeg(s.ti, !!s.aus)}`, [], [umplanen, weiter], still);
    return antwort(`${vorweg}${lage} ${versatz ? "Weitere Vorschläge" : "Vorschläge"}:`, wegKarten(wege, fuer, s.aus ? [s.aus] : s.aend),
      [weiter, "Keiner davon passt", g.wege.length > versatz + 3 ? "Andere Vorschläge" : null, umplanen], still);
  };

  /* Ein Ausfall: die Person fehlt an den Tagen. Erste Option: im Plan anzeigen. Zweite: Vorschläge
     für die nächste betroffene Schicht — danach Schritt für Schritt die übrigen.
     alsErsatz („Wer kann für Eva einspringen?“): gleich die Vorschläge. */
  const ausfallAntwort = (namen, tage, grund, alsErsatz) => {
    const still = [], schritte = [];
    k.kandidaten = []; k.ausgeschlossen = []; k.problem = null;
    namen.forEach(name => tage.filter(ti => !plan.tage[ti].feiertag).forEach(ti => {
      const schon = eintrag.aenderungen.find(a => a.typ === "abwesend" && a.name === name && a.ti === ti && a.aktiv);
      const s = schichtenVon(plan, name, ti);
      if (schon && !s.length) return;
      // Ein schon vorgeschlagener Ausfall wird weiterverwendet — nicht doppelt angelegt
      const aus = schon || eintrag.aenderungen.find(a => a.typ === "abwesend" && a.name === name && a.ti === ti && a.quelle === "assistent" && !a.aktiv)
        || karte({typ: "abwesend", name, ti, grund}, `${name} ${tagName(ti)}: ${GRUND_NAME[grund]}`);
      still.push(aus);
      const sch = s.length ? s : schichtenVon(kurz, name, ti);
      if (sch.length) schritte.push({name, ti, aus: aus.id, zeit: `${hhmm(sch[0].von)}–${hhmm(sch[sch.length - 1].bis)}`});
    }));
    if (!still.length) return antwort(`${namen.map(vor).join(" und ")} ${namen.length > 1 ? "sind" : "ist"} an ${tage.length > 1 ? "diesen Tagen" : "dem Tag"} schon als abwesend eingetragen.`);
    // Reihenfolge: ab heute nach Tagen, Vergangenes zuletzt
    schritte.sort((x, y) => ((x.ti < heuteTi) - (y.ti < heuteTi)) || x.ti - y.ti || namen.indexOf(x.name) - namen.indexOf(y.name));
    k.schritte = schritte; k.schrittNr = -1;
    if (alsErsatz && schritte.length) return vorschlagAntwort(0, still);
    const wer = namen.length > 1 ? namen.map(vor).join(" und ") : namen[0];
    const offeneTage = tage.filter(ti => !plan.tage[ti].feiertag);
    const amStueck = offeneTage.length > 2 && offeneTage.every((ti, n) => !n || ti === offeneTage[n - 1] + 1);
    const text = `${wer}: ${GRUND_TEXT[grund] || "fällt aus"} ${amStueck ? "von " : "am "}${tageText(offeneTage)}. `
      + (schritte.length ? `Betroffen: ${schritte.map(s => `${mehrere() ? vor(s.name) + " " : ""}${TAGE[s.ti][1]} ${s.zeit}`).join(" · ")}.`
                         : `${namen.length > 1 ? "Sie sind" : vor(namen[0]) + " ist"} dann nicht eingeplant — eintragen geht trotzdem.`);
    return antwort(text, [], [zeigen(still), schritte.length ? `Vorschläge für ${schrittName(schritte[0])}` : null], still);
  };

  /* Andere Änderungen (frei, andere Zeit, Tausch): dieselben zwei Optionen — im Plan anzeigen,
     und wenn dadurch etwas fehlt, Vorschläge für den ersten betroffenen Tag. */
  const aenderungAntwort = (text, karten) => {
    const schritte = [];
    [...new Set(karten.map(c => c.ti))].sort((x, y) => x - y).forEach(ti => {
      const hier = karten.filter(c => c.ti === ti);
      if (probeWege(ti, hier, null, true).luecke.length) schritte.push({name: hier[0].name || "", ti, aend: hier.map(c => c.id),
        namen: [...new Set(hier.map(c => c.name).filter(Boolean))],
        zeit: hier.filter(c => c.von !== undefined).map(c => `${hhmm(c.von)}–${hhmm(c.bis)}`).join(" + ") || "frei"});
    });
    k.schritte = schritte; k.schrittNr = -1; k.ausgeschlossen = [];
    const fo = folgen(karten);
    return antwort(text + fo.text, [], [zeigen(karten), schritte.length ? `Vorschläge für ${schrittName(schritte[0])}` : null], karten);
  };

  switch (f.absicht){
  case "hilfe": return antwort(ASSISTENT_HILFE, [], ASSISTENT_START.slice(0, 3));
  case "gruss": return antwort("Gern. Was soll sich am Plan ändern?", [], ASSISTENT_START.slice(0, 3));
  case "abschluss": return antwort("Das machst du oben: „Übernehmen“ macht den Entwurf zum gültigen Plan, „Entwurf verwerfen“ lässt alles, wie es war.");
  case "offen":
    if (!pr.offen.length) return antwort("Im Entwurf ist nichts offen — Besetzung, Gesetz und Abwesenheiten passen.");
    { const l = pr.offen.find(o => o.art === "luecke"); if (l){ k.ti = l.ti; k.luecke = l.punkte; } }
    return antwort("Offen ist noch: " + pr.offen.map(o => o.text).join(" "), [], pr.offen.some(o => o.art === "luecke") ? ["Wer kann einspringen?"] : []);

  case "zurueck": {
    // Mit Namen: was für die Person (an dem Tag) im Entwurf steht. Ohne: das zuletzt Vorgeschlagene.
    let ziele = eintrag.aenderungen.filter(a => a.aktiv && (f.personen.length
      ? f.personen.includes(a.name) && (!f.tage.length || f.tage.includes(a.ti))
      : (k.karten || []).includes(a.id)));
    if (!ziele.length && !f.personen.length) ziele = eintrag.aenderungen.filter(a => a.aktiv && a.quelle === "assistent").slice(-1);
    if (!ziele.length) return antwort(f.personen.length ? `Für ${f.personen.map(vor).join(" und ")} steht im Entwurf nichts, das ich zurücknehmen könnte.`
      : "Im Entwurf steht nichts von mir, das ich zurücknehmen könnte.");
    const fest = ziele.filter(a => a.quelle === "abwesenheit");
    const erg = antwort(`Zurückgenommen: ${ziele.map(a => a.text).join("; ")}.`
      + (fest.length ? " Der Eintrag unter „Urlaub & Krankheit“ bleibt — dort löschen." : ""));
    erg.aus = ziele.map(a => a.id);
    return erg;
  }

  case "erklaeren": {
    mitKontextPerson();
    if (!f.personen.length){
      if (pr.offen.length) return antwort("Rot ist, was noch nicht passt: " + pr.offen.map(o => o.text).join(" "));
      return frage("Bei wem soll ich erklären, warum er oder sie eingeplant ist?", leuteKnoepfe(f.tage));
    }
    const name = f.personen[0];
    let tage = f.tage.length ? f.tage : [0, 1, 2, 3, 4, 5].filter(ti => schichtenVon(plan, name, ti).length);
    tage = tage.filter(ti => !plan.tage[ti].feiertag);
    const voll = plan;
    const teile = tage.map(ti => {
      const e = tagesEinteilung(voll, ti), reihe = e && e.reihen.find(r => r.name === name);
      if (!reihe) return f.tage.length ? `${tagName(ti)}: ${vor(name)} hat frei.` : null;
      const b = schichtBegruendung(voll, ti, reihe, e);
      return `${tagName(ti)} ${hhmm(reihe.schicht.von)}–${hhmm(reihe.schicht.bis)}: ` + (f.tage.length ? b.saetze.join(" ") : b.saetze[0]);
    }).filter(Boolean);
    if (!teile.length) return antwort(`${name} ist in dieser Woche nicht eingeplant.`);
    return antwort(teile.join(" ") + (f.tage.length ? "" : " Für die ganze Begründung einen Tag nennen — oder unter „Analyse“ in die Tagesanalyse schauen."));
  }

  case "notiz": {
    if (!f.tage.length) return frage("Für welchen Tag ist die Notiz?", tagKnoepfe());
    if (!f.notiz) return frage(`Was soll am ${tagName(f.tage[0])} in der Zeile „Notiz“ stehen? Schreib: „Notiz ${tagName(f.tage[0])}: …“`);
    const notizen = f.tage.map(ti => karte({typ: "notiz", ti, notiz: f.notiz}, `Notiz ${tagName(ti)}: ${f.notiz}`));
    return antwort(`${notizen.map(c => c.text).join(" · ")}.`, [], [zeigen(notizen)], notizen);
  }

  case "wer": {
    if (f.personen.length){
      const teile = f.personen.map(name => {
        const tage = (f.tage.length ? f.tage : [0, 1, 2, 3, 4, 5]).map(ti => [ti, schichtText(plan, name, ti)]).filter(x => x[1] || f.tage.length);
        return `${name}: ` + (tage.length ? tage.map(([ti, s]) => `${TAGE[ti][1]} ${s || "frei"}`).join(", ") : "in dieser Woche nicht eingeplant") + ".";
      });
      return antwort(teile.join(" "));
    }
    const tage = f.tage.length ? f.tage : (heuteTi >= 0 && heuteTi < 6 ? [heuteTi] : []);
    if (!tage.length) return frage("Für welchen Tag?", tagKnoepfe());
    return antwort(tage.map(ti => plan.tage[ti].feiertag ? `${tagName(ti)}: Feiertag.` : `${tagName(ti)}: `
      + (state.mitarbeiter.map(m => [m.name, schichtText(plan, m.name, ti)]).filter(x => x[1]).map(([n, s]) => `${vor(n)} ${s}`).join(", ") || "niemand eingeplant") + ".").join(" "));
  }

  case "konto": {
    if (v.pronomen) mitKontextPerson();
    const zeile = name => {
      const m = state.mitarbeiter[personIndex(name)], x = kontoNach(plan, platzImPlan(plan, name));
      if (!x && m && istAushilfe(m)){
        const a = aushilfeMonat(name, planMonat(plan), plan);
        return `${name} ist Aushilfe: im ${a.monatsname} ${h1(a.ist)} von höchstens ${hGenau(a.grenze)} h geplant.`;
      }
      // Azubis: kein Konto — genau die Betriebsstunden
      if (!x && m && istAzubi(m)){
        const s = stundenNach(plan, platzImPlan(plan, name));
        if (s) return `${name} hat im Entwurf ${h1(s.ist)} h in dieser Woche (Betriebsstunden ${h1(s.soll)} h). Azubis haben kein Konto.`;
      }
      if (!x) return `${name}: keine Vertragsstunden hinterlegt.`;
      return `${name} hat im Entwurf ${h1(x.ist)} h in dieser Woche (Soll ${h1(x.soll)} h). Konto danach: ${ueText(x.ende) || "0,0"} h`
        + (darfUeberstunden(m) ? "." : " — macht keine Überstunden.");
    };
    if (f.personen.length) return antwort(f.personen.map(zeile).join(" "));
    const alle = state.mitarbeiter.map(m => [m.name, kontoNach(plan, platzImPlan(plan, m.name))]).filter(x => x[1]);
    return antwort("Konten nach dieser Woche: " + alle.map(([n, x]) => `${vor(n)} ${ueText(x.ende) || "0,0"} h`).join(" · ") + ".");
  }

  case "nein":
  case "sonst": {
    const ti = f.tage.length ? f.tage[0] : k.ti;
    // Mitten im Schritt für Schritt: derselbe Schritt — ohne die Genannten oder mit den nächsten Wegen
    const nr = (k.schritte || [])[k.schrittNr] && k.schritte[k.schrittNr].ti === ti ? k.schrittNr : (k.schritte || []).findIndex(s => s.ti === ti);
    if (nr >= 0 && k.schrittNr === nr){
      if (f.absicht === "sonst"){ k.versatz = (k.versatz || 0) + 3; return vorschlagAntwort(nr, null, {versatz: k.versatz}); }
      const raus = v.personen.length ? v.personen : (k.kandidaten || []);
      k.ausgeschlossen = [...new Set([...(k.ausgeschlossen || []), ...raus])]; k.versatz = 0;
      return vorschlagAntwort(nr, null, {vorweg: raus.length ? `Verstanden — ohne ${raus.map(vor).join(", ")}.` : ""});
    }
    // Geht es um einen bestimmten Ausfall? Dann zählt er mit — auch wenn er noch nicht angetippt ist
    const pb = k.problem && k.problem.ti === ti ? k.problem : null;
    const aus = pb && (eintrag.aenderungen.find(a => a.id === pb.aus) || {id: pb.aus, typ: "abwesend", name: pb.name, ti, grund: pb.grund, quelle: "assistent"});
    if (ti === undefined || (!pb && !pr.luecken[ti])){
      if (ti !== undefined && f.absicht === "sonst") return antwort(`Am ${tagName(ti)} ist im Entwurf nichts offen — es gibt keine Lücke zu schließen.`);
      return frage("Worum geht es — wer fällt aus, oder für welchen Tag suchst du jemanden?", ASSISTENT_START.slice(0, 2));
    }
    k.ti = ti;
    const rechne = () => {
      const g = aus ? ausfallGruppe(aus, k.ausgeschlossen) : null;
      const wege = aus ? (g ? g.wege : []) : lueckenWege(ti, k.ausgeschlossen);
      k.kandidaten = [...new Set(wege.flatMap(w => w.zeilen.map(z => z.name)))];
      return wege;
    };
    if (f.absicht === "nein"){
      // Genannte Personen fallen heraus — sonst alle, die gerade vorgeschlagen waren
      const raus = v.personen.length ? v.personen : (k.kandidaten || []);
      if (raus.length){
        k.ausgeschlossen = [...new Set([...(k.ausgeschlossen || []), ...raus])];
        const vermerk = raus.map(name => karte({typ: "abwesend", name, ti, grund: "nicht"}, `${name} ${tagName(ti)}: kann nicht`));
        const wege = rechne();
        if (!wege.length) return antwort(`Verstanden — ${raus.map(vor).join(", ")} ${raus.length > 1 ? "können" : "kann"} ${tagName(ti)} nicht. ` + keinWeg(ti), vermerk);
        return antwort(`Verstanden — ohne ${raus.map(vor).join(", ")}. So ginge es trotzdem:`, wegKarten(wege.slice(0, 3), aus && aus.id).concat(vermerk), ["Keiner davon passt", "Andere Vorschläge"]);
      }
    }
    const wege = rechne();
    if (!wege.length) return antwort(keinWeg(ti));
    return antwort(`${f.absicht === "sonst" ? "Andere Vorschläge" : "Vorschläge"} für ${tagName(ti)}:`, wegKarten(wege.slice(0, 3), aus && aus.id), ["Keiner davon passt"]);
  }

  case "umplanen": {
    const s = (k.schritte || [])[k.schrittNr];
    const id = (s && s.aus) || (k.problem && k.problem.aus);
    if (!id) return antwort("Erst schreiben, wer ausfällt — dann lässt sich die Woche um den Ausfall herum neu verteilen.");
    k.umplanen = id;
    return antwort("Ich verteile die Woche neu — so wenig wie möglich anders. Das Ergebnis steht gleich unter „Lösungen“.");
  }

  case "vorschlag": {
    // „Vorschläge für Mittwoch“, „Weiter: Dienstag“ — ein Schritt des laufenden Gesprächs
    const schritte = k.schritte || [];
    let nr = f.tage.length ? schritte.findIndex(s => s.ti === f.tage[0] && (!f.personen.length || f.personen.includes(s.name)))
                           : Math.min(schritte.length - 1, (k.schrittNr === undefined ? -1 : k.schrittNr) + 1);
    if (nr >= 0) return vorschlagAntwort(nr);
    // Sonst: eine Lücke im Entwurf an dem Tag — oder der Ausfall der genannten Person
    const ti = f.tage.length ? f.tage[0] : k.ti;
    if (ti === undefined) return frage("Für welchen Tag?", tagKnoepfe(f.personen[0]));
    if (!f.personen.length){
      if (!pr.luecken[ti]) return antwort(`Am ${tagName(ti)} ist im Entwurf nichts offen — es gibt nichts vorzuschlagen.`);
      const wege = lueckenWege(ti, []);
      k.problem = null; k.luecke = pr.luecken[ti]; k.ausgeschlossen = []; k.ti = ti;
      k.kandidaten = [...new Set(wege.slice(0, 3).flatMap(w => w.zeilen.map(z => z.name)))];
      if (!wege.length) return antwort(keinWeg(ti));
      return antwort(`${tagName(ti)}: ${spannenText(pr.luecken[ti])} ${fehltText(plan, ti, pr.luecken[ti])}. Vorschläge:`,
        wegKarten(wege.slice(0, 3)), ["Keiner davon passt"]);
    }
    // Mit Namen: wie „Wer kann für Eva einspringen?“ — weiter im nächsten Fall
    f.absicht = "ersatz";
  }
  // fällt durch

  case "ersatz": {
    // „für sie“ meint die Person von eben — ohne Namen nur, wenn es gerade um ihren Ausfall ging
    if (v.pronomen || (k.letzte && k.letzte.absicht === "ausfall" && !fortsetzung)) mitKontextPerson();
    if (!f.tage.length && k.ti !== undefined) f.tage = [k.ti];
    if (!f.tage.length) return frage(f.personen.length ? `An welchem Tag soll jemand für ${vor(f.personen[0])} einspringen?` : "Für welchen Tag suchst du jemanden?",
      tagKnoepfe(f.personen[0]));
    const ti = f.tage[0];
    if (plan.tage[ti].feiertag) return antwort(`${tagName(ti)} ist ein Feiertag — die Filiale ist geschlossen.`);
    // Geht es um einen Schritt des laufenden Gesprächs (Ausfall, Änderung)? Dann dessen Vorschläge
    const nr = aHatZeit(f.zeit) ? -1 : (k.schritte || []).findIndex(s => s.ti === ti && (!v.personen.length || v.personen.includes(s.name)));
    if (nr >= 0) return vorschlagAntwort(nr);
    // Steht im Entwurf schon eine Lücke und ist niemand genannt, geht es um sie
    if (!v.personen.length && pr.luecken[ti] && !aHatZeit(f.zeit)){
      k.problem = null; k.luecke = pr.luecken[ti]; k.ausgeschlossen = [];
      const wege = lueckenWege(ti, []);
      k.kandidaten = [...new Set(wege.flatMap(w => w.zeilen.map(z => z.name)))];
      if (wege.length) return antwort(`${tagName(ti)}: ${spannenText(pr.luecken[ti])} ${fehltText(plan, ti, pr.luecken[ti])}. Vorschläge:`,
        wegKarten(wege.slice(0, 3)), ["Keiner davon passt"]);
    }
    // „Wer kann Eva ersetzen?“ — der Ausfall dieser Person, mit allen Wegen
    const fehlt = f.personen.find(name => schichtenVon(plan, name, ti).length);
    if (fehlt) return ausfallAntwort([fehlt], f.tage.filter(x => schichtenVon(plan, fehlt, x).length), f.grund || "nicht", true);
    if (f.personen.length && !aHatZeit(f.zeit) && !pr.luecken[ti])
      return antwort(`${f.personen.map(vor).join(" und ")} ${f.personen.length > 1 ? "sind" : "ist"} am ${tagName(ti)} nicht eingeplant — es gibt nichts zu ersetzen.`);
    const von = f.zeit.von !== undefined ? f.zeit.von : (pr.luecken[ti] ? Math.min(...pr.luecken[ti]) : null);
    const bis = f.zeit.bis !== undefined ? f.zeit.bis : (pr.luecken[ti] ? Math.max(...pr.luecken[ti]) + 30 : null);
    const ausgeschlossen = k.ausgeschlossen || [];
    const frei = state.mitarbeiter.filter(m => !schichtenVon(plan, m.name, ti).length && !ausgeschlossen.includes(m.name)).filter(m => {
      if (von === null) return true;
      return mitEntwurfsAbwesenheiten(sl, eintrag, () => {
        const p = tagKopie(plan, ti);
        return ausfallErlaubt(p, planPlatz(p, personIndex(m.name)), ti, von, Math.max(bis, von + MINSCHICHT * 60));
      });
    });
    k.kandidaten = frei.map(m => m.name);
    if (!frei.length){
      const wege = von === null ? [] : lueckenWege(ti, ausgeschlossen);
      if (!wege.length) return antwort(`${tagName(ti)}${von !== null ? " " + hhmm(von) + "–" + hhmm(bis) : ""} kann niemand zusätzlich kommen. ` + keinWeg(ti));
      return antwort(`${tagName(ti)} kann niemand zusätzlich kommen — aber so ginge es:`, wegKarten(wege.slice(0, 3)), ["Keiner davon passt"]);
    }
    const lang = von === null ? null : Math.max(bis, von + MINSCHICHT * 60);
    const karten = von === null ? [] : frei.slice(0, 3).map(m =>
      karte({typ: "schicht", name: m.name, ti, von, bis: lang}, `${m.name} ${tagName(ti)} ${hhmm(von)}–${hhmm(lang)}`));
    return antwort(`${tagName(ti)}${von !== null ? " " + hhmm(von) + "–" + hhmm(bis) : ""}: frei und dürften kommen: ${frei.map(m => vor(m.name)).join(", ")}`
      + (von !== null && lang > bis ? ` (mindestens ${MINSCHICHT} h, also bis ${hhmm(lang)})` : "") + ". Vorher fragen.",
      karten, ["Keiner davon passt"]);
  }

  case "tausch": {
    if (f.personen.length < 2) return frage(f.personen.length ? `Mit wem soll ${vor(f.personen[0])} tauschen?` : "Wer soll mit wem tauschen?", leuteKnoepfe(f.tage));
    if (!f.tage.length && k.ti !== undefined && fortsetzung) f.tage = [k.ti];
    if (!f.tage.length) return frage(`An welchem Tag tauschen ${vor(f.personen[0])} und ${vor(f.personen[1])}?`, tagKnoepfe());
    const [a, b] = f.personen, karten = [];
    f.tage.forEach(ti => {
      const sa = schichtenVon(plan, a, ti)[0], sb = schichtenVon(plan, b, ti)[0];
      if ((!sa && !sb) || plan.tage[ti].feiertag) return;
      karten.push(karte(sb ? {typ: "schicht", name: a, ti, von: sb.von, bis: sb.bis} : {typ: "frei", name: a, ti},
        `${a} ${tagName(ti)} ${sb ? hhmm(sb.von) + "–" + hhmm(sb.bis) : "frei"}`));
      karten.push(karte(sa ? {typ: "schicht", name: b, ti, von: sa.von, bis: sa.bis} : {typ: "frei", name: b, ti},
        `${b} ${tagName(ti)} ${sa ? hhmm(sa.von) + "–" + hhmm(sa.bis) : "frei"}`));
    });
    if (!karten.length) return antwort(`${a} und ${b} haben an dem Tag beide frei — da gibt es nichts zu tauschen.`);
    return aenderungAntwort(`Tausch: ${karten.map(c => c.text).join(" · ")}.`, karten);
  }

  case "ausfall": {
    if (!f.personen.length && (fortsetzung || v.pronomen)) mitKontextPerson();
    if (!f.personen.length) return frage("Wer fällt aus?", leuteKnoepfe(f.tage));
    if (!f.tage.length) return frage(`An welchem Tag fällt ${f.personen.map(vor).join(" und ")} aus?`, tagKnoepfe(f.personen[0]));
    const eingeplant = f.personen.some(name => f.tage.some(ti => schichtenVon(plan, name, ti).length));
    // „kann nicht“ mit Uhrzeit oder „kommt später“ ist kein ganzer Ausfall, sondern eine andere Zeit
    if (f.grund === "nicht" && (aHatZeit(f.zeit) || f.teil === "spaeter" || f.teil === "frueher")){ f.absicht = "zeit"; break; }
    if (f.grund === "nicht" && !f.teil && eingeplant && f.tage.length === 1 && f.personen.length === 1)
      return frage(`Fällt ${vor(f.personen[0])} am ${tagName(f.tage[0])} den ganzen Tag aus — oder nur einen Teil?`, ["Ganzer Tag", "Kommt später", "Geht früher"], "teil");
    return ausfallAntwort(f.personen, f.tage, f.grund || "nicht");
  }

  case "frei": {
    if (!f.personen.length && (fortsetzung || v.pronomen)) mitKontextPerson();
    if (!f.personen.length) return frage("Wer soll frei bekommen?", leuteKnoepfe(f.tage));
    if (!f.tage.length) return frage(`An welchem Tag soll ${vor(f.personen[0])} frei haben?`, tagKnoepfe(f.personen[0]));
    const karten = [];
    f.personen.forEach(name => f.tage.forEach(ti => { if (schichtenVon(plan, name, ti).length) karten.push(karte({typ: "frei", name, ti}, `${name} ${tagName(ti)} frei`)); }));
    if (!karten.length) return antwort(`${f.personen.map(vor).join(" und ")} ${f.personen.length > 1 ? "haben" : "hat"} am ${tageText(f.tage)} ohnehin frei.`);
    return aenderungAntwort(`${f.personen.join(" und ")} ${f.personen.length > 1 ? "bekommen" : "bekommt"} frei am ${tageText(f.tage)}.`, karten);
  }

  case "zeit": break;

  default: {
    // Nur ein Name, sonst nichts Verständliches: fragen, was für die Person gelten soll
    if (f.personen.length && !fortsetzung){
      const n = vor(f.personen[0]);
      k.person = f.personen[0];
      return {antwort: `Was soll für ${n} gelten?`, karten: [], aus: [], verstanden: f, rueckfrage: true,
        knoepfe: [`${n} fällt aus`, `${n} bekommt frei`, `Wann arbeitet ${n}?`, `Warum ist ${n} eingeplant?`]};
    }
    return {antwort: "Das habe ich nicht verstanden. Worum geht es?", karten: [], aus: [], verstanden: f, knoepfe: ASSISTENT_START};
  }
  }

  // ---- Andere Zeit für eine Schicht: von–bis, ab, bis, „eine Stunde länger“ ----
  if (!f.personen.length) mitKontextPerson();
  if (!f.personen.length) return frage("Für wen gilt die Zeit?", leuteKnoepfe(f.tage));
  if (!f.tage.length && k.ti !== undefined && (fortsetzung || v.pronomen)) f.tage = [k.ti];
  const name = f.personen[0];
  if (!f.tage.length) return frage(`An welchem Tag gilt das für ${vor(name)}?`, tagKnoepfe(name));
  const z = f.zeit || {};
  const erste = schichtenVon(plan, name, f.tage[0])[0];
  if (!aHatZeit(z)){
    if (f.teil === "spaeter") return frage(`Ab wann kann ${vor(name)} am ${tagName(f.tage[0])} kommen?`,
      erste ? [60, 120, 180].map(d => "ab " + hhmm(erste.von + d)).filter((x, n) => erste.von + (n + 1) * 60 < erste.bis - 60) : [], "zeit");
    if (f.teil === "frueher") return frage(`Bis wann kann ${vor(name)} am ${tagName(f.tage[0])} bleiben?`,
      erste ? [180, 120, 60].map(d => "bis " + hhmm(erste.bis - d)).filter((x, n) => erste.bis - (3 - n) * 60 > erste.von + 60) : [], "zeit");
    return frage(`Welche Zeit soll für ${vor(name)} am ${tagName(f.tage[0])} gelten? Zum Beispiel „8–14“, „ab 10“ oder „eine Stunde länger“.`);
  }
  if (z.von === undefined && aHatZeit(z) && !f.tage.some(ti => schichtenVon(plan, name, ti).length))
    return antwort(`${name} hat am ${tageText(f.tage)} keine Schicht, die sich verlängern oder verkürzen ließe. Mit Uhrzeit von–bis geht es: „${vor(name)} ${tagName(f.tage[0])} 8–14“.`);
  if (z.relativ && z.relativ.min === null) return frage(`Wie viel ${z.relativ.art}?`, ["30 Minuten", "1 Stunde", "2 Stunden"], "dauer");
  if (z.relativ && !z.relativ.seite && (z.relativ.art === "früher" || z.relativ.art === "später"))
    return frage(`${vor(name)} kommt ${z.relativ.art} — oder geht ${z.relativ.art}?`, [`Kommt ${z.relativ.art}`, `Geht ${z.relativ.art}`], "seite");
  if (z.von !== undefined && !(z.bis > z.von)) return antwort("Das Ende muss nach dem Beginn liegen.");
  const karten = [], ohne = [];
  f.tage.filter(ti => !plan.tage[ti].feiertag).forEach(ti => {
    const s = schichtenVon(plan, name, ti)[0];
    let von, bis;
    if (z.von !== undefined){ von = z.von; bis = z.bis; }
    else if (!s){ ohne.push(ti); return; }
    else if (z.relativ){
      const seite = z.relativ.seite || "bis", d = (z.relativ.art === "später" || z.relativ.art === "länger" ? 1 : -1) * z.relativ.min;
      von = seite === "von" ? s.von + d : s.von; bis = seite === "bis" ? s.bis + d : s.bis;
    } else { von = z.nurAb !== null && z.nurAb !== undefined ? z.nurAb : s.von; bis = z.nurBis !== null && z.nurBis !== undefined ? z.nurBis : s.bis; }
    if (bis > von) karten.push(karte({typ: "schicht", name, ti, von, bis}, `${name} ${tagName(ti)} ${hhmm(von)}–${hhmm(bis)}`));
  });
  if (!karten.length) return antwort(`${name} hat am ${tageText(ohne.length ? ohne : f.tage)} keine Schicht, die sich verlängern oder verkürzen ließe. Mit Uhrzeit von–bis geht es: „${vor(name)} ${tagName(f.tage[0])} 8–14“.`);
  return aenderungAntwort(`${name}: ${karten.map(c => `${tagName(c.ti)} ${hhmm(c.von)}–${hhmm(c.bis)}`).join(", ")}; die Pause legt der Planer nach Gesetz.`, karten);
}

// ==== kern/19-planentwurf.js ====
/* Planentwurf: Ein neuer Plan ist erst ein Entwurf — gültig wird er mit „Plan freigeben“.

   „Plan erstellen“ rechnet nur, was Besetzung, Aufgaben, Standardwochen und Gesetz
   verlangen. Vertragsstunden, die danach noch fehlen, füllt der Planer nicht mehr von selbst
   auf: Er schlägt vor, wo sie sinnvoll hinpassen, und begründet es mit dem, was im Plan
   steht. Die Filialleitung übernimmt Vorschläge, trägt Zeiten von Hand ein oder lässt
   Stunden offen (dann entstehen Minusstunden — sichtbar, nicht versteckt).

   Abgelegt wird der Entwurf getrennt von den gültigen Plänen:
     state.planEntwurf[woche] = {kurz, aenderungen, erstellt}
   kurz ist der gerechnete Plan, aenderungen sind dieselben Bausteine wie in „Plan ändern“. */

function planEntwurfAnlegen(plan){
  const kurz = planKurz(plan), sl = wochenSchluessel(plan.mo);
  // Azubis kommen immer auf ihre Betriebsstunden — das ist kein Vorschlag, sondern Teil des Entwurfs
  if (azubisAuffuellen(kurz)) einteilungFestschreiben(kurz);
  state.planEntwurf = state.planEntwurf || {};
  state.planEntwurf[sl] = {kurz, aenderungen: [], erstellt: kurz.erstellt};
  return state.planEntwurf[sl];
}
const planEntwurfVon = sl => (state.planEntwurf || {})[sl] || null;

/* Wo zusätzliche Stunden für eine Person hinpassen — höchstens `fehlt` Stunden, immer
   rechtmäßig. Eine Möglichkeit verlängert eine Schicht oder setzt eine an einem freien Tag.
   Bewertet wird nur mit dem, was im Plan steht: läuft dort eine Aufgabe, die die Person
   kann; sind zu der Zeit nur so viele im Laden wie mindestens nötig; ist es der Tag mit den
   wenigsten Stunden. → nach Wert sortiert: [{ti, von, bis, art, gewinn, w, punkte}] */
function auffuellKandidaten(plan, m, fehlt, umverteilen){
  const j = platzImPlan(plan, m.name);
  if (j < 0) return [];
  const aussen = state.allein ? 1 : MIN_BESETZUNG;
  const tagStunden = plan.tage.map((t, ti) => t.feiertag ? Infinity : tagesStunden(plan, ti));
  const wenigster = tagStunden.indexOf(Math.min(...tagStunden));
  const kann = q => !q || (m.qual || []).includes(q);
  const kandidaten = [];
  plan.tage.forEach((t, ti) => {
    if (t.feiertag) return;
    const r = tagesRaster(t);
    const eigene = t.schichten.filter(s => s.mi === j);
    const da = mm => t.schichten.filter(s => s.von <= mm && s.bis > mm).length;
    // Was die zusätzliche Zeit bringt, je halbe Stunde
    const werte = (von, bis, ausser) => {
      let punkte = 0, aufgabe = {}, knapp = 0, n = 0;
      for (let mm = von; mm < bis; mm += 30){
        if (ausser && mm >= ausser.von && mm < ausser.bis) continue;       // die Zeit ist schon da
        n++;
        const drin = mm >= r.offenVon && mm < r.offenBis;
        const hier = da(mm), noetig = personenBedarf(t.aufgaben || [], mm, drin, aussen);
        // eine Aufgabe, bei der eine zweite Hand hilft — Bestellungen macht eine Person allein
        const auf = (t.aufgaben || []).find(a => { const w = WAREN.find(x => x.id === a.id) || {};
          return aufgabeLaeuft(a, mm) && w.gruppe !== "bestellung" && kann(w.braucht); });
        if (hier > noetig) punkte -= 1.5 * (hier - noetig);                // dort sind schon mehr als nötig
        if (auf){ punkte += 3; aufgabe[auf.name] = (aufgabe[auf.name] || 0) + 1; }
        else if (drin && hier <= noetig){ punkte += 2; knapp++; }
        else if (drin) punkte += 1;
      }
      return {punkte: n ? punkte / n : -9, aufgabe, knapp, n};
    };
    const melde = (von, bis, art, ausser) => {
      const anw = (bis - von) / 60, arbeit = anw - pauseFuer(m, anw);
      const gewinn = arbeit - (ausser ? ausser.arbeit : 0);
      if (gewinn < 0.49 || gewinn > fehlt + 0.01) return;
      const p = tagKopie(plan, ti);
      if (!ausfallErlaubt(p, j, ti, von, bis, ausser ? p.tage[ti].schichten.find(s => s.mi === j) : undefined, false, umverteilen)) return;
      const w = werte(von, bis, ausser);
      kandidaten.push({ti, von, bis, art, gewinn, w, wenigster: ti === wenigster,
                       punkte: w.punkte + (ti === wenigster ? 0.5 : 0) + Math.min(gewinn, fehlt) / 20});
    };
    if (eigene.length === 1){
      const s = eigene[0];
      for (let d = 30; d <= 240; d += 30){
        if (s.bis + d <= r.tagBis) melde(s.von, s.bis + d, "laenger", s);
        if (s.von - d >= r.tagVon) melde(s.von - d, s.bis, "frueher", s);
      }
    } else if (!eigene.length && fehlt >= MINSCHICHT - 0.01){
      for (let L = MINSCHICHT * 60; L <= REGELN.maxAnwesenheit * 60; L += 30)
        for (let von = r.tagVon; von + L <= r.tagBis; von += 30) melde(von, von + L, "neu");
    }
  });
  return kandidaten.sort((a, b) => b.punkte - a.punkte || b.gewinn - a.gewinn);
}

/* Azubis bis zu ihren Betriebsstunden einplanen — direkt im gerechneten Plan, nicht als
   Vorschlag. Erst die Zeit, die am meisten bringt; so lange, bis nichts mehr fehlt oder
   Gesetz, Berufsschule und Abwesenheiten nichts mehr zulassen. → true, wenn etwas dazukam */
function azubisAuffuellen(kurz){
  let geaendert = false;
  state.mitarbeiter.filter(istAzubi).forEach(m => {
    for (let runde = 0; runde < 24; runde++){
      const j = platzImPlan(kurz, m.name);
      const k = j < 0 ? null : stundenNach(kurz, j);
      const fehlt = k ? aufHalbe(k.soll - k.ist) : 0;
      if (fehlt < 0.5) break;
      // am liebsten die Möglichkeit, die am meisten der fehlenden Stunden bringt
      const c = auffuellKandidaten(kurz, m, fehlt).sort((a, b) => b.gewinn - a.gewinn || b.punkte - a.punkte)[0];
      if (!c){
        // Passt nichts Zusätzliches (zu wenig für eine eigene Schicht, die übrigen Tage sind voll),
        // hilft oft Umverteilen: ein Tag mehr, dafür ein anderer kürzer
        if (azubiUmverteilen(kurz, m, j, fehlt)){ geaendert = true; continue; }
        break;
      }
      const tag = kurz.tage[c.ti];
      let s = tag.schichten.find(x => x.mi === j);
      if (!s){ s = {mi: j, von: c.von, bis: c.bis, rollen: [], mehrarbeit: false}; tag.schichten.push(s); }
      if (!(s.rollen || []).includes("Ausbildung")) s.rollen = (s.rollen || []).concat("Ausbildung");
      schichtSetzen(kurz, c.ti, s, c.von, c.bis);
      tag.schichten.sort((x, y) => x.von - y.von || x.mi - y.mi);
      geaendert = true;
    }
  });
  return geaendert;
}

/* Umverteilen: eine Möglichkeit nehmen, die mehr bringt als fehlt — und das Zuviel an einem
   anderen Tag der Person wieder wegnehmen (Schicht später beginnen oder früher enden lassen).
   Nur, wenn dort dadurch nichts fehlt und die Schicht lang genug bleibt. → true, wenn es geklappt hat */
function azubiUmverteilen(kurz, m, j, fehlt){
  const kandidaten = auffuellKandidaten(kurz, m, fehlt + MINSCHICHT, true).filter(c => c.gewinn > fehlt + 0.01);
  for (const c of kandidaten){
    const zuviel = c.gewinn - fehlt;
    for (let t2 = 0; t2 < kurz.tage.length; t2++){
      if (t2 === c.ti || kurz.tage[t2].feiertag) continue;
      const s2 = kurz.tage[t2].schichten.find(x => x.mi === j);
      if (!s2 || (s2.rollen || []).includes("Standard")) continue;
      const vorher = tagesMaengel(kurz, t2);
      for (let d = 30; d <= 300; d += 30) for (const [von, bis] of [[s2.von, s2.bis - d], [s2.von + d, s2.bis]]){
        const anw = (bis - von) / 60;
        if (anw < MINSCHICHT - 0.01) continue;
        if (Math.abs(s2.arbeit - (anw - pauseFuer(m, anw)) - zuviel) > 0.01) continue;
        const probe = tagKopie(kurz, t2);
        schichtSetzen(probe, t2, probe.tage[t2].schichten.find(x => x.mi === j), von, bis);
        if (tagesMaengel(probe, t2) > vorher) continue;
        // beides übernehmen: der kürzere Tag …
        schichtSetzen(kurz, t2, s2, von, bis);
        // … und die zusätzliche Zeit
        const tag = kurz.tage[c.ti];
        let s = tag.schichten.find(x => x.mi === j);
        if (!s){ s = {mi: j, von: c.von, bis: c.bis, rollen: [], mehrarbeit: false}; tag.schichten.push(s); }
        if (!(s.rollen || []).includes("Ausbildung")) s.rollen = (s.rollen || []).concat("Ausbildung");
        schichtSetzen(kurz, c.ti, s, c.von, c.bis);
        tag.schichten.sort((x, y) => x.von - y.von || x.mi - y.mi);
        return true;
      }
    }
  }
  return false;
}

// Azubis, die trotzdem nicht auf ihre Stunden kommen → [{name, fehlt, text}] (mit dem Grund)
function azubiFehlstunden(plan){
  const sl = wochenSchluessel(plan.mo instanceof Date ? plan.mo : montagDer(plan.mo));
  const abw = (state.abwesend || {})[sl] || {};
  const raus = [];
  state.mitarbeiter.forEach((m, i) => {
    if (!istAzubi(m)) return;
    const j = platzImPlan(plan, m.name), k = j < 0 ? null : stundenNach(plan, j);
    const fehlt = k ? aufHalbe(k.soll - k.ist) : 0;
    if (fehlt < 0.5) return;
    const schule = TAGE.filter(([key]) => (abw[i] || {})[key] === "schule").length;
    const weg = TAGE.filter(([key]) => ["urlaub", "krank", "nicht"].includes((abw[i] || {})[key])).length;
    const gruende = [];
    if (schule) gruende.push(`${schule} ${schule === 1 ? "Tag" : "Tage"} Berufsschule`);
    if (weg) gruende.push(`${weg} ${weg === 1 ? "Tag" : "Tage"} abwesend`);
    gruende.push(minderjaehrig(m) ? "Jugendschutz lässt nicht mehr zu" : "Ruhezeit und Höchstarbeitszeit lassen nicht mehr zu");
    raus.push({name: m.name, fehlt, text: `${m.name}: ${h1(fehlt)} h unter den Betriebsstunden — ${gruende.join(", ")}.`});
  });
  return raus;
}

// Der Monat, in dem die Woche überwiegend liegt (Mittwoch)
const planMonat = plan => monatVon(plan.tage[2] ? plan.tage[2].datum : plan.mo);

/* Wem Vertragsstunden fehlen — und wo sie hinpassen.
   → [{name, ist, soll, fehlt, konto, vorschlaege: [{ti, von, bis, gewinn, art, grund, was, text}]}]
   Azubis stehen hier nicht: Ihre Stunden sind Pflicht und schon im Entwurf. Aushilfen auch
   nicht: Für sie zählt nur die Minijob-Grenze im Monat (aushilfenImEntwurf). */
function auffuellVorschlaege(sl){
  const pe = planEntwurfVon(sl);
  if (!pe) return [];
  const plan = entwurfAnwenden(pe.kurz, pe.aenderungen).plan;
  const start = ueberstundenZuBeginn(montagDer(plan.mo));
  const tagStunden = plan.tage.map((t, ti) => t.feiertag ? Infinity : tagesStunden(plan, ti));
  const wenigster = tagStunden.indexOf(Math.min(...tagStunden));
  // Die besten drei — höchstens einer je Tag, damit Auswahl bleibt
  const vorschlaege = (m, fehlt) => {
    const gewaehlt = [];
    auffuellKandidaten(plan, m, fehlt).forEach(c => { if (gewaehlt.length < 3 && !gewaehlt.some(x => x.ti === c.ti)) gewaehlt.push(c); });
    const vor = m.name.split(/\s+/)[0];
    return gewaehlt.map(c => {
      const haupt = Object.keys(c.w.aufgabe).sort((a, b) => c.w.aufgabe[b] - c.w.aufgabe[a])[0];
      const grund = haupt && c.w.aufgabe[haupt] * 2 >= c.w.n ? `zweite Hand bei „${haupt}“ — dort bleibt mehr Zeit für Sorgfalt`
        : c.w.knapp * 2 >= c.w.n ? "in dieser Zeit sind nur so viele im Laden wie mindestens nötig — mehr Luft für Kasse und Kunden"
        : c.ti === wenigster ? `${tagName(c.ti)} ist der Tag mit den wenigsten Stunden`
        : haupt ? `teils zweite Hand bei „${haupt}“` : "ruhige Zeit — Raum für Liegengebliebenes";
      const was = c.art === "neu" ? `${tagName(c.ti)} ${hhmm(c.von)}–${hhmm(c.bis)} zusätzlich`
        : c.art === "laenger" ? `${tagName(c.ti)} länger: bis ${hhmm(c.bis)}` : `${tagName(c.ti)} früher: ab ${hhmm(c.von)}`;
      return {ti: c.ti, von: c.von, bis: c.bis, art: c.art, gewinn: c.gewinn, grund, was,
              text: `${vor} ${was} (+${h1(c.gewinn)} h)`};
    });
  };
  const fest = [];
  state.mitarbeiter.forEach((m, i) => {
    if (istAzubi(m) || istAushilfe(m)) return;
    const j = platzImPlan(plan, m.name);
    const k = j < 0 ? null : kontoNach(plan, j);
    if (!k) return;
    const fehlt = viertel(k.soll - k.ist);
    if (fehlt < 0.5) return;
    // konto: Stand zu Wochenbeginn, ende: Stand nach dieser Woche — wer Überstunden hat, baut sie so ab
    fest.push({name: m.name, ist: k.ist, soll: k.soll, fehlt, konto: start[i] || 0, ende: k.ende, vorschlaege: vorschlaege(m, fehlt)});
  });
  // Wer im Minus steht, zuerst — dort fehlen die Stunden am meisten
  return fest.sort((a, b) => a.konto - b.konto || b.fehlt - a.fehlt);
}

// Alle Aushilfen mit ihrem Stand im Monat — für die Anzeige im Entwurf
function aushilfenImEntwurf(sl){
  const pe = planEntwurfVon(sl);
  if (!pe) return [];
  const plan = entwurfAnwenden(pe.kurz, pe.aenderungen).plan;
  return state.mitarbeiter.filter(istAushilfe).map(m => Object.assign({name: m.name}, aushilfeMonat(m.name, planMonat(plan), plan)));
}

// Einen Vorschlag in den Entwurf nehmen (ersetzt, was für die Person an dem Tag schon dazukam)
function auffuellUebernehmen(sl, name, v){
  const pe = planEntwurfVon(sl);
  if (!pe) return;
  pe.aenderungen = pe.aenderungen.filter(a => !(a.name === name && a.ti === v.ti && a.typ === "schicht"));
  pe.aenderungen.push({id: aenderungsId(), aktiv: true, quelle: "auffuellen", typ: "schicht", name, ti: v.ti, von: v.von, bis: v.bis,
    rolle: "Vertragsstunden", text: `${name} ${tagName(v.ti)} ${hhmm(v.von)}–${hhmm(v.bis)}`});
}

/* Freigabe: Der Entwurf wird der gültige Plan der Woche. Was im Entwurf als Ausfall
   eingetragen wurde, landet wie in „Plan ändern“ in den Abwesenheiten. Der freigegebene
   Plan ist die erste gültige Fassung — er trägt keine Spuren „nachträglich geändert“. */
function planFreigeben(sl){
  const pe = planEntwurfVon(sl);
  if (!pe) return null;
  const veraendert = pe.aenderungen.some(a => a.aktiv);
  state.plaene[sl] = pe.kurz;
  state.entwuerfe = state.entwuerfe || {};
  state.entwuerfe[sl] = {basis: pe.kurz.erstellt, aenderungen: pe.aenderungen};
  const neu = entwurfUebernehmen(sl);
  delete neu.urfassung; delete neu.geaendert; delete neu.ausfaelle;
  neu.geaendertVonHand = veraendert;
  neu.erstellt = new Date().toISOString();
  neu.freigegeben = neu.erstellt;
  delete state.planEntwurf[sl];
  return neu;
}

// ==== app/20-zustand.js ====
/* Zustand der App und Einlesen alter Datenstände */

// Die Einrichtung umfasst nur diese vier Schritte. Stundenliste und Prüfen
// sind eigene Bereiche, die von der Startseite aus offenstehen.
const SCHRITTE = ["Filiale","Wochenaufgaben","Mitarbeiter","Standardwoche"];

const STUNDENLISTE_SCHRITT = 4, PRUEFEN_SCHRITT = 5;

const BEREICHE = [
  {id:"filiale",      name:"Filiale",        schritt:0},
  {id:"aufgaben",     name:"Wochenaufgaben", schritt:1},
  {id:"personal",     name:"Personal",       schritt:2},
  {id:"standardwoche",name:"Standardwoche",  schritt:3},
  {id:"stundenliste", name:"Stundenliste",   schritt:STUNDENLISTE_SCHRITT}
];

/* ---------------- Zustand ---------------- */
let state = leer();

let ansicht = "anmeldung";      // anmeldung | einrichtung | bereich | start | planen | archiv

let schritt = 0, maxSchritt = 0, fehler = "";

let planWoche = null;     // Montag (ISO) der Woche, für die geplant wird

let zeigeWoche = null;    // Montag (ISO) der Woche, die die Startseite zeigt

let listenWoche = null;   // Montag (ISO) der Woche in der Stundenliste

function neueAufgabe(w){
  // Bestellungen haben eine Frist und macht eine Person — das ist der Normalfall.
  // Jede Norma-Filiale hat alle Aufgaben; abschalten lässt sich eine nur, wenn ohne
  // sie geplant werden soll.
  const best = w.gruppe === "bestellung";
  return {aktiv:true, tage:[], zeitArt: best ? "spanne" : "fest", zeit:"", fertig:"",
          fVon:"", fBis:"", dauer:"", personen: best ? "1" : "",
          jeTag:false, proTag:{}};
}

function leer(){
  const a = {};
  WAREN.forEach(w => a[w.id] = neueAufgabe(w));
  // Öffnungszeit bleibt leer, bis sie eingetragen ist — eine vorbelegte Zeit sah aus,
  // als wäre sie schon geprüft
  return {nr:"", ort:"", land:"BW", von:"", bis:"", wechsel:"", allein:false, aufgaben:a, mitarbeiter:[],
          budget:{stunden:{}, umsatz:{}}, eingerichtet:false, plaene:{}, abwesend:{},
          listen:{}, phasen:{}, rrSichtbar:true, funktionenPaeKonto:true};
}

function normalisiere(s){
  if (!s.plaene) s.plaene = {};
  if (!s.abwesend) s.abwesend = {};
  if (!s.listen) s.listen = {};
  if (!s.phasen) s.phasen = {};
  if (!s.ereignisse) s.ereignisse = [];
  // Planentwürfe (seit 16.11.2026): was nie freigegeben wurde und zwei Wochen zurückliegt, entfällt
  s.planEntwurf = s.planEntwurf || {};
  { const grenze = wochenSchluessel(new Date(aktuellerMontag().getTime() - 14 * 864e5));
    Object.keys(s.planEntwurf).forEach(sl => { if (sl < grenze) delete s.planEntwurf[sl]; }); }
  if (!s.land) s.land = "BW";        // bis 12.11.2026 gab es nur Baden-Württemberg
  // Vor dem 10.11.2026 gab es nur eine Stundenliste ohne Woche — sie wird zur
  // Liste der laufenden Woche, statt unsichtbar liegen zu bleiben
  if (s.budget && s.budget.stunden && Object.values(s.budget.stunden).some(v => hat(v))
      && !Object.keys(s.listen).length){
    s.listen[wochenSchluessel(aktuellerMontag())] = JSON.parse(JSON.stringify(s.budget));
  }
  if (s.archivGewarnt === true) s.archivGewarnt = {};   // früher ein einziger Schalter
  // Filialen von vor dem RR-Schein kennen die neue Aufgabe noch nicht
  if (s.aufgaben) WAREN.forEach(w => {
    if (!s.aufgaben[w.id]) s.aufgaben[w.id] = Object.assign(neueAufgabe(w), {neu:true});
  });
  // Bis 12.11.2026 kam der RR-Schein in bestehende Filialen ausgeschaltet und blass
  // hinein — leicht zu übersehen. Unberührt? Dann einschalten und als neu zeigen.
  const rr = s.aufgaben && s.aufgaben.rr;
  if (rr && !s.rrSichtbar){
    if (!rr.aktiv && !rr.offen && !rr.tage.length && !rr.zeit && !rr.dauer){ rr.aktiv = true; rr.neu = true; }
    s.rrSichtbar = true;
  }
  if (s.eingerichtet === undefined) s.eingerichtet = !!(s.mitarbeiter && s.mitarbeiter.length);
  // Seit 17.11.2026 gibt es die Funktionen „Preisänderungen (PÄ)“ und „Kontoauszug“. In bestehenden
  // Filialen bekommen sie einmal Filialleitung und Stellvertretung — weitere hakt die Leitung an.
  if (!s.funktionenPaeKonto){
    (s.mitarbeiter || []).forEach(m => {
      if (m.typ !== "Filialleitung" && m.typ !== "Stellvertretung") return;
      m.qual = m.qual || [];
      ["pae", "kontoauszug"].forEach(q => { if (!m.qual.includes(q)) m.qual.push(q); });
    });
    s.funktionenPaeKonto = true;
  }
  WAREN.forEach(w => {
    const a = s.aufgaben && s.aufgaben[w.id];
    if (!a) return;
    if (!a.zeitArt) a.zeitArt = hatZeit(a.zeit) ? "fest" : "egal";
    // Kurz (13.11.2026) gab es „noch nicht festgelegt“ — jetzt ist jede Aufgabe aktiv,
    // bis sie jemand abschaltet
    if (a.offen){ delete a.offen; a.aktiv = true; }
    if (a.fertig === undefined) a.fertig = "";       // „spätestens fertig bis“ (seit 16.11.2026)
    if (a.fVon === undefined) a.fVon = "";
    if (a.fBis === undefined) a.fBis = "";
    if (a.jeTag === undefined) a.jeTag = false;
    // Bis 12.11.2026 gab es je Tag nur eine eigene Uhrzeit (zeiten); jetzt hat
    // jeder Tag alle Einstellungen. Die alten Uhrzeiten wandern dorthin.
    if (!a.proTag){
      a.proTag = {};
      if (a.jeTag) a.tage.forEach(k => {
        a.proTag[k] = {zeitArt:a.zeitArt, zeit:(a.zeiten || {})[k] || a.zeit, fVon:a.fVon, fBis:a.fBis,
                       dauer:a.dauer, personen:a.personen};
      });
    }
    delete a.zeiten;
  });
  // Überstunden: bis 12.11.2026 wurden Wochen von Hand „ins Stundenkonto gebucht“.
  // Jetzt laufen sie von selbst weiter — gezählt ab der Woche saldoAb. Was schon
  // gebucht ist, steckt im Kontostand; ab der Woche danach zählt es von selbst.
  const plaene = s.plaene || {};
  const gebuchtBis = Object.keys(plaene).filter(sl => plaene[sl].gebucht).sort().pop();
  (s.mitarbeiter || []).forEach(m => {
    if (m.geteilt === undefined) m.geteilt = false;
    // Seit 13.11.2026 nur noch „18 oder älter“ / „unter 18“ — ein altes Geburtsdatum
    // wird einmal umgerechnet und nicht weiter aufgehoben
    if (m.geb !== undefined){
      const j = alter(m.geb);
      if (j !== null) m.volljaehrig = j >= 18;       // das Datum war die verlässlichere Angabe
      delete m.geb;
    }
    if (m.ueberstunden === undefined) m.ueberstunden = true;
    if (!m.saldoAb) m.saldoAb = gebuchtBis ? folgeSchluessel(gebuchtBis) : wochenSchluessel(aktuellerMontag());
    delete m.pauseMin;          // Pausen richten sich jetzt nach dem Gesetz
  });
  Object.values(plaene).forEach(p => {
    delete p.gebucht;
    // Pläne von vor dem 12.11.2026 kennen die Leute nur nach Platz in der Liste.
    // Die Liste von heute ist die beste Annahme — ab jetzt bleibt es so, auch wenn
    // jemand entfernt wird.
    if (!p.namen) p.namen = (s.mitarbeiter || []).map(m => m.name);
  });
  return s;
}
