        const u = unruhe(), ab = Math.abs(pv - m);
        if (z < besteZahl || u < besteUnruhe - 0.01 || (u < besteUnruhe + 0.01 && ab < besteAbstand - 0.1)){
          beste = pv; besteZahl = z; besteUnruhe = u; besteAbstand = ab;
        }
      });
      s.pauseVon = beste; s.pauseBis = beste + s.pause * 60;
    });
  }
}

// Rollen nachtragen: Standard, Aufgaben, sonst Kasse/Fläche
function rollenLegen(plan){
  const ms = state.mitarbeiter;
  const kann = (s, q) => !q || (ms[s.mi].qual || []).includes(q);
  plan.tage.forEach(t => {
    t.schichten.forEach(s => s.rollen = s.fest ? ["Standard"] : []);
    t.aufgaben.forEach(a => {
      t.schichten.filter(s => s.von <= a.von && s.bis >= a.bis && kann(s, a.braucht)).slice(0, a.pers)
        .forEach(s => { if (!s.rollen.includes(a.name)) s.rollen.push(a.name); });
    });
    t.schichten.forEach(s => { if (!s.rollen.length) s.rollen.push(kann(s, "kasse") && !istLeitung(ms[s.mi]) ? "Kasse" : "Fläche"); });
  });
}

/* Ein Plan aus dem Optimierer, im selben Format wie baueWoche. null, wenn HiGHS fehlt
   oder keine Lösung findet. */
async function optimiereRoh(montagISO, phase, summe, basisPlan, nurNoetig){
  const highs = await highsLaden();
  if (!highs) return null;
  const mo = montagDer(montagISO);
  const vorgabe = wochenVorgabe(mo, phase);
  vorgabe.basisPlan = basisPlan || null;
  vorgabe.nurNoetig = !!nurNoetig;
  const modell = wochenModell(mo, vorgabe, "plan", summe);
  let erg;
  try { erg = loese(highs, modell); } catch(e){ return null; }
  if (!erg) return null;
  const plan = {mo, tage: modell.tage, meldungen: modell.meldungen.slice(), konto: [],
                ziel: vorgabe.ziel, start: vorgabe.start, vorgabe, phase: vorgabe.phase};
  erg.gewaehlt.forEach(k => plan.tage[k.ti].schichten.push({mi: k.i, von: k.von, bis: k.bis, pause: k.pause,
    arbeit: k.arbeit, pauseVon: null, pauseBis: null, rollen: [], fest: k.fest, mehrarbeit: false}));
  plan.tage.forEach(t => t.schichten.sort((x, y) => x.von - y.von || x.mi - y.mi));
  pausenLegen(plan);
  rollenLegen(plan);
  // Bleibt eine Lücke, darf eine Schicht ausnahmsweise wachsen (kern/13-ausfall.js)
  const gewachsen = lueckenMitLaengerenSchichten(plan);
  if (gewachsen) erg.schlupf = erg.schlupf.filter(s => tagesMaengelAm(plan, s.ti, s.m) > 0);
  plan.tage.forEach(t => t.schichten.forEach(s => delete s.fest));
  // Lücken, die niemand füllen kann, wie der Planer melden — zusammenhängend je Art
  const segmente = {};
  erg.schlupf.forEach(s => {
    const k = s.ti + "/" + s.text;
    (segmente[k] = segmente[k] || []).push(s.m);
  });
  Object.entries(segmente).forEach(([k, punkte]) => {
    const [ti, text] = [+k.split("/")[0], k.slice(k.indexOf("/") + 1)];
    punkte.sort((a, b) => a - b);
    let anfang = punkte[0], vor = punkte[0];
    const melden = (a, b) => plan.meldungen.push({art:"bad",
      text:`${plan.tage[ti].label} ${hhmm(a)}–${hhmm(b)}: Für ${text} ist niemand verfügbar, der einsetzbar wäre.`});
    punkte.slice(1).forEach(p => { if (p !== vor + 30){ melden(anfang, vor + 30); anfang = p; } vor = p; });
    melden(anfang, vor + 30);
  });
  plan.optimierer = {status: erg.status};
  nachrechnen(plan);
  return plan;
}

// Mit wie vielen Stunden käme die Woche mindestens aus? (Gesetz, Besetzung, Aufgaben,
// Standardwochen — ohne Vertrags- und Kontoziele)
async function mindestStunden(montagISO, phase){
  const highs = await highsLaden();
  if (!highs) return null;
  const mo = montagDer(montagISO);
  const vorgabe = wochenVorgabe(mo, phase);
  const modell = wochenModell(mo, vorgabe, "mindest");
  try {
    const erg = loese(highs, modell, 5);
    if (!erg) return null;
    return {stunden: erg.gewaehlt.reduce((s, k) => s + k.arbeit, 0), luecken: erg.schlupf.length, status: erg.status};
  } catch(e){ return null; }
}

/* Der Plan für die App: Optimierer und Planer rechnen beide; genommen wird der bessere
   nach derselben Gütezahl (Abweichung von den Zielen, unbesetzte Halbstunden, Zahl der
   Schichten). Dazu die Messlatte: Mindeststunden der Woche. */
/* nurNoetig (seit 16.11.2026 der Weg der App): Der Plan enthält nur, was Besetzung, Aufgaben,
   Standardwochen und Gesetz verlangen. Vertragsstunden füllt die Filialleitung danach im
   Entwurf selbst auf (kern/19-planentwurf.js). */
async function erzeugePlanBest(montagISO, phase, fortschritt, nurNoetig){
  const melde = t => { if (fortschritt) fortschritt(t); };
  melde("Wird gerechnet …");
  const planer = erzeugePlan(montagISO, phase, nurNoetig);
  melde("Wird verfeinert …");
  const ph = phaseNormal(phase);
  let opt = null;
  try {
    if (ph.art === "normal") opt = await optimiereRoh(montagISO, ph, undefined, undefined, nurNoetig);
    else {
      const normal = await optimiereRoh(montagISO, {art: "normal"});
      if (normal){
        const n = planSummen(normal).bezahlt;
        const summe = ph.art === "mehr" ? {auf: n + Math.max(0, nz(ph.mehr))}
                    : ph.sparArt === "stunden" ? {bis: n - Math.max(0, nz(ph.stunden))} : {bis: 0};
        opt = await optimiereRoh(montagISO, ph, summe, ph.art === "mehr" ? normal : null, nurNoetig);
        if (opt) phasenMeldung(opt, ph, n);
      }
    }
  } catch(e){ opt = null; }
  melde("Fast fertig …");
  const mindest = await mindestStunden(montagISO, ph);
  // Wer gewinnt? Erst zählen Lücken. Dann in einer Sparwoche die Stunden — darum geht
  // es dort —, sonst die Gütezahl (Ziele, Konten, Zahl der Schichten).
  let plan = planer, verfahren = "Planer";
  const besser = () => {
    // Ein Plan mit Verstoß gegen das Gesetz gewinnt nie gegen einen ohne
    const ro = rechtsVerstoesse(opt).length, rp = rechtsVerstoesse(planer).length;
    if (ro !== rp) return ro < rp;
    // Lücken zählen danach — gleich danach, ob eine Aushilfe über der Monatsgrenze läge
    const lo = planMaengel(opt) + 5 * minijobVerstoesse(opt).length, lp = planMaengel(planer) + 5 * minijobVerstoesse(planer).length;
    if (lo !== lp) return lo < lp;
    // … dann, wie oft außer der Filialleitung niemand kassieren könnte
    const ko = leitungKassePunkte(opt), kp = leitungKassePunkte(planer);
    if (ko !== kp) return ko < kp;
    if (ph.art === "sparen") return planSummen(opt).bezahlt <= planSummen(planer).bezahlt + 0.01;
    if (nurNoetig && Math.abs(planSummen(opt).bezahlt - planSummen(planer).bezahlt) > 0.01) return planSummen(opt).bezahlt < planSummen(planer).bezahlt;
    return guete(opt) <= guete(planer);
  };
  if (opt && besser()){ plan = opt; verfahren = "Optimierer"; }
  // Bleibt trotzdem ein Verstoß (etwa weil die Standardwoche selbst gegen das Gesetz verstößt),
  // steht er unter dem Plan — nicht nur im Entwurf
  rechtsVerstoesse(plan).forEach(text => {
    const kern = text.replace(/\.$/, "");
    if (!plan.meldungen.some(x => x.text.startsWith(kern))) plan.meldungen.push({art: "bad", text});
  });
  plan.berechnung = {verfahren, optimiererVerfuegbar: !!(await highsLaden()),
    stunden: planSummen(plan).bezahlt, mindest: mindest ? mindest.stunden : null,
    vergleich: {planer: planSummen(planer).bezahlt, optimierer: opt ? planSummen(opt).bezahlt : null}};
  return plan;
}

// ==== kern/13-ausfall.js ====
/* Ausfall-Assistent: Jemand fällt aus — wer springt ein?

   Arbeitet auf einem gespeicherten Plan (planSpeichern-Format, Personen über plan.namen).
   Die Schicht der ausfallenden Person wird herausgenommen; dann werden Lösungen gesucht,
   die die Besetzung wieder vollständig machen, und nach Mehrstunden und Stundenkonto
   sortiert:
     · jemand, der an dem Tag frei hat, übernimmt die ganze Schicht
     · jemand, der frei hat, kommt nur für die Lücke (mindestens 4 h)
     · jemand, der ohnehin da ist, bleibt länger oder kommt früher
     · zwei, die ohnehin da sind: einer bleibt länger, einer kommt früher
   Jede Lösung hält Ruhezeit, Tageshöchstzeit, Jugendschutz, Abwesenheiten und Pausen ein.
   Geändert wird erst mit ausfallAnwenden(). */

const kopie = x => JSON.parse(JSON.stringify(x));

// Wer ist Person j eines gespeicherten Plans heute im Personal?
function planPerson(plan, j){
  const name = plan.namen ? plan.namen[j] : (state.mitarbeiter[j] || {}).name;
  const i = state.mitarbeiter.findIndex(m => m.name === name);
  return {i, m: state.mitarbeiter[i], name};
}
// Platz einer Person des Personals im Plan — wer noch nicht darin steht, wird angehängt
function planPlatz(plan, i){
  const name = state.mitarbeiter[i].name;
  if (!plan.namen) plan.namen = state.mitarbeiter.map(m => m.name);
  let j = plan.namen.indexOf(name);
  if (j < 0){ plan.namen.push(name); j = plan.namen.length - 1; }
  return j;
}

// Halbe Stunden eines Tages, in denen etwas fehlt
function fehlzeiten(plan, ti){
  const t = plan.tage[ti];
  if (!t || t.feiertag) return [];
  return tagesRaster(t).punkte.filter(m => tagesMaengelAm(plan, ti, m) > 0);
}
/* Viertelstunden der Öffnung, in denen niemand kassieren kann → [[von, bis], …]
   (genauer als fehlzeiten, das in halben Stunden rechnet) */
function kasseLeer(plan, ti){
  const t = plan.tage[ti];
  if (!t || t.feiertag) return [];
  const r = tagesRaster(t), ms = state.mitarbeiter;
  const wer = s => (plan.namen ? ms.find(x => x.name === plan.namen[s.mi]) : ms[s.mi]) || {qual: []};
  const leer = [];
  for (let q = r.offenVon; q < r.offenBis; q += 15)
    if (!aufFlaecheAm(t.schichten, q).some(s => (wer(s).qual || []).includes("kasse"))) leer.push(q);
  return zuSpannen(leer, 15);
}

/* Lücken eines gespeicherten Plans, die nur an den Pausen liegen: Bis zum 17.11.2026 wurde
   nur zur vollen und halben Stunde geprüft — zwei Pausen konnten sich zur Viertelstunde
   überschneiden (Kasse 9:45–10:00 leer). → [{ti, vorher, nachher, kasse}] für Tage, an denen
   andere Pausenzeiten die Lücke schließen oder kleiner machen. */
function pausenLuecken(plan){
  const raus = [];
  (plan.tage || []).forEach((t, ti) => {
    if (t.feiertag) return;
    const vorher = fehlzeiten(plan, ti);
    if (!vorher.length) return;
    const p = tagKopie(plan, ti);
    pausenLegenTag(p, ti, true);
    const nachher = fehlzeiten(p, ti);
    // Nur die Kassenlücken nennen, die an den Pausen liegen — die nach dem Verschieben besetzt sind
    const bleibt = new Set(kasseLeer(p, ti).flatMap(([v, b]) => Array.from({length: (b - v) / 15}, (_, n) => v + n * 15)));
    const kasse = zuSpannen(kasseLeer(plan, ti).flatMap(([v, b]) => Array.from({length: (b - v) / 15}, (_, n) => v + n * 15)).filter(q => !bleibt.has(q)), 15);
    if (nachher.length < vorher.length) raus.push({ti, vorher, nachher, kasse});
  });
  return raus;
}
// „Di: Kasse 9:45–10:00 leer“ — oder, wenn es nicht die Kasse ist, was dort fehlt
const pausenLueckeText = (plan, x) => `${tagName(x.ti)}: ${x.kasse.length ? "Kasse " + x.kasse.map(spanneText).join(", ") + " leer"
  : spannenText(x.vorher) + " " + fehltText(plan, x.ti, x.vorher)} — Pausen überschneiden sich.`;

/* Aufgaben eines gespeicherten Plans, die nach den heutigen Wochenaufgaben außerhalb ihres
   Zeitfensters liegen — weil die Frist geändert wurde oder weil sie vor dem 17.11.2026 ohne
   „spätestens“ bis Ladenschluss gelegt werden durften (Frischfleisch am Abend).
   → [{ti, aufgaben: [{name, von, bis, frueh, spaet}]}] */
function aufgabenAusserhalb(plan){
  const raus = [];
  (plan.tage || []).forEach((t, ti) => {
    if (t.feiertag) return;
    const o = oeffnungAm(t.datum);
    const falsch = (t.aufgaben || []).filter(a => a.id !== "zusatz" && state.aufgaben[a.id] && state.aufgaben[a.id].aktiv).map(a => {
      const z = aufgabeAm(state.aufgaben[a.id], t.key);
      const [frueh, spaet] = aufgabenFenster(z, a.bis - a.von, o.von, o.bis, o.normal);
      const eingetragen = (z.zeitArt === "fest" && hatZeit(z.fertig)) || (z.zeitArt === "spanne" && hatZeit(z.fBis));
      return {id: a.id, name: a.name, von: a.von, bis: a.bis, frueh, spaet,
              ab: !eingetragen ? (z.zeitArt === "fest" ? z.zeit : z.fVon) : null};
    }).filter(a => a.von < a.frueh || a.bis > a.spaet);
    if (falsch.length) raus.push({ti, aufgaben: falsch});
  });
  return raus;
}
// „Freitag: Frischfleisch 16:45–18:00 — muss bis 10:15 fertig sein.“ (kurz; der Grund steht hinter dem „i“)
const aufgabenAusserhalbText = x => `${tagName(x.ti)}: ` + x.aufgaben.map(a => `${a.name} ${hhmm(a.von)}–${hhmm(a.bis)} — `
  + (a.bis > a.spaet ? `muss bis ${hhmm(a.spaet)} fertig sein` : `darf erst ab ${hhmm(a.frueh)} beginnen`)).join("; ") + ".";
// Woher die Frist kommt: eingetragen oder die Regel ohne Frist
const aufgabenAusserhalbGrund = x => x.aufgaben.map(a => !a.ab ? `${a.name}: Frist aus den Wochenaufgaben.`
  : hatZeit(state.von) && a.ab < state.von ? `${a.name}: keine Frist eingetragen — vor der Öffnung heißt das: fertig bis zur Öffnung.`
  : `${a.name}: keine Frist eingetragen — dann höchstens 2 Stunden nach ${a.ab} beginnen.`).join(" ") + " Unter Wochenaufgaben lässt sich die Frist ändern.";

/* Aufgaben eines Tages, die außerhalb ihres Fensters liegen, hineinlegen — die übrigen Aufgaben und
   alle Schichten bleiben. Gewählt wird die Lage, bei der am wenigsten fehlt, bei Gleichstand die früheste. */
function aufgabenNeuLegen(plan, ti){
  const t = plan.tage[ti];
  if (!t || t.feiertag) return;
  (aufgabenAusserhalb(plan).find(x => x.ti === ti) || {aufgaben: []}).aufgaben.forEach(f => {
    const a = t.aufgaben.find(y => y.id === f.id && y.von === f.von);
    if (!a) return;
    const dauer = a.bis - a.von;
    let beste = f.frueh, besteZahl = Infinity;
    for (let st = Math.ceil(f.frueh / 15) * 15; st + dauer <= f.spaet; st += 15){
      a.von = st; a.bis = st + dauer;
      const z = tagesMaengel(plan, ti);
      if (z < besteZahl){ besteZahl = z; beste = st; }
    }
    a.von = beste; a.bis = beste + dauer; a.frueh = f.frueh; a.spaet = f.spaet;
    delete a.wer;
  });
  t.aufgaben.sort((x, y) => x.von - y.von || x.bis - y.bis);
}

// Mängel nur an einem Zeitpunkt (dieselben Regeln wie tagesMaengel)
const tagesMaengelAm = (plan, ti, m) => maengelGruende(plan, ti, m).length;

// Was an einem Zeitpunkt fehlt, in Worten — je Regel höchstens ein Eintrag
function maengelGruende(plan, ti, m){
  const t = plan.tage[ti];
  const ms = state.mitarbeiter;
  const r = tagesRaster(t);
  const wechsel = hatZeit(state.wechsel) ? minuten(state.wechsel) : Math.round((r.offenVon + r.offenBis)/2);
  const aussen = state.allein ? 1 : MIN_BESETZUNG;
  const wer = s => (plan.namen ? ms.find(x => x.name === plan.namen[s.mi]) : ms[s.mi]) || {qual:[]};
  const kann = (s, q) => !q || (wer(s).qual || []).includes(q);
  const fuehrt = (s, q) => wer(s).typ === "Filialleitung" || (wer(s).qual || []).includes(q);
  const da = t.schichten.filter(s => s.von <= m && s.bis > m);
  const drin = m >= r.offenVon && m < r.offenBis;
  // Kasse und Aufgaben je Viertelstunde (wie tagesMaengel): Pausen beginnen auch zur Viertelstunde
  const fl = q => aufFlaecheAm(t.schichten, q), viertel = [m, m + 15];
  const raus = [];
  if (!da.some(s => fuehrt(s, m < wechsel ? "frueh" : "spaet"))) raus.push(m < wechsel ? "Schichtführung früh" : "Schichtführung spät");
  if (viertel.some(q => q >= r.offenVon && q < r.offenBis && !fl(q).some(s => kann(s, "kasse")))) raus.push("Kasse");
  for (const a of t.aufgaben || []){
    if (!aufgabeLaeuft(a, m)) continue;
    const br = (WAREN.find(w => w.id === a.id) || {}).braucht;
    if (br && viertel.some(q => a.von < q + 15 && a.bis > q && fl(q).filter(s => kann(s, br)).length < a.pers)){ raus.push(a.name || "Wochenaufgabe"); break; }
  }
  if (da.length < personenBedarf(t.aufgaben || [], m, drin, aussen)) raus.push("Mindestbesetzung");
  return raus;
}

// Darf Person j (Plan) am Tag ti von–bis arbeiten? Ohne die Schicht `ausser`.
// ohneAzubiGrenze: nur fürs Umverteilen, das ein Zuviel an einem anderen Tag gleich wieder abzieht.
// lang: auch eine lange Schicht ist recht (Erwachsene bis 10 h Arbeit) — nur dort setzen,
// wo es ohne nicht geht (siehe schichtLaengeOk).
function ausfallErlaubt(plan, j, ti, von, bis, ausser, lang, ohneAzubiGrenze){
  const {i, m} = planPerson(plan, j);
  if (!m) return false;
  const minder = minderjaehrig(m);
  if (minder && !jugendZeit(von, bis, (plan.tage[ti] || {}).datum)) return false;
  const anw = (bis - von)/60;
  if (!schichtLaengeOk(m, anw, lang)) return false;
  const e = (((state.abwesend || {})[wochenSchluessel(plan.mo instanceof Date ? plan.mo : montagDer(plan.mo))] || {})[i] || {})[TAGE[ti][0]];
  if (e){
    if (typeof e === "string") return false;
    const a = hatZeit(e.von) ? minuten(e.von) : null, b = hatZeit(e.bis) ? minuten(e.bis) : null;
    if (a !== null && b !== null && b > a && !(e.a === "nur" ? (von >= a && bis <= b) : (bis <= a || von >= b))) return false;
  }
  const ruhe = ruhezeitFuer(minder) * 60;
  const vor = ti > 0 ? plan.tage[ti-1].schichten.filter(x => x.mi === j && x !== ausser) : [];
  const nach = ti < plan.tage.length - 1 ? plan.tage[ti+1].schichten.filter(x => x.mi === j && x !== ausser) : [];
  if (vor.some(x => 24*60 - x.bis + von < ruhe - 0.5)) return false;
  if (nach.some(x => 24*60 - bis + x.von < ruhe - 0.5)) return false;
  // Jugendliche: Berufsschultage zählen als Arbeitstage und mit 8 h (schulLast); Blockwoche: gar nicht
  const abwWoche = (state.abwesend || {})[wochenSchluessel(plan.mo instanceof Date ? plan.mo : montagDer(plan.mo))] || {};
  if (i >= 0 && blockWoche(abwWoche, i)) return false;
  const schule = i >= 0 ? schulLast(abwWoche, i) : {tage: 0, stunden: 0};
  const tage = new Set(plan.tage.map((t, k) => t.schichten.some(x => x.mi === j && x !== ausser) || k === ti ? k : -1).filter(k => k >= 0));
  if (tage.size + schule.tage > maxTageFuer(minder)) return false;
  const arbeit = anw - pauseFuer(m, anw);
  if (minder || istLang(arbeit)){
    const woche = plan.tage.reduce((s, t, k) => s + t.schichten.filter(x => x.mi === j && x !== ausser && k !== ti).reduce((a, x) => a + x.arbeit, 0), 0);
    if (minder && woche + arbeit + schule.stunden > REGELN.jugendWoche + 0.01) return false;
    // über 8 h am Tag nur, wenn die Woche bei höchstens 48 h bleibt (§ 3 ArbZG)
    if (istLang(arbeit) && woche + arbeit > REGELN.langWoche + 0.01) return false;
  }
  // Aushilfen: im Kalendermonat nie über die Minijob-Grenze
  if (!minijobPasst(plan, j, ti, von, bis, ausser)) return false;
  // Azubis: nie über die Betriebsstunden der Woche (keine Überstunden)
  if (istAzubi(m) && hatVertrag(m) && !ohneAzubiGrenze){
    const woche = plan.tage.reduce((s, t, k) => s + t.schichten.filter(x => x.mi === j && x !== ausser && k !== ti).reduce((a, x) => a + x.arbeit, 0), 0);
    if (woche + arbeit > aufHalbe(sollWoche(m, i, plan.mo instanceof Date ? plan.mo : montagDer(plan.mo))) + 0.01) return false;
  }
  return true;
}

// Schicht auf von–bis setzen und die Pause so legen, dass der Tag besetzt bleibt
function schichtSetzen(plan, ti, s, von, bis){
  const {m} = planPerson(plan, s.mi);
  s.von = von; s.bis = bis;
  const anw = (bis - von)/60, p = pauseFuer(m, anw);
  s.pause = p; s.arbeit = anw - p;
  if (!p){ s.pauseVon = null; s.pauseBis = null; return; }
  const laenge = p * 60, minder = minderjaehrig(m), am = amStueckFuer(minder);
  const mitte = Math.round((von + (bis - von)/2 - laenge/2) / 15) * 15;
  let beste = null, besteZahl = Infinity, besteAbstand = Infinity;
  for (let pv = von + 60; pv + laenge <= bis - 60; pv += 15){
    if (pv - von > am || bis - (pv + laenge) > am) continue;
    s.pauseVon = pv; s.pauseBis = pv + laenge;
    const z = tagesMaengel(plan, ti), ab = Math.abs(pv - mitte);
    if (z < besteZahl || (z === besteZahl && ab < besteAbstand)){ beste = pv; besteZahl = z; besteAbstand = ab; }
  }
  if (beste === null) beste = Math.max(von + 30, mitte);
  s.pauseVon = beste; s.pauseBis = beste + laenge;
}

// Stunden und Konto einer Person nach einer Änderung
// Stunden einer Person in der Woche und ihr Soll — auch ohne Konto (Azubis); null ohne Vertrag
function stundenNach(plan, j){
  const {i, m} = planPerson(plan, j);
  if (!m || !hatVertrag(m)) return null;
  const mo = plan.mo instanceof Date ? plan.mo : montagDer(plan.mo);
  return {ist: plan.tage.reduce((s, t) => s + t.schichten.filter(x => x.mi === j).reduce((a, x) => a + x.arbeit, 0), 0), soll: sollWoche(m, i, mo)};
}

function kontoNach(plan, j, grundAusfall){
  const {i, m} = planPerson(plan, j);
  if (!m || !hatKonto(m)) return null;                 // Aushilfen haben kein Konto
  const mo = plan.mo instanceof Date ? plan.mo : montagDer(plan.mo);
  const start = ueberstundenZuBeginn(mo)[i] || 0;
  const ist = plan.tage.reduce((s, t) => s + t.schichten.filter(x => x.mi === j).reduce((a, x) => a + x.arbeit, 0), 0);
  return {ist, soll: sollWoche(m, i, mo), ende: viertel(start + ist - sollWoche(m, i, mo))};
}

// Änderungen an einem Tag ausführen: neue Schicht oder bestehende Schicht verschieben
function aenderungenAnwenden(plan, ti, aenderungen){
  const tag = plan.tage[ti];
  aenderungen.forEach(a => {
    const j = planPlatz(plan, a.i);
    if (a.art === "neu"){
      const s = {mi: j, von: a.von, bis: a.bis, rollen: ["Vertretung"], mehrarbeit: false};
      tag.schichten.push(s);
      schichtSetzen(plan, ti, s, a.von, a.bis);
    } else {
      const s = tag.schichten.find(x => x.mi === j && x.von === a.alt[0] && x.bis === a.alt[1]);
      if (s) schichtSetzen(plan, ti, s, a.von, a.bis);
    }
  });
  tag.schichten.sort((x, y) => x.von - y.von || x.mi - y.mi);
  pausenNachbessern(plan, ti);
}
// Bleibt eine Lücke nur, weil gerade jemand Pause hat, die Pausen des Tages verschieben —
// jede nur, wenn es wirklich hilft; sonst bleibt sie, wo sie war
function pausenNachbessern(plan, ti){
  const tag = plan.tage[ti];
  for (let runde = 0; runde < 2 && tagesMaengel(plan, ti) > 0; runde++){
    tag.schichten.forEach(s => {
      if (!s.pause || s.pauseVon === null) return;
      const {m} = planPerson(plan, s.mi);
      const laenge = s.pause * 60, am = amStueckFuer(m && minderjaehrig(m));
      let beste = s.pauseVon, besteZahl = tagesMaengel(plan, ti);
      for (let pv = s.von + 60; pv + laenge <= s.bis - 60; pv += 15){
        if (pv - s.von > am || s.bis - (pv + laenge) > am) continue;
        s.pauseVon = pv; s.pauseBis = pv + laenge;
        const z = tagesMaengel(plan, ti);
        if (z < besteZahl){ beste = pv; besteZahl = z; }
      }
      s.pauseVon = beste; s.pauseBis = beste + laenge;
    });
  }
}
const tagesStunden = (plan, ti) => plan.tage[ti].schichten.reduce((s, x) => s + x.arbeit, 0);

/* Alle Wege, die Lücken eines Tages zu schließen. weg: die Zeit, die frei geworden ist
   (für „ganz übernehmen“). tiefe 0 erlaubt zusätzlich: jemand, der da ist, übernimmt die
   frei gewordene Schicht, und seine eigene wird ihrerseits gefüllt. */
function luekenSchliessen(basis, ti, weg, tiefe, ziel, lang){
  // ziel: so viele Mängel hatte der Tag schon vor dem Ausfall — besser als vorher muss
  // eine Lösung nicht sein (eine knapp besetzte Filiale hat vielleicht schon Lücken)
  ziel = ziel || {maengel: 0, punkte: []};
  const luecke = fehlzeiten(basis, ti).filter(m => !ziel.punkte.includes(m));
  if (!luecke.length) return [{aenderungen: [], teile: []}];
  const g0 = Math.min(...luecke), g1 = Math.max(...luecke) + 30;
  const tag = basis.tage[ti], r = tagesRaster(tag);
  const raus = [];
  const probe = (aenderungen, teile) => {
    const plan = kopie(basis); plan.mo = basis.mo;
    aenderungen.forEach(a => {
      if (a.art === "neu" && !ausfallErlaubt(plan, planPlatz(plan, a.i), ti, a.von, a.bis, undefined, lang)) throw "nein";
    });
    aenderungenAnwenden(plan, ti, aenderungen);
    if (tagesMaengel(plan, ti) <= ziel.maengel) raus.push({aenderungen, teile});
  };
  const versuch = (aenderungen, teile) => { try { probe(aenderungen, teile); } catch(e){ if (e !== "nein") throw e; } };
  const frei = state.mitarbeiter.map((m, i) => i).filter(i => {
    const j = basis.namen ? basis.namen.indexOf(state.mitarbeiter[i].name) : i;
    return j < 0 || !tag.schichten.some(x => x.mi === j);
  });
  const platz = i => basis.namen ? basis.namen.indexOf(state.mitarbeiter[i].name) : i;
  // 1) jemand, der frei hat, übernimmt die ganze frei gewordene Schicht
  if (weg) frei.forEach(i => versuch([{art: "neu", i, von: weg.von, bis: weg.bis}],
    [`${state.mitarbeiter[i].name} übernimmt ${hhmm(weg.von)}–${hhmm(weg.bis)}`]));
  // 2) jemand, der frei hat, kommt nur für die Lücke — so kurz wie möglich
  frei.forEach(i => {
    const vorher = raus.length;
    for (let laenge = Math.max(MINSCHICHT*60, g1 - g0); laenge <= (lang ? REGELN.langAnwesenheit : REGELN.maxAnwesenheit)*60 && raus.length === vorher; laenge += 30)
      for (let von = Math.max(r.tagVon, g1 - laenge); von <= g0 && von + laenge <= r.tagBis && raus.length === vorher; von += 30){
        if (weg && von === weg.von && von + laenge === weg.bis) continue;
        versuch([{art: "neu", i, von, bis: von + laenge}], [`${state.mitarbeiter[i].name} kommt ${hhmm(von)}–${hhmm(von + laenge)}`]);
      }
  });
  // 3) eine Schicht wächst über die Lücke
  tag.schichten.forEach(s0 => {
    const von = Math.min(s0.von, g0), bis = Math.max(s0.bis, g1);
    if ((von === s0.von && bis === s0.bis) || !ausfallErlaubt(basis, s0.mi, ti, von, bis, s0, lang)) return;
    const p = planPerson(basis, s0.mi);
    const teile = [];
    if (von < s0.von) teile.push(`kommt ab ${hhmm(von)}`);
    if (bis > s0.bis) teile.push(`bleibt bis ${hhmm(bis)}`);
    versuch([{art: "aendern", i: p.i, alt: [s0.von, s0.bis], von, bis}], [`${p.name} ${teile.join(" und ")}`]);
  });
  // 4) zwei teilen sich die Lücke: einer bleibt länger, einer kommt früher
  const davor = tag.schichten.filter(s => s.bis <= g1 && s.bis >= g0 - 60 && s.von < g0);
  const danach = tag.schichten.filter(s => s.von >= g0 && s.von <= g1 + 60 && s.bis > g1);
  davor.forEach(a => danach.forEach(b => {
    if (a.mi === b.mi) return;
    for (let p = g0; p <= g1; p += 30){
      const aBis = Math.max(a.bis, p), bVon = Math.min(b.von, p);
      if (aBis === a.bis && bVon === b.von) continue;
      if (!ausfallErlaubt(basis, a.mi, ti, a.von, aBis, a, lang) || !ausfallErlaubt(basis, b.mi, ti, bVon, b.bis, b, lang)) continue;
      const pa = planPerson(basis, a.mi), pb = planPerson(basis, b.mi);
      const vorher = raus.length;
      versuch([{art: "aendern", i: pa.i, alt: [a.von, a.bis], von: a.von, bis: aBis},
               {art: "aendern", i: pb.i, alt: [b.von, b.bis], von: bVon, bis: b.bis}],
              [aBis > a.bis ? `${pa.name} bleibt bis ${hhmm(aBis)}` : null, bVon < b.von ? `${pb.name} kommt ab ${hhmm(bVon)}` : null].filter(Boolean));
      if (raus.length > vorher) break;
    }
  }));
  // 5) jemand, der da ist, übernimmt die frei gewordene Schicht; seine eigene wird gefüllt
  if (weg && tiefe === 0) tag.schichten.forEach(s0 => {
    if ((s0.rollen || []).includes("Standard")) return;          // feste Wochen bleiben
    if (!ausfallErlaubt(basis, s0.mi, ti, weg.von, weg.bis, s0)) return;
    const p = planPerson(basis, s0.mi);
    const tausch = {art: "aendern", i: p.i, alt: [s0.von, s0.bis], von: weg.von, bis: weg.bis};
    const plan = kopie(basis); plan.mo = basis.mo;
    aenderungenAnwenden(plan, ti, [tausch]);
    luekenSchliessen(plan, ti, {von: s0.von, bis: s0.bis}, 1, ziel, lang).slice(0, 4).forEach(w => raus.push({
      aenderungen: [tausch].concat(w.aenderungen),
      teile: [`${p.name} übernimmt ${hhmm(weg.von)}–${hhmm(weg.bis)} statt ${hhmm(s0.von)}–${hhmm(s0.bis)}`].concat(w.teile)}));
  });
  return raus;
}

/* Vorschläge für den Ausfall von Person j0 (Plan) am Tag ti. grund: krank | urlaub | nicht.
   Liefert {schicht, vorschlaege:[{titel, details, mehr, aenderungen}]} — die drei besten. */
function ausfallVorschlaege(gespeichert, j0, ti, grund){
  const basis = kopie(gespeichert);
  basis.mo = gespeichert.mo;
  const tag = basis.tage[ti];
  const weg = tag.schichten.find(x => x.mi === j0);
  if (!weg) return {schicht: null, vorschlaege: []};
  const ziel = {maengel: tagesMaengel(gespeichert, ti), punkte: fehlzeiten(gespeichert, ti)};
  tag.schichten = tag.schichten.filter(x => x !== weg);
  // Fürs Konto zählt der Grund: krank und Urlaub sind bezahlt — solange gerechnet wird,
  // steht der Ausfall vorläufig in den Abwesenheiten
  const sl = wochenSchluessel(montagDer(basis.mo instanceof Date ? isoVon(basis.mo) : basis.mo));
  const {i: i0} = planPerson(basis, j0);
  state.abwesend = state.abwesend || {};
  const abwVorher = kopie(state.abwesend[sl] || {});
  state.abwesend[sl] = state.abwesend[sl] || {};
  state.abwesend[sl][i0] = Object.assign({}, state.abwesend[sl][i0], {[TAGE[ti][0]]: grund});
  let vorschlaege = [];
  try {
    // Lange Schichten (über 8 h Arbeit) nur, wenn sich die Lücke sonst gar nicht schließen lässt
    let wege = luekenSchliessen(basis, ti, {von: weg.von, bis: weg.bis}, 0, ziel);
    if (!wege.length) wege = luekenSchliessen(basis, ti, {von: weg.von, bis: weg.bis}, 0, ziel, true);
    const vorher = tagesStunden(basis, ti);
    vorschlaege = wege.map(w => {
      const plan = kopie(basis); plan.mo = basis.mo;
      aenderungenAnwenden(plan, ti, w.aenderungen);
      const mehr = tagesStunden(plan, ti) - vorher;
      const betroffen = [...new Set(w.aenderungen.map(a => a.i))];
      let punkte = mehr * 2 + w.aenderungen.length * 1.5;
      const details = betroffen.map(i => {
        const m = state.mitarbeiter[i], k = kontoNach(plan, planPlatz(plan, i));
        if (!k) return null;
        if (k.ende > 0) punkte += k.ende * (darfUeberstunden(m) ? 1 : 25) * ueberGewicht(m) / 2;
        if (k.ende < 0) punkte += k.ende * 0.5;                // wer Minusstunden hat, holt sie auf
        if (!schicht(m, TAGE[ti][0]) && TAGE.some(([kk]) => schicht(m, kk))) punkte += 3;
        return `${m.name}: ${h1(k.ist)} h diese Woche, Konto danach ${ueText(k.ende) || "0,0"} h`;
      }).filter(Boolean).join(" · ");
      const pausen = plan.tage[ti].schichten.filter(s => {
        const vorher = basis.tage[ti].schichten.find(x => x.mi === s.mi && x.von === s.von && x.bis === s.bis);
        return vorher && vorher.pauseVon !== s.pauseVon;
      }).map(s => `${planPerson(plan, s.mi).name} Pause ${hhmm(s.pauseVon)}`);
      if (pausen.length) punkte += pausen.length * 0.5;
      const lange = plan.tage[ti].schichten.filter(s => istLang(s.arbeit)).map(s => `${planPerson(plan, s.mi).name} ${h1(s.arbeit)} h`);
      return w.aenderungen.length
        ? {titel: w.teile.join(", "), details: details + (pausen.length ? ` · Pause verschoben: ${pausen.join(", ")}` : "")
             + (lange.length ? ` · Lange Schicht: ${lange.join(", ")} Arbeit — anders ließ sich die Lücke nicht schließen` : ""),
           mehr, aenderungen: w.aenderungen, punkte}
        : {titel: "Ohne Ersatz", details: ziel.maengel ? "Durch den Ausfall entsteht keine neue Lücke."
                                                      : "Die Besetzung reicht auch so — es fehlt keine halbe Stunde.",
           mehr: 0, aenderungen: [], punkte: -100};
    });
  } finally {
    state.abwesend[sl] = abwVorher;
  }
  const gesehen = new Set();
  const beste = vorschlaege.sort((a, b) => a.punkte - b.punkte)
    .filter(v => !gesehen.has(v.titel) && gesehen.add(v.titel)).slice(0, 3);
  return {schicht: {von: weg.von, bis: weg.bis, arbeit: weg.arbeit}, vorschlaege: beste,
          luecken: fehlzeiten(basis, ti).filter(m => !ziel.punkte.includes(m))};
}

/* Einen Vorschlag in den gespeicherten Plan schreiben und den Ausfall eintragen.
   Ohne Vorschlag (null) wird die Schicht nur ausgetragen. */
function ausfallAnwenden(gespeichert, j0, ti, grund, vorschlag){
  const tag = gespeichert.tage[ti];
  tag.schichten = tag.schichten.filter(x => x.mi !== j0);
  const tage = vorschlag && vorschlag.aenderungen.find(a => a.art === "tage");
  if (tage){
    // Umplanung über mehrere Tage: die neuen Tage ganz übernehmen
    // Die Namensliste des Vorschlags enthält die alte und hängt nur an — Plätze bleiben gleich
    if (tage.namen) gespeichert.namen = tage.namen.slice();
    Object.entries(tage.tage).forEach(([k, schichten]) => { gespeichert.tage[+k].schichten = kopie(schichten); });
  } else aenderungenAnwenden(gespeichert, ti, vorschlag ? vorschlag.aenderungen : []);
  const mo = montagDer(gespeichert.mo instanceof Date ? isoVon(gespeichert.mo) : gespeichert.mo);
  const sl = wochenSchluessel(mo);
  const {i: i0, name} = planPerson(gespeichert, j0);
  state.abwesend[sl] = state.abwesend[sl] || {};
  if (i0 >= 0) state.abwesend[sl][i0] = Object.assign({}, state.abwesend[sl][i0], {[TAGE[ti][0]]: grund});
  // Krankheit und Urlaub erscheinen auch unter „Urlaub & Krankheit“
  const datum = isoVon(new Date(mo.getTime() + ti * 864e5));
  if ((grund === "krank" || grund === "urlaub") && name){
    (state.ereignisse = state.ereignisse || []).push({id: "e" + Date.now().toString(36) + ti, name, art: grund,
      von: datum, bis: datum, angelegt: new Date().toISOString(), ausfall: true});
    ereignisseNachfuehren();              // schließt an den Vortag an: ein Eintrag
  }
  gespeichert.geaendertVonHand = true;
  // Nachvollziehbar bleiben: was wann umgeplant wurde — ohne den Grund (Gesundheitsdaten)
  (gespeichert.ausfaelle = gespeichert.ausfaelle || []).push({am: new Date().toISOString(), wer: name,
    tag: TAGE[ti][0], loesung: vorschlag ? vorschlag.titel : "ohne Ersatz"});
}

/* Wenn ein Tag allein nicht reicht: die Woche mit dem Optimierer umplanen — so, dass
   möglichst viele Schichten bleiben, wie sie sind. Tage vor `abTag` ändern sich nicht.
   Liefert einen Vorschlag wie ausfallVorschlaege, mit Änderungen über mehrere Tage. */
async function ausfallUmplanen(gespeichert, j0, ti, grund, abTag){
  const highs = await highsLaden();
  if (!highs) return null;
  const mo = montagDer(gespeichert.mo instanceof Date ? isoVon(gespeichert.mo) : gespeichert.mo);
  const sl = wochenSchluessel(mo);
  const {i: i0} = planPerson(gespeichert, j0);
  state.abwesend = state.abwesend || {};
  const abwVorher = kopie(state.abwesend[sl] || {});
  state.abwesend[sl] = state.abwesend[sl] || {};
  state.abwesend[sl][i0] = Object.assign({}, state.abwesend[sl][i0], {[TAGE[ti][0]]: grund});
  try {
    const vorhanden = [];
    gespeichert.tage.forEach((t, k) => t.schichten.forEach(s => {
      const p = planPerson(gespeichert, s.mi);
      if (p.i < 0 || (k === ti && s.mi === j0)) return;
      vorhanden.push({i: p.i, ti: k, von: s.von, bis: s.bis});
    }));
    const vorgabe = wochenVorgabe(mo, gespeichert.phase);
    const modell = wochenModell(mo, vorgabe, "plan", null, {vorhanden, nurVorhandenVor: Math.min(abTag || 0, ti), behalten: 15});
    // Die Aufgaben des gespeicherten Plans gelten weiter (sie könnten von Hand angepasst sein)
    const erg = loese(highs, modell);
    ausfallUmplanen.grund = "";
    if (!erg){ ausfallUmplanen.grund = "keine Lösung"; return null; }
    // Neue Schichten je Tag, mit Pausen, die die Besetzung halten
    const neu = kopie(gespeichert); neu.mo = gespeichert.mo;
    const geaendert = {};
    gespeichert.tage.forEach((t, k) => {
      if (t.feiertag) return;
      const alt = t.schichten.filter(s => !(k === ti && s.mi === j0)).map(s => planPerson(gespeichert, s.mi).i + "/" + s.von + "/" + s.bis).sort();
      const jetzt = erg.gewaehlt.filter(x => x.ti === k).map(x => x.i + "/" + x.von + "/" + x.bis).sort();
      if (JSON.stringify(alt) === JSON.stringify(jetzt) && k !== ti) return;
      geaendert[k] = erg.gewaehlt.filter(x => x.ti === k);
    });
    const aenderungen = [{art: "tage", tage: {}, namen: null}];
    const zeilen = [];
    Object.entries(geaendert).forEach(([k, liste]) => {
      k = +k;
      const vorher = gespeichert.tage[k].schichten;
      neu.tage[k].schichten = [];
      liste.forEach(x => {
        const j = planPlatz(neu, x.i);
        const bestand = vorher.find(s => s.mi === j && s.von === x.von && s.bis === x.bis);
        const s = bestand ? kopie(bestand) : {mi: j, von: x.von, bis: x.bis, rollen: ["Vertretung"], mehrarbeit: false, _neu: true};
        neu.tage[k].schichten.push(s);
        if (!bestand){
          const war = vorher.find(v => v.mi === j && !(k === ti && v.mi === j0));
          zeilen.push(`${TAGE[k][1]}: ${state.mitarbeiter[x.i].name} ${hhmm(x.von)}–${hhmm(x.bis)}${war ? ` statt ${hhmm(war.von)}–${hhmm(war.bis)}` : ""}`);
        }
      });
      vorher.forEach(v => {
        const p = planPerson(gespeichert, v.mi);
        if (k === ti && v.mi === j0) return;
        if (!liste.some(x => x.i === p.i)) zeilen.push(`${TAGE[k][1]}: ${p.name} frei statt ${hhmm(v.von)}–${hhmm(v.bis)}`);
      });
      neu.tage[k].schichten.forEach(s => { if (s._neu){ delete s._neu; schichtSetzen(neu, k, s, s.von, s.bis); } });
      neu.tage[k].schichten.sort((a, b) => a.von - b.von || a.mi - b.mi);
      pausenNachbessern(neu, k);
      // nicht schlechter als vor dem Ausfall (eine knappe Filiale hat vielleicht schon Lücken)
      if (tagesMaengel(neu, k) > tagesMaengel(gespeichert, k))
        throw new Error(`Lücke ${TAGE[k][1]}: ${tagesMaengel(neu, k)} statt ${tagesMaengel(gespeichert, k)} (Schlupf im Modell: ${erg.schlupf.filter(x => x.ti === k).length})`);
      aenderungen[0].tage[k] = neu.tage[k].schichten;
    });
    if (!zeilen.length){ ausfallUmplanen.grund = "keine Änderung"; return null; }
    aenderungen[0].namen = neu.namen;
    const mehr = neu.tage.reduce((s, t) => s + t.schichten.reduce((a, x) => a + x.arbeit, 0), 0)
               - gespeichert.tage.reduce((s, t, k) => s + t.schichten.filter(x => !(k === ti && x.mi === j0)).reduce((a, x) => a + x.arbeit, 0), 0);
    return {titel: "Umplanen über mehrere Tage", details: zeilen.join(" · "), zeilen, mehr, aenderungen, punkte: 50, mehrtaegig: true};
  } catch(e){ ausfallUmplanen.grund = e.message; return null; }
  finally { state.abwesend[sl] = abwVorher; }
}

/* ---- Lange Schichten --------------------------------------------------------
   Üblich sind höchstens 8,5 h im Haus. Bleibt nach dem Planen trotzdem eine Besetzungslücke,
   darf eine Schicht wachsen: zuerst innerhalb des Üblichen, und nur wenn das nicht reicht,
   darüber hinaus — Erwachsene bis 10 h Arbeit, die Woche bei höchstens 48 h (§ 3 ArbZG).
   Standardwochen, geteilte Tage und Jugendliche bleiben, wie sie sind.
   → Zahl der Schichten, die gewachsen sind */
function lueckenMitLaengerenSchichten(plan){
  let geaendert = 0;
  plan.tage.forEach((t, ti) => {
    if (t.feiertag) return;
    const r = tagesRaster(t);
    for (let runde = 0; runde < 6; runde++){
      const vorher = tagesMaengel(plan, ti);
      if (!vorher) break;
      let beste = null;
      for (const lang of [false, true]){
        t.schichten.forEach(s => {
          if ((s.rollen || []).includes("Standard") || s.fest) return;
          if (t.schichten.filter(x => x.mi === s.mi).length > 1) return;
          const alt = {von: s.von, bis: s.bis, pause: s.pause, arbeit: s.arbeit, pauseVon: s.pauseVon, pauseBis: s.pauseBis};
          const probiere = (von, bis) => {
            if (von < r.tagVon || bis > r.tagBis || !ausfallErlaubt(plan, s.mi, ti, von, bis, s, lang)) return false;
            schichtSetzen(plan, ti, s, von, bis);
            const z = tagesMaengel(plan, ti);
            Object.assign(s, alt);
            // am meisten schließen; bei gleichem Ergebnis die kürzere Schicht
            if (z < vorher && (!beste || z < beste.z || (z === beste.z && bis - von < beste.bis - beste.von))) beste = {s, von, bis, z};
            return true;
          };
          for (let d = 30; d <= 420 && probiere(s.von, s.bis + d); d += 30);
          for (let d = 30; d <= 420 && probiere(s.von - d, s.bis); d += 30);
        });
        if (beste) break;                      // im Üblichen gefunden: keine lange Schicht nötig
      }
      if (!beste) break;
      schichtSetzen(plan, ti, beste.s, beste.von, beste.bis);
      beste.s.verlaengert = true;
      pausenNachbessern(plan, ti);
      geaendert++;
    }
  });
  return geaendert;
}

/* Die langen Schichten eines Plans (mehr als 8 h Arbeit), jede mit dem Grund, soweit er aus
   dem Plan folgt: Was bliebe unbesetzt, wenn die Schicht nur die übliche Länge hätte?
   → [{name, ti, von, bis, arbeit, noetig, text}] */
function langeSchichten(plan){
  const raus = [];
  plan.tage.forEach((t, ti) => {
    if (t.feiertag) return;
    t.schichten.forEach(s => {
      if (!istLang(s.arbeit)) return;
      const {m, name} = planPerson(plan, s.mi);
      if (!m) return;
      const ueblich = REGELN.maxAnwesenheit * 60, schon = new Set(fehlzeiten(plan, ti));
      let wenigstes = null;
      [[s.von, s.von + ueblich], [s.bis - ueblich, s.bis]].forEach(([von, bis]) => {
        const p = tagKopie(plan, ti);
        if (!plan.namen) delete p.namen;            // frisch gerechnete Pläne führen Personen über ihren Platz
        schichtSetzen(p, ti, p.tage[ti].schichten.find(x => x.mi === s.mi && x.von === s.von && x.bis === s.bis), von, bis);
        const punkte = fehlzeiten(p, ti).filter(mm => !schon.has(mm));
        if (!wenigstes || punkte.length < wenigstes.punkte.length) wenigstes = {punkte, plan: p};
      });
      const noetig = wenigstes.punkte.length > 0;
      raus.push({name, ti, von: s.von, bis: s.bis, arbeit: s.arbeit, noetig,
        text: `${name}, ${tagName(ti)} ${hhmm(s.von)}–${hhmm(s.bis)}: ${h1(s.arbeit)} h Arbeit. ` + (noetig
          ? `Mit der üblichen Länge wäre ${spannenText(wenigstes.punkte)} nicht richtig besetzt (${fehltText(wenigstes.plan, ti, wenigstes.punkte)}).`
          : `Nach dem Plan ginge es auch kürzer — die Besetzung reicht mit der üblichen Länge.`)});
    });
  });
  return raus;
}
// Der Satz, der zu jeder langen Schicht gehört
const LANG_HINWEIS = "Über 8 h am Tag nur als Ausnahme (§ 3 ArbZG); die Woche bleibt bei höchstens 48 h. Für Schwangere gelten höchstens 8,5 h (§ 4 MuSchG) — das prüft die App nicht.";

/* Halbe Stunden der Öffnung, in denen von allen Anwesenden nur die Filialleitung kassieren
   kann — dann muss sie an die Kasse. (Gezählt wird, wer im Haus ist; Pausen legt der Planer
   erst danach.) */
function leitungKassePunkte(plan){
  const ms = state.mitarbeiter;
  const wer = s => (plan.namen ? ms.find(x => x.name === plan.namen[s.mi]) : ms[s.mi]) || {qual: []};
  let n = 0;
  plan.tage.forEach(t => {
    if (t.feiertag) return;
    const r = tagesRaster(t);
    r.punkte.filter(m => m >= r.offenVon && m < r.offenBis).forEach(m => {
      const kasse = t.schichten.filter(s => s.von <= m && s.bis > m).map(wer).filter(x => (x.qual || []).includes("kasse"));
      if (kasse.length && kasse.every(istLeitung)) n++;
    });
  });
  return n;
}

// ==== kern/14-ereignisse.js ====
/* Besondere Ereignisse: Urlaub und Krankheit.

   Trägt nur die Filialleitung ein — einmal als Zeitraum, auch über mehrere Wochen. Die
   App schreibt die Tage in die Abwesenheiten der betroffenen Wochen; der Planer, das
   Stundenkonto (Urlaub und Krankheit zählen als Soll) und der Ausfall-Assistent sehen
   sie von dort. Unter dem Plan stehen sie in Rot. Gespeichert wird nur Art und Zeitraum —
   keine Diagnose, kein Grund —, und nach Ablauf der Archivfrist wird der Eintrag gelöscht. */

const EREIGNIS_ARTEN = [["urlaub", "Urlaub"], ["krank", "Krank"]];

// Die Arbeitstage eines Ereignisses (Mo–Sa, ohne Feiertage)
function ereignisTage(e){
  const raus = [];
  const d = new Date(e.von + "T12:00:00"), ende = new Date(e.bis + "T12:00:00");
  for (let n = 0; d <= ende && n < 400; n++, d.setDate(d.getDate() + 1)){
    const wt = (d.getDay() + 6) % 7;
    if (wt === 6 || istFeiertag(d)) continue;
    raus.push({datum: isoVon(d), sl: wochenSchluessel(d), tag: TAGE[wt][0], ti: wt});
  }
  return raus;
}

function ereignisEintragen(e){
  const i = state.mitarbeiter.findIndex(m => m.name === e.name);
  if (i < 0) throw new Error("Diese Person gibt es nicht im Personal.");
  if (!e.von || !e.bis || e.bis < e.von) throw new Error("Bitte einen gültigen Zeitraum wählen.");
  const tage = ereignisTage(e);
  if (!tage.length) throw new Error("In diesem Zeitraum liegt kein Arbeitstag.");
  const neu = Object.assign({id: "e" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
                             angelegt: new Date().toISOString()}, e);
  state.ereignisse = state.ereignisse || [];
  state.ereignisse.push(neu);
  state.abwesend = state.abwesend || {};
  tage.forEach(t => {
    const w = state.abwesend[t.sl] = state.abwesend[t.sl] || {};
    w[i] = Object.assign({}, w[i], {[t.tag]: e.art});
  });
  // schließt der Zeitraum an einen bestehenden an oder überdeckt er ihn, wird daraus ein Eintrag
  ereignisseNachfuehren();
  return neu;
}

function ereignisLoeschen(id){
  const e = (state.ereignisse || []).find(x => x.id === id);
  if (!e) return;
  const i = state.mitarbeiter.findIndex(m => m.name === e.name);
  // nur austragen, was noch so dasteht — von Hand Geändertes bleibt
  if (i >= 0) ereignisTage(e).forEach(t => {
    const w = ((state.abwesend || {})[t.sl] || {})[i];
    if (w && w[t.tag] === e.art) delete w[t.tag];
  });
  state.ereignisse = state.ereignisse.filter(x => x.id !== id);
  ereignisseNachfuehren();
}

// Wo stehen für die Person schon Schichten an den Tagen des Ereignisses?
function ereignisBetroffen(e){
  const raus = {};
  ereignisTage(e).forEach(t => {
    const kurz = (state.plaene || {})[t.sl];
    if (!kurz) return;
    const i = state.mitarbeiter.findIndex(m => m.name === e.name);
    const j = planIndex(kurz, state.mitarbeiter[i], i);
    if (j < 0 || !kurz.tage[t.ti].schichten.some(s => s.mi === j)) return;
    (raus[t.sl] = raus[t.sl] || {sl: t.sl, j, tage: []}).tage.push(t.ti);
  });
  return Object.values(raus);
}

// Für die Anzeige unter dem Plan: Urlaub und Krankheit der Woche, je Person zusammengefasst
function ereignisseDerWoche(sl){
  const abw = (state.abwesend || {})[sl] || {};
  const raus = [];
  state.mitarbeiter.forEach((m, i) => {
    EREIGNIS_ARTEN.forEach(([art, text]) => {
      const tage = TAGE.map(([k], ti) => (abw[i] || {})[k] === art ? ti : -1).filter(ti => ti >= 0);
      if (tage.length) raus.push({name: m.name, art, text, tage});
    });
  });
  return raus;
}
// „Mo, Mi“ oder „Di bis Fr“
function tageText(tage){
  const zusammen = tage.length > 2 && tage.every((t, n) => n === 0 || t === tage[n-1] + 1);
  return zusammen ? `${TAGE[tage[0]][1]} bis ${TAGE[tage[tage.length-1]][1]}` : tage.map(t => TAGE[t][1]).join(", ");
}
// Nach der Archivfrist löschen (Gesundheitsdaten nicht länger aufheben als nötig)
function ereignisseAufraeumen(){
  const grenze = new Date(); grenze.setDate(grenze.getDate() - ARCHIV_WOCHEN * 7);
  const vorher = (state.ereignisse || []).length;
  state.ereignisse = (state.ereignisse || []).filter(e => e.bis >= isoVon(grenze));
  return vorher - state.ereignisse.length;
}
// Hinweise zum Plan ohne Über- und Minusstunden — die stehen im Plan selbst (und gehören nicht an den Aushang)
const STUNDEN_HINWEIS = /h verplant, Ziel|über ihren Vertragsstunden|über die Vertragsstunden hinaus|über dem Vertrag|Personen über Vertrag/;
const hinweiseOhneStunden = meldungen => (meldungen || []).filter(m => !STUNDEN_HINWEIS.test(m.text));

/* ---- Eine Abwesenheitsliste je Woche ------------------------------------------------
   Alles, was der Planer über Abwesenheiten weiß, steht an einer Stelle:
   state.abwesend[sl][i][tag]. Drei Wege führen dorthin — die Tabelle in „Plan erstellen“,
   „Urlaub & Krankheit“ und „Zeiten der Mitarbeiter“ (Abgaben, Terminliste). Damit sich die
   Stellen nicht widersprechen, gilt:
     · Urlaub und Krankheit stehen immer auch unter „Urlaub & Krankheit“ — egal, wo sie
       eingetragen wurden. ereignisseNachfuehren() baut diese Liste aus den Tagen neu auf
       (zusammenhängende Arbeitstage = ein Eintrag). Die Tage sind die Wahrheit, denn Planer
       und Stundenkonto lesen sie.
     · Woher ein Eintrag stammt, wird nicht doppelt geführt, sondern abgeleitet (abwHerkunft):
       „Urlaub & Krankheit“, „Abgabe“ oder „Terminliste“ (steht so da, wie es dort
       hineingeschrieben wurde) oder „von Hand“.
     · Ein Widerspruch bleibt nur, wo eine Abgabe von Hand überschrieben wurde — die Liste
       markiert ihn, und er lässt sich mit einem Tipp auflösen (abwAbweichung). */

const istEreignisArt = w => w === "urlaub" || w === "krank";
// Der nächste Arbeitstag nach dem Tag iso (Mo–Sa, ohne Feiertage)
function naechsterArbeitstag(iso){
  const d = new Date(iso + "T12:00:00");
  do d.setDate(d.getDate() + 1); while (d.getDay() === 0 || istFeiertag(d));
  return isoVon(d);
}

/* „Urlaub & Krankheit“ aus den Tagen neu aufbauen: je Person und Art werden zusammenhängende
   Arbeitstage zu einem Eintrag. Ein bestehender Eintrag, der sich mit dem Zeitraum überschneidet,
   behält seine Kennung. → true, wenn sich die Liste geändert hat */
function ereignisseNachfuehren(){
  const alt = state.ereignisse || [];
  const tage = new Map();                       // Name → Art → [Tage]
  Object.keys(state.abwesend || {}).forEach(sl => {
    const mo = montagAusSchluessel(sl);
    Object.entries(state.abwesend[sl] || {}).forEach(([i, woche]) => {
      const m = state.mitarbeiter[+i];
      if (!m) return;
      TAGE.forEach(([k], ti) => {
        const w = (woche || {})[k];
        if (!istEreignisArt(w)) return;
        const d = new Date(mo); d.setDate(mo.getDate() + ti);
        if (istFeiertag(d)) return;
        if (!tage.has(m.name)) tage.set(m.name, {urlaub: [], krank: []});
        tage.get(m.name)[w].push(isoVon(d));
      });
    });
  });
  const frei = alt.slice(), neu = [];
  tage.forEach((arten, name) => EREIGNIS_ARTEN.forEach(([art]) => {
    const liste = [...new Set(arten[art])].sort();
    let von = null, bis = null;
    const fertig = () => {
      if (von === null) return;
      // die Kennung bleibt bei dem Eintrag, der diesen Zeitraum bisher (teilweise) abdeckte
      const n = frei.findIndex(e => e.name === name && e.art === art && e.von <= bis && e.bis >= von);
      const vorher = n >= 0 ? frei.splice(n, 1)[0] : null;
      neu.push(Object.assign({id: vorher ? vorher.id : "e" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
        angelegt: vorher ? vorher.angelegt : new Date().toISOString()}, vorher && vorher.ausfall ? {ausfall: true} : {}, {name, art, von, bis}));
    };
    liste.forEach(tag => {
      if (von !== null && naechsterArbeitstag(bis) === tag){ bis = tag; return; }
      fertig(); von = bis = tag;
    });
    fertig();
  }));
  neu.sort((a, b) => a.von < b.von ? -1 : a.von > b.von ? 1 : a.name < b.name ? -1 : 1);
  const bild = l => JSON.stringify(l.map(e => [e.name, e.art, e.von, e.bis]).sort());
  const geaendert = bild(alt) !== bild(neu);
  state.ereignisse = neu;
  return geaendert;
}

const ABW_HERKUNFT = {ereignis: "Urlaub & Krankheit", abgabe: "Abgabe", liste: "Terminliste", hand: "von Hand"};
const abwText = w => !w ? "verfügbar" : typeof w === "string" ? terminArtText(w) : terminArtText(w.a, w.von, w.bis);
const abwGleich = (a, b) => a !== undefined && a !== null && JSON.stringify(a) === JSON.stringify(b);

// Woher der Eintrag eines Tages stammt: ereignis | abgabe | liste | hand (null ohne Eintrag)
function abwHerkunft(sl, i, tag){
  const w = (((state.abwesend || {})[sl] || {})[i] || {})[tag];
  if (!w) return null;
  if (istEreignisArt(w)) return "ereignis";
  if (abwGleich((((state.onlineStand || {})[sl] || {})[i] || {})[tag], w)) return "abgabe";
  if (abwGleich((((state.listenStand || {})[sl] || {})[i] || {})[tag], w)) return "liste";
  return "hand";
}
// Hat eine Abgabe für den Tag etwas anderes gesagt, als jetzt dasteht? → {abgabe, text} oder null
function abwAbweichung(sl, i, tag){
  const o = (((state.onlineStand || {})[sl] || {})[i] || {})[tag];
  if (o === undefined || o === null) return null;
  const w = (((state.abwesend || {})[sl] || {})[i] || {})[tag];
  if (abwGleich(o, w)) return null;
  // Beides heißt „den ganzen Tag nicht da“ (etwa „kann nicht“ abgegeben, dann als Urlaub eingetragen):
  // für den Plan dasselbe, also kein Widerspruch
  if (typeof o === "string" && typeof w === "string") return null;
  return {abgabe: o, text: `Abgabe: „${abwText(o)}“ — eingetragen ist „${abwText(w)}“`};
}
// Einen Widerspruch auflösen: die Abgabe gilt wieder (abgabe = true) oder der Eintrag bleibt
function abwAbweichungLoesen(sl, i, tag, abgabe){
  const o = (((state.onlineStand || {})[sl] || {})[i] || {})[tag];
  if (o === undefined) return;
  if (abgabe){
    state.abwesend[sl] = state.abwesend[sl] || {};
    (state.abwesend[sl][i] = state.abwesend[sl][i] || {})[tag] = JSON.parse(JSON.stringify(o));
  } else delete state.onlineStand[sl][i][tag];
  ereignisseNachfuehren();
}

/* Die Liste der Woche: je Person zusammengefasst, was eingetragen ist, woher es stammt und
   wo eine Abgabe überschrieben wurde.
   → [{i, name, tage: [ti], text, herkunft, abweichung: {abgabe, text} | null}] */
function abwesenheitsListe(sl){
  const abw = (state.abwesend || {})[sl] || {}, mo = montagAusSchluessel(sl), raus = [];
  state.mitarbeiter.forEach((m, i) => {
    let offen = null;
    TAGE.forEach(([k], ti) => {
      const d = new Date(mo); d.setDate(mo.getDate() + ti);
      const w = istFeiertag(d) ? null : (abw[i] || {})[k], ab = istFeiertag(d) ? null : abwAbweichung(sl, i, k);
      if (!w && !ab){ offen = null; return; }
      const text = abwText(w), herkunft = w ? abwHerkunft(sl, i, k) : "hand";
      // aufeinanderfolgende Tage mit demselben Eintrag aus derselben Quelle gehören zusammen
      if (offen && !ab && !offen.abweichung && offen.text === text && offen.herkunft === herkunft && offen.tage[offen.tage.length - 1] === ti - 1){ offen.tage.push(ti); return; }
      offen = {i, name: m.name, tage: [ti], tag: k, text, herkunft, abweichung: ab};
      raus.push(offen);
    });
  });
  return raus;
}

// ==== kern/15-bereitschaft.js ====
/* Bereitschaft: Kann für eine Woche ein Plan entstehen, der nicht auf falschen
   Annahmen beruht?

   Blocker halten „Plan erzeugen“ an — ohne sie entstünde ein Plan, der falsch ist
   oder gegen das Gesetz verstößt, ohne dass es jemand merkt. Hinweise halten nicht
   an; der Plan rechnet dann nur mit dem, was bekannt ist.
   Jeder Punkt sagt, wo er sich beheben lässt: bereich = id aus BEREICHE oder "planen". */

// „nur von–bis“ / „nicht von–bis“ brauchen zwei Uhrzeiten, und die erste vor der zweiten
function abwZeitFehlt(e){
  if (!e || typeof e !== "object" || (e.a !== "nur" && e.a !== "ohne")) return false;
  return !hatZeit(e.von) || !hatZeit(e.bis) || minuten(e.von) >= minuten(e.bis);
}

// Unvollständige Zeitangaben einer Woche: [{mi, tag, name, label}]
function unvollstaendigeZeiten(sl){
  const abw = (state.abwesend || {})[sl] || {}, raus = [];
  state.mitarbeiter.forEach((m, mi) => {
    TAGE.forEach(([k, l]) => {
      if (abwZeitFehlt((abw[mi] || {})[k])) raus.push({mi, tag:k, name:m.name, label:l});
    });
  });
  return raus;
}

function bereitschaft(sl){
  const ms = state.mitarbeiter, blocker = [], hinweise = [];
  const b = (text, bereich, extra) => blocker.push(Object.assign({text, bereich}, extra || {}));
  const h = (text, bereich) => hinweise.push({text, bereich});
  const namen = l => l.map(m => m.name).join(", ");

  // Öffnungszeit — ohne sie gibt es keine Grundbesetzung
  if (!hatZeit(state.von) || !hatZeit(state.bis)) b("Die Öffnungszeit fehlt.", "filiale");
  else if (minuten(state.von) >= minuten(state.bis)) b("Die Öffnungszeit endet vor dem Beginn.", "filiale");

  if (!ms.length) b("Es ist noch kein Personal erfasst.", "personal");
  else {
    // Alter: entscheidet über Pausen, Arbeitszeit, 6–20 Uhr und fünf Tage
    const ohneAlter = ms.filter(m => altersAngabe(m) === null);
    if (ohneAlter.length) b(`Bei ${ohneAlter.length === 1 ? "einer Person" : ohneAlter.length + " Personen"} fehlt, ob sie 18 oder älter ist — `
      + "davon hängen Pausen, Arbeitszeiten und Ruhezeiten ab.", "personal", {alter: ohneAlter.map(m => ms.indexOf(m))});

    // Wer schließt auf, wer schließt ab, wer sitzt an der Kasse
    const a = auswertung();
    if (a.fruehOk === 0) b("Niemand kann die Frühschicht führen (Filialleitung oder Frühschichtvertretung).", "personal");
    if (a.spaetOk === 0) b("Niemand kann die Spätschicht führen (Filialleitung oder Spätschichtvertretung).", "personal");
    if (a.qual.kasse === 0) b("Niemand hat die Funktion „Kassieren“.", "personal");
    if (a.fruehOk === 1) h("Nur eine Person kann die Frühschicht führen — an ihren freien Tagen bleibt die Lücke.", "personal");
    if (a.spaetOk === 1) h("Nur eine Person kann die Spätschicht führen — an ihren freien Tagen bleibt die Lücke.", "personal");
    if (a.qual.kasse === 1) h("Nur eine Person hat die Funktion „Kassieren“.", "personal");
    // Kassieren lernt jeder zuerst — fehlt die Funktion, ist es meist nur nicht angehakt.
    // Und je weniger kassieren können, desto öfter muss die Leitung an die Kasse.
    const ohneKasse = ms.filter(m => !istLeitung(m) && !(m.qual || []).includes("kasse"));
    if (a.qual.kasse > 1 && ohneKasse.length) h(`Ohne Funktion „Kassieren“: ${namen(ohneKasse)} — stimmt das?`, "personal");
    if (a.ohneStunden.length) h(`Ohne Stundenangabe: ${namen(a.ohneStunden)} — sie werden nur nach Bedarf eingeplant.`, "personal");
    if (a.offeneAufgaben.length) h(`Wochenaufgaben ohne Tag, Dauer oder Personenzahl: ${a.offeneAufgaben.join(", ")} — sie fehlen im Plan.`, "aufgaben");
    const leitung = ms.filter(m => m.typ === "Filialleitung");
    if (leitung.length && !leitung.some(m => wochenStunden(m) > 0))
      h("Für die Filialleitung ist keine Standardwoche hinterlegt — der Plan legt ihre Zeiten selbst fest.", "standardwoche");
  }

  if (sl){
    const zeiten = unvollstaendigeZeiten(sl);
    if (zeiten.length) b(`„nur“ oder „nicht von–bis“ ohne vollständige Uhrzeit: `
      + zeiten.map(z => `${z.name} (${z.label})`).join(", ") + ".", "planen", {zeiten});
  }
  return {blocker, hinweise, bereit: !blocker.length};
}

// ==== kern/16-entwurf.js ====
/* Plan ändern: ein Entwurf über dem gültigen Plan.

   Der gültige Plan (state.plaene[sl]) bleibt unberührt, bis „Übernehmen“ gedrückt wird.
   Dazwischen liegt eine Liste von Änderungen (state.entwuerfe[sl].aenderungen). Jede
   lässt sich an- und abschalten; der Entwurf ist immer: gültiger Plan + alle
   eingeschalteten Änderungen, der Reihe nach. So lassen sich Lösungen nebeneinander
   ausprobieren und wieder zurücknehmen.

   Arten von Änderungen (Personen immer über den Namen, nie über den Platz in der Liste):
     abwesend  {name, ti, grund}     — fällt aus (krank | urlaub | nicht | schule)
     schicht   {name, ti, von, bis}  — arbeitet von–bis (ersetzt, was an dem Tag stand)
     frei      {name, ti}            — hat frei
     loesung   {fuer, ti, schritte}  — Ersatz für eine Lücke (aus den Vorschlägen)
     tage      {fuer, tage}          — Umplanung über mehrere Tage (Optimierer)
     notiz     {ti, notiz}           — Zeile „Notiz“ im Plan
     pausen    {ti}                  — Pausen des Tages so verschieben, dass die Besetzung hält
     aufgaben  {ti}                  — Aufgaben des Tages nach den heutigen Wochenaufgaben neu legen
   Dazu: id, aktiv, quelle (hand | vorschlag | assistent | abwesenheit), text.

   Wer laut Urlaub & Krankheit oder Abwesenheiten fehlt, aber noch im Plan steht, wird
   von selbst als Ausfall in den Entwurf übernommen (quelle „abwesenheit“) — dazu
   erscheinen gleich die Vorschläge. Abschalten lässt es sich trotzdem. */

const GRUND_TEXT = {krank: "krank", urlaub: "im Urlaub", nicht: "verhindert", schule: "in der Berufsschule"};
const GRUND_NAME = {krank: "Krank", urlaub: "Urlaub", nicht: "Kann nicht", schule: "Berufsschule"};

const aenderungsId = () => "a" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const personIndex = name => state.mitarbeiter.findIndex(m => m.name === name);
const platzImPlan = (plan, name) => plan.namen ? plan.namen.indexOf(name) : personIndex(name);
const tagName = ti => TAGNAMEN[TAGE[ti][0]];
const tagDatum = (plan, ti) => { const d = new Date(montagDer(plan.mo instanceof Date ? isoVon(plan.mo) : plan.mo)); d.setDate(d.getDate() + ti); return d; };

// „30 Minuten“, „1 Stunde“, „2½ Stunden“
function dauerText(min){
  if (min < 60) return `${min} Minuten`;
  const h = Math.floor(min / 60), halb = min % 60 >= 30;
  return h === 1 && !halb ? "1 Stunde" : `${h}${halb ? "½" : ""} Stunden`;
}

// Den Entwurf einer Woche holen — neu angelegt, wenn der Plan inzwischen ein anderer ist.
// Abwesenheiten, die der Plan noch nicht kennt, kommen dabei als Ausfall hinein.
function entwurfHolen(sl){
  const kurz = (state.plaene || {})[sl];
  if (!kurz) return null;
  state.entwuerfe = state.entwuerfe || {};
  let e = state.entwuerfe[sl];
  if (!e || e.basis !== kurz.erstellt) e = state.entwuerfe[sl] = {basis: kurz.erstellt, aenderungen: []};
  const offen = konflikteIm(sl, kurz);
  const schluessel = k => `abw:${k.name}:${k.ti}`;
  // erledigte (Abwesenheit wieder gelöscht) fallen heraus, neue kommen dazu
  e.aenderungen = e.aenderungen.filter(a => a.quelle !== "abwesenheit" || offen.some(k => schluessel(k) === a.id));
  offen.forEach(k => {
    if (e.aenderungen.some(a => a.id === schluessel(k))) return;
    e.aenderungen.unshift({id: schluessel(k), typ: "abwesend", name: k.name, ti: k.ti, grund: k.grund, aktiv: true,
      quelle: "abwesenheit", text: `${k.name} ${tagName(k.ti)}: ${GRUND_NAME[k.grund] || "fällt aus"}`});
  });
  return e;
}

// Gültiger Plan + eingeschaltete Änderungen. Was nicht mehr passt, wird übersprungen
// und gemeldet (etwa ein Ersatz für eine Schicht, die es so nicht mehr gibt).
function entwurfAnwenden(kurz, aenderungen){
  const plan = kopie(kurz);
  plan.namen = plan.namen || state.mitarbeiter.map(m => m.name);
  plan.notizen = Object.assign({}, kurz.notizen || {});
  const passtNicht = new Set();
  (aenderungen || []).forEach(a => { if (a.aktiv && !aenderungAnwenden(plan, a)) passtNicht.add(a.id); });
  return {plan, passtNicht};
}

function aenderungAnwenden(plan, a){
  const tag = plan.tage[a.ti];
  if (a.typ === "tage"){
    for (const [k, liste] of Object.entries(a.tage)){
      if (liste.some(x => personIndex(x.name) < 0)) return false;
      plan.tage[+k].schichten = liste.map(x => Object.assign(kopie(x.s), {mi: planPlatz(plan, personIndex(x.name))}));
    }
    return true;
  }
  if (!tag || tag.feiertag) return false;
  if (a.typ === "notiz"){
    if (a.notiz) plan.notizen[tag.key] = a.notiz; else delete plan.notizen[tag.key];
    return true;
  }
  if (a.typ === "pausen"){ pausenLegenTag(plan, a.ti, true); return true; }
  if (a.typ === "aufgaben"){ aufgabenNeuLegen(plan, a.ti); return true; }
  if (a.typ === "loesung"){
    const schritte = a.schritte.map(x => Object.assign({}, x, {i: personIndex(x.name)}));
    if (schritte.some(x => x.i < 0)) return false;
    for (const x of schritte) if (x.art === "aendern"){
      const j = platzImPlan(plan, x.name);
      if (!tag.schichten.some(s => s.mi === j && s.von === x.alt[0] && s.bis === x.alt[1])) return false;
    }
    aenderungenAnwenden(plan, a.ti, schritte);
    return true;
  }
  const i = personIndex(a.name);
  if (i < 0) return false;
  const j = planPlatz(plan, i);
  const bisher = tag.schichten.find(s => s.mi === j);
  tag.schichten = tag.schichten.filter(s => s.mi !== j);
  if (a.typ === "schicht"){
    if (!(a.bis > a.von)) return false;
    // a.rolle (z. B. „Vertragsstunden“ beim Auffüllen im Planentwurf): die Schicht behält, wofür sie da war
    const rollen = a.rolle ? [...new Set([...((bisher && bisher.rollen) || []), a.rolle])] : ["Vertretung"];
    const s = {mi: j, von: a.von, bis: a.bis, rollen, mehrarbeit: false};
    tag.schichten.push(s);
    schichtSetzen(plan, a.ti, s, a.von, a.bis);
    tag.schichten.sort((x, y) => x.von - y.von || x.mi - y.mi);
  }
  return true;
}

// Schichten einer Person an einem Tag, nach Beginn sortiert
function schichtenVon(plan, name, ti){
  const j = platzImPlan(plan, name);
  return j < 0 ? [] : plan.tage[ti].schichten.filter(s => s.mi === j).sort((a, b) => a.von - b.von);
}
// „06:00–14:00“ einer Person an einem Tag, leer wenn frei
const schichtText = (plan, name, ti) => schichtenVon(plan, name, ti).map(s => hhmm(s.von) + "–" + hhmm(s.bis)).join(" + ");

// Halbe Stunden zu Zeitspannen: [600, 630, 660, 840] → „10:00–11:30, 14:00–14:30“
function spannenText(punkte){
  const l = [...punkte].sort((a, b) => a - b), raus = [];
  l.forEach(m => {
    const letzte = raus[raus.length - 1];
    if (letzte && letzte[1] === m) letzte[1] = m + 30; else raus.push([m, m + 30]);
  });
  return raus.map(([a, b]) => hhmm(a) + "–" + hhmm(b)).join(", ");
}

// Was an einer Stelle fehlt, in Alltagsworten
const FEHLT_WORTE = {"Mindestbesetzung": "zu wenige Personen im Laden (mindestens zwei nötig)", "Kasse": "niemand an der Kasse",
  "Schichtführung früh": "niemand, der die Frühschicht führt", "Schichtführung spät": "niemand, der die Spätschicht führt"};
function fehltText(plan, ti, punkte){
  const was = [...new Set(punkte.flatMap(m => maengelGruende(plan, ti, m)))];
  return was.map(w => FEHLT_WORTE[w] || `niemand für „${w}“`).join(", ");
}
// Dasselbe als kurze Liste für den Assistenten: „Kasse, zweite Person, Abendprogramm“
const FEHLT_KURZ = {"Mindestbesetzung": "zweite Person", "Schichtführung früh": "Schichtführung", "Schichtführung spät": "Schichtführung"};
const fehltGruende = (plan, ti, punkte) => [...new Set(punkte.flatMap(m => maengelGruende(plan, ti, m)).map(w => FEHLT_KURZ[w] || w))];

// Steht jemand im Plan, obwohl er laut Abwesenheiten nicht kann?
function abwesenheitsKonflikt(e, schichten){
  if (!e || !schichten.length) return null;
  if (typeof e === "string") return e;
  const a = hatZeit(e.von) ? minuten(e.von) : null, b = hatZeit(e.bis) ? minuten(e.bis) : null;
  if (a === null || b === null || b <= a) return null;
  const passt = s => e.a === "nur" ? (s.von >= a && s.bis <= b) : (s.bis <= a || s.von >= b);
  return schichten.every(passt) ? null : (e.a === "nur" ? `nur ${e.von}–${e.bis}` : `nicht ${e.von}–${e.bis}`);
}
function konflikteIm(sl, plan){
  const abw = (state.abwesend || {})[sl] || {}, raus = [];
  state.mitarbeiter.forEach((m, i) => plan.tage.forEach((t, ti) => {
    if (t.feiertag) return;
    const k = abwesenheitsKonflikt((abw[i] || {})[t.key], schichtenVon(plan, m.name, ti));
    if (!k) return;
    const grund = GRUND_TEXT[k] ? k : "nicht";
    raus.push({art: "konflikt", i, ti, name: m.name, grund,
      text: `${m.name} ist ${tagName(ti)} ${GRUND_TEXT[k] || "nur eingeschränkt verfügbar (" + k + ")"}, steht aber ${schichtText(plan, m.name, ti)} im Plan.`});
  }));
  return raus;
}
// Für die Markierung an „Plan ändern“: wer fehlt, steht aber noch im gültigen Plan
const planKonflikte = sl => (state.plaene || {})[sl] ? konflikteIm(sl, state.plaene[sl]) : [];

/* Was am Entwurf noch zu tun ist (rot) und was sich geändert hat (grün).
   offen: [{art: konflikt | luecke | recht | passtNicht, text, …}]
   zellen: {"i|ti": {art: neu | weg | konflikt | recht, alt: [[von, bis]], grund}} */
function entwurfPruefen(sl, kurz, eintrag){
  const {plan, passtNicht} = entwurfAnwenden(kurz, eintrag.aenderungen);
  const offen = [], zellen = {};
  // Abwesenheiten, die im Entwurf abgeschaltet wurden, bleiben rot
  konflikteIm(sl, plan).forEach(k => { zellen[k.i + "|" + k.ti] = {art: "konflikt"}; offen.push(k); });
  // Lücken, die es im gültigen Plan nicht gab
  const luecken = {};
  plan.tage.forEach((t, ti) => {
    if (t.feiertag) return;
    const vorher = new Set(fehlzeiten(kurz, ti));
    const neu = fehlzeiten(plan, ti).filter(m => !vorher.has(m));
    if (!neu.length) return;
    luecken[ti] = neu;
    offen.push({art: "luecke", ti, punkte: neu,
      text: `${tagName(ti)} ${spannenText(neu)} nicht richtig besetzt: ${fehltText(plan, ti, neu)}.`});
  });
  // Lücken im gültigen Plan, die nur an überlappenden Pausen liegen — mit „Pausen verschieben“ behoben
  pausenLuecken(plan).forEach(x => offen.push({art: "pausen", ti: x.ti, text: pausenLueckeText(plan, x)}));
  // Aufgaben außerhalb ihrer Frist (Wochenaufgaben geändert oder alte Regel) — mit „Aufgaben neu legen“ behoben
  aufgabenAusserhalb(plan).forEach(x => offen.push({art: "aufgaben", ti: x.ti, text: aufgabenAusserhalbText(x), info: aufgabenAusserhalbGrund(x)}));
  // Gesetz und Hausregeln: nur, was durch die Änderungen neu dazukam
  const vorher = new Set(handPruefung(planLaden(kurz)));
  const recht = handPruefung(planLaden(plan)).filter(x => !vorher.has(x) && !/nicht richtig besetzt/.test(x));
  recht.forEach(text => offen.push({art: "recht", text}));
  // Aushilfen über der Minijob-Grenze des Monats — was durch die Änderungen neu dazukam
  const schonDrueber = new Set(minijobVerstoesse(kurz).map(x => x.name + "|" + x.monat));
  minijobVerstoesse(plan).filter(x => !schonDrueber.has(x.name + "|" + x.monat)).forEach(x => offen.push({art: "minijob", name: x.name, text: x.text}));
  eintrag.aenderungen.filter(a => passtNicht.has(a.id)).forEach(a =>
    offen.push({art: "passtNicht", id: a.id, text: `„${a.text}“ passt nicht mehr zum Plan — bitte abschalten oder neu wählen.`}));
  // Zellen, die anders sind als im gültigen Plan — mit der alten Zeit zum Vergleich
  state.mitarbeiter.forEach((m, i) => plan.tage.forEach((t, ti) => {
    const key = i + "|" + ti;
    const alt = schichtenVon(kurz, m.name, ti).map(s => [s.von, s.bis]);
    const jetzt = schichtText(plan, m.name, ti);
    const altText = schichtText(kurz, m.name, ti);
    if (recht.some(x => x.startsWith(`${t.label}: ${m.name} `))) zellen[key] = {art: "recht", alt};
    else if (!zellen[key] && altText !== jetzt) zellen[key] = {art: jetzt ? "neu" : "weg", alt};
    else if (!zellen[key] && jetzt){
      // Gleiche Zeit, andere Pause: die alte Pause klein darunter
      const a0 = schichtenVon(kurz, m.name, ti)[0], b0 = schichtenVon(plan, m.name, ti)[0];
      if (a0 && b0 && a0.pauseVon !== b0.pauseVon) zellen[key] = {art: "neu", alt, pause: a0.pauseVon === null || a0.pauseVon === undefined ? null : [a0.pauseVon, a0.pauseBis]};
    }
  }));
  eintrag.aenderungen.filter(a => a.aktiv && a.typ === "abwesend").forEach(a => {
    const z = zellen[personIndex(a.name) + "|" + a.ti];
    if (z) z.grund = GRUND_NAME[a.grund] || "";
  });
  return {plan, offen, zellen, luecken, passtNicht};
}

/* ---- Vorschläge -------------------------------------------------------------
   Für jeden Ausfall im Entwurf: Was fehlt ohne die Person, und welche Wege schließen
   die Lücke — ganz, oder wenigstens teilweise. Jeder Weg wird in Sätzen beschrieben
   (wer kommt, wer bleibt länger, vorher → nachher), mit Ergebnis und Kosten. */

// Ausfälle des Entwurfs vorübergehend als Abwesenheit eintragen, damit niemand
// vorgeschlagen wird, der im Entwurf fehlt oder als „kann nicht“ vermerkt ist
function mitEntwurfsAbwesenheiten(sl, eintrag, fn){
  state.abwesend = state.abwesend || {};
  const vorher = kopie(state.abwesend[sl] || {});
  const w = state.abwesend[sl] = kopie(vorher);
  (eintrag ? eintrag.aenderungen : []).filter(a => a.aktiv && a.typ === "abwesend").forEach(a => {
    const i = personIndex(a.name);
    if (i >= 0) w[i] = Object.assign({}, w[i], {[TAGE[a.ti][0]]: a.grund});
  });
  try { return fn(); } finally { state.abwesend[sl] = vorher; }
}

// Wer arbeitet an einem Tag vorher und nachher anders — als Sätze
function zeilenVergleich(vorher, nachher, ti, ausser){
  const namen = [...new Set([...(vorher.namen || []), ...(nachher.namen || [])])].filter(n => n !== ausser && personIndex(n) >= 0);
  return namen.map(name => {
    const a = schichtenVon(vorher, name, ti), b = schichtenVon(nachher, name, ti);
    const at = a.map(s => hhmm(s.von) + "–" + hhmm(s.bis)).join(" + "), bt = b.map(s => hhmm(s.von) + "–" + hhmm(s.bis)).join(" + ");
    if (at === bt) return null;
    let satz;
    if (!a.length) satz = `${name} kommt zusätzlich ${bt}`;
    else if (!b.length) satz = `${name} hat frei statt ${at}`;
    else if (a.length === 1 && b.length === 1){
      const [x, y] = [a[0], b[0]];
      if (y.von === x.von && y.bis > x.bis) satz = `${name} bleibt ${dauerText(y.bis - x.bis)} länger: bis ${hhmm(y.bis)} statt ${hhmm(x.bis)}`;
      else if (y.bis === x.bis && y.von < x.von) satz = `${name} kommt ${dauerText(x.von - y.von)} früher: ab ${hhmm(y.von)} statt ${hhmm(x.von)}`;
      else if (y.von < x.von && y.bis > x.bis) satz = `${name} kommt früher und bleibt länger: ${bt} statt ${at}`;
      else satz = `${name} arbeitet ${bt} statt ${at}`;
    } else satz = `${name} arbeitet ${bt} statt ${at}`;
    return {name, vorher: at, nachher: bt, satz};
  }).filter(Boolean);
}

// Schnelle Kopie, in der nur ein Tag verändert werden darf
function tagKopie(plan, ti){
  const p = Object.assign({}, plan, {tage: plan.tage.slice(), namen: (plan.namen || []).slice()});
  p.tage[ti] = Object.assign({}, plan.tage[ti], {schichten: plan.tage[ti].schichten.map(s => Object.assign({}, s))});
  return p;
}

// Wenn sich die Lücke nicht ganz schließen lässt: die Wege, die am meisten davon schließen
function teilLoesungen(mit, ti, zielPunkte, lang){
  const tag = mit.tage[ti], r = tagesRaster(tag);
  const rest = p => fehlzeiten(p, ti).filter(m => !zielPunkte.includes(m)).length;
  const offen0 = fehlzeiten(mit, ti).filter(m => !zielPunkte.includes(m));
  if (!offen0.length) return [];
  const g0 = Math.min(...offen0), g1 = Math.max(...offen0) + 30;
  const raus = [];
  const probe = (aenderungen, laenge, merke) => {
    const p = tagKopie(mit, ti);
    aenderungenAnwenden(p, ti, aenderungen);
    const n = rest(p);
    if (n < offen0.length && (!merke.best || n < merke.best.rest || (n === merke.best.rest && laenge < merke.best.laenge)))
      merke.best = {aenderungen, rest: n, laenge};
  };
  // a) jemand, der frei hat, kommt für einen Teil der Lücke (mindestens 4 h)
  state.mitarbeiter.forEach((m, i) => {
    if (schichtenVon(mit, m.name, ti).length) return;
    const merke = {};
    for (let L = MINSCHICHT * 60; L <= (lang ? REGELN.langAnwesenheit : REGELN.maxAnwesenheit) * 60; L += 60)
      for (let von = Math.max(r.tagVon, g0 - L + 30); von < g1 && von + L <= r.tagBis; von += 30){
        const p = tagKopie(mit, ti);
        if (!ausfallErlaubt(p, planPlatz(p, i), ti, von, von + L, undefined, lang)) continue;
        probe([{art: "neu", i, von, bis: von + L}], L, merke);
      }
    if (merke.best) raus.push(merke.best);
  });
  // b) eine Schicht wird so weit verlängert, wie es Gesetz und Ruhezeit erlauben
  tag.schichten.forEach(s0 => {
    const p0 = planPerson(mit, s0.mi);
    if (p0.i < 0) return;
    const merke = {};
    for (let von = s0.von; von >= Math.max(r.tagVon, s0.von - 240); von -= 30)
      for (let bis = s0.bis; bis <= Math.min(r.tagBis, s0.bis + 240); bis += 30){
        if ((von === s0.von && bis === s0.bis) || !ausfallErlaubt(mit, s0.mi, ti, von, bis, s0, lang)) continue;
        probe([{art: "aendern", i: p0.i, alt: [s0.von, s0.bis], von, bis}], bis - von, merke);
      }
    if (merke.best) raus.push(merke.best);
  });
  return raus.sort((a, b) => a.rest - b.rest || a.laenge - b.laenge).slice(0, 3);
}

// Einen Weg für die Anzeige aufbereiten
function wegAufbereiten(mit, ti, aenderungen, zielPunkte, ausser){
  const nachher = tagKopie(mit, ti);
  aenderungenAnwenden(nachher, ti, aenderungen);
  const luecke = fehlzeiten(mit, ti).filter(m => !zielPunkte.includes(m));
  const offen = fehlzeiten(nachher, ti).filter(m => !zielPunkte.includes(m));
  const zeilen = zeilenVergleich(mit, nachher, ti, ausser);
  const mehr = tagesStunden(nachher, ti) - tagesStunden(mit, ti);
  // Konto der Beteiligten nach der Woche
  const voll = Object.assign(kopie(mit), {tage: mit.tage.slice()}); voll.tage[ti] = nachher.tage[ti]; voll.namen = nachher.namen;
  let punkte = mehr * 2 + aenderungen.length * 1.5 + offen.length * 20;
  const konto = zeilen.map(z => {
    const m = state.mitarbeiter[personIndex(z.name)], k = kontoNach(voll, platzImPlan(voll, z.name));
    if (!k) return null;
    if (k.ende > 0) punkte += k.ende * (darfUeberstunden(m) ? 1 : 25) * ueberGewicht(m) / 2;
    if (k.ende < 0) punkte += k.ende * 0.5;
    return {name: z.name, ist: k.ist, ende: k.ende};
  }).filter(Boolean);
  // Wer durch diesen Weg an dem Tag über 8 h arbeitet (lange Schicht) — nur als letzter Ausweg
  const lang = nachher.tage[ti].schichten.filter(s => istLang(s.arbeit) && !mit.tage[ti].schichten.some(x => x.mi === s.mi && istLang(x.arbeit)))
    .map(s => ({name: planPerson(nachher, s.mi).name, arbeit: s.arbeit}));
  punkte += lang.length * 12;
  const titel = zeilen.length === 1 ? zeilen[0].satz
    : zeilen.length === 2 ? `${zeilen[0].name.split(" ")[0]} und ${zeilen[1].name.split(" ")[0]} ${
        zeilen.every(z => /länger|früher/.test(z.satz)) ? "teilen sich die Lücke" : "ändern ihre Zeiten"}`
    : `${zeilen.length} Personen verschieben ihre Zeiten`;
  return {schritte: aenderungen.map(x => Object.assign({}, x, {name: (state.mitarbeiter[x.i] || {}).name})),
          titel, zeilen, luecke, offen, voll: !offen.length, mehr, konto, punkte, ti, lang,
          tagVorher: mit.tage[ti], tagNachher: nachher.tage[ti], namen: nachher.namen};
}

// Alle Wege für die Lücken eines Tages: erst die ganzen, dann die besten teilweisen
function wegeFuerTag(mit, ti, weg, ziel, ausser){
  let wege = luekenSchliessen(mit, ti, weg, 0, ziel).filter(w => w.aenderungen.length);
  // Lange Schichten (über 8 h Arbeit) erst, wenn sich die Lücke sonst gar nicht ganz schließen lässt
  if (!wege.length) wege = luekenSchliessen(mit, ti, weg, 0, ziel, true).filter(w => w.aenderungen.length);
  const ganz = wege.map(w => wegAufbereiten(mit, ti, w.aenderungen, ziel.punkte, ausser));
  const gesehen = new Set(), raus = [];
  ganz.sort((a, b) => a.punkte - b.punkte).forEach(w => { if (!gesehen.has(w.titel) && raus.length < 3){ gesehen.add(w.titel); raus.push(w); } });
  const teilweise = lang => teilLoesungen(mit, ti, ziel.punkte, lang).forEach(w => {
    const v = wegAufbereiten(mit, ti, w.aenderungen, ziel.punkte, ausser);
    // ein langer Teilweg nur, wenn er mehr schließt als alles bisher Gefundene
    if (lang && raus.some(x => x.offen.length <= v.offen.length)) return;
    if (!gesehen.has(v.titel) && raus.length < 4){ gesehen.add(v.titel); raus.push(v); }
  });
  if (raus.length < 2) teilweise(false);
  if (!raus.some(w => w.voll)) teilweise(true);
  wegeOrdnen(raus);
  raus.forEach((w, n) => w.warum = wegErklaerung(w, n, raus));
  return raus;
}

function wegErklaerung(w, platz, alle){
  const teile = [];
  teile.push(w.voll ? `Schließt die Lücke ${spannenText(w.luecke)} ganz.`
    : `Schließt die Lücke nur teilweise: ${spannenText(w.offen)} bleibt offen. Ein vollständiger Weg am selben Tag hält Gesetz oder Ruhezeiten nicht ein.`);
  if ((w.lang || []).length) teile.push(`Lange Schicht: ${w.lang.map(x => `${x.name} arbeitet an dem Tag ${h1(x.arbeit)} Stunden`).join(", ")} — mit üblich langen Schichten ließ sich die Lücke nicht ganz schließen. ${LANG_HINWEIS}`);
  teile.push("Geprüft: Ruhezeit zwischen zwei Schichten, Höchstarbeitszeit, Pausen, Jugendschutz, höchstens sechs Arbeitstage und alle eingetragenen Abwesenheiten.");
  teile.push(w.mehr > 0.01 ? `Kostet ${h1(w.mehr)} Stunden mehr an diesem Tag.` : w.mehr < -0.01 ? `Spart ${h1(-w.mehr)} Stunden.` : "Kostet keine zusätzlichen Stunden.");
  if (alle.length > 1) teile.push(w.gelernt ? `Steht oben, weil du in dieser Filiale meist so löst: ${LOESUNGSARTEN[w.art]}.`
    : platz === 0 ? "Steht oben, weil er am wenigsten Mehrstunden und Kontobelastung bringt."
    : `Platz ${platz + 1} — ${w.voll ? "mehr Stunden oder mehr Kontobelastung als die Wege davor" : "schließt weniger als die Wege davor"}.`);
  return teile.join(" ");
}

/* Gruppen für die Anzeige: je eingeschaltetem Ausfall {fuer, schicht, luecke, fehlt, wege}.
   abTag: Tage davor sind vorbei — sie bekommen trotzdem Wege (zum Nachtragen), aber
   den Hinweis, dass sie vorbei sind. */
