/* o.nur: nur für diesen Ausfall rechnen (schneller); o.gesperrt: Namen, die für die Wege nicht in Frage
   kommen („keiner von denen kann“) — ihre Schichten bleiben im Plan */
function entwurfVorschlaege(sl, kurz, eintrag, abTag, o){
  o = o || {};
  const raus = [];
  eintrag.aenderungen.filter(a => a.aktiv && a.typ === "abwesend" && (!o.nur || a.id === o.nur)).forEach(c => {
    const andere = eintrag.aenderungen.filter(x => x !== c && x.fuer !== c.id);
    const ohne = entwurfAnwenden(kurz, andere).plan;
    const s = schichtenVon(ohne, c.name, c.ti);
    if (!s.length) return;
    const mit = tagKopie(ohne, c.ti);
    const j = platzImPlan(mit, c.name);
    mit.tage[c.ti].schichten = mit.tage[c.ti].schichten.filter(x => x.mi !== j);
    const ziel = {maengel: tagesMaengel(ohne, c.ti), punkte: fehlzeiten(ohne, c.ti)};
    const luecke = fehlzeiten(mit, c.ti).filter(m => !ziel.punkte.includes(m));
    const gruppe = {fuer: c, schicht: {von: s[0].von, bis: s[s.length - 1].bis}, luecke, vergangen: c.ti < (abTag || 0),
                    fehlt: luecke.length ? fehltText(mit, c.ti, luecke) : "", gruende: fehltGruende(mit, c.ti, luecke), wege: []};
    const sperre = (o.gesperrt || []).map(name => ({aktiv: true, typ: "abwesend", name, ti: c.ti, grund: "nicht"}));
    if (luecke.length) gruppe.wege = mitEntwurfsAbwesenheiten(sl, Object.assign({}, eintrag, {aenderungen: andere.concat(c, sperre)}),
      () => wegeFuerTag(mit, c.ti, {von: s[0].von, bis: s[s.length - 1].bis}, ziel, c.name));
    raus.push(gruppe);
  });
  return raus;
}

/* Übernehmen: der Entwurf wird der gültige Plan. Ausfälle landen in den Abwesenheiten,
   Krankheit und Urlaub zusätzlich unter „Urlaub & Krankheit“ (zusammenhängende Tage als
   ein Eintrag). Der Grund steht nirgends im Plan. Was sich gegenüber dem ursprünglich
   erstellten Plan geändert hat, merkt sich der Plan (urfassung) — die Startseite zeigt es. */
function entwurfUebernehmen(sl){
  const kurz = state.plaene[sl], eintrag = entwurfHolen(sl);
  if (!kurz || !eintrag) return null;
  const {plan} = entwurfAnwenden(kurz, eintrag.aenderungen);
  const aktiv = eintrag.aenderungen.filter(a => a.aktiv);
  const mo = montagDer(kurz.mo);
  state.abwesend = state.abwesend || {};
  state.abwesend[sl] = state.abwesend[sl] || {};
  const neueEreignisse = {};
  aktiv.filter(a => a.typ === "abwesend").forEach(a => {
    const i = personIndex(a.name);
    if (i < 0) return;
    const vorher = (state.abwesend[sl][i] || {})[TAGE[a.ti][0]];
    state.abwesend[sl][i] = Object.assign({}, state.abwesend[sl][i], {[TAGE[a.ti][0]]: a.grund});
    // Was schon als Urlaub/Krank eingetragen war, nicht doppelt anlegen
    if ((a.grund === "krank" || a.grund === "urlaub") && vorher !== a.grund)
      (neueEreignisse[a.name + "|" + a.grund] = neueEreignisse[a.name + "|" + a.grund] || []).push(a.ti);
  });
  Object.entries(neueEreignisse).forEach(([k, tage]) => {
    const [name, art] = k.split("|");
    tage.sort((x, y) => x - y).reduce((gruppen, ti) => {
      const g = gruppen[gruppen.length - 1];
      if (g && g[g.length - 1] === ti - 1) g.push(ti); else gruppen.push([ti]);
      return gruppen;
    }, []).forEach(g => {
      const von = isoVon(new Date(mo.getTime() + g[0] * 864e5)), bis = isoVon(new Date(mo.getTime() + g[g.length - 1] * 864e5));
      (state.ereignisse = state.ereignisse || []).push({id: "e" + aenderungsId(), name, art, von, bis,
        angelegt: new Date().toISOString(), ausfall: true});
    });
  });
  ereignisseNachfuehren();
  // Ursprüngliche Zeiten der geänderten Zellen festhalten (die erste Fassung zählt)
  const urfassung = Object.assign({}, kurz.urfassung || {});
  state.mitarbeiter.forEach(m => plan.tage.forEach((t, ti) => {
    const k = m.name + "|" + ti, alt = schichtText(kurz, m.name, ti), neu = schichtText(plan, m.name, ti);
    if (alt === neu) return;
    if (!(k in urfassung)) urfassung[k] = alt;
    if (urfassung[k] === neu) delete urfassung[k];
  }));
  const neu = Object.assign(plan, {geaendertVonHand: true, geaendert: new Date().toISOString(), urfassung});
  // Nachvollziehbar bleiben, was geändert wurde — ohne Gründe (Gesundheitsdaten)
  neu.ausfaelle = (kurz.ausfaelle || []).concat(aktiv.filter(a => a.typ !== "abwesend")
    .map(a => ({am: new Date().toISOString(), was: a.typ === "notiz" ? "Notiz" : a.text})));
  // Welche Art von Lösung gewählt wurde — nur die Art, nie die Personen (siehe wegeOrdnen)
  aktiv.forEach(a => { if (a.typ === "loesung") lernenMerken(a.art || wegArt(a.schritte)); else if (a.typ === "tage") lernenMerken("umplanen"); });
  einteilungFestschreiben(neu);             // die Schichten haben sich geändert — neu festhalten, wer was macht
  state.plaene[sl] = neu;
  delete state.entwuerfe[sl];
  return neu;
}

// ==== kern/17-analyse.js ====
/* Analyse: Reicht das Personal, was sagen die Konten, was ist für die Zukunft zu tun?

   Rechnet nur mit dem, was ohnehin im Planer steht (Verträge, Pläne, Konten). Keine
   Leistungsbewertung einzelner Personen — es geht um Besetzung und Verträge.

   Vergütung, wie sie bei Norma gilt:
   · Aushilfen (Minijob) bekommen ausgezahlt, was sie im Vormonat gearbeitet haben —
     einen Monat verzögert und nie mehr, als die Minijob-Grenze erlaubt. Was darüber
     liegt, wird in die nächsten Monate mitgenommen, nie ausgezahlt.
   · Teilzeit- und Vollzeitkräfte bekommen ein gleichmäßiges Gehalt, unabhängig von den
     gearbeiteten Stunden. Überstunden können ausgezahlt werden; Minusstunden müssen
     langfristig ausgeglichen werden. */

// Gesetzlicher Mindestlohn je Jahr (MiLoG; Beschluss der Mindestlohnkommission 2025)
const MINDESTLOHN = {2024: 12.41, 2025: 12.82, 2026: 13.90, 2027: 14.60};
function mindestlohn(jahr){
  const jahre = Object.keys(MINDESTLOHN).map(Number).sort((a, b) => a - b);
  const j = jahre.filter(x => x <= jahr).pop() || jahre[0];
  return MINDESTLOHN[j];
}
// Minijob-Grenze (§ 8 Abs. 1a SGB IV): Mindestlohn × 130 / 3, auf volle Euro aufgerundet
const minijobGrenze = jahr => Math.ceil(mindestlohn(jahr) * 130 / 3);
// Stundenlohn der Aushilfen: eingetragen, sonst der Mindestlohn
function aushilfeLohn(jahr){
  const l = nz((state.einstellungen || {}).aushilfeLohn);
  return l > 0 ? Math.max(l, mindestlohn(jahr)) : mindestlohn(jahr);
}
// So viele Stunden im Monat passen unter die Grenze (auf Viertelstunden abgerundet)
const minijobStunden = jahr => Math.floor(minijobGrenze(jahr) / aushilfeLohn(jahr) * 4) / 4;

// Ausfall durch Urlaub und Krankheit, als Anteil der Vertragsstunden
const AUSFALL = {urlaub: 0.115, krank: 0.055};       // ≈ 30 Urlaubstage von 260 · übliche Krankenquote im Handel
const AUSFALL_QUOTE = AUSFALL.urlaub + AUSFALL.krank;
// Regel (Simon, 17.11.2026): Überstunden bis 50 % der Vertragsstunden je Woche sind möglich —
// darüber erscheint ein Hinweis. Für Ausfälle rechnet die Analyse mit höchstens so viel, und nie
// über 48 h in der Woche (§ 3 ArbZG im Schnitt). Azubis und Aushilfen zählen nicht: Azubis machen
// keine, Aushilfen stecken schon im Minijob.
const UEBERSTUNDEN_ANTEIL = 0.50;
// Wer in einem Plan mehr als 50 % über dem Vertrag liegt → [{name, ist, soll}] (nur in der App, nie im Aushang)
function ueberFuenfzig(plan){
  const mo = plan.mo instanceof Date ? plan.mo : montagDer(plan.mo);
  return state.mitarbeiter.map((m, i) => {
    const j = platzImPlan(plan, m.name);
    if (j < 0 || !hatKonto(m)) return null;
    const soll = sollWoche(m, i, mo), ist = plan.tage.reduce((s, t) => s + t.schichten.filter(x => x.mi === j).reduce((a, x) => a + x.arbeit, 0), 0);
    return soll > 0 && ist > soll * (1 + UEBERSTUNDEN_ANTEIL) + 0.01 ? {name: m.name, ist, soll} : null;
  }).filter(Boolean);
}
const ueberFuenfzigText = x => `${x.name}: ${h1(x.ist)} h geplant — mehr als 50 % über dem Vertrag (${h1(x.soll)} h).`;

// Wie viele Überstunden eine Person in der Woche höchstens machen kann
const ueberstundenRaum = m => festesGehalt(m) && darfUeberstunden(m) && hatVertrag(m)
  ? Math.max(0, Math.min(stunden(m) * UEBERSTUNDEN_ANTEIL, REGELN.langWoche - stunden(m))) : 0;
const euro = n => n.toLocaleString("de-DE", {minimumFractionDigits: 2, maximumFractionDigits: 2}) + " €";
const istAushilfe = m => m.typ === "Aushilfe (Minijob)";
const festesGehalt = m => !istAushilfe(m) && !istAzubi(m);

// Gearbeitete Stunden je Monat und Name, aus allen Plänen (inklusive Archiv)
function stundenJeMonat(){
  const raus = {}, geplant = {};
  Object.values(state.plaene || {}).forEach(kurz => kurz.tage.forEach(t => {
    const monat = String(t.datum).slice(0, 7);
    geplant[monat] = (geplant[monat] || 0) + 1;
    t.schichten.forEach(s => {
      const name = kurz.namen ? kurz.namen[s.mi] : (state.mitarbeiter[s.mi] || {}).name;
      if (!name) return;
      raus[monat] = raus[monat] || {};
      raus[monat][name] = (raus[monat][name] || 0) + s.arbeit;
    });
  }));
  return {stunden: raus, geplant};
}
// Arbeitstage (Mo–Sa) eines Monats
function arbeitstageImMonat(monat){
  const [j, m] = monat.split("-").map(Number);
  let n = 0;
  for (let d = new Date(j, m - 1, 1, 12); d.getMonth() === m - 1; d.setDate(d.getDate() + 1)) if (d.getDay() !== 0) n++;
  return n;
}

// Monatskonto einer Aushilfe: gearbeitet, im Folgemonat ausgezahlt, mitgenommen
function aushilfenKonto(name){
  const {stunden, geplant} = stundenJeMonat();
  const monate = Object.keys(stunden).sort();
  let uebertrag = 0;
  return monate.map(monat => {
    const gearbeitet = (stunden[monat] || {})[name] || 0;
    const jahr = +monat.slice(0, 4), grenze = minijobStunden(jahr);
    const verfuegbar = gearbeitet + uebertrag;
    const ausgezahlt = Math.min(verfuegbar, grenze);
    uebertrag = viertel(verfuegbar - ausgezahlt);
    return {monat, gearbeitet: viertel(gearbeitet), ausgezahlt: viertel(ausgezahlt), uebertrag, grenze,
            vollstaendig: (geplant[monat] || 0) >= arbeitstageImMonat(monat) - 1};
  });
}

/* ---- Aushilfen: Orientierung in der Woche, Grenze im Monat (seit 16.11.2026) ----
   Die eingetragenen Wochenstunden sind eine Orientierung. Pflicht ist nur: In keinem
   Kalendermonat mehr Stunden, als die Minijob-Grenze beim Stundenlohn zulässt. Wochen über
   einen Monatswechsel zählen tageweise zum jeweiligen Monat. */
const monatVon = d => (d instanceof Date ? isoVon(d) : String(d)).slice(0, 7);
const MONATSNAMEN = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const monatName = monat => MONATSNAMEN[+monat.slice(5, 7) - 1];
// Eine Grenze wird nicht gerundet angezeigt: 43,25 h bleiben 43,25 h
const hGenau = n => n.toLocaleString("de-DE", {minimumFractionDigits: 1, maximumFractionDigits: 2});

// Stunden und geplante Tage je Monat für eine Person: alle gültigen Pläne — und statt der
// gespeicherten Fassung seiner Woche der übergebene Plan (Entwurf, Probe, gerade im Bau)
function monatsStunden(name, plan){
  const stunden = {}, tage = {};
  const zaehle = p => {
    const j = p.namen ? p.namen.indexOf(name) : personIndex(name);
    p.tage.forEach(t => {
      const monat = monatVon(t.datum);
      tage[monat] = (tage[monat] || 0) + 1;
      if (j >= 0) t.schichten.forEach(s => { if (s.mi === j) stunden[monat] = (stunden[monat] || 0) + s.arbeit; });
    });
  };
  const sl = plan ? wochenSchluessel(plan.mo instanceof Date ? plan.mo : montagDer(plan.mo)) : null;
  Object.keys(state.plaene || {}).forEach(k => { if (k !== sl) zaehle(state.plaene[k]); });
  if (plan) zaehle(plan);
  return {stunden, tage};
}

/* Stand einer Aushilfe in einem Monat — gemessen immer an der Minijob-Grenze: so viele Stunden
   darf sie im Monat höchstens arbeiten. Die eingetragenen Wochenstunden sind nur eine
   Orientierung für den Planer; sie können sich jederzeit ändern und zählen hier nicht.
   (Bis 17.11.2026 stand hier ein eigenes Ziel je Aushilfe und ein Hinweis unter 75 %.) */
function aushilfeMonat(name, monat, plan){
  const grenze = minijobStunden(+monat.slice(0, 4));
  const ist = viertel(monatsStunden(name, plan).stunden[monat] || 0);
  return {monat, monatsname: monatName(monat), ist, grenze, offen: Math.max(0, grenze - ist), ueber: ist > grenze + 0.01};
}

// Passt eine Schicht von–bis am Tag ti noch unter die Monatsgrenze? (`ausser`: die Schicht, die sie ersetzt)
function minijobPasst(plan, j, ti, von, bis, ausser){
  const {m, name} = planPerson(plan, j);
  if (!m || !istAushilfe(m)) return true;
  const tag = plan.tage[ti], monat = monatVon(tag.datum);
  const anw = (bis - von) / 60, neu = anw - pauseFuer(m, anw);
  const bisher = (monatsStunden(name, plan).stunden[monat] || 0) - (ausser && tag.schichten.includes(ausser) ? ausser.arbeit : 0);
  return bisher + neu <= minijobStunden(+monat.slice(0, 4)) + 0.01;
}

// Wer in einem Plan über der Monatsgrenze liegt → [{name, monat, stunden, grenze, text}]
function minijobVerstoesse(plan){
  const raus = [];
  state.mitarbeiter.filter(istAushilfe).forEach(m => {
    [...new Set(plan.tage.map(t => monatVon(t.datum)))].forEach(monat => {
      const a = aushilfeMonat(m.name, monat, plan);
      if (a.ueber) raus.push({name: m.name, monat, stunden: a.ist, grenze: a.grenze,
        text: `${m.name} käme im ${a.monatsname} auf ${h1(a.ist)} h — die Minijob-Grenze lässt ${hGenau(a.grenze)} h zu.`});
    });
  });
  return raus;
}

// Der Mindestbedarf einer Woche: aus den letzten Plänen (Messlatte), sonst aus der Einrichtung
function wochenBedarf(){
  const a = auswertung();
  const letzte = Object.keys(state.plaene || {}).sort().slice(-8).map(sl => state.plaene[sl].berechnung)
    .filter(b => b && b.mindest !== null && b.mindest !== undefined).map(b => b.mindest);
  if (letzte.length) return {stunden: letzte.reduce((s, x) => s + x, 0) / letzte.length,
    quelle: letzte.length === 1 ? "Aus dem letzten Plan" : `Schnitt der letzten ${letzte.length} Pläne`};
  return {stunden: a.bedarf, quelle: "aus der Einrichtung gerechnet"};
}

/* Geplante Stunden je Wochentag: der Schnitt über alle Pläne (Feiertage zählen nicht mit)
   und — zum Vergleich — die Woche woche (Wochenschlüssel; null an einem Feiertag).
   → [{tag, schnitt, wochen, woche}] oder null ohne Plan */
function stundenJeWochentag(woche){
  const sl = Object.keys(state.plaene || {}).sort();
  if (!sl.length) return null;
  const summe = t => t.schichten.reduce((s, x) => s + x.arbeit, 0);
  return TAGE.map(([k, l], ti) => {
    const werte = sl.map(x => state.plaene[x].tage[ti]).filter(t => t && !t.feiertag).map(summe);
    const w = woche && state.plaene[woche] ? state.plaene[woche].tage[ti] : null;
    return {tag: l, schnitt: werte.length ? werte.reduce((s, x) => s + x, 0) / werte.length : 0, wochen: werte.length,
            woche: w && !w.feiertag ? summe(w) : null};
  });
}

function personalAnalyse(){
  const a = auswertung(), jahr = new Date().getFullYear();
  const bedarf = wochenBedarf();
  const brutto = bedarf.stunden === null ? null : bedarf.stunden / (1 - AUSFALL_QUOTE);
  // Vorhanden: die Vertragsstunden der Festangestellten und Azubis — und was die Aushilfen
  // flexibel abdecken können: je Aushilfe die Minijob-Grenze, auf die Woche gerechnet.
  // (Ihre eingetragenen Wochenstunden sind nur Orientierung und zählen hier nicht.)
  const aushilfen = state.mitarbeiter.filter(istAushilfe).length;
  const aushilfeWoche = minijobStunden(jahr) * 12 / 52;
  const vertrag = state.mitarbeiter.filter(m => !istAushilfe(m)).reduce((s, m) => s + stunden(m), 0);
  const flexibel = aushilfen * aushilfeWoche;
  const vorhanden = vertrag + flexibel;
  const stand = ueberstundenZuBeginn(aktuellerMontag());
  const konten = state.mitarbeiter.map((m, i) => ({m, i, stand: stand[i]}));
  // Was Urlaub und Krankheit im Schnitt je Woche kosten — und wie viel davon Überstunden tragen können
  const ausfall = brutto === null ? null : brutto - bedarf.stunden;
  const ueberPuffer = state.mitarbeiter.reduce((s, m) => s + ueberstundenRaum(m), 0);
  const ueberstunden = ausfall === null ? 0 : Math.min(ausfall, ueberPuffer);
  return {a, bedarf, brutto, vertrag, aushilfen, aushilfeWoche, flexibel, vorhanden, diff: brutto === null ? null : vorhanden - brutto, konten,
          ausfall, ueberPuffer, ueberstunden, minijobWoche: Math.round(aushilfeWoche * 2) / 2, jahr};
}

/* Fehlen Stunden: die Möglichkeiten nebeneinander, jede mit dem, was sie abdeckt, ihren Vor- und
   Nachteilen — und eine begründete Empfehlung (seit 17.11.2026).
   Lücke G = Bedarf mit Urlaub und Krankheit minus Vorhandenes; davon S = Lücke schon ohne Ausfälle
   (dauerhaft), A = der Teil aus Urlaub und Krankheit. Überstunden: höchstens 50 % der Vertragsstunden
   je Person und nie über 48 h (ueberstundenRaum), zusammen U.
   Empfehlung: Was dauerhaft fehlt (S), wird fest besetzt — nicht mit Überstunden. Ausfälle tragen
   Überstunden, solange die Last gering bleibt (bis 30 % von U); was darüber hinausgeht, kommt zur
   Einstellung dazu. Wie viele Stunden die neue Person hat, folgt daraus.
   → {kennung, art, titel, text, optionen: [{titel, deckt, plus, minus, empfohlen}]} */
function personalEmpfehlung(x){
  const halbe = n => Math.ceil(n * 2) / 2, stufe = n => Math.max(10, Math.round(n / 5) * 5);
  const G = -x.diff, S = Math.max(0, Math.min(G, x.bedarf.stunden - x.vorhanden)), A = G - S;
  const U = x.ueberPuffer, ruhig = 0.3 * U, mj = x.minijobWoche;
  const leute = state.mitarbeiter.filter(m => ueberstundenRaum(m) > 0).length || 1;
  const je = h => h1(h / leute);
  // Wie neues Personal für h Stunden je Woche aussähe
  const einstellung = h => {
    if (h <= 0.5) return null;
    if (h <= mj) return {titel: `Aushilfe mit ${h1(Math.max(4, halbe(h)))} h`, h: Math.max(4, halbe(h)), art: "aushilfe"};
    if (h <= 32) return {titel: `Teilzeitkraft mit ${stufe(h)} h`, h: stufe(h), art: "teil"};
    // Ganze Vollzeitstellen; bleibt mehr als eine Teilzeit (über 32 h), eine Vollzeit mehr
    let voll = Math.max(1, Math.floor(h / 38.5)), rest = h - voll * 38.5;
    if (rest > 32){ voll++; rest = 0; }
    const zus = rest > 2 ? einstellung(rest) : null;
    return {titel: (voll === 1 ? "Vollzeitkraft" : `${voll} Vollzeitkräfte`) + (zus ? ` und ${zus.titel}` : ""), h: voll * 38.5 + (zus ? zus.h : 0), art: "voll"};
  };
  const PLUS = {aushilfe: "günstig, flexibel einsetzbar (Minijob-Grenze im Monat)",
    teil: "deckt den Bedarf dauerhaft, planbar, kann mehr Aufgaben übernehmen",
    voll: "große Lücke auf einmal geschlossen, auch für Frühschicht oder Vertretung"};
  const MINUS = {aushilfe: `höchstens rund ${h1(mj)} h je Woche, Einarbeitung, meist nur Kasse und Ware`,
    teil: "feste Kosten; in ruhigen Wochen entstehen Minusstunden",
    voll: "höchste feste Kosten; Überhang, wenn der Bedarf sinkt"};
  // Eine Möglichkeit: neues Personal (oder keins) und der Rest als Überstunden
  const moeglich = neu => {
    const ueber = Math.min(U, Math.max(0, G - (neu ? neu.h : 0)));
    const deckt = Math.min(G, (neu ? neu.h : 0) + ueber);
    if (!neu) return {titel: "Nur Überstunden", deckt,
      plus: "kein neues Personal, sofort möglich, flexibel bei schwankenden Ausfällen",
      minus: `im Schnitt ${je(ueber)} h je Person und Woche mehr; auf Dauer schwer abzubauen — die Auszahlung kostet; mehr Belastung`
        + (deckt < G - 0.5 ? `; reicht nicht ganz (${h1(G - deckt)} h fehlen)` : "")};
    return {titel: neu.titel + (ueber > 0.5 ? " + Überstunden" : ""), deckt,
      plus: PLUS[neu.art] + (ueber > 0.5 ? `; Schwankungen über Überstunden (${je(ueber)} h je Person)` : ""),
      minus: MINUS[neu.art] + (neu.h > G + 2 ? `; ${h1(neu.h - G)} h mehr als nötig` : "") + (deckt < G - 0.5 ? `; ${h1(G - deckt)} h fehlen weiter` : "")};
  };
  const H = S + Math.max(0, A - ruhig);
  const empfohlen = moeglich(einstellung(H));
  const andere = [moeglich(null), moeglich(einstellung(Math.min(G, mj))), moeglich(einstellung(G))];
  const optionen = [empfohlen].concat(andere).filter((o, n, l) => l.findIndex(y => y.titel === o.titel) === n);
  optionen.forEach(o => { o.empfohlen = o === empfohlen; });
  optionen.sort((p, q) => q.empfohlen - p.empfohlen);
  const warum = H <= 0.5
    ? `Es fehlen nur Stunden für Urlaub und Krankheit (${h1(G)} h je Woche) — Überstunden reichen (${je(G)} h je Person). Wächst ein Konto dauerhaft: einstellen.`
    : (S > 2 ? `Schon ohne Urlaub und Krankheit fehlen ${h1(S)} h — das ist dauerhaft und gehört fest besetzt.`
             : `Alle Ausfälle über Überstunden wären ${je(G)} h je Person und Woche — auf Dauer zu viel.`)
      + (A > 0.5 ? ` Von den Ausfällen (${h1(A)} h) tragen Überstunden ${h1(Math.min(A, ruhig))} h, das hält die Last gering.` : "")
      + (G > U ? ` Selbst mit Überstunden bis 50 % (${h1(U)} h) reicht es nicht.` : "");
  return {kennung: "fehlt-" + Math.round(G / 5) * 5, art: H <= 0.5 ? "gelb" : "rot",
    titel: `Es fehlen rund ${h1(G)} h pro Woche — ${empfohlen.titel}`,
    text: `${warum} Bedarf mit Urlaub und Krankheit ${h1(x.brutto)} h, vorhanden ${h1(x.vorhanden)} h (Verträge und Aushilfen).`,
    optionen: optionen.map(o => ({titel: o.titel, deckt: o.deckt, plus: o.plus, minus: o.minus, empfohlen: o.empfohlen}))};
}

/* Empfehlungen: [{kennung, art: rot | gelb | gruen, titel, text}]. Die Kennung ist
   grob gerundet, damit dieselbe Lage nicht jede Woche als „neu“ erscheint. */
function analyseEmpfehlungen(){
  if (!state.mitarbeiter.length) return [];
  const x = personalAnalyse(), raus = [];
  const stufe = n => Math.round(n / 5) * 5;
  // Eine Möglichkeit: Titel, Vorteil, Nachteil — die empfohlene steht vorn
  const wahl = (liste, nr) => liste.map((o, n) => Object.assign({deckt: null, empfohlen: n === nr}, o)).sort((p, q) => q.empfohlen - p.empfohlen);
  const knapp = x.diff !== null && x.diff < -2;              // fehlen Stunden, gibt es Arbeit für mehr
  if (x.diff !== null){
    const fehlt = -x.diff;
    if (fehlt > 2) raus.push(personalEmpfehlung(x));
    else if (x.diff > Math.max(5, x.brutto * 0.08)){
      const aushilfen = x.aushilfen > 0 && x.diff <= x.flexibel;
      raus.push({kennung: "zuviel-" + stufe(x.diff), art: "gelb", titel: `Etwa ${h1(x.diff)} h pro Woche mehr Stunden als nötig`,
        text: `Vorhanden ${h1(x.vorhanden)} h, nötig ${h1(x.brutto)} h je Woche. Sonst entstehen Minusstunden.`,
        // Reichen die Aushilfen, sie zuerst; sonst bei der nächsten Kündigung nicht nachbesetzen
        optionen: wahl([
          x.aushilfen > 0 ? {titel: "Aushilfen weniger einplanen", plus: "wirkt sofort, ohne Vertragsänderung", minus: "die Aushilfen verdienen weniger"} : null,
          {titel: "Bei der nächsten Kündigung nicht nachbesetzen", plus: "kein Eingriff in bestehende Verträge", minus: "wirkt erst, wenn jemand geht"},
          {titel: "Vertragsstunden senken", plus: "wirkt sofort und dauerhaft", minus: "nur im Gespräch und mit Zustimmung; weniger Lohn"}
        ].filter(Boolean), aushilfen ? 0 : x.aushilfen > 0 ? 1 : 0)});
    } else raus.push({kennung: "passt", art: "gruen", titel: "Die Besetzung passt zum Bedarf",
      text: `Vorhanden ${h1(x.vorhanden)} h, nötig ${h1(x.brutto)} h je Woche.`});
  }
  // Schichtführung: hängt an zu wenigen — erst schauen, wer es werden könnte
  [["frueh", "Frühschicht", x.a.fruehOk], ["spaet", "Spätschicht", x.a.spaetOk]].forEach(([q, name, n]) => {
    if (n >= 2) return;
    const kand = state.mitarbeiter.filter(m => !istLeitung(m) && !istAushilfe(m) && !minderjaehrig(m) && !(m.qual || []).includes(q))
      .sort((p, r) => stunden(r) - stunden(p) || (r.qual || []).length - (p.qual || []).length)[0];
    raus.push({kennung: q + "-" + n, art: "rot", titel: `Eine weitere Person für die ${name}${q === "frueh" ? " (Schlüssel)" : ""}`,
      text: `Nur ${n} ${n === 1 ? "Person kann" : "Personen können"} die ${name} führen.${q === "frueh" ? " Fällt sie aus, geht der Laden nicht auf." : ""}`,
      optionen: wahl([
        kand ? {titel: `${kand.name} zur ${name}vertretung machen`, plus: "schnell, kostet nur die Einarbeitung", minus: "mehr Verantwortung für die Person (Schlüssel, Kasse abrechnen)"} : null,
        {titel: "Eine Stellvertretung einstellen", plus: "zusätzliche Führungskraft, auch für Urlaub", minus: "feste Kosten; dauert"}
      ].filter(Boolean), 0)});
  });
  // Konten: Überstunden der Gehaltsempfänger, Minusstunden, Übertrag der Aushilfen
  // Hohe Überstunden: mehr als 50 % der Wochenstunden auf dem Konto (Regel vom 17.11.2026)
  const plus = x.konten.filter(k => festesGehalt(k.m) && k.stand !== null && hatVertrag(k.m) && k.stand > stunden(k.m) * UEBERSTUNDEN_ANTEIL);
  if (plus.length) raus.push({kennung: "plus-" + plus.map(k => k.m.name).join(","), art: "gelb",
    titel: `Hohe Überstunden: ${plus.map(k => k.m.name).join(", ")}`,
    text: "Mehr als die Hälfte einer Wochenarbeitszeit auf dem Konto." + (knapp ? " Die Filiale hat gerade keine Luft für Abbau." : ""),
    optionen: wahl([
      {titel: "Abbauen", plus: "kostet nichts", minus: "braucht Wochen mit Luft — sonst fehlt die Person an anderer Stelle"},
      {titel: "Auszahlen", plus: "sofort erledigt, die Person bleibt eingeplant", minus: "kostet Lohn"}
    ], knapp ? 1 : 0)});
  const minus = x.konten.filter(k => festesGehalt(k.m) && k.stand !== null && k.stand < -10);
  if (minus.length) raus.push({kennung: "minus-" + minus.map(k => k.m.name).join(","), art: "rot",
    titel: `Minusstunden ausgleichen: ${minus.map(k => k.m.name).join(", ")}`,
    text: "Mehr als 10 Minusstunden auf dem Konto.",
    optionen: wahl([
      {titel: "In den nächsten Plänen mehr einplanen", plus: "das Konto gleicht sich aus",
        minus: knapp ? "kaum einer, solange in der Filiale Stunden fehlen" : "geht nur, wo es Arbeit gibt — sonst entstehen unnötige Stunden"},
      {titel: "Vertragsstunden senken", plus: "Vertrag passt dann zum Bedarf", minus: "nur im Gespräch und mit Zustimmung; weniger Lohn"}
    ], knapp || x.diff === null || x.diff < 5 ? 0 : 1)});
  state.mitarbeiter.filter(istAushilfe).forEach(m => {
    const k = aushilfenKonto(m.name).filter(z => z.vollstaendig);
    const l = k[k.length - 1];
    if (l && l.uebertrag > l.grenze * 0.25) raus.push({kennung: "uebertrag-" + m.name + "-" + stufe(l.uebertrag), art: "gelb",
      titel: `${m.name} baut Stunden auf, die nicht ausgezahlt werden`,
      text: `${h1(l.uebertrag)} h über der Minijob-Grenze werden mitgenommen.`,
      optionen: wahl([
        {titel: "Weniger einplanen", plus: "bleibt unter der Grenze", minus: "die Stunden fehlen an anderer Stelle"},
        {titel: "Mehr Stunden anbieten (Teilzeit statt Minijob)", plus: "die Arbeit wird bezahlt, die Person bleibt", minus: "Sozialversicherung, höhere Kosten"}
      ], knapp ? 1 : 0)});
  });
  return raus;
}

/* Was in der Einrichtung auffällt — nur, was aus der Reihe tanzt und sich in den Analysen nicht
   zeigt: Widersprüche, Standardwochen gegen Gesetz oder Vertrag, Aufgaben, an denen eine einzige
   Person hängt. Selbstverständliches (Jugendschutz, Aufgaben ohne feste Uhrzeit) steht nicht hier.
   → [{art: bad | warn, text}] */
function einrichtungAuffaellig(){
  const ms = state.mitarbeiter, raus = [];
  const add = (art, text) => raus.push({art, text});
  if (!ms.length) return raus;
  const fn = q => (QUAL.find(x => x[0] === q) || [, q])[1];
  // Standardwochen: Gesetz und Hausregel, und mehr Stunden als im Vertrag
  ms.forEach(m => pruefeStandard(m).forEach(v => add(v.art, `Standardwoche ${m.name}: ${v.text}`)));
  ms.forEach(m => {
    const std = wochenStunden(m), soll = hatVertrag(m) ? stunden(m) : null;
    if (std && soll !== null && std > soll + 0.5) add("warn", `Standardwoche ${m.name}: ${h1(std)} h — im Vertrag stehen ${h1(soll)} h.`);
  });
  // Widersprüche bei den Funktionen
  ms.filter(minderjaehrig).filter(m => (m.qual || []).includes("spaet")).forEach(m =>
    add("bad", `${m.name} ist Spätschichtvertretung, darf unter 18 aber nur bis 20:00 Uhr arbeiten.`));
  const ohneKasse = ms.filter(m => !istLeitung(m) && !(m.qual || []).includes("kasse"));
  if (ohneKasse.length && ohneKasse.length < ms.length - 1) add("warn", `Ohne Funktion „Kassieren“: ${ohneKasse.map(m => m.name).join(", ")} — stimmt das?`);
  // Aufgaben, die niemand oder nur eine Person kann
  const gebraucht = {};
  WAREN.forEach(w => {
    const a = state.aufgaben[w.id];
    if (w.braucht && a && a.aktiv && a.tage.length) (gebraucht[w.braucht] = gebraucht[w.braucht] || []).push(w.gruppe === "bestellung" ? "die Bestellungen" : `„${w.anzeige || w.name}“`);
  });
  Object.entries(gebraucht).forEach(([q, aufgaben]) => {
    const wer = ms.filter(m => (m.qual || []).includes(q)), was = [...new Set(aufgaben)].join(", ");
    if (!wer.length) add("bad", `Niemand hat die Funktion „${fn(q)}“ — ${was} kann niemand übernehmen.`);
    else if (wer.length === 1 && ms.length > 2) add("warn", `Nur ${wer[0].name} hat die Funktion „${fn(q)}“ — bei einem Ausfall bleibt ${was} liegen.`);
  });
  // Schichtführung: hängt an einer einzigen Person
  const fuehrt = q => ms.filter(m => m.typ === "Filialleitung" || (m.qual || []).includes(q));
  [["frueh", "Frühschicht"], ["spaet", "Spätschicht"]].forEach(([q, name]) => {
    const wer = fuehrt(q);
    if (wer.length === 1) add("warn", `Nur ${wer[0].name} kann die ${name} führen — an freien Tagen fehlt jemand mit Schlüssel.`);
  });
  // Aushilfen, deren Wochenstunden nicht unter die Minijob-Grenze passen
  const woche = minijobStunden(new Date().getFullYear()) * 12 / 52;
  ms.filter(istAushilfe).forEach(m => {
    if (hat(m.vertrag) && nz(m.vertrag) > woche + 0.25)
      add("warn", `${m.name}: ${zahlZeigen(m.vertrag)} h je Woche — die Minijob-Grenze erlaubt im Schnitt ${h1(woche)} h.`);
  });
  return raus;
}

/* Tagesanalyse: woher die Stunden eines Tages kommen.

   Der Planer legt je Tag fest, welche Aufgabe wann liegt (tag.aufgaben), und beim Speichern
   des Plans, wer sie macht (aufgabe.wer). Daraus entsteht hier
     · die Einteilung: wer in welcher Viertelstunde welche Aufgabe macht, wer für die Kasse
       eingeplant ist, wer ohne feste Aufgabe im Laden steht, wer Pause hat — nach denselben
       Regeln, mit denen der Planer die Besetzung prüft (Können, Personenzahl, Kasse besetzt);
     · die Begründung je Schicht: was fehlte, wenn es sie nicht gäbe. Das ist keine
       nachträgliche Deutung, sondern dieselbe Prüfung (maengelGruende) ohne die Schicht.
   Wer im Laden tatsächlich was macht, entscheidet die Filialleitung — die Einteilung
   zeigt, wie gerechnet wurde. */

const TAETIGKEITEN = [
  {id: "kasse",   name: "Kasse"},
  {id: "ware",    name: "Ware"},
  {id: "bestell", name: "Bestellen"},
  {id: "aufbau",  name: "Aufbau"},
  {id: "backen",  name: "Backen"},
  {id: "abend",   name: "Abend"},
  {id: "sonst",   name: "Sonstiges"},                    // MHD, RR-Schein, PÄ, Kontoauszug, Zusatzaufgaben
  {id: "laden",   name: "Zusatzaufgaben / Puffer"}      // im Laden ohne feste Aufgabe
];
const TAETIGKEIT_JE_AUFGABE = {food: "aufbau", non: "aufbau", bake: "backen", abend: "abend"};
// Ware teilt sich eine Farbe — die Art steht als Kürzel im Balken
const WARE_KURZ = {tro: "Tr", kue: "KW", tk: "TK", og: "O&G", ff: "FF"};

// Zu welcher Farbe eine Wochenaufgabe gehört
function taetigkeitVon(aufgabe){
  const w = WAREN.find(x => x.id === aufgabe.id);
  if (w && w.gruppe === "bestellung") return "bestell";
  if (w && w.braucht === "verraeumen") return "ware";       // Lieferungen, Obst und Gemüse
  return (w && TAETIGKEIT_JE_AUFGABE[w.id]) || "sonst";
}
// Der Name einer Aufgabe, wie er in einen Balken passt
function aufgabeKurz(aufgabe){
  const w = WAREN.find(x => x.id === aufgabe.id);
  if (!w) return aufgabe.name;
  return w.gruppe === "bestellung" ? "Best. " + w.anzeige : (w.kurz || w.name).replace(/\s*\(.*\)$/, "");
}

// [m, m, …] im Raster `schritt` → [[von, bis], …]
function zuSpannen(punkte, schritt){
  const raus = [];
  [...punkte].sort((a, b) => a - b).forEach(m => {
    const l = raus[raus.length - 1];
    if (l && l[1] === m) l[1] = m + schritt; else raus.push([m, m + schritt]);
  });
  return raus;
}
const spanneText = ([von, bis]) => hhmm(von) + "–" + hhmm(bis);

/* Kleinste Gesamtkosten einer Zuordnung (ungarische Methode): Jede Zeile bekommt genau eine
   Spalte, jede Spalte höchstens eine Zeile. kosten[z][s], Infinity = geht nicht. Es muss je
   Zeile eine erlaubte Spalte geben. → Spalte je Zeile */
function zuordnung(kosten){
  const n = kosten.length;
  if (!n) return [];
  const m = kosten[0].length, GROSS = 1e15;
  const u = new Array(n + 1).fill(0), v = new Array(m + 1).fill(0), p = new Array(m + 1).fill(0), weg = new Array(m + 1).fill(0);
  for (let i = 1; i <= n; i++){
    p[0] = i;
    let j0 = 0;
    const minv = new Array(m + 1).fill(GROSS), benutzt = new Array(m + 1).fill(false);
    do {
      benutzt[j0] = true;
      const i0 = p[j0];
      let delta = GROSS, j1 = 0;
      for (let j = 1; j <= m; j++) if (!benutzt[j]){
        const c = kosten[i0 - 1][j - 1], jetzt = (c === Infinity ? GROSS : c) - u[i0] - v[j];
        if (jetzt < minv[j]){ minv[j] = jetzt; weg[j] = j0; }
        if (minv[j] < delta){ delta = minv[j]; j1 = j; }
      }
      for (let j = 0; j <= m; j++) if (benutzt[j]){ u[p[j]] += delta; v[j] -= delta; } else minv[j] -= delta;
      j0 = j1;
    } while (p[j0] !== 0);
    do { const j1 = weg[j0]; p[j0] = p[j1]; j0 = j1; } while (j0);
  }
  const raus = new Array(n).fill(-1);
  for (let j = 1; j <= m; j++) if (p[j]) raus[p[j] - 1] = j - 1;
  return raus;
}

// Stand der Einteilungsregeln. Was ein Plan mit älterem Stand festgehalten hat (aufgabe.wer),
// wird neu gerechnet — 2: feste Kassenkraft statt ständiger Wechsel; 3: Aufgaben bleiben bei einer Person.
const EINTEILUNG_STAND = 3;

/* Die Einteilung eines Tages.
   Kasse: Während der Öffnung kassiert immer jemand. Wer zuerst kommt, geht an die Kasse und
   bleibt dort, bis die Schicht endet (Hauptkasse); wer danach kommt, geht auf die Fläche.
   In der Pause der Hauptkasse löst jemand von der Fläche ab, danach geht es zurück. Kommen
   zwei gleichzeitig, entscheidet, wer die anstehenden Aufgaben eher kann, dann, wer in der
   Woche schon kassiert hat. Kann jemand die Aufgaben auf der Fläche nicht (fehlende
   Funktion), tauschen die beiden. Die Filialleitung kassiert nur, wenn es nicht anders geht.
   optionen.ohneVerlauf: die Vortage nicht ansehen (für den Blick auf die Vortage selbst).
   → {von, bis, offenVon, offenBis,
      reihen: [{name, m, schicht, segmente: [{von, bis, art, aufgabe, kurz}], stunden}],
      zeitpunkte: [{m, da, noetig, je}], summen: {kasse, laden, ware, bestell, sonst, pause},
      kasse: [{name, von, bis}],
      aufgaben: [{quelle, name, kurz, art, von, bis, frueh, spaet, pers, braucht, teile: [{name, von, bis}],
                  wer, fehlt, nebenher: [{name, spannen}]}]} */
function tagesEinteilung(plan, ti, optionen){
  const t = plan && plan.tage[ti];
  if (!t || t.feiertag) return null;
  const o = optionen || {};
  const SL = 15, ms = state.mitarbeiter, r = tagesRaster(t);
  const aussen = state.allein ? 1 : MIN_BESETZUNG;
  const nameVon = s => plan.namen ? plan.namen[s.mi] : (ms[s.mi] || {}).name;
  const wer = s => ms.find(x => x.name === nameVon(s)) || null;
  const kann = (s, q) => !q || ((wer(s) || {}).qual || []).includes(q);
  const leitung = n => istLeitung(wer(schichten[n]));
  const braucht = a => (WAREN.find(w => w.id === a.id) || {}).braucht || null;
  const schichten = t.schichten.slice().sort((a, b) => a.von - b.von || a.bis - b.bis);
  const aufgaben = (t.aufgaben || []).slice().sort((a, b) => (braucht(a) ? 0 : 1) - (braucht(b) ? 0 : 1) || a.von - b.von);
  const von = Math.min(r.tagVon, ...schichten.map(s => s.von)), bis = Math.max(r.tagBis, ...schichten.map(s => s.bis));
  const inPause = (s, m) => s.pauseVon !== null && s.pauseVon !== undefined && s.pauseVon <= m && s.pauseBis > m;
  const daAm = (n, m) => schichten[n].von <= m && schichten[n].bis > m;
  // Was beim Speichern des Plans festgehalten wurde, gilt zuerst — sofern nach den heutigen Regeln
  const festAktuell = plan.einteilung === EINTEILUNG_STAND;
  const festgelegt = (a, n, m) => festAktuell && (a.wer || []).some(x => x.name === nameVon(schichten[n]) && x.von <= m && x.bis > m);

  // Wie viele der Aufgaben bis zum Ende seiner Schicht jemand kann (ohne Aufgaben: ob er Ware verräumen kann)
  const flaeche = (n, m) => {
    const ende = schichten[n].bis;
    const vor = aufgaben.filter(a => braucht(a) && a.von < ende && a.bis > m);
    return vor.length ? vor.filter(a => kann(schichten[n], braucht(a))).length : (kann(schichten[n], "verraeumen") ? 1 : 0);
  };
  // Wie lange jemand an den Vortagen dieser Woche kassiert hat (nur bei Gleichstand gebraucht)
  const vorher = new Map();
  const kasseVorher = n => {
    const name = nameVon(schichten[n]);
    if (o.ohneVerlauf || ti === 0) return 0;
    if (!vorher.has(name)){
      let min = 0;
      for (let tj = 0; tj < ti; tj++){
        const e = tagesEinteilung(plan, tj, {ohneVerlauf: true});
        if (e) e.kasse.forEach(k => { if (k.name === name) min += k.bis - k.von; });
      }
      vorher.set(name, min);
    }
    return vorher.get(name);
  };
  // Wie viel jemand auf der Fläche überhaupt kann
  const FLAECHE = ["verraeumen", "foodauf", "nonfoodauf", "abendprog", "bestellung"];
  const koennen = n => FLAECHE.filter(q => kann(schichten[n], q)).length;
  // Reihenfolge für eine neue Hauptkasse: wer die anstehenden Aufgaben nicht kann, wer zuerst kam;
  // bei gleichem Beginn, wer weniger der anstehenden Aufgaben kann, wer auf der Fläche weniger
  // kann, wer in der Woche schon kassiert hat, wer länger bleibt
  const hauptReihe = (kand, m) => kand.slice().sort((x, y) =>
       (leitung(x) - leitung(y))
    || ((flaeche(x, m) > 0) - (flaeche(y, m) > 0))
    || (schichten[x].von - schichten[y].von)
    || (flaeche(x, m) - flaeche(y, m))
    || (koennen(x) - koennen(y))
    || (kasseVorher(y) - kasseVorher(x))
    || (schichten[y].bis - schichten[x].bis)
    || (x - y));

  const was = schichten.map(() => ({}));            // je Schicht: Viertelstunde → {art, ref}
  const besetzt = new Map(aufgaben.map(a => [a, {fehlt: [], nebenher: {}}]));
  const zeitpunkte = [], kasseTeile = [];
  let bisher = new Map(), kassierer = null, haupt = null;     // wer etwas angefangen hat, bleibt dabei
  // Wer eine Aufgabe angefangen hat, behält sie bis zum Ende — in seiner Pause ruht sie, statt an
  // jemand anderen zu gehen (seit 17.11.2026: Aufgaben auf wenige Personen)
  const besitzer = new Map(aufgaben.map(a => [a, []]));
  const besitztGerade = (n, m) => aufgaben.some(a => a.von <= m && a.bis > m && besitzer.get(a).includes(n));
  const anDerKasse = new Set();                               // wer heute schon kassiert hat
  for (let m = von; m < bis; m += SL){
    const da = schichten.map((s, n) => n).filter(n => daAm(n, m));
    const frei = new Set();
    da.forEach(n => { if (inPause(schichten[n], m)) was[n][m] = {art: "pause"}; else frei.add(n); });
    const offen = m >= r.offenVon && m < r.offenBis;
    // Die Hauptkasse wechselt nur, wenn ihre Schicht endet — oder wenn sie die Leitung ist und
    // jetzt jemand anderes kassieren kann
    if (haupt !== null && !daAm(haupt, m)) haupt = null;
    if (haupt !== null && leitung(haupt) && [...frei].some(n => !leitung(n) && kann(schichten[n], "kasse"))) haupt = null;
    // Kann jemand die anstehenden Aufgaben auf der Fläche nicht, die Hauptkasse aber schon: tauschen
    if (haupt !== null && frei.has(haupt) && flaeche(haupt, m)){
      const n = [...frei].find(x => x !== haupt && !leitung(x) && kann(schichten[x], "kasse") && !flaeche(x, m));
      if (n !== undefined) haupt = n;
    }

    // Plätze: die Kasse (während der Öffnung) und je Aufgabe so viele, wie Personen nötig sind.
    // Vergeben wird so, dass möglichst alle besetzt sind — die Kasse vor allem anderen — und
    // dann nach Vorliebe: Hauptkasse bleibt; wer eine Aufgabe angefangen hat, bleibt dabei;
    // wie im Plan festgehalten; wem der Planer die Aufgabe zugeschrieben hat; Aufgaben macht
    // lieber das Team als die Filialleitung — sie springt ein, wo es sonst niemand kann.
    const leute = [...frei], plaetze = [];
    // Wer gerade eine Aufgabe hat, wird nur im Notfall an die Kasse geholt; wer heute schon
    // kassiert hat, löst lieber ab als jemand Neues — so bleiben es wenige an der Kasse
    if (offen){
      const reihe = haupt === null ? hauptReihe(leute.filter(n => kann(schichten[n], "kasse")), m) : [];
      plaetze.push({kasse: true, kosten: n => {
        if (!kann(schichten[n], "kasse")) return Infinity;
        const grund = haupt === null ? Math.min(3, reihe.indexOf(n)) : n === haupt ? 0 : (n === kassierer ? 2 : 4) + (anDerKasse.has(n) ? 0 : 1);
        return grund + (n !== haupt && besitztGerade(n, m) ? 3 : 0) + (leitung(n) ? 20 : 0);
      }, offen: 10000});
    }
    const laufend = aufgaben.filter(a => a.von <= m && a.bis > m);
    laufend.forEach(a => {
      // Besitzer, die gegangen sind, geben die Aufgabe ab; wer in der Pause ist und vor dem Ende
      // zurückkommt, behält sie — sein Platz ruht so lange
      const eigen = besitzer.get(a).filter(n => daAm(n, m));
      besitzer.set(a, eigen);
      const faehigFrei = [...frei].some(n => kann(schichten[n], braucht(a)));
      // ruhen: in der eigenen Pause — oder solange man an der Kasse ablöst (die Hauptkasse ist noch weg)
      const ruhen = !faehigFrei ? 0 : eigen.filter(n => (inPause(schichten[n], m) && schichten[n].pauseBis < a.bis)
        || (n === kassierer && n !== haupt && haupt !== null && frei.has(n) && !frei.has(haupt))).length;
      const schon = bisher.get(a) || [];
      const kosten = n => !kann(schichten[n], braucht(a)) ? Infinity
        : (eigen.includes(n) ? 0 : 5 + (schichten[n].bis < a.bis ? 3 : 0) + (besitztGerade(n, m) ? 4 : 0))
          + (festgelegt(a, n, m) ? 0 : festAktuell && (a.wer || []).some(x => x.von <= m && x.bis > m) ? 20 : 6)
          + (schon.includes(n) ? 0 : 1) + ((schichten[n].rollen || []).includes(a.name) ? 0 : 1)
          + (leitung(n) ? 4 : 0) + (offen && n === haupt ? 3 : 0);
      for (let k = 0; k < Math.max(0, a.pers - ruhen); k++) plaetze.push({a, kosten, offen: 1000});
    });
    const wahl = zuordnung(plaetze.map((pl, z) => leute.map(n => pl.kosten(n)).concat(plaetze.map((x, y) => y === z ? pl.offen : Infinity))));
    const jetzt = new Map(laufend.map(a => [a, []]));
    let k = null;
    const offenePlaetze = [];
    plaetze.forEach((pl, z) => {
      const n = wahl[z] < leute.length ? leute[wahl[z]] : null;
      if (n === null){ if (!pl.kasse) offenePlaetze.push(pl); return; }
      if (pl.kasse){ k = n; return; }
      was[n][m] = {art: taetigkeitVon(pl.a), ref: pl.a}; frei.delete(n); jetzt.get(pl.a).push(n);
    });
    // Löst ein Besitzer gerade an der Kasse ab, ruht seine Aufgabe — der Platz ist nicht „offen“
    if (k !== null && haupt !== null && k !== haupt)
      for (let x = offenePlaetze.length - 1; x >= 0; x--) if (besitzer.get(offenePlaetze[x].a).includes(k)) offenePlaetze.splice(x, 1);
    // Bleibt ein Platz offen, rechnet der Planer trotzdem nicht mit einem Mangel, solange
    // jemand mit dem Können im Laden ist — die Aufgabe läuft dann neben einer anderen her.
    // Erst wenn es niemand kann, fehlt wirklich jemand.
    offenePlaetze.forEach(pl => {
      const b = besetzt.get(pl.a);
      const n = da.find(x => !inPause(schichten[x], m) && kann(schichten[x], braucht(pl.a)) && !jetzt.get(pl.a).includes(x));
      if (n === undefined) b.fehlt.push(m);
      else (b.nebenher[nameVon(schichten[n])] = b.nebenher[nameVon(schichten[n])] || []).push(m);
    });
    // Besitz nachführen: Wer eine Aufgabe jetzt macht, besitzt sie; wer anderswo eingeteilt wurde, gibt sie ab —
    // außer in der Pause oder beim Ablösen an der Kasse (danach geht es mit der Aufgabe weiter)
    const besitzVorher = new Set(laufend.flatMap(a => besitzer.get(a)));
    laufend.forEach(a => {
      const jetztDran = jetzt.get(a);
      const eigen = besitzer.get(a).filter(n => jetztDran.includes(n) || (inPause(schichten[n], m) && schichten[n].pauseBis < a.bis)
        || (n === k && n !== haupt && haupt !== null));
      jetztDran.forEach(n => { if (!eigen.includes(n) && eigen.length < a.pers) eigen.push(n); });
      besitzer.set(a, eigen);
    });
    if (k !== null){
      was[k][m] = {art: "kasse"}; frei.delete(k); kasseTeile.push([nameVon(schichten[k]), m]); anDerKasse.add(k);
      // Wer jetzt kassiert, wird Hauptkasse, wenn es keine gibt — oder wenn die bisherige auf der
      // Fläche gebraucht wird (dann bleibt es beim Tausch, statt hin und her). Löst jemand in der
      // Pause ab, der mindestens so lange bleibt und seine eigene Pause schon hinter sich hat,
      // behält er die Kasse: ein Wechsel statt zwei.
      const inDerPause = haupt !== null && (was[haupt][m] || {}).art === "pause";
      const pauseVorbei = n => schichten[n].pauseVon === null || schichten[n].pauseVon === undefined || schichten[n].pauseBis <= m;
      if (!leitung(k) && (haupt === null || (haupt !== k && (was[haupt][m] || {}).ref)
          || (inDerPause && haupt !== k && schichten[k].bis >= schichten[haupt].bis && pauseVorbei(k) && !besitzVorher.has(k)))) haupt = k;
    }
    kassierer = k;
    frei.forEach(n => was[n][m] = {art: "laden"});
    bisher = jetzt;
    const je = Object.fromEntries(TAETIGKEITEN.map(t => [t.id, 0]).concat([["pause", 0]]));
    da.forEach(n => je[was[n][m].art]++);
    zeitpunkte.push({m, da: da.length, noetig: personenBedarf(t.aufgaben || [], m - m % 30, offen, aussen), je});
  }

  const summen = Object.fromEntries(TAETIGKEITEN.map(t => [t.id, 0]).concat([["pause", 0]]));
  const teileVon = new Map(aufgaben.map(a => [a, []]));
  const reihen = schichten.map((s, n) => {
    const segmente = [];
    for (let m = s.von; m < s.bis; m += SL){
      const w = was[n][m] || {art: "laden"}, l = segmente[segmente.length - 1];
      summen[w.art] += SL / 60;
      if (l && l.art === w.art && l.ref === (w.ref || null) && l.bis === m) l.bis = m + SL;
      else segmente.push({von: m, bis: m + SL, art: w.art, ref: w.ref || null});
    }
    segmente.forEach(g => {
      g.aufgabe = g.ref ? g.ref.name : null;
      g.kurz = g.ref ? aufgabeKurz(g.ref) : g.art === "kasse" ? "Kasse" : g.art === "pause" ? "Pause" : "";
      g.marke = g.ref && g.art === "ware" ? WARE_KURZ[g.ref.id] || null : null;
      if (g.ref) teileVon.get(g.ref).push({name: nameVon(s), von: g.von, bis: g.bis});
      delete g.ref;
    });
    return {name: nameVon(s), m: wer(s), schicht: s, segmente, stunden: s.arbeit};
  });
  // Die Kasse als durchgehende Abschnitte je Person
  const kasse = [];
  kasseTeile.forEach(([name, m]) => { const l = kasse[kasse.length - 1]; if (l && l.name === name && l.bis === m) l.bis = m + SL; else kasse.push({name, von: m, bis: m + SL}); });
  return {von, bis, offenVon: r.offenVon, offenBis: r.offenBis, reihen, zeitpunkte, summen, kasse,
    aufgaben: (t.aufgaben || []).slice().sort((a, b) => a.von - b.von || a.bis - b.bis).map(a => {
      const teile = teileVon.get(a).sort((x, y) => x.von - y.von);
      return {quelle: a, name: a.name, kurz: aufgabeKurz(a), art: taetigkeitVon(a), von: a.von, bis: a.bis,
        frueh: a.frueh === undefined ? a.von : a.frueh, spaet: a.spaet === undefined ? a.bis : a.spaet,
        pers: a.pers, braucht: braucht(a), teile, wer: [...new Set(teile.map(x => x.name))],
        fehlt: zuSpannen([...new Set(besetzt.get(a).fehlt)], SL),
        nebenher: Object.keys(besetzt.get(a).nebenher).map(name => ({name, spannen: zuSpannen([...new Set(besetzt.get(a).nebenher[name])], SL)}))};
    })};
}

/* Beim Speichern eines Plans festhalten, wer welche Aufgabe macht (aufgabe.wer).
   Die Analyse zeigt danach genau das — auch wenn sich Personal oder Regeln später ändern. */
function einteilungFestschreiben(kurz){
  delete kurz.einteilung;
  (kurz.tage || []).forEach((t, ti) => {
    (t.aufgaben || []).forEach(a => delete a.wer);
    const e = tagesEinteilung(kurz, ti);
    if (e) e.aufgaben.forEach(a => { a.quelle.wer = a.teile; });
  });
  kurz.einteilung = EINTEILUNG_STAND;
  return kurz;
}

/* Warum es eine Schicht gibt: was an dem Tag fehlte, wenn sie wegfiele.
   → {noetig: [{grund, spannen}], zwingend (Stunden), stunden, standard, vertretung} */
function schichtGrund(plan, ti, schicht){
  const t = plan.tage[ti];
  const ohne = Object.assign({}, plan, {tage: plan.tage.map((x, n) => n === ti
    ? Object.assign({}, x, {schichten: x.schichten.filter(s => s !== schicht)}) : x)});
  const je = {}, zwingend = new Set();
  tagesRaster(t).punkte.filter(m => m + 30 > schicht.von && m < schicht.bis).forEach(m => {
    const mit = new Set(maengelGruende(plan, ti, m));
    maengelGruende(ohne, ti, m).filter(g => !mit.has(g)).forEach(g => { (je[g] = je[g] || []).push(m); zwingend.add(m); });
  });
  const kappen = ([a, b]) => [Math.max(a, schicht.von), Math.min(b, schicht.bis)];
  return {
    noetig: Object.keys(je).map(grund => ({grund, spannen: zuSpannen(je[grund], 30).map(kappen)})),
    zwingend: zuSpannen([...zwingend], 30).map(kappen).reduce((s, [a, b]) => s + (b - a) / 60, 0),
    stunden: (schicht.bis - schicht.von) / 60,
    standard: (schicht.rollen || []).includes("Standard"),
    vertretung: (schicht.rollen || []).includes("Vertretung"),
    aufgefuellt: (schicht.rollen || []).includes("Vertragsstunden"),
    ausbildung: (schicht.rollen || []).includes("Ausbildung")
  };
}

/* Die Begründung einer Schicht in Sätzen — für die Zeile unter der Zeitleiste.
   reihe: eine Reihe aus tagesEinteilung; einteilung: das Ganze (für „nebenher“). */
function schichtBegruendung(plan, ti, reihe, einteilung){
  const g = schichtGrund(plan, ti, reihe.schicht), m = reihe.m, saetze = [];
  const vorname = reihe.name.split(/\s+/)[0];
  if (g.standard) saetze.push(`Feste Standardwoche: Diese Zeit ist bei ${vorname} hinterlegt.`);
  if (g.vertretung) saetze.push("Springt ein — die Schicht kam durch eine Änderung am Plan dazu.");
  if (g.aufgefuellt) saetze.push("Vertragsstunden: Diese Zeit hast du im Entwurf dazugenommen.");
  if (g.ausbildung) saetze.push("Ausbildung: Azubis kommen immer auf ihre Betriebsstunden — ein Teil dieser Zeit ist dafür da.");
  if (g.noetig.length) saetze.push("Ohne diese Schicht fehlte: " + g.noetig.map(n =>
    `${n.grund} (${n.spannen.map(spanneText).join(", ")})`).join("; ") + ".");
  const aufgaben = reihe.segmente.filter(s => s.aufgabe);
  if (aufgaben.length) saetze.push("Eingeteilt für: " + aufgaben.map(s => `${s.aufgabe} ${spanneText([s.von, s.bis])}`).join(", ") + ".");
  const nebenher = ((einteilung && einteilung.aufgaben) || []).reduce((l, a) => l.concat(a.nebenher.filter(x => x.name === reihe.name)
    .map(x => `${a.name} ${x.spannen.map(spanneText).join(", ")}`)), []);
  if (nebenher.length) saetze.push("Nebenher: " + nebenher.join(", ") + ".");
  // Welches Können dafür gebraucht wird — nur das, was diese Schicht wirklich nutzt
  const koennen = new Set();
  aufgaben.forEach(s => { const w = WAREN.find(x => x.name === s.aufgabe); if (w && w.braucht) koennen.add(w.braucht); });
  ((einteilung && einteilung.aufgaben) || []).forEach(a => { if (a.braucht && a.nebenher.some(x => x.name === reihe.name)) koennen.add(a.braucht); });
  g.noetig.forEach(n => {
    if (n.grund === "Kasse") koennen.add("kasse");
    if (n.grund === "Schichtführung früh") koennen.add(m && m.typ === "Filialleitung" ? "§" : "frueh");
    if (n.grund === "Schichtführung spät") koennen.add(m && m.typ === "Filialleitung" ? "§" : "spaet");
  });
  if (koennen.size) saetze.push("Dafür nötig: " + [...koennen].map(q => q === "§" ? "Filialleitung (Schlüssel)"
    : (QUAL.find(x => x[0] === q) || [q, q])[1]).join(", ") + ".");
  const uebrig = g.stunden - g.zwingend;
  if (!g.noetig.length && !g.standard && !g.vertretung && !g.aufgefuellt && !g.ausbildung)
    saetze.push(`Für sich allein nicht zwingend — in dieser Zeit könnten auch andere die Besetzung halten.`);
  else if (g.noetig.length && uebrig >= 1)
    saetze.push(`Nur mit dieser Schicht gedeckt sind ${h1(g.zwingend)} von ${h1(g.stunden)} h. In der übrigen Zeit könnten andere die Besetzung halten — sie füllt Vertragsstunden auf.`);
  return {grund: g, saetze};
}

// Stunden je Tätigkeit für alle Tage einer Woche — die Übersicht über der Tagesanalyse
function wochenEinteilung(plan){
  return plan.tage.map((t, ti) => {
    const e = tagesEinteilung(plan, ti);
    return {ti, key: t.key, label: t.label, datum: t.datum, feiertag: !!t.feiertag, summen: e ? e.summen : null,
            arbeit: e ? TAETIGKEITEN.reduce((s, x) => s + e.summen[x.id], 0) : 0};
  });
}

/* Die Rolle einer Person für die Besetzung eines Tages — kurz und positiv: was sie übernimmt.
   → {name, schichten: [[von, bis]], arbeit, woche, merkmale: [text], punkte: [{was, art, spannen}]}
   merkmale: Standardwoche · Ausbildung · Vertragsstunden aufgefüllt · Vertretung
   punkte: Schichtführung (wenn sie ohne diese Schicht fehlte), Aufgaben, Kasse — in der
   Reihenfolge, in der sie am Tag vorkommen —, dann Pause und Zusatzaufgaben / Puffer.
   Die Grundbesetzung (zwei Personen im Laden) wird nicht genannt. */
function besetzungsRolle(plan, ti, name, einteilung){
  const reihen = einteilung.reihen.filter(r => r.name === name);
  const merkmale = [], punkte = new Map();
  const merke = t => { if (!merkmale.includes(t)) merkmale.push(t); };
  const dazu = (was, art, von, bis) => {
    const p = punkte.get(was) || {was, art, spannen: [], erst: von};
    const l = p.spannen[p.spannen.length - 1];
    if (l && l[1] === von) l[1] = bis; else p.spannen.push([von, bis]);
    p.erst = Math.min(p.erst, von);
    punkte.set(was, p);
  };
  reihen.forEach(r => {
    const g = schichtGrund(plan, ti, r.schicht);
    if (g.standard) merke("Standardwoche");
    if (g.ausbildung) merke("Ausbildung");
    if (g.aufgefuellt) merke("Vertragsstunden aufgefüllt");
    if (g.vertretung) merke("Vertretung");
    g.noetig.filter(n => /^Schichtführung/.test(n.grund)).forEach(n => n.spannen.forEach(([a, b]) => dazu(n.grund, "fuehrung", a, b)));
    r.segmente.forEach(s => dazu(s.aufgabe || (TAETIGKEITEN.find(t => t.id === s.art) || {name: "Pause"}).name, s.art, s.von, s.bis));
  });
  // Aufgaben, die neben einer anderen herlaufen (niemand sonst mit dem Können ist frei)
  einteilung.aufgaben.forEach(a => a.nebenher.filter(x => x.name === name)
    .forEach(x => x.spannen.forEach(([v, b]) => dazu(a.name + " (nebenher)", a.art, v, b))));
  const hinten = p => p.art === "laden" ? 2 : p.art === "pause" ? 1 : 0;
  const j = platzImPlan(plan, name);
  return {name, schichten: reihen.map(r => [r.schicht.von, r.schicht.bis]), arbeit: reihen.reduce((s, r) => s + r.stunden, 0),
    woche: j < 0 ? 0 : plan.tage.reduce((s, t) => s + t.schichten.filter(x => x.mi === j).reduce((a, x) => a + x.arbeit, 0), 0),
    merkmale, punkte: [...punkte.values()].sort((x, y) => hinten(x) - hinten(y) || x.erst - y.erst)};
}
