<!doctype html>
<html lang="de"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="fassung" content="2026-11-13-5-test">
<title>Filialplaner</title>
<link rel="stylesheet" href="fonts.css">
<style>
:root{
  --blau-900:#0A2A4E; --blau-800:#0C3B6B; --blau-700:#0F4C8A; --blau-600:#1565C0;
  --blau-500:#2E7FD4; --blau-200:#BBD4EC; --blau-100:#E2EDF8; --blau-50:#F2F7FC;
  --paper:#F2F7FC; --surface:#FFFFFF; --surface-2:#F7FAFD;
  --ink:#10273F; --ink-2:#2E4A66; --muted:#5C7791; --line:#D7E3F0; --line-2:#EAF1F8;
  --accent:var(--blau-700); --accent-ink:var(--blau-800); --accent-soft:var(--blau-100);
  --on-accent:#FFFFFF;
  --good:#1F7A45; --good-soft:#E3F3E9;
  --warn:#9A6206; --warn-soft:#FDF1DD;
  --bad:#B32320;  --bad-soft:#FBE6E5;
  --shadow:0 1px 2px rgba(16,39,63,.05), 0 6px 20px -10px rgba(16,39,63,.22);
  --shadow-l:0 2px 6px rgba(16,39,63,.07), 0 18px 38px -22px rgba(16,39,63,.3);
  --r:14px; --r-s:10px;
  --sans:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --display:var(--sans);
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --blau-900:#CFE2F5; --blau-800:#A9CBEC; --blau-700:#5FA3E0; --blau-600:#4A95DC;
    --blau-200:#1E3E5E; --blau-100:#14304C; --blau-50:#102638;
    --paper:#0A1724; --surface:#13263A; --surface-2:#182F46;
    --ink:#E6F0FA; --ink-2:#C2D6E8; --muted:#93AEC7; --line:#23405C; --line-2:#1B3449;
    --accent:#5FA3E0; --accent-ink:#A9CBEC; --accent-soft:#14304C; --on-accent:#08192B;
    --good:#7FC395; --good-soft:#14301F; --warn:#D9A05B; --warn-soft:#33270F; --bad:#E08585; --bad-soft:#331B1B;
    --shadow:0 1px 2px rgba(0,0,0,.45), 0 6px 20px -10px rgba(0,0,0,.7);
    --shadow-l:0 2px 6px rgba(0,0,0,.5), 0 18px 38px -22px rgba(0,0,0,.85);
  }
}
:root[data-theme="dark"]{
  --blau-900:#CFE2F5; --blau-800:#A9CBEC; --blau-700:#5FA3E0; --blau-600:#4A95DC;
  --blau-200:#1E3E5E; --blau-100:#14304C; --blau-50:#102638;
  --paper:#0A1724; --surface:#13263A; --surface-2:#182F46;
  --ink:#E6F0FA; --ink-2:#C2D6E8; --muted:#93AEC7; --line:#23405C; --line-2:#1B3449;
  --accent:#5FA3E0; --accent-ink:#A9CBEC; --accent-soft:#14304C; --on-accent:#08192B;
  --good:#7FC395; --good-soft:#14301F; --warn:#D9A05B; --warn-soft:#33270F; --bad:#E08585; --bad-soft:#331B1B;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 6px 20px -10px rgba(0,0,0,.7);
  --shadow-l:0 2px 6px rgba(0,0,0,.5), 0 18px 38px -22px rgba(0,0,0,.85);
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.5;
  -webkit-font-smoothing:antialiased;font-size:15px;margin:0}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15;letter-spacing:-.02em}
h1{font-size:1.65rem;font-weight:800;color:var(--blau-900)}
h2{font-size:1.2rem;font-weight:700}
h3{font-size:.95rem;font-weight:700;color:var(--blau-900)}
p{margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blau-600);outline-offset:2px;border-radius:8px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.63rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:800}

/* ---------- Gerüst ---------- */
.wrap{max-width:1140px;margin:0 auto;padding:0 20px 64px}
.topbar{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar-in{max-width:1140px;margin:0 auto;padding:11px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand .mark{width:34px;height:34px;border-radius:10px;background:var(--blau-700);display:grid;place-items:center;flex:none}
.brand .mark svg{width:19px;height:19px}
.brand strong{font-weight:800;font-size:1.05rem;letter-spacing:-.025em;color:var(--blau-900)}
.chip{font-family:var(--mono);font-size:.7rem;padding:4px 10px;border-radius:999px;border:1px solid var(--line);
  color:var(--muted);background:var(--surface-2);font-weight:500}
.chip.live{color:var(--blau-800);border-color:var(--blau-200);background:var(--blau-100)}

.layout{display:grid;grid-template-columns:200px 1fr;gap:30px;align-items:start;padding-top:24px}
@media(max-width:860px){.layout{grid-template-columns:1fr;gap:16px}}

/* ---------- Schrittleiste ---------- */
.steps{position:sticky;top:70px;display:flex;flex-direction:column;gap:1px}
@media(max-width:860px){.steps{position:static;flex-direction:row;overflow-x:auto;gap:5px;padding-bottom:4px}}
.step{display:flex;gap:10px;align-items:center;padding:8px 11px;border-radius:10px;border:0;background:none;
  text-align:left;cursor:pointer;color:var(--muted);width:100%;font-weight:600;transition:background .12s,color .12s}
.step:hover:not(:disabled){background:var(--blau-50);color:var(--ink-2)}
.step:disabled{cursor:not-allowed;opacity:.4}
.step .n{width:21px;height:21px;flex:0 0 21px;border-radius:50%;border:1.5px solid var(--line);
  display:grid;place-items:center;font-family:var(--mono);font-size:.66rem;background:var(--surface);font-weight:700}
.step .t{font-size:.84rem;white-space:nowrap}
.step[aria-current="step"]{color:var(--blau-900);background:var(--blau-100)}
.step[aria-current="step"] .n{background:var(--blau-700);border-color:var(--blau-700);color:#fff}
.step.done{color:var(--ink-2)}
.step.done .n{border-color:var(--blau-500);color:var(--blau-600)}

/* ---------- Flächen ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px;box-shadow:var(--shadow)}
.panel + .panel{margin-top:14px}
.lede{color:var(--muted);max-width:68ch;margin-top:5px;font-size:.9rem;font-weight:500}
.head{margin-bottom:18px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:640px){.g2,.g3{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.76rem;color:var(--muted);font-weight:700;letter-spacing:.01em}
label.f[hidden],[hidden]{display:none!important}
input[type=text],input[type=password],input[type=number],input[type=time],input[type=date],select{
  background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-s);padding:9px 11px;
  color:var(--ink);width:100%;font-weight:600;transition:border-color .12s,box-shadow .12s}
input:focus,select:focus{outline:none;border-color:var(--blau-600);box-shadow:0 0 0 3px var(--blau-100)}
input::placeholder{color:var(--muted);font-weight:500}
input.num,input[type=number],input[type=time]{font-family:var(--mono);font-variant-numeric:tabular-nums}
.hint{font-size:.75rem;color:var(--muted);font-weight:500}
/* Auf dem Telefon zoomt Safari in jedes Feld unter 16px hinein */
@media (pointer:coarse){
  input[type=text],input[type=password],input[type=number],input[type=time],input[type=date],select{font-size:16px}
}
.btn{background:var(--blau-700);color:#fff;border:1.5px solid var(--blau-700);border-radius:var(--r-s);
  padding:10px 18px;font-weight:700;font-size:.88rem;cursor:pointer;letter-spacing:-.01em;
  transition:background .12s,transform .08s}
.btn:hover{background:var(--blau-800);border-color:var(--blau-800)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--surface);color:var(--blau-800);border-color:var(--line)}
.btn.ghost:hover{background:var(--blau-50);border-color:var(--blau-200)}
.btn.small{padding:6px 12px;font-size:.8rem}
.btn:disabled{opacity:.4;cursor:not-allowed}
.actions{display:flex;gap:9px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line-2);align-items:center;flex-wrap:wrap}
.actions .spacer{margin-left:auto}
.err{color:var(--bad);font-size:.82rem;margin-top:9px;min-height:1.1em;font-weight:600}

/* ---------- Aufgabenkarten ---------- */
.task{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--surface-2)}
.task + .task{margin-top:9px}
.task.off{opacity:.72}
.tag.neu{background:var(--blau-700);border-color:var(--blau-700);color:#fff;vertical-align:middle}
.task-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.task-top h3{margin-right:auto}
.days{display:flex;gap:5px;flex-wrap:wrap;margin:11px 0 3px}
.day{width:40px;height:33px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);
  font-family:var(--mono);font-size:.74rem;cursor:pointer;color:var(--muted);font-weight:700;transition:all .1s}
.day:hover{border-color:var(--blau-200)}
.day[aria-pressed="true"]{background:var(--blau-700);border-color:var(--blau-700);color:#fff}
.task-fields{display:grid;grid-template-columns:minmax(130px,.9fr) minmax(140px,1.1fr) minmax(80px,.6fr) minmax(80px,.6fr);
  gap:9px;margin-top:9px;align-items:end}
@media(max-width:820px){.task-fields{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:480px){.task-fields{grid-template-columns:1fr}}
.zeitfelder{display:flex;gap:7px;align-items:flex-end}
.zeitfelder label.f{flex:1;min-width:0}
.wochenwechsel{display:flex;gap:4px;margin-right:8px}
.knopfreihe{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
td.warnalt{color:var(--warn);font-weight:700}
.ablage{display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;
  padding:26px 18px;border:2px dashed var(--line);border-radius:12px;background:var(--surface-2);
  cursor:pointer;transition:border-color .12s,background .12s}
.ablage:hover,.ablage:focus-visible{border-color:var(--blau-200);background:var(--blau-50)}
.ablage.drueber{border-color:var(--blau-600);background:var(--blau-100)}
.ablage b{color:var(--blau-900)}
.abwzelle{padding:5px 6px;vertical-align:top}
.abwfeld{display:flex;flex-direction:column;gap:4px;min-width:118px}
.abwfeld select{padding:6px 8px}
.abwzeiten{display:flex;gap:4px}
.abwzeiten input{padding:5px 6px;font-size:.78rem}
.switch.jetag{margin:6px 0 2px}
.tagreiter{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tagreiter-b{display:flex;flex-direction:column;align-items:center;min-width:58px;padding:6px 10px;border-radius:10px;
  border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font:inherit;color:var(--ink)}
.tagreiter-b b{font-size:.8rem}
.tagreiter-b span{font-family:var(--mono);font-size:.66rem;color:var(--muted);min-height:1em}
.tagreiter-b[aria-selected="true"]{background:var(--blau-700);border-color:var(--blau-700);color:#fff}
.tagreiter-b[aria-selected="true"] span{color:rgba(255,255,255,.85)}
.tagfach{margin-top:8px;padding:10px 12px 2px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.pstd{font-family:var(--mono);font-size:.8rem;color:var(--muted);padding:6px 0 2px;font-weight:500;text-align:right}
.pstd b{color:var(--blau-700);font-weight:700}
.switch{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--ink-2);cursor:pointer;font-weight:600}
.switch input{accent-color:var(--blau-700);width:16px;height:16px}

/* ---------- Tabellen ---------- */
.tablewrap{overflow-x:auto;margin-top:4px}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th{text-align:left;font-size:.63rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);font-weight:800;padding:0 10px 8px;border-bottom:1.5px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle;font-weight:500}
tr:last-child td{border-bottom:none}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:.67rem;padding:2px 7px;border-radius:6px;font-weight:700;
  background:var(--blau-50);border:1px solid var(--line);color:var(--ink-2);margin:1px 2px 1px 0}
.tag.azubi{background:var(--blau-100);border-color:var(--blau-200);color:var(--blau-800)}
.tag.minor{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.empty{color:var(--muted);font-size:.86rem;padding:20px 0;text-align:center;font-weight:500}

/* ---------- Kacheln & Meldungen ---------- */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}
@media(max-width:720px){.tiles{grid-template-columns:1fr}}
.tile{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--surface-2)}
.tile .v{font-family:var(--mono);font-size:1.6rem;font-weight:700;letter-spacing:-.03em;line-height:1.1;
  margin:5px 0 2px;color:var(--blau-900)}
.tile .sub{font-size:.75rem;color:var(--muted);font-weight:500}
.bar{height:7px;border-radius:99px;background:var(--blau-100);overflow:hidden;margin-top:9px;display:flex}
.bar i{display:block;height:100%;border-radius:99px}
.bar i.a{background:var(--blau-600)}
.bar i.b{background:var(--blau-600);opacity:.35}
.note{display:flex;gap:10px;padding:11px 13px;border-radius:10px;font-size:.85rem;align-items:flex-start;font-weight:500}
.note + .note{margin-top:7px}
.note .ic{font-family:var(--mono);font-weight:700;flex:0 0 auto}
.note.ok{background:var(--good-soft);color:var(--good)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.note.info{background:var(--blau-50);color:var(--blau-800)}
.qual{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.qual div{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--surface-2);
  display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.82rem;font-weight:600}
.qual b{font-family:var(--mono);font-weight:700}
.qual .c0{color:var(--bad)} .qual .c1{color:var(--warn)} .qual .c2{color:var(--good)}

/* ---------- Startseite ---------- */
.layout.ohne-leiste{grid-template-columns:1fr}
.hero{display:flex;align-items:center;gap:16px;padding:18px 22px;border-radius:16px;flex-wrap:wrap;
  background:linear-gradient(135deg,var(--blau-800),var(--blau-600));color:#fff;box-shadow:var(--shadow-l)}
.heromark{width:54px;height:54px;border-radius:15px;background:rgba(255,255,255,.16);flex:none;
  display:flex;flex-direction:column;justify-content:center;gap:6px;padding:0 9px}
.hb{height:7px;border-radius:99px;background:#fff;width:var(--w);
  animation:ausfahren .55s cubic-bezier(.2,.85,.3,1) both}
.hb1{--w:74%}
.hb2{--w:100%;opacity:.72;animation-delay:.1s}
.hb3{--w:58%;animation-delay:.2s}
@keyframes ausfahren{from{width:0}to{width:var(--w)}}
.herotext h1{color:#fff;font-size:1.5rem;margin:0}
.herotext p{opacity:.9;font-size:.85rem;font-weight:600;margin-top:2px}
.hero .btn.hell{margin-left:auto;background:#fff;color:var(--blau-800);border-color:#fff}
.hero .btn.hell:hover{background:var(--blau-50);border-color:var(--blau-50)}

.kacheln{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
.kachel{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:13px 15px;text-align:left;
  border-radius:12px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;
  transition:border-color .12s,background .12s}
.kachel b{font-weight:700;color:var(--blau-900);font-size:.92rem}
.kachel span{font-size:.76rem;color:var(--muted);font-weight:500}
.kachel:hover{border-color:var(--blau-200);background:var(--blau-50)}
.kachel.arch{border-style:dashed}

/* ---------- Plan im Filialformat ---------- */
.planwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
/* Gitterspalten dürfen schmaler werden als die Plantabelle — sonst schiebt sie die ganze Seite breit */
#view,.layout > *{min-width:0}
table.plan{border-collapse:collapse;width:100%;min-width:900px;font-size:.72rem}
table.plan th,table.plan td{border:1px solid var(--line);padding:4px 6px;text-align:center;
  vertical-align:middle;white-space:nowrap;font-weight:500;text-transform:none;letter-spacing:0;color:var(--ink)}
table.plan thead th{background:var(--blau-50);font-weight:700;font-size:.68rem;color:var(--blau-900);padding:6px}
table.plan .zeilenkopf{text-align:left;font-weight:700;min-width:168px;white-space:normal;
  background:var(--surface-2);font-size:.72rem}
table.plan .klein{font-size:.62rem;color:var(--muted);font-weight:500}
table.plan tr.liefer td{color:var(--ink-2);font-size:.68rem}
table.plan tr.aufgabenzeile td{background:var(--blau-50);font-weight:700;font-size:.66rem;white-space:normal}
table.plan tr.ma-oben td{font-family:var(--mono);font-weight:600}
table.plan tr.ma-unten td{font-family:var(--mono);color:var(--muted);font-size:.66rem}
table.plan td.frei{color:var(--muted);font-family:var(--sans);font-size:.68rem}
table.plan tr.summe td,table.plan tr.summe th{background:var(--blau-100);font-weight:700}
table.plan th.stdkopf{min-width:46px}
table.plan td.std{font-family:var(--mono);font-weight:700;background:var(--surface-2)}
table.plan td[contenteditable]{cursor:text}
table.plan td[contenteditable]:hover{background:var(--blau-50)}
table.plan td[contenteditable]:focus{outline:2px solid var(--blau-600);outline-offset:-2px;background:var(--surface)}
table.plan td.fehlerhaft{background:var(--bad-soft);color:var(--bad)}
table.plan tr.aufgabenzeile td[contenteditable]{min-width:120px}
table.plan td.stunden{background:var(--surface-2)}
.phasenbox{margin:4px 0 6px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.phasenwahl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
@media(max-width:640px){.phasenwahl{grid-template-columns:1fr}}
.phasenkarte{display:flex;flex-direction:column;gap:2px;padding:10px 12px 10px 34px;position:relative;cursor:pointer;
  border:1.5px solid var(--line);border-radius:10px;background:var(--surface)}
.phasenkarte input{position:absolute;left:11px;top:12px;accent-color:var(--blau-700)}
.phasenkarte b{font-size:.86rem;color:var(--blau-900)}
.phasenkarte span{font-size:.74rem;color:var(--muted)}
.phasenkarte:has(input:checked){border-color:var(--blau-700);background:var(--blau-50)}
.phasendetail{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.phasendetail .switch input[type=radio]{width:16px;height:16px}
input.kurzzahl{width:70px;padding:4px 6px;font:inherit;text-align:right}
.tag.phase{background:var(--warn-soft, #FFF4E5);border-color:var(--warn);color:var(--warn);vertical-align:middle}
.kachelknoepfe{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.onlinekarte{margin-bottom:6px}
.onlinekopf{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.codefeld{text-align:right}
.codefeld b{display:block;font-family:var(--mono);font-size:1.5rem;letter-spacing:.12em;color:var(--blau-800)}
details.anderewege{margin-top:18px}
details.anderewege summary{cursor:pointer;font-weight:700;color:var(--blau-900);margin-bottom:12px}
.warnzeile{color:var(--warn);font-weight:700}
.linkbox{margin-top:10px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.linkbox textarea{width:100%;font-size:.78rem;resize:none}
.termin-wege{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:stretch}
@media(max-width:700px){.termin-wege{grid-template-columns:1fr}}
.termin-wege .ablage{justify-content:center;min-height:150px}
.termin-text{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.termin-text label.f{width:100%}
.termin-text textarea{width:100%;font-family:var(--mono);font-size:.8rem;resize:vertical}
.namenzuordnung{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:8px}
table.termintabelle td{vertical-align:middle}
table.termintabelle tr.t-fehler td{color:var(--bad)}
table.termintabelle tr.t-gleich td{color:var(--muted)}
table.termintabelle tr.t-ersetzt td:nth-child(5){color:var(--warn);font-weight:600}
table.plan tr.bestell td{font-size:.64rem;color:var(--ink-2);white-space:normal;line-height:1.35}
table.plan .ue-plus{color:var(--warn)}
table.plan .ue-minus{color:var(--blau-600)}
table.plan .ue-null{color:var(--muted)}
table.plan .ue-aend{font-size:.62rem;font-weight:700}

.foot{margin-top:22px;color:var(--muted);font-size:.74rem;font-weight:500;text-align:center}
.fassungshinweis{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));
  z-index:60;background:var(--blau-800);color:#fff;border-radius:999px;padding:10px 18px;font-size:.8rem;
  font-weight:600;box-shadow:var(--shadow-l);max-width:min(92vw,460px);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Rechnen ---------- */
.rechnet{position:fixed;inset:0;z-index:80;background:rgba(10,20,40,.38);display:flex;align-items:center;justify-content:center;padding:16px}
.rechnet-k{background:var(--surface);border-radius:16px;padding:22px 24px;max-width:360px;display:flex;flex-direction:column;
  align-items:center;gap:6px;text-align:center;box-shadow:var(--shadow-l)}
.rechnet-k b{font-size:1.05rem;color:var(--blau-900)}
.kreisel{width:34px;height:34px;border-radius:50%;border:4px solid var(--blau-100);border-top-color:var(--blau-700);
  animation:drehen 0.9s linear infinite;margin-bottom:6px}
@keyframes drehen{to{transform:rotate(360deg)}}
.messlatte{margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--blau-50);display:flex;flex-direction:column;gap:2px;font-size:.84rem}

/* ---------- Ausfall ---------- */
.ausfallbox{border:1.5px solid var(--blau-200);background:var(--surface-2);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.ausfallkopf{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.day.breit{width:auto;min-width:64px;height:auto;padding:6px 8px;display:flex;flex-direction:column;align-items:center;gap:1px}
.day.breit span{font-size:.66rem;font-family:var(--mono);opacity:.85}
.day:disabled{opacity:.4;cursor:default}
.vorschlaege{display:flex;flex-direction:column;gap:8px}
.vorschlag{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;
  border:1px solid var(--line);background:var(--surface)}
.vorschlag ul{margin:4px 0 2px 18px;padding:0;font-size:.82rem}
.vorschlag .hint{display:block;margin-top:2px}
.vorschlag-rechts{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}

/* ---------- Urlaub & Krankheit ---------- */
.ereignisliste b{display:block;margin-bottom:2px}
.ereignisse-tab td{vertical-align:middle}
.tag.krank{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.tag.urlaub{background:var(--blau-50);border-color:var(--blau-600);color:var(--blau-700)}
.ereignis-vorbei td{color:var(--muted)}

/* ---------- Testfassung ---------- */
.testband{position:sticky;top:0;z-index:70;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:10px 16px;background:#B45309;color:#fff;font-size:.86rem;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.testband b{font-size:.95rem;letter-spacing:.02em;text-transform:uppercase}
.testband span{flex:1;min-width:200px}
.testband .btn.hell{background:#fff;color:#7C2D12;border-color:#fff}
.chip.test{background:#FEF3C7;border-color:#B45309;color:#7C2D12}
.testkasten{margin:16px 0;border-color:#F59E0B}

/* Bereitschaft und Pflichtangaben (13.11.2026) */
.pflicht{font-size:.66rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--warn);margin-left:4px}
input.fehlt, select.fehlt{border-color:var(--bad) !important;box-shadow:0 0 0 3px var(--bad-soft)}
.bereit{margin:18px 0 4px}
.bereit .note span b{display:block;margin-bottom:2px}
.bereit-zeile{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.bereit-zeile .btn{flex:none}
.bereit-alter{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px;color:var(--ink)}
.bereit-alter b{flex:1 1 100%;display:block!important;margin:4px 0 0!important}
.abwzelle.fehlt{background:var(--bad-soft)}
.abwzelle.fehlt input[type=time]:invalid, .abwzelle.fehlt input[type=time]{border-color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.tag.fehlt{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.bereit-hinweise{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:11px 13px;font-size:.85rem;font-weight:500;margin-top:8px}
.bereit-hinweise summary{cursor:pointer}
.bereit-hinweise .bereit-zeile span{color:var(--ink-2)}

/* ======================================================================
   Gestaltung seit 13.11.2026: klare Ebenen, drei Bereichsgruppen, ein Raster.
   Ebene 1 Seite (paper) · Ebene 2 Karte (surface, Schatten) · Ebene 3 Feld (surface-2)
   Knöpfe: Haupt (gefüllt) · Neben (Rand) · leise (Text). Gruppenfarben nur als Akzent.
   ====================================================================== */
:root{--g-planung:#1565C0;--g-daten:#0F766E;--g-verw:#55657A;--gruen:#1F7A45;--gruen-soft:#E3F3E9;--rot:#B32320;--rot-soft:#FBE6E5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--g-planung:#5FA3E0;--g-daten:#5EC4B6;--g-verw:#9FB3C8;
  --gruen:#7FC395;--gruen-soft:#14301F;--rot:#E08585;--rot-soft:#331B1B}}
:root[data-theme="dark"]{--g-planung:#5FA3E0;--g-daten:#5EC4B6;--g-verw:#9FB3C8;--gruen:#7FC395;--gruen-soft:#14301F;--rot:#E08585;--rot-soft:#331B1B}

/* Knöpfe */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;position:relative;line-height:1.2}
.btn .sym{width:17px;height:17px;flex:none}
.btn.ghost{border-color:var(--blau-200);color:var(--blau-800)}
.btn.ghost:hover{background:var(--blau-100);border-color:var(--blau-500)}
.sym{width:20px;height:20px;display:inline-block;vertical-align:middle}

/* Rote Zahl */
.marke{position:absolute;top:-8px;right:-8px;min-width:21px;height:21px;padding:0 6px;border-radius:999px;
  background:#D92D20;color:#fff;font:700 .7rem/21px var(--sans);text-align:center;box-shadow:0 0 0 2px var(--surface);
  letter-spacing:0;pointer-events:none}

/* Kopf der Startseite */
.start{display:flex;flex-direction:column;gap:18px}
.hero{padding:20px 22px;gap:18px}
.herotext h1{font-size:1.45rem}
.hero-knoepfe{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
.hero .btn.hell{margin-left:0}
.btn.hell-rand{background:transparent;color:#fff;border-color:rgba(255,255,255,.65)}
.btn.hell-rand:hover{background:rgba(255,255,255,.14);border-color:#fff}
.btn.hell-rand:disabled{opacity:.45}
@media(max-width:560px){.hero-knoepfe{margin-left:0;width:100%}.hero-knoepfe .btn{flex:1}}

/* Karten */
.karte{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow)}
.karte h3{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.karte h3 .sym{color:var(--blau-700);width:18px;height:18px}
.karte-kopf{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.karte-kopf h2{margin-top:3px}
.karte-kopf h3{margin:0}
.karte-aktionen{display:flex;gap:8px;flex-wrap:wrap}
.wochenwechsel{margin-left:auto}
@media(max-width:560px){.karte{padding:14px 12px}.wochenwechsel{margin-left:0}}
.plan-fuss{margin-top:10px}
.leerplan{display:flex;flex-direction:column;align-items:center;gap:12px;padding:26px 0;color:var(--muted);font-weight:500}
details.aufklapp{margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface-2)}
details.aufklapp summary{cursor:pointer;font-weight:700;font-size:.86rem;color:var(--blau-900)}
details.aufklapp[open] summary{margin-bottom:10px}
.abschnitt{font-size:1.02rem;margin:26px 0 10px;padding-left:10px;border-left:3px solid var(--blau-600)}

/* Gruppen und Kacheln */
.gruppe{--g:var(--g-planung)}
.g-daten{--g:var(--g-daten)} .g-verwaltung{--g:var(--g-verw)}
.gruppe-titel{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--g);
  display:flex;align-items:center;gap:10px;margin:4px 0 10px}
.gruppe-titel::after{content:"";flex:1;height:1px;background:var(--line)}
.kacheln{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.kachel{position:relative;flex-direction:row;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--line);
  border-radius:14px;background:var(--surface);box-shadow:var(--shadow);transition:border-color .12s,transform .1s,box-shadow .12s}
.kachel:hover{border-color:var(--g);background:var(--surface);transform:translateY(-1px);box-shadow:var(--shadow-l)}
.kachel-sym{width:40px;height:40px;border-radius:11px;flex:none;display:grid;place-items:center;
  color:var(--g);background:color-mix(in srgb,var(--g) 13%,var(--surface))}
.kachel-sym .sym{width:21px;height:21px}
.kachel-text{display:flex;flex-direction:column;gap:1px;min-width:0}
.kachel-text b{font-size:.93rem;color:var(--blau-900)}
.kachel-text span{font-size:.75rem;color:var(--muted);font-weight:500;overflow:hidden;text-overflow:ellipsis}
.kachel .marke{top:-7px;right:-7px}

/* Seitenkopf der Unterseiten */
.seitenkopf{display:grid;grid-template-columns:1fr auto;gap:4px 16px;margin-bottom:18px;align-items:end}
.zurueck-link{grid-column:1/-1;justify-self:start;display:inline-flex;align-items:center;gap:4px;border:0;background:none;
  color:var(--blau-700);font-weight:700;font-size:.82rem;padding:2px 6px 2px 0;cursor:pointer}
.zurueck-link .sym{width:16px;height:16px}
.zurueck-link:hover{text-decoration:underline}
.seitenkopf-text h1{margin-top:4px}
.seitenkopf-rechts{display:flex;gap:8px;align-items:flex-end}
@media(max-width:640px){.seitenkopf{grid-template-columns:1fr}}
.wochenwahl{min-width:220px}

/* Hinweise oben auf einer Seite */
.markierungskasten{border:1px solid #F4B4AE;background:var(--rot-soft);border-radius:10px;padding:9px 12px;margin:-4px 0 16px;
  display:flex;flex-direction:column;gap:4px}
.mk-zeile{display:flex;gap:8px;align-items:center;font-size:.84rem;font-weight:600;color:var(--ink)}
.mk-punkt{width:9px;height:9px;border-radius:50%;background:#D92D20;flex:none}
.mk-zeile.neu .mk-punkt{background:var(--blau-600)}

/* Plan kompakt: passt in die Breite */
.planbox{container-type:inline-size;width:100%}
table.kompakt{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:0;font-size:.8rem}
table.kompakt col.c-name{width:19%} table.kompakt col.c-std{width:7%} table.kompakt col.c-konto{width:8%}
table.kompakt th,table.kompakt td{border-bottom:1px solid var(--line-2);border-right:1px solid var(--line-2);padding:5px 4px;
  text-align:center;vertical-align:middle;text-transform:none;letter-spacing:0;white-space:normal;overflow-wrap:anywhere}
table.kompakt thead th{background:var(--blau-50);color:var(--blau-900);font-size:.74rem;font-weight:800;border-bottom:1.5px solid var(--line);padding:7px 4px}
table.kompakt thead th.k-tag span{display:block;font-weight:500;font-size:.66rem;color:var(--muted)}
table.kompakt th.k-name,table.kompakt tbody th{text-align:left;padding-left:8px;font-size:.78rem;color:var(--ink);font-weight:700}
table.kompakt .k-feiertag{color:var(--muted)}
.k-zeit{display:inline-flex;gap:3px;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.78rem}
.k-zeit b{font-weight:600}
.k-zeit b:first-child::after{content:"–";margin-left:3px;font-weight:400;color:var(--muted)}
.k-pause{display:block;font-family:var(--mono);font-size:.64rem;color:var(--muted)}
td.k-frei{color:var(--muted);font-size:.72rem}
.k-typ{display:block;font-size:.66rem;color:var(--muted);font-weight:500}
.k-kurz{display:none}
td.k-std b,td.k-konto b{display:block;font-family:var(--mono);font-size:.78rem}
td.k-std span,td.k-konto span{display:block;font-family:var(--mono);font-size:.62rem;color:var(--muted)}
.k-konto .ue-plus,.ue-plus{color:var(--warn)} .k-konto .ue-minus,.ue-minus{color:var(--blau-600)} .ue-null{color:var(--muted)}
tr.k-zusatz th{font-size:.66rem!important;color:var(--muted)!important;text-transform:uppercase;letter-spacing:.08em!important}
tr.k-zusatz td{font-size:.66rem;color:var(--ink-2);line-height:1.3}
tr.k-summe th,tr.k-summe td{background:var(--blau-50);font-weight:700;font-family:var(--mono);font-size:.76rem}
tr.k-person:hover td,tr.k-person:hover th{background:var(--surface-2)}
.namelink{border:0;background:none;padding:0;font:inherit;font-weight:700;color:var(--blau-700);cursor:pointer;text-align:left;
  text-decoration:underline;text-decoration-color:var(--blau-200);text-underline-offset:3px}
.namelink:hover{text-decoration-color:var(--blau-700)}
@container (max-width:760px){
  .k-zeit{flex-direction:column;gap:0;font-size:.72rem}
  .k-zeit b:first-child::after{content:none}
  table.kompakt th.k-name,table.kompakt tbody th{padding-left:4px}
  .k-typ{display:none}
}
@container (max-width:480px){
  table.kompakt{font-size:.7rem}
  table.kompakt col.c-name{width:17%} table.kompakt col.c-std{width:9%} table.kompakt col.c-konto{width:10%}
  .k-voll{display:none} .k-kurz{display:inline}
  .k-zeit{font-size:.64rem;letter-spacing:-.03em}
  .k-pause{display:none}
  table.kompakt th,table.kompakt td{padding:4px 1px}
  table.kompakt thead th{font-size:.66rem;padding:5px 1px}
  td.k-std b,td.k-konto b{font-size:.66rem} td.k-std span{display:none}
  tr.k-zusatz td{font-size:.56rem}
}

/* Urlaub & Krankheit */
.legende{display:flex;gap:14px;flex-wrap:wrap;font-size:.74rem;color:var(--muted);font-weight:600;margin:4px 0 10px}
.legende span{display:inline-flex;align-items:center;gap:6px}
.legende i,.tagstreifen i{display:inline-block;width:11px;height:11px;border-radius:3px;background:var(--line-2);border:1px solid var(--line)}
.legende i.urlaub,.tagstreifen i.urlaub{background:var(--blau-600);border-color:var(--blau-600)}
.legende i.krank,.tagstreifen i.krank{background:var(--rot);border-color:var(--rot)}
.legende i.neu{background:var(--gruen-soft);border-color:var(--gruen)} .legende i.rot{background:var(--rot-soft);border-color:var(--rot)}
.legende i.weg{background:repeating-linear-gradient(135deg,var(--rot-soft) 0 3px,var(--surface) 3px 6px);border-color:var(--rot)}
table.ueberblick th span{display:block;font-weight:500;letter-spacing:0;font-size:.62rem}
.tagstreifen{display:inline-flex;gap:2px}
.ereignisform{border:1px solid var(--line);border-radius:12px;background:var(--surface-2);padding:12px 14px;margin:10px 0}
.ereignisform-felder{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end}
.person-ereignisse{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.person-ereignisse-kopf{display:flex;align-items:center;gap:8px;color:var(--blau-700)}
details.vorbei{margin-top:8px}

/* Plan ändern */
.aendern-status{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:12px;background:var(--surface-2);
  border:1px solid var(--line);margin-bottom:16px;position:sticky;top:64px;z-index:15}
body.mit-testband .aendern-status{top:118px}
.pille{font-size:.76rem;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--line-2);color:var(--ink-2)}
.pille.rot{background:var(--rot-soft);color:var(--rot)} .pille.gruen{background:var(--gruen-soft);color:var(--gruen)}
.aendern-raster{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.aendern-haupt,.aendern-seite{display:flex;flex-direction:column;gap:14px;min-width:0}
@media(max-width:1000px){.aendern-raster{grid-template-columns:1fr}}
.karte.rot{border-color:#F4B4AE;background:linear-gradient(var(--rot-soft),var(--rot-soft)) top/100% 4px no-repeat,var(--surface)}
.karte.rot h3{color:var(--rot)}
.todo{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line-2);font-size:.86rem;font-weight:500}
.todo:first-child{border-top:0}
.todo .btn{flex:none}
td.bearbeitbar{cursor:pointer}
td.bearbeitbar:hover{outline:2px solid var(--blau-500);outline-offset:-2px}
td.z-neu{background:var(--gruen-soft)!important;box-shadow:inset 0 0 0 1.5px var(--gruen)}
td.z-konflikt,td.z-recht{background:var(--rot-soft)!important;box-shadow:inset 0 0 0 1.5px var(--rot);color:var(--rot)}
td.z-weg{background:repeating-linear-gradient(135deg,var(--rot-soft) 0 4px,var(--surface) 4px 8px)!important}
td.z-weg s{display:block;font-family:var(--mono);font-size:.66rem;color:var(--muted)}
td.z-weg em{display:block;font-style:normal;font-weight:700;font-size:.66rem;color:var(--rot)}
tr.k-luecken th{color:var(--rot)!important;font-size:.66rem!important;text-transform:uppercase}
tr.k-luecken td{color:var(--rot);font-weight:700;font-size:.64rem;font-family:var(--mono);background:var(--rot-soft)}
tr.k-notiz td[data-notiz]{color:var(--muted)}
.vgruppe{display:flex;flex-direction:column;gap:8px;padding:10px 0;border-top:1px solid var(--line-2)}
.vgruppe:first-child{border-top:0;padding-top:0}
.vgruppe > b{font-size:.84rem}
.vkarte{border:1.5px solid var(--line);border-radius:11px;background:var(--surface-2);overflow:hidden}
.vkarte.an{border-color:var(--gruen);background:var(--gruen-soft)}
.vkarte-knopf{display:grid;grid-template-columns:1fr auto;gap:2px 8px;width:100%;text-align:left;border:0;background:none;
  padding:10px 12px;cursor:pointer;font:inherit;color:var(--ink)}
.vkarte-titel{font-weight:700;font-size:.85rem}
.vkarte-zustand{grid-column:1/-1;font-size:.72rem;color:var(--muted);font-weight:600}
.vkarte.an .vkarte-zustand{color:var(--gruen)}
.vkarte details{padding:0 12px 10px;font-size:.78rem;color:var(--ink-2)}
.vkarte summary{cursor:pointer;font-weight:700;color:var(--blau-700);font-size:.76rem}
.vkarte details p{margin-top:6px;line-height:1.45}
.aend-zeile{display:flex;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line-2);font-size:.84rem}
.aend-zeile:first-child{border-top:0}
.aend-zeile > span:nth-child(2){flex:1}
.aend-quelle{font-size:.64rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--gruen);
  background:var(--gruen-soft);border-radius:6px;padding:2px 6px;flex:none}
.aend-zeile.passt-nicht .aend-quelle{color:var(--rot);background:var(--rot-soft)}
.chat{display:flex;flex-direction:column;gap:8px;max-height:360px;overflow-y:auto;padding:2px 2px 8px}
.blase{max-width:92%;padding:8px 11px;border-radius:12px;font-size:.84rem;line-height:1.45}
.blase.assistent{background:var(--blau-50);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.blase.du{background:var(--blau-700);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.chatkarte{display:block;width:100%;text-align:left;margin-top:7px;padding:8px 10px;border-radius:9px;cursor:pointer;
  border:1.5px solid var(--blau-200);background:var(--surface);font:inherit;font-weight:700;font-size:.82rem;color:var(--ink)}
.chatkarte span{display:block;font-weight:600;font-size:.7rem;color:var(--muted)}
.chatkarte.an{border-color:var(--gruen);background:var(--gruen-soft)} .chatkarte.an span{color:var(--gruen)}

const REGELN = Object.freeze({
  // Besetzung (Hausregel)
  mindestBesetzung: 2,        // immer zwei Personen gleichzeitig im Laden, eine an der Kasse
  oeffnungstage: 6,           // Montag bis Samstag

  // Arbeitszeit (§ 3 ArbZG: 8 h, bis 10 h nur mit Ausgleich — hier nie)
  maxArbeitTag: 8,
  gesetzMaxTag: 10, gesetzMaxTagJugend: 8,   // darüber ist es auch mit Ausgleich verboten
  maxTage: 6,                 // Arbeitstage je Woche
  ruhezeit: 11,               // § 5 ArbZG

  // höchstens 6 h am Stück
  pauseAb: [[8, 1], [6, 0.5]],
  amStueck: 6,

  // Jugendliche (JArbSchG): Pause über 4,5 h Anwesenheit 30 min, über 6,5 h 60 min (§ 11),
  // höchstens 4,5 h am Stück, nur 6–20 Uhr (§ 14), 5 Tage (§ 15), 12 h Ruhe (§ 13)
  pauseAbJugend: [[6.5, 1], [4.5, 0.5]],
  amStueckJugend: 4.5,
  jugendVon: 6, jugendBis: 20,
  maxTageJugend: 5,

  ausgleichMax: 5,

  // Planer
  entwuerfe: 24,              // so viele Varianten rechnet der Planer durch

  // Archiv: so lange bleibt eine abgelaufene Woche, ab wann wird vorher gewarnt (Wochen)
  archivWochen: 6, archivWarnung: 5
});
// Kurzformen, die sich auf das Alter beziehen
