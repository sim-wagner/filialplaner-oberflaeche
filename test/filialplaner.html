        typ: "loesung", fuer: c.id, ti: c.ti, titel: v.titel, details: v.details, mehr: v.mehr, platz,
        schritte: v.aenderungen.map(x => Object.assign({}, x, {name: name(x.i)})),
        warum: vorschlagErklaerung(v, platz, erg.vorschlaege.length, c)
      }))});
  });
  return raus;
}

function vorschlagErklaerung(v, platz, anzahl, c){
  const teile = [];
  if (!v.aenderungen.length) teile.push("Die übrige Besetzung reicht an diesem Tag auch ohne Ersatz.");
  else {
    teile.push(`Schließt die Lücke, die durch ${c.name} am ${tagName(c.ti)} entsteht.`);
    teile.push("Geprüft: Ruhezeit zwischen zwei Schichten, Höchstarbeitszeit am Tag, Pausen, "
      + "Jugendschutz, höchstens sechs Arbeitstage und alle eingetragenen Abwesenheiten.");
  }
  teile.push(v.mehr > 0.01 ? `Kostet ${h1(v.mehr)} Stunden mehr als vorher an diesem Tag.`
    : v.mehr < -0.01 ? `Spart ${h1(-v.mehr)} Stunden.` : "Kostet keine zusätzlichen Stunden.");
  if (v.details) teile.push(v.details + ".");
  if (anzahl > 1) teile.push(platz === 0 ? "Steht oben, weil er am wenigsten Mehrstunden und Kontobelastung bringt."
    : `Platz ${platz + 1} von ${anzahl} — etwas mehr Stunden oder Kontobelastung als der erste.`);
  return teile.join(" ");
}

/* Übernehmen: der Entwurf wird der gültige Plan. Ausfälle landen in den Abwesenheiten,
   Krankheit und Urlaub zusätzlich unter „Urlaub & Krankheit“ (zusammenhängende Tage als
   ein Eintrag). Der Grund steht nirgends im Plan. */
function entwurfUebernehmen(sl){
  const kurz = state.plaene[sl], eintrag = entwurfHolen(sl);
  if (!kurz || !eintrag) return null;
  const {plan} = entwurfAnwenden(kurz, eintrag.aenderungen);
  const aktiv = eintrag.aenderungen.filter(a => a.aktiv);
  const mo = montagDer(kurz.mo);
  state.abwesend = state.abwesend || {};
  state.abwesend[sl] = state.abwesend[sl] || {};
  const neueEreignisse = {};
  aktiv.filter(a => a.typ === "abwesend").forEach(a => {
    const i = personIndex(a.name);
    if (i < 0) return;
    const vorher = (state.abwesend[sl][i] || {})[TAGE[a.ti][0]];
    state.abwesend[sl][i] = Object.assign({}, state.abwesend[sl][i], {[TAGE[a.ti][0]]: a.grund});
    // Was schon als Urlaub/Krank eingetragen war, nicht doppelt anlegen
    if ((a.grund === "krank" || a.grund === "urlaub") && vorher !== a.grund)
      (neueEreignisse[a.name + "|" + a.grund] = neueEreignisse[a.name + "|" + a.grund] || []).push(a.ti);
  });
  Object.entries(neueEreignisse).forEach(([k, tage]) => {
    const [name, art] = k.split("|");
    tage.sort((x, y) => x - y).reduce((gruppen, ti) => {
      const g = gruppen[gruppen.length - 1];
      if (g && g[g.length - 1] === ti - 1) g.push(ti); else gruppen.push([ti]);
      return gruppen;
    }, []).forEach(g => {
      const von = isoVon(new Date(mo.getTime() + g[0] * 864e5)), bis = isoVon(new Date(mo.getTime() + g[g.length - 1] * 864e5));
      (state.ereignisse = state.ereignisse || []).push({id: "e" + aenderungsId(), name, art, von, bis,
        angelegt: new Date().toISOString(), ausfall: true});
    });
  });
  const neu = Object.assign(plan, {geaendertVonHand: true, geaendert: new Date().toISOString()});
  // Nachvollziehbar bleiben, was geändert wurde — ohne Gründe (Gesundheitsdaten)
  neu.ausfaelle = (kurz.ausfaelle || []).concat(aktiv.filter(a => a.typ !== "abwesend")
    .map(a => ({am: new Date().toISOString(), was: a.typ === "notiz" ? "Notiz" : a.text})));
  state.plaene[sl] = neu;
  delete state.entwuerfe[sl];
  return neu;
}

/* ---- Assistent ------------------------------------------------------------
   Versteht kurze Sätze zum Plan der Woche, ohne Verbindung nach draußen — es verlässt
   kein Name und keine Uhrzeit das Gerät. Er schlägt Änderungen vor; im Plan erscheinen
   sie erst, wenn man sie antippt. */

const WOCHENTAGE = [["montag", "mo"], ["dienstag", "di"], ["mittwoch", "mi"], ["donnerstag", "do"],
                    ["freitag", "fr"], ["samstag", "sa"]];

function tageImText(t, mo){
  const tage = new Set();
  const wort = WOCHENTAGE.map(([lang, kurz]) => lang + "s?|" + kurz).join("|");
  // Bereiche: „di bis fr“, „dienstag-freitag“
  const bereich = new RegExp(`\\b(${wort})\\b\\.?\\s*(?:-|–|bis)\\s*\\b(${wort})\\b`, "g");
  const index = w => WOCHENTAGE.findIndex(([lang, kurz]) => w.startsWith(lang) || w === kurz);
  let r;
  while ((r = bereich.exec(t))){ const a = index(r[1]), b = index(r[2]); for (let k = Math.min(a, b); k <= Math.max(a, b); k++) tage.add(k); }
  t = t.replace(bereich, " ");
  const einzel = new RegExp(`\\b(${wort})\\b`, "g");
  while ((r = einzel.exec(t))) tage.add(index(r[1]));
  if (/\bganze[nr]? woche\b|\bdie woche\b|\balle tage\b/.test(t)) TAGE.forEach((_, k) => tage.add(k));
  const heute = new Date(); heute.setHours(12, 0, 0, 0);
  const ab = d => Math.round((d - mo) / 864e5);
  if (/\bheute\b/.test(t)) tage.add(ab(heute));
  if (/(^|\s)übermorgen(\s|$)/.test(t)){ const d = new Date(heute); d.setDate(d.getDate() + 2); tage.add(ab(d)); }
  else if (/(^|\s)morgen(\s|$)/.test(t)){ const d = new Date(heute); d.setDate(d.getDate() + 1); tage.add(ab(d)); }
  // Datum „24.11.“
  const datum = /\b(\d{1,2})\.(\d{1,2})\.?/g;
  while ((r = datum.exec(t))){ const d = new Date(mo); d.setMonth(+r[2] - 1, +r[1]); tage.add(ab(d)); }
  return [...tage].filter(k => k >= 0 && k < 6).sort((a, b) => a - b);
}

function personenImText(t){
  const ms = state.mitarbeiter, raus = [];
  ms.forEach((m, i) => {
    const teile = m.name.toLowerCase().split(/\s+/);
    const voll = m.name.toLowerCase();
    let stelle = t.indexOf(voll);
    if (stelle < 0) teile.some(w => { const r = new RegExp(`(^|[^a-zäöüß])${w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}(?![a-zäöüß])`).exec(t);
      if (r && w.length > 1){ stelle = r.index; return true; } return false; });
    if (stelle >= 0) raus.push({i, name: m.name, stelle});
  });
  // Teilt sich ein Vorname mit jemandem, zählt nur, wer auch mit vollem Namen passt
  return raus.sort((a, b) => a.stelle - b.stelle);
}

function zeitenImText(t){
  const z = "(\\d{1,2})(?:[:.](\\d{2}))?";
  const zahl = (h, m) => (+h) * 60 + (m ? +m : 0);
  const r = new RegExp(`(?:von\\s*)?${z}\\s*(?:uhr)?\\s*(?:-|–|bis)\\s*${z}`).exec(t);
  if (r && +r[1] < 24 && +r[3] <= 24) return {von: zahl(r[1], r[2]), bis: zahl(r[3], r[4])};
  const bis = new RegExp(`\\bbis\\s*${z}`).exec(t), ab = new RegExp(`\\b(?:ab|um)\\s*${z}`).exec(t);
  return {nurBis: bis ? zahl(bis[1], bis[2]) : null, nurAb: ab ? zahl(ab[1], ab[2]) : null};
}

const ASSISTENT_HILFE = "Ich verstehe zum Beispiel: „Eva ist Dienstag krank“, „Hans hat Mi bis Fr Urlaub“, "
  + "„Anna kann Donnerstag nicht“, „Bernd Mittwoch 8–14“, „Carla Freitag frei“, „Eva bleibt Dienstag bis 18 Uhr“, "
  + "„Tausche Eva und Hans am Mittwoch“, „Wer kann Samstag 14–20?“, „Was fehlt noch?“, „Wie viele Stunden hat Eva?“.";

function assistent(text, sl, kurz, eintrag){
  const t = " " + String(text || "").toLowerCase().replace(/\s+/g, " ").trim() + " ";
  const mo = montagDer(kurz.mo);
  const {plan, offen} = (() => { const p = entwurfPruefen(sl, kurz, eintrag); return {plan: p.plan, offen: p.offen}; })();
  const leute = personenImText(t), tage = tageImText(t, mo), zeit = zeitenImText(t);
  const karte = (a, text) => Object.assign({id: aenderungsId(), aktiv: false, quelle: "assistent", text}, a);
  const antwort = (text, karten) => ({antwort: text, karten: karten || []});

  if (/hilfe|was kannst du|wie geht/.test(t)) return antwort(ASSISTENT_HILFE);
  if (/was fehlt|probleme?\b|was ist offen|noch zu tun|\brot\b/.test(t)){
    if (!offen.length) return antwort("Im Entwurf ist nichts offen — Besetzung, Gesetz und Abwesenheiten passen.");
    return antwort("Offen ist noch: " + offen.map(o => o.text).join(" "));
  }
  if (/\bwer kann\b|\bwer hat zeit\b|\bwer könnte\b/.test(t)){
    if (!tage.length) return antwort("Für welchen Tag? Zum Beispiel: „Wer kann Samstag 14–20?“");
    const ti = tage[0], von = zeit.von !== undefined ? zeit.von : null, bis = zeit.bis !== undefined ? zeit.bis : null;
    const frei = state.mitarbeiter.map((m, i) => ({m, i})).filter(({m}) => {
      const j = platzImPlan(plan, m.name);
      const hat = j >= 0 && plan.tage[ti].schichten.some(s => s.mi === j);
      if (von === null) return !hat;
      const probe = kopie(plan);
      return !hat && ausfallErlaubt(probe, planPlatz(probe, personIndex(m.name)), ti, von, bis);
    });
    if (!frei.length) return antwort(`Am ${tagName(ti)}${von !== null ? " " + hhmm(von) + "–" + hhmm(bis) : ""} kann niemand zusätzlich — alle sind eingeplant, abwesend oder kämen über eine Grenze.`);
    const karten = von === null ? [] : frei.slice(0, 4).map(({m}) =>
      karte({typ: "schicht", name: m.name, ti, von, bis}, `${m.name} ${tagName(ti)} ${hhmm(von)}–${hhmm(bis)}`));
    return antwort(`Am ${tagName(ti)}${von !== null ? " " + hhmm(von) + "–" + hhmm(bis) : ""} könnten: ${frei.map(x => x.m.name).join(", ")}.`
      + (karten.length ? " Antippen zeigt es im Plan." : ""), karten);
  }
  if (/stunden|konto|überstunden/.test(t) && leute.length && !tage.length){
    const p = leute[0], m = state.mitarbeiter[p.i];
    const j = platzImPlan(plan, p.name);
    const k = j >= 0 ? kontoNach(Object.assign(kopie(plan), {mo: kurz.mo}), j) : null;
    if (!k) return antwort(`${p.name}: keine Vertragsstunden hinterlegt.`);
    return antwort(`${p.name} hat im Entwurf ${h1(k.ist)} h in dieser Woche (Soll ${h1(k.soll)} h). Konto danach: ${ueText(k.ende) || "0,0"} h`
      + (darfUeberstunden(m) ? "." : " — macht keine Überstunden."));
  }
  if (!leute.length) return antwort("Ich habe keinen Namen aus dem Personal erkannt. " + ASSISTENT_HILFE);
  if (/tausch/.test(t)){
    if (leute.length < 2 || !tage.length) return antwort("Wen mit wem und an welchem Tag? Zum Beispiel: „Tausche Eva und Hans am Mittwoch“.");
    const [a, b] = leute, karten = [];
    tage.forEach(ti => {
      const sa = plan.tage[ti].schichten.find(s => s.mi === platzImPlan(plan, a.name));
      const sb = plan.tage[ti].schichten.find(s => s.mi === platzImPlan(plan, b.name));
      if (!sa && !sb) return;
      karten.push(karte(sb ? {typ: "schicht", name: a.name, ti, von: sb.von, bis: sb.bis} : {typ: "frei", name: a.name, ti},
        `${a.name} ${tagName(ti)} ${sb ? hhmm(sb.von) + "–" + hhmm(sb.bis) : "frei"}`));
      karten.push(karte(sa ? {typ: "schicht", name: b.name, ti, von: sa.von, bis: sa.bis} : {typ: "frei", name: b.name, ti},
        `${b.name} ${tagName(ti)} ${sa ? hhmm(sa.von) + "–" + hhmm(sa.bis) : "frei"}`));
    });
    if (!karten.length) return antwort(`${a.name} und ${b.name} haben an dem Tag beide frei — da gibt es nichts zu tauschen.`);
    return antwort(`Tausch zwischen ${a.name} und ${b.name}: beide Karten antippen, dann steht es im Plan.`, karten);
  }
  const p = leute[0];
  if (!tage.length) return antwort(`Für welchen Tag gilt das für ${p.name}? Zum Beispiel: „${p.name.split(" ")[0]} ist Dienstag krank“.`);
  const grund = /krank/.test(t) ? "krank" : /urlaub/.test(t) ? "urlaub" : /berufsschule|schule/.test(t) ? "schule"
    : /kann nicht|kann .* nicht|fällt .*aus|ausfall|nicht da|verhindert|termin/.test(t) ? "nicht" : null;
  if (grund){
    const karten = tage.filter(ti => !plan.tage[ti].feiertag).map(ti =>
      karte({typ: "abwesend", name: p.name, ti, grund}, `${p.name} ${tagName(ti)}: ${GRUND_NAME[grund]}`));
    const betroffen = tage.filter(ti => schichtText(plan, p.name, ti));
    return antwort(`${p.name}: ${GRUND_NAME[grund]} am ${tage.map(tagName).join(", ")}.`
      + (betroffen.length ? ` Im Plan steht ${p.name} an ${betroffen.length === 1 ? "diesem Tag" : betroffen.length + " dieser Tage"} — nach dem Antippen erscheinen Vorschläge für den Ersatz.`
                          : ` ${p.name} ist an ${tage.length === 1 ? "dem Tag" : "den Tagen"} ohnehin nicht eingeplant.`), karten);
  }
  if (/\bfrei\b/.test(t) && zeit.von === undefined){
    return antwort(`${p.name} bekommt frei am ${tage.map(tagName).join(", ")}. Entsteht eine Lücke, steht sie danach rot im Plan.`,
      tage.map(ti => karte({typ: "frei", name: p.name, ti}, `${p.name} ${tagName(ti)} frei`)));
  }
  if (zeit.von !== undefined){
    if (!(zeit.bis > zeit.von)) return antwort("Das Ende muss nach dem Beginn liegen.");
    return antwort(`${p.name} arbeitet ${tage.map(tagName).join(", ")} ${hhmm(zeit.von)}–${hhmm(zeit.bis)}; die Pause legt der Planer nach Gesetz.`,
      tage.map(ti => karte({typ: "schicht", name: p.name, ti, von: zeit.von, bis: zeit.bis}, `${p.name} ${tagName(ti)} ${hhmm(zeit.von)}–${hhmm(zeit.bis)}`)));
  }
  if (zeit.nurBis !== null || zeit.nurAb !== null){
    const karten = [];
    tage.forEach(ti => {
      const s = plan.tage[ti].schichten.find(x => x.mi === platzImPlan(plan, p.name));
      if (!s) return;
      const von = zeit.nurAb !== null ? zeit.nurAb : s.von, bis = zeit.nurBis !== null ? zeit.nurBis : s.bis;
      if (bis > von) karten.push(karte({typ: "schicht", name: p.name, ti, von, bis}, `${p.name} ${tagName(ti)} ${hhmm(von)}–${hhmm(bis)}`));
    });
    if (!karten.length) return antwort(`${p.name} hat an dem Tag keine Schicht, die sich verlängern oder verkürzen ließe. Mit Uhrzeit von–bis geht es: „${p.name.split(" ")[0]} ${tagName(tage[0])} 8–14“.`);
    return antwort(`So würde es aussehen — antippen zeigt es im Plan.`, karten);
  }
  return antwort(`Was soll für ${p.name} am ${tage.map(tagName).join(", ")} gelten? ` + ASSISTENT_HILFE);
}

// ==== kern/17-analyse.js ====
/* Analyse: Reicht das Personal, was sagen die Konten, was ist für die Zukunft zu tun?

   Rechnet nur mit dem, was ohnehin im Planer steht (Verträge, Pläne, Konten). Keine
   Leistungsbewertung einzelner Personen — es geht um Besetzung und Verträge.

   Vergütung, wie sie bei Norma gilt:
   · Aushilfen (Minijob) bekommen ausgezahlt, was sie im Vormonat gearbeitet haben —
     einen Monat verzögert und nie mehr, als die Minijob-Grenze erlaubt. Was darüber
     liegt, wird in die nächsten Monate mitgenommen, nie ausgezahlt.
   · Teilzeit- und Vollzeitkräfte bekommen ein gleichmäßiges Gehalt, unabhängig von den
     gearbeiteten Stunden. Überstunden können ausgezahlt werden; Minusstunden müssen
     langfristig ausgeglichen werden. */

// Gesetzlicher Mindestlohn je Jahr (MiLoG; Beschluss der Mindestlohnkommission 2025)
const MINDESTLOHN = {2024: 12.41, 2025: 12.82, 2026: 13.90, 2027: 14.60};
function mindestlohn(jahr){
  const jahre = Object.keys(MINDESTLOHN).map(Number).sort((a, b) => a - b);
  const j = jahre.filter(x => x <= jahr).pop() || jahre[0];
  return MINDESTLOHN[j];
}
// Minijob-Grenze (§ 8 Abs. 1a SGB IV): Mindestlohn × 130 / 3, auf volle Euro aufgerundet
const minijobGrenze = jahr => Math.ceil(mindestlohn(jahr) * 130 / 3);
// Stundenlohn der Aushilfen: eingetragen, sonst der Mindestlohn
function aushilfeLohn(jahr){
  const l = nz((state.einstellungen || {}).aushilfeLohn);
  return l > 0 ? Math.max(l, mindestlohn(jahr)) : mindestlohn(jahr);
}
// So viele Stunden im Monat passen unter die Grenze (auf Viertelstunden abgerundet)
const minijobStunden = jahr => Math.floor(minijobGrenze(jahr) / aushilfeLohn(jahr) * 4) / 4;

// Ausfall durch Urlaub und Krankheit, als Anteil der Vertragsstunden
const AUSFALL = {urlaub: 0.115, krank: 0.055};       // ≈ 30 Urlaubstage von 260 · übliche Krankenquote im Handel
const AUSFALL_QUOTE = AUSFALL.urlaub + AUSFALL.krank;
const euro = n => n.toLocaleString("de-DE", {minimumFractionDigits: 2, maximumFractionDigits: 2}) + " €";
const istAushilfe = m => m.typ === "Aushilfe (Minijob)";
const festesGehalt = m => !istAushilfe(m) && !istAzubi(m);

// Gearbeitete Stunden je Monat und Name, aus allen Plänen (inklusive Archiv)
function stundenJeMonat(){
  const raus = {}, geplant = {};
  Object.values(state.plaene || {}).forEach(kurz => kurz.tage.forEach(t => {
    const monat = String(t.datum).slice(0, 7);
    geplant[monat] = (geplant[monat] || 0) + 1;
    t.schichten.forEach(s => {
      const name = kurz.namen ? kurz.namen[s.mi] : (state.mitarbeiter[s.mi] || {}).name;
      if (!name) return;
      raus[monat] = raus[monat] || {};
      raus[monat][name] = (raus[monat][name] || 0) + s.arbeit;
    });
  }));
  return {stunden: raus, geplant};
}
// Arbeitstage (Mo–Sa) eines Monats
function arbeitstageImMonat(monat){
  const [j, m] = monat.split("-").map(Number);
  let n = 0;
  for (let d = new Date(j, m - 1, 1, 12); d.getMonth() === m - 1; d.setDate(d.getDate() + 1)) if (d.getDay() !== 0) n++;
  return n;
}

// Monatskonto einer Aushilfe: gearbeitet, im Folgemonat ausgezahlt, mitgenommen
function aushilfenKonto(name){
  const {stunden, geplant} = stundenJeMonat();
  const monate = Object.keys(stunden).sort();
  let uebertrag = 0;
  return monate.map(monat => {
    const gearbeitet = (stunden[monat] || {})[name] || 0;
    const jahr = +monat.slice(0, 4), grenze = minijobStunden(jahr);
    const verfuegbar = gearbeitet + uebertrag;
    const ausgezahlt = Math.min(verfuegbar, grenze);
    uebertrag = viertel(verfuegbar - ausgezahlt);
    return {monat, gearbeitet: viertel(gearbeitet), ausgezahlt: viertel(ausgezahlt), uebertrag, grenze,
            vollstaendig: (geplant[monat] || 0) >= arbeitstageImMonat(monat) - 1};
  });
}

// Der Mindestbedarf einer Woche: aus den letzten Plänen (Messlatte), sonst aus der Einrichtung
function wochenBedarf(){
  const a = auswertung();
  const letzte = Object.keys(state.plaene || {}).sort().slice(-8).map(sl => state.plaene[sl].berechnung)
    .filter(b => b && b.mindest !== null && b.mindest !== undefined).map(b => b.mindest);
  if (letzte.length) return {stunden: letzte.reduce((s, x) => s + x, 0) / letzte.length,
    quelle: letzte.length === 1 ? "Messlatte des letzten Plans" : `Messlatte der letzten ${letzte.length} Pläne`};
  return {stunden: a.bedarf, quelle: "aus der Einrichtung gerechnet"};
}

// Geplante Stunden je Wochentag im Schnitt der letzten Pläne
function stundenJeWochentag(){
  const sl = Object.keys(state.plaene || {}).sort().slice(-8);
  if (!sl.length) return null;
  return TAGE.map(([k, l], ti) => {
    const werte = sl.map(x => state.plaene[x].tage[ti]).filter(t => t && !t.feiertag)
      .map(t => t.schichten.reduce((s, x) => s + x.arbeit, 0));
    return {tag: l, stunden: werte.length ? werte.reduce((s, x) => s + x, 0) / werte.length : 0, wochen: werte.length};
  });
}

function personalAnalyse(){
  const a = auswertung(), jahr = new Date().getFullYear();
  const bedarf = wochenBedarf();
  const brutto = bedarf.stunden === null ? null : bedarf.stunden / (1 - AUSFALL_QUOTE);
  const vorhanden = a.anwesend;
  const stand = ueberstundenZuBeginn(aktuellerMontag());
  const konten = state.mitarbeiter.map((m, i) => ({m, i, stand: stand[i]}));
  return {a, bedarf, brutto, vorhanden, diff: brutto === null ? null : vorhanden - brutto, konten,
          minijobWoche: Math.round(minijobStunden(jahr) * 12 / 52 * 2) / 2, jahr};
}

/* Empfehlungen: [{kennung, art: rot | gelb | gruen, titel, text}]. Die Kennung ist
   grob gerundet, damit dieselbe Lage nicht jede Woche als „neu“ erscheint. */
function analyseEmpfehlungen(){
  if (!state.mitarbeiter.length) return [];
  const x = personalAnalyse(), raus = [];
  const stufe = n => Math.round(n / 5) * 5;
  if (x.diff !== null){
    const fehlt = -x.diff;
    if (fehlt > 2){
      let titel, text;
      if (fehlt <= x.minijobWoche){
        titel = `Eine Aushilfe mit etwa ${h1(Math.ceil(fehlt))} h pro Woche einstellen`;
        text = `Dem Bedarf fehlen rund ${h1(fehlt)} h je Woche. Das passt in einen Minijob (bis ${h1(minijobStunden(x.jahr))} h im Monat bei ${euro(aushilfeLohn(x.jahr))} Stundenlohn).`;
      } else if (fehlt <= 30){
        titel = `Eine Teilzeitkraft mit etwa ${stufe(fehlt) || 5} h pro Woche einstellen`;
        text = `Dem Bedarf fehlen rund ${h1(fehlt)} h je Woche — mehr, als ein Minijob abdeckt (etwa ${h1(x.minijobWoche)} h je Woche).`;
      } else {
        // Ganze Vollzeitstellen, der Rest als Teilzeit oder Minijob
        const voll = Math.max(1, Math.floor(fehlt / 38.5)), rest = fehlt - voll * 38.5;
        titel = `Personal aufstocken: rund ${Math.round(fehlt)} h pro Woche`;
        text = `Zum Beispiel ${voll === 1 ? "eine Vollzeitkraft" : voll + " Vollzeitkräfte"} (38,5 h)`
          + (rest > x.minijobWoche ? ` und eine Teilzeitkraft mit etwa ${stufe(rest) || 5} h` : rest > 2 ? ` und eine Aushilfe mit etwa ${h1(Math.ceil(rest))} h` : "") + ".";
      }
      raus.push({kennung: "fehlt-" + stufe(fehlt), art: "rot", titel,
        text: text + ` Gerechnet: Mindestbedarf ${h1(x.bedarf.stunden)} h (${x.bedarf.quelle}) plus ${Math.round(AUSFALL_QUOTE * 100)} % für Urlaub und Krankheit = ${h1(x.brutto)} h; vorhanden sind ${h1(x.vorhanden)} h Vertragsstunden.`});
    } else if (x.diff > Math.max(5, x.brutto * 0.08)){
      raus.push({kennung: "zuviel-" + stufe(x.diff), art: "gelb", titel: `Etwa ${h1(x.diff)} h pro Woche mehr Vertragsstunden als nötig`,
        text: `Die Verträge (${h1(x.vorhanden)} h) liegen über dem Bedarf mit Ausfallpuffer (${h1(x.brutto)} h). Bei der nächsten Kündigung oder Vertragsänderung nicht voll nachbesetzen — sonst entstehen bei den Teilzeitkräften Minusstunden, die Norma bezahlt, ohne dass gearbeitet wird.`});
    } else raus.push({kennung: "passt", art: "gruen", titel: "Die Besetzung passt zum Bedarf",
      text: `Vorhanden ${h1(x.vorhanden)} h, nötig mit Ausfallpuffer ${h1(x.brutto)} h je Woche.`});
  }
  if (x.a.fruehOk < 2) raus.push({kennung: "frueh-" + x.a.fruehOk, art: "rot", titel: "Eine weitere Person für die Frühschicht (Schlüssel)",
    text: `Nur ${x.a.fruehOk} ${x.a.fruehOk === 1 ? "Person kann" : "Personen können"} die Frühschicht führen. Bei Urlaub oder Krankheit geht der Laden nicht auf — bei der nächsten Einstellung oder Schulung darauf achten.`});
  if (x.a.spaetOk < 2) raus.push({kennung: "spaet-" + x.a.spaetOk, art: "rot", titel: "Eine weitere Person für die Spätschicht",
    text: `Nur ${x.a.spaetOk} ${x.a.spaetOk === 1 ? "Person kann" : "Personen können"} die Spätschicht führen.`});
  // Konten: Überstunden der Gehaltsempfänger, Minusstunden, Übertrag der Aushilfen
  const plus = x.konten.filter(k => festesGehalt(k.m) && k.stand !== null && k.stand > 20);
  if (plus.length) raus.push({kennung: "plus-" + plus.map(k => k.m.name).join(","), art: "gelb",
    titel: `Hohe Überstunden: ${plus.map(k => k.m.name).join(", ")}`,
    text: "Mehr als 20 Stunden auf dem Konto. Auszahlen lassen oder in den nächsten Wochen gezielt abbauen. Wiederholt sich das, fehlen Vertragsstunden in der Filiale."});
  const minus = x.konten.filter(k => festesGehalt(k.m) && k.stand !== null && k.stand < -10);
  if (minus.length) raus.push({kennung: "minus-" + minus.map(k => k.m.name).join(","), art: "rot",
    titel: `Minusstunden ausgleichen: ${minus.map(k => k.m.name).join(", ")}`,
    text: "Mehr als 10 Minusstunden. Das Gehalt läuft gleichmäßig weiter — die Stunden müssen nachgearbeitet werden, sonst zahlt Norma Zeit, die nicht gearbeitet wurde. In den nächsten Plänen mehr einplanen."});
  state.mitarbeiter.filter(istAushilfe).forEach(m => {
    const k = aushilfenKonto(m.name).filter(z => z.vollstaendig);
    const l = k[k.length - 1];
    if (l && l.uebertrag > l.grenze * 0.25) raus.push({kennung: "uebertrag-" + m.name + "-" + stufe(l.uebertrag), art: "gelb",
      titel: `${m.name} baut Stunden auf, die nicht ausgezahlt werden`,
      text: `${h1(l.uebertrag)} h werden über die Minijob-Grenze hinaus mitgenommen (Grenze ${h1(l.grenze)} h im Monat). Weniger einplanen — oder einen Vertrag mit mehr Stunden anbieten, wenn der Bedarf dauerhaft da ist.`});
  });
  return raus;
}

/* Zustand der App und Einlesen alter Datenstände */

// Die Einrichtung umfasst nur diese vier Schritte. Stundenliste und Prüfen
// sind eigene Bereiche, die von der Startseite aus offenstehen.
const SCHRITTE = ["Filiale","Wochenaufgaben","Mitarbeiter","Standardwoche"];

const STUNDENLISTE_SCHRITT = 4, PRUEFEN_SCHRITT = 5;

const BEREICHE = [
  {id:"filiale",      name:"Filiale",        schritt:0},
  {id:"aufgaben",     name:"Wochenaufgaben", schritt:1},
  {id:"personal",     name:"Personal",       schritt:2},
  {id:"standardwoche",name:"Standardwoche",  schritt:3},
  {id:"stundenliste", name:"Stundenliste",   schritt:STUNDENLISTE_SCHRITT}
];

/* ---------------- Zustand ---------------- */
let state = leer();

let ansicht = "anmeldung";      // anmeldung | einrichtung | bereich | start | planen | archiv

let schritt = 0, maxSchritt = 0, fehler = "";

let planWoche = null;     // Montag (ISO) der Woche, für die geplant wird

let zeigeWoche = null;    // Montag (ISO) der Woche, die die Startseite zeigt

let listenWoche = null;   // Montag (ISO) der Woche in der Stundenliste

function neueAufgabe(w){
  // Bestellungen haben eine Frist und macht eine Person — das ist der Normalfall.
  // Jede Norma-Filiale hat alle Aufgaben; abschalten lässt sich eine nur, wenn ohne
  // sie geplant werden soll.
  const best = w.gruppe === "bestellung";
  return {aktiv:true, tage:[], zeitArt: best ? "spanne" : "fest", zeit:"",
          fVon:"", fBis:"", dauer:"", personen: best ? "1" : "",
          jeTag:false, proTag:{}};
}

function leer(){
  const a = {};
  WAREN.forEach(w => a[w.id] = neueAufgabe(w));
  // Öffnungszeit bleibt leer, bis sie eingetragen ist — eine vorbelegte Zeit sah aus,
  // als wäre sie schon geprüft
  return {nr:"", ort:"", land:"BW", von:"", bis:"", wechsel:"", allein:false, aufgaben:a, mitarbeiter:[],
          budget:{stunden:{}, umsatz:{}}, eingerichtet:false, plaene:{}, abwesend:{},
          listen:{}, phasen:{}, rrSichtbar:true};
}

function normalisiere(s){
  if (!s.plaene) s.plaene = {};
  if (!s.abwesend) s.abwesend = {};
  if (!s.listen) s.listen = {};
  if (!s.phasen) s.phasen = {};
  if (!s.ereignisse) s.ereignisse = [];
  if (!s.land) s.land = "BW";        // bis 12.11.2026 gab es nur Baden-Württemberg
  // Vor dem 10.11.2026 gab es nur eine Stundenliste ohne Woche — sie wird zur
  // Liste der laufenden Woche, statt unsichtbar liegen zu bleiben
  if (s.budget && s.budget.stunden && Object.values(s.budget.stunden).some(v => hat(v))
      && !Object.keys(s.listen).length){
    s.listen[wochenSchluessel(aktuellerMontag())] = JSON.parse(JSON.stringify(s.budget));
  }
  if (s.archivGewarnt === true) s.archivGewarnt = {};   // früher ein einziger Schalter
  // Filialen von vor dem RR-Schein kennen die neue Aufgabe noch nicht
  if (s.aufgaben) WAREN.forEach(w => {
    if (!s.aufgaben[w.id]) s.aufgaben[w.id] = Object.assign(neueAufgabe(w), {neu:true});
  });
  // Bis 12.11.2026 kam der RR-Schein in bestehende Filialen ausgeschaltet und blass
  // hinein — leicht zu übersehen. Unberührt? Dann einschalten und als neu zeigen.
  const rr = s.aufgaben && s.aufgaben.rr;
  if (rr && !s.rrSichtbar){
    if (!rr.aktiv && !rr.offen && !rr.tage.length && !rr.zeit && !rr.dauer){ rr.aktiv = true; rr.neu = true; }
    s.rrSichtbar = true;
  }
  if (s.eingerichtet === undefined) s.eingerichtet = !!(s.mitarbeiter && s.mitarbeiter.length);
  WAREN.forEach(w => {
    const a = s.aufgaben && s.aufgaben[w.id];
    if (!a) return;
    if (!a.zeitArt) a.zeitArt = hatZeit(a.zeit) ? "fest" : "egal";
    // Kurz (13.11.2026) gab es „noch nicht festgelegt“ — jetzt ist jede Aufgabe aktiv,
    // bis sie jemand abschaltet
    if (a.offen){ delete a.offen; a.aktiv = true; }
    if (a.fVon === undefined) a.fVon = "";
    if (a.fBis === undefined) a.fBis = "";
    if (a.jeTag === undefined) a.jeTag = false;
    // Bis 12.11.2026 gab es je Tag nur eine eigene Uhrzeit (zeiten); jetzt hat
    // jeder Tag alle Einstellungen. Die alten Uhrzeiten wandern dorthin.
    if (!a.proTag){
      a.proTag = {};
      if (a.jeTag) a.tage.forEach(k => {
        a.proTag[k] = {zeitArt:a.zeitArt, zeit:(a.zeiten || {})[k] || a.zeit, fVon:a.fVon, fBis:a.fBis,
                       dauer:a.dauer, personen:a.personen};
      });
    }
    delete a.zeiten;
  });
  // Überstunden: bis 12.11.2026 wurden Wochen von Hand „ins Stundenkonto gebucht“.
  // Jetzt laufen sie von selbst weiter — gezählt ab der Woche saldoAb. Was schon
  // gebucht ist, steckt im Kontostand; ab der Woche danach zählt es von selbst.
  const plaene = s.plaene || {};
  const gebuchtBis = Object.keys(plaene).filter(sl => plaene[sl].gebucht).sort().pop();
  (s.mitarbeiter || []).forEach(m => {
    if (m.geteilt === undefined) m.geteilt = false;
    // Seit 13.11.2026 nur noch „18 oder älter“ / „unter 18“ — ein altes Geburtsdatum
    // wird einmal umgerechnet und nicht weiter aufgehoben
    if (m.geb !== undefined){
      const j = alter(m.geb);
      if (j !== null) m.volljaehrig = j >= 18;       // das Datum war die verlässlichere Angabe
      delete m.geb;
    }
    if (m.ueberstunden === undefined) m.ueberstunden = true;
    if (!m.saldoAb) m.saldoAb = gebuchtBis ? folgeSchluessel(gebuchtBis) : wochenSchluessel(aktuellerMontag());
    delete m.pauseMin;          // Pausen richten sich jetzt nach dem Gesetz
  });
  Object.values(plaene).forEach(p => {
    delete p.gebucht;
    // Pläne von vor dem 12.11.2026 kennen die Leute nur nach Platz in der Liste.
    // Die Liste von heute ist die beste Annahme — ab jetzt bleibt es so, auch wenn
    // jemand entfernt wird.
    if (!p.namen) p.namen = (s.mitarbeiter || []).map(m => m.name);
  });
  return s;
}

async function ladeFiliale(nr){
  const id = key(nr);
  if (inApp){
    const roh = await appRuf("laden", {id});
    if (roh === null || roh === undefined) return null;
    try { return normalisiere(typeof roh === "string" ? JSON.parse(roh) : roh); } catch(e){ return null; }
  }

async function speichere(){
  if (!state.nr) return;

  if (ONLINE_BEREIT && state.online){

    await appRuf("zuletzt", {setzen: state.nr});

  }
  if (db){
    try { await db.doc("filialen/" + id).set(body); return; } catch(e){ /* lokal weiter */ }
  }
  try { localStorage.setItem(LS + id, JSON.stringify(body)); } catch(e){}
}

async function loescheFiliale(nr){
  const id = key(nr);
  if (inApp){ await appRuf("loeschen", {id}); }
  if (db){ try { await db.doc("filialen/" + id).delete(); } catch(e){} }
  try { localStorage.removeItem(LS + id); } catch(e){}
  bekannteSchreiben(bekannteLesen().filter(x => key(x.nr) !== id));
  const l = letzterZugang();
  if (l && key(l.nr) === id){ try { localStorage.removeItem(LETZTE); } catch(e){} }
}

async function hash(text){
  try {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,"0")).join("");
  } catch(e){
    // Ohne Web-Crypto (sehr alte Umgebungen): einfacher Streuwert, damit wenigstens
    // nicht jedes gleich lange Kennwort passt
    let h = 0x811c9dc5;
    for (const z of text){ h ^= z.codePointAt(0); h = Math.imul(h, 0x01000193) >>> 0; }
    return "x" + h.toString(16);
  }
}

function zufall(laenge, zeichen){
  const z = new Uint32Array(laenge);
  crypto.getRandomValues(z);
  return [...z].map(x => zeichen[x % zeichen.length]).join("");
}

/* „Mein Plan“: Die Schichten der laufenden und der nächsten Woche auf den Server, damit
   jeder Mitarbeiter auf der Seite „Meine Zeiten“ seine eigenen sieht. Nur, wenn die
   Filialleitung es eingeschaltet hat. Geschickt wird nur, was sich geändert hat. */
function meinPlanDaten(sl){
  const kurz = state.plaene[sl];
  if (!kurz) return null;
  const daten = {};
  state.mitarbeiter.forEach((m, i) => {
    const j = planIndex(kurz, m, i);
    daten[m.name] = j < 0 ? [] : kurz.tage.flatMap(t => t.feiertag ? [] : t.schichten.filter(s => s.mi === j)
      .sort((a, b) => a.von - b.von)
      .map(s => Object.assign({tag: t.key, von: hhmm(s.von), bis: hhmm(s.bis)},
        s.pauseVon !== null && s.pauseVon !== undefined ? {pVon: hhmm(s.pauseVon), pBis: hhmm(s.pauseBis)} : {})));
  });
  return daten;
}
let _abgleichLaeuft = false;
async function meinPlanAbgleichen(){
  if (!ONLINE_BEREIT || !state.online || _abgleichLaeuft) return;
  _abgleichLaeuft = true;
  try {
    const o = state.online;
    if (o.land !== state.land){
      await abgabeRuf("termine_land", {p_nr: state.nr, p_schluessel: o.schluessel, p_land: state.land});
      o.land = state.land;
    }
    if (!o.meinPlan) return;
    o.planStand = o.planStand || {};
    const mo = aktuellerMontag();
    for (const d of [0, 7]){
      const m = new Date(mo); m.setDate(mo.getDate() + d);
      const sl = wochenSchluessel(m);
      const daten = meinPlanDaten(sl);
      if (!daten) continue;
      const stand = JSON.stringify(daten);
      if (o.planStand[sl] === stand) continue;
      await abgabeRuf("termine_plan_setzen", {p_nr: state.nr, p_schluessel: o.schluessel, p_woche: sl, p_plan: daten});
      o.planStand[sl] = stand;
    }
    delete o.serverFehler;
  } catch(e){
    // Fehlt die Erweiterung auf dem Server, deutlich sagen — sonst still weiter
    state.online.serverFehler = /schema cache|Could not find the function/i.test(e.message)
      ? "Auf dem Server fehlt noch die Erweiterung „plan.sql“ — einmal im SQL-Editor von Supabase ausführen."
      : e.message;
  } finally { _abgleichLaeuft = false; }
}
async function meinPlanSchalten(an){
  state.online.meinPlan = an;
  state.online.planStand = {};
  if (an) await meinPlanAbgleichen();
  else await abgabeRuf("termine_plan_loeschen", {p_nr: state.nr, p_schluessel: state.online.schluessel});
  await speichere();
}

/* Rote Zahlen an den Knöpfen: Wo ist etwas einzustellen, wo hat sich etwas geändert?

   Zwei Arten:
     anpassen — etwas fehlt oder passt nicht. Die Zahl verschwindet, sobald es erledigt ist.
     neu      — etwas hat sich geändert. Die Zahl verschwindet, sobald der Bereich
                geöffnet wurde (state.gesehen merkt sich das je Filiale).
   Ziele: planen, aendern, ereignisse, termine, filiale, aufgaben, personal,
          standardwoche, stundenliste, analyse, archiv, sicherung */

// Einmalige Hinweise auf Neuerungen — die Kennung bleibt fest, damit sie nur einmal erscheinen
const NEUIGKEITEN = [
  {ziel: "personal", id: "neu:funktionsnamen", text: "Funktionen heißen jetzt „Kassieren“, „Ware verräumen“ und „Bestellen“."},
  {ziel: "personal", id: "neu:ereignisse-beim-mitarbeiter", text: "Urlaub und Krankheit trägst du jetzt direkt beim Mitarbeiter ein."}
];

function markierungen(){
  const raus = {}, gesehen = state.gesehen || {};
  const add = (ziel, id, art, text) => {
    if (art === "neu" && gesehen[id]) return;
    (raus[ziel] = raus[ziel] || []).push({id, art, text});
  };

  if (!hatZeit(state.von) || !hatZeit(state.bis)) add("filiale", "oeffnung", "anpassen", "Öffnungszeit fehlt");
  state.mitarbeiter.forEach(m => {
    if (altersAngabe(m) === null) add("personal", "alter:" + m.name, "anpassen", `${m.name}: Alter angeben`);
  });
  WAREN.forEach(w => {
    const a = state.aufgaben[w.id];
    if (a && a.neu) add("aufgaben", "aufgabe:" + w.id, "neu", `Neu: ${w.anzeige || w.name}`);
  });
  // Neuerungen nur in Filialen, die schon vorher eingerichtet waren
  if (state.mitarbeiter.length) NEUIGKEITEN.forEach(n => add(n.ziel, n.id, "neu", n.text));

  // Pläne: Wer steht im Plan, obwohl er inzwischen fehlt? (laufende und kommende Wochen)
  const jetzt = wochenSchluessel(aktuellerMontag());
  Object.keys(state.plaene || {}).filter(sl => sl >= jetzt).forEach(sl =>
    planKonflikte(sl).forEach(k => add("aendern", `konflikt:${sl}:${k.name}:${k.ti}`, "anpassen", k.text)));

  // Ab Donnerstag gehört der Plan der nächsten Woche gemacht
  const heute = new Date(), wt = (heute.getDay() + 6) % 7;
  const naechste = new Date(montagDer(null)); naechste.setDate(naechste.getDate() + 7);
  if (!(state.plaene || {})[jetzt]) add("planen", "plan:" + jetzt, "anpassen", `Für KW ${kwVon(aktuellerMontag())} gibt es noch keinen Plan`);
  else if (wt >= 3 && wt < 6 && !(state.plaene || {})[wochenSchluessel(naechste)])
    add("planen", "plan:" + wochenSchluessel(naechste), "anpassen", `Für KW ${kwVon(naechste)} gibt es noch keinen Plan`);
  // Stundenliste: nur, wenn die Filiale überhaupt mit Listen arbeitet
  if (Object.keys(state.listen || {}).length && wt >= 3 && wt < 6 && !(state.listen || {})[wochenSchluessel(naechste)])
    add("stundenliste", "liste:" + wochenSchluessel(naechste), "anpassen", `Stundenliste für KW ${kwVon(naechste)} fehlt`);

  // Analyse: neue Empfehlungen
  if (typeof analyseEmpfehlungen === "function")
    analyseEmpfehlungen().filter(e => e.art !== "gruen").forEach(e => add("analyse", "empfehlung:" + e.kennung, "neu", e.titel));
  return raus;
}

// Ein Bereich wurde geöffnet: seine Neuigkeiten gelten als gesehen
function gesehenMerken(ziel){
  const neu = (markierungen()[ziel] || []).filter(x => x.art === "neu");
  if (!neu.length) return;
  markierungsKasten.zuletzt[ziel] = neu;      // einmal noch oben auf der Seite zeigen
  state.gesehen = state.gesehen || {};
  neu.forEach(x => state.gesehen[x.id] = new Date().toISOString().slice(0, 10));
  sichern();
}

// Oben auf einer Seite: was hier zu tun oder neu ist
function markierungsKasten(ziel){
  const liste = markierungen()[ziel] || [];
  const zeigen = liste.concat(markierungsKasten.zuletzt[ziel] || []).filter((x, n, a) => a.findIndex(y => y.id === x.id) === n);
  markierungsKasten.zuletzt[ziel] = [];
  if (!zeigen.length) return null;
  const nurNeu = zeigen.every(x => x.art === "neu");
  return el(`<div class="markierungskasten${nurNeu ? " neu" : ""}">${zeigen.map(x =>
    `<div class="mk-zeile ${x.art}"><span class="mk-punkt"></span><span>${esc(x.text)}</span></div>`).join("")}</div>`);
}
markierungsKasten.zuletzt = {};

const el = (h) => { const tpl = document.createElement("template"); tpl.innerHTML = h.trim(); return tpl.content.firstElementChild; };

const SCHRITT_FN = () => [filiale, warentage, mitarbeiter, standardwoche, stundenliste, pruefen];

function kopfLeiste(){
  const c = document.getElementById("filChip");
  if (state.nr && ansicht !== "anmeldung"){
    c.hidden = false;
    c.textContent = "N " + state.nr + (state.ort ? " · " + state.ort : "");

  const ab = document.getElementById("abmelden");

}

function render(){
  const layout = document.querySelector(".layout");
  const steps = document.getElementById("steps");
  const v = document.getElementById("view");
  v.innerHTML = "";
  kopfLeiste();

  const inEinrichtung = (ansicht === "einrichtung");
  steps.hidden = !inEinrichtung;
  layout.classList.toggle("ohne-leiste", !inEinrichtung);
  if (inEinrichtung) renderSteps();

  if (ansicht === "anmeldung")        v.appendChild(anmeldung());
  else if (ansicht === "start")       v.appendChild(startseite());
  else if (ansicht === "planen")      v.appendChild(planenAnsicht());
  else if (ansicht === "archiv")      v.appendChild(archivAnsicht());
  else if (ansicht === "sicherung")   v.appendChild(sicherungsAnsicht());
  else if (ansicht === "termine")     v.appendChild(termineAnsicht());
  else if (ansicht === "ereignisse")  v.appendChild(ereignisAnsicht());
  else if (ansicht === "aendern")     v.appendChild(aendernAnsicht());
  else                                v.appendChild(SCHRITT_FN()[schritt]());

  // Jede Unterseite hat oben denselben Weg zurück
  const erstes = v.querySelector(".panel");
  if (erstes && ["bereich", "archiv", "sicherung", "termine", "planen"].includes(ansicht) && !erstes.querySelector(".zurueck-link")){
    const z = el(`<button class="zurueck-link" type="button">${symbol("zurueck")}<span>${zurueckNach === "planen" ? "Plan erstellen" : "Startseite"}</span></button>`);
    z.onclick = () => { ansicht = (ansicht === "bereich" && zurueckNach) || "start"; zurueckNach = null; render(); };
    erstes.insertBefore(z, erstes.firstChild);
  }

  // Was in diesem Bereich zu tun oder neu ist, steht oben
  const ziel = ansicht === "bereich" ? (schritt === PRUEFEN_SCHRITT ? "analyse" : (BEREICHE.find(b => b.schritt === schritt) || {}).id)
             : ["ereignisse", "termine", "sicherung"].includes(ansicht) ? ansicht : null;
  const kasten = ziel && markierungsKasten(ziel);
  if (kasten){ const panel = v.querySelector(".panel"); if (panel) panel.insertBefore(kasten, panel.firstChild.nextSibling); }

  pruefePlatz();
  window.scrollTo({top:0, behavior:"instant"});
}

// Fußzeile der Schritte — in der Einrichtung mit Überspringen, sonst mit Fertig
function navLeiste(idx){
  const a = el(`<div class="actions"></div>`);
  if (ansicht === "bereich"){
    // Wer aus der Prüfung vor dem Planen hierher kam, landet wieder dort
    const zurueck = () => { ansicht = zurueckNach || "start"; zurueckNach = null; render(); };
    const f = el(`<button class="btn">${zurueckNach === "planen" ? "Fertig, zurück zum Plan" : "Fertig"}</button>`);
    f.onclick = async () => { await speichere(); zurueck(); };
    const ab = el(`<button class="btn ghost">Abbrechen</button>`);
    ab.onclick = zurueck;
    a.appendChild(ab); a.appendChild(el(`<div class="spacer"></div>`)); a.appendChild(f);
    return a;
  }
  if (idx > 0){
    const z = el(`<button class="btn ghost">Zurück</button>`);
    z.onclick = () => { schritt = idx - 1; fehler = ""; render(); };
    a.appendChild(z);
  }
  a.appendChild(el(`<div class="spacer"></div>`));
  const letzter = idx >= SCHRITTE.length - 1;
  if (!letzter){
    const u = el(`<button class="btn ghost">Überspringen</button>`);
    u.onclick = () => weiterZu(idx + 1);
    a.appendChild(u);
  }
  const w = el(`<button class="btn">${letzter ? "Einrichtung abschließen" : "Weiter"}</button>`);
  w.onclick = async () => {
    if (letzter){
      state.eingerichtet = true;
      await speichere();
      ansicht = "start"; fehler = ""; render();
    } else weiterZu(idx + 1);
  };
  a.appendChild(w);
  return a;
}

function nav(zurueck, weiter, label){ return navLeiste(schritt); }

function weiterZu(i){ maxSchritt = Math.max(maxSchritt, i); schritt = i; fehler = ""; sichern(); render(); }

let zurueckNach = null;   // Ansicht, in die „Fertig“ zurückführt (sonst die Startseite)

function oeffneBereich(id, zurueck){
  const b = BEREICHE.find(x => x.id === id);
  if (!b) return;
  zurueckNach = zurueck || null;
  gesehenMerken(id);
  ansicht = "bereich"; schritt = b.schritt; bearbeite = -1; fehler = "";
  render();
}

/* --------- Anmeldung --------- */
function anmeldung(){
  const p = el(`<div class="panel">
    <div class="head">
      <h1>Filialplaner</h1>
      <p class="lede">Mit Filialnummer und Kennwort anmelden — oder einen neuen

      <button class="btn" id="anmelden">Anmelden</button>

      <button class="btn ghost small" id="verwalten">Gespeicherte Filialen</button>

  const nrF = p.querySelector("#nr"), pwF = p.querySelector("#pw"), pw2F = p.querySelector("#pw2");
  const fehlerZeigen = txt => { fehler = txt; p.querySelector("#err").textContent = txt; };

  const umschalten = (neuerModus) => {
    modus = neuerModus;
    p.querySelector("#wrapPw2").hidden = (modus !== "neu");
    p.querySelector("#anmelden").className = modus === "anmelden" ? "btn" : "btn ghost";
    p.querySelector("#neu").className      = modus === "neu"      ? "btn" : "btn ghost";
    fehlerZeigen("");
  };

  const oeffnen = (daten) => {
    state = Object.assign(leer(), daten);
    archivAufraeumen();
    merkeZugang(state.nr, state.ort, state.pw);
    if (state.eingerichtet){ ansicht = "start"; }
    else { ansicht = "einrichtung"; schritt = 0; maxSchritt = 0; }
    fehler = ""; render();
  };

  p.querySelector("#anmelden").onclick = async () => {
    if (modus !== "anmelden"){ umschalten("anmelden"); return; }
    const nr = nrF.value.replace(/\D/g, ""), pw = pwF.value;
    if (!nr) return fehlerZeigen("Bitte eine Filialnummer eintragen.");
    if (!pw) return fehlerZeigen("Bitte das Kennwort eintragen.");
    const vorhanden = await ladeFiliale(nr);
    if (!vorhanden) return fehlerZeigen(`Für N ${nr} gibt es noch keinen Bereich. Lege ihn mit „Neuen Bereich anlegen“ an.`);
    if (vorhanden.pw !== await hash(nr + ":" + pw)) return fehlerZeigen("Das Kennwort stimmt nicht.");
    oeffnen(vorhanden);
  };

  p.querySelector("#neu").onclick = async () => {
    if (modus !== "neu"){ umschalten("neu"); return; }
    const nr = nrF.value.replace(/\D/g, ""), pw = pwF.value, pw2 = pw2F.value;
    if (!nr) return fehlerZeigen("Bitte eine Filialnummer eintragen.");
    if (pw.length < 4) return fehlerZeigen("Das Kennwort braucht mindestens 4 Zeichen.");
    if (pw !== pw2) return fehlerZeigen("Die beiden Kennwörter stimmen nicht überein.");
    const vorhanden = await ladeFiliale(nr);
    if (vorhanden) return fehlerZeigen(`N ${nr} ist bereits angelegt. Melde dich mit dem Kennwort an oder lösche den Bereich unter „Gespeicherte Filialen“.`);
    const frisch = leer();
    frisch.nr = nr; frisch.pw = await hash(nr + ":" + pw);
    state = frisch; await speichere();
    oeffnen(frisch);
  };

  // Verwaltung: nur auf Wunsch, und ohne Öffnen-Abkürzung
  const box = p.querySelector("#liste");
  let offen = false;
  p.querySelector("#verwalten").onclick = async () => {
    offen = !offen;
    box.innerHTML = "";
    if (!offen) return;
    const liste = inApp ? await bekannteFilialen() : lokaleFilialen();
    if (!liste.length){
      box.appendChild(el(`<p class="empty">Keine gespeicherten Filialen.</p>`));
      return;
    }
    box.appendChild(el(`<h3 style="margin-top:18px">Gespeicherte Filialen</h3>
      <p class="hint" style="margin-bottom:8px">Zum Öffnen oben anmelden. Löschen entfernt alle Daten dieser Filiale.</p>`));

    const tb = tab.querySelector("tbody");
    liste.forEach(f => {
      const tr = el(`<tr><td><b>N ${esc(f.nr)}</b>${f.ort ? " · " + esc(f.ort) : ""}</td>
        <td class="n"><button class="btn ghost small">löschen</button></td></tr>`);
      tr.querySelector("button").onclick = async () => {
        if (!confirm(`Filiale N ${f.nr} mit allen Daten löschen? Das lässt sich nicht rückgängig machen.`)) return;
        if (TESTMODUS){ alert("In der Testfassung lassen sich keine Filialen löschen."); return; }
        await loescheFiliale(f.nr);
        tr.remove();
        if (!tb.children.length) box.innerHTML = `<p class="empty">Keine gespeicherten Filialen.</p>`;
      };
      tb.appendChild(tr);
    });
    box.appendChild(tab);
    // Gesichert wird von selbst — die Knöpfe zum Speichern und Einlesen einer
    // Sicherungsdatei stehen nur noch in der Kachel „Sicherung" auf der Startseite
    box.appendChild(el(`<div class="note ok" style="margin-top:14px"><span class="ic">✓</span>
      <span>${inApp
        ? "Deine Filialen werden automatisch gesichert — bei jeder Änderung auf dem Gerät und in iCloud, dazu jeden Tag eine Kopie, die vier Monate aufgehoben wird."
        : "Im Browser liegen die Daten nur in diesem Browser. In der Kachel „Sicherung“ lässt sich eine Sicherungsdatei anlegen."}</span></div>`));
  };

  umschalten("anmelden");
  return p;
}

function zeigeFehler(p, t){ fehler = t; const f = p.querySelector("#err"); if (f) f.textContent = t; }

// Filialen aus dem Browser-Speicher (außerhalb der App)
function lokaleFilialen(){
  const nach = new Map();
  const merke = (nr, ort) => {
    const id = key(nr);
    if (!id || id === "n") return;
    const alt = nach.get(id);
    nach.set(id, {nr: String(nr), ort: ort || (alt ? alt.ort : "")});
  };
  try {
    for (let i = 0; i < localStorage.length; i++){
      const s = localStorage.key(i);
      // nur die Filialbereiche selbst — nicht die Merkzettel
      if (!s || !new RegExp("^" + LS + "n\\d+$").test(s)) continue;
      try {
        const d = JSON.parse(localStorage.getItem(s));
        merke(d.nr || s.slice(LS.length + 1), d.ort);
      } catch(e){}
    }
  } catch(e){}
  bekannteLesen().forEach(x => merke(x.nr, x.ort));
  return [...nach.values()].sort((a,b) => String(a.nr).localeCompare(String(b.nr)));
}

/* --------- Sicherung --------- */
// In der App übernimmt das die Brücke (Teilen- bzw. Sichern-Dialog, Dateiauswahl).
// Im Browser wird dieselbe Datei als Download angeboten und über ein Dateifeld gelesen.
function sicherungsKnoepfe(){
  const k = el(`<div style="margin-top:16px;display:flex;gap:9px;flex-wrap:wrap;align-items:center">
    <button class="btn ghost small" id="sichAus">Sicherungsdatei anlegen</button>
    <button class="btn ghost small" id="sichEin">Sicherungsdatei einlesen</button>
    <span class="hint" id="sichHinweis"></span>
  </div>`);
  const sagen = t => k.querySelector("#sichHinweis").textContent = t;

  k.querySelector("#sichAus").onclick = async () => {
    if (inApp){ await appRuf("sicherungSpeichern", {}); return; }
    const paket = {art:"filialplaner-sicherung", erstellt:new Date().toISOString(), filialen:{}};
    lokaleFilialen().forEach(f => {
      const roh = localStorage.getItem(LS + key(f.nr));
      if (roh){ try { paket.filialen[key(f.nr)] = JSON.parse(roh); } catch(e){} }
    });
    const name = "Filialplaner-Sicherung-" + new Date().toISOString().slice(0,10) + ".json";
    anbieten(new Blob([JSON.stringify(paket, null, 2)], {type:"application/json"}), name);
    sagen(Object.keys(paket.filialen).length + " Filialen gespeichert.");
  };

  k.querySelector("#sichEin").onclick = async () => {
    if (inApp){
      const zahl = await appRuf("sicherungEinlesen", {});
      if (zahl > 0){ sagen(zahl + " Filialen eingelesen."); k.closest("#liste").innerHTML = ""; render(); }
      else if (zahl === 0) sagen("Nichts übernommen — die Sicherung war nicht neuer.");
      return;
    }
    const feld = el(`<input type="file" accept="application/json,.json" hidden>`);
    document.body.appendChild(feld);
    feld.onchange = async () => {
      const datei = feld.files && feld.files[0];
      feld.remove();
      if (!datei) return;
      try {
        const paket = JSON.parse(await datei.text());
        if (paket.art !== "filialplaner-sicherung") return sagen("Das ist keine Filialplaner-Sicherung.");
        let n = 0;
        for (const [id, inhalt] of Object.entries(paket.filialen || {})){
          const da = localStorage.getItem(LS + id);
          const neuer = !da || (inhalt.geaendert || "") > (JSON.parse(da).geaendert || "");
          if (!neuer) continue;
          localStorage.setItem(LS + id, JSON.stringify(inhalt));
          merkeZugang(inhalt.nr || id.slice(1), inhalt.ort || "", inhalt.pw || "");
          n++;
        }
        sagen(n ? n + " Filialen eingelesen." : "Nichts übernommen — die Sicherung war nicht neuer.");
        if (n) render();
      } catch(e){ sagen("Die Datei ließ sich nicht lesen."); }
    };
    feld.click();
  };
  return k;
}

        <p class="sub" style="margin-top:6px" id="landInfo"></p></div>

  // Feiertage dieses Jahres und die Ladenöffnung des Landes zeigen — und warnen, wenn

  const pflichtZeigen = () => ["#von", "#bis"].forEach(s => {
    const f = p.querySelector(s);
    f.classList.toggle("fehlt", !hatZeit(f.value) || (s === "#bis" && hatZeit(state.von) && f.value <= state.von));
  });
  const landInfo = () => {
    const j = new Date().getFullYear();
    const anzahl = Object.keys(feiertageIm(j, state.land)).length;
    const lo = LADENOEFFNUNG[state.land];
    const zuLang = lo && ((hatZeit(state.von) && state.von < lo[0]) || (hatZeit(state.bis) && state.bis > lo[1]));
    p.querySelector("#landInfo").innerHTML = `${anzahl} Feiertage ${j}, jedes Jahr neu berechnet. `

  landInfo(); pflichtZeigen();
  p.addEventListener("input", () => { speichereFelder(); landInfo(); pflichtZeigen(); sichern(); });
  p.querySelector("#land").addEventListener("change", () => { speichereFelder(); landInfo(); sichern(); });
  p.appendChild(navLeiste(0));

// Kurz, was an einem Tag eingestellt ist — steht unter dem Tag im Reiter
function tagesKurzinfo(z){
  if (!z) return "";
  if (z.zeitArt === "fest") return hatZeit(z.zeit) ? z.zeit : "";
  if (z.zeitArt === "spanne") return hatZeit(z.fBis) ? "bis " + z.fBis : hatZeit(z.fVon) ? "ab " + z.fVon : "";
  return "frei";
}

function aufgabenKarte(w, p){
  const a = state.aufgaben[w.id];
  const best = w.gruppe === "bestellung";
  let offenerTag = null;      // welcher Tag aufgeklappt ist, wenn je Tag verschieden
  const t = el(`<div class="task">
    <div class="task-top"><h3>${esc(w.anzeige || w.name)}${a.neu ? ' <span class="tag neu">neu</span>' : ""}</h3>
      <label class="switch schalter"><input type="checkbox" data-aktiv ${a.aktiv ? "checked" : ""}>
        <span data-aktivtext>${a.aktiv ? "aktiv" : "abgeschaltet"}</span></label></div>
    <div class="body">
      <div class="days" role="group" aria-label="Wochentage ${esc(w.anzeige || w.name)}"></div>
      <label class="switch jetag"><input type="checkbox" data-jetag ${a.jeTag ? "checked" : ""}>
        an den Tagen unterschiedlich</label>
      <div data-felder></div>
      <div class="pstd">= <b>?</b> Pers.-Std/Woche</div>
    </div></div>`);
  const daysBox = t.querySelector(".days");
  const felderBox = t.querySelector("[data-felder]");
  const out = t.querySelector(".pstd b");

  // Ein Tag bekommt beim ersten Mal die allgemeinen Werte als Ausgangspunkt
  const tagAnlegen = k => {
    if (!a.proTag[k]) a.proTag[k] = {zeitArt:a.zeitArt, zeit:a.zeit, fVon:a.fVon, fBis:a.fBis,
                                      dauer:a.dauer, personen:a.personen};
  };

  // Nur Werte übernehmen und Summen nachziehen — nichts neu aufbauen, sonst
  // verliert das Feld, in dem gerade getippt wird, den Fokus
  const frisch = () => {
    if (a.neu && (a.tage.length || a.zeit || a.dauer || !a.aktiv)) delete a.neu;
    const tage = a.tage.map(k => aufgabeAm(a, k));
    const bekannt = a.aktiv && tage.length && tage.every(x => hat(x.dauer) && hat(x.personen));
    out.textContent = bekannt ? h1(tage.reduce((s,x) => s + nz(x.dauer) * nz(x.personen), 0)) : "?";
    t.classList.toggle("off", !a.aktiv);
    t.querySelector("[data-aktivtext]").textContent = a.aktiv ? "aktiv" : "abgeschaltet";
    t.querySelector(".body").style.display = a.aktiv ? "" : "none";
    felderBox.querySelectorAll("[data-info]").forEach(s => s.textContent = tagesKurzinfo(a.proTag[s.dataset.info]));
    p.querySelector("#sumP").textContent = h1(auswertung().aufgaben);
    sichern();
  };

  // Die Felder für z — die allgemeinen Werte der Aufgabe oder die eines Tages
  const felder = z => {
    const box = el(`<div class="task-fields">
      <label class="f">Zeit<select data-art>${ZEITARTEN.map(([v,l]) =>
        `<option value="${v}"${z.zeitArt === v ? " selected" : ""}>${l}</option>`).join("")}</select></label>
      <div class="zeitfelder" data-zeit></div>
      <label class="f">Dauer (h)<input type="number" data-dauer min="0" step="0.25" placeholder="?" value="${esc(z.dauer)}"></label>
      <label class="f">Personen<input type="number" data-pers min="1" step="1" placeholder="?" value="${esc(z.personen)}"></label>
    </div>`);
    const zeitBox = box.querySelector("[data-zeit]");
    const zeiten = () => {
      zeitBox.innerHTML = "";
      if (z.zeitArt === "fest"){
        const l = el(`<label class="f">Uhrzeit<input type="time" value="${esc(z.zeit)}"></label>`);
        l.querySelector("input").oninput = e => { z.zeit = e.target.value; frisch(); };
        zeitBox.appendChild(l);
      } else if (z.zeitArt === "spanne"){
        const l1 = el(`<label class="f">frühestens<input type="time" value="${esc(z.fVon)}"></label>`);
        const l2 = el(`<label class="f">${best ? "Frist (spätestens)" : "spätestens"}<input type="time" value="${esc(z.fBis)}"></label>`);
        l1.querySelector("input").oninput = e => { z.fVon = e.target.value; frisch(); };
        l2.querySelector("input").oninput = e => { z.fBis = e.target.value; frisch(); };
        zeitBox.appendChild(l1); zeitBox.appendChild(l2);
      } else {
        zeitBox.appendChild(el(`<p class="hint" style="padding-bottom:9px">wird frei eingeplant</p>`));
      }
    };
    box.querySelector("[data-art]").onchange = e => { z.zeitArt = e.target.value; zeiten(); frisch(); };
    box.querySelector("[data-dauer]").oninput = e => { z.dauer = e.target.value; frisch(); };
    box.querySelector("[data-pers]").oninput  = e => { z.personen = e.target.value; frisch(); };
    zeiten();
    return box;
  };

  // Entweder eine Einstellung für alle Tage, oder ein Reiter je Tag. Angezeigt
  // wird immer nur der gewählte Tag.
  const aufbauen = () => {
    felderBox.innerHTML = "";
    if (!a.jeTag){ felderBox.appendChild(felder(a)); return; }
    const tage = TAGE.filter(([k]) => a.tage.includes(k));
    if (!tage.length){ felderBox.appendChild(el(`<p class="hint" style="margin-top:8px">Erst oben die Tage wählen.</p>`)); return; }
    if (!offenerTag || !a.tage.includes(offenerTag)) offenerTag = tage[0][0];
    const reiter = el(`<div class="tagreiter" role="tablist" aria-label="Tag wählen"></div>`);
    tage.forEach(([k,l]) => {
      tagAnlegen(k);
      const b = el(`<button class="tagreiter-b" role="tab" aria-selected="${k === offenerTag}">
        <b>${l}</b><span data-info="${k}">${esc(tagesKurzinfo(a.proTag[k]))}</span></button>`);
      b.onclick = () => { offenerTag = k; aufbauen(); };
      reiter.appendChild(b);
    });
    felderBox.appendChild(reiter);
    const fach = el(`<div class="tagfach"><span class="eyebrow">${TAGNAMEN[offenerTag]}</span></div>`);
    fach.appendChild(felder(a.proTag[offenerTag]));
    felderBox.appendChild(fach);
  };

  TAGE.forEach(([k,l]) => {
    const b = el(`<button class="day" aria-pressed="${a.tage.includes(k)}">${l}</button>`);
    b.onclick = () => {
      const i = a.tage.indexOf(k);
      if (i < 0){ a.tage.push(k); if (a.jeTag){ tagAnlegen(k); offenerTag = k; } }
      else a.tage.splice(i,1);
      b.setAttribute("aria-pressed", a.tage.includes(k));
      if (a.jeTag) aufbauen();
      frisch();
    };
    daysBox.appendChild(b);
  });
  t.querySelector("[data-aktiv]").onchange = e => { a.aktiv = e.target.checked; frisch(); };
  t.querySelector("[data-jetag]").onchange = e => {
    a.jeTag = e.target.checked;
    if (a.jeTag) a.tage.forEach(tagAnlegen);
    aufbauen(); frisch();
  };
  aufbauen();
  frisch();
  return t;
}

/* Einrichtung: Personal und Standardwoche */

/* --------- 4 Mitarbeiter --------- */
let bearbeite = -1;   // Index des Mitarbeiters im Formular, -1 = neu

function mitarbeiter(){
  const p = el(`<div class="panel">
    <div class="head"><span class="eyebrow">${stufe(3)}</span>
      <h1 style="margin-top:6px">Mitarbeiter</h1>
      <p class="lede">Bei Azubis zählen die Stunden im Betrieb, nicht der Vertrag. Die Funktionen
      bestimmen, wer welche Aufgabe übernehmen kann. Alles später über „bearbeiten“ änderbar.</p></div>
    <div id="form"></div>
    <div class="tablewrap" id="liste"></div>
  </div>`);

  const formBox = p.querySelector("#form");

  function formular(){
    const neuM = bearbeite < 0;
    const m = neuM ? {name:"", typ:TYPEN[2], vertrag:"", lehrjahr:1, betrieb:"", qual:[], ueberstunden:true}
                   : state.mitarbeiter[bearbeite];
    // Gezeigt wird der Stand zu Beginn dieser Woche — so, wie er sich aus den Plänen ergibt
    const jetzt = aktuellerMontag();
    const standJetzt = neuM ? null : ueberstundenZuBeginn(jetzt)[bearbeite];
    formBox.innerHTML = "";
    const f = el(`<div class="${neuM ? "" : "task"}" style="${neuM ? "" : "padding:16px;margin-bottom:6px"}">
      ${neuM ? "" : `<div class="task-top" style="margin-bottom:12px"><h3>${esc(m.name)} bearbeiten</h3></div>`}
      <div class="grid g3">
        <label class="f">Name<input type="text" id="mName" placeholder="Vor- und Nachname" value="${esc(m.name)}"></label>
        <label class="f">Einordnung<select id="mTyp">${TYPEN.map(x =>
          `<option${x === m.typ ? " selected" : ""}>${x}</option>`).join("")}</select></label>
        <label class="f">Alter <span class="pflicht">Pflicht</span><select id="mAlter">
          <option value="">— bitte wählen —</option>
          <option value="voll"${altersAngabe(m) === "voll" ? " selected" : ""}>18 oder älter</option>
          <option value="minder"${altersAngabe(m) === "minder" ? " selected" : ""}>unter 18</option></select>
          <span class="hint">Davon hängen Pausen, Arbeitszeiten und Ruhezeiten ab (Jugendarbeitsschutz).
          Wird jemand 18, hier umstellen.</span></label>
      </div>
      <div class="grid g3" style="margin-top:12px">
        <label class="f" id="wrapVertrag">Stunden laut Vertrag<input type="number" id="mVertrag" min="0" step="0.5" placeholder="leer lassen, wenn unklar" value="${esc(m.vertrag || "")}"></label>
        <label class="f" id="wrapLj" hidden>Lehrjahr<select id="mLj">${[1,2,3].map(j =>
          `<option value="${j}"${m.lehrjahr === j ? " selected" : ""}>${j}. Lehrjahr</option>`).join("")}</select></label>
        <label class="f" id="wrapBetrieb" hidden>Stunden im Betrieb<input type="number" id="mBetrieb" min="0" step="0.5" placeholder="leer lassen, wenn unklar" value="${esc(m.betrieb || "")}"></label>
        <label class="f">Überstunden zu Beginn KW ${kwVon(jetzt)}<input type="number" id="mSaldo" step="0.25" placeholder="0"
          value="${standJetzt === null || standJetzt === undefined ? esc(m.saldo ?? "") : standJetzt}">
          <span class="hint">+ Überstunden, − Minusstunden. Danach rechnet der Plan jede Woche selbst weiter.</span></label>
      </div>
      <div class="grid g2" style="margin-top:12px">
        <label class="switch" style="align-items:flex-start">
          <input type="checkbox" id="mUeber" ${m.ueberstunden !== false ? "checked" : ""}>
          <span>kann Überstunden machen
          <span class="hint">— aus, dann plant der Planer höchstens die Vertragsstunden ein
          (Minusstunden darf er trotzdem ausgleichen)</span></span></label>
        <label class="switch" style="align-items:flex-start">
          <input type="checkbox" id="mGeteilt" ${m.geteilt ? "checked" : ""}>
          <span>darf geteilt arbeiten
          <span class="hint">— morgens und abends am selben Tag; dann entfällt die Pause,
          weil jeder Teil für sich unter der Grenze bleibt</span></span></label>
      </div>
      <div style="margin-top:14px"><span class="eyebrow">Funktionen</span>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-top:8px" id="mQual">
          ${QUAL.map(([k,l]) => `<label class="switch"><input type="checkbox" value="${k}"${
            (m.qual || []).includes(k) ? " checked" : ""}> ${l}</label>`).join("")}
        </div></div>
      <p class="err" id="err"></p>
      <div class="actions" id="formActions"></div>
    </div>`);
    formBox.appendChild(f);

    // Urlaub und Krankheit dieser Person — hier ist der Hauptweg, sie einzutragen
    if (!neuM){
      const ab = el(`<div class="person-ereignisse"><div class="person-ereignisse-kopf">${symbol("sonne")}
        <h3>Urlaub & Krankheit von ${esc(m.name)}</h3></div><div data-liste></div></div>`);
      const zeichne = () => {
        const l = ab.querySelector("[data-liste]");
        l.innerHTML = ""; l.appendChild(ereignisListe(m.name, zeichne));
      };
      ab.appendChild(ereignisFormular(m.name, zeichne));
      zeichne();
      f.appendChild(ab);
    }

    const typ = f.querySelector("#mTyp");
    const umschalten = () => {
      const az = typ.value === "Azubi";
      f.querySelector("#wrapVertrag").hidden = az;
      f.querySelector("#wrapLj").hidden = !az;
      f.querySelector("#wrapBetrieb").hidden = !az;
    };
    typ.onchange = umschalten; umschalten();

    const altF = f.querySelector("#mAlter");
    altF.onchange = () => altF.classList.remove("fehlt");

    const lesen = () => {
      const az = typ.value === "Azubi";
      return {
        name: f.querySelector("#mName").value.trim(),
        typ: typ.value,
        volljaehrig: altF.value === "voll" ? true : altF.value === "minder" ? false : undefined,
        vertrag: az ? "" : f.querySelector("#mVertrag").value,
        lehrjahr: az ? parseInt(f.querySelector("#mLj").value,10) : null,
        betrieb: az ? f.querySelector("#mBetrieb").value : "",
        geteilt: f.querySelector("#mGeteilt").checked,
        ueberstunden: f.querySelector("#mUeber").checked,
        qual: [...f.querySelectorAll("#mQual input:checked")].map(i => i.value)
      };
    };

    const act = f.querySelector("#formActions");
    const speichern = el(`<button class="btn small">${neuM ? "Mitarbeiter hinzufügen" : "Änderungen speichern"}</button>`);
    speichern.onclick = () => {
      const d = lesen();
      if (!d.name){ f.querySelector("#err").textContent = "Bitte einen Namen eintragen."; return; }
      if (d.volljaehrig === undefined){
        altF.classList.add("fehlt");
        f.querySelector("#err").textContent = "Bitte angeben, ob die Person 18 oder älter ist — davon hängen Pausen, Arbeitszeiten und Ruhezeiten ab.";
        return;
      }
      // Den Überstundenstand nur neu setzen, wenn er geändert wurde — sonst bleibt
      // die Rechnung über die Wochen hinweg unangetastet
      const eingabe = f.querySelector("#mSaldo").value;
      const geaendert = neuM || (hat(eingabe) ? nz(eingabe) : 0) !== (standJetzt || 0);
      if (geaendert){ d.saldo = hat(eingabe) ? viertel(nz(eingabe)) : 0; d.saldoAb = wochenSchluessel(jetzt); }
      if (neuM) state.mitarbeiter.push(d);
      else {
        const alt = state.mitarbeiter[bearbeite];
        // Umbenennen: alte Pläne finden die Person über den Namen
        if (alt.name !== d.name) Object.values(state.plaene).forEach(pl => {
          if (pl.namen){ const j = pl.namen.indexOf(alt.name); if (j >= 0) pl.namen[j] = d.name; }
        });
        Object.assign(alt, d);   // Standardwoche bleibt erhalten
      }
      bearbeite = -1;
      sichern(); formular(); liste();
    };
    act.appendChild(speichern);
    if (!neuM){
      const ab = el(`<button class="btn ghost small">Abbrechen</button>`);
      ab.onclick = () => { bearbeite = -1; formular(); liste(); };
      act.appendChild(ab);
    }
  }

  function liste(){
    const box = p.querySelector("#liste");
    if (!state.mitarbeiter.length){
      box.innerHTML = `<p class="empty">Noch niemand erfasst. Mindestens eine Person wird gebraucht.</p>`;
      return;
    }
    const a = auswertung();
    const stand = ueberstundenZuBeginn(aktuellerMontag());
    box.innerHTML = `<table><thead><tr>
      <th>Name</th><th>Einordnung</th><th class="n">Stunden</th><th class="n">Leistung</th>
      <th class="n">Überstunden</th><th>Funktionen</th><th></th></tr></thead><tbody>${
      state.mitarbeiter.map((m,i) => {
        const aa = altersAngabe(m), fk = faktor(m), bek = hat(istAzubi(m) ? m.betrieb : m.vertrag);
        const ue = stand[i] || 0;
        return `<tr${i === bearbeite ? ' style="background:var(--accent-soft)"' : ""}>
          <td>${esc(m.name)}${aa === "minder" ? ` <span class="tag minor">unter 18</span>`
            : aa === null ? ` <span class="tag fehlt">Alter fehlt</span>` : ""}</td>
          <td>${esc(m.typ)}${istAzubi(m) ? ` <span class="tag azubi">${m.lehrjahr}. LJ</span>` : ""}</td>
          <td class="n">${bek ? h1(stunden(m)) : "?"}</td>

}

  const sortiert = [...state.mitarbeiter.keys()].sort((x,y) => {

    const frisch = () => {
      TAGE.forEach(([k], i) => {
        const x = schicht(m, k);
        const row = tb.children[i];
        row.children[3].textContent = x ? (x.pause ? h1(x.pause*60).replace(",0","") + " min" : "–") : "–";
        row.children[4].textContent = x ? h1(x.arbeit) : "–";
      });
      const w = wochenStunden(m);
      const soll = istAzubi(m) ? m.betrieb : m.vertrag;
      sum.textContent = w ? h1(w) + " h" + (hat(soll) ? " von " + h1(nz(soll)) + " h" : "") : "keine feste Woche";
      checks.innerHTML = "";
      const meld = pruefeStandard(m);
      meld.forEach(x => checks.appendChild(el(`<div class="note ${x.art}"><span class="ic">§</span><span>${esc(x.text)}</span></div>`)));
      if (w && hat(soll) && Math.abs(w - nz(soll)) > 0.5)
        checks.appendChild(el(`<div class="note warn"><span class="ic">!</span><span>Die Standardwoche ergibt ${h1(w)} h, der Vertrag nennt ${h1(nz(soll))} h.</span></div>`));
      if (w && !meld.length) checks.appendChild(el(`<div class="note ok"><span class="ic">✓</span><span>Diese Woche verstößt gegen keine Regel.</span></div>`));
      sichern();
    };

    TAGE.forEach(([k,l]) => {
      const s = m.standard[k] || {von:"", bis:""};
      m.standard[k] = s;
      const tr = el(`<tr><td>${l}</td>
        <td class="n"><input type="time" value="${s.von}" style="max-width:120px"></td>
        <td class="n"><input type="time" value="${s.bis}" style="max-width:120px"></td>
        <td class="n">–</td><td class="n">–</td></tr>`);
      const [vI, bI] = tr.querySelectorAll("input");
      vI.oninput = () => { s.von = vI.value; frisch(); };
      bI.oninput = () => { s.bis = bI.value; frisch(); };
      tb.appendChild(tr);
    });
    frisch();
    box.appendChild(d);
  });

  p.appendChild(navLeiste(3));
  return p;
}

      <tbody>
        <tr><td>Stunden</td>${TAGE.map(([k]) =>
          `<td><input type="number" min="0" step="0.5" data-f="stunden" data-t="${k}" value="${liste.stunden[k] ?? ""}"></td>`).join("")}
          <td class="n" id="sumH">–</td></tr>
        <tr><td>Umsatz €<span class="hint"> optional</span></td>${TAGE.map(([k]) =>
          `<td><input type="number" min="0" step="100" data-f="umsatz" data-t="${k}" value="${liste.umsatz[k] ?? ""}"></td>`).join("")}
          <td class="n" id="sumU">–</td></tr>
        <tr><td>Leistung €/h<span class="hint"> berechnet</span></td>${TAGE.map(([k]) =>
          `<td class="n" data-l="${k}">–</td>`).join("")}<td class="n" id="sumL">–</td></tr>
      </tbody></table></div>

    <h3 style="margin:22px 0 8px">Liste des Bereichsleiters einlesen</h3>

    p.querySelector("#sumH").textContent = h ? h1(h) + (tage < TAGE.length ? "*" : "") : "–";
    p.querySelector("#sumU").textContent = u ? eur(u) : "–";
    p.querySelector("#sumL").textContent = (u && h) ? eur(u/h) : "–";
    TAGE.forEach(([k]) => {
      const hh = nz(liste.stunden[k]), uu = nz(liste.umsatz[k]);
      p.querySelector(`[data-l="${k}"]`).textContent = (hh && uu) ? eur(uu/hh) : "–";
    });
    const st = p.querySelector("#status");
    st.innerHTML = "";
    const plan = state.plaene[sl];
    st.appendChild(el(`<div><span class="eyebrow">Diese Woche</span>
      <div style="font-weight:700;margin-top:4px">${h ? h1(h) + " h für " + tage + " von 6 Tagen" : "noch nichts eingetragen"}</div>
      <p class="sub" style="margin-top:4px">${plan ? "Für diese Woche gibt es bereits einen Plan." : "Für diese Woche gibt es noch keinen Plan."}</p></div>`));
    anhangZeigen();
  };

  const anhangZeigen = () => {
    const box = p.querySelector("#anhang");
    box.innerHTML = "";
    if (!liste.anhang) return;
    const z = el(`<div class="note info" style="margin-top:12px"><span class="ic">i</span>

    z.querySelector("#wegDamit").onclick = () => { delete liste.anhang; sichern(); frisch(); };
    box.appendChild(z);
  };

  p.querySelectorAll("input[data-f]").forEach(i => i.oninput = () => {
    liste[i.dataset.f][i.dataset.t] = i.value === "" ? "" : nz(i.value);
    frisch(); sichern();
  });
  p.querySelector("#kw").onchange = e => { listenWoche = e.target.value; render(); };

  // ---- Datei hereinziehen ----
  const ablage = p.querySelector("#ablage");
  const feld = p.querySelector("#datei");
  const sagen = t => p.querySelector("#lesefehler").textContent = t;
  ablage.onclick = () => feld.click();
  ablage.onkeydown = e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); feld.click(); } };
  ["dragenter","dragover"].forEach(n => ablage.addEventListener(n, e => {
    e.preventDefault(); ablage.classList.add("drueber");
  }));
  ["dragleave","drop"].forEach(n => ablage.addEventListener(n, e => {
    e.preventDefault(); ablage.classList.remove("drueber");
  }));
  ablage.addEventListener("drop", e => { if (e.dataTransfer.files[0]) lies(e.dataTransfer.files[0]); });
  feld.onchange = () => { if (feld.files[0]) lies(feld.files[0]); feld.value = ""; };

  async function lies(datei){
    sagen("");
    const name = datei.name.toLowerCase();
    try {
      if (name.endsWith(".csv")){
        uebernimm(ausCSV(await datei.text()), datei.name);
      } else if (name.endsWith(".xlsx") || name.endsWith(".xls")){
        if (!window.ExcelJS) return sagen("Die Excel-Bibliothek ist nicht geladen.");
        const wb = new ExcelJS.Workbook();
        await wb.xlsx.load(await datei.arrayBuffer());
        uebernimm(ausTabelle(wb), datei.name);
      } else {
        liste.anhang = {name: datei.name, art: datei.type || "", groesse: datei.size};
        sichern(); frisch();
        sagen("");
      }
    } catch(e){ sagen("Die Datei ließ sich nicht lesen: " + e.message); }
  }

  function uebernimm(gefunden, dateiname){
    if (!gefunden || !gefunden.stunden.some(x => x !== null))
      return sagen("In der Datei standen keine sechs Tageswerte, die sich zuordnen ließen. Bitte oben von Hand eintragen.");
    TAGE.forEach(([k], i) => {
      if (gefunden.stunden[i] !== null) liste.stunden[k] = gefunden.stunden[i];
      if (gefunden.umsatz && gefunden.umsatz[i] !== null) liste.umsatz[k] = gefunden.umsatz[i];
    });
    liste.quelle = dateiname;
    sichern();
    // Felder neu befüllen
    p.querySelectorAll("input[data-f]").forEach(i => {
      const v = liste[i.dataset.f][i.dataset.t];
      i.value = v === "" || v === undefined ? "" : v;
    });
    frisch();
    sagen("Übernommen aus " + dateiname + ".");
  }

  frisch();
  p.appendChild(navLeiste(STUNDENLISTE_SCHRITT));
  return p;
}

/* Aus einer Tabelle die sechs Tageswerte fischen: gesucht wird eine Zeile, die
   mit „Stunden" beginnt (bzw. „Umsatz"), und darin die ersten sechs Zahlen. */

function ausZeilen(zeilen){
  // Excel liefert echte Zahlen (25.5), CSV liefert Text („25,5", „1.234,5", „25.5")
  const zahl = v => {
    if (v === null || v === undefined || v === "") return null;
    if (typeof v === "number") return isFinite(v) ? v : null;
    let t = String(v).trim().replace(/\s|€|h$/gi, "");
    if (t.includes(",")) t = t.replace(/\./g, "").replace(",", ".");   // deutsch
    else if (/^\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, "");  // 12.000
    const n = parseFloat(t);
    return isFinite(n) && /^-?[\d.]+$/.test(t) ? n : null;
  };
  const text = v => v && typeof v === "object" && v.richText
    ? v.richText.map(r => r.text).join("") : String(v ?? "");
  const finde = muster => {
    for (const z of zeilen){
      // Die Beschriftung steht nicht immer in Spalte A — die erste Textzelle nehmen
      const k = z.findIndex(v => v !== null && v !== undefined && v !== "" && zahl(v) === null);
      if (k < 0 || !muster.test(text(z[k]).toLowerCase())) continue;
      const werte = z.slice(k + 1).map(zahl).filter(x => x !== null);
      if (werte.length >= 6) return werte.slice(0, 6);
      if (werte.length) return werte.concat(Array(6 - werte.length).fill(null));
    }
    return null;
  };
  const stunden = finde(/stunde|std/);
  const umsatz  = finde(/umsatz|euro|€/);
  return stunden ? {stunden, umsatz} : null;
}

function ausCSV(text){
  const trenn = (text.split("\n")[0].match(/;/g) || []).length >= (text.split("\n")[0].match(/,/g) || []).length ? ";" : ",";
  return ausZeilen(text.split(/\r?\n/).map(z => z.split(trenn)));
}

function ausTabelle(wb){
  const zeilen = [];
  wb.eachSheet(ws => ws.eachRow(r => {
    const z = [];
    r.eachCell({includeEmpty:true}, c => z.push(c.value && c.value.result !== undefined ? c.value.result : c.value));
    zeilen.push(z);
  }));
  return ausZeilen(zeilen);
}
