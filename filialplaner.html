  state.abwesend[sl][i0] = Object.assign({}, state.abwesend[sl][i0], {[TAGE[ti][0]]: grund});
  try {
    const vorhanden = [];
    gespeichert.tage.forEach((t, k) => t.schichten.forEach(s => {
      const p = planPerson(gespeichert, s.mi);
      if (p.i < 0 || (k === ti && s.mi === j0)) return;
      vorhanden.push({i: p.i, ti: k, von: s.von, bis: s.bis});
    }));
    const vorgabe = wochenVorgabe(mo, gespeichert.phase);
    const modell = wochenModell(mo, vorgabe, "plan", null, {vorhanden, nurVorhandenVor: Math.min(abTag || 0, ti), behalten: 15});
    // Die Aufgaben des gespeicherten Plans gelten weiter (sie könnten von Hand angepasst sein)
    const erg = loese(highs, modell);
    if (!erg || erg.schlupf.length) return null;
    // Neue Schichten je Tag, mit Pausen, die die Besetzung halten
    const neu = kopie(gespeichert); neu.mo = gespeichert.mo;
    const geaendert = {};
    gespeichert.tage.forEach((t, k) => {
      if (t.feiertag) return;
      const alt = t.schichten.filter(s => !(k === ti && s.mi === j0)).map(s => planPerson(gespeichert, s.mi).i + "/" + s.von + "/" + s.bis).sort();
      const jetzt = erg.gewaehlt.filter(x => x.ti === k).map(x => x.i + "/" + x.von + "/" + x.bis).sort();
      if (JSON.stringify(alt) === JSON.stringify(jetzt) && k !== ti) return;
      geaendert[k] = erg.gewaehlt.filter(x => x.ti === k);
    });
    const aenderungen = [{art: "tage", tage: {}, namen: null}];
    const zeilen = [];
    Object.entries(geaendert).forEach(([k, liste]) => {
      k = +k;
      const vorher = gespeichert.tage[k].schichten;
      neu.tage[k].schichten = [];
      liste.forEach(x => {
        const j = planPlatz(neu, x.i);
        const bestand = vorher.find(s => s.mi === j && s.von === x.von && s.bis === x.bis);
        const s = bestand ? kopie(bestand) : {mi: j, von: x.von, bis: x.bis, rollen: ["Vertretung"], mehrarbeit: false, _neu: true};
        neu.tage[k].schichten.push(s);
        if (!bestand){
          const war = vorher.find(v => v.mi === j && !(k === ti && v.mi === j0));
          zeilen.push(`${TAGE[k][1]}: ${state.mitarbeiter[x.i].name} ${hhmm(x.von)}–${hhmm(x.bis)}${war ? ` statt ${hhmm(war.von)}–${hhmm(war.bis)}` : ""}`);
        }
      });
      vorher.forEach(v => {
        const p = planPerson(gespeichert, v.mi);
        if (k === ti && v.mi === j0) return;
        if (!liste.some(x => x.i === p.i)) zeilen.push(`${TAGE[k][1]}: ${p.name} frei statt ${hhmm(v.von)}–${hhmm(v.bis)}`);
      });
      neu.tage[k].schichten.forEach(s => { if (s._neu){ delete s._neu; schichtSetzen(neu, k, s, s.von, s.bis); } });
      neu.tage[k].schichten.sort((a, b) => a.von - b.von || a.mi - b.mi);
      pausenNachbessern(neu, k);
      if (tagesMaengel(neu, k) > 0) throw new Error("Lücke");
      aenderungen[0].tage[k] = neu.tage[k].schichten;
    });
    if (!zeilen.length) return null;
    aenderungen[0].namen = neu.namen;
    const mehr = neu.tage.reduce((s, t) => s + t.schichten.reduce((a, x) => a + x.arbeit, 0), 0)
               - gespeichert.tage.reduce((s, t, k) => s + t.schichten.filter(x => !(k === ti && x.mi === j0)).reduce((a, x) => a + x.arbeit, 0), 0);
    return {titel: "Umplanen über mehrere Tage", details: zeilen.join(" · "), zeilen, mehr, aenderungen, punkte: 50, mehrtaegig: true};
  } catch(e){ return null; }
  finally { state.abwesend[sl] = abwVorher; }
}

// ==== app/20-zustand.js ====
/* Zustand der App und Einlesen alter Datenstände */

// Die Einrichtung umfasst nur diese vier Schritte. Stundenliste und Prüfen
// sind eigene Bereiche, die von der Startseite aus offenstehen.
const SCHRITTE = ["Filiale","Wochenaufgaben","Mitarbeiter","Standardwoche"];

const STUNDENLISTE_SCHRITT = 4, PRUEFEN_SCHRITT = 5;

const BEREICHE = [
  {id:"filiale",      name:"Filiale",        schritt:0},
  {id:"aufgaben",     name:"Wochenaufgaben", schritt:1},
  {id:"personal",     name:"Personal",       schritt:2},
  {id:"standardwoche",name:"Standardwoche",  schritt:3},
  {id:"stundenliste", name:"Stundenliste",   schritt:STUNDENLISTE_SCHRITT}
];

/* ---------------- Zustand ---------------- */
let state = leer();

let ansicht = "anmeldung";      // anmeldung | einrichtung | bereich | start | planen | archiv

let schritt = 0, maxSchritt = 0, fehler = "";

let planWoche = null;     // Montag (ISO) der Woche, für die geplant wird

let zeigeWoche = null;    // Montag (ISO) der Woche, die die Startseite zeigt

let listenWoche = null;   // Montag (ISO) der Woche in der Stundenliste

function neueAufgabe(w){
  // Bestellungen haben eine Frist und macht eine Person — das ist der Normalfall
  const best = w.gruppe === "bestellung";
  return {aktiv:true, tage:[], zeitArt: best ? "spanne" : "fest", zeit:"",
          fVon:"", fBis:"", dauer:"", personen: best ? "1" : "",
          jeTag:false, proTag:{}};
}

function leer(){
  const a = {};
  WAREN.forEach(w => a[w.id] = neueAufgabe(w));
  return {nr:"", ort:"", land:"BW", von:"08:00", bis:"21:00", wechsel:"", allein:false, aufgaben:a, mitarbeiter:[],
          budget:{stunden:{}, umsatz:{}}, eingerichtet:false, plaene:{}, abwesend:{},
          listen:{}, phasen:{}};
}

function normalisiere(s){
  if (!s.plaene) s.plaene = {};
  if (!s.abwesend) s.abwesend = {};
  if (!s.listen) s.listen = {};
  if (!s.phasen) s.phasen = {};
  if (!s.land) s.land = "BW";        // bis 12.11.2026 gab es nur Baden-Württemberg
  // Vor dem 10.11.2026 gab es nur eine Stundenliste ohne Woche — sie wird zur
  // Liste der laufenden Woche, statt unsichtbar liegen zu bleiben
  if (s.budget && s.budget.stunden && Object.values(s.budget.stunden).some(v => hat(v))
      && !Object.keys(s.listen).length){
    s.listen[wochenSchluessel(aktuellerMontag())] = JSON.parse(JSON.stringify(s.budget));
  }
  if (s.archivGewarnt === true) s.archivGewarnt = {};   // früher ein einziger Schalter
  // Filialen von vor dem RR-Schein kennen die neue Aufgabe noch nicht
  if (s.aufgaben) WAREN.forEach(w => {
    if (!s.aufgaben[w.id]) s.aufgaben[w.id] = Object.assign(neueAufgabe(w), {neu:true});
  });
  // Bis 12.11.2026 kam der RR-Schein in bestehende Filialen ausgeschaltet und blass
  // hinein — leicht zu übersehen. Unberührt? Dann einschalten und als neu zeigen.
  const rr = s.aufgaben && s.aufgaben.rr;
  if (rr && !s.rrSichtbar){
    if (!rr.aktiv && !rr.tage.length && !rr.zeit && !rr.dauer){ rr.aktiv = true; rr.neu = true; }
    s.rrSichtbar = true;
  }
  if (s.eingerichtet === undefined) s.eingerichtet = !!(s.mitarbeiter && s.mitarbeiter.length);
  WAREN.forEach(w => {
    const a = s.aufgaben && s.aufgaben[w.id];
    if (!a) return;
    if (!a.zeitArt) a.zeitArt = hatZeit(a.zeit) ? "fest" : "egal";
    if (a.fVon === undefined) a.fVon = "";
    if (a.fBis === undefined) a.fBis = "";
    if (a.jeTag === undefined) a.jeTag = false;
    // Bis 12.11.2026 gab es je Tag nur eine eigene Uhrzeit (zeiten); jetzt hat
    // jeder Tag alle Einstellungen. Die alten Uhrzeiten wandern dorthin.
    if (!a.proTag){
      a.proTag = {};
      if (a.jeTag) a.tage.forEach(k => {
        a.proTag[k] = {zeitArt:a.zeitArt, zeit:(a.zeiten || {})[k] || a.zeit, fVon:a.fVon, fBis:a.fBis,
                       dauer:a.dauer, personen:a.personen};
      });
    }
    delete a.zeiten;
  });
  // Überstunden: bis 12.11.2026 wurden Wochen von Hand „ins Stundenkonto gebucht“.
  // Jetzt laufen sie von selbst weiter — gezählt ab der Woche saldoAb. Was schon
  // gebucht ist, steckt im Kontostand; ab der Woche danach zählt es von selbst.
  const plaene = s.plaene || {};
  const gebuchtBis = Object.keys(plaene).filter(sl => plaene[sl].gebucht).sort().pop();
  (s.mitarbeiter || []).forEach(m => {
    if (m.geteilt === undefined) m.geteilt = false;
    if (m.ueberstunden === undefined) m.ueberstunden = true;
    if (!m.saldoAb) m.saldoAb = gebuchtBis ? folgeSchluessel(gebuchtBis) : wochenSchluessel(aktuellerMontag());
    delete m.pauseMin;          // Pausen richten sich jetzt nach dem Gesetz
  });
  Object.values(plaene).forEach(p => {
    delete p.gebucht;

async function ladeFiliale(nr){

    try { return normalisiere(typeof roh === "string" ? JSON.parse(roh) : roh); } catch(e){ return null; }
  }

async function speichere(){
  if (!state.nr) return;
  // Ändert sich das Personal, erfährt es der Server — sonst könnte sich jemand Neues
  // nicht anmelden, und wer gegangen ist, weiterhin abgeben
  if (ONLINE_BEREIT && state.online){
    onlinePersonal().catch(() => {});
    meinPlanAbgleichen();          // Bundesland und — wenn eingeschaltet — die Pläne
  }
  const id = key(state.nr);

  body.geaendert = new Date().toISOString();
  if (inApp){
    await appRuf("sichern", {id, json: JSON.stringify(body)});
    await appRuf("zuletzt", {setzen: state.nr});
    return;
  }
  if (db){
    try { await db.doc("filialen/" + id).set(body); return; } catch(e){ /* lokal weiter */ }
  }
  try { localStorage.setItem(LS + id, JSON.stringify(body)); } catch(e){}
}

async function loescheFiliale(nr){
  const id = key(nr);
  if (inApp){ await appRuf("loeschen", {id}); }
  if (db){ try { await db.doc("filialen/" + id).delete(); } catch(e){} }
  try { localStorage.removeItem(LS + id); } catch(e){}
  bekannteSchreiben(bekannteLesen().filter(x => key(x.nr) !== id));
  const l = letzterZugang();
  if (l && key(l.nr) === id){ try { localStorage.removeItem(LETZTE); } catch(e){} }
}

async function hash(text){
  try {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,"0")).join("");
  } catch(e){
    // Ohne Web-Crypto (sehr alte Umgebungen): einfacher Streuwert, damit wenigstens
    // nicht jedes gleich lange Kennwort passt
    let h = 0x811c9dc5;
    for (const z of text){ h ^= z.codePointAt(0); h = Math.imul(h, 0x01000193) >>> 0; }
    return "x" + h.toString(16);
  }
}

/* „Mein Plan“: Die Schichten der laufenden und der nächsten Woche auf den Server, damit
   jeder Mitarbeiter auf der Seite „Meine Zeiten“ seine eigenen sieht. Nur, wenn die
   Filialleitung es eingeschaltet hat. Geschickt wird nur, was sich geändert hat. */
function meinPlanDaten(sl){
  const kurz = state.plaene[sl];
  if (!kurz) return null;
  const daten = {};
  state.mitarbeiter.forEach((m, i) => {
    const j = planIndex(kurz, m, i);
    daten[m.name] = j < 0 ? [] : kurz.tage.flatMap(t => t.feiertag ? [] : t.schichten.filter(s => s.mi === j)
      .sort((a, b) => a.von - b.von)
      .map(s => Object.assign({tag: t.key, von: hhmm(s.von), bis: hhmm(s.bis)},
        s.pauseVon !== null && s.pauseVon !== undefined ? {pVon: hhmm(s.pauseVon), pBis: hhmm(s.pauseBis)} : {})));
  });
  return daten;
}
let _abgleichLaeuft = false;
async function meinPlanAbgleichen(){
  if (!ONLINE_BEREIT || !state.online || _abgleichLaeuft) return;
  _abgleichLaeuft = true;
  try {
    const o = state.online;
    if (o.land !== state.land){
      await abgabeRuf("termine_land", {p_nr: state.nr, p_schluessel: o.schluessel, p_land: state.land});
      o.land = state.land;
    }
    if (!o.meinPlan) return;
    o.planStand = o.planStand || {};
    const mo = aktuellerMontag();
    for (const d of [0, 7]){
      const m = new Date(mo); m.setDate(mo.getDate() + d);
      const sl = wochenSchluessel(m);
      const daten = meinPlanDaten(sl);
      if (!daten) continue;
      const stand = JSON.stringify(daten);
      if (o.planStand[sl] === stand) continue;
      await abgabeRuf("termine_plan_setzen", {p_nr: state.nr, p_schluessel: o.schluessel, p_woche: sl, p_plan: daten});
      o.planStand[sl] = stand;
    }
    delete o.serverFehler;
  } catch(e){
    // Fehlt die Erweiterung auf dem Server, deutlich sagen — sonst still weiter
    state.online.serverFehler = /schema cache|Could not find the function/i.test(e.message)
      ? "Auf dem Server fehlt noch die Erweiterung „plan.sql“ — einmal im SQL-Editor von Supabase ausführen."
      : e.message;
  } finally { _abgleichLaeuft = false; }
}
async function meinPlanSchalten(an){
  state.online.meinPlan = an;
  state.online.planStand = {};
  if (an) await meinPlanAbgleichen();
  else await abgabeRuf("termine_plan_loeschen", {p_nr: state.nr, p_schluessel: state.online.schluessel});
  await speichere();
}

      <span>${inApp
        ? "Deine Filialen werden automatisch gesichert — bei jeder Änderung auf dem Gerät und in iCloud, dazu jeden Tag eine Kopie, die vier Monate aufgehoben wird."
        : "Im Browser liegen die Daten nur in diesem Browser. In der Kachel „Sicherung“ lässt sich eine Sicherungsdatei anlegen."}</span></div>`));
  };

  umschalten("anmelden");
  return p;
}

function zeigeFehler(p, t){ fehler = t; const f = p.querySelector("#err"); if (f) f.textContent = t; }

// Filialen aus dem Browser-Speicher (außerhalb der App)
function lokaleFilialen(){
  const nach = new Map();
  const merke = (nr, ort) => {
    const id = key(nr);
    if (!id || id === "n") return;
    const alt = nach.get(id);
    nach.set(id, {nr: String(nr), ort: ort || (alt ? alt.ort : "")});
  };
  try {
    for (let i = 0; i < localStorage.length; i++){
      const s = localStorage.key(i);
      // nur die Filialbereiche selbst — nicht die Merkzettel
      if (!s || !new RegExp("^" + LS + "n\\d+$").test(s)) continue;
      try {
        const d = JSON.parse(localStorage.getItem(s));
        merke(d.nr || s.slice(LS.length + 1), d.ort);
      } catch(e){}
    }
  } catch(e){}
  bekannteLesen().forEach(x => merke(x.nr, x.ort));
  return [...nach.values()].sort((a,b) => String(a.nr).localeCompare(String(b.nr)));
}

/* --------- Sicherung --------- */
// In der App übernimmt das die Brücke (Teilen- bzw. Sichern-Dialog, Dateiauswahl).
// Im Browser wird dieselbe Datei als Download angeboten und über ein Dateifeld gelesen.
function sicherungsKnoepfe(){
  const k = el(`<div style="margin-top:16px;display:flex;gap:9px;flex-wrap:wrap;align-items:center">
    <button class="btn ghost small" id="sichAus">Sicherungsdatei anlegen</button>
    <button class="btn ghost small" id="sichEin">Sicherungsdatei einlesen</button>
    <span class="hint" id="sichHinweis"></span>
  </div>`);
  const sagen = t => k.querySelector("#sichHinweis").textContent = t;

  k.querySelector("#sichAus").onclick = async () => {
    if (inApp){ await appRuf("sicherungSpeichern", {}); return; }
    const paket = {art:"filialplaner-sicherung", erstellt:new Date().toISOString(), filialen:{}};
    lokaleFilialen().forEach(f => {
      const roh = localStorage.getItem(LS + key(f.nr));
      if (roh){ try { paket.filialen[key(f.nr)] = JSON.parse(roh); } catch(e){} }
    });
    const name = "Filialplaner-Sicherung-" + new Date().toISOString().slice(0,10) + ".json";
    anbieten(new Blob([JSON.stringify(paket, null, 2)], {type:"application/json"}), name);
    sagen(Object.keys(paket.filialen).length + " Filialen gespeichert.");
  };

  k.querySelector("#sichEin").onclick = async () => {
    if (inApp){
      const zahl = await appRuf("sicherungEinlesen", {});
      if (zahl > 0){ sagen(zahl + " Filialen eingelesen."); k.closest("#liste").innerHTML = ""; render(); }
      else if (zahl === 0) sagen("Nichts übernommen — die Sicherung war nicht neuer.");
      return;
    }
    const feld = el(`<input type="file" accept="application/json,.json" hidden>`);
    document.body.appendChild(feld);
    feld.onchange = async () => {
      const datei = feld.files && feld.files[0];
      feld.remove();
      if (!datei) return;
      try {
        const paket = JSON.parse(await datei.text());
        if (paket.art !== "filialplaner-sicherung") return sagen("Das ist keine Filialplaner-Sicherung.");
        let n = 0;
        for (const [id, inhalt] of Object.entries(paket.filialen || {})){
          const da = localStorage.getItem(LS + id);
          const neuer = !da || (inhalt.geaendert || "") > (JSON.parse(da).geaendert || "");
          if (!neuer) continue;
          localStorage.setItem(LS + id, JSON.stringify(inhalt));
          merkeZugang(inhalt.nr || id.slice(1), inhalt.ort || "", inhalt.pw || "");
          n++;
        }
        sagen(n ? n + " Filialen eingelesen." : "Nichts übernommen — die Sicherung war nicht neuer.");
        if (n) render();
      } catch(e){ sagen("Die Datei ließ sich nicht lesen."); }
    };
    feld.click();
  };
  return k;
}

// Kurz, was an einem Tag eingestellt ist — steht unter dem Tag im Reiter
function tagesKurzinfo(z){
  if (!z) return "";
  if (z.zeitArt === "fest") return hatZeit(z.zeit) ? z.zeit : "";
  if (z.zeitArt === "spanne") return hatZeit(z.fBis) ? "bis " + z.fBis : hatZeit(z.fVon) ? "ab " + z.fVon : "";
  return "frei";
}

function aufgabenKarte(w, p){
  const a = state.aufgaben[w.id];
  const best = w.gruppe === "bestellung";
  let offenerTag = null;      // welcher Tag aufgeklappt ist, wenn je Tag verschieden
  const t = el(`<div class="task${a.aktiv ? "" : " off"}">
    <div class="task-top"><h3>${esc(w.anzeige || w.name)}${a.neu ? ' <span class="tag neu">neu</span>' : ""}</h3>
      <label class="switch"><input type="checkbox" data-aktiv ${a.aktiv ? "checked" : ""}> gibt es hier</label></div>
    <div class="body">
      <div class="days" role="group" aria-label="Wochentage ${esc(w.anzeige || w.name)}"></div>
      <label class="switch jetag"><input type="checkbox" data-jetag ${a.jeTag ? "checked" : ""}>
        an den Tagen unterschiedlich</label>
      <div data-felder></div>
      <div class="pstd">= <b>?</b> Pers.-Std/Woche</div>
    </div></div>`);
  const daysBox = t.querySelector(".days");
  const felderBox = t.querySelector("[data-felder]");
  const out = t.querySelector(".pstd b");

  // Ein Tag bekommt beim ersten Mal die allgemeinen Werte als Ausgangspunkt
  const tagAnlegen = k => {
    if (!a.proTag[k]) a.proTag[k] = {zeitArt:a.zeitArt, zeit:a.zeit, fVon:a.fVon, fBis:a.fBis,
                                      dauer:a.dauer, personen:a.personen};
  };

  // Nur Werte übernehmen und Summen nachziehen — nichts neu aufbauen, sonst
  // verliert das Feld, in dem gerade getippt wird, den Fokus
  const frisch = () => {
    if (a.neu && (a.tage.length || a.zeit || a.dauer || !a.aktiv)) delete a.neu;
    const tage = a.tage.map(k => aufgabeAm(a, k));
    const bekannt = a.aktiv && tage.length && tage.every(x => hat(x.dauer) && hat(x.personen));
    out.textContent = bekannt ? h1(tage.reduce((s,x) => s + nz(x.dauer) * nz(x.personen), 0)) : "?";
    t.classList.toggle("off", !a.aktiv);
    t.querySelector(".body").style.display = a.aktiv ? "" : "none";
    felderBox.querySelectorAll("[data-info]").forEach(s => s.textContent = tagesKurzinfo(a.proTag[s.dataset.info]));
    p.querySelector("#sumP").textContent = h1(auswertung().aufgaben);
    sichern();
  };

  // Die Felder für z — die allgemeinen Werte der Aufgabe oder die eines Tages
  const felder = z => {
    const box = el(`<div class="task-fields">
      <label class="f">Zeit<select data-art>${ZEITARTEN.map(([v,l]) =>
        `<option value="${v}"${z.zeitArt === v ? " selected" : ""}>${l}</option>`).join("")}</select></label>
      <div class="zeitfelder" data-zeit></div>
      <label class="f">Dauer (h)<input type="number" data-dauer min="0" step="0.25" placeholder="?" value="${esc(z.dauer)}"></label>
      <label class="f">Personen<input type="number" data-pers min="1" step="1" placeholder="?" value="${esc(z.personen)}"></label>
    </div>`);
    const zeitBox = box.querySelector("[data-zeit]");
    const zeiten = () => {
      zeitBox.innerHTML = "";
      if (z.zeitArt === "fest"){
        const l = el(`<label class="f">Uhrzeit<input type="time" value="${esc(z.zeit)}"></label>`);
        l.querySelector("input").oninput = e => { z.zeit = e.target.value; frisch(); };
        zeitBox.appendChild(l);
      } else if (z.zeitArt === "spanne"){
        const l1 = el(`<label class="f">frühestens<input type="time" value="${esc(z.fVon)}"></label>`);
        const l2 = el(`<label class="f">${best ? "Frist (spätestens)" : "spätestens"}<input type="time" value="${esc(z.fBis)}"></label>`);
        l1.querySelector("input").oninput = e => { z.fVon = e.target.value; frisch(); };
        l2.querySelector("input").oninput = e => { z.fBis = e.target.value; frisch(); };
        zeitBox.appendChild(l1); zeitBox.appendChild(l2);
      } else {
        zeitBox.appendChild(el(`<p class="hint" style="padding-bottom:9px">wird frei eingeplant</p>`));
      }
    };
    box.querySelector("[data-art]").onchange = e => { z.zeitArt = e.target.value; zeiten(); frisch(); };
    box.querySelector("[data-dauer]").oninput = e => { z.dauer = e.target.value; frisch(); };
    box.querySelector("[data-pers]").oninput  = e => { z.personen = e.target.value; frisch(); };
    zeiten();
    return box;
  };

  // Entweder eine Einstellung für alle Tage, oder ein Reiter je Tag. Angezeigt
  // wird immer nur der gewählte Tag.
  const aufbauen = () => {
    felderBox.innerHTML = "";
    if (!a.jeTag){ felderBox.appendChild(felder(a)); return; }
    const tage = TAGE.filter(([k]) => a.tage.includes(k));
    if (!tage.length){ felderBox.appendChild(el(`<p class="hint" style="margin-top:8px">Erst oben die Tage wählen.</p>`)); return; }
    if (!offenerTag || !a.tage.includes(offenerTag)) offenerTag = tage[0][0];
    const reiter = el(`<div class="tagreiter" role="tablist" aria-label="Tag wählen"></div>`);
    tage.forEach(([k,l]) => {
      tagAnlegen(k);
      const b = el(`<button class="tagreiter-b" role="tab" aria-selected="${k === offenerTag}">
        <b>${l}</b><span data-info="${k}">${esc(tagesKurzinfo(a.proTag[k]))}</span></button>`);
      b.onclick = () => { offenerTag = k; aufbauen(); };
      reiter.appendChild(b);
    });
    felderBox.appendChild(reiter);
    const fach = el(`<div class="tagfach"><span class="eyebrow">${TAGNAMEN[offenerTag]}</span></div>`);
    fach.appendChild(felder(a.proTag[offenerTag]));
    felderBox.appendChild(fach);
  };

  TAGE.forEach(([k,l]) => {
    const b = el(`<button class="day" aria-pressed="${a.tage.includes(k)}">${l}</button>`);
    b.onclick = () => {
      const i = a.tage.indexOf(k);
      if (i < 0){ a.tage.push(k); if (a.jeTag){ tagAnlegen(k); offenerTag = k; } }
      else a.tage.splice(i,1);
      b.setAttribute("aria-pressed", a.tage.includes(k));
      if (a.jeTag) aufbauen();
      frisch();
    };
    daysBox.appendChild(b);
  });
  t.querySelector("[data-aktiv]").onchange = e => { a.aktiv = e.target.checked; frisch(); };
  t.querySelector("[data-jetag]").onchange = e => {
    a.jeTag = e.target.checked;
    if (a.jeTag) a.tage.forEach(tagAnlegen);
    aufbauen(); frisch();
  };
  aufbauen();
  frisch();
  return t;
}

let bearbeite = -1;   // Index des Mitarbeiters im Formular, -1 = neu

    formBox.innerHTML = "";
    const f = el(`<div class="${neuM ? "" : "task"}" style="${neuM ? "" : "padding:16px;margin-bottom:6px"}">

        <label class="f">Name<input type="text" id="mName" placeholder="Vor- und Nachname" value="${esc(m.name)}"></label>

          `<option${x === m.typ ? " selected" : ""}>${x}</option>`).join("")}</select></label>
        <label class="f">Geburtsdatum <span class="hint">optional</span><input type="date" id="mGeb" value="${esc(m.geb || "")}"></label>
      </div>
      <div class="grid g3" style="margin-top:12px">
        <label class="f" id="wrapVertrag">Stunden laut Vertrag<input type="number" id="mVertrag" min="0" step="0.5" placeholder="leer lassen, wenn unklar" value="${esc(m.vertrag || "")}"></label>

          `<option value="${j}"${m.lehrjahr === j ? " selected" : ""}>${j}. Lehrjahr</option>`).join("")}</select></label>
        <label class="f" id="wrapBetrieb" hidden>Stunden im Betrieb<input type="number" id="mBetrieb" min="0" step="0.5" placeholder="leer lassen, wenn unklar" value="${esc(m.betrieb || "")}"></label>
        <label class="f">Überstunden zu Beginn KW ${kwVon(jetzt)}<input type="number" id="mSaldo" step="0.25" placeholder="0"
          value="${standJetzt === null || standJetzt === undefined ? esc(m.saldo ?? "") : standJetzt}">
          <span class="hint">+ Überstunden, − Minusstunden. Danach rechnet der Plan jede Woche selbst weiter.</span></label>
      </div>
      <div class="grid g2" style="margin-top:12px">
        <label class="switch" style="align-items:flex-start">
          <input type="checkbox" id="mUeber" ${m.ueberstunden !== false ? "checked" : ""}>
          <span>kann Überstunden machen
          <span class="hint">— aus, dann plant der Planer höchstens die Vertragsstunden ein
          (Minusstunden darf er trotzdem ausgleichen)</span></span></label>
        <label class="switch" style="align-items:flex-start">
          <input type="checkbox" id="mGeteilt" ${m.geteilt ? "checked" : ""}>
          <span>darf geteilt arbeiten
          <span class="hint">— morgens und abends am selben Tag; dann entfällt die Pause,
          weil jeder Teil für sich unter der Grenze bleibt</span></span></label>
      </div>
      <div style="margin-top:14px"><span class="eyebrow">Funktionen</span>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-top:8px" id="mQual">
          ${QUAL.map(([k,l]) => `<label class="switch"><input type="checkbox" value="${k}"${
            (m.qual || []).includes(k) ? " checked" : ""}> ${l}</label>`).join("")}
        </div></div>
      <p class="err" id="err"></p>
      <div class="actions" id="formActions"></div>
    </div>`);
    formBox.appendChild(f);

    const typ = f.querySelector("#mTyp");

      const az = typ.value === "Azubi";

      f.querySelector("#wrapLj").hidden = !az;
      f.querySelector("#wrapBetrieb").hidden = !az;
    };
    typ.onchange = umschalten; umschalten();

    const lesen = () => {
      const az = typ.value === "Azubi";
      return {
        name: f.querySelector("#mName").value.trim(),
        typ: typ.value,
        geb: f.querySelector("#mGeb").value,
        vertrag: az ? "" : f.querySelector("#mVertrag").value,
        lehrjahr: az ? parseInt(f.querySelector("#mLj").value,10) : null,
        betrieb: az ? f.querySelector("#mBetrieb").value : "",

        ueberstunden: f.querySelector("#mUeber").checked,
        qual: [...f.querySelectorAll("#mQual input:checked")].map(i => i.value)

    const act = f.querySelector("#formActions");
    const speichern = el(`<button class="btn small">${neuM ? "Mitarbeiter hinzufügen" : "Änderungen speichern"}</button>`);
    speichern.onclick = () => {

        // Umbenennen: alte Pläne finden die Person über den Namen
        if (alt.name !== d.name) Object.values(state.plaene).forEach(pl => {
          if (pl.namen){ const j = pl.namen.indexOf(alt.name); if (j >= 0) pl.namen[j] = d.name; }
        });
        Object.assign(alt, d);   // Standardwoche bleibt erhalten

      checks.innerHTML = "";

      meld.forEach(x => checks.appendChild(el(`<div class="note ${x.art}"><span class="ic">§</span><span>${esc(x.text)}</span></div>`)));
      if (w && hat(soll) && Math.abs(w - nz(soll)) > 0.5)
        checks.appendChild(el(`<div class="note warn"><span class="ic">!</span><span>Die Standardwoche ergibt ${h1(w)} h, der Vertrag nennt ${h1(nz(soll))} h.</span></div>`));
      if (w && !meld.length) checks.appendChild(el(`<div class="note ok"><span class="ic">✓</span><span>Diese Woche verstößt gegen keine Regel.</span></div>`));
      sichern();
    };

    TAGE.forEach(([k,l]) => {
      const s = m.standard[k] || {von:"", bis:""};
      m.standard[k] = s;
      const tr = el(`<tr><td>${l}</td>
        <td class="n"><input type="time" value="${s.von}" style="max-width:120px"></td>

  ablage.addEventListener("drop", e => { if (e.dataTransfer.files[0]) lies(e.dataTransfer.files[0]); });
  feld.onchange = () => { if (feld.files[0]) lies(feld.files[0]); feld.value = ""; };

    sagen("");
    const name = datei.name.toLowerCase();

      if (name.endsWith(".csv")){

        if (!window.ExcelJS) return sagen("Die Excel-Bibliothek ist nicht geladen.");
        const wb = new ExcelJS.Workbook();
        await wb.xlsx.load(await datei.arrayBuffer());

    if (!gefunden || !gefunden.stunden.some(x => x !== null))
      return sagen("In der Datei standen keine sechs Tageswerte, die sich zuordnen ließen. Bitte oben von Hand eintragen.");
    TAGE.forEach(([k], i) => {
      if (gefunden.stunden[i] !== null) liste.stunden[k] = gefunden.stunden[i];

  return p;
}

/* Aus einer Tabelle die sechs Tageswerte fischen: gesucht wird eine Zeile, die
   mit „Stunden" beginnt (bzw. „Umsatz"), und darin die ersten sechs Zahlen. */

function ausZeilen(zeilen){
  // Excel liefert echte Zahlen (25.5), CSV liefert Text („25,5", „1.234,5", „25.5")
  const zahl = v => {
    if (v === null || v === undefined || v === "") return null;
    if (typeof v === "number") return isFinite(v) ? v : null;
    let t = String(v).trim().replace(/\s|€|h$/gi, "");
    if (t.includes(",")) t = t.replace(/\./g, "").replace(",", ".");   // deutsch
    else if (/^\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, "");  // 12.000
    const n = parseFloat(t);
    return isFinite(n) && /^-?[\d.]+$/.test(t) ? n : null;
  };
  const text = v => v && typeof v === "object" && v.richText
    ? v.richText.map(r => r.text).join("") : String(v ?? "");
  const finde = muster => {
    for (const z of zeilen){
      // Die Beschriftung steht nicht immer in Spalte A — die erste Textzelle nehmen
      const k = z.findIndex(v => v !== null && v !== undefined && v !== "" && zahl(v) === null);
      if (k < 0 || !muster.test(text(z[k]).toLowerCase())) continue;
      const werte = z.slice(k + 1).map(zahl).filter(x => x !== null);
      if (werte.length >= 6) return werte.slice(0, 6);
      if (werte.length) return werte.concat(Array(6 - werte.length).fill(null));
    }
    return null;
  };
  const stunden = finde(/stunde|std/);
  const umsatz  = finde(/umsatz|euro|€/);
  return stunden ? {stunden, umsatz} : null;
}

function ausCSV(text){
  const trenn = (text.split("\n")[0].match(/;/g) || []).length >= (text.split("\n")[0].match(/,/g) || []).length ? ";" : ",";
  return ausZeilen(text.split(/\r?\n/).map(z => z.split(trenn)));
}

function ausTabelle(wb){
  const zeilen = [];
  wb.eachSheet(ws => ws.eachRow(r => {
    const z = [];
    r.eachCell({includeEmpty:true}, c => z.push(c.value && c.value.result !== undefined ? c.value.result : c.value));
    zeilen.push(z);
  }));
  return ausZeilen(zeilen);
}

    Vertretung dieser Schicht. Mit nur einer Person je Schicht steht die Filiale bei jedem Urlaubstag still.</p>
  </div>`);

  // offene Angaben — bewusst kein Fehler, nur ein ehrlicher Vermerk
  const offen = p.querySelector("#offen");
  if (a.luecken.length){
    a.luecken.forEach(l => offen.appendChild(el(`<div class="note warn"><span class="ic">?</span><span>${esc(l)}</span></div>`)));
    offen.appendChild(el(`<p class="hint" style="margin-top:10px">Alles davon darf offen bleiben.
      Die Zahlen oben rechnen dann nur mit dem, was bekannt ist — und sind deshalb eher zu niedrig als zu hoch.</p>`));
  } else {
    offen.appendChild(el(`<div class="note ok"><span class="ic">✓</span><span>Alle Angaben, die in die Rechnung eingehen, sind vollständig.</span></div>`));
  }

  const notes = p.querySelector("#notes");
  const add = (art, ic, text) => notes.appendChild(el(`<div class="note ${art}"><span class="ic">${ic}</span><span>${text}</span></div>`));

  if (!a.budget) add("info","i","Ohne Stundenliste gibt es keinen Budgetvergleich — geplant wird trotzdem.");
  else if (a.ohneStunden.length)
    add("warn","?",`Bei ${a.ohneStunden.length} Person(en) fehlen die Stunden — der Vergleich mit dem Budget ist deshalb unvollständig.`);
  else if (Math.abs(diff) <= a.budget * 0.05)
    add("ok","✓",`Verträge und Budget passen zusammen: ${h1(a.wirksam)} h leistungswirksam gegen ${h1(a.budget)} h Vorgabe.`);
  else if (diff > 0)
    add("warn","↑",`Die Verträge liegen ${h1(diff)} h über dem Budget. Entweder wird nicht jeder voll eingeplant, oder die Vorgabe ist zu knapp.`);
  else
    add("warn","↓",`Dem Budget fehlen ${h1(-diff)} h an Vertragsstunden. Aushilfen einplanen oder mit dem Bereichsleiter sprechen.`);

  if (a.flexible > 0)
    add("ok","~",`${a.flexible} Warenart(en) ohne feste Uhrzeit — der Plan kann sie dorthin legen, wo Platz ist. Das ist Spielraum, kein Mangel: Vor der Öffnung erledigen sie die zwei Personen der Grundbesetzung mit, nach der Öffnung braucht es eine Kraft zusätzlich zur Kasse.`);

  if (azubiPlus > 0)
    add("ok","+",`Azubistunden bringen ${h1(azubiPlus)} h zusätzliche Besetzung, ohne die Stundenleistung zu belasten. Beim Wechsel des Lehrjahrs fällt dieser Vorteil weg — das kommt jedes Jahr im Herbst.`);

  if (a.anwesend && a.bedarf !== null && a.bedarf > a.anwesend)
    add("bad","×",`Der Wochenbedarf liegt ${h1(a.bedarf - a.anwesend)} h über allem, was die Verträge hergeben. Zwei Personen durchgehend im Laden kosten allein ${h1(a.grund)} h — hier hilft nur mehr Personal, kürzere Öffnung oder weniger Personen je Warentermin.`);
  else if (a.anwesend && a.bedarf && a.anwesend - a.bedarf < a.bedarf * 0.08)
    add("warn","!",`Nur ${h1(a.anwesend - a.bedarf)} h Luft über dem Mindestbedarf. Eine Krankmeldung reißt die Woche auf.`);

  if (a.fruehOk === 0) add("bad","×","Für die Frühschicht ist niemand da, der sie führen kann — weder Filialleitung noch Frühschichtvertretung.");
  else if (a.fruehOk === 1) add("warn","!","Nur eine Person kann die Frühschicht führen. An deren freien Tagen geht der Laden nicht auf.");
  if (a.spaetOk === 0) add("bad","×","Für die Spätschicht ist niemand da, der sie führen kann — weder Filialleitung noch Spätschichtvertretung.");
  else if (a.spaetOk === 1) add("warn","!","Nur eine Person kann die Spätschicht führen. Urlaub oder Krankheit legen den Abend lahm.");
  if (a.qual.kasse < 2) add("bad","×","Zu wenige Personen für die Kasse — sie muss von der Öffnung bis zum Ladenschluss durchgehend besetzt sein.");

  // Verstöße, die jede Woche wiederkehren
  state.mitarbeiter.forEach(m => {
    pruefeStandard(m).forEach(x => add(x.art, "§", `Standardwoche ${esc(m.name)} — ${esc(x.text)}`));
  });
  const leitungOhne = state.mitarbeiter.filter(m => m.typ === "Filialleitung" && !wochenStunden(m));
  if (leitungOhne.length)
    add("warn","!","Für die Filialleitung ist noch keine Standardwoche hinterlegt — sie ist der Fixpunkt, um den herum der Plan gebaut wird.");
  else if (state.mitarbeiter.some(m => m.typ === "Filialleitung"))
    add("ok","✓","Die Standardwoche der Filialleitung steht und wird jede Woche als Vorschlag übernommen.");

  const spaetMinder = a.minderjaehrig.filter(m => (m.qual || []).includes("spaet"));
  spaetMinder.forEach(m => add("bad","§",
    `${esc(m.name)} ist als Spätschichtvertretung eingetragen, darf aber nur bis 20:00 Uhr arbeiten — die Spätschicht endet später.`));

  a.minderjaehrig.forEach(m => add("warn","§",
    `${esc(m.name)} ist ${alter(m.geb)} Jahre alt: Einsatz nur bis 20:00 Uhr, höchstens 8 h am Tag und 5 Tage pro Woche, ab 6 h Arbeitszeit 60 Minuten Pause.`));
  if (a.minderjaehrig.length && state.bis > "20:00")
    add("warn","§",`Die Filiale schließt um ${state.bis} Uhr — den Abschluss kann keiner der minderjährigen Mitarbeiter übernehmen.`);

  if (!notes.children.length) add("ok","✓","Keine Auffälligkeiten. Die Einrichtung ist vollständig.");

  p.appendChild(navLeiste(PRUEFEN_SCHRITT));
  return p;
}
