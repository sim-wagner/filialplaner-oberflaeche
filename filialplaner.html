    const soll = sollWoche(m, i, plan.mo), ziel = plan.ziel[i], ist = istStunden(plan, i);
    plan.konto.push({i, ist, soll, ziel, saldoAlt:start[i], saldoNeu:viertel(start[i] + ist - soll)});
    if (ist < ziel - 2) plan.meldungen.push({art:"warn", text:`${m.name}: ${h1(ist)} h verplant, Ziel ${h1(ziel)} h — es fehlen ${h1(ziel-ist)} h.`});
    if (!darfUeberstunden(m) && ist > Math.max(ziel, soll) + 0.25)
      plan.meldungen.push({art:"bad", text:`${m.name} kann keine Überstunden machen, ist aber mit ${h1(ist)} h eingeplant (Soll ${h1(soll)} h) — anders war die Besetzung nicht zu schaffen.`});
    else if (ist > ziel + 2){ mehr++; plan.meldungen.push({art:"warn", text:`${m.name}: ${h1(ist)} h verplant, Ziel ${h1(ziel)} h — ${h1(ist-ziel)} h darüber.`}); }
    if (m.typ === "Aushilfe (Minijob)" && ist > soll * 1.3 && soll > 0)
      plan.meldungen.push({art:"bad", text:`${m.name} ist Minijob mit ${h1(soll)} h und hier mit ${h1(ist)} h eingeplant — das sprengt auf den Monat gerechnet die 603-€-Grenze.`});
  });
  if (mehr >= 3){
    // Ehrlich unterscheiden: Verlangen schon die Regeln mehr Stunden, als die
    // Verträge hergeben (dann fehlt Personal), oder plant der Plan mehr als nötig?
    const vertraglich = ms.reduce((x,m,i) => x + (hat(istAzubi(m) ? m.betrieb : m.vertrag) ? plan.ziel[i] : 0), 0);
    const geplant = plan.konto.reduce((x,k) => x + k.ist, 0);
    const mindest = auswertung().bedarf;
    const text = mindest !== null && mindest > vertraglich
      ? `${mehr} Personen liegen über ihren Vertragsstunden. Schon der Mindestbedarf der Woche liegt bei `
        + `${h1(mindest)} h, die Verträge geben ${h1(vertraglich)} h her — es fehlen rund `
        + `${h1(mindest - vertraglich)} h Personal. Geplant sind ${h1(geplant)} h; der Unterschied zum `
        + `Mindestbedarf entsteht, weil Schichten nicht beliebig kurz und nicht beliebig zerstückelt sein können.`
      : `${mehr} Personen liegen über ihren Vertragsstunden: geplant ${h1(geplant)} h bei `
        + `${h1(vertraglich)} h laut Vertrag${mindest !== null ? " und einem Mindestbedarf von " + h1(mindest) + " h" : ""}.`;
    plan.meldungen.unshift({art:"bad", text});
  }

  // Gegen die Stundenliste der Woche halten, wenn es eine gibt
  const liste = (state.listen || {})[wochenSchluessel(plan.mo)];
  if (liste){
    const vorgabe = TAGE.reduce((x,[k]) => x + nz(liste.stunden[k]), 0);
    if (vorgabe > 0){
      const wirk = planSummen(plan).wirk;
      const d = wirk - vorgabe;
      plan.meldungen.unshift({art: Math.abs(d) <= vorgabe*0.05 ? "ok" : "warn",
        text:`Stundenliste KW ${kwVon(plan.mo)}: ${h1(vorgabe)} h vorgegeben, ${h1(wirk)} h leistungswirksam geplant — ${
          Math.abs(d) < 0.05 ? "genau getroffen" : (d > 0 ? h1(d) + " h darüber" : h1(-d) + " h darunter")}.`});
    }
  }
}

// summe: wohin die Woche in Stunden soll — {bis} kürzen, {auf} auffüllen. Ohne
// Angabe wird nur bei denen aufgefüllt, die unter ihrem Ziel liegen.
function erzeugePlanRoh(montagISO, phase, summe, basisPlan){
  const vorgabe = wochenVorgabe(montagDer(montagISO), phase);
  vorgabe.basisPlan = basisPlan || null;
  let beste = null, besteGuete = Infinity;
  for (let n = 0; n < ENTWUERFE; n++){
    const entwurf = baueWoche(montagISO, n === 0 ? null : wuerfel(n * 2654435761), vorgabe);
    const g = guete(entwurf);
    if (g < besteGuete){ besteGuete = g; beste = entwurf; }
  }
  ausgleichen(beste);
  const ph = vorgabe.phase;
  if (ph.art === "sparen") sparenKuerzen(beste, summe ? summe.bis : 0);
  else {
    // Die Stundenliste der Bereichsleitung ist die Obergrenze fürs Auffüllen
    const liste = (state.listen || {})[wochenSchluessel(beste.mo)];
    const vorgabeListe = liste ? TAGE.reduce((x,[k]) => x + nz(liste.stunden[k]), 0) : 0;
    const jetzt = planSummen(beste);
    let grenze = summe && summe.auf !== undefined ? summe.auf : Infinity;
    // Die Liste zählt leistungswirksame Stunden, aufgefüllt werden bezahlte
    if (vorgabeListe > 0) grenze = Math.min(grenze, jetzt.bezahlt + Math.max(0, vorgabeListe - jetzt.wirk));
    auffuellen(beste, grenze, ph.art === "mehr" ? ph.tage : null);
    if (summe && summe.auf !== undefined && planSummen(beste).bezahlt > summe.auf + 0.5) sparenKuerzen(beste, summe.auf);
  }
  nachrechnen(beste);
  beste.phase = vorgabe.phase;
  return beste;
}

function erzeugePlan(montagISO, phase){
  const ph = phaseNormal(phase);
  if (ph.art === "normal") return erzeugePlanRoh(montagISO, ph);
  // In einer besonderen Woche zum Vergleich auch die normale rechnen — sonst weiß
  // niemand, was die Einstellung gebracht hat. Die Sparwoche braucht sie ohnehin:
  // „15 Stunden weniger“ heißt weniger als die Standardwoche.
  const normalPlan = erzeugePlanRoh(montagISO, {art:"normal"});
  const normal = planSummen(normalPlan).bezahlt;
  const summe = ph.art === "mehr" ? {auf: normal + Math.max(0, nz(ph.mehr))}
              : ph.sparArt === "stunden" ? {bis: normal - Math.max(0, nz(ph.stunden))}
              : {bis: 0};                                  // Prozent: so weit es geht
  const plan = erzeugePlanRoh(montagISO, ph, summe, ph.art === "mehr" ? normalPlan : null);
  phasenMeldung(plan, ph, normal);
  return plan;
}

// Oben in den Hinweisen: was die Art der Woche gegenüber der Standardwoche gebracht hat
function phasenMeldung(plan, ph, normal){
  const jetzt = planSummen(plan).bezahlt, d = jetzt - normal;
  const vergleich = `${h1(jetzt)} h geplant, als Standardwoche wären es ${h1(normal)} h — `
    + (Math.abs(d) < 0.05 ? "kein Unterschied" : d < 0 ? h1(-d) + " h weniger" : h1(d) + " h mehr");
  const gewollt = ph.art === "mehr" ? nz(ph.mehr) : ph.sparArt === "stunden" ? nz(ph.stunden) : null;
  const verfehlt = gewollt !== null && Math.abs(Math.abs(d) - gewollt) > 2;
  plan.meldungen.unshift({art: verfehlt ? "warn" : "ok", text: (ph.art === "sparen"
    ? `Sparwoche (${phasenText(ph)}): ${vergleich}.`
      + (verfehlt ? ` Mehr ließ sich nicht einsparen, ohne dass Kasse, Führung, Aufgaben oder die Mindestbesetzung von zwei Personen reißen.` : "")
    : `Woche mit Mehrbedarf (${phasenText(ph)}): ${vergleich}.`
      + (verfehlt ? ` Genauer ging es nicht — Schichten sind mindestens vier Stunden lang, und niemand darf über acht Stunden am Tag.` : ""))});
}

/* Schichten eines fertigen Plans nachträglich länger oder kürzer machen — mit
   denselben Regeln wie beim Bauen. Die Pause bleibt, wo sie war, solange sie dort
   noch erlaubt ist; sonst rückt sie in die Mitte. */

function schichtWerkzeug(plan){
  const ms = state.mitarbeiter;
  const abw = (state.abwesend || {})[wochenSchluessel(plan.mo)] || {};
  const minderj = i => { const a = alter(ms[i].geb); return a !== null && a < 18; };
  const pauseAnpassen = sch => {
    const m = ms[sch.mi], anw = (sch.bis - sch.von)/60, pz = pauseFuer(m, anw);
    if (!pz){ sch.pauseVon = null; sch.pauseBis = null; }
    else {
      const laenge = pz * 60;
      const amStueck = amStueckFuer(minderj(sch.mi));
      const ok = v => v !== null && v !== undefined && v >= sch.von + 60 && v + laenge <= sch.bis - 60
                   && v - sch.von <= amStueck && sch.bis - (v + laenge) <= amStueck;
      let pv = sch.pauseVon;
      if (!ok(pv)){
        pv = Math.round((sch.von + (sch.bis - sch.von)/2 - laenge/2) / 15) * 15;
        pv = Math.max(sch.von + 60, Math.min(pv, sch.bis - 60 - laenge));
      }
      sch.pauseVon = pv; sch.pauseBis = pv + laenge;
    }
    sch.pause = pz; sch.arbeit = anw - pz;
  };
  // Darf i am Tag ti von–bis arbeiten? Abwesenheit, Jugendschutz, Ruhezeit, 8 Stunden
  const erlaubt = (i, ti, von, bis) => {
    const e = (abw[i] || {})[TAGE[ti][0]];
    if (e){
      if (typeof e === "string") return false;
      const a = hatZeit(e.von) ? minuten(e.von) : null, b = hatZeit(e.bis) ? minuten(e.bis) : null;
      if (a !== null && b !== null && b > a && !(e.a === "nur" ? (von >= a && bis <= b) : (bis <= a || von >= b))) return false;
    }
    if (minderj(i) && !jugendZeit(von, bis)) return false;
    const anw = (bis - von)/60;
    if (anw - pauseFuer(ms[i], anw) > MAXARBEIT + 0.01) return false;
    const noetig = ruhezeitFuer(minderj(i)) * 60;
    const vor = ti > 0 ? plan.tage[ti-1].schichten.filter(x => x.mi === i) : [];
    const nach = ti < plan.tage.length-1 ? plan.tage[ti+1].schichten.filter(x => x.mi === i) : [];
    if (vor.some(x => 24*60 - x.bis + von < noetig - 0.5)) return false;
    if (nach.some(x => 24*60 - bis + x.von < noetig - 0.5)) return false;
    return true;
  };
  // Zeitraum, in dem an einem Tag überhaupt jemand gebraucht wird
  const rahmen = ti => {
    const auf = plan.tage[ti].aufgaben || [];
    const offenVon = hatZeit(state.von) ? minuten(state.von) : 8*60;
    const offenBis = hatZeit(state.bis) ? minuten(state.bis) : 21*60;
    return [Math.min(offenVon, ...auf.map(a => a.von)), Math.max(offenBis, ...auf.map(a => a.bis))];
  };
  // Schichten, die man anfassen darf: keine Standardschicht, kein geteilter Tag
  const beweglich = (t, sch) => !(sch.rollen || []).includes("Standard")
                                && t.schichten.filter(x => x.mi === sch.mi).length === 1;
  return {pauseAnpassen, erlaubt, rahmen, beweglich};
}

/* Auffüllen: Wer unter seinem Ziel liegt — meist, weil er Minusstunden hat —,
   bekommt seine Schicht in halben Stunden verlängert, solange Regeln und Besetzung
   es zulassen und die Woche unter grenze Stunden bleibt. Bei einer Stundenliste
   ist deren Vorgabe die Grenze. nurTage: in einer Woche mit Mehrbedarf nur dort. */

function auffuellen(plan, grenze, nurTage){
  const w = schichtWerkzeug(plan);
  const summe = () => planSummen(plan).bezahlt;
  for (let schutz = 0; schutz < 500 && summe() < grenze - 0.01; schutz++){
    let bester = null;
    plan.tage.forEach((t, ti) => {
      if (t.feiertag || (nurTage && nurTage.length && !nurTage.includes(t.key))) return;
      const [tagVon, tagBis] = w.rahmen(ti);
      const vorher = tagesMaengel(plan, ti);
      t.schichten.forEach(sch => {
        if (!w.beweglich(t, sch)) return;
        const fehlt = plan.ziel[sch.mi] - istStunden(plan, sch.mi);
        if (fehlt < 0.5 || (bester && fehlt <= bester.fehlt)) return;
        for (const [dv, db] of [[0,30],[-30,0],[0,60],[-60,0]]){
          const von = sch.von + dv, bis = sch.bis + db;
          if (von < tagVon || bis > tagBis || !w.erlaubt(sch.mi, ti, von, bis)) continue;
          const alt = {von:sch.von, bis:sch.bis, pauseVon:sch.pauseVon, pauseBis:sch.pauseBis, pause:sch.pause, arbeit:sch.arbeit};
          sch.von = von; sch.bis = bis; w.pauseAnpassen(sch);
          const gewinn = sch.arbeit - alt.arbeit;
          const geht = gewinn > 0.01 && gewinn <= fehlt + 0.01 && tagesMaengel(plan, ti) <= vorher;
          Object.assign(sch, alt);
          if (geht){ bester = {sch, von, bis, fehlt}; break; }
        }
      });
    });
    if (!bester) break;
    bester.sch.von = bester.von; bester.sch.bis = bester.bis;
    w.pauseAnpassen(bester.sch);
    bester.sch.verlaengert = true;
  }
}

/* Sparwoche: Schichten in halben Stunden kürzen, bis die Woche bei zielSumme
   Stunden liegt oder nichts mehr geht. Gekürzt wird nur, was keine Lücke reißt
   (gleiche Prüfung wie überall: Führung, Kasse, Aufgaben, Mindestbesetzung), keine
   Standardschicht, nichts unter vier Stunden. Zuerst bei dem, der am weitesten
   über seinem Ziel liegt. */

function sparenKuerzen(plan, zielSumme){
  const w = schichtWerkzeug(plan), pauseAnpassen = w.pauseAnpassen;
  const summe = () => planSummen(plan).bezahlt;
  for (let schutz = 0; schutz < 500 && summe() > zielSumme + 0.01; schutz++){
    let bester = null;
    plan.tage.forEach((t, ti) => {
      if (t.feiertag) return;
      const vorher = tagesMaengel(plan, ti);
      t.schichten.forEach(sch => {
        if (!w.beweglich(t, sch)) return;
        if (sch.bis - sch.von - 30 < MINSCHICHT * 60) return;
        const ueber = istStunden(plan, sch.mi) - plan.ziel[sch.mi];
        for (const seite of ["ende", "anfang"]){
          const alt = {von:sch.von, bis:sch.bis, pauseVon:sch.pauseVon, pauseBis:sch.pauseBis, pause:sch.pause, arbeit:sch.arbeit};
          if (seite === "ende") sch.bis -= 30; else sch.von += 30;
          pauseAnpassen(sch);
          const geht = tagesMaengel(plan, ti) <= vorher;
          Object.assign(sch, alt);
          if (geht && (!bester || ueber > bester.ueber + 0.01)) bester = {sch, seite, ueber};
        }
      });
    });
    if (!bester) break;
    if (bester.seite === "ende") bester.sch.bis -= 30; else bester.sch.von += 30;
    pauseAnpassen(bester.sch);
    bester.sch.gekuerzt = true;
  }
}

/* ---- Art der Woche (testweise) ------------------------------------------
   normal  — alles wie hinterlegt
   sparen  — Stunden auf das Nötige: entweder alle Aufgaben um einen Prozentsatz
             kürzer gerechnet (Standard 10 %) oder eine Zahl Stunden, die in der
             Woche wegfallen soll
   mehr    — zusätzliche Stunden für kurzfristige Aufgaben, an gewählten Tagen
   Daraus entsteht für den Planer die Vorgabe: Zielstunden je Mitarbeiter, ein
   Faktor für die Aufgabendauer und gegebenenfalls Zusatzaufgaben. */

function planSummen(plan){
  const proTag = plan.tage.map(t => {
    const bezahlt = t.schichten.reduce((s,x) => s + x.arbeit, 0);
    const wer = x => (plan.namen ? state.mitarbeiter.find(m => m.name === plan.namen[x.mi]) : state.mitarbeiter[x.mi]) || {};
    const wirk = t.schichten.reduce((s,x) => s + x.arbeit * faktor(wer(x)), 0);
    return {bezahlt, wirk};
  });
  return {proTag,
    bezahlt: proTag.reduce((s,x) => s + x.bezahlt, 0),
    wirk: proTag.reduce((s,x) => s + x.wirk, 0)};
}

// ==== kern/07-phasen.js ====
/* Art der Woche: Standard, Sparen, Mehr */

function phaseNormal(ph){
  ph = Object.assign({art:"normal", sparArt:"prozent", prozent:10, stunden:"", mehr:"", tage:[], was:""}, ph || {});
  if (!["normal","sparen","mehr"].includes(ph.art)) ph.art = "normal";
  return ph;
}

function phasenText(ph){
  ph = phaseNormal(ph);
  if (ph.art === "sparen") return ph.sparArt === "stunden" ? `${h1(nz(ph.stunden))} h weniger`
                                                           : `Aufgaben ${nz(ph.prozent)} % kürzer`;
  if (ph.art === "mehr") return `+${h1(nz(ph.mehr))} h${ph.was ? " für " + ph.was : ""}`;
  return "Standardwoche";
}

function wochenVorgabe(mo, phase){
  const ph = phaseNormal(phase);
  const ms = state.mitarbeiter;
  const start = ueberstundenZuBeginn(mo);
  // Grundziel: Soll der Woche, um höchstens AUSGLEICH_MAX Stunden in Richtung null
  // verschoben — wer Überstunden hat, bekommt weniger, wer Minusstunden hat, mehr
  const ziel = ms.map((m, i) => {
    const soll = sollWoche(m, i, mo);
    if (soll === null) return 0;
    const s = Math.max(-AUSGLEICH_MAX, Math.min(AUSGLEICH_MAX, start[i] || 0));
    return Math.max(0, soll - s);
  });
  const vorgabe = {phase: ph, ziel, start, faktor: 1, zusatz: {}};
  const offeneTage = TAGE.map(([k], ti) => { const d = new Date(mo); d.setDate(mo.getDate() + ti); return istFeiertag(d) ? null : k; })
                         .filter(Boolean);

  // Stunden aus den Zielen nehmen: zuerst bei denen mit Überstunden, dann anteilig
  const wegnehmen = h => {
    let rest = h;
    ms.map((m,i) => i).filter(i => (start[i] || 0) > 0).sort((a,b) => start[b] - start[a]).forEach(i => {
      const d = Math.min(rest, start[i], ziel[i]); ziel[i] -= d; rest -= d;
    });
    const summe = ziel.reduce((s,z) => s + z, 0);
    if (rest > 0 && summe > 0) ziel.forEach((z,i) => ziel[i] = Math.max(0, z - rest * z / summe));
  };
  // Stunden dazugeben: zuerst an die mit Minusstunden, dann anteilig an alle,
  // die Überstunden machen können
  const dazugeben = h => {
    let rest = h;
    ms.map((m,i) => i).filter(i => (start[i] || 0) < 0 && hatVertrag(ms[i])).sort((a,b) => start[a] - start[b]).forEach(i => {
      const d = Math.min(rest, -start[i]); ziel[i] += d; rest -= d;
    });
    const wer = ms.map((m,i) => i).filter(i => hatVertrag(ms[i]) && darfUeberstunden(ms[i]));
    const summe = wer.reduce((s,i) => s + stunden(ms[i]), 0);
    if (rest > 0 && summe > 0) wer.forEach(i => ziel[i] += rest * stunden(ms[i]) / summe);
  };

  if (ph.art === "sparen"){
    if (ph.sparArt === "stunden") wegnehmen(Math.max(0, nz(ph.stunden)));
    else {
      const p = Math.max(0, Math.min(50, nz(ph.prozent)));
      vorgabe.faktor = 1 - p / 100;
      // Was die Aufgaben weniger brauchen, fällt auch bei den Zielen weg
      const aufgabenStunden = offeneTage.reduce((s, k) =>
        s + aufgabenAmTag(k, 8*60, 21*60).reduce((x, a) => x + a.dauer * a.pers / 60, 0), 0);
      wegnehmen(aufgabenStunden * p / 100);
    }
  } else if (ph.art === "mehr" && nz(ph.mehr) > 0){
    const tage = (ph.tage && ph.tage.length ? ph.tage : TAGE.map(([k]) => k)).filter(k => offeneTage.includes(k));
    if (tage.length){
      const proTag = nz(ph.mehr) / tage.length;
      // mehr als sechs Stunden am Tag auf mehrere Personen verteilen
      const pers = Math.max(1, Math.ceil(proTag / 6));
      const dauer = Math.max(30, Math.round(proTag / pers * 60 / 15) * 15);
      tage.forEach(k => vorgabe.zusatz[k] = [{name: ph.was ? ph.was : "Zusatzaufgabe", dauer, pers}]);
      dazugeben(nz(ph.mehr));
    }
  }
  return vorgabe;
}

// ==== kern/08-konto.js ====
/* Überstundenkonto */

// An welcher Stelle steht m im gespeicherten Plan? Pläne merken sich die Namen —
// sonst verrutscht alles, sobald jemand aus dem Personal entfernt wird.
function planIndex(plan, m, i){
  return plan && plan.namen ? plan.namen.indexOf(m.name) : i;
}

function sollWoche(m, i, mo){
  if (!hatVertrag(m)) return null;
  const soll = stunden(m);
  const abw = ((state.abwesend || {})[wochenSchluessel(mo)] || {})[i] || {};
  const std = TAGE.filter(([k]) => schicht(m, k)).map(([k]) => k);
  const tageProWoche = std.length || 5;
  let bezahlt = 0;
  TAGE.forEach(([k], ti) => {
    if (std.length && !std.includes(k)) return;        // an dem Tag hätte er ohnehin frei
    const d = new Date(mo); d.setDate(mo.getDate() + ti);
    if (istFeiertag(d) || abw[k] === "urlaub" || abw[k] === "krank") bezahlt++;
  });
  return Math.max(0, soll - soll / tageProWoche * Math.min(bezahlt, tageProWoche));
}

// Ist minus Soll in einer gespeicherten Woche
function wochenAenderung(kurz, m, i){
  const j = planIndex(kurz, m, i);
  if (j < 0 || !hatVertrag(m)) return 0;
  return viertel(istStunden(kurz, j) - sollWoche(m, i, montagDer(kurz.mo instanceof Date ? isoVon(kurz.mo) : kurz.mo)));
}

// Stand zu Beginn der Woche mo, je Mitarbeiter (null ohne Vertragsstunden)
function ueberstundenZuBeginn(mo){
  const ziel = wochenSchluessel(mo);
  const wochen = Object.keys(state.plaene || {}).sort();
  return state.mitarbeiter.map((m, i) => {
    if (!hatVertrag(m)) return null;
    let s = saldoVon(m);
    wochen.forEach(sl => {
      if (sl >= (m.saldoAb || ziel) && sl < ziel) s += wochenAenderung(state.plaene[sl], m, i);
    });
    return viertel(s);
  });
}

// Bevor eine alte Woche oder ihre Abwesenheiten gelöscht werden: ihre Stunden —
// und die aller Wochen davor — fest in den Stand übernehmen. Sonst fielen sie mit
// dem Plan aus der Rechnung, und ohne die Abwesenheiten stimmte das Soll nicht mehr.
function bisInStandUebernehmen(sl){
  Object.keys(state.plaene || {}).filter(x => x <= sl).sort().forEach(x => {
    state.mitarbeiter.forEach((m, i) => {
      if (!m.saldoAb || m.saldoAb > x) return;
      m.saldo = viertel(saldoVon(m) + wochenAenderung(state.plaene[x], m, i));
      m.saldoAb = folgeSchluessel(x);
    });
  });
  // Auch ohne Plan in dieser Woche: der Stichtag rückt nach, damit nichts doppelt zählt
  state.mitarbeiter.forEach(m => { if (m.saldoAb && m.saldoAb <= sl) m.saldoAb = folgeSchluessel(sl); });
}

const ueText = n => n === null || n === undefined ? ""
  : (n > 0.01 ? "+" : n < -0.01 ? "−" : "") + h1(Math.abs(n));

// ==== kern/09-plaene.js ====
/* Pläne speichern, laden, nach Änderung von Hand prüfen */

// Plan für die Ablage in ein schlichtes Format bringen und zurück
function planSpeichern(plan){
  const kurz = {
    mo: isoVon(plan.mo),
    erstellt: new Date().toISOString(),
    meldungen: plan.meldungen,
    konto: plan.konto || [],
    namen: state.mitarbeiter.map(m => m.name),
    phase: JSON.parse(JSON.stringify(plan.phase || phaseNormal())),
    berechnung: plan.berechnung || null,
    tage: plan.tage.map(tg => ({
      key: tg.key, label: tg.label, datum: isoVon(tg.datum), feiertag: tg.feiertag,
      aufgaben: tg.aufgaben.map(a => Object.assign({id:a.id, name:a.name, von:a.von, bis:a.bis, pers:a.pers},
                                                   a.basis ? {basis:a.basis} : {})),
      schichten: tg.schichten.map(s => ({mi:s.mi, von:s.von, bis:s.bis, pauseVon:s.pauseVon,
        pauseBis:s.pauseBis, pause:s.pause, arbeit:s.arbeit, rollen:s.rollen, mehrarbeit:s.mehrarbeit}))
    }))
  };
  state.plaene[wochenSchluessel(plan.mo)] = kurz;
  return kurz;
}

function planLaden(kurz){
  if (!kurz) return null;
  return {
    mo: new Date(kurz.mo + "T12:00:00"),
    meldungen: kurz.meldungen || [],
    konto: kurz.konto || [],
    // ohne diese drei gingen Notizen, Handänderungen und Buchung beim Laden verloren
    notizen: kurz.notizen || {},
    geaendertVonHand: !!kurz.geaendertVonHand,
    namen: kurz.namen || null,
    phase: phaseNormal(kurz.phase),
    berechnung: kurz.berechnung || null,
    tage: (kurz.tage || []).map(tg => Object.assign({}, tg, {datum: new Date(tg.datum + "T12:00:00")}))
  };
}

/* ---- Überstunden ----------------------------------------------------------
   Jeder Mitarbeiter hat einen Stand (saldo), der zu Beginn der Woche saldoAb galt
   — festgehalten, wenn er im Personal eingetragen wird. Jede Woche ab dann, für
   die es einen Plan gibt, bringt Ist minus Soll dazu, Änderungen von Hand
   eingeschlossen. Der Stand zu Beginn einer Woche ist so immer der Stand nach der
   Vorwoche, ohne dass jemand etwas buchen muss.

   Soll der Woche ist der Vertrag, abzüglich bezahlter Ausfälle: Urlaub, Krankheit
   und Feiertage zählen mit dem Tagesanteil, als wäre gearbeitet worden. „Kann
   nicht“ und Berufsschule zählen nicht — Azubis haben ihre Betriebsstunden
   ohnehin ohne die Schule hinterlegt. */

// Was eine Änderung von Hand verletzt — wird unter dem Plan angezeigt, verhindert
// aber nichts: Am Ende entscheidet die Filialleitung.
function handPruefung(plan){
  const ms = state.mitarbeiter, raus = [];
  plan.tage.forEach((t, ti) => {
    if (t.feiertag) return;
    t.schichten.forEach(s => {
      const m = plan.namen ? ms.find(x => x.name === plan.namen[s.mi]) : ms[s.mi];
      if (!m) return;
      const a = alter(m.geb), minder = a !== null && a < 18;
      const anw = (s.bis - s.von)/60;
      if (s.arbeit > (minder ? REGELN.gesetzMaxTagJugend : REGELN.gesetzMaxTag) + 0.01)
        raus.push(`${t.label}: ${m.name} arbeitet ${h1(s.arbeit)} h — mehr als das Gesetz zulässt.`);
      else if (s.arbeit > 8.01)
        raus.push(`${t.label}: ${m.name} arbeitet ${h1(s.arbeit)} h — über 8 h nur mit Ausgleich.`);
      if (s.pause + 0.01 < pauseFuer(m, anw))
        raus.push(`${t.label}: ${m.name} hat ${h1(s.pause*60/60)} h Pause, nötig sind ${h1(pauseFuer(m, anw))} h.`);
      if (minder && s.bis > JUGEND_BIS)
        raus.push(`${t.label}: ${m.name} ist unter 18 und arbeitet bis ${hhmm(s.bis)} Uhr.`);
      if (minder && s.von < JUGEND_VON)
        raus.push(`${t.label}: ${m.name} ist unter 18 und fängt um ${hhmm(s.von)} Uhr an — erlaubt ab 6:00 Uhr.`);
      if (ti > 0) plan.tage[ti-1].schichten.filter(x => x.mi === s.mi).forEach(x => {
        const ruhe = (24*60 - x.bis + s.von)/60;
        if (ruhe < ruhezeitFuer(minder) - 0.01)
          raus.push(`${t.label}: ${m.name} hat nur ${h1(ruhe)} h Ruhezeit seit dem Vortag.`);
      });
    });
    const luecken = tagesMaengel(plan, ti);
    if (luecken) raus.push(`${t.label}: ${luecken} halbe Stunde(n) nicht richtig besetzt.`);
  });
  return raus;
}

// ==== kern/10-termine.js ====
/* Terminliste: lesen, prüfen, übernehmen, zurücknehmen */

const TERMIN_ARTEN = [
  ["frei",   "frei verfügbar"],
  ["nicht",  "kann nicht"],
  ["urlaub", "Urlaub"],
  ["krank",  "krank"],
  ["schule", "Berufsschule"],
  ["nur",    "nur von–bis"],
  ["ohne",   "nicht von–bis"]
];

const terminArtText = (art, von, bis) => art === "nur" ? `nur ${von}–${bis}`
  : art === "ohne" ? `nicht ${von}–${bis}` : (TERMIN_ARTEN.find(x => x[0] === art) || ["",""])[1];

// Namen vergleichbar machen: klein, ohne doppelte Leerzeichen, Umlaute ausgeschrieben
const namensForm = s => String(s || "").toLowerCase().trim().replace(/\s+/g, " ")
  .replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss");

// „16.11.2026“, „16.11.26“, „2026-11-16“ oder ein Excel-Datum → Date (mittags) oder null
function datumAusText(v){
  if (v instanceof Date && !isNaN(v)){
    // Excel liefert Tage als Mitternacht UTC — dann zählt das UTC-Datum
    const utc = v.getUTCHours() === 0 && v.getUTCMinutes() === 0;
    return utc ? new Date(v.getUTCFullYear(), v.getUTCMonth(), v.getUTCDate(), 12)
               : new Date(v.getFullYear(), v.getMonth(), v.getDate(), 12);
  }
  const s = String(v ?? "").trim();
  let m = /^(\d{1,2})\.(\d{1,2})\.(\d{2}|\d{4})$/.exec(s);
  if (m){
    const j = +m[3] < 100 ? 2000 + +m[3] : +m[3];
    const d = new Date(j, +m[2] - 1, +m[1], 12);
    return d.getDate() === +m[1] && d.getMonth() === +m[2] - 1 ? d : null;
  }
  m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s);
  if (m){ const d = new Date(+m[1], +m[2] - 1, +m[3], 12); return d.getDate() === +m[3] ? d : null; }
  return null;
}

// „8:00“, „08.00“, „8“ oder eine Excel-Uhrzeit → „08:00“ oder null
function uhrAusText(v){
  if (v instanceof Date && !isNaN(v)) return hhmm(v.getUTCHours()*60 + v.getUTCMinutes());
  if (typeof v === "number" && v >= 0 && v < 1) return hhmm(Math.round(v * 24 * 60));
  const m = zeitAusText(String(v ?? ""));
  return m === null ? null : hhmm(m);
}

// Was ist gemeint? Erlaubt sind die Wörter der Vorlage und ein paar übliche Kürzel.
function terminArtAus(text, mitZeit){
  const t = namensForm(text).replace(/[–—]/g, "-");
  if (/^(urlaub|u)$/.test(t)) return "urlaub";
  if (/^(krank|k|au)$/.test(t)) return "krank";
  if (/^(berufsschule|schule|bs)$/.test(t)) return "schule";
  if (/^nur( von)?(-bis)?$/.test(t)) return mitZeit ? "nur" : null;
  if (/^(nicht|kann nicht|nicht da|frei|wunschfrei|verhindert|x)( von)?(-bis)?$/.test(t)) return mitZeit ? "ohne" : "nicht";
  return null;
}

/* Text lesen. Erwartet wird, was die Seite „Termine melden“ schreibt:
     Name: Petra Naumann
     Filiale: 540
     Di 17.11.2026: kann nicht
     Mi 18.11.2026 bis Sa 21.11.2026: Urlaub
     Do 19.11.2026: nur 08:00–14:00
   Mehrere Meldungen hintereinander sind erlaubt; jede beginnt mit „Name:“. */

function termineAusText(text){
  const raus = [];
  let name = "", filiale = "";
  String(text || "").split(/\r?\n/).forEach((roh, nr) => {
    const z = roh.replace(/\*/g, "").trim();         // WhatsApp setzt gern Sternchen für Fett
    if (!z) return;
    let m = /^name\s*:\s*(.+)$/i.exec(z);
    if (m){ name = m[1].trim(); filiale = ""; return; }
    m = /^filiale\s*:\s*(?:n\s*)?(\d+)/i.exec(z);
    if (m){ filiale = m[1]; return; }
    const datum = "(?:[A-Za-z]{2}\\.?,?\\s*)?(\\d{1,2}\\.\\d{1,2}\\.\\d{2,4})";
    m = new RegExp("^" + datum + "(?:\\s*(?:bis|-|–)\\s*" + datum + ")?\\s*:?\\s*(.*)$").exec(z);
    if (!m) return;                                    // Überschriften, Grüße, Leerzeilen
    const rest = m[3].trim();
    const zeiten = /(\d{1,2}[:.]\d{2}|\d{1,2})\s*(?:-|–|bis)\s*(\d{1,2}[:.]\d{2}|\d{1,2})\s*(?:uhr)?\s*$/i.exec(rest);
    const artText = zeiten ? rest.slice(0, zeiten.index).trim() : rest;
    raus.push({quelle:"Zeile " + (nr + 1), name, filiale,
               von: datumAusText(m[1]), bis: m[2] ? datumAusText(m[2]) : null,
               artText, art: terminArtAus(artText, !!zeiten),
               zVon: zeiten ? uhrAusText(zeiten[1]) : "", zBis: zeiten ? uhrAusText(zeiten[2]) : "",
               mitZeit: !!zeiten});
  });
  return raus;
}

// Tabelle lesen (Excel oder CSV nach der Vorlage). Die Spalten werden an der
// Überschrift erkannt, nicht an ihrer Stelle — eine verschobene Spalte schadet nicht.
function termineAusZeilen(zeilen, quelle){
  const text = v => v && typeof v === "object" && v.richText ? v.richText.map(r => r.text).join("")
                  : v && typeof v === "object" && v.text ? v.text : v;
  const kopfNr = zeilen.findIndex(z => z.some(v => /^name$/i.test(String(text(v) ?? "").trim()))
                                    && z.some(v => /datum/i.test(String(text(v) ?? ""))));
  if (kopfNr < 0) return null;
  const kopf = zeilen[kopfNr].map(v => namensForm(text(v)));
  const sp = muster => kopf.findIndex(k => muster.test(k));
  const cName = sp(/^name/), cVon = sp(/^(datum|von datum|ab)/), cBis = sp(/^bis datum|^bis tag|^letzter tag/),
        cArt = sp(/^art|^grund|^was/), cZv = sp(/^(von|uhrzeit von|ab uhr)$/), cZb = sp(/^(bis|uhrzeit bis|bis uhr)$/);
  const raus = [];
  zeilen.slice(kopfNr + 1).forEach((z, n) => {
    const w = c => c < 0 ? "" : text(z[c]);
    const name = String(w(cName) ?? "").trim();
    const d = w(cVon);
    const leer = v => v === "" || v === null || v === undefined;
    const zVon = w(cZv), zBis = w(cZb);
    // Leere Zeilen und die vorgedruckten Namen der Vorlage ohne Termin überspringen
    if (leer(d) && leer(w(cArt)) && leer(zVon) && leer(zBis)) return;
    if (/^beispiel/i.test(name)) return;                                   // Musterzeile der Vorlage
    const mitZeit = (zVon !== "" && zVon !== null && zVon !== undefined) || (zBis !== "" && zBis !== null && zBis !== undefined);
    const artText = String(w(cArt) ?? "").trim();
    raus.push({quelle: `${quelle}, Zeile ${kopfNr + n + 2}`, name, filiale:"",
               von: datumAusText(d), bis: cBis < 0 || !w(cBis) ? null : datumAusText(w(cBis)),
               artText, art: terminArtAus(artText, mitZeit),
               zVon: mitZeit ? uhrAusText(zVon) : "", zBis: mitZeit ? uhrAusText(zBis) : "", mitZeit});
  });
  return raus;
}

function csvZeilen(text){
  const erste = text.split(/\r?\n/)[0] || "";
  const trenn = erste.includes("\t") ? "\t" : (erste.match(/;/g) || []).length >= (erste.match(/,/g) || []).length ? ";" : ",";
  return text.split(/\r?\n/).map(z => z.split(trenn).map(v => v.replace(/^"(.*)"$/, "$1").trim()));
}

/* Aus den gelesenen Einträgen eine Liste je Mitarbeiter und Tag machen und jeden
   Tag prüfen. Ergebnis je Zeile: ok (neu), gleich (steht schon so da), ersetzt
   (anderer Eintrag würde überschrieben), fehler (wird nicht übernommen). */

function termineVorbereiten(eintraege){
  const ms = state.mitarbeiter;
  const zuordnung = state.namensZuordnung || {};
  const heute = montagDer(null);
  const zeilen = [];
  const wer = name => {
    const n = namensForm(name);
    if (!n) return {i:-1, grund:"ohne Namen"};
    if (zuordnung[n] !== undefined){ const i = ms.findIndex(m => m.name === zuordnung[n]); if (i >= 0) return {i}; }
    const genau = ms.map((m,i) => i).filter(i => namensForm(ms[i].name) === n);
    if (genau.length === 1) return {i:genau[0]};
    // „Petra“ oder „Naumann“ allein: nur, wenn es genau eine Person mit diesem Namensteil gibt
    const teil = ms.map((m,i) => i).filter(i => namensForm(ms[i].name).split(" ").includes(n)
                                             || namensForm(ms[i].name).startsWith(n + " "));
    if (teil.length === 1) return {i:teil[0]};
    return {i:-1, grund: teil.length > 1 ? "Name passt auf mehrere" : "Name nicht im Personal"};
  };
  eintraege.forEach(e => {
    const basis = {quelle:e.quelle, nameRoh:e.name, art:e.art, zVon:e.zVon, zBis:e.zBis, online:!!e.online};
    const zu = wer(e.name);
    const fehler = t => zeilen.push(Object.assign({}, basis, {status:"fehler", grund:t, datum:e.von, i:zu.i}));
    if (e.filiale && state.nr && key(e.filiale) !== key(state.nr)) return fehler(`gehört zu Filiale ${e.filiale}`);
    if (!e.von) return fehler("Datum fehlt oder ist nicht lesbar");
    if (e.bis && e.bis < e.von) return fehler("„bis“ liegt vor dem Anfang");
    if (!e.art) return fehler(e.mitZeit ? `„${e.artText || "?"}“ mit Uhrzeit nicht verständlich — „nur“ oder „nicht“?`
                                        : `„${e.artText || "(leer)"}“ ist keine bekannte Art`);
    if (e.mitZeit){
      if (!e.zVon || !e.zBis) return fehler("Uhrzeit nicht lesbar");
      if (minuten(e.zBis) <= minuten(e.zVon)) return fehler("Uhrzeit „bis“ liegt nicht nach „von“");
    }
    const ende = e.bis || e.von;
    if ((ende - e.von) / 864e5 > 62) return fehler("Zeitraum länger als zwei Monate — bitte prüfen und aufteilen");
    for (let d = new Date(e.von); d <= ende; d.setDate(d.getDate() + 1)){
      const tagNr = (d.getDay() + 6) % 7;
      const zeile = Object.assign({}, basis, {datum:new Date(d), i:zu.i});
      if (tagNr === 6){ if (!e.bis) zeilen.push(Object.assign(zeile, {status:"gleich", grund:"Sonntag — geschlossen"})); continue; }
      if (istFeiertag(d)){ zeilen.push(Object.assign(zeile, {status:"gleich", grund:"Feiertag — geschlossen"})); continue; }
      if (montagDer(isoVon(d)) < heute){ zeilen.push(Object.assign(zeile, {status:"fehler", grund:"liegt in einer vergangenen Woche"})); continue; }
      if (zu.i < 0){ zeilen.push(Object.assign(zeile, {status:"fehler", grund:zu.grund, offenerName:true})); continue; }
      zeilen.push(terminVergleichen(zeile));
    }
  });
  return zeilen;
}

// Steht für diesen Tag schon etwas — und ist es dasselbe?
function terminVergleichen(z){
  const sl = wochenSchluessel(z.datum), tag = TAGE[(z.datum.getDay() + 6) % 7][0];
  const neu = (z.art === "nur" || z.art === "ohne") ? {a:z.art, von:z.zVon, bis:z.zBis} : z.art;
  const alt = (((state.abwesend || {})[sl] || {})[z.i] || {})[tag];
  // „frei verfügbar“ aus einer Online-Abgabe: einen Tag nur dann leeren, wenn dort
  // steht, was eine frühere Abgabe hineingeschrieben hat. Was du von Hand eingetragen
  // hast, wird angezeigt, aber nicht vorausgewählt.
  if (z.art === "frei"){
    const plan = !!state.plaene[sl];
    if (!alt) return Object.assign(z, {sl, tag, neu:null, status:"gleich", grund:"frei verfügbar", plan});
    const altText = typeof alt === "string" ? terminArtText(alt) : terminArtText(alt.a, alt.von, alt.bis);
    const vorher = (((state.onlineStand || {})[sl] || {})[z.i] || {})[tag];
    const vonAbgabe = vorher !== undefined && JSON.stringify(vorher) === JSON.stringify(alt);
    return Object.assign(z, {sl, tag, neu:null, status:"ersetzt", an: vonAbgabe, plan,
      grund: vonAbgabe ? `wird wieder frei (vorher „${altText}“)` : `laut Abgabe frei — von Hand steht „${altText}“`});
  }
  const gleich = alt && JSON.stringify(alt) === JSON.stringify(neu);
  const altText = !alt ? "" : typeof alt === "string" ? terminArtText(alt) : terminArtText(alt.a, alt.von, alt.bis);
  return Object.assign(z, {sl, tag, neu, status: gleich ? "gleich" : alt ? "ersetzt" : "ok",
    grund: gleich ? "steht schon so da" : alt ? `ersetzt „${altText}“` : "", plan: !!state.plaene[sl]});
}

// Übernehmen, was angehakt ist — und merken, was vorher dastand
function termineUebernehmen(zeilen, quelle){
  const rueck = [];
  zeilen.forEach(z => {
    state.abwesend[z.sl] = state.abwesend[z.sl] || {};
    const w = state.abwesend[z.sl][z.i] = state.abwesend[z.sl][z.i] || {};
    rueck.push({sl:z.sl, i:z.i, name:state.mitarbeiter[z.i].name, tag:z.tag, vorher: w[z.tag] === undefined ? null : w[z.tag]});
    if (z.neu === null) delete w[z.tag]; else w[z.tag] = z.neu;
    if (z.online){
      // merken, was die Abgabe hineingeschrieben hat — beim nächsten Abholen zählt das
      state.onlineStand = state.onlineStand || {};
      const o = ((state.onlineStand[z.sl] = state.onlineStand[z.sl] || {})[z.i] = state.onlineStand[z.sl][z.i] || {});
      if (z.neu === null) delete o[z.tag]; else o[z.tag] = z.neu;
    }
  });
  const wochen = [...new Set(zeilen.map(z => z.sl))].sort();
  state.terminImport = {am: new Date().toISOString(), quelle, anzahl: zeilen.length, wochen, rueck};
  return wochen;
}

function terminImportZuruecknehmen(){
  const imp = state.terminImport;
  if (!imp || !imp.rueck) return 0;
  imp.rueck.forEach(r => {
    // über den Namen, falls sich die Liste inzwischen verschoben hat
    const i = state.mitarbeiter.findIndex(m => m.name === r.name);
    if (i < 0) return;
    state.abwesend[r.sl] = state.abwesend[r.sl] || {};
    const w = state.abwesend[r.sl][i] = state.abwesend[r.sl][i] || {};
    if (r.vorher === null) delete w[r.tag]; else w[r.tag] = r.vorher;
  });
  const n = imp.rueck.length;
  delete state.terminImport;
  return n;
}

// ==== kern/11-archiv.js ====
/* Archiv: Fristen und Aufräumen */

/* ---- Archiv ---------------------------------------------------------- */

const ARCHIV_WOCHEN = REGELN.archivWochen;

const ARCHIV_WARNUNG = REGELN.archivWarnung;

// Ins Archiv wandert eine Woche erst, wenn sie vorbei ist — die laufende
// und die kommende stehen oben auf der Startseite.
function archivSchluessel(){
  const jetzt = wochenSchluessel(aktuellerMontag());
  return Object.keys(state.plaene).filter(s => s < jetzt).sort().reverse();
}

function listenArchivSchluessel(){
  const jetzt = wochenSchluessel(aktuellerMontag());
  return Object.keys(state.listen || {}).filter(s => s < jetzt).sort().reverse();
}

// Was läuft demnächst ab, was ist schon zu alt?
function archivFaellig(){
  const bald = [], weg = [];
  const pruefe = (sl, quelle, art) => {
    const n = wochenZurueck(sl, quelle);
    if (n > ARCHIV_WOCHEN) weg.push({sl, art});
    else if (n >= ARCHIV_WARNUNG) bald.push({sl, art, wochen: ARCHIV_WOCHEN - n});
  };
  archivSchluessel().forEach(sl => pruefe(sl, state.plaene, "plan"));
  listenArchivSchluessel().forEach(sl => pruefe(sl, state.listen, "liste"));
  return {bald, weg};
}

// Gelöscht wird nur, worauf vorher einzeln hingewiesen wurde. Wer die App zwei
// Wochen nicht öffnet, verliert also nichts ungesehen.
function archivAufraeumen(){
  const gewarnt = state.archivGewarnt || {};
  const {weg} = archivFaellig();
  const loeschen = weg.filter(x => gewarnt[x.art + ":" + x.sl]).sort((a,b) => a.sl < b.sl ? -1 : 1);
  loeschen.forEach(x => {
    if (x.art === "plan"){ bisInStandUebernehmen(x.sl); delete state.plaene[x.sl]; }
    else delete state.listen[x.sl];
    delete gewarnt[x.art + ":" + x.sl];
  });
  // Abwesenheiten (darunter Krankheitstage) nicht länger aufheben als den Plan
  const jetzt = aktuellerMontag();
  const zuAlt = sl => (jetzt - montagAusSchluessel(sl)) / (7*864e5) > ARCHIV_WOCHEN;
  let geaendert = loeschen.length;
  Object.keys(state.abwesend || {}).sort().forEach(sl => {
    if (zuAlt(sl)){ bisInStandUebernehmen(sl); delete state.abwesend[sl]; geaendert++; }
  });
  Object.keys(state.phasen || {}).forEach(sl => { if (zuAlt(sl)){ delete state.phasen[sl]; geaendert++; } });
  ["onlineStand", "onlineImport"].forEach(f => Object.keys(state[f] || {}).forEach(sl => {
    if (zuAlt(sl)){ delete state[f][sl]; geaendert++; } }));
  if (geaendert) speichere();
  return loeschen.length;
}

// ==== kern/12-optimierer.js ====
/* Optimierer: die Woche als gemischt-ganzzahliges Programm (MILP), gelöst mit HiGHS.

   Der Planer oben baut Lücke für Lücke und bessert nach — schnell, aber ohne zu wissen,
   wie gut das Ergebnis ist. Hier wird die ganze Woche auf einmal entschieden:

   · Für jede Person und jeden Tag werden alle erlaubten Schichten erzeugt (Beginn im
     Halbstundenraster, 4 bis 8,5 h lang, mit gesetzlicher Pause). Abwesenheit,
     Jugendschutz und Tageshöchstzeit sind schon beim Erzeugen ausgeschlossen.
   · Je Schicht eine Ja/Nein-Variable. Je Person höchstens eine Schicht am Tag,
     höchstens 6 (Jugendliche 5) Tage, Ruhezeit zwischen den Tagen, Jugendliche ≤ 40 h.
   · Jede halbe Stunde: Schichtführung mit Schlüssel, Kasse während der Öffnung, jede
     Aufgabe mit der nötigen Funktion, Mindestzahl an Personen. Fehlt jemand, kostet
     das sehr viel — so bleibt das Modell lösbar und zeigt die Lücke.
   · Ziel: wenig Stunden, Vertrags- und Kontoziele treffen (Minus- und Überstunden
     gewichtet wie im Planer), möglichst wenige, lange Schichten.

   Pausen liegen im Modell noch nicht fest; sie werden danach so gelegt, dass Kasse und
   Aufgaben besetzt bleiben. Wird der Plan dadurch schlechter als der des Planers, gilt
   der Plan des Planers. Ein zweites, kleines Modell rechnet die Stunden aus, mit denen
   die Woche mindestens auskäme — die ehrliche Messlatte unter jedem Plan. */

const OPT = Object.freeze({
  zeitlimit: 8,           // Sekunden je Lauf — danach gilt die beste bis dahin gefundene Lösung
  luecke: 500,            // Kosten einer unbesetzten halben Stunde
  stunde: 1,              // Kosten einer geplanten Stunde
  unterZiel: 4,           // je Stunde unter dem Ziel (Minusstunden entstehen)
  ueberZiel: 4,           // je Stunde über dem Ziel, mal Gewicht der Person
  schicht: 0.3,           // je Schicht — lieber wenige lange als viele kurze
  freiLautStandard: 40,   // Schicht an einem Tag, den die Standardwoche frei lässt
  ueberListe: 6           // je leistungswirksame Stunde über der Stundenliste
});

let _highs = null, _highsVersucht = false;
// HiGHS erst laden, wenn es gebraucht wird — das WebAssembly ist 3,5 MB groß und soll den
// Start der App nicht bremsen. In der App liegen die Dateien neben der Seite; auf claude.ai
// kommt highs.js vom CDN (HIGHS_ORT im Kopf der Seite).
function highsSkripte(){
  if (typeof window === "undefined" || !window.document || typeof Module === "function") return Promise.resolve();
  // Nie ewig warten: Kommt ein Skript nicht, rechnet eben der Planer allein
  const laden = src => new Promise(ok => {
    const s = document.createElement("script");
    s.src = src; s.onload = ok; s.onerror = ok;
    setTimeout(ok, 15000);
    document.head.appendChild(s);
  });
  if (typeof HIGHS_ORT === "string") return laden(HIGHS_ORT + "highs.js");
  return laden("highs.js").then(() => laden("highs-wasm.js"));
}
async function highsLaden(){
  if (_highs || _highsVersucht) return _highs;
  _highsVersucht = true;
  try {
    if (globalThis.__highsFuerTests){ _highs = globalThis.__highsFuerTests; return _highs; }
    await highsSkripte();
    const fabrik = typeof Module === "function" ? Module : null;     // aus highs.js
    if (!fabrik) return null;
    const einstellung = {};
    if (typeof HIGHS_WASM_B64 === "string"){
      // Das WebAssembly liegt als Text bei — aus einer lokalen Datei in der App darf die
      // Seite nichts nachladen. HiGHS 1.15 nimmt es nur über instantiateWasm entgegen.
      const roh = atob(HIGHS_WASM_B64), bytes = new Uint8Array(roh.length);
      for (let i = 0; i < roh.length; i++) bytes[i] = roh.charCodeAt(i);
      einstellung.instantiateWasm = (imports, fertig) => {
        WebAssembly.instantiate(bytes, imports).then(r => fertig(r.instance));
        return {};
      };
    } else if (typeof HIGHS_ORT === "string") einstellung.locateFile = f => HIGHS_ORT + f;
    _highs = await fabrik(einstellung);
  } catch(e){ _highs = null; }
  return _highs;
}

// Alle Zeitpunkte eines Tages, an denen die Besetzung geprüft wird — wie in tagesMaengel
function tagesRaster(tag){
  const offenVon = hatZeit(state.von) ? minuten(state.von) : 8*60;
  const offenBis = hatZeit(state.bis) ? minuten(state.bis) : 21*60;
  const auf = tag.aufgaben || [];
  const tagVon = Math.min(offenVon, ...auf.map(a => a.von));
  const tagBis = Math.max(offenBis, ...auf.map(a => a.bis));
  const punkte = [];
  for (let m = tagVon; m < tagBis; m += 30) punkte.push(m);
  return {offenVon, offenBis, tagVon, tagBis, punkte};
}

/* Das Modell einer Woche. modus: "plan" (alles) oder "mindest" (nur Stunden zählen).
   extra (für den Ausfall-Assistenten): vorhanden — die Schichten des bestehenden Plans
   [{i, ti, von, bis}]; sie bleiben möglich und sind billiger (behalten), damit sich so
   wenig wie möglich ändert. Vor dem Tag nurVorhandenVor ändert sich gar nichts mehr. */
function wochenModell(mo, vorgabe, modus, summe, extra){
  extra = extra || {};
  const vorhanden = extra.vorhanden || [];
  const ms = state.mitarbeiter;
  const sl = wochenSchluessel(mo);
  const abw = (state.abwesend || {})[sl] || {};
  const offenVon = hatZeit(state.von) ? minuten(state.von) : 8*60;
  const offenBis = hatZeit(state.bis) ? minuten(state.bis) : 21*60;
  const wechsel = hatZeit(state.wechsel) ? minuten(state.wechsel) : Math.round((offenVon + offenBis)/2);
  const aussen = state.allein ? 1 : MIN_BESETZUNG;
  const minderj = i => { const a = alter(ms[i].geb); return a !== null && a < 18; };
  const fuehrt = (i, q) => ms[i].typ === "Filialleitung" || (ms[i].qual || []).includes(q);
  const kann = (i, q) => !q || (ms[i].qual || []).includes(q);
  const hatStandard = i => TAGE.some(([k]) => schicht(ms[i], k));
  const darf = (i, k, von, bis) => {
    const e = (abw[i] || {})[k];
    if (!e) return true;
    if (typeof e === "string") return false;
    const a = hatZeit(e.von) ? minuten(e.von) : null, b = hatZeit(e.bis) ? minuten(e.bis) : null;
    if (a === null || b === null || b <= a) return true;
    return e.a === "nur" ? (von >= a && bis <= b) : (bis <= a || von >= b);
  };

  const tage = TAGE.map(([key, label], ti) => {
    const d = new Date(mo); d.setDate(mo.getDate() + ti);
    const feiertag = istFeiertag(d);
    const tag = {key, label, datum: d, feiertag, schichten: [], aufgaben: []};
    if (!feiertag) tag.aufgaben = aufgabenAmTag(key, offenVon, offenBis, vorgabe);
    return tag;
  });

  // --- Schichtkandidaten ---
  const kand = [];                 // {i, ti, von, bis, arbeit, pause, fest, freiStd}
  const fest = {};                 // "i/ti" → Kandidat der Standardschicht
  const meldungen = [];
  tage.forEach((tag, ti) => {
    if (tag.feiertag) return;
    const r = tagesRaster(tag);
    ms.forEach((m, i) => {
      const minder = minderj(i);
      const schonDa = vorhanden.filter(v => v.i === i && v.ti === ti);
      // Vergangene Tage: genau so, wie sie im Plan stehen
      if (extra.nurVorhandenVor !== undefined && ti < extra.nurVorhandenVor){
        schonDa.forEach(v => {
          const anw = (v.bis - v.von)/60, p = pauseFuer(m, anw);
          const k = {i, ti, von: v.von, bis: v.bis, arbeit: anw - p, pause: p, fest: true, freiStd: false, vorhanden: true};
          kand.push(k); fest[i + "/" + ti] = k;
        });
        return;
      }
      const std = schicht(m, tag.key);
      if (std){
        if (darf(i, tag.key, std.von, std.bis)){
          const k = {i, ti, von: std.von, bis: std.bis, arbeit: std.arbeit, pause: std.pause, fest: true, freiStd: false};
          kand.push(k); fest[i + "/" + ti] = k;
          return;
        }
        const e = (abw[i] || {})[tag.key];
        meldungen.push({art:"warn", text:`${tag.label}: ${m.name} ${typeof e === "string" ? "fällt aus" : "ist nur eingeschränkt da"} — die Standardschicht entfällt und wird anders besetzt.`});
      }
      const freiStd = hatStandard(i) && !std;
      for (let von = r.tagVon; von + MINSCHICHT*60 <= r.tagBis; von += 30){
        const enden = new Set();
        for (let l = MINSCHICHT*60; l <= REGELN.maxAnwesenheit*60; l += 30) enden.add(Math.min(von + l, r.tagBis));
        enden.forEach(bis => {
          if (bis - von < MINSCHICHT*60) return;
          if (minder && !jugendZeit(von, bis)) return;
          if (!darf(i, tag.key, von, bis)) return;
          const anw = (bis - von)/60, p = pauseFuer(m, anw);
          if (anw - p > MAXARBEIT + 0.001) return;
          kand.push({i, ti, von, bis, arbeit: anw - p, pause: p, fest: false, freiStd,
                     vorhanden: schonDa.some(v => v.von === von && v.bis === bis)});
        });
      }
      // Was im Plan steht, aber nicht im Raster liegt (von Hand geändert), bleibt möglich
      schonDa.forEach(v => {
        if (kand.some(k => k.i === i && k.ti === ti && k.von === v.von && k.bis === v.bis)) return;
        if (!darf(i, tag.key, v.von, v.bis)) return;
        const anw = (v.bis - v.von)/60, p = pauseFuer(m, anw);
        kand.push({i, ti, von: v.von, bis: v.bis, arbeit: anw - p, pause: p, fest: false, freiStd, vorhanden: true});
      });
    });
  });

  // --- Programm im LP-Format ---
  const ziele = [], nb = [], grenzen = [], binaer = [];
  const v = n => "x" + n;
  kand.forEach((k, n) => {
    let kosten = OPT.stunde * k.arbeit;
    if (modus === "plan"){
      kosten += OPT.schicht;
      if (k.freiStd) kosten += OPT.freiLautStandard;
      if (k.vorhanden && extra.behalten) kosten -= extra.behalten;
    }
    ziele.push([kosten, v(n)]);
    binaer.push(v(n));
    if (k.fest) grenzen.push(`${v(n)} = 1`);
  });
  let schlupf = 0;
  const luecke = (zeile, rechts, art, ti, m) => {
    const s = "s" + (schlupf++);
    ziele.push([OPT.luecke, s]);
    zeile.push([1, s]);
    nb.push({name: `bes${ti}_${art}_${m}`, terme: zeile, op: ">=", rechts});
    grenzen.push(`0 <= ${s} <= ${rechts}`);
    return s;
  };

  // Besetzung je halbe Stunde
  const schlupfInfo = [];
  tage.forEach((tag, ti) => {
    if (tag.feiertag) return;
    const r = tagesRaster(tag);
    const hier = kand.map((k, n) => [k, n]).filter(([k]) => k.ti === ti);
    r.punkte.forEach(m => {
      const da = hier.filter(([k]) => k.von <= m && k.bis > m);
      const drin = m >= r.offenVon && m < r.offenBis;
      const q = m < wechsel ? "frueh" : "spaet";
      const merke = (s, art, text) => schlupfInfo.push({s, ti, m, art, text});
      merke(luecke(da.filter(([k]) => fuehrt(k.i, q)).map(([, n]) => [1, v(n)]), 1, "f", ti, m), "fuehrung", "die Schichtführung");
      if (drin) merke(luecke(da.filter(([k]) => kann(k.i, "kasse")).map(([, n]) => [1, v(n)]), 1, "k", ti, m), "kasse", "die Kasse");
      tag.aufgaben.forEach((a, ai) => {
        if (a.von > m || a.bis <= m || !a.braucht) return;
        merke(luecke(da.filter(([k]) => kann(k.i, a.braucht)).map(([, n]) => [1, v(n)]), a.pers, "a" + ai, ti, m), "aufgabe", a.name);
      });
      merke(luecke(da.map(([, n]) => [1, v(n)]), personenBedarf(tag.aufgaben, m, drin, aussen), "n", ti, m), "anzahl", "die Mindestbesetzung");
    });
  });

  // Je Person: ein Einsatz am Tag, Tage, Ruhezeit, Jugendliche ≤ 40 h
  ms.forEach((m, i) => {
    const minder = minderj(i);
    const eigene = kand.map((k, n) => [k, n]).filter(([k]) => k.i === i);
    TAGE.forEach((_, ti) => {
      const heute = eigene.filter(([k]) => k.ti === ti);
      if (heute.length > 1) nb.push({name: `ein${i}_${ti}`, terme: heute.map(([, n]) => [1, v(n)]), op: "<=", rechts: 1});
    });
    if (eigene.length) nb.push({name: `tage${i}`, terme: eigene.map(([, n]) => [1, v(n)]), op: "<=", rechts: maxTageFuer(minder)});
    if (minder && eigene.length) nb.push({name: `jung${i}`, terme: eigene.map(([k, n]) => [k.arbeit, v(n)]), op: "<=", rechts: 40});
    const ruhe = ruhezeitFuer(minder) * 60;
    for (let ti = 1; ti < 6; ti++){
      if (fest[i + "/" + ti] && fest[i + "/" + (ti-1)]) continue;      // beides fest: so gewollt
      const heute = eigene.filter(([k]) => k.ti === ti), gestern = eigene.filter(([k]) => k.ti === ti - 1);
      if (!heute.length || !gestern.length) continue;
      [...new Set(heute.map(([k]) => k.von))].forEach(s => {
        const zu = gestern.filter(([k]) => k.bis > s + 24*60 - ruhe);
        if (!zu.length) return;
        nb.push({name: `ruhe${i}_${ti}_${s}`, op: "<=", rechts: 1,
                 terme: heute.filter(([k]) => k.von <= s).map(([, n]) => [1, v(n)]).concat(zu.map(([, n]) => [1, v(n)]))});
      });
    }
  });

  // Ziele je Person (nur im vollen Modell)
  if (modus === "plan"){
    const ph = vorgabe.phase;
    const sparen = ph.art === "sparen";
    ms.forEach((m, i) => {
      const eigene = kand.map((k, n) => [k, n]).filter(([k]) => k.i === i);
      if (!eigene.length) return;
      const ziel = vorgabe.ziel[i] || 0;
      const st = (vorgabe.start && vorgabe.start[i]) || 0;
      const gewichtUnter = (sparen ? 0.5 : OPT.unterZiel) * (1 + Math.max(0, -st) / 8);
      const gewichtUeber = OPT.ueberZiel * ueberGewicht(m) * (1 + Math.max(0, st) / 8);
      nb.push({name: `ziel${i}`, op: "=", rechts: ziel,
               terme: eigene.map(([k, n]) => [k.arbeit, v(n)]).concat([[-1, "o" + i], [1, "u" + i]])});
      ziele.push([gewichtUeber, "o" + i], [gewichtUnter, "u" + i]);
      grenzen.push(`o${i} >= 0`, `u${i} >= 0`);
    });
    const alle = kand.map((k, n) => [k.arbeit, v(n)]);
    // Stundenliste als Obergrenze (leistungswirksame Stunden)
    const liste = (state.listen || {})[sl];
    const vorgabeListe = liste ? TAGE.reduce((x, [k]) => x + nz(liste.stunden[k]), 0) : 0;
    if (vorgabeListe > 0 && !sparen){
      nb.push({name: "liste", op: "<=", rechts: vorgabeListe,
               terme: kand.map((k, n) => [k.arbeit * faktor(ms[k.i]), v(n)]).concat([[-1, "ueL"]])});
      ziele.push([OPT.ueberListe, "ueL"]); grenzen.push("ueL >= 0");
    }
    // Wochensumme: Sparwoche drückt, Mehrbedarf deckelt
    if (sparen){
      if (summe && summe.bis > 0){
        nb.push({name: "spar", op: "<=", rechts: summe.bis, terme: alle.concat([[-1, "ueS"]])});
        ziele.push([10, "ueS"]); grenzen.push("ueS >= 0");
      } else ziele.forEach(z => { if (/^x/.test(z[1])) z[0] += 9 * kand[+z[1].slice(1)].arbeit; });
    }
    if (summe && summe.auf !== undefined){
      nb.push({name: "mehr", op: "<=", rechts: summe.auf, terme: alle.concat([[-1, "ueM"]])});
      ziele.push([3, "ueM"]); grenzen.push("ueM >= 0");
    }
  }

  const zahl = x => Number.isInteger(x) ? String(x) : String(Math.round(x * 10000) / 10000);
  // Lange Zeilen bricht der LP-Leser von HiGHS nicht — höchstens 20 Namen je Zeile
  const zeilenweise = namen => { const z = []; for (let i = 0; i < namen.length; i += 20) z.push(" " + namen.slice(i, i + 20).join(" ")); return z; };
  const ausdruck = terme => {
    const teile = terme.map(([c, n]) => `${c < 0 ? "-" : "+"} ${zahl(Math.abs(c))} ${n}`);
    const zeilen = [];
    for (let i = 0; i < teile.length; i += 12) zeilen.push(" " + teile.slice(i, i + 12).join(" "));
    return zeilen.join("\n") || " 0 x0";
  };
  const lp = ["Minimize", " obj:", ausdruck(ziele), "Subject To"]
    .concat(nb.filter(c => c.terme.length).map(c => ` ${c.name}:\n${ausdruck(c.terme)} ${c.op} ${zahl(c.rechts)}`))
    .concat(["Bounds"], grenzen.map(g => " " + g), ["Binary"], zeilenweise(binaer), ["End"]).join("\n");
  return {lp, kand, tage, meldungen, schlupfInfo};
}

// Ruft HiGHS; liefert die gewählten Kandidaten oder null
function loese(highs, modell, limit){
  // (output_flag: false darf nicht gesetzt werden — highs-js liest die Lösung aus der Ausgabe)
  const r = highs.solve(modell.lp, {time_limit: limit || OPT.zeitlimit, mip_rel_gap: 0.01});
  if (!r || !["Optimal", "Time limit reached"].includes(r.Status) || !isFinite(r.ObjectiveValue)) return null;
  const wert = n => (r.Columns[n] || {}).Primal || 0;
  return {status: r.Status, ziel: r.ObjectiveValue, gewaehlt: modell.kand.filter((k, n) => wert("x" + n) > 0.5),
          schlupf: modell.schlupfInfo.filter(s => wert(s.s) > 0.01)};
}

// Pausen so legen, dass Kasse und Aufgaben besetzt bleiben — wie pausenVersetzen im Planer
function pausenLegen(plan){
  const ms = state.mitarbeiter;
  plan.tage.forEach((t, ti) => {
    if (t.feiertag) return;
    const mitte = s => Math.round((s.von + (s.bis - s.von)/2 - s.pause*30) / 15) * 15;
    const minderj = s => { const a = alter(ms[s.mi].geb); return a !== null && a < 18; };
    const lagen = s => {
      const laenge = s.pause * 60, am = amStueckFuer(minderj(s)), raus = [];
      for (let pv = s.von + 60; pv + laenge <= s.bis - 60; pv += 15)
        if (pv - s.von <= am && s.bis - (pv + laenge) <= am) raus.push(pv);
      return raus;
    };
    t.schichten.forEach(s => {
      if (!s.pause){ s.pauseVon = null; s.pauseBis = null; return; }
      const l = lagen(s), m = mitte(s);
      const pv = l.length ? l.reduce((b, x) => Math.abs(x - m) < Math.abs(b - m) ? x : b, l[0]) : m;
      s.pauseVon = pv; s.pauseBis = pv + s.pause * 60;
    });
    for (let runde = 0; runde < 2; runde++){
      t.schichten.forEach(s => {
        if (!s.pause) return;
        const m = mitte(s);
        let beste = s.pauseVon, besteZahl = tagesMaengel(plan, ti), besteAbstand = Math.abs(s.pauseVon - m);
        lagen(s).forEach(pv => {
          s.pauseVon = pv; s.pauseBis = pv + s.pause * 60;
          const z = tagesMaengel(plan, ti), ab = Math.abs(pv - m);
          if (z < besteZahl || (z === besteZahl && ab < besteAbstand - 0.1)){ beste = pv; besteZahl = z; besteAbstand = ab; }
        });
        s.pauseVon = beste; s.pauseBis = beste + s.pause * 60;
      });
    }
  });
}

// Rollen nachtragen: Standard, Aufgaben, sonst Kasse/Fläche
function rollenLegen(plan){
  const ms = state.mitarbeiter;
  const kann = (s, q) => !q || (ms[s.mi].qual || []).includes(q);
  plan.tage.forEach(t => {
    t.schichten.forEach(s => s.rollen = s.fest ? ["Standard"] : []);
    t.aufgaben.forEach(a => {
      t.schichten.filter(s => s.von <= a.von && s.bis >= a.bis && kann(s, a.braucht)).slice(0, a.pers)
        .forEach(s => { if (!s.rollen.includes(a.name)) s.rollen.push(a.name); });
    });
    t.schichten.forEach(s => { if (!s.rollen.length) s.rollen.push(kann(s, "kasse") ? "Kasse" : "Fläche"); });
  });
}

/* Ein Plan aus dem Optimierer, im selben Format wie baueWoche. null, wenn HiGHS fehlt
   oder keine Lösung findet. */
async function optimiereRoh(montagISO, phase, summe, basisPlan){
  const highs = await highsLaden();
  if (!highs) return null;
  const mo = montagDer(montagISO);
  const vorgabe = wochenVorgabe(mo, phase);
  vorgabe.basisPlan = basisPlan || null;
  const modell = wochenModell(mo, vorgabe, "plan", summe);
  let erg;
  try { erg = loese(highs, modell); } catch(e){ return null; }
  if (!erg) return null;
  const plan = {mo, tage: modell.tage, meldungen: modell.meldungen.slice(), konto: [],
                ziel: vorgabe.ziel, start: vorgabe.start, vorgabe, phase: vorgabe.phase};
  erg.gewaehlt.forEach(k => plan.tage[k.ti].schichten.push({mi: k.i, von: k.von, bis: k.bis, pause: k.pause,
    arbeit: k.arbeit, pauseVon: null, pauseBis: null, rollen: [], fest: k.fest, mehrarbeit: false}));
  plan.tage.forEach(t => t.schichten.sort((x, y) => x.von - y.von || x.mi - y.mi));
  pausenLegen(plan);
  rollenLegen(plan);
  plan.tage.forEach(t => t.schichten.forEach(s => delete s.fest));
  // Lücken, die niemand füllen kann, wie der Planer melden — zusammenhängend je Art
  const segmente = {};
  erg.schlupf.forEach(s => {
    const k = s.ti + "/" + s.text;
    (segmente[k] = segmente[k] || []).push(s.m);
  });
  Object.entries(segmente).forEach(([k, punkte]) => {
    const [ti, text] = [+k.split("/")[0], k.slice(k.indexOf("/") + 1)];
    punkte.sort((a, b) => a - b);
    let anfang = punkte[0], vor = punkte[0];
    const melden = (a, b) => plan.meldungen.push({art:"bad",
      text:`${plan.tage[ti].label} ${hhmm(a)}–${hhmm(b)}: Für ${text} ist niemand verfügbar, der einsetzbar wäre.`});
    punkte.slice(1).forEach(p => { if (p !== vor + 30){ melden(anfang, vor + 30); anfang = p; } vor = p; });
    melden(anfang, vor + 30);
  });
  plan.optimierer = {status: erg.status};
  nachrechnen(plan);
  return plan;
}

// Mit wie vielen Stunden käme die Woche mindestens aus? (Gesetz, Besetzung, Aufgaben,
// Standardwochen — ohne Vertrags- und Kontoziele)
async function mindestStunden(montagISO, phase){
  const highs = await highsLaden();
  if (!highs) return null;
  const mo = montagDer(montagISO);
  const vorgabe = wochenVorgabe(mo, phase);
  const modell = wochenModell(mo, vorgabe, "mindest");
  try {
    const erg = loese(highs, modell, 5);
    if (!erg) return null;
    return {stunden: erg.gewaehlt.reduce((s, k) => s + k.arbeit, 0), luecken: erg.schlupf.length, status: erg.status};
  } catch(e){ return null; }
}

/* Der Plan für die App: Optimierer und Planer rechnen beide; genommen wird der bessere
   nach derselben Gütezahl (Abweichung von den Zielen, unbesetzte Halbstunden, Zahl der
   Schichten). Dazu die Messlatte: Mindeststunden der Woche. */
async function erzeugePlanBest(montagISO, phase, fortschritt){
  const melde = t => { if (fortschritt) fortschritt(t); };
  melde("Planer rechnet …");
  const planer = erzeugePlan(montagISO, phase);
  melde("Optimierer rechnet …");
  const ph = phaseNormal(phase);
  let opt = null;
  try {
    if (ph.art === "normal") opt = await optimiereRoh(montagISO, ph);
    else {
      const normal = await optimiereRoh(montagISO, {art: "normal"});
      if (normal){
        const n = planSummen(normal).bezahlt;
        const summe = ph.art === "mehr" ? {auf: n + Math.max(0, nz(ph.mehr))}
                    : ph.sparArt === "stunden" ? {bis: n - Math.max(0, nz(ph.stunden))} : {bis: 0};
        opt = await optimiereRoh(montagISO, ph, summe, ph.art === "mehr" ? normal : null);
        if (opt) phasenMeldung(opt, ph, n);
      }
    }
  } catch(e){ opt = null; }
  melde("Messlatte …");
  const mindest = await mindestStunden(montagISO, ph);
  // Wer gewinnt? Erst zählen Lücken. Dann in einer Sparwoche die Stunden — darum geht
  // es dort —, sonst die Gütezahl (Ziele, Konten, Zahl der Schichten).
  let plan = planer, verfahren = "Planer";
  const besser = () => {
    const lo = planMaengel(opt), lp = planMaengel(planer);
    if (lo !== lp) return lo < lp;
    if (ph.art === "sparen") return planSummen(opt).bezahlt <= planSummen(planer).bezahlt + 0.01;
    return guete(opt) <= guete(planer);
  };
  if (opt && besser()){ plan = opt; verfahren = "Optimierer"; }
  plan.berechnung = {verfahren, optimiererVerfuegbar: !!(await highsLaden()),
    stunden: planSummen(plan).bezahlt, mindest: mindest ? mindest.stunden : null,
    vergleich: {planer: planSummen(planer).bezahlt, optimierer: opt ? planSummen(opt).bezahlt : null}};
  return plan;
}

// ==== kern/13-ausfall.js ====
/* Ausfall-Assistent: Jemand fällt aus — wer springt ein?

   Arbeitet auf einem gespeicherten Plan (planSpeichern-Format, Personen über plan.namen).
   Die Schicht der ausfallenden Person wird herausgenommen; dann werden Lösungen gesucht,
   die die Besetzung wieder vollständig machen, und nach Mehrstunden und Stundenkonto
   sortiert:
     · jemand, der an dem Tag frei hat, übernimmt die ganze Schicht
     · jemand, der frei hat, kommt nur für die Lücke (mindestens 4 h)
     · jemand, der ohnehin da ist, bleibt länger oder kommt früher
     · zwei, die ohnehin da sind: einer bleibt länger, einer kommt früher
   Jede Lösung hält Ruhezeit, Tageshöchstzeit, Jugendschutz, Abwesenheiten und Pausen ein.
   Geändert wird erst mit ausfallAnwenden(). */

const kopie = x => JSON.parse(JSON.stringify(x));

// Wer ist Person j eines gespeicherten Plans heute im Personal?
function planPerson(plan, j){
  const name = plan.namen ? plan.namen[j] : (state.mitarbeiter[j] || {}).name;
  const i = state.mitarbeiter.findIndex(m => m.name === name);
  return {i, m: state.mitarbeiter[i], name};
}
// Platz einer Person des Personals im Plan — wer noch nicht darin steht, wird angehängt
function planPlatz(plan, i){
  const name = state.mitarbeiter[i].name;
  if (!plan.namen) plan.namen = state.mitarbeiter.map(m => m.name);
  let j = plan.namen.indexOf(name);
  if (j < 0){ plan.namen.push(name); j = plan.namen.length - 1; }
  return j;
}

// Halbe Stunden eines Tages, in denen etwas fehlt
function fehlzeiten(plan, ti){
  const t = plan.tage[ti];
  if (!t || t.feiertag) return [];
  return tagesRaster(t).punkte.filter(m => tagesMaengelAm(plan, ti, m) > 0);
}
// Mängel nur an einem Zeitpunkt (dieselben Regeln wie tagesMaengel)
function tagesMaengelAm(plan, ti, m){
  const t = plan.tage[ti];
  const ms = state.mitarbeiter;
  const r = tagesRaster(t);
  const wechsel = hatZeit(state.wechsel) ? minuten(state.wechsel) : Math.round((r.offenVon + r.offenBis)/2);
  const aussen = state.allein ? 1 : MIN_BESETZUNG;
  const wer = s => (plan.namen ? ms.find(x => x.name === plan.namen[s.mi]) : ms[s.mi]) || {qual:[]};
  const kann = (s, q) => !q || (wer(s).qual || []).includes(q);
  const fuehrt = (s, q) => wer(s).typ === "Filialleitung" || (wer(s).qual || []).includes(q);
  const da = t.schichten.filter(s => s.von <= m && s.bis > m);
  const fl = da.filter(s => !(s.pauseVon !== null && s.pauseVon !== undefined && s.pauseVon <= m && s.pauseBis > m));
  const drin = m >= r.offenVon && m < r.offenBis;
  let n = 0;
  if (!da.some(s => fuehrt(s, m < wechsel ? "frueh" : "spaet"))) n++;
  if (drin && !fl.some(s => kann(s, "kasse"))) n++;
  for (const a of t.aufgaben || []){
    if (a.von > m || a.bis <= m) continue;
    const br = (WAREN.find(w => w.id === a.id) || {}).braucht;
    if (br && fl.filter(s => kann(s, br)).length < a.pers){ n++; break; }
  }
  if (da.length < personenBedarf(t.aufgaben || [], m, drin, aussen)) n++;
  return n;
}

// Darf Person j (Plan) am Tag ti von–bis arbeiten? Ohne die Schicht `ausser`.
function ausfallErlaubt(plan, j, ti, von, bis, ausser){
  const {i, m} = planPerson(plan, j);
  if (!m) return false;
  const minder = alter(m.geb) !== null && alter(m.geb) < 18;
  if (minder && !jugendZeit(von, bis)) return false;
  const anw = (bis - von)/60;
  if (anw - pauseFuer(m, anw) > MAXARBEIT + 0.01 || anw > REGELN.maxAnwesenheit + 0.01) return false;
  const e = (((state.abwesend || {})[wochenSchluessel(plan.mo instanceof Date ? plan.mo : montagDer(plan.mo))] || {})[i] || {})[TAGE[ti][0]];
  if (e){
    if (typeof e === "string") return false;
    const a = hatZeit(e.von) ? minuten(e.von) : null, b = hatZeit(e.bis) ? minuten(e.bis) : null;
    if (a !== null && b !== null && b > a && !(e.a === "nur" ? (von >= a && bis <= b) : (bis <= a || von >= b))) return false;
  }
  const ruhe = ruhezeitFuer(minder) * 60;
  const vor = ti > 0 ? plan.tage[ti-1].schichten.filter(x => x.mi === j && x !== ausser) : [];
  const nach = ti < plan.tage.length - 1 ? plan.tage[ti+1].schichten.filter(x => x.mi === j && x !== ausser) : [];
  if (vor.some(x => 24*60 - x.bis + von < ruhe - 0.5)) return false;
  if (nach.some(x => 24*60 - bis + x.von < ruhe - 0.5)) return false;
  const tage = new Set(plan.tage.map((t, k) => t.schichten.some(x => x.mi === j && x !== ausser) || k === ti ? k : -1).filter(k => k >= 0));
  if (tage.size > maxTageFuer(minder)) return false;
  if (minder){
    const woche = plan.tage.reduce((s, t, k) => s + t.schichten.filter(x => x.mi === j && x !== ausser && k !== ti).reduce((a, x) => a + x.arbeit, 0), 0);
    if (woche + anw - pauseFuer(m, anw) > 40 + 0.01) return false;
  }
  return true;
}

// Schicht auf von–bis setzen und die Pause so legen, dass der Tag besetzt bleibt
function schichtSetzen(plan, ti, s, von, bis){
  const {m} = planPerson(plan, s.mi);
  s.von = von; s.bis = bis;
  const anw = (bis - von)/60, p = pauseFuer(m, anw);
  s.pause = p; s.arbeit = anw - p;
  if (!p){ s.pauseVon = null; s.pauseBis = null; return; }
  const laenge = p * 60, minder = alter(m.geb) !== null && alter(m.geb) < 18, am = amStueckFuer(minder);
  const mitte = Math.round((von + (bis - von)/2 - laenge/2) / 15) * 15;
  let beste = null, besteZahl = Infinity, besteAbstand = Infinity;
  for (let pv = von + 60; pv + laenge <= bis - 60; pv += 15){
    if (pv - von > am || bis - (pv + laenge) > am) continue;
    s.pauseVon = pv; s.pauseBis = pv + laenge;
    const z = tagesMaengel(plan, ti), ab = Math.abs(pv - mitte);
    if (z < besteZahl || (z === besteZahl && ab < besteAbstand)){ beste = pv; besteZahl = z; besteAbstand = ab; }
  }
  if (beste === null) beste = Math.max(von + 30, mitte);
  s.pauseVon = beste; s.pauseBis = beste + laenge;
}

// Stunden und Konto einer Person nach einer Änderung
function kontoNach(plan, j, grundAusfall){
  const {i, m} = planPerson(plan, j);
  if (!m || !hatVertrag(m)) return null;
  const mo = plan.mo instanceof Date ? plan.mo : montagDer(plan.mo);
  const start = ueberstundenZuBeginn(mo)[i] || 0;
  const ist = plan.tage.reduce((s, t) => s + t.schichten.filter(x => x.mi === j).reduce((a, x) => a + x.arbeit, 0), 0);
  return {ist, soll: sollWoche(m, i, mo), ende: viertel(start + ist - sollWoche(m, i, mo))};
}

// Änderungen an einem Tag ausführen: neue Schicht oder bestehende Schicht verschieben
function aenderungenAnwenden(plan, ti, aenderungen){
  const tag = plan.tage[ti];
  aenderungen.forEach(a => {
    const j = planPlatz(plan, a.i);
    if (a.art === "neu"){
      const s = {mi: j, von: a.von, bis: a.bis, rollen: ["Vertretung"], mehrarbeit: false};
      tag.schichten.push(s);
      schichtSetzen(plan, ti, s, a.von, a.bis);
    } else {
      const s = tag.schichten.find(x => x.mi === j && x.von === a.alt[0] && x.bis === a.alt[1]);
      if (s) schichtSetzen(plan, ti, s, a.von, a.bis);
    }
  });
  tag.schichten.sort((x, y) => x.von - y.von || x.mi - y.mi);
  pausenNachbessern(plan, ti);
}
// Bleibt eine Lücke nur, weil gerade jemand Pause hat, die Pausen des Tages verschieben —
// jede nur, wenn es wirklich hilft; sonst bleibt sie, wo sie war
function pausenNachbessern(plan, ti){
  const tag = plan.tage[ti];
  for (let runde = 0; runde < 2 && tagesMaengel(plan, ti) > 0; runde++){
    tag.schichten.forEach(s => {
      if (!s.pause || s.pauseVon === null) return;
      const {m} = planPerson(plan, s.mi);
      const laenge = s.pause * 60, am = amStueckFuer(m && alter(m.geb) !== null && alter(m.geb) < 18);
      let beste = s.pauseVon, besteZahl = tagesMaengel(plan, ti);
      for (let pv = s.von + 60; pv + laenge <= s.bis - 60; pv += 15){
        if (pv - s.von > am || s.bis - (pv + laenge) > am) continue;
        s.pauseVon = pv; s.pauseBis = pv + laenge;
        const z = tagesMaengel(plan, ti);
        if (z < besteZahl){ beste = pv; besteZahl = z; }
      }
      s.pauseVon = beste; s.pauseBis = beste + laenge;
    });
  }
}
const tagesStunden = (plan, ti) => plan.tage[ti].schichten.reduce((s, x) => s + x.arbeit, 0);

/* Alle Wege, die Lücken eines Tages zu schließen. weg: die Zeit, die frei geworden ist
   (für „ganz übernehmen“). tiefe 0 erlaubt zusätzlich: jemand, der da ist, übernimmt die
   frei gewordene Schicht, und seine eigene wird ihrerseits gefüllt. */
function luekenSchliessen(basis, ti, weg, tiefe){
  const luecke = fehlzeiten(basis, ti);
  if (!luecke.length) return [{aenderungen: [], teile: []}];
  const g0 = Math.min(...luecke), g1 = Math.max(...luecke) + 30;
  const tag = basis.tage[ti], r = tagesRaster(tag);
  const raus = [];
  const probe = (aenderungen, teile) => {
    const plan = kopie(basis); plan.mo = basis.mo;
    aenderungen.forEach(a => {
      if (a.art === "neu" && !ausfallErlaubt(plan, planPlatz(plan, a.i), ti, a.von, a.bis)) throw "nein";
    });
    aenderungenAnwenden(plan, ti, aenderungen);
    if (tagesMaengel(plan, ti) === 0) raus.push({aenderungen, teile});
  };
  const versuch = (aenderungen, teile) => { try { probe(aenderungen, teile); } catch(e){ if (e !== "nein") throw e; } };
  const frei = state.mitarbeiter.map((m, i) => i).filter(i => {
    const j = basis.namen ? basis.namen.indexOf(state.mitarbeiter[i].name) : i;
    return j < 0 || !tag.schichten.some(x => x.mi === j);
  });
  const platz = i => basis.namen ? basis.namen.indexOf(state.mitarbeiter[i].name) : i;
  // 1) jemand, der frei hat, übernimmt die ganze frei gewordene Schicht
  if (weg) frei.forEach(i => versuch([{art: "neu", i, von: weg.von, bis: weg.bis}],
    [`${state.mitarbeiter[i].name} übernimmt ${hhmm(weg.von)}–${hhmm(weg.bis)}`]));
  // 2) jemand, der frei hat, kommt nur für die Lücke — so kurz wie möglich
  frei.forEach(i => {
    const vorher = raus.length;
    for (let laenge = Math.max(MINSCHICHT*60, g1 - g0); laenge <= REGELN.maxAnwesenheit*60 && raus.length === vorher; laenge += 30)
      for (let von = Math.max(r.tagVon, g1 - laenge); von <= g0 && von + laenge <= r.tagBis && raus.length === vorher; von += 30){
        if (weg && von === weg.von && von + laenge === weg.bis) continue;
        versuch([{art: "neu", i, von, bis: von + laenge}], [`${state.mitarbeiter[i].name} kommt ${hhmm(von)}–${hhmm(von + laenge)}`]);
      }
  });
  // 3) eine Schicht wächst über die Lücke
  tag.schichten.forEach(s0 => {
    const von = Math.min(s0.von, g0), bis = Math.max(s0.bis, g1);
    if ((von === s0.von && bis === s0.bis) || !ausfallErlaubt(basis, s0.mi, ti, von, bis, s0)) return;
    const p = planPerson(basis, s0.mi);
    const teile = [];
    if (von < s0.von) teile.push(`kommt ab ${hhmm(von)}`);
    if (bis > s0.bis) teile.push(`bleibt bis ${hhmm(bis)}`);
    versuch([{art: "aendern", i: p.i, alt: [s0.von, s0.bis], von, bis}], [`${p.name} ${teile.join(" und ")}`]);
  });
  // 4) zwei teilen sich die Lücke: einer bleibt länger, einer kommt früher
  const davor = tag.schichten.filter(s => s.bis <= g1 && s.bis >= g0 - 60 && s.von < g0);
  const danach = tag.schichten.filter(s => s.von >= g0 && s.von <= g1 + 60 && s.bis > g1);
  davor.forEach(a => danach.forEach(b => {
    if (a.mi === b.mi) return;
    for (let p = g0; p <= g1; p += 30){
      const aBis = Math.max(a.bis, p), bVon = Math.min(b.von, p);
      if (aBis === a.bis && bVon === b.von) continue;
      if (!ausfallErlaubt(basis, a.mi, ti, a.von, aBis, a) || !ausfallErlaubt(basis, b.mi, ti, bVon, b.bis, b)) continue;
      const pa = planPerson(basis, a.mi), pb = planPerson(basis, b.mi);
      const vorher = raus.length;
      versuch([{art: "aendern", i: pa.i, alt: [a.von, a.bis], von: a.von, bis: aBis},
               {art: "aendern", i: pb.i, alt: [b.von, b.bis], von: bVon, bis: b.bis}],
              [aBis > a.bis ? `${pa.name} bleibt bis ${hhmm(aBis)}` : null, bVon < b.von ? `${pb.name} kommt ab ${hhmm(bVon)}` : null].filter(Boolean));
      if (raus.length > vorher) break;
    }
  }));
  // 5) jemand, der da ist, übernimmt die frei gewordene Schicht; seine eigene wird gefüllt
  if (weg && tiefe === 0) tag.schichten.forEach(s0 => {
    if ((s0.rollen || []).includes("Standard")) return;          // feste Wochen bleiben
    if (!ausfallErlaubt(basis, s0.mi, ti, weg.von, weg.bis, s0)) return;
    const p = planPerson(basis, s0.mi);
    const tausch = {art: "aendern", i: p.i, alt: [s0.von, s0.bis], von: weg.von, bis: weg.bis};
    const plan = kopie(basis); plan.mo = basis.mo;
    aenderungenAnwenden(plan, ti, [tausch]);
    luekenSchliessen(plan, ti, {von: s0.von, bis: s0.bis}, 1).slice(0, 4).forEach(w => raus.push({
      aenderungen: [tausch].concat(w.aenderungen),
      teile: [`${p.name} übernimmt ${hhmm(weg.von)}–${hhmm(weg.bis)} statt ${hhmm(s0.von)}–${hhmm(s0.bis)}`].concat(w.teile)}));
  });
  return raus;
}

/* Vorschläge für den Ausfall von Person j0 (Plan) am Tag ti. grund: krank | urlaub | nicht.
   Liefert {schicht, vorschlaege:[{titel, details, mehr, aenderungen}]} — die drei besten. */
function ausfallVorschlaege(gespeichert, j0, ti, grund){
  const basis = kopie(gespeichert);
  basis.mo = gespeichert.mo;
  const tag = basis.tage[ti];
  const weg = tag.schichten.find(x => x.mi === j0);
  if (!weg) return {schicht: null, vorschlaege: []};
  tag.schichten = tag.schichten.filter(x => x !== weg);
  // Fürs Konto zählt der Grund: krank und Urlaub sind bezahlt — solange gerechnet wird,
  // steht der Ausfall vorläufig in den Abwesenheiten
  const sl = wochenSchluessel(montagDer(basis.mo instanceof Date ? isoVon(basis.mo) : basis.mo));
  const {i: i0} = planPerson(basis, j0);
  state.abwesend = state.abwesend || {};
  const abwVorher = kopie(state.abwesend[sl] || {});
  state.abwesend[sl] = state.abwesend[sl] || {};
  state.abwesend[sl][i0] = Object.assign({}, state.abwesend[sl][i0], {[TAGE[ti][0]]: grund});
  let vorschlaege = [];
  try {
    const wege = luekenSchliessen(basis, ti, {von: weg.von, bis: weg.bis}, 0);
    const vorher = tagesStunden(basis, ti);
    vorschlaege = wege.map(w => {
      const plan = kopie(basis); plan.mo = basis.mo;
      aenderungenAnwenden(plan, ti, w.aenderungen);
      const mehr = tagesStunden(plan, ti) - vorher;
      const betroffen = [...new Set(w.aenderungen.map(a => a.i))];
      let punkte = mehr * 2 + w.aenderungen.length * 1.5;
      const details = betroffen.map(i => {
        const m = state.mitarbeiter[i], k = kontoNach(plan, planPlatz(plan, i));
        if (!k) return null;
        if (k.ende > 0) punkte += k.ende * (darfUeberstunden(m) ? 1 : 25) * ueberGewicht(m) / 2;
        if (k.ende < 0) punkte += k.ende * 0.5;                // wer Minusstunden hat, holt sie auf
        if (!schicht(m, TAGE[ti][0]) && TAGE.some(([kk]) => schicht(m, kk))) punkte += 3;
        return `${m.name}: ${h1(k.ist)} h diese Woche, Konto danach ${ueText(k.ende) || "0,0"} h`;
      }).filter(Boolean).join(" · ");
      const pausen = plan.tage[ti].schichten.filter(s => {
        const vorher = basis.tage[ti].schichten.find(x => x.mi === s.mi && x.von === s.von && x.bis === s.bis);
        return vorher && vorher.pauseVon !== s.pauseVon;
      }).map(s => `${planPerson(plan, s.mi).name} Pause ${hhmm(s.pauseVon)}`);
      if (pausen.length) punkte += pausen.length * 0.5;
      return w.aenderungen.length
        ? {titel: w.teile.join(", "), details: details + (pausen.length ? ` · Pause verschoben: ${pausen.join(", ")}` : ""),
           mehr, aenderungen: w.aenderungen, punkte}
        : {titel: "Ohne Ersatz", details: "Die Besetzung reicht auch so — es fehlt keine halbe Stunde.",
           mehr: 0, aenderungen: [], punkte: -100};
    });
  } finally {
    state.abwesend[sl] = abwVorher;
  }
  const gesehen = new Set();
  const beste = vorschlaege.sort((a, b) => a.punkte - b.punkte)
    .filter(v => !gesehen.has(v.titel) && gesehen.add(v.titel)).slice(0, 3);
  return {schicht: {von: weg.von, bis: weg.bis, arbeit: weg.arbeit}, vorschlaege: beste,
          luecken: fehlzeiten(basis, ti)};
}

/* Einen Vorschlag in den gespeicherten Plan schreiben und den Ausfall eintragen.
   Ohne Vorschlag (null) wird die Schicht nur ausgetragen. */
function ausfallAnwenden(gespeichert, j0, ti, grund, vorschlag){
  const tag = gespeichert.tage[ti];
  tag.schichten = tag.schichten.filter(x => x.mi !== j0);
  const tage = vorschlag && vorschlag.aenderungen.find(a => a.art === "tage");
  if (tage){
    // Umplanung über mehrere Tage: die neuen Tage ganz übernehmen
    // Die Namensliste des Vorschlags enthält die alte und hängt nur an — Plätze bleiben gleich
    if (tage.namen) gespeichert.namen = tage.namen.slice();
    Object.entries(tage.tage).forEach(([k, schichten]) => { gespeichert.tage[+k].schichten = kopie(schichten); });
  } else aenderungenAnwenden(gespeichert, ti, vorschlag ? vorschlag.aenderungen : []);
  const mo = montagDer(gespeichert.mo instanceof Date ? isoVon(gespeichert.mo) : gespeichert.mo);
  const sl = wochenSchluessel(mo);
  const {i: i0, name} = planPerson(gespeichert, j0);
  state.abwesend[sl] = state.abwesend[sl] || {};
  if (i0 >= 0) state.abwesend[sl][i0] = Object.assign({}, state.abwesend[sl][i0], {[TAGE[ti][0]]: grund});
  gespeichert.geaendertVonHand = true;
  // Nachvollziehbar bleiben: was wann umgeplant wurde — ohne den Grund (Gesundheitsdaten)
  (gespeichert.ausfaelle = gespeichert.ausfaelle || []).push({am: new Date().toISOString(), wer: name,
    tag: TAGE[ti][0], loesung: vorschlag ? vorschlag.titel : "ohne Ersatz"});
}

/* Wenn ein Tag allein nicht reicht: die Woche mit dem Optimierer umplanen — so, dass
   möglichst viele Schichten bleiben, wie sie sind. Tage vor `abTag` ändern sich nicht.
   Liefert einen Vorschlag wie ausfallVorschlaege, mit Änderungen über mehrere Tage. */
async function ausfallUmplanen(gespeichert, j0, ti, grund, abTag){
  const highs = await highsLaden();
  if (!highs) return null;
  const mo = montagDer(gespeichert.mo instanceof Date ? isoVon(gespeichert.mo) : gespeichert.mo);
  const sl = wochenSchluessel(mo);
  const {i: i0} = planPerson(gespeichert, j0);
  state.abwesend = state.abwesend || {};
  const abwVorher = kopie(state.abwesend[sl] || {});
  state.abwesend[sl] = state.abwesend[sl] || {};
