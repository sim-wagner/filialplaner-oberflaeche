<!doctype html>
<html lang="de"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="fassung" content="2026-11-06-6">
<title>Filialplaner</title>
<link rel="stylesheet" href="fonts.css">
<style>
:root{
  --blau-900:#0A2A4E; --blau-800:#0C3B6B; --blau-700:#0F4C8A; --blau-600:#1565C0;
  --blau-500:#2E7FD4; --blau-200:#BBD4EC; --blau-100:#E2EDF8; --blau-50:#F2F7FC;
  --paper:#F2F7FC; --surface:#FFFFFF; --surface-2:#F7FAFD;
  --ink:#10273F; --ink-2:#2E4A66; --muted:#5C7791; --line:#D7E3F0; --line-2:#EAF1F8;
  --accent:var(--blau-700); --accent-ink:var(--blau-800); --accent-soft:var(--blau-100);
  --on-accent:#FFFFFF;
  --good:#1F7A45; --good-soft:#E3F3E9;
  --warn:#9A6206; --warn-soft:#FDF1DD;
  --bad:#B32320;  --bad-soft:#FBE6E5;
  --shadow:0 1px 2px rgba(16,39,63,.05), 0 6px 20px -10px rgba(16,39,63,.22);
  --shadow-l:0 2px 6px rgba(16,39,63,.07), 0 18px 38px -22px rgba(16,39,63,.3);
  --r:14px; --r-s:10px;
  --sans:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --display:var(--sans);
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --blau-900:#CFE2F5; --blau-800:#A9CBEC; --blau-700:#5FA3E0; --blau-600:#4A95DC;
    --blau-200:#1E3E5E; --blau-100:#14304C; --blau-50:#102638;
    --paper:#0A1724; --surface:#13263A; --surface-2:#182F46;
    --ink:#E6F0FA; --ink-2:#C2D6E8; --muted:#93AEC7; --line:#23405C; --line-2:#1B3449;
    --accent:#5FA3E0; --accent-ink:#A9CBEC; --accent-soft:#14304C; --on-accent:#08192B;
    --good:#7FC395; --good-soft:#14301F; --warn:#D9A05B; --warn-soft:#33270F; --bad:#E08585; --bad-soft:#331B1B;
    --shadow:0 1px 2px rgba(0,0,0,.45), 0 6px 20px -10px rgba(0,0,0,.7);
    --shadow-l:0 2px 6px rgba(0,0,0,.5), 0 18px 38px -22px rgba(0,0,0,.85);
  }
}
:root[data-theme="dark"]{
  --blau-900:#CFE2F5; --blau-800:#A9CBEC; --blau-700:#5FA3E0; --blau-600:#4A95DC;
  --blau-200:#1E3E5E; --blau-100:#14304C; --blau-50:#102638;
  --paper:#0A1724; --surface:#13263A; --surface-2:#182F46;
  --ink:#E6F0FA; --ink-2:#C2D6E8; --muted:#93AEC7; --line:#23405C; --line-2:#1B3449;
  --accent:#5FA3E0; --accent-ink:#A9CBEC; --accent-soft:#14304C; --on-accent:#08192B;
  --good:#7FC395; --good-soft:#14301F; --warn:#D9A05B; --warn-soft:#33270F; --bad:#E08585; --bad-soft:#331B1B;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 6px 20px -10px rgba(0,0,0,.7);
  --shadow-l:0 2px 6px rgba(0,0,0,.5), 0 18px 38px -22px rgba(0,0,0,.85);
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.5;
  -webkit-font-smoothing:antialiased;font-size:15px;margin:0}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15;letter-spacing:-.02em}
h1{font-size:1.65rem;font-weight:800;color:var(--blau-900)}
h2{font-size:1.2rem;font-weight:700}
h3{font-size:.95rem;font-weight:700;color:var(--blau-900)}
p{margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blau-600);outline-offset:2px;border-radius:8px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.63rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:800}

/* ---------- Gerüst ---------- */
.wrap{max-width:1140px;margin:0 auto;padding:0 20px 64px}
.topbar{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar-in{max-width:1140px;margin:0 auto;padding:11px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand .mark{width:34px;height:34px;border-radius:10px;background:var(--blau-700);display:grid;place-items:center;flex:none}
.brand .mark svg{width:19px;height:19px}
.brand strong{font-weight:800;font-size:1.05rem;letter-spacing:-.025em;color:var(--blau-900)}
.chip{font-family:var(--mono);font-size:.7rem;padding:4px 10px;border-radius:999px;border:1px solid var(--line);
  color:var(--muted);background:var(--surface-2);font-weight:500}
.chip.live{color:var(--blau-800);border-color:var(--blau-200);background:var(--blau-100)}

.layout{display:grid;grid-template-columns:200px 1fr;gap:30px;align-items:start;padding-top:24px}
@media(max-width:860px){.layout{grid-template-columns:1fr;gap:16px}}

/* ---------- Schrittleiste ---------- */
.steps{position:sticky;top:70px;display:flex;flex-direction:column;gap:1px}
@media(max-width:860px){.steps{position:static;flex-direction:row;overflow-x:auto;gap:5px;padding-bottom:4px}}
.step{display:flex;gap:10px;align-items:center;padding:8px 11px;border-radius:10px;border:0;background:none;
  text-align:left;cursor:pointer;color:var(--muted);width:100%;font-weight:600;transition:background .12s,color .12s}
.step:hover:not(:disabled){background:var(--blau-50);color:var(--ink-2)}
.step:disabled{cursor:not-allowed;opacity:.4}
.step .n{width:21px;height:21px;flex:0 0 21px;border-radius:50%;border:1.5px solid var(--line);
  display:grid;place-items:center;font-family:var(--mono);font-size:.66rem;background:var(--surface);font-weight:700}
.step .t{font-size:.84rem;white-space:nowrap}
.step[aria-current="step"]{color:var(--blau-900);background:var(--blau-100)}
.step[aria-current="step"] .n{background:var(--blau-700);border-color:var(--blau-700);color:#fff}
.step.done{color:var(--ink-2)}
.step.done .n{border-color:var(--blau-500);color:var(--blau-600)}

/* ---------- Flächen ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px;box-shadow:var(--shadow)}
.panel + .panel{margin-top:14px}
.lede{color:var(--muted);max-width:68ch;margin-top:5px;font-size:.9rem;font-weight:500}
.head{margin-bottom:18px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:640px){.g2,.g3{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.76rem;color:var(--muted);font-weight:700;letter-spacing:.01em}
label.f[hidden],[hidden]{display:none!important}
input[type=text],input[type=password],input[type=number],input[type=time],input[type=date],select{
  background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-s);padding:9px 11px;
  color:var(--ink);width:100%;font-weight:600;transition:border-color .12s,box-shadow .12s}
input:focus,select:focus{outline:none;border-color:var(--blau-600);box-shadow:0 0 0 3px var(--blau-100)}
input::placeholder{color:var(--muted);font-weight:500}
input.num,input[type=number],input[type=time]{font-family:var(--mono);font-variant-numeric:tabular-nums}
.hint{font-size:.75rem;color:var(--muted);font-weight:500}
/* Auf dem Telefon zoomt Safari in jedes Feld unter 16px hinein */
@media (pointer:coarse){
  input[type=text],input[type=password],input[type=number],input[type=time],input[type=date],select{font-size:16px}
}
.btn{background:var(--blau-700);color:#fff;border:1.5px solid var(--blau-700);border-radius:var(--r-s);
  padding:10px 18px;font-weight:700;font-size:.88rem;cursor:pointer;letter-spacing:-.01em;
  transition:background .12s,transform .08s}
.btn:hover{background:var(--blau-800);border-color:var(--blau-800)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--surface);color:var(--blau-800);border-color:var(--line)}
.btn.ghost:hover{background:var(--blau-50);border-color:var(--blau-200)}
.btn.small{padding:6px 12px;font-size:.8rem}
.btn:disabled{opacity:.4;cursor:not-allowed}
.actions{display:flex;gap:9px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line-2);align-items:center;flex-wrap:wrap}
.actions .spacer{margin-left:auto}
.err{color:var(--bad);font-size:.82rem;margin-top:9px;min-height:1.1em;font-weight:600}

/* ---------- Aufgabenkarten ---------- */
.task{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--surface-2)}
.task + .task{margin-top:9px}
.task.off{opacity:.5}
.task-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.task-top h3{margin-right:auto}
.days{display:flex;gap:5px;flex-wrap:wrap;margin:11px 0 3px}
.day{width:40px;height:33px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);
  font-family:var(--mono);font-size:.74rem;cursor:pointer;color:var(--muted);font-weight:700;transition:all .1s}
.day:hover{border-color:var(--blau-200)}
.day[aria-pressed="true"]{background:var(--blau-700);border-color:var(--blau-700);color:#fff}
.task-fields{display:grid;grid-template-columns:minmax(130px,.9fr) minmax(140px,1.1fr) minmax(80px,.6fr) minmax(80px,.6fr) auto;
  gap:9px;margin-top:9px;align-items:end}
@media(max-width:820px){.task-fields{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:480px){.task-fields{grid-template-columns:1fr}}
.zeitfelder{display:flex;gap:7px;align-items:flex-end}
.zeitfelder label.f{flex:1;min-width:0}
.pstd{align-self:end;font-family:var(--mono);font-size:.8rem;color:var(--muted);padding-bottom:10px;font-weight:500}
.pstd b{color:var(--blau-700);font-weight:700}
.switch{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--ink-2);cursor:pointer;font-weight:600}
.switch input{accent-color:var(--blau-700);width:16px;height:16px}

/* ---------- Tabellen ---------- */
.tablewrap{overflow-x:auto;margin-top:4px}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th{text-align:left;font-size:.63rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);font-weight:800;padding:0 10px 8px;border-bottom:1.5px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle;font-weight:500}
tr:last-child td{border-bottom:none}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:.67rem;padding:2px 7px;border-radius:6px;font-weight:700;
  background:var(--blau-50);border:1px solid var(--line);color:var(--ink-2);margin:1px 2px 1px 0}
.tag.azubi{background:var(--blau-100);border-color:var(--blau-200);color:var(--blau-800)}
.tag.minor{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.empty{color:var(--muted);font-size:.86rem;padding:20px 0;text-align:center;font-weight:500}

/* ---------- Kacheln & Meldungen ---------- */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}
@media(max-width:720px){.tiles{grid-template-columns:1fr}}
.tile{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--surface-2)}
.tile .v{font-family:var(--mono);font-size:1.6rem;font-weight:700;letter-spacing:-.03em;line-height:1.1;
  margin:5px 0 2px;color:var(--blau-900)}
.tile .sub{font-size:.75rem;color:var(--muted);font-weight:500}
.bar{height:7px;border-radius:99px;background:var(--blau-100);overflow:hidden;margin-top:9px;display:flex}
.bar i{display:block;height:100%;border-radius:99px}
.bar i.a{background:var(--blau-600)}
.bar i.b{background:var(--blau-600);opacity:.35}
.note{display:flex;gap:10px;padding:11px 13px;border-radius:10px;font-size:.85rem;align-items:flex-start;font-weight:500}
.note + .note{margin-top:7px}
.note .ic{font-family:var(--mono);font-weight:700;flex:0 0 auto}
.note.ok{background:var(--good-soft);color:var(--good)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.note.info{background:var(--blau-50);color:var(--blau-800)}
.qual{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.qual div{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--surface-2);
  display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.82rem;font-weight:600}
.qual b{font-family:var(--mono);font-weight:700}
.qual .c0{color:var(--bad)} .qual .c1{color:var(--warn)} .qual .c2{color:var(--good)}

/* ---------- Startseite ---------- */
.layout.ohne-leiste{grid-template-columns:1fr}
.hero{display:flex;align-items:center;gap:16px;padding:18px 22px;border-radius:16px;flex-wrap:wrap;
  background:linear-gradient(135deg,var(--blau-800),var(--blau-600));color:#fff;box-shadow:var(--shadow-l)}
.heromark{width:54px;height:54px;border-radius:15px;background:rgba(255,255,255,.16);flex:none;
  display:flex;flex-direction:column;justify-content:center;gap:6px;padding:0 9px}
.hb{height:7px;border-radius:99px;background:#fff;width:var(--w);
  animation:ausfahren .55s cubic-bezier(.2,.85,.3,1) both}
.hb1{--w:74%}
.hb2{--w:100%;opacity:.72;animation-delay:.1s}
.hb3{--w:58%;animation-delay:.2s}
@keyframes ausfahren{from{width:0}to{width:var(--w)}}
.herotext h1{color:#fff;font-size:1.5rem;margin:0}
.herotext p{opacity:.9;font-size:.85rem;font-weight:600;margin-top:2px}
.hero .btn.hell{margin-left:auto;background:#fff;color:var(--blau-800);border-color:#fff}
.hero .btn.hell:hover{background:var(--blau-50);border-color:var(--blau-50)}

.kacheln{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
.kachel{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:13px 15px;text-align:left;
  border-radius:12px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;
  transition:border-color .12s,background .12s}
.kachel b{font-weight:700;color:var(--blau-900);font-size:.92rem}
.kachel span{font-size:.76rem;color:var(--muted);font-weight:500}
.kachel:hover{border-color:var(--blau-200);background:var(--blau-50)}
.kachel.arch{border-style:dashed}

/* ---------- Plan im Filialformat ---------- */
.planwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.plan{border-collapse:collapse;width:100%;min-width:900px;font-size:.72rem}
table.plan th,table.plan td{border:1px solid var(--line);padding:4px 6px;text-align:center;
  vertical-align:middle;white-space:nowrap;font-weight:500;text-transform:none;letter-spacing:0;color:var(--ink)}
table.plan thead th{background:var(--blau-50);font-weight:700;font-size:.68rem;color:var(--blau-900);padding:6px}
table.plan .zeilenkopf{text-align:left;font-weight:700;min-width:168px;white-space:normal;
  background:var(--surface-2);font-size:.72rem}
table.plan .klein{font-size:.62rem;color:var(--muted);font-weight:500}
table.plan tr.liefer td{color:var(--ink-2);font-size:.68rem}
table.plan tr.aufgabenzeile td{background:var(--blau-50);font-weight:700;font-size:.66rem;white-space:normal}
table.plan tr.ma-oben td{font-family:var(--mono);font-weight:600}
table.plan tr.ma-unten td{font-family:var(--mono);color:var(--muted);font-size:.66rem}
table.plan td.frei{color:var(--muted);font-family:var(--sans);font-size:.68rem}
table.plan tr.summe td,table.plan tr.summe th{background:var(--blau-100);font-weight:700}
table.plan td.stunden{background:var(--surface-2)}

.foot{margin-top:22px;color:var(--muted);font-size:.74rem;font-weight:500;text-align:center}
.fassungshinweis{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));
  z-index:60;background:var(--blau-800);color:#fff;border-radius:999px;padding:10px 18px;font-size:.8rem;
  font-weight:600;box-shadow:var(--shadow-l);max-width:min(92vw,460px);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="topbar"><div class="topbar-in">
  <div class="brand">
    <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2.5"/><path d="M3 9h18M8 2v4M16 2v4"/></svg></span>
    <strong>Filialplaner</strong>
  </div>
  <span class="chip" id="storeChip">lädt …</span>
  <span class="chip" id="filChip" hidden></span>
  <button class="btn ghost small" id="abmelden" hidden>Abmelden</button>
</div></div>

<div class="wrap">
<div class="layout">
  <nav class="steps" id="steps" aria-label="Schritte"></nav>
  <div id="view"></div>
</div>
<p class="foot" id="fuss">Baden-Württemberg · Testversion mit erfundenen Daten</p>
</div>

<script>
window.onerror = function(m, q, z){
  var d = document.createElement("pre");
  d.style.cssText = "position:fixed;left:0;right:0;top:0;z-index:9999;background:#B32320;color:#fff;margin:0;padding:12px;font:12px/1.4 ui-monospace;white-space:pre-wrap";
  d.textContent = "Fehler: " + m + "\nZeile " + z;
  document.body.appendChild(d);
};
</script>

<script src="jspdf.plugin.autotable.min.js"></script>
<script src="exceljs.min.js"></script>
<script>
"use strict";
const TAGE = [["mo","Mo"],["di","Di"],["mi","Mi"],["do","Do"],["fr","Fr"],["sa","Sa"]];
const WAREN = [
  {id:"tro",  name:"Trockenware",      braucht:"verraeumen"},
  {id:"kue",  name:"Kühlware",         braucht:"verraeumen"},
  {id:"tk",   name:"Tiefkühl",         braucht:"verraeumen"},
  {id:"ff",   name:"Frischfleisch",    braucht:"verraeumen"},
  {id:"og",   name:"Obst und Gemüse",  braucht:"verraeumen"},
  {id:"bake", name:"Backen (Prebake)", braucht:null},
  {id:"abend",name:"Abendprogramm",    braucht:"abendprog"},
  {id:"food", name:"Food-Aufbau",      braucht:"foodauf"},
  {id:"non",  name:"Non-Food-Aufbau",  braucht:"nonfoodauf"}
];
const ZEITARTEN = [["fest","feste Uhrzeit"],["spanne","Zeitspanne"],["egal","Uhrzeit egal"]];
const QUAL = [
  ["kasse","Kasse"],
  ["verraeumen","Verräumen"],
  ["foodauf","Food-Aufbau"],
  ["nonfoodauf","Non-Food-Aufbau"],
  ["abendprog","Abendprogramm"],
  ["bestellung","Bestellungen"],
  ["frueh","Frühschichtvertretung"],
  ["spaet","Spätschichtvertretung"],
  ["urlaubsvertretung","Urlaubsvertretung"]
];
const FEIERTAGE_BW = {
  2026:["01-01","01-06","04-03","04-06","05-01","05-14","05-25","06-04","10-03","11-01","12-25","12-26"],
  2027:["01-01","01-06","03-26","03-29","05-01","05-06","05-17","05-27","10-03","11-01","12-25","12-26"]
};
const MIN_BESETZUNG = 2;   // immer zwei Personen gleichzeitig im Laden
const OEFFNUNGSTAGE = 6;   // Montag bis Samstag
const TYPEN = ["Filialleitung","Stellvertretung","Vollzeit","Teilzeit","Aushilfe (Minijob)","Azubi"];
const SCHRITTE = ["Filiale","Wochenaufgaben","Mitarbeiter","Standardwoche","Stundenliste","Prüfen"];
const BEREICHE = [
  {id:"filiale",      name:"Filiale",        schritt:0},
  {id:"aufgaben",     name:"Wochenaufgaben", schritt:1},
  {id:"personal",     name:"Personal",       schritt:2},
  {id:"standardwoche",name:"Standardwoche",  schritt:3},
  {id:"stundenliste", name:"Stundenliste",   schritt:4}
];

/* ---------------- Zustand ---------------- */
let state = leer();
let ansicht = "anmeldung";      // anmeldung | einrichtung | bereich | start | planen | archiv
let schritt = 0, maxSchritt = 0, fehler = "";

function leer(){
  const a = {};
  WAREN.forEach(w => a[w.id] = {aktiv:true, tage:[], zeitArt:"fest", zeit:"",
                                fVon:"", fBis:"", dauer:"", personen:""});
  return {nr:"", ort:"", von:"08:00", bis:"21:00", wechsel:"", allein:false, aufgaben:a, mitarbeiter:[],
          budget:{stunden:{}, umsatz:{}}, eingerichtet:false, plaene:{}, abwesend:{}};
}

/* ---------------- Brücke zur App ---------------- */
const inApp = !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.filialplaner);
const _offen = {};
let _lauf = 0;
window.appAntwort = (nr, wert) => { const f = _offen[nr]; if (f){ delete _offen[nr]; f(wert); } };
function appRuf(aktion, daten){
  if (!inApp) return Promise.resolve(null);
  return new Promise(ok => {
    const nr = ++_lauf;
    _offen[nr] = ok;
    setTimeout(() => { if (_offen[nr]){ delete _offen[nr]; ok(null); } }, 4000);
    window.webkit.messageHandlers.filialplaner.postMessage({id:nr, aktion, daten: daten || {}});
  });
}

/* ---------------- Speicher ---------------- */
let db = null, storeArt = "lokal";
const LS = "filialplaner:";

async function initStore(){
  if (inApp){
    storeArt = "app";
    const chip = document.getElementById("storeChip");
    chip.textContent = "iCloud";
    chip.className = "chip live";
    return;
  }
  try { db = (typeof claude !== "undefined" && claude.use) ? await claude.use("db") : null; } catch(e){ db = null; }
  storeArt = db ? "geteilt" : "lokal";
  const chip = document.getElementById("storeChip");
  chip.textContent = db ? "Zentral gespeichert" : "Nur auf diesem Gerät";
  chip.className = "chip" + (db ? " live" : "");
}
const key = nr => "n" + String(nr).replace(/\D/g,"");
const LETZTE = "filialplaner:letzte";
// Merkzettel, welche Filialen es gibt — nötig, wenn die Daten zentral liegen
// und der Rechner sie nicht selbst im Browserspeicher hat
const BEKANNT = "filialplaner:bekannt";
function bekannteLesen(){
  try { const a = JSON.parse(localStorage.getItem(BEKANNT) || "[]"); return Array.isArray(a) ? a : []; }
  catch(e){ return []; }
}
function bekannteSchreiben(liste){
  try { localStorage.setItem(BEKANNT, JSON.stringify(liste)); } catch(e){}
}
function merkeZugang(nr, ort, pwHash){
  if (inApp) appRuf("zuletzt", {setzen: String(nr)});
  try { localStorage.setItem(LETZTE, JSON.stringify({nr, ort, pw:pwHash})); } catch(e){}
  const liste = bekannteLesen().filter(x => key(x.nr) !== key(nr));
  liste.push({nr: String(nr), ort: ort || ""});
  bekannteSchreiben(liste);
}
function letzterZugang(){
  try { return JSON.parse(localStorage.getItem(LETZTE) || "null"); } catch(e){ return null; }
}
// In der App: alle bekannten Filialen aus iCloud holen
async function bekannteFilialen(){
  if (!inApp) return [];
  const liste = await appRuf("liste", {});
  return Array.isArray(liste) ? liste : [];
}

function normalisiere(s){
  if (!s.plaene) s.plaene = {};
  if (!s.abwesend) s.abwesend = {};
  if (s.eingerichtet === undefined) s.eingerichtet = !!(s.mitarbeiter && s.mitarbeiter.length);
  WAREN.forEach(w => {
    const a = s.aufgaben && s.aufgaben[w.id];
    if (!a) return;
    if (!a.zeitArt) a.zeitArt = hatZeit(a.zeit) ? "fest" : "egal";
    if (a.fVon === undefined) a.fVon = "";
    if (a.fBis === undefined) a.fBis = "";
  });
  return s;
}

async function ladeFiliale(nr){
  const id = key(nr);
  if (inApp){
    const roh = await appRuf("laden", {id});
    if (roh === null || roh === undefined) return null;
    try { return normalisiere(typeof roh === "string" ? JSON.parse(roh) : roh); } catch(e){ return null; }
  }
  if (db){
    try {
      const s = await db.doc("filialen/" + id).get();
      return s.exists ? normalisiere(s.data()) : null;
    } catch(e){ /* auf lokal zurückfallen */ }
  }
  const raw = localStorage.getItem(LS + id);
  return raw ? normalisiere(JSON.parse(raw)) : null;
}
async function speichere(){
  if (!state.nr) return;
  const id = key(state.nr);
  const body = JSON.parse(JSON.stringify(state));
  body.geaendert = new Date().toISOString();
  if (inApp){
    await appRuf("sichern", {id, json: JSON.stringify(body)});
    await appRuf("zuletzt", {setzen: state.nr});
    return;
  }
  if (db){
    try { await db.doc("filialen/" + id).set(body); return; } catch(e){ /* lokal weiter */ }
  }
  try { localStorage.setItem(LS + id, JSON.stringify(body)); } catch(e){}
}
async function loescheFiliale(nr){
  const id = key(nr);
  if (inApp){ await appRuf("loeschen", {id}); }
  if (db){ try { await db.doc("filialen/" + id).delete(); } catch(e){} }
  try { localStorage.removeItem(LS + id); } catch(e){}
  bekannteSchreiben(bekannteLesen().filter(x => key(x.nr) !== id));
  const l = letzterZugang();
  if (l && key(l.nr) === id){ try { localStorage.removeItem(LETZTE); } catch(e){} }
}

let sperre = null;
const sichern = () => { clearTimeout(sperre); sperre = setTimeout(speichere, 400); };

async function hash(text){
  try {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,"0")).join("");
  } catch(e){
    // Ohne Web-Crypto (sehr alte Umgebungen): einfacher Streuwert, damit wenigstens
    // nicht jedes gleich lange Kennwort passt
    let h = 0x811c9dc5;
    for (const z of text){ h ^= z.codePointAt(0); h = Math.imul(h, 0x01000193) >>> 0; }
    return "x" + h.toString(16);
  }
}

/* ---------------- Rechnen ---------------- */
const nz = v => { const n = parseFloat(String(v).replace(",",".")); return isFinite(n) ? n : 0; };
const hat = v => v !== "" && v !== null && v !== undefined && isFinite(parseFloat(String(v).replace(",",".")));
const hatZeit = v => typeof v === "string" && /^\d{1,2}:\d{2}$/.test(v);
const oder = (v, alt) => hat(v) ? h1(nz(v)) : (alt || "?");
const h1 = n => (Math.round(n*10)/10).toLocaleString("de-DE",{minimumFractionDigits:1,maximumFractionDigits:1});
const eur = n => Math.round(n).toLocaleString("de-DE");

function alter(gb){
  if (!gb) return null;
  const g = new Date(gb); if (isNaN(g)) return null;
  const h = new Date(); let a = h.getFullYear() - g.getFullYear();
  const m = h.getMonth() - g.getMonth();
  if (m < 0 || (m === 0 && h.getDate() < g.getDate())) a--;
  return a;
}
const istAzubi = m => m.typ === "Azubi";
const faktor = m => !istAzubi(m) ? 1 : (m.lehrjahr === 1 ? 0 : m.lehrjahr === 2 ? 0.5 : 1);
const stunden = m => nz(istAzubi(m) ? m.betrieb : m.vertrag);
const saldoVon = m => hat(m.saldo) ? nz(m.saldo) : 0;
const AUSGLEICH_MAX = 5;      // Stunden, die pro Woche ab- oder aufgebaut werden
// Zielstunden der Woche: Vertrag, korrigiert um das Stundenkonto
function zielStunden(m){
  const soll = stunden(m);
  if (!soll) return soll;
  const s = Math.max(-AUSGLEICH_MAX, Math.min(AUSGLEICH_MAX, saldoVon(m)));
  return Math.max(0, soll - s);
}

function minuten(t){ const p = String(t || "0:00").split(":"); return (+p[0])*60 + (+p[1] || 0); }

function auswertung(){
  const ms = state.mitarbeiter;
  const luecken = [];                       // was fehlt und die Rechnung beeinflusst
  const anwesend = ms.reduce((s,m) => s + stunden(m), 0);
  const wirksam  = ms.reduce((s,m) => s + stunden(m) * faktor(m), 0);
  const ohneStunden = ms.filter(m => !hat(istAzubi(m) ? m.betrieb : m.vertrag));
  const ohneGeb = ms.filter(m => !m.geb);
  const budgetTage = TAGE.filter(([k]) => hat(state.budget.stunden[k])).length;
  const budget   = TAGE.reduce((s,[k]) => s + nz(state.budget.stunden[k]), 0);
  const umsatz   = TAGE.reduce((s,[k]) => s + nz(state.budget.umsatz[k]), 0);

  let aufgaben = 0, aufgabenTage = 0;
  const offeneAufgaben = [];
  WAREN.forEach(w => {
    const a = state.aufgaben[w.id];
    if (!a.aktiv) return;
    if (!a.tage.length || !hat(a.dauer) || !hat(a.personen)){ offeneAufgaben.push(w.name); return; }
    aufgaben += nz(a.dauer) * nz(a.personen) * a.tage.length;
    aufgabenTage += a.tage.length;
  });
  const qual = {};
  QUAL.forEach(([k]) => qual[k] = ms.filter(m => m.qual && m.qual.includes(k)).length);

  // Wer kann eine Schicht führen: Filialleitung selbst oder die jeweilige Vertretung
  const fuehrt = q => ms.filter(m => m.typ === "Filialleitung" || (m.qual || []).includes(q)).length;
  const fruehOk = fuehrt("frueh"), spaetOk = fuehrt("spaet");

  // Mindestbedarf der Woche — nur, soweit die Angaben reichen
  const offenBekannt = hatZeit(state.von) && hatZeit(state.bis);
  const von = minuten(state.von), bis = minuten(state.bis);
  const offenH = offenBekannt ? Math.max(0, (bis - von) / 60) : null;
  const grund  = offenH === null ? null : offenH * MIN_BESETZUNG * OEFFNUNGSTAGE;

  const frueheste = {};
  let flexible = 0;
  if (offenBekannt) WAREN.forEach(w => {
    const a = state.aufgaben[w.id];
    if (!a.aktiv) return;
    // zwingend vor Öffnung? feste Zeit davor, oder ein Fenster, das vorher endet
    let start = null;
    if (a.zeitArt === "fest" && hatZeit(a.zeit) && minuten(a.zeit) < von) start = minuten(a.zeit);
    else if (a.zeitArt === "spanne" && hatZeit(a.fVon) && hatZeit(a.fBis) && minuten(a.fBis) <= von) start = minuten(a.fVon);
    else if (a.zeitArt !== "fest" && a.tage.length) flexible++;
    if (start === null) return;
    a.tage.forEach(tg => {
      frueheste[tg] = Math.min(frueheste[tg] === undefined ? von : frueheste[tg], start);
    });
  });
  const aussen = state.allein ? 1 : MIN_BESETZUNG;
  const vorlauf = Object.values(frueheste).reduce((s,m) => s + (von-m)/60 * aussen, 0);

  // Nachlauf: Aufgaben, die zwingend nach Ladenschluss enden
  const spaeteste = {};
  if (offenBekannt) WAREN.forEach(w => {
    const a = state.aufgaben[w.id];
    if (!a.aktiv || !hat(a.dauer) || !a.tage.length) return;
    let ende = null;
    if (a.zeitArt === "fest" && hatZeit(a.zeit)) ende = minuten(a.zeit) + nz(a.dauer)*60;
    else if (a.zeitArt === "spanne" && hatZeit(a.fBis)) ende = minuten(a.fBis);
    if (ende === null || ende <= bis) return;
    a.tage.forEach(tg => { spaeteste[tg] = Math.max(spaeteste[tg] === undefined ? bis : spaeteste[tg], ende); });
  });
  const nachlauf = Object.values(spaeteste).reduce((s,e) => s + (e-bis)/60 * aussen, 0);

  let zusatz = 0;
  WAREN.forEach(w => {
    const a = state.aufgaben[w.id];
    if (!a.aktiv || !a.tage.length || !hat(a.dauer) || !hat(a.personen)) return;
    zusatz += Math.max(0, nz(a.personen) - 1) * nz(a.dauer) * a.tage.length;
  });
  const bedarf = grund === null ? null : grund + vorlauf + nachlauf + zusatz;

  if (!offenBekannt)       luecken.push("Öffnungszeit — ohne sie lässt sich die Grundbesetzung nicht rechnen");
  if (offeneAufgaben.length) luecken.push("Warentage ohne Tag, Dauer oder Personenzahl: " + offeneAufgaben.join(", "));
  if (ohneStunden.length)  luecken.push("Ohne Stundenangabe: " + ohneStunden.map(m => m.name).join(", "));
  if (ohneGeb.length)      luecken.push("Ohne Geburtsdatum, Altersregeln ungeprüft: " + ohneGeb.map(m => m.name).join(", "));
  const leitung = ms.filter(m => m.typ === "Filialleitung");
  if (leitung.length && !leitung.some(m => TAGE.some(([k]) => (m.standard || {})[k] && (m.standard || {})[k].von)))
    luecken.push("Standardwoche der Filialleitung — sie ist der Fixpunkt des Wochenplans");
  if (budgetTage && budgetTage < TAGE.length) luecken.push(`Stundenliste nur für ${budgetTage} von 6 Tagen ausgefüllt`);

  const vollstaendig = offenBekannt && !offeneAufgaben.length && !ohneStunden.length;

  return {anwesend, wirksam, budget, budgetTage, umsatz, aufgaben, aufgabenTage, qual, fruehOk, spaetOk,
          offenH, grund, vorlauf, nachlauf, zusatz, bedarf, flexible, aussen, luecken, offeneAufgaben, ohneStunden, ohneGeb, vollstaendig,
          minderjaehrig: ms.filter(m => { const a = alter(m.geb); return a !== null && a < 18; })};
}

/* ---------------- Ansicht ---------------- */
const el = (h) => { const tpl = document.createElement("template"); tpl.innerHTML = h.trim(); return tpl.content.firstElementChild; };
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const SCHRITT_FN = () => [filiale, warentage, mitarbeiter, standardwoche, stundenliste, pruefen];

// Überschrift über dem Schritt: in der Einrichtung die Nummer, sonst der Bereich
const stufe = n => ansicht === "bereich" ? "Filialdaten" : `Schritt ${n} von ${SCHRITTE.length}`;

function renderSteps(){
  const n = document.getElementById("steps");
  n.innerHTML = "";
  SCHRITTE.forEach((s,i) => {
    const b = el(`<button class="step${i < schritt ? " done" : ""}" ${i === schritt ? 'aria-current="step"' : ""}
      ${i > maxSchritt ? "disabled" : ""}><span class="n">${i < schritt ? "✓" : i+1}</span><span class="t">${s}</span></button>`);
    b.onclick = () => { if (i <= maxSchritt){ schritt = i; fehler = ""; render(); } };
    n.appendChild(b);
  });
}

function kopfLeiste(){
  const c = document.getElementById("filChip");
  if (state.nr && ansicht !== "anmeldung"){
    c.hidden = false;
    c.textContent = "N " + state.nr + (state.ort ? " · " + state.ort : "");
  } else c.hidden = true;
  const ab = document.getElementById("abmelden");
  if (ab) ab.hidden = (ansicht === "anmeldung");
}

function render(){
  const layout = document.querySelector(".layout");
  const steps = document.getElementById("steps");
  const v = document.getElementById("view");
  v.innerHTML = "";
  kopfLeiste();

  const inEinrichtung = (ansicht === "einrichtung");
  steps.hidden = !inEinrichtung;
  layout.classList.toggle("ohne-leiste", !inEinrichtung);
  if (inEinrichtung) renderSteps();

  if (ansicht === "anmeldung")        v.appendChild(anmeldung());
  else if (ansicht === "start")       v.appendChild(startseite());
  else if (ansicht === "planen")      v.appendChild(planenAnsicht());
  else if (ansicht === "archiv")      v.appendChild(archivAnsicht());
  else if (ansicht === "sicherung")   v.appendChild(sicherungsAnsicht());
  else                                v.appendChild(SCHRITT_FN()[schritt]());

  pruefePlatz();
  window.scrollTo({top:0, behavior:"instant"});
}

// Meldet die App, dass iCloud eng wird, steht es über der Seite statt nirgends
let platzGeprueft = 0;
async function pruefePlatz(){
  if (!inApp || Date.now() - platzGeprueft < 20000) return;
  platzGeprueft = Date.now();
  const text = await appRuf("hinweis", {});
  const alt = document.getElementById("platzhinweis");
  if (alt) alt.remove();
  if (!text) return;
  document.getElementById("view").prepend(el(
    `<div class="note warn" id="platzhinweis" style="margin-bottom:14px"><span class="ic">!</span><span>${esc(text)}</span></div>`));
}

// Fußzeile der Schritte — in der Einrichtung mit Überspringen, sonst mit Fertig
function navLeiste(idx){
  const a = el(`<div class="actions"></div>`);
  if (ansicht === "bereich"){
    const f = el(`<button class="btn">Fertig</button>`);
    f.onclick = async () => { await speichere(); ansicht = "start"; render(); };
    const ab = el(`<button class="btn ghost">Abbrechen</button>`);
    ab.onclick = () => { ansicht = "start"; render(); };
    a.appendChild(ab); a.appendChild(el(`<div class="spacer"></div>`)); a.appendChild(f);
    return a;
  }
  if (idx > 0){
    const z = el(`<button class="btn ghost">Zurück</button>`);
    z.onclick = () => { schritt = idx - 1; fehler = ""; render(); };
    a.appendChild(z);
  }
  a.appendChild(el(`<div class="spacer"></div>`));
  const letzter = idx >= SCHRITTE.length - 1;
  if (!letzter){
    const u = el(`<button class="btn ghost">Überspringen</button>`);
    u.onclick = () => weiterZu(idx + 1);
    a.appendChild(u);
  }
  const w = el(`<button class="btn">${letzter ? "Einrichtung abschließen" : "Weiter"}</button>`);
  w.onclick = async () => {
    if (letzter){
      state.eingerichtet = true;
      await speichere();
      ansicht = "start"; fehler = ""; render();
    } else weiterZu(idx + 1);
  };
  a.appendChild(w);
  return a;
}
function nav(zurueck, weiter, label){ return navLeiste(schritt); }
function weiterZu(i){ maxSchritt = Math.max(maxSchritt, i); schritt = i; fehler = ""; sichern(); render(); }

function oeffneBereich(id){
  const b = BEREICHE.find(x => x.id === id);
  if (!b) return;
  ansicht = "bereich"; schritt = b.schritt; bearbeite = -1; fehler = "";
  render();
}

/* --------- Anmeldung --------- */
function anmeldung(){
  const p = el(`<div class="panel">
    <div class="head">
      <h1>Filialplaner</h1>
      <p class="lede">Mit Filialnummer und Kennwort anmelden — oder einen neuen
      Filialbereich anlegen.</p></div>
    <div class="grid g3">
      <label class="f">Filialnummer<input type="text" id="nr" inputmode="numeric" placeholder="269" class="num"></label>
      <label class="f">Kennwort<input type="password" id="pw" placeholder="mindestens 4 Zeichen"></label>
      <label class="f" id="wrapPw2" hidden>Kennwort wiederholen<input type="password" id="pw2"></label>
    </div>
    <p class="err" id="err">${esc(fehler)}</p>
    <div class="actions">
      <button class="btn" id="anmelden">Anmelden</button>
      <button class="btn ghost" id="neu">Neuen Bereich anlegen</button>
      <div class="spacer"></div>
      <button class="btn ghost small" id="verwalten">Gespeicherte Filialen</button>
    </div>
    <div id="liste"></div>
  </div>`);

  let modus = "anmelden";
  const nrF = p.querySelector("#nr"), pwF = p.querySelector("#pw"), pw2F = p.querySelector("#pw2");
  const fehlerZeigen = txt => { fehler = txt; p.querySelector("#err").textContent = txt; };

  const umschalten = (neuerModus) => {
    modus = neuerModus;
    p.querySelector("#wrapPw2").hidden = (modus !== "neu");
    p.querySelector("#anmelden").className = modus === "anmelden" ? "btn" : "btn ghost";
    p.querySelector("#neu").className      = modus === "neu"      ? "btn" : "btn ghost";
    fehlerZeigen("");
  };

  const oeffnen = (daten) => {
    state = Object.assign(leer(), daten);
    merkeZugang(state.nr, state.ort, state.pw);
    if (state.eingerichtet){ ansicht = "start"; }
    else { ansicht = "einrichtung"; schritt = 0; maxSchritt = 0; }
    fehler = ""; render();
  };

  p.querySelector("#anmelden").onclick = async () => {
    if (modus !== "anmelden"){ umschalten("anmelden"); return; }
    const nr = nrF.value.replace(/\D/g, ""), pw = pwF.value;
    if (!nr) return fehlerZeigen("Bitte eine Filialnummer eintragen.");
    if (!pw) return fehlerZeigen("Bitte das Kennwort eintragen.");
    const vorhanden = await ladeFiliale(nr);
    if (!vorhanden) return fehlerZeigen(`Für N ${nr} gibt es noch keinen Bereich. Lege ihn mit „Neuen Bereich anlegen“ an.`);
    if (vorhanden.pw !== await hash(nr + ":" + pw)) return fehlerZeigen("Das Kennwort stimmt nicht.");
    oeffnen(vorhanden);
  };

  p.querySelector("#neu").onclick = async () => {
    if (modus !== "neu"){ umschalten("neu"); return; }
    const nr = nrF.value.replace(/\D/g, ""), pw = pwF.value, pw2 = pw2F.value;
    if (!nr) return fehlerZeigen("Bitte eine Filialnummer eintragen.");
    if (pw.length < 4) return fehlerZeigen("Das Kennwort braucht mindestens 4 Zeichen.");
    if (pw !== pw2) return fehlerZeigen("Die beiden Kennwörter stimmen nicht überein.");
    const vorhanden = await ladeFiliale(nr);
    if (vorhanden) return fehlerZeigen(`N ${nr} ist bereits angelegt. Melde dich mit dem Kennwort an oder lösche den Bereich unter „Gespeicherte Filialen“.`);
    const frisch = leer();
    frisch.nr = nr; frisch.pw = await hash(nr + ":" + pw);
    state = frisch; await speichere();
    oeffnen(frisch);
  };

  // Verwaltung: nur auf Wunsch, und ohne Öffnen-Abkürzung
  const box = p.querySelector("#liste");
  let offen = false;
  p.querySelector("#verwalten").onclick = async () => {
    offen = !offen;
    box.innerHTML = "";
    if (!offen) return;
    const liste = inApp ? await bekannteFilialen() : lokaleFilialen();
    if (!liste.length){
      box.appendChild(el(`<p class="empty">Keine gespeicherten Filialen.</p>`));
      return;
    }
    box.appendChild(el(`<h3 style="margin-top:18px">Gespeicherte Filialen</h3>
      <p class="hint" style="margin-bottom:8px">Zum Öffnen oben anmelden. Löschen entfernt alle Daten dieser Filiale.</p>`));
    const tab = el(`<div class="tablewrap"><table><tbody></tbody></table></div>`);
    const tb = tab.querySelector("tbody");
    liste.forEach(f => {
      const tr = el(`<tr><td><b>N ${esc(f.nr)}</b>${f.ort ? " · " + esc(f.ort) : ""}</td>
        <td class="n"><button class="btn ghost small">löschen</button></td></tr>`);
      tr.querySelector("button").onclick = async () => {
        if (!confirm(`Filiale N ${f.nr} mit allen Daten löschen? Das lässt sich nicht rückgängig machen.`)) return;
        await loescheFiliale(f.nr);
        tr.remove();
        if (!tb.children.length) box.innerHTML = `<p class="empty">Keine gespeicherten Filialen.</p>`;
      };
      tb.appendChild(tr);
    });
    box.appendChild(tab);
    box.appendChild(sicherungsKnoepfe());
  };

  umschalten("anmelden");
  return p;
}
function zeigeFehler(p, t){ fehler = t; const f = p.querySelector("#err"); if (f) f.textContent = t; }

// Filialen aus dem Browser-Speicher (außerhalb der App)
function lokaleFilialen(){
  const nach = new Map();
  const merke = (nr, ort) => {
    const id = key(nr);
    if (!id || id === "n") return;
    const alt = nach.get(id);
    nach.set(id, {nr: String(nr), ort: ort || (alt ? alt.ort : "")});
  };
  try {
    for (let i = 0; i < localStorage.length; i++){
      const s = localStorage.key(i);
      // nur die Filialbereiche selbst — nicht die Merkzettel
      if (!s || !new RegExp("^" + LS + "n\\d+$").test(s)) continue;
      try {
        const d = JSON.parse(localStorage.getItem(s));
        merke(d.nr || s.slice(LS.length + 1), d.ort);
      } catch(e){}
    }
  } catch(e){}
  bekannteLesen().forEach(x => merke(x.nr, x.ort));
  return [...nach.values()].sort((a,b) => String(a.nr).localeCompare(String(b.nr)));
}

/* --------- Sicherung --------- */
// In der App übernimmt das die Brücke (Teilen- bzw. Sichern-Dialog, Dateiauswahl).
// Im Browser wird dieselbe Datei als Download angeboten und über ein Dateifeld gelesen.
function sicherungsKnoepfe(){
  const k = el(`<div style="margin-top:16px;display:flex;gap:9px;flex-wrap:wrap;align-items:center">
    <button class="btn ghost small" id="sichAus">Sicherung speichern</button>
    <button class="btn ghost small" id="sichEin">Sicherung einlesen</button>
    <span class="hint" id="sichHinweis"></span>
  </div>`);
  const sagen = t => k.querySelector("#sichHinweis").textContent = t;

  k.querySelector("#sichAus").onclick = async () => {
    if (inApp){ await appRuf("sicherungSpeichern", {}); return; }
    const paket = {art:"filialplaner-sicherung", erstellt:new Date().toISOString(), filialen:{}};
    lokaleFilialen().forEach(f => {
      const roh = localStorage.getItem(LS + key(f.nr));
      if (roh){ try { paket.filialen[key(f.nr)] = JSON.parse(roh); } catch(e){} }
    });
    const name = "Filialplaner-Sicherung-" + new Date().toISOString().slice(0,10) + ".json";
    anbieten(new Blob([JSON.stringify(paket, null, 2)], {type:"application/json"}), name);
    sagen(Object.keys(paket.filialen).length + " Filialen gespeichert.");
  };

  k.querySelector("#sichEin").onclick = async () => {
    if (inApp){
      const zahl = await appRuf("sicherungEinlesen", {});
      if (zahl > 0){ sagen(zahl + " Filialen eingelesen."); k.closest("#liste").innerHTML = ""; render(); }
      else if (zahl === 0) sagen("Nichts übernommen — die Sicherung war nicht neuer.");
      return;
    }
    const feld = el(`<input type="file" accept="application/json,.json" hidden>`);
    document.body.appendChild(feld);
    feld.onchange = async () => {
      const datei = feld.files && feld.files[0];
      feld.remove();
      if (!datei) return;
      try {
        const paket = JSON.parse(await datei.text());
        if (paket.art !== "filialplaner-sicherung") return sagen("Das ist keine Filialplaner-Sicherung.");
        let n = 0;
        for (const [id, inhalt] of Object.entries(paket.filialen || {})){
          const da = localStorage.getItem(LS + id);
          const neuer = !da || (inhalt.geaendert || "") > (JSON.parse(da).geaendert || "");
          if (!neuer) continue;
          localStorage.setItem(LS + id, JSON.stringify(inhalt));
          merkeZugang(inhalt.nr || id.slice(1), inhalt.ort || "", inhalt.pw || "");
          n++;
        }
        sagen(n ? n + " Filialen eingelesen." : "Nichts übernommen — die Sicherung war nicht neuer.");
        if (n) render();
      } catch(e){ sagen("Die Datei ließ sich nicht lesen."); }
    };
    feld.click();
  };
  return k;
}

/* --------- 5 Standardwoche --------- */
function pauseGesetz(anwesend, minder){
  if (minder) return anwesend > 6.5 ? 1 : anwesend > 5 ? 0.5 : 0;
  return anwesend > 9.5 ? 0.75 : anwesend > 6 ? 0.5 : 0;
}
// Wunschpause je Mitarbeiter, nie unter der gesetzlichen
function pauseFuer(m, anwesend){
  const minder = (alter(m.geb) !== null && alter(m.geb) < 18);
  const g = pauseGesetz(anwesend, minder);
  const w = hat(m.pauseMin) ? nz(m.pauseMin)/60 : 0;
  if (!w) return g;
  if (anwesend - w < 0.5) return g;            // Wunsch würde die Schicht auffressen
  return Math.max(g, w);
}
function schicht(m, tag){
  const s = (m.standard || {})[tag];
  if (!s || !hatZeit(s.von) || !hatZeit(s.bis)) return null;
  const von = minuten(s.von), bis = minuten(s.bis);
  if (bis <= von) return null;
  const anwesend = (bis - von) / 60;
  const minder = (alter(m.geb) !== null && alter(m.geb) < 18);
  const p = pauseFuer(m, anwesend);
  return {von, bis, anwesend, pause:p, arbeit: anwesend - p, minder};
}
function wochenStunden(m){
  return TAGE.reduce((s,[k]) => { const x = schicht(m,k); return s + (x ? x.arbeit : 0); }, 0);
}
function pruefeStandard(m){
  const out = [];
  const minder = (alter(m.geb) !== null && alter(m.geb) < 18);
  const tage = TAGE.map(([k,l]) => ({k, l, s: schicht(m,k)}));
  const belegt = tage.filter(x => x.s);
  if (!belegt.length) return out;

  belegt.forEach(x => {
    const max = minder ? 8 : 10;
    if (x.s.arbeit > 8 + 0.001)
      out.push({art: x.s.arbeit > max ? "bad" : "warn",
        text:`${x.l}: ${h1(x.s.arbeit)} h Arbeitszeit` + (minder
          ? " — über 18 sind 8 h die Grenze, darunter ebenfalls 8 h ohne Ausnahme."
          : " — über 8 h nur mit Ausgleich im Schnitt über 24 Wochen.")});
    if (minder && x.s.bis > 20*60)
      out.push({art:"bad", text:`${x.l}: Ende um ${String(Math.floor(x.s.bis/60)).padStart(2,"0")}:${String(x.s.bis%60).padStart(2,"0")} Uhr — unter 18 ist um 20:00 Uhr Schluss.`});
  });

  // Ruhezeit zwischen aufeinanderfolgenden Tagen
  const noetig = minder ? 12 : 11;
  for (let i = 0; i < TAGE.length - 1; i++){
    const a = schicht(m, TAGE[i][0]), b = schicht(m, TAGE[i+1][0]);
    if (!a || !b) continue;
    const ruhe = (24*60 - a.bis + b.von) / 60;
    if (ruhe < noetig - 0.001)
      out.push({art:"bad", text:`${TAGE[i][1]} auf ${TAGE[i+1][1]}: nur ${h1(ruhe)} h Ruhezeit — vorgeschrieben sind ${noetig} h.`});
  }
  if (minder && belegt.length > 5)
    out.push({art:"bad", text:`${belegt.length} Arbeitstage — unter 18 sind höchstens 5 erlaubt.`});
  return out;
}

  const p = el(`<div class="panel">

    <p class="hint" style="margin-top:12px">Leer heißt: wird jede Woche neu eingeteilt.</p>

  const box = p.querySelector("#wochen");
  if (!state.mitarbeiter.length){
    box.appendChild(el(`<p class="empty">Noch niemand erfasst — bitte erst Schritt 4 ausfüllen.</p>`));
    p.appendChild(navLeiste(3));
    return p;
  }

  const sortiert = [...state.mitarbeiter.keys()].sort((x,y) => {
    const r = q => q.typ === "Filialleitung" ? 0 : q.typ === "Stellvertretung" ? 1 : 2;
    return r(state.mitarbeiter[x]) - r(state.mitarbeiter[y]);
  });

  sortiert.forEach((idx, pos) => {
    const m = state.mitarbeiter[idx];
    m.standard = m.standard || {};
    const leitung = m.typ === "Filialleitung";
    const d = el(`<details class="task" ${pos === 0 || leitung ? "open" : ""} style="padding:0">
      <summary style="padding:14px 16px;cursor:pointer;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <b>${esc(m.name)}</b>
        <span class="tag${leitung ? " azubi" : ""}">${esc(m.typ)}</span>
        <span class="hint" style="margin-left:auto" data-sum></span>
      </summary>
      <div style="padding:0 16px 16px"><div class="tablewrap"><table><thead><tr>
        <th>Tag</th><th class="n">von</th><th class="n">bis</th><th class="n">Pause</th><th class="n">Arbeitszeit</th>
      </tr></thead><tbody></tbody></table></div><div data-checks style="margin-top:12px"></div></div>
    </details>`);
    const tb = d.querySelector("tbody");
    const sum = d.querySelector("[data-sum]");
    const checks = d.querySelector("[data-checks]");

    const frisch = () => {
      TAGE.forEach(([k], i) => {
        const x = schicht(m, k);
        const row = tb.children[i];
        row.children[3].textContent = x ? (x.pause ? h1(x.pause*60).replace(",0","") + " min" : "–") : "–";
        row.children[4].textContent = x ? h1(x.arbeit) : "–";
      });
      const w = wochenStunden(m);
      const soll = istAzubi(m) ? m.betrieb : m.vertrag;
      sum.textContent = w ? h1(w) + " h" + (hat(soll) ? " von " + h1(nz(soll)) + " h" : "") : "keine feste Woche";
      checks.innerHTML = "";
      const meld = pruefeStandard(m);
      meld.forEach(x => checks.appendChild(el(`<div class="note ${x.art}"><span class="ic">§</span><span>${esc(x.text)}</span></div>`)));
      if (w && hat(soll) && Math.abs(w - nz(soll)) > 0.5)
        checks.appendChild(el(`<div class="note warn"><span class="ic">!</span><span>Die Standardwoche ergibt ${h1(w)} h, der Vertrag nennt ${h1(nz(soll))} h.</span></div>`));
      if (w && !meld.length) checks.appendChild(el(`<div class="note ok"><span class="ic">✓</span><span>Diese Woche verstößt gegen keine Regel.</span></div>`));
      sichern();
    };

    TAGE.forEach(([k,l]) => {
      const s = m.standard[k] || {von:"", bis:""};
      m.standard[k] = s;
      const tr = el(`<tr><td>${l}</td>
        <td class="n"><input type="time" value="${s.von}" style="max-width:120px"></td>
        <td class="n"><input type="time" value="${s.bis}" style="max-width:120px"></td>
        <td class="n">–</td><td class="n">–</td></tr>`);
      const [vI, bI] = tr.querySelectorAll("input");
      vI.oninput = () => { s.von = vI.value; frisch(); };
      bI.oninput = () => { s.bis = bI.value; frisch(); };
      tb.appendChild(tr);
    });
    frisch();
    box.appendChild(d);
  });

  p.appendChild(navLeiste(3));
  return p;
}

/* --------- 6 Stundenliste --------- */
function stundenliste(){
  const p = el(`<div class="panel">
    <div class="head"><span class="eyebrow">${stufe(5)}</span>
      <h1 style="margin-top:6px">Stundenliste <span class="hint" style="font-size:.9rem;font-weight:600">optional</span></h1>
      <p class="lede">Die Plan-Werte des Bereichsleiters — Richtwerte, keine harte Grenze. Ohne
      diese Angaben lässt sich der Plan genauso erstellen; dann fehlt nur der Vergleich.</p></div>
    <div class="tablewrap"><table><thead><tr><th>Plan</th>${
      TAGE.map(([,l]) => `<th class="n">${l}</th>`).join("")}<th class="n">Woche</th></tr></thead>
      <tbody>
        <tr><td>Stunden</td>${TAGE.map(([k]) =>
          `<td><input type="number" min="0" step="0.5" data-f="stunden" data-t="${k}" value="${state.budget.stunden[k] ?? ""}"></td>`).join("")}
          <td class="n" id="sumH">–</td></tr>

          <td class="n" id="sumU">–</td></tr>
        <tr><td>Leistung €/h<span class="hint"> berechnet</span></td>${TAGE.map(([k]) =>

      </tbody></table></div>
    <div class="note info" style="margin-top:16px"><span class="ic">i</span>

  const frisch = () => {
    const a = auswertung();
    p.querySelector("#sumH").textContent = a.budget
      ? h1(a.budget) + (a.budgetTage < TAGE.length ? "*" : "") : "–";

    TAGE.forEach(([k]) => {
      const h = nz(state.budget.stunden[k]), u = nz(state.budget.umsatz[k]);

    });
  };
  p.querySelectorAll("input[data-f]").forEach(i => i.oninput = () => {
    state.budget[i.dataset.f][i.dataset.t] = i.value === "" ? "" : nz(i.value);
    frisch(); sichern();
  });
  frisch();
  p.appendChild(navLeiste(4));
  return p;

/* --------- 7 Prüfen --------- */
function pruefen(){
  const a = auswertung();
  const diff = a.wirksam - a.budget;
  const azubiPlus = a.anwesend - a.wirksam;
  const p = el(`<div class="panel">
    <div class="head"><span class="eyebrow">${stufe(6)}</span>

        <div class="bar"><i class="a" style="width:${a.anwesend ? a.wirksam/a.anwesend*100 : 0}%"></i><i class="b" style="width:${a.anwesend ? azubiPlus/a.anwesend*100 : 0}%"></i></div>
        <div class="sub" style="margin-top:6px">Davon ${h1(a.aufgaben)} h in ${a.aufgabenTage} Warenterminen</div></div>
      <div class="tile"><span class="eyebrow">Mindestbedarf</span>
